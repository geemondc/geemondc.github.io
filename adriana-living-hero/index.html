<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adriana — A Living Photo (experiment)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b0b0d; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:34px 18px 30px; }
  h1 { font-size:clamp(28px, 4.5vw, 44px); font-weight:normal; letter-spacing:.14em;
       text-transform:uppercase; color:#f2ead6; text-align:center; }
  .statement { margin-top:8px; font-style:italic; font-size:clamp(14px, 2vw, 18px);
               color:#b9b09a; text-align:center; }
  .stage { position:relative; width:min(620px, 100%); margin-top:26px;
           aspect-ratio: 928 / 1152; cursor:pointer; background:#000;
           box-shadow: 0 18px 60px rgba(0,0,0,.65); }
  .stage img.plate { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  .stage img.acc { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; pointer-events:none;
               mix-blend-mode:screen; opacity:0; }
  .sunflare { position:absolute; left:6.8%; top:30.2%; width:34%; aspect-ratio:1;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(circle, rgba(255,236,190,.85) 0%, rgba(255,205,120,.38) 34%, rgba(255,190,100,0) 68%);
    mix-blend-mode:screen; }
  .halo { position:absolute; left:50%; top:9%; width:30%; aspect-ratio:1;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(circle, rgba(255,248,220,.55) 0%, rgba(255,240,200,.16) 45%, rgba(255,240,200,0) 70%);
    mix-blend-mode:screen; }
  .controls { margin-top:22px; display:flex; justify-content:center; }
  button { font-family:inherit; cursor:pointer; background:transparent;
           color:#e8e2d4; border:1px solid #8a7f63; letter-spacing:.12em; }
  #ignite { font-size:17px; padding:13px 34px; border-radius:999px;
            text-transform:uppercase; }
  #ignite:hover { background:#1c1a14; }
  .toggle { display:none; border:1px solid #8a7f63; border-radius:999px; overflow:hidden; }
  .toggle button { border:none; font-size:15px; padding:11px 30px;
                   text-transform:uppercase; background:transparent; }
  .toggle button.on { background:#e8e2d4; color:#141310; }
  footer { padding:26px 18px 40px; text-align:center; font-size:14px; color:#8f887a; }
  footer a { color:#b9b09a; }
  #fs { position:fixed; inset:0; background:#000; display:none; z-index:50; }
  #fs .fsstage { position:absolute; inset:0; }
  #fs img.plate { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  #fs img.acc { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; pointer-events:none;
               mix-blend-mode:screen; opacity:0; }
  #fsClose { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:60; display:none; background:rgba(20,19,16,.85); color:#f2ead6;
    border:1px solid #c9a227; border-radius:999px; font-size:16px;
    padding:12px 26px; letter-spacing:.08em; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Adriana</h1>
  <div class="statement">Pura Vida Movimiento — her cover, brought to life (an experiment)</div>

  <div class="stage" id="stage" title="Tap for full screen">
    <img class="plate lyrStill" src="still.jpg" alt="Adriana — the original art, untouched">
    <img class="plate lyrGolden" src="golden.jpg" alt="" style="opacity:0">
    <img class="plate lyrGlow" src="glow.jpg" alt="" style="opacity:0">
    <div class="sunflare"></div>
    <div class="halo"></div>
    <img class="acc lyrAcc" src="acc-sparkle.png" alt="">
  </div>

  <div class="controls">
    <button id="ignite">&#10022; Bring it to life</button>
    <div class="toggle" id="toggle">
      <button id="btnStill">Still</button><button id="btnLiving" class="on">Living</button>
    </div>
  </div>
</main>

<footer>
  A <a href="https://thelivingphotos.com" target="_blank" rel="noopener">living photo</a>
  experiment — she stays exactly herself; only the light moves.
</footer>

<div id="fs">
  <div class="fsstage" id="fsStage">
    <img class="plate lyrStill" src="still.jpg" alt="">
    <img class="plate lyrGolden" src="golden.jpg" alt="" style="opacity:0">
    <img class="plate lyrGlow" src="glow.jpg" alt="" style="opacity:0">
    <div class="sunflare"></div>
    <div class="halo"></div>
    <img class="acc lyrAcc" src="acc-sparkle.png" alt="">
  </div>
</div>
<button id="fsClose">&#10005; Close</button>

<script>
(function(){
  "use strict";
  var T = 24;                  // scene loop, seconds
  var state = 'still';         // 'still' | 'living'
  var ignited = false;
  var frozen = null;           // QA: freeze the clock at this many seconds
  var anchor = 0, anchorNow = 0, rate = 1;
  var SWEEP_END = 10.5;        // scene time where the ignition sweep hands over
  var clock = 0;

  // Twinkle: the sparkle plate is one image of small stars seated on the
  // picture's own bright spots (sea glitter, sun, palm tips, her light),
  // breathing on one slow population clock; the halo carries the crown.
  function makeStack(root){
    return {
      still: root.querySelector('.lyrStill'),
      golden: root.querySelector('.lyrGolden'),
      glow: root.querySelector('.lyrGlow'),
      sun: root.querySelector('.sunflare'),
      halo: root.querySelector('.halo'),
      acc: root.querySelector('.lyrAcc')
    };
  }
  var page = makeStack(document.getElementById('stage'));
  var fsEl = document.getElementById('fs');
  var fs = makeStack(document.getElementById('fsStage'));
  var fsClose = document.getElementById('fsClose');
  var fsOpen = false, priorState = 'still';

  // Golden-hour loop (24s): still hold -> golden -> dusk glow with the halo
  // high -> back through golden -> still. t=24 wraps exactly to t=0.
  function opacities(t){
    t = ((t % T) + T) % T;
    if (t < 3)   return { still:1, golden:0, glow:0, sun:.12, halo:.05 };
    if (t < 7)   { var k=(t-3)/4; return { still:1, golden:k, glow:0, sun:.12+.5*k, halo:.05+.1*k }; }
    if (t < 10)  return { still:1, golden:1, glow:0, sun:.62, halo:.15 };
    if (t < 14)  { var k2=(t-10)/4; return { still:1, golden:1, glow:k2, sun:.62-.3*k2, halo:.15+.75*k2 }; }
    if (t < 17)  return { still:1, golden:1, glow:1, sun:.32, halo:.9 };
    if (t < 20)  { var k3=(t-17)/3; return { still:1, golden:1, glow:1-k3, sun:.32+.3*k3, halo:.9-.75*k3 }; }
    if (t < 23)  { var k4=(t-20)/3; return { still:1, golden:1-k4, glow:0, sun:.62-.5*k4, halo:.15-.1*k4 }; }
    return { still:1, golden:0, glow:0, sun:.12, halo:.05 };
  }
  function apply(st, so, t, living){
    st.still.style.opacity = so.still;
    st.golden.style.opacity = living ? so.golden : 0;
    st.glow.style.opacity = living ? so.glow : 0;
    st.sun.style.opacity = living ? so.sun : 0;
    st.halo.style.opacity = living ? so.halo : 0;
    var tw = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / 3.4);
    tw = tw * tw * (3 - 2 * tw);
    var boost = 0.45 + 0.55 * so.halo;      // twinkles crown her at the dusk peak
    st.acc.style.opacity = living ? (0.35 + 0.65 * tw) * boost : 0;
  }
  function frame(now){
    if (ignited && frozen === null){
      var tNow = anchor + rate * (now - anchorNow) / 1000;
      if (rate === 7 && tNow >= SWEEP_END){ anchor = tNow; anchorNow = now; rate = 1; }
      clock = tNow;
    }
    var t = frozen !== null ? frozen : clock;
    var so = opacities(t);
    var living = state === 'living';
    apply(page, so, t, living);
    if (fsOpen) apply(fs, so, t, true);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){ ignited = true; anchor = 0; anchorNow = performance.now(); rate = 7; clock = 0; }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', function(e){ e.stopPropagation(); ignite(); });
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  function openFs(){
    priorState = state;
    if (!ignited) ignite();
    fsOpen = true; fsEl.style.display = 'block'; fsClose.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsEl.style.display = 'none'; fsClose.style.display = 'none';
    if (priorState === 'still') setStill(); else setLiving();
  }
  document.getElementById('stage').addEventListener('click', openFs);
  document.getElementById('fsStage').addEventListener('click', function(){ /* living fs: taps reach the piece */ });
  fsClose.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && e.key === 'Escape') closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ if (frozen !== null){ frozen = null; anchor = clock; anchorNow = performance.now(); } },
    state: function(){ return { state: state, fsOpen: fsOpen, clock: clock }; },
    opacities: opacities
  };
})();
</script>
</body>
</html>
