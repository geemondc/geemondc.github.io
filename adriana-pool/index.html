<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adriana — A Living Photo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b0b0d; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:34px 18px 30px; }
  h1 { font-size:clamp(28px, 4.5vw, 44px); font-weight:normal; letter-spacing:.14em;
       text-transform:uppercase; color:#f2ead6; text-align:center; }
  .statement { margin-top:8px; font-style:italic; font-size:clamp(14px, 2vw, 18px);
               color:#b9b09a; text-align:center; }
  .stage { position:relative; width:min(1120px, 100%); margin-top:26px;
           aspect-ratio: 1608 / 708; cursor:pointer; background:#000;
           box-shadow: 0 18px 60px rgba(0,0,0,.65); }
  .stage img { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  .controls { margin-top:22px; display:flex; justify-content:center; }
  button { font-family:inherit; cursor:pointer; background:transparent;
           color:#e8e2d4; border:1px solid #8a7f63; letter-spacing:.12em; }
  #ignite { font-size:17px; padding:13px 34px; border-radius:999px;
            text-transform:uppercase; }
  #ignite:hover { background:#1c1a14; }
  .toggle { display:none; border:1px solid #8a7f63; border-radius:999px; overflow:hidden; }
  .toggle button { border:none; font-size:15px; padding:11px 30px;
                   text-transform:uppercase; background:transparent; }
  .toggle button.on { background:#e8e2d4; color:#141310; }
  footer { padding:26px 18px 40px; text-align:center; font-size:14px; color:#8f887a; }
  footer a { color:#b9b09a; }
  #fs { position:fixed; inset:0; background:#000; display:none; z-index:50; cursor:pointer; overflow:hidden; }
  #fsBg { position:absolute; inset:-48px; filter:blur(30px) brightness(.55) saturate(1.2); }
  #fsBg img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #fs > img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
</style>
</head>
<body>
<main>
  <h1>Adriana</h1>
  <div class="statement">By the pool — Costa Rica</div>

  <div class="stage" id="stage" title="Tap for full screen">
    <img id="lyrDay" src="still.jpg" alt="The original photo, untouched">
    <img id="lyrGolden" src="golden.jpg" alt="" style="opacity:0">
    <img id="lyrGlow" src="glow.jpg" alt="" style="opacity:0">
    <img id="lyrSparkleA" src="acc-sparkle-a.png" alt="" style="opacity:0">
    <img id="lyrSparkleB" src="acc-sparkle-b.png" alt="" style="opacity:0">
    <img id="lyrSparkleC" src="acc-sparkle-c.png" alt="" style="opacity:0">
    <img id="lyrFlowers" src="acc-flowers.png" alt="" style="opacity:0">
    <img id="lyrLamps" src="acc-lamps.png" alt="" style="opacity:0">
    <img id="lyrStrA" src="acc-string-a.png" alt="" style="opacity:0">
    <img id="lyrStrB" src="acc-string-b.png" alt="" style="opacity:0">
    <img id="lyrStrC" src="acc-string-c.png" alt="" style="opacity:0">
    <img id="lyrHeld" src="held.png" alt="" style="opacity:0">
    <img id="lyrSuit" src="acc-suit.png" alt="" style="opacity:0">
    <img id="lyrHair" src="acc-hair.png" alt="" style="opacity:0">
  </div>

  <div class="controls">
    <button id="ignite">&#10022; Bring it to life</button>
    <div class="toggle" id="toggle">
      <button id="btnStill">Still</button><button id="btnLiving" class="on">Living</button>
    </div>
  </div>
</main>

<footer>
  A <a href="https://thelivingphotos.com" target="_blank" rel="noopener">Living Photo</a>
  — thelivingphotos.com
</footer>

<div id="fs">
    <div id="fsBg">
    <img id="fsBgDay" src="still.jpg" alt="">
    <img id="fsBgGolden" src="golden.jpg" alt="" style="opacity:0">
    <img id="fsBgGlow" src="glow.jpg" alt="" style="opacity:0">
    <img id="fsBgHeld" src="held.png" alt="" style="opacity:0">
    </div>
    <img id="fsDay" src="still.jpg" alt="The original photo, untouched">
    <img id="fsGolden" src="golden.jpg" alt="" style="opacity:0">
    <img id="fsGlow" src="glow.jpg" alt="" style="opacity:0">
    <img id="fsSparkleA" src="acc-sparkle-a.png" alt="" style="opacity:0">
    <img id="fsSparkleB" src="acc-sparkle-b.png" alt="" style="opacity:0">
    <img id="fsSparkleC" src="acc-sparkle-c.png" alt="" style="opacity:0">
    <img id="fsFlowers" src="acc-flowers.png" alt="" style="opacity:0">
    <img id="fsLamps" src="acc-lamps.png" alt="" style="opacity:0">
    <img id="fsStrA" src="acc-string-a.png" alt="" style="opacity:0">
    <img id="fsStrB" src="acc-string-b.png" alt="" style="opacity:0">
    <img id="fsStrC" src="acc-string-c.png" alt="" style="opacity:0">
    <img id="fsHeld" src="held.png" alt="" style="opacity:0">
    <img id="fsSuit" src="acc-suit.png" alt="" style="opacity:0">
    <img id="fsHair" src="acc-hair.png" alt="" style="opacity:0">
</div>

<script>
(function(){
  "use strict";
  var T = 20;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var frozen = null;          // QA: freeze the clock at this many seconds
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  var anchor = 0;             // scene seconds at anchorNow (phase anchor)
  var anchorNow = 0;          // performance.now() at the anchor
  var rate = 1;               // scene seconds per wall second (7 during the ignition sweep)
  var SWEEP_END = 8.75;      // scene time where the sweep hands over
  var clock = 0;              // current scene clock, seconds (QA state)

  function stack(p){
    return { day: document.getElementById(p+'Day'),
             golden: document.getElementById(p+'Golden'),
             glow: document.getElementById(p+'Glow'),
             sparkleA: document.getElementById(p+'SparkleA'),
             sparkleB: document.getElementById(p+'SparkleB'),
             sparkleC: document.getElementById(p+'SparkleC'),
             flowers: document.getElementById(p+'Flowers'),
             lamps: document.getElementById(p+'Lamps'),
             stra: document.getElementById(p+'StrA'),
             strb: document.getElementById(p+'StrB'),
             strc: document.getElementById(p+'StrC'),
             held: document.getElementById(p+'Held'),
             suit: document.getElementById(p+'Suit'),
             hair: document.getElementById(p+'Hair') };
  }
  var page = stack('lyr'), fs = stack('fs');
  // Full-screen surround: the photo shows WHOLE (contain); behind it, a
  // blurred, darkened copy of the same scene plates fills the frame.
  var fsBg = { day: document.getElementById('fsBgDay'),
               golden: document.getElementById('fsBgGolden'),
               glow: document.getElementById('fsBgGlow'),
               held: document.getElementById('fsBgHeld') };
  function applyBg(so){
    fsBg.day.style.opacity = so.day;
    fsBg.golden.style.opacity = so.golden;
    fsBg.glow.style.opacity = so.glow;
    fsBg.held.style.opacity = 1;      // full screen always shows the living composite
  }
  var fsEl = document.getElementById('fs');
  var fsOpen = false, priorState = 'still';

  // The journey (20s): afternoon hold -> golden melt -> golden hold ->
  // blue-hour melt -> glow hold -> back through golden -> afternoon.
  // t=20 wraps exactly to t=0: seamless. The return travels back through
  // golden, never jumps.
  function opacities(t){
    t = ((t % T) + T) % T;
    if (t < 2)  return { day:1, golden:0, glow:0 };
    if (t < 5.3333) return { day:1, golden:(t-2)/3.3333, glow:0 };
    if (t < 8) return { day:1, golden:1, glow:0 };
    if (t < 11.3333) return { day:1, golden:1, glow:(t-8)/3.3333 };
    if (t < 14.6667) return { day:1, golden:1, glow:1 };
    if (t < 17.3333) return { day:1, golden:1, glow:1-(t-14.6667)/2.6667 };
    return { day:1, golden:1-(t-17.3333)/2.6667, glow:0 };
  }
  // Accents, each in its own colour on its own slow rhythm, riding a
  // scene envelope: the string lights wake as golden arrives and bloom
  // at blue hour; her hair catches the golden hour hardest. The pool
  // sparkle is star-like (Gary, Nov 2): three fleck groups on offset
  // rhythms so the water shimmers, gated by glow^2 - point size never
  // changes, only brightness, and full presence waits for deep night.
  // [key, period, phase, max, envelope, pulse floor]
  var ACC = [ ['sparkleA',  3, 0, 0.95, 'night', 0.30],
              ['sparkleB', 4.3333, 1.4, 0.95, 'night', 0.30],
              ['sparkleC', 5.6667, 2.9667, 0.95, 'night', 0.30],
              ['flowers', 4, 1.0333, 0.95, 'dusk', 0.80],
              ['lamps',    3, 0.7333, 0.95, 'lamps', 0.55],
              ['stra',    3.6667, 0, 1.00, 'strings', 0.35],
              ['strb',    4.3333, 1.4667, 1.00, 'strings', 0.35],
              ['strc',    3.3333, 2.0333, 1.00, 'strings', 0.35],
              ['suit',    4.3333, 1, 1.00, 'suit', 0.25],
              ['hair',    3.6667, 0, 1.00, 'hair', 0.25] ];
  function accOpacities(t){
    var so = opacities(t);
    var goldOnly = so.golden - so.glow;
    var dusk = so.glow + 0.5 * goldOnly;
    var env = { night: so.glow * so.glow,
                sun: 1 - 0.30 * so.glow,
                dusk: 0.5 + 0.5 * dusk,
                lamps: 0.15 + 0.85 * dusk,
                strings: 0.10 + 0.90 * dusk,
                suit: 0.65 + 0.35 * dusk,
                hair: 0.45 + 0.55 * goldOnly + 0.30 * so.glow };
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);                    // smoothstep ease
      o[a[0]] = a[3] * env[a[4]] * (a[5] + (1 - a[5]) * p);
    }
    if (forcedAcc !== null){ for (var k in o) o[k] = forcedAcc; }
    return o;
  }
  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.golden.style.opacity = so.golden;
    st.glow.style.opacity = so.glow;
    st.held.style.opacity = living ? 1 : 0;
    st.sparkleA.style.opacity = living ? ao.sparkleA : 0;
    st.sparkleB.style.opacity = living ? ao.sparkleB : 0;
    st.sparkleC.style.opacity = living ? ao.sparkleC : 0;
    st.flowers.style.opacity = living ? ao.flowers : 0;
    st.lamps.style.opacity = living ? ao.lamps : 0;
    st.stra.style.opacity = living ? ao.stra : 0;
    st.strb.style.opacity = living ? ao.strb : 0;
    st.strc.style.opacity = living ? ao.strc : 0;
    st.suit.style.opacity = living ? ao.suit : 0;
    st.hair.style.opacity = living ? ao.hair : 0;
  }
  function frame(now){
    // Scene time is a pure function of wall time (performance.now): the
    // phase is anchor + rate * elapsed, re-anchored only at ignite /
    // freeze boundaries, so frame rate can never stretch the 20s cycle.
    if (ignited && frozen === null){
      var tNow = anchor + rate * (now - anchorNow) / 1000;
      if (rate === 7 && tNow >= SWEEP_END){ anchor = tNow; anchorNow = now; rate = 1; }
      clock = tNow;
    }
    var t = frozen !== null ? frozen : clock;
    var so = opacities(t), ao = accOpacities(t);
    var living = state === 'living';
    if (!living) so = { day:1, golden:0, glow:0 };
    apply(page, so, ao, living);
    if (fsOpen){ apply(fs, so, ao, true); applyBg(so); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){ ignited = true; anchor = 0; anchorNow = performance.now(); rate = 7; clock = 0; }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  function openFs(){
    priorState = state;
    if (!ignited) ignite();           // full screen is the living state
    fsOpen = true; fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsEl.style.display = 'none';
    if (priorState === 'still') setStill(); else setLiving();  // exactly the prior state
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape' || e.key)) closeFs();
  });

  // Wall mode: embedded in the Living Photos wall (#wall), open directly
  // on the full-screen living view and stay there — the wall owns taps
  // and keys, so the usual tap/key exits are disarmed in this mode only.
  if (/(^|[#&])wall([&#]|$)/.test(location.hash || '')){
    openFs();
    document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden';
    document.addEventListener('keydown', function(e){ e.stopImmediatePropagation(); }, true);
    fsEl.addEventListener('click', function(e){ e.stopImmediatePropagation(); }, true);
  }

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ if (frozen !== null){ frozen = null; anchor = clock; anchorNow = performance.now(); } },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : clock); },
    state: function(){ return { state: state, fsOpen: fsOpen, clock: clock }; },
    opacities: opacities
  };
})();
</script>
</body>
</html>
