<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Friends Christmas — Advent Day 1, a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#04170d; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.5); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#04170d;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:advDrift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes advDrift { from { transform:scale(1.02) translate(0.4%,0.2%); } to { transform:scale(1.10) translate(-1.1%,-0.6%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #glow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:advBreathe 7s ease-in-out infinite alternate;
         background:radial-gradient(52% 62% at 50% 42%, rgba(255,214,130,.34), rgba(255,180,90,.10) 55%, rgba(255,170,80,0) 78%); }
  @keyframes advBreathe { from { opacity:.30 } to { opacity:.95 } }
  /* TAP-TO-LIGHT (Nov 24): the tree arrives DIM and lights on the tap, the
     Tree Lighting standard moved into this scene. Everything below rides
     INSIDE #drift so the accents move with the picture (the birthday-flame
     lesson). The dim is a tree-shaped veil over the foliage (grounded:
     tree bbox x 31-64%, y 0-76%; star at 45%, 4.4%; foliage heart 47%, 38%)
     — it fades away as the bulbs come on, so the settled painting is exactly
     itself again. */
  #advTlDim { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 3.6s ease; will-change:opacity;
         background:radial-gradient(58% 56% at 47% 40%, rgba(2,10,5,.78), rgba(2,10,5,.62) 58%, rgba(2,10,5,.40) 82%, rgba(2,10,5,.18) 100%);
         clip-path:polygon(47% 1%, 42% 14%, 37% 29%, 34% 45%, 33% 59%, 35% 76%, 62% 76%, 64% 58%, 64% 43%, 60% 28%, 55% 14%, 50% 2%); filter:blur(9px); }
  body.advTlDark #advTlDim { opacity:1; }
  body.advTlDark #advTlDim.instant { transition:none; }
  #advTlStarDim { position:absolute; left:45%; top:4.4%; width:13%; aspect-ratio:1.15; transform:translate(-50%,-50%); pointer-events:none; opacity:0;
         background:radial-gradient(closest-side, rgba(2,10,5,.72), rgba(2,10,5,.35) 62%, rgba(2,10,5,0) 82%); filter:blur(5px); transition:opacity 3.2s ease; }
  body.advTlDark #advTlStarDim { opacity:1; }
  #advTlWarm { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; opacity:0;
         background:radial-gradient(46% 52% at 47% 36%, rgba(255,205,110,.5), rgba(255,180,90,.16) 55%, rgba(255,170,80,0) 78%); }
  body.advTlLit #advTlWarm { animation:advTlWarmBreath 7s ease-in-out infinite alternate; }
  @keyframes advTlWarmBreath { from { opacity:.34 } to { opacity:.62 } }
  .advTlb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%); opacity:0;
        animation:advTlTwk ease-in-out infinite alternate, advTlBloomIn 1s ease forwards; }
  @keyframes advTlTwk { from { transform:translate(-50%,-50%) scale(.55); filter:brightness(.65) } to { transform:translate(-50%,-50%) scale(1.5); filter:brightness(1.4) } }
  @keyframes advTlBloomIn { from { opacity:0 } to { opacity:1 } }
  #advTlStar { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%); opacity:0;
        background:radial-gradient(closest-side, rgba(255,230,150,.95), rgba(255,196,80,.4) 55%, rgba(255,180,80,0) 78%);
        animation:advTlStarBloom 4.4s ease forwards, advTlStarPulse 3.4s ease-in-out 4.4s infinite alternate; }
  @keyframes advTlStarBloom { 0% { opacity:0; transform:translate(-50%,-50%) scale(.55) } 74% { opacity:0; transform:translate(-50%,-50%) scale(.55) } 88% { opacity:1; transform:translate(-50%,-50%) scale(1.28) } 100% { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } }
  @keyframes advTlStarPulse { from { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } to { opacity:1; transform:translate(-50%,-50%) scale(1.24) } }
  #advTlPill { position:absolute; left:50%; bottom:8%; transform:translateX(-50%); z-index:8; display:none; white-space:nowrap; cursor:pointer;
        background:rgba(4,23,13,.78); color:#ffe9a8; font-family:Georgia, 'Times New Roman', serif;
        font-size:clamp(13px, 3.4vw, 17px); letter-spacing:2.5px; padding:9px 20px; border-radius:999px;
        border:1px solid rgba(255,215,130,.55); box-shadow:0 6px 22px rgba(0,0,0,.35);
        animation:advTlPillPulse 1.5s ease-in-out infinite alternate; }
  body.advTlDark #advTlPill { display:block; }
  body:not(.wall) #advTlPill { bottom:15%; } /* standalone: clear the caption pill below */
  @keyframes advTlPillPulse { from { opacity:.72; transform:translateX(-50%) scale(1); } to { opacity:1; transform:translateX(-50%) scale(1.045); } }
  #snow { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .flake { position:absolute; top:-4%; border-radius:50%; pointer-events:none;
           background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(235,245,255,.5) 60%, rgba(235,245,255,0) 80%);
           animation:advFall linear infinite; will-change:transform; }
  @keyframes advFall { 0% { transform:translate(0,-3vh); opacity:0 } 8% { opacity:.85 } 50% { transform:translate(1.1vw,52vh) } 92% { opacity:.85 } 100% { transform:translate(-0.6vw,104vh); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(4,23,13,.62); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; text-transform:uppercase; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #glow, .flake, .advTlb, #advTlStar, #advTlPill { animation:none; } .advTlb, #advTlStar { opacity:1; } #advTlDim, #advTlStarDim { display:none; } #advTlPill { display:none !important; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends exchanging gifts by the fireplace on Christmas Eve, the tree glowing, the cat asleep among the presents">
      <div id="advTlDim"></div>
      <div id="advTlStarDim"></div>
      <div id="advTlWarm"></div>
      <div id="advTlBox"></div>
    </div>
    <div id="glow"></div>
    <div id="snow"></div>
    <button id="advTlPill" type="button" aria-label="Tap the tree to light it">Tap the tree</button>
    <div id="caption">FRIENDS CHRISTMAS</div>
  </div>
</div>
<script>
  // Advent Day 1 — Friends Christmas: the painting stays exactly itself; a warm light
  // breathes slowly across it and gentle snow falls, the house living manner.
  // TAP-TO-LIGHT (Nov 24, Gary: "where is the christmas tree animation after seal
  // opens?"): the card now lands with the tree DIM and a gold "Tap the tree" pill;
  // the tap lights the bulbs one by one, spiraling up tier by tier, the star glow
  // crowns it last, the dim veil lifts, and the scene settles into the living
  // treatment above. The engine posts no bloom gate for advent01, so the scene
  // drives itself: it still answers 'lc-bloom' / 'lc-dark' if a parent ever
  // sends them, announces 'lc-scene-ready', and — so the painting never sits
  // dim forever for a passive viewer — auto-lights after a wait (9s standalone,
  // 20s embedded, 120s if a parent armed the gate). As in treelighting's
  // tapfix3, plain JS timers guarantee each bulb's lit state with inline
  // opacity !important, so the full lit tree arrives even where an iframe's
  // animation timelines freeze or never paint.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var embedded = document.body.classList.contains('wall');
    var snow = document.getElementById('snow'), shtml = '';
    for (var f = 0; f < 30; f++){
      var lx = (2 + (f * 37) % 94), sz = (2.2 + (f % 4) * 1.1).toFixed(1), dur = (6.5 + (f % 6) * 1.1).toFixed(1), del = (f * 0.83).toFixed(2);
      shtml += '<div class="flake" style="left:' + lx + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
    }
    snow.innerHTML = shtml;

    /* --- tap-to-light, on the grounded tree (star 45%,4.4%; foliage x 33-64%,
       y 8-76%, partly behind the front row below y~52 — the tiers sit on the
       foliage that actually shows) --- */
    var box = document.getElementById('advTlBox');
    var dim = document.getElementById('advTlDim');
    var pill = document.getElementById('advTlPill');
    var palette = ['255,214,130', '255,196,96', '255,230,170', '255,170,80', '255,209,102'];
    // tiers bottom -> top; serpentine order within a tier reads as a spiral
    var tiers = [
      [[42,50],[44,46],[58,50],[59,53]],
      [[60,41],[57,36],[42,39],[40,42]],
      [[39,34],[44,36],[49,33],[54,35],[58,34]],
      [[53,21],[49,25],[46,24],[42,26]],
      [[44,18],[48,16],[52,18]],
      [[45,11],[49,10]]
    ];
    var STEP = 0.15, BLOOM = 1.0;
    var bulbHtml = '', bulbMeta = [], n = 0;
    for (var t = 0; t < tiers.length; t++){
      for (var i = 0; i < tiers[t].length; i++){
        var p = tiers[t][i], c = palette[n % palette.length];
        var delay = (n * STEP).toFixed(2);
        bulbHtml += '<div class="advTlb" style="left:' + p[0] + '%;top:' + p[1] + '%;width:' + (1.0 + (n % 3) * 0.22).toFixed(2) + '%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(' + c + ',.98), rgba(' + c + ',.34) 55%, rgba(' + c + ',0) 78%);animation-duration:' + (1.5 + (n % 5) * 0.35).toFixed(2) + 's,' + BLOOM + 's;animation-delay:-' + (n * 0.37).toFixed(2) + 's,' + delay + 's"></div>';
        bulbMeta.push({ at: Math.round((n * STEP + BLOOM) * 1000) });
        n++;
      }
    }
    bulbHtml += '<div id="advTlStar" style="left:45%;top:4.4%;width:6%;aspect-ratio:1"></div>';
    var STAR_AT = 4400, SWEEP_AT = 5400;

    var lit = false, lighting = false, armed = false, timers = [], fallbackTimer = null;
    function clearTimers(){ for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]); timers = []; }
    function setLit(el, val){ if (el) el.style.setProperty('opacity', val, 'important'); }
    function armFallback(){
      clearTimeout(fallbackTimer);
      var wait = armed ? 120000 : (embedded ? 20000 : 9000);
      fallbackTimer = setTimeout(function(){ goLight(); }, wait);
    }
    function goLight(){
      if (lit || lighting) return;
      lighting = true; clearTimeout(fallbackTimer); clearTimers();
      box.innerHTML = bulbHtml;
      document.body.classList.remove('advTlDark');
      if (window.parent !== window){ try { window.parent.postMessage('lc-bloomed', '*'); } catch(e){} }
      var bulbs = box.querySelectorAll('.advTlb');
      for (var k = 0; k < bulbMeta.length; k++){
        (function(k){ timers.push(setTimeout(function(){ setLit(bulbs[k], '1'); }, bulbMeta[k].at)); })(k);
      }
      timers.push(setTimeout(function(){
        setLit(box.querySelector('#advTlStar'), '.92');
        lit = true; lighting = false; document.body.classList.add('advTlLit');
      }, STAR_AT));
      timers.push(setTimeout(function(){
        var all = box.querySelectorAll('.advTlb');
        for (var k = 0; k < all.length; k++) setLit(all[k], '1');
        setLit(box.querySelector('#advTlStar'), '.92');
        lit = true; lighting = false; document.body.classList.add('advTlLit');
      }, SWEEP_AT));
    }
    function goDark(){
      clearTimers(); clearTimeout(fallbackTimer);
      box.innerHTML = ''; lit = false; lighting = false;
      document.body.classList.remove('advTlLit');
      dim.classList.add('instant');
      document.body.classList.add('advTlDark');
      setTimeout(function(){ dim.classList.remove('instant'); }, 60);
      armFallback();
    }
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced){
      box.innerHTML = bulbHtml;
      var all = box.querySelectorAll('.advTlb');
      for (var k = 0; k < all.length; k++) setLit(all[k], '1');
      setLit(box.querySelector('#advTlStar'), '.92');
      lit = true; document.body.classList.add('advTlLit');
    } else {
      document.body.classList.add('advTlDark');
      armFallback();
      document.getElementById('frame').addEventListener('pointerdown', function(){ goLight(); });
      pill.addEventListener('click', function(){ goLight(); });
      window.addEventListener('message', function(e){
        if (e.data === 'lc-arm'){ armed = true; armFallback(); }
        else if (e.data === 'lc-bloom') goLight();
        else if (e.data === 'lc-dark') goDark();
      });
      if (window.parent !== window){
        try { window.parent.postMessage('lc-scene-ready', '*'); } catch(e){}
        var readyN = 0;
        var readyTimer = setInterval(function(){
          if (armed || lit || ++readyN > 6){ clearInterval(readyTimer); return; }
          try { window.parent.postMessage('lc-scene-ready', '*'); } catch(e){}
        }, 800);
      }
    }
  })();
</script>
</body>
</html>
