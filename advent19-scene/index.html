<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Gingerbread House — Advent Day 19, a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#04170d; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.5); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#04170d;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:advDrift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes advDrift { from { transform:scale(1.02) translate(0.4%,0.2%); } to { transform:scale(1.10) translate(-1.1%,-0.6%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #glow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:advBreathe 7s ease-in-out infinite alternate;
         background:radial-gradient(52% 62% at 50% 42%, rgba(255,214,130,.34), rgba(255,180,90,.10) 55%, rgba(255,170,80,0) 78%); }
  @keyframes advBreathe { from { opacity:.30 } to { opacity:.95 } }
  #snow { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .flake { position:absolute; top:-4%; border-radius:50%; pointer-events:none;
           background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(235,245,255,.5) 60%, rgba(235,245,255,0) 80%);
           animation:advFall linear infinite; will-change:transform; }
  @keyframes advFall { 0% { transform:translate(0,-3vh); opacity:0 } 8% { opacity:.85 } 50% { transform:translate(1.1vw,52vh) } 92% { opacity:.85 } 100% { transform:translate(-0.6vw,104vh); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(4,23,13,.62); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; text-transform:uppercase; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #glow, .flake { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends building a big gingerbread house at a kitchen table, candy everywhere">
    </div>
    <div id="glow"></div>
    <div id="snow"></div>
    <div id="caption">THE GINGERBREAD HOUSE</div>
  </div>
</div>
<script>
  // Advent Day 19 — The Gingerbread House: the painting stays exactly itself; a warm light
  // breathes slowly across it and gentle snow falls, the house living manner.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var snow = document.getElementById('snow'), shtml = '';
    for (var f = 0; f < 30; f++){
      var lx = (2 + (f * 37) % 94), sz = (2.2 + (f % 4) * 1.1).toFixed(1), dur = (6.5 + (f % 6) * 1.1).toFixed(1), del = (f * 0.83).toFixed(2);
      shtml += '<div class="flake" style="left:' + lx + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
    }
    snow.innerHTML = shtml;
  })();
</script>
</body>
</html>
