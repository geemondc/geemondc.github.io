<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Golden Hour Toast — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#2a1608; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#2a1608;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 11s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* the sunset breathes behind the terrace */
  #sun { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite alternate;
         background:radial-gradient(50% 65% at 88% 30%, rgba(255,196,110,.36), rgba(255,170,90,.10) 55%, rgba(255,170,90,0) 78%); }
  @keyframes breathe { from { opacity:.55 } to { opacity:1 } }
  /* the string lights twinkle, each on its own clock */
  .bulb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,226,160,.95), rgba(255,190,100,.30) 55%, rgba(255,190,100,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.82); filter:brightness(.78) } to { transform:translate(-50%,-50%) scale(1.18); filter:brightness(1.3) } }
  /* candle flames on the cake and the votives — small, warm, alive */
  .flame { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
           background:radial-gradient(closest-side, rgba(255,214,140,.9), rgba(255,170,80,.28) 55%, rgba(255,170,80,0) 78%);
           animation:twk ease-in-out infinite alternate; }
  /* rose petals drifting down through the golden light */
  .petal { position:absolute; pointer-events:none; opacity:0;
           background:radial-gradient(closest-side, rgba(214,48,49,.85), rgba(214,48,49,0) 75%);
           border-radius:60% 40% 60% 40%; animation:fall linear infinite; }
  @keyframes fall { 0% { transform:translate(0,-4vh) rotate(0deg); opacity:0 } 12% { opacity:.5 } 88% { opacity:.45 } 100% { transform:translate(-3vw,104vh) rotate(300deg); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(38,20,8,.55); color:#ffe9b8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,233,184,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #sun, .bulb, .flame, .petal { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="The eight friends raising a toast around the anniversary cake at golden hour">
    </div>
    <div id="sun"></div>
    <div id="fx"></div>
    <div id="caption">THE GOLDEN HOUR TOAST</div>
  </div>
</div>
<script>
  // The terrace at golden hour (Gary's living standard): the painting stays
  // exactly itself; the string lights twinkle, the candles breathe, and a few
  // rose petals drift through the light. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    var bulbs = [[4,3],[11,6.5],[19,4],[27,7],[35,3],[43,6],[52,4],[60,7],[68,3],[76,6],[84,4],[91,7],[97,3],[15,1.5],[48,1.2],[80,1.6]];
    for (var i = 0; i < bulbs.length; i++){
      var w = (1.6 + (i % 3) * 0.5).toFixed(1);
      html += '<div class="bulb" style="left:' + bulbs[i][0] + '%;top:' + bulbs[i][1] + '%;width:' + w + '%;aspect-ratio:1;animation-duration:' + (2.2 + (i % 5) * 0.7).toFixed(1) + 's;animation-delay:-' + (i * 0.6).toFixed(1) + 's"></div>';
    }
    var flames = [[56.9,63.5,2.2],[58.7,63,2.2],[68.6,83.5,3.2],[80.2,88.5,3.6],[87.6,84.5,3.2],[74.5,90.5,2.8]];
    for (var j = 0; j < flames.length; j++){
      html += '<div class="flame" style="left:' + flames[j][0] + '%;top:' + flames[j][1] + '%;width:' + flames[j][2] + '%;aspect-ratio:1;animation-duration:' + (1.6 + (j % 4) * 0.5).toFixed(1) + 's;animation-delay:-' + (j * 0.45).toFixed(1) + 's"></div>';
    }
    for (var k = 0; k < 7; k++){
      var px = 8 + k * 13, sz = (0.9 + (k % 3) * 0.35).toFixed(2);
      html += '<div class="petal" style="left:' + px + '%;top:-4%;width:' + sz + '%;aspect-ratio:1.4;animation-duration:' + (13 + (k % 4) * 3.5).toFixed(1) + 's;animation-delay:-' + (k * 2.9).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
