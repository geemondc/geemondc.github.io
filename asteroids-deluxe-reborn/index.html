<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Asteroids Deluxe Reborn — 1981 Arcade Remake</title>
    <style>
      :root {
        --primary: oklch(82% .11 225);
        --primary-fg: oklch(98.4% .003 247.858);
        --cv: #7fd4ff;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: var(--mono);
      }
      button { font-family: inherit; cursor: pointer; }
      #app {
        position: fixed; inset: 0;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }
      #app.intro-mode { touch-action: auto; }
      #game { display: block; }
      .glow { text-shadow: 0 0 8px var(--primary), 0 0 20px var(--primary); }
      /* ---------- intro overlay ---------- */
      #intro {
        position: absolute; inset: 0; z-index: 10;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.9);
        font-family: var(--mono);
        color: var(--primary);
      }
      #intro.hidden { display: none; }
      .intro-inner {
        margin: 0 auto;
        max-width: 768px;
        display: flex; flex-direction: column; align-items: center;
        padding: 32px 16px 40px;
        text-align: center;
      }
      .intro-inner h1 {
        margin: 0;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 1.15;
      }
      .reborn {
        margin: 4px 0 0;
        font-size: 20px;
        letter-spacing: 0.5em;
        text-indent: 0.5em;
      }
      @media (min-width: 640px) {
        .intro-inner h1 { font-size: 60px; }
        .reborn { font-size: 24px; }
      }
      .hero-img {
        margin-top: 24px;
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        border: 1px solid color-mix(in oklab, var(--primary) 40%, transparent);
        box-shadow: 0 0 30px color-mix(in oklab, var(--primary) 35%, transparent);
      }
      .hi-line { margin: 16px 0 0; font-size: 14px; }
      .btnrow {
        margin-top: 20px;
        display: flex; flex-wrap: wrap;
        align-items: center; justify-content: center;
        gap: 12px;
      }
      #startBtn {
        border: 2px solid var(--primary);
        background: color-mix(in oklab, var(--primary) 15%, transparent);
        padding: 12px 32px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.1em;
        border-radius: 6px;
        color: var(--primary);
      }
      #startBtn:hover { background: color-mix(in oklab, var(--primary) 30%, transparent); }
      .sbtn {
        border: 1px solid color-mix(in oklab, var(--primary) 60%, transparent);
        background: transparent;
        border-radius: 4px;
        padding: 6px 12px;
        font-size: 12px;
        color: var(--primary);
      }
      .sbtn:hover { background: color-mix(in oklab, var(--primary) 15%, transparent); }
      .langseg {
        display: flex;
        overflow: hidden;
        border-radius: 4px;
        border: 1px solid color-mix(in oklab, var(--primary) 60%, transparent);
        font-size: 12px;
      }
      .langseg button {
        padding: 6px 12px;
        background: transparent;
        border: none;
        color: var(--primary);
        font-size: 12px;
      }
      .langseg button.active {
        background: var(--primary);
        color: var(--primary-fg);
      }
      .howto {
        margin-top: 32px;
        width: 100%;
        border-radius: 8px;
        border: 1px solid color-mix(in oklab, var(--primary) 30%, transparent);
        background: rgba(0, 0, 0, 0.6);
        padding: 20px;
        text-align: left;
      }
      .howto h2 {
        margin: 0 0 12px;
        text-align: center;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.1em;
      }
      .howto ul.controls { list-style: none; margin: 0; padding: 0; font-size: 14px; }
      .howto ul.controls li + li { margin-top: 4px; }
      .howto ul.controls .k { display: inline-block; min-width: 176px; font-weight: 700; }
      .howto ul.controls .v { color: color-mix(in oklab, var(--primary) 80%, transparent); }
      .howto ul.rules {
        margin: 16px 0 0;
        list-style: disc;
        padding-left: 20px;
        font-size: 14px;
        color: color-mix(in oklab, var(--primary) 90%, transparent);
      }
      .howto ul.rules li + li { margin-top: 6px; }
      .fr-link {
        margin-top: 32px;
        font-size: 10px;
        letter-spacing: 0.3em;
        color: color-mix(in oklab, var(--primary) 50%, transparent);
        text-decoration: none;
      }
      .fr-link:hover { color: var(--primary); }
      /* ---------- in-play chrome ---------- */
      #menuBtn {
        position: absolute; left: 12px; top: 12px; z-index: 20;
        border: 1px solid color-mix(in oklab, var(--primary) 60%, transparent);
        background: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 12px;
        color: var(--primary);
      }
      #menuBtn.hidden { display: none; }
      #sysBtns {
        position: absolute; right: 12px; top: 56px; z-index: 20;
        display: flex; gap: 8px;
      }
      @media (min-width: 640px) { #sysBtns { top: 64px; } }
      #sysBtns.hidden { display: none; }
      #sysBtns button {
        border: 1px solid color-mix(in oklab, var(--primary) 50%, transparent);
        background: transparent;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px;
        color: var(--primary);
      }
      /* ---------- touch controls ---------- */
      #touchbar {
        position: absolute; left: 0; right: 0; z-index: 15;
        bottom: max(0.75rem, env(safe-area-inset-bottom));
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 16px;
        pointer-events: none;
      }
      #touchbar.hidden { display: none; }
      #touchbar .cluster { display: flex; gap: 12px; }
      .cbtn {
        pointer-events: auto;
        width: 64px; height: 64px;
        border-radius: 50%;
        border: 2px solid color-mix(in oklab, var(--primary) 40%, transparent);
        background: color-mix(in oklab, var(--primary) 5%, transparent);
        color: color-mix(in oklab, var(--primary) 80%, transparent);
        font-size: 10px;
        font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .cbtn:active { background: color-mix(in oklab, var(--primary) 30%, transparent); }
      @media (min-width: 640px) { .cbtn { width: 80px; height: 80px; font-size: 12px; } }
      @media (orientation: landscape) { .cbtn { width: 56px; height: 56px; } }
      @media (orientation: landscape) and (min-width: 640px) { .cbtn { width: 64px; height: 64px; } }
      /* ---------- game over overlay ---------- */
      #over {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        padding: 0 16px;
        text-align: center;
        font-family: var(--mono);
        color: var(--primary);
      }
      #over.hidden { display: none; }
      #over h2 {
        margin: 0;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 1.15;
      }
      @media (min-width: 640px) { #over h2 { font-size: 60px; } }
      .over-score { margin: 24px 0 0; font-size: 20px; }
      .over-hi { margin: 4px 0 0; font-size: 14px; color: color-mix(in oklab, var(--primary) 80%, transparent); }
      #againBtn {
        margin-top: 32px;
        border: 2px solid var(--primary);
        background: color-mix(in oklab, var(--primary) 15%, transparent);
        border-radius: 6px;
        padding: 12px 24px;
        font-weight: 700;
        letter-spacing: 0.05em;
        font-size: 16px;
        color: var(--primary);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #againBtn:hover { background: color-mix(in oklab, var(--primary) 30%, transparent); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @media (prefers-reduced-motion: reduce) { #againBtn { animation: none; } }
      /* ---------- QR modal ---------- */
      #qrModal {
        position: fixed; inset: 0; z-index: 50;
        display: none;
        align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        padding: 16px;
      }
      #qrModal.open { display: flex; }
      .qr-card {
        position: relative;
        border-radius: 12px;
        border: 2px solid var(--primary);
        background: #000;
        padding: 24px;
        text-align: center;
        font-family: var(--mono);
        color: var(--primary);
      }
      .qr-x {
        position: absolute; right: 8px; top: 4px;
        font-size: 24px; line-height: 1;
        background: none; border: none;
        color: var(--primary);
        padding: 2px 6px;
      }
      #qrCanvas {
        width: min(75vw, 420px);
        height: auto;
        border-radius: 4px;
        cursor: pointer;
        background: #fff;
        display: block;
      }
      .qr-cap { margin: 12px 0 0; font-size: 14px; letter-spacing: 0.05em; }
    </style>
  </head>

      /* ==================== Canvas / view (full window, Lovable model) ==================== */
      var P = "#7fd4ff";
      var cv = document.getElementById("game");
      var ctx = cv.getContext("2d");
      var W = 0, H = 0, S = 1, GLOW = 10;
      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        var dpr = Math.min(window.devicePixelRatio || 1, Math.min(W, H) < 500 ? 1.5 : 2);
        cv.width = W * dpr; cv.height = H * dpr;
        cv.style.width = W + "px"; cv.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      resize();
      window.addEventListener("resize", resize);

      /* ==================== Helpers ==================== */

      /* ==================== Input ==================== */
      var IN = { left: false, right: false, thrust: false, fire: false, shield: false };
      var KEYMAP = {
        ArrowLeft: "left", ArrowRight: "right", ArrowUp: "thrust",
        Space: "fire", KeyZ: "fire", ArrowDown: "shield",
        ShiftLeft: "shield", ShiftRight: "shield"
      };

      /* ==================== Game state ==================== */
      var mode = "intro"; // intro | play | over
      var paused = false;
      var score = 0, high = 0, lives = 3, wave = 0, nextExtra = 10000;
      var ship = { x: 0, y: 0, vx: 0, vy: 0, a: -Math.PI / 2, r: 12, alive: true, respawn: 0, invuln: 0, shield: 1, shieldOn: false, fireCd: 0, thrusting: false };

      var shake = 0, waveElapsed = 0, clearTimer = 0, heartTimer = 0, heartAlt = false;
      var clusterTimer = 0, saucerTimer = 0, overTime = 0;

      // starfield: created once from the initial viewport, like the Lovable build
      var starCount = Math.max(50, Math.min(160, Math.round((W * H) / 9000)));
      var stars = [];
      for (var si = 0; si < starCount; si++) {
        stars.push({ x: Math.random(), y: Math.random(), z: rnd(0.2, 1), p: rnd(0, 6.28) });
      }

      var ROCK_R = [40, 22, 11];
      var ROCK_PTS = [20, 50, 100];

      var SHIP_SHAPE = [[14, 0], [-10, -9], [-6, -4], [-10, -9], [-12, -12], [-8, 0], [-12, 12], [-10, 9], [-6, 4], [-10, 9]];

      function makeRock(x, y, size, speedFactor) {
        var spd = rnd(30, 60) * (1 + size * 0.5) * speedFactor * S;
        var ang = rnd(0, 6.28);
        var shape = [];
        for (var i = 0; i < 10; i++) shape.push(rnd(0.72, 1.05));
        return {
          x: x, y: y, size: size, r: ROCK_R[size] * S,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          a: rnd(0, 6.28), va: rnd(-1.2, 1.2), shape: shape
        };
      }
      function spawnWave() {
        wave++;
        waveElapsed = 0;
        var count = Math.min(4 + wave * 2, 16);
        var tf = 1 + wave * 0.08;
        for (var i = 0; i < count; i++) {
          var ex, ey, guard = 0;
          do { ex = rnd(0, W); ey = rnd(0, H); guard++; }
          while (Math.hypot(ex - ship.x, ey - ship.y) < 180 * S && guard < 60);
          rocks.push(makeRock(ex, ey, 0, tf));

        saucerTimer = Math.max(6, 18 - wave * 1.5);
      }
      function resetShip() {
        ship.x = W / 2; ship.y = H / 2; ship.vx = 0; ship.vy = 0;

      }
      function burst(x, y, n, spd) {

          parts.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: rnd(0.4, 1), max: 1 });
        }
      }
      function addScore(n) {

        while (score >= nextExtra) { lives++; nextExtra += 10000; AU.jingle(); }
        if (score > high) high = score;
      }
      function killShip() {
        if (!ship.alive) return;
        ship.alive = false;

      }
      function isPlayerSource(src) { return src === "player-bullet" || src === "player-shield"; }
      function killRock(idx, src) {
        var rk = rocks[idx];

        AU.boom(rk.size);
        burst(rk.x, rk.y, 10 + (2 - rk.size) * 6);
        shake = Math.max(shake, [8, 4, 2][rk.size]);
        if (rk.size < 2) {

              kind: kind, x: e.x, y: e.y,
              vx: Math.cos(ang) * 120 * S, vy: Math.sin(ang) * 120 * S,
              r: (kind === "diamond" ? 12 : 8) * S, a: ang, t: 0, fire: 0

        else if (e.kind === "diamond") spawnKids("arrow", 2);

      }
      function newGame() {
        AU.init();
        score = 0; lives = 3; wave = 0; nextExtra = 10000;
        rocks = []; shots = []; enemies = []; parts = [];
        resetShip();
        mode = "play"; paused = false;
        spawnWave();
        syncUI();
      }
      function toMenu() {
        mode = "intro"; paused = false;
        enemies = []; shots = [];
        if (!rocks.length) spawnWave();
        syncUI();
      }
      function engineStart() {

      }
      function setPaused(v) {

      /* ==================== Update (Lovable ie) ==================== */
      function update(dt) {
        var i, j, e;

          e.y -= (ship.vy / H) * dt * e.z * 0.15;

          e.y = ((e.y % 1) + 1) % 1;

        for (i = 0; i < parts.length; i++) {

        parts = parts.filter(function (p) { return p.life > 0; });

        for (i = 0; i < rocks.length; i++) {

        }

        if (mode === "over") { overTime += dt; AU.loops(false, false, 0); return; }

        /* ---- playing ---- */
        waveElapsed += dt;
        if (ship.alive) {
          if (IN.left) ship.a -= 4.5 * dt;
          if (IN.right) ship.a += 4.5 * dt;
          ship.thrusting = IN.thrust;
          if (IN.thrust) {
            ship.vx += Math.cos(ship.a) * 320 * S * dt;
            ship.vy += Math.sin(ship.a) * 320 * S * dt;
            if (Math.random() < 0.5) {
              parts.push({
                x: ship.x - Math.cos(ship.a) * 12 * S,
                y: ship.y - Math.sin(ship.a) * 12 * S,
                vx: -Math.cos(ship.a + rnd(-0.3, 0.3)) * 120 * S,
                vy: -Math.sin(ship.a + rnd(-0.3, 0.3)) * 120 * S,

        } else {

          if (ship.respawn <= 0) {

            for (i = 0; i < rocks.length; i++) {

            }

            }
          }
        }

        // shots move & wrap
        for (i = 0; i < shots.length; i++) {
          e = shots[i];

          wrapPos(e);
        }

          for (i = 0; i < enemies.length; i++) if (enemies[i].kind === "cluster") hasCluster = true;
          if (!hasCluster) {

            var side = Math.random() < 0.5;
            enemies.push({
              kind: "cluster",
              x: side ? 0 : rnd(0, W), y: side ? rnd(0, H) : 0,
              vx: 0, vy: 0, r: 22 * S, a: 0, t: 0, fire: 0

          }
        }
        // saucer spawn timer

        if (saucerTimer <= 0) {

          for (i = 0; i < enemies.length; i++) if (enemies[i].kind.slice(-6) === "Saucer") hasSaucer = true;
          if (!hasSaucer) {

            var small = score >= 10000 && Math.random() < 0.7;
            var fromLeft = Math.random() < 0.5;
            enemies.push({

              x: fromLeft ? 0 : W, y: rnd(H * 0.15, H * 0.85),

            }

      /* ==================== Render (Lovable oe) ==================== */

      }
      function wrapDraw(e, margin, fn) {
        var ox = [-W, 0, W], oy = [-H, 0, H];
        for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) {
          var sx = e.x + ox[i], sy = e.y + oy[j];
          if (sx + margin < 0 || sx - margin > W || sy + margin < 0 || sy - margin > H) continue;
          fn(sx, sy);
        }
      }
      function text(str, x, y, size, align) {
        ctx.font = size + "px \"Courier New\", monospace";
        ctx.textAlign = align || "left";
        ctx.fillText(str, x, y);
      }
      function render() {
        var i, j;
        ctx.shadowBlur = 0;
        var g1 = ctx.createRadialGradient(W * 0.3, H * 0.3, 0, W * 0.5, H * 0.5, Math.max(W, H));
        g1.addColorStop(0, "#0a0f2a");
        g1.addColorStop(0.5, "#08051a");
        g1.addColorStop(1, "#000000");
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, W, H);
        var g2 = ctx.createRadialGradient(W * 0.8, H * 0.75, 0, W * 0.8, H * 0.75, Math.max(W, H) * 0.4);
        g2.addColorStop(0, "rgba(90,40,140,0.12)");
        g2.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, W, H);
        // stars
        for (i = 0; i < stars.length; i++) {
          var st = stars[i];
          ctx.globalAlpha = (0.3 + 0.5 * (0.5 + 0.5 * Math.sin(st.p))) * st.z;
          ctx.fillStyle = st.z > 0.7 ? "#bfe6ff" : "#9a8cff";
          ctx.fillRect(st.x * W, st.y * H, st.z * 1.8, st.z * 1.8);
        }
        ctx.globalAlpha = 1;
        ctx.save();
        if (shake > 0.3) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
        setStyle(1.6);
        // rocks
        for (i = 0; i < rocks.length; i++) {
          (function (rk) {
            wrapDraw(rk, rk.r, function (x, y) {
              var pts = [];
              for (var k = 0; k < rk.shape.length; k++) {
                var ang = (k / rk.shape.length) * 6.283;
                pts.push([Math.cos(ang) * rk.shape[k], Math.sin(ang) * rk.shape[k]]);
              }
              poly(pts, x, y, rk.a, rk.r);
            });
          })(rocks[i]);
        }
        // enemies
        for (i = 0; i < enemies.length; i++) {
          (function (e) {
            wrapDraw(e, e.r, function (x, y) {
              if (e.kind === "cluster") {
                var hex = [];
                for (var k = 0; k < 6; k++) hex.push([Math.cos(k * 1.047), Math.sin(k * 1.047)]);
                poly(hex, x, y, e.a, 22 * S);
                for (var d = 0; d < 3; d++) {
                  var da = e.a + d * 2.094;
                  poly([[0, -1], [0.7, 0], [0, 1], [-0.7, 0]], x + Math.cos(da) * 10 * S, y + Math.sin(da) * 10 * S, da, 7 * S);
                }
              } else if (e.kind === "diamond") {
                poly([[1.3, 0], [0, -0.8], [-1.3, 0], [0, 0.8]], x, y, e.a, 10 * S);
              } else if (e.kind === "arrow") {
                poly([[1.2, 0], [-1, -0.8], [-0.4, 0], [-1, 0.8]], x, y, e.a, 8 * S);
              } else {
                var sr = (e.kind === "bigSaucer" ? 20 : 10) * S;
                poly([[-1, 0], [-0.45, -0.35], [0.45, -0.35], [1, 0], [0.45, 0.35], [-0.45, 0.35]], x, y, 0, sr);
                poly([[-1, 0], [1, 0]], x, y, 0, sr, false);
                poly([[-0.45, -0.35], [-0.25, -0.7], [0.25, -0.7], [0.45, -0.35]], x, y, 0, sr, false);
              }
            });
          })(enemies[i]);
        }
        // shots: filled dots
        for (i = 0; i < shots.length; i++) {
          ctx.beginPath();
          ctx.arc(shots[i].x, shots[i].y, 2, 0, 6.283);
          ctx.fill();
        }
        // ship
        if (mode === "play" && ship.alive && (ship.invuln <= 0 || Math.floor(ship.invuln * 10) % 2 === 0)) {
          wrapDraw(ship, 20 * S, function (x, y) {
            poly(SHIP_SHAPE, x, y, ship.a, S);
            if (ship.thrusting && Math.random() < 0.8) {
              poly([[-8, -4], [-18 - Math.random() * 6, 0], [-8, 4]], x, y, ship.a, S, false);
            }
            if (ship.shieldOn) {
              ctx.save();
              ctx.lineWidth = 2;
              ctx.shadowBlur = GLOW * 1.5;
              ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 50);
              ctx.beginPath();
              ctx.arc(x, y, 22 * S, 0, 6.283);
              ctx.stroke();
              ctx.restore();
              setStyle(1.6);
            }
          });
        }
        // particles: 2x2 sparks
        for (i = 0; i < parts.length; i++) {
          ctx.globalAlpha = Math.max(0, parts[i].life / parts[i].max);
          ctx.fillRect(parts[i].x, parts[i].y, 2, 2);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        // HUD (drawn in every mode, as in the Lovable build)
        setStyle(1.4);
        var hs = HUDSTR[lang];
        var n = Math.round(22 * S);
        var sScore = String(score);
        while (sScore.length < 2) sScore = "0" + sScore;
        text(sScore, 20, 56 + n, n);
        text(hs.hi + " " + high, W / 2, 20 + n * 0.8, Math.round(n * 0.7), "center");
        for (i = 0; i < Math.min(lives, 8); i++) {
          poly(SHIP_SHAPE, W - 24 - i * 22 * S, 20 + n * 0.6, -Math.PI / 2, S * 0.7);
        }
        text(hs.bonus, 20, 66 + n * 1.8, Math.round(n * 0.55));
        var bw = 120 * S, bu = 76 + n * 2;
        text(hs.shield, 20, bu + 10 * S, Math.round(n * 0.55));
        ctx.strokeRect(20 + 70 * S, bu, bw, 10 * S);
        ctx.globalAlpha = ship.shield < 0.2 ? 0.5 + 0.5 * Math.sin(performance.now() / 80) : 1;
        ctx.fillRect(20 + 70 * S + 2, bu + 2, (bw - 4) * ship.shield, 10 * S - 4);
        ctx.globalAlpha = 1;
        text("© 1981 ATARI INC", W / 2, H - 10, Math.round(n * 0.5), "center");
        if (mode === "play" && rocks.length === 0) {
          text(hs.wave + " " + (wave + 1), W / 2, H / 2, n, "center");
        }
        if (paused) {
          text(hs.paused, W / 2, H / 2 - 60 * S, Math.round(36 * S), "center");
        }
        ctx.shadowBlur = 0;
      }

      /* ==================== Main loop ==================== */
      var lastT = 0;
      function frame(ts) {
        requestAnimationFrame(frame);
        if (!lastT) lastT = ts;
        var dt = Math.min(0.05, (ts - lastT) / 1000);
        lastT = ts;
        if (dt < 0) dt = 0;
        if (paused) AU.loops(false, false, 0);
        else update(dt);
        render();
      }

      /* ==================== UI wiring ==================== */
      var app = document.getElementById("app");
      var introEl = document.getElementById("intro");
      var overEl = document.getElementById("over");
      var menuBtn = document.getElementById("menuBtn");
      var sysBtns = document.getElementById("sysBtns");
      var touchbar = document.getElementById("touchbar");
      var pauseBtn = document.getElementById("pauseBtn");
      var muteBtn = document.getElementById("muteBtn");
      var soundBtn = document.getElementById("soundBtn");
      var isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;

      function applyLang() {
        var dict = STR[lang];
        var els = document.querySelectorAll("[data-i18n]");
        for (var i = 0; i < els.length; i++) {
          var k = els[i].getAttribute("data-i18n");
          if (dict[k]) els[i].textContent = dict[k];
        }
        document.getElementById("langEn").classList.toggle("active", lang === "en");
        document.getElementById("langEs").classList.toggle("active", lang === "es");
        document.documentElement.lang = lang;
        var cl = document.getElementById("controlsList");
        cl.innerHTML = "";
        for (var c = 0; c < dict.controls.length; c++) {
          var li = document.createElement("li");
          var ks = document.createElement("span");
          ks.className = "k"; ks.textContent = dict.controls[c][0];
          var vs = document.createElement("span");
          vs.className = "v"; vs.textContent = dict.controls[c][1];
          li.appendChild(ks);
          li.appendChild(document.createTextNode(" "));
          li.appendChild(vs);
          cl.appendChild(li);
        }
        var rl = document.getElementById("rulesList");
        rl.innerHTML = "";
        for (var r2 = 0; r2 < dict.rules.length; r2++) {
          var li2 = document.createElement("li");
          li2.textContent = dict.rules[r2];
          rl.appendChild(li2);
        }
        syncUI();
      }
      function syncUI() {
        app.classList.toggle("intro-mode", mode === "intro");
        introEl.classList.toggle("hidden", mode !== "intro");
        overEl.classList.toggle("hidden", mode !== "over");
        menuBtn.classList.toggle("hidden", mode === "intro");
        menuBtn.textContent = T("menu");
        sysBtns.classList.toggle("hidden", mode !== "play");
        touchbar.classList.toggle("hidden", !(mode === "play" && isTouch));
        pauseBtn.textContent = paused ? T("resume") : T("pause");
        muteBtn.textContent = AU.muted ? T("unmute") : T("mute");
        soundBtn.textContent = AU.muted ? T("soundOff") : T("soundOn");
        document.getElementById("introHigh").textContent = high;
        document.getElementById("overScore").textContent = score;
        document.getElementById("overHigh").textContent = high;
      }
      function setLang(l) { lang = l; applyLang(); }
      function toggleMute() { AU.init(); AU.setMute(!AU.muted); syncUI(); }
      function togglePause() { setPaused(!paused); }

      document.getElementById("startBtn").addEventListener("click", engineStart);
      document.getElementById("againBtn").addEventListener("click", engineStart);
      menuBtn.addEventListener("click", toMenu);
      pauseBtn.addEventListener("click", togglePause);
      muteBtn.addEventListener("click", toggleMute);
      soundBtn.addEventListener("click", toggleMute);
      document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });
      document.getElementById("langEs").addEventListener("click", function () { setLang("es"); });

      document.addEventListener("keydown", function (e) {
        var k = KEYMAP[e.code];
        if (k) { IN[k] = true; e.preventDefault(); }
        if (mode === "play") { if (e.code === "KeyP") togglePause(); }
        else if (e.code === "Enter") engineStart();
        if (e.code === "KeyM") toggleMute();
      });
      document.addEventListener("keyup", function (e) {
        var k = KEYMAP[e.code];
        if (k) IN[k] = false;
      });
      function bindBtn(id, key) {
        var el = document.getElementById(id);
        el.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          try { el.setPointerCapture(e.pointerId); } catch (err) {}
          IN[key] = true;
        });
        var off = function () { IN[key] = false; };
        el.addEventListener("pointerup", off);
        el.addEventListener("pointercancel", off);
        el.addEventListener("pointerleave", off);
        el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      }
      bindBtn("btnLeft", "left");
      bindBtn("btnRight", "right");
      bindBtn("btnThrust", "thrust");
      bindBtn("btnFire", "fire");
      bindBtn("btnShield", "shield");
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("visibilitychange", function () { if (document.hidden) setPaused(true); });
      window.addEventListener("blur", function () { setPaused(true); });

      /* ==================== QR (game link for a second phone) ==================== */
      var qrDrawn = false;
      function drawQR() {
        if (qrDrawn) return;
        qrDrawn = true;
        var cvs = document.getElementById("qrCanvas");
        var g = cvs.getContext("2d");
        g.fillStyle = "#ffffff";
        g.fillRect(0, 0, cvs.width, cvs.height);
        if (window.qrcode) {
          try {
            var qr = qrcode(0, "M");
            qr.addData("https://geemondc.github.io/asteroids-deluxe-reborn/");
            qr.make();
            var n = qr.getModuleCount(), quiet = 2, cells = n + quiet * 2;
            var cell = cvs.width / cells;
            g.fillStyle = "#000000";
            for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
              if (qr.isDark(r, c)) g.fillRect(Math.floor((c + quiet) * cell), Math.floor((r + quiet) * cell), Math.ceil(cell), Math.ceil(cell));
            }
          } catch (e) {}
        }
      }
      var qrModal = document.getElementById("qrModal");
      document.getElementById("qrBtn").addEventListener("click", function () {
        drawQR();
        qrModal.classList.add("open");
      });
      var closeQR = function () { qrModal.classList.remove("open"); };
      document.getElementById("qrClose").addEventListener("click", closeQR);
      document.getElementById("qrCanvas").addEventListener("click", closeQR);
      qrModal.addEventListener("click", function (e) { if (e.target === qrModal) closeQR(); });

      /* ==================== Boot ==================== */
      applyLang();
      syncUI();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
