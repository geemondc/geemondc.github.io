<script>
(function(){
  "use strict";
  var T = 20;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var clockStarted = false;   // the 20s clock runs once anything ignites it
  var fsFromStill = false;    // fullscreen was opened from STILL -> FS is living
  var frozen = null;          // QA: freeze the clock at this many seconds
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  var anchor = 0;             // scene seconds at anchorNow (phase anchor)
  var anchorNow = 0;          // performance.now() at the anchor
  var clock = 0;              // current scene clock, seconds (QA state)

  function stack(p){
    return {
             day: document.getElementById(p+'Day'),
             golden: document.getElementById(p+'Golden'),
             dusk: document.getElementById(p+'Dusk'),
             night: document.getElementById(p+'Night'),
             accGlowA: document.getElementById(p+'AccGlowA'),
             accGlowB: document.getElementById(p+'AccGlowB'),
             accStars: document.getElementById(p+'AccStars'),
             accSparkA: document.getElementById(p+'AccSparkA'),
             accSparkB: document.getElementById(p+'AccSparkB')
    };
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsWrap = document.getElementById('fsWrap');
  var fsOpen = false;

  // Fullscreen letterbox geometry: the wrap is sized to the whole picture
  // fitted inside the screen (contain), centred, so the cropped accent
  // layers (positioned in % of the picture) line up at any screen shape.
  function fitFs(){
    var vw = window.innerWidth, vh = window.innerHeight, ar = 1920 / 1088;
    var w = vw, h = vw / ar;
    if (h > vh) { h = vh; w = vh * ar; }
    fsWrap.style.left = ((vw - w) / 2) + 'px';
    fsWrap.style.top = ((vh - h) / 2) + 'px';
    fsWrap.style.width = w + 'px';
    fsWrap.style.height = h + 'px';
  }
  window.addEventListener('resize', function(){ if (fsOpen) fitFs(); });

  // The journey (20s): as painted -> GOLDEN (sun side swells) -> DUSK
  // (blue half takes the frame, valley deepens to teal, lanterns wake) ->
  // NIGHT (moon side wins, the valley's own lights take over) -> gold return.
  // Nested plates: golden under dusk under night; the return fades them
  // out in reverse order with overlaps. t=20 wraps exactly to t=0.
  function opacities(t){
    t = ((t % T) + T) % T;
    var golden = 0, dusk = 0, night = 0;
    if (t >= 1.3333 && t < 4) golden = (t - 1.3333) / 2.6667;
    else if (t >= 4 && t < 16.6667) golden = 1;
    else if (t >= 16.6667) golden = 1 - (t - 16.6667) / 2.6667;
    if (t >= 5.3333 && t < 8.3333) dusk = (t - 5.3333) / 3;
    else if (t >= 8.3333 && t < 17.3333) dusk = 1;
    else if (t >= 17.3333) dusk = 1 - (t - 17.3333) / 2.6667;
    if (t >= 10 && t < 12.6667) night = (t - 10) / 2.6667;
    else if (t >= 12.6667 && t < 17.3333) night = 1;
    else if (t >= 17.3333) night = 1 - (t - 17.3333) / 2.6667;
    return { day:1, golden:golden, dusk:dusk, night:night };
  }
  // Accents, each in its own colour on its own slow rhythm. Envelopes:
  // 'lamp' - flames, windows, lanterns and strings wake through dusk and
  // stand out most at night; 'moon' - a gentle brightening only as night
  // deepens; 'deep2' - STAR-DOSE LAW: star points gain nothing until
  // night itself (night^2 gate), point size never changes; 'spark' - the
  // river's own flecks shimmer with the sun glitter at golden, quieten
  // at dusk, and answer the moon at night.
  // [key, period, phase, max, envelope, pulse floor]
  var ACC = [ ['accGlowA',  4, 0, 0.92, 'lamp', 0.45],
              ['accGlowB',  5.3333, 1.7667, 0.95, 'lamp', 0.45],
              ['accStars',  4.3333, 0, 0.90, 'deep2', 0.55],
              ['accSparkA', 3, 0, 0.95, 'spark', 0.30],
              ['accSparkB', 4.3333, 1.4, 0.95, 'spark', 0.30] ];
  function accOpacities(t){
    var so = opacities(t);
    var env = { lamp: 0.10 + 0.90 * Math.max(0.45 * so.dusk, so.night),
                moon: Math.pow(so.night, 1.5),
                deep2: so.night * so.night,
                spark: Math.max(0.70 * so.golden, 0.55 * so.dusk, 0.90 * so.night) };
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);
      o[a[0]] = a[3] * env[a[4]] * (a[5] + (1 - a[5]) * p);
    }
    if (forcedAcc !== null){ for (var k in o) o[k] = forcedAcc; }
    return o;
  }
  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.golden.style.opacity = living ? so.golden : 0;
    st.dusk.style.opacity = living ? so.dusk : 0;
    st.night.style.opacity = living ? so.night : 0;
    for (var i = 0; i < ACC.length; i++){
      var k = ACC[i][0];
      st[k].style.opacity = living ? ao[k] : 0;
    }
  }
  function frame(now){
    // Scene time is a pure function of wall time (performance.now) since
    // ignition: frame rate or throttling can never stretch the 20s cycle,
    // and entering/leaving fullscreen never touches the clock.
    if (clockStarted && frozen === null) clock = anchor + (now - anchorNow) / 1000;
    var t = frozen !== null ? frozen : clock;
    var so = opacities(t), ao = accOpacities(t);
    var living = state === 'living';
    apply(page, so, ao, living);
    if (fsOpen) apply(fs, so, ao, living || fsFromStill);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){ ignited = true; clockStarted = true; anchor = 0; anchorNow = performance.now(); clock = 0; }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    if (!ignited){ ignite(); return; }
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  // Fullscreen law: tapping the photo opens it edge-to-edge on black.
  // From STILL, fullscreen opens LIVING - the loop ignites and runs; from
  // LIVING it continues at the same phase. Exit restores the exact prior
  // page state (a page that was STILL is STILL again, untouched).
  function openFs(){
    fsFromStill = (state === 'still');
    if (fsFromStill && !clockStarted){ clockStarted = true; anchor = 0; anchorNow = performance.now(); clock = 0; }
    fsOpen = true; fitFs(); fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsFromStill = false; fsEl.style.display = 'none';
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape')) closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ if (frozen !== null){ frozen = null; anchor = clock; anchorNow = performance.now(); } },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : clock); },
    state: function(){ return { state: state, fsOpen: fsOpen, fsFromStill: fsFromStill, clock: clock }; },
    opacities: opacities
  };
})();
</script>
<style>
  /* Wall mode fit (added for the Living Photos wall): whole photo, with
     the photo's own blurred plates filling any surround. */
  #fs .lp-wallbg { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #fs .lp-wallbg img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; filter:blur(26px) brightness(.7) saturate(1.06);
    transform:scale(1.14); display:block; }
  #fs.lp-wallfit img:not(.acc):not(.crop):not(.lp-bgimg) { object-fit:contain !important; }
</style>
<script>
(function(){
  "use strict";
  // Wall mode: embedded in the Living Photos wall (#wall), open directly
  // on the full-screen living view, framed whole — the wall owns taps
  // and keys, so the usual tap/key exits are disarmed in this mode only.
  if (!/(^|[#&])wall([&#]|$)/.test(location.hash || '')) return;
  var fsEl = document.getElementById('fs');
  if (!fsEl || !window.LP) return;
  // Blurred-extension surround: blurred copies of this piece's own
  // photographic plates (the .jpg layers), crossfaded in step with them.
  var plates = [];
  fsEl.querySelectorAll('img').forEach(function(im){
    if (/\.svg($|\?)/i.test(im.getAttribute('src') || '')) plates.push(im);
  });
  if (plates.length){
    var bg = document.createElement('div');
    bg.className = 'lp-wallbg';
    var clones = plates.map(function(im){
      var c = document.createElement('img');
      c.src = im.src; c.alt = ''; c.className = 'lp-bgimg';
      c.style.opacity = getComputedStyle(im).opacity;
      bg.appendChild(c);
      return [c, im];
    });
    fsEl.insertBefore(bg, fsEl.firstChild);
    (function mirror(){
      for (var i = 0; i < clones.length; i++){
        var o = clones[i][1].style.opacity;
        if (o !== '') clones[i][0].style.opacity = o;
      }
      requestAnimationFrame(mirror);
    })();
  }
  fsEl.classList.add('lp-wallfit');
  if (LP.ignite){ try { LP.ignite(); } catch(e){} }
  if (LP.openFs){ try { LP.openFs(); } catch(e){} }
  document.addEventListener('keydown', function(e){ e.stopImmediatePropagation(); }, true);
  fsEl.addEventListener('click', function(e){ e.stopImmediatePropagation(); }, true);
})();
</script>

<script id="lp-fsbar-js">
(function(){
  "use strict";
  var API = window.LP || window.HS;
  var bar = document.getElementById('fsBar');
  var b = document.getElementById('fsStill'), c = document.getElementById('fsLiving'), x = document.getElementById('fsClose');
  if (!API || !bar || !b || !c || !x) return;
  function sync(){ try { var st = API.state().state; b.classList.toggle('on', st === 'still'); c.classList.toggle('on', st !== 'still'); } catch(e){} }
  bar.addEventListener('click', function(e){ e.stopPropagation(); });
  b.addEventListener('click', function(e){ e.stopPropagation(); API.setStill(); sync(); });
  c.addEventListener('click', function(e){ e.stopPropagation(); API.setLiving(); sync(); });
  x.addEventListener('click', function(e){ e.stopPropagation(); API.closeFs(); });
  var st = document.getElementById('stage');
  if (st) st.addEventListener('click', function(){ setTimeout(sync, 30); });
  if (/(^|[#&])wall/.test(location.hash || '')){ [b, c, x].forEach(function(el){ el.setAttribute('disabled',''); el.setAttribute('tabindex','-1'); }); }
  sync();
})();
</script>
