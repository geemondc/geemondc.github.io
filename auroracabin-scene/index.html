<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aurora Cabin — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b1e33; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#0b1e33;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.02) translate(0.4%,0.2%); } to { transform:scale(1.10) translate(-1.6%,-1.0%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #sun { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 7s ease-in-out infinite alternate;
         background:radial-gradient(55% 60% at 66% 12%, rgba(125,240,201,.32), rgba(140,120,240,.16) 55%, rgba(125,240,201,0) 78%); }
  @keyframes breathe { from { opacity:.28 } to { opacity:1 } }
  .bulb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,226,160,.95), rgba(255,190,100,.30) 55%, rgba(255,190,100,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  .flame { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
           background:radial-gradient(closest-side, rgba(255,214,140,.9), rgba(255,170,80,.28) 55%, rgba(255,170,80,0) 78%);
           animation:twk ease-in-out infinite alternate; }
  .spark { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,252,230,.95), rgba(255,240,190,.28) 55%, rgba(255,240,190,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  .fly { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(226,255,160,.95), rgba(190,230,110,.30) 55%, rgba(190,230,110,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  .glow { position:absolute; pointer-events:none; mix-blend-mode:screen; border-radius:50%;
          animation:breathe ease-in-out infinite alternate; }
  .steam { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; opacity:0;
          background:radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,.12) 55%, rgba(255,255,255,0) 78%);
          animation:steamrise ease-in-out infinite; }
  @keyframes steamrise { 0% { transform:translate(-50%,0) scale(.6); opacity:0 } 30% { opacity:.7 } 100% { transform:translate(-40%,-14vh) scale(1.5); opacity:0 } }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.62); filter:brightness(.5) } to { transform:translate(-50%,-50%) scale(1.5); filter:brightness(1.75) } }
  .petal { position:absolute; pointer-events:none; opacity:0;
           background:radial-gradient(closest-side, rgba(246,168,190,.9), rgba(246,168,190,.35) 75%);
           border-radius:60% 40% 60% 40%; animation:fall linear infinite; }
  @keyframes fall { 0% { transform:translate(0,-4vh) rotate(0deg); opacity:0 } 12% { opacity:.85 } 88% { opacity:.8 } 100% { transform:translate(-3vw,104vh) rotate(300deg); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(8,24,40,.55); color:#d9f6ff; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(217,246,255,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #sun, .bulb, .flame, .spark, .fly, .glow, .steam, .petal { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="A log cabin in deep snow under the northern lights, warm windows glowing, a frozen lake and moon behind">
    </div>
    <div id="sun"></div>
    <div id="fx"></div>
    <div id="caption">AURORA CABIN</div>
  </div>
</div>
<script>
  // Aurora Cabin (Gary's living standard): the painting stays exactly itself; the aurora breathes slow over the roof, the windows and lantern hold their warm glow, chimney smoke curls up and its sparks rise, and starlight twinkles over the snow. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    var wins = [[19,43,4.5],[35,44,3.2],[45.5,46,3.4]];
    for (var w = 0; w < wins.length; w++){
      html += '<div class="bulb" style="left:' + wins[w][0] + '%;top:' + wins[w][1] + '%;width:' + wins[w][2] + '%;aspect-ratio:1;animation-duration:' + (3.4 + w * 0.7).toFixed(1) + 's;animation-delay:-' + (w * 0.9).toFixed(1) + 's"></div>';
    }
    var lant = [[39.5,56,3.2]];
    for (var f = 0; f < lant.length; f++){
      html += '<div class="flame" style="left:' + lant[f][0] + '%;top:' + lant[f][1] + '%;width:' + lant[f][2] + '%;aspect-ratio:1;animation-duration:2.6s;animation-delay:-0.4s"></div>';
    }
    var smoke = [[38.5,15],[39,12.5],[38,10]];
    for (var m = 0; m < smoke.length; m++){
      html += '<div class="steam" style="left:' + smoke[m][0] + '%;top:' + smoke[m][1] + '%;width:4.4%;aspect-ratio:1;animation-duration:' + (6 + m * 1.7).toFixed(1) + 's;animation-delay:-' + (m * 2.1).toFixed(1) + 's"></div>';
    }
    var sparks = [[37,9],[52,6],[63,9],[74,5],[84,10],[58,14],[95,8],[44,5],[69,16],[90,30]];
    for (var i = 0; i < sparks.length; i++){
      html += '<div class="spark" style="left:' + sparks[i][0] + '%;top:' + sparks[i][1] + '%;width:' + (0.9 + (i % 3) * 0.25).toFixed(2) + '%;aspect-ratio:1;animation-duration:' + (2.2 + (i % 5) * 0.5).toFixed(1) + 's;animation-delay:-' + (i * 0.6).toFixed(1) + 's"></div>';
    }
    var aur = [[66,13,58]];
    for (var g = 0; g < aur.length; g++){
      html += '<div class="glow" style="left:' + aur[g][0] + '%;top:' + aur[g][1] + '%;width:' + aur[g][2] + '%;aspect-ratio:1.6;transform:translate(-50%,-50%);background:radial-gradient(closest-side, rgba(125,240,201,.24), rgba(125,240,201,0) 78%);animation-duration:13s"></div>';
    }
    var moon = [[89.5,19,5]];
    for (var n = 0; n < moon.length; n++){
      html += '<div class="glow" style="left:' + moon[n][0] + '%;top:' + moon[n][1] + '%;width:' + moon[n][2] + '%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(closest-side, rgba(240,246,255,.20), rgba(240,246,255,0) 78%);animation-duration:11s"></div>';
    }
    var snow = [[8,-4,13],[22,-4,17],[36,-4,12],[50,-4,15],[64,-4,18],[78,-4,13],[92,-4,16],[15,-4,19],[57,-4,11],[85,-4,14]];
    for (var q = 0; q < snow.length; q++){
      html += '<div class="petal" style="left:' + snow[q][0] + '%;top:' + snow[q][1] + '%;width:0.9%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,.3) 75%);animation-duration:' + snow[q][2] + 's;animation-delay:-' + (q * 1.9).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
