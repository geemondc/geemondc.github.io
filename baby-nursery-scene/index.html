<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Nursery — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#241a12; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#241a12;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  /* the world's own breathing: a slow rocking-chair drift, out-and-back so it never jumps */
  #drift { position:absolute; inset:0; animation:drift 11s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* the sunbeam through the nursery windows breathes, long and slow */
  #beam { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite alternate;
          background:radial-gradient(55% 75% at 82% 22%, rgba(255,214,140,.38), rgba(255,190,110,.12) 55%, rgba(255,190,110,0) 78%); }
  /* the table lamp's warm pool, breathing on its own slower clock */
  #lamp { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 12s ease-in-out infinite alternate-reverse;
          background:radial-gradient(16% 24% at 6.5% 38%, rgba(255,205,130,.35), rgba(255,180,100,0) 75%); }
  @keyframes breathe { from { opacity:.55 } to { opacity:1 } }
  /* dust motes drifting in the sunbeam — the nursery's own living detail */
  .mote { position:absolute; border-radius:50%; pointer-events:none;
          background:radial-gradient(closest-side, rgba(255,236,190,.9), rgba(255,236,190,0) 72%);
          animation:moteFloat ease-in-out infinite alternate; }
  @keyframes moteFloat { from { transform:translate(0,0); opacity:.12 } 55% { opacity:.5 } to { transform:translate(-14px,-26px); opacity:.15 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(38,24,12,.55); color:#ffe9b8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,233,184,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #beam, #lamp, .mote { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="The eight friends gathered around the crib, welcoming the baby">
    </div>
    <div id="beam"></div>
    <div id="lamp"></div>
    <div id="motes"></div>
    <div id="caption">THE NURSERY</div>
  </div>
</div>
<script>
  // A quiet scene (Gary's nursery standard): the painting stays exactly itself;
  // only the light breathes — the sunbeam and the lamp on slow clocks, dust
  // motes drifting in the beam. In #wall (inside a Living Card) the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('motes'), html = '';
    var seed = [[76,30,.9],[81,20,1.3],[70,42,.7],[86,34,1.1],[74,55,.8],[90,24,.6],[68,26,1.0],[83,48,.75],[78,64,.65],[92,42,.9],[72,18,.55],[88,58,.7]];
    for (var i = 0; i < seed.length; i++){
      var s = seed[i], size = (s[2] * 5).toFixed(1);
      html += '<div class="mote" style="left:' + s[0] + '%;top:' + s[1] + '%;width:' + size + 'px;height:' + size + 'px;animation-duration:' + (6 + (i % 5) * 1.7).toFixed(1) + 's;animation-delay:-' + (i * 1.3).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
