<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Balloon Ride — Forward Drift</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#141033; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #frame { position:fixed; inset:0; overflow:hidden; background:#141033; }

  /* The world, going FORWARD: two copies of the painting stacked on the
     vanishing point (50%, 42%). Each layer slowly scales up — the valley
     growing nearer — and the senior layer fades out over the junior one
     as its cycle ends, then restarts beneath it at scale 1 while fully
     covered. The reset can never be seen: at the wrap instant the
     restarting layer's opacity has just reached 0 on top, and it comes
     back underneath the other, opaque layer. Driven by the JS clock
     below so STILL can freeze it and QA can straddle the reset. */
  .far { position:absolute; inset:0; background:url('master.jpg') center/cover no-repeat;
         transform-origin:50% 42%; will-change:transform, opacity; }
  #farA { z-index:0; } #farB { z-index:1; }

  /* Portrait pull-back (Gary: "just so we see the full picture"): on a
     tall screen, cover alone would show only the middle slice of a
     landscape painting. So in portrait the sharp painting is pulled
     back to a band showing about half its width, laid over a soft,
     darkened full-bleed copy of itself — the whole composition (both
     temple shores, the river's sweep) stays readable in frame while
     the frame stays full. The blur twins mirror their sharp twins'
     transform and opacity exactly, so the push-in stays one world.
     Landscape screens keep the shipped full-bleed cover untouched. */
  .farBlur { position:absolute; inset:0; background:url('master.jpg') center/cover no-repeat;
             transform-origin:50% 42%; will-change:transform, opacity;
             filter:blur(16px) brightness(.88) saturate(1.15); display:none; }
  @media (max-aspect-ratio: 1/1) {
    .far { background-size:auto 52%; background-position:50% 42%;
           -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0) 12%, #000 21%, #000 64%, rgba(0,0,0,0) 76%);
           mask-image:linear-gradient(to bottom, rgba(0,0,0,0) 12%, #000 21%, #000 64%, rgba(0,0,0,0) 76%); }
    .farBlur { display:block; }
  }

  /* Dusk deepening: light only, Gary's living-photo grammar — a slow
     warm dim that breathes over minutes and melts back. */
  #dusk { position:absolute; inset:0; pointer-events:none; z-index:2;
          background:linear-gradient(180deg, rgba(24,12,64,.28), rgba(10,6,38,0) 42%, rgba(8,4,30,.34));
          opacity:.25; animation: dusk 150s ease-in-out infinite alternate; }
  @keyframes dusk { from { opacity:.12; } to { opacity:.55; } }
  #worldglow { position:absolute; inset:0; z-index:1; pointer-events:none;
               background:radial-gradient(120% 90% at 50% 68%, rgba(255,166,66,.10), rgba(255,166,66,0) 60%);
               animation: breathe 11s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity:.45; } to { opacity:1; } }

  /* Movers — balloons and clouds ahead of us, cut fresh from this same
     painting. Each starts small near the vanishing point, grows as we
     approach, drifts radially outward and passes out of frame. Real
     approach geometry: apparent size and apparent distance from the
     vanishing point grow together, exponentially, so the glide has a
     constant, serene pace. Positions are set every frame by the JS
     clock; nothing here pans sideways. */
  .mv { position:absolute; z-index:3; pointer-events:none; will-change:left, top, width, opacity; }
  .mv img { display:block; width:100%; height:auto; }
  .cloudMv { z-index:4; }
  .burner { animation: burner 7s ease-in-out infinite alternate; }
  @keyframes burner { from { filter:brightness(.96) drop-shadow(0 0 6px rgba(255,170,60,.25)); } to { filter:brightness(1.07) drop-shadow(0 0 14px rgba(255,170,60,.45)); } }
  .birdMv svg { display:block; width:100%; height:auto; animation: flap 1.6s ease-in-out infinite alternate; transform-origin:50% 50%; }
  @keyframes flap { from { transform:scaleY(.72); } to { transform:scaleY(1.12); } }

  /* Ropes: from the rim attachments straight up and out of the top of
     the frame, toward the envelope we never see. Fixed-pixel divs laid
     out by JS, so a rope is the same 5px on a phone and on a desktop —
     never stretched by the window shape. Drawn under the basket, so
     their feet disappear into the wicker. */
  .rope { position:absolute; z-index:5; pointer-events:none; width:5px; border-radius:3px;
          transform-origin:50% 100%;
          background:linear-gradient(90deg, #2e1c0e 0%, #5d3d20 38%, #96683a 55%, #4a2f1a 82%, #241608 100%);
          box-shadow:1px 0 2px rgba(8,4,16,.35); }
  /* Soft shadow the rim throws onto the world — sells one world. */
  #rimshade { position:absolute; left:0; right:0; bottom:15.2vh; height:7vh; z-index:5; pointer-events:none;
              background:linear-gradient(180deg, rgba(10,4,20,0), rgba(10,4,20,.38)); }
  #basket { position:absolute; left:0; bottom:0; width:100%; height:16.6vh; z-index:6;
            object-fit:fill; display:block; pointer-events:none; }

  #caption { position:absolute; left:50%; top:2%; transform:translateX(-50%); white-space:nowrap; z-index:8;
             background:rgba(16,10,40,.5); color:#ffe9c4; font-size:clamp(10px, 2.6vw, 13px); letter-spacing:2.5px;
             padding:6px 14px; border-radius:999px; border:1px solid rgba(255,196,86,.45); pointer-events:none; }
  #picker { position:absolute; right:2.5%; bottom:18.5vh; z-index:8; display:flex; gap:4px; }
  .pill { background:rgba(16,10,40,.62); color:#ffe9c4; border:1px solid rgba(255,196,86,.45); border-radius:999px;
          font-family: Georgia, 'Times New Roman', serif; font-size:clamp(10px, 2.5vw, 12px); letter-spacing:1.5px;
          padding:7px 12px; cursor:pointer; white-space:nowrap; }
  .pill.on { background:#ffc456; color:#1c1038; border-color:#ffc456; font-weight:bold; }
  body.still #dusk, body.still #worldglow, body.still .burner, body.still .birdMv svg { animation-play-state:paused !important; }
</style>
</head>
<body>
<div id="frame">
  <div class="farBlur" id="farBBlur"></div>
  <div class="far" id="farB"></div>
  <div class="farBlur" id="farABlur"></div>
  <div class="far" id="farA"></div>
  <div id="worldglow"></div>
  <div id="dusk"></div>
  <div id="movers"></div>

  <div class="rope" data-ax="17"   data-ay="88"   data-tx="43.5"></div>
  <div class="rope" data-ax="38.5" data-ay="88.5" data-tx="48"></div>
  <div class="rope" data-ax="61.5" data-ay="88.5" data-tx="52"></div>
  <div class="rope" data-ax="83"   data-ay="88"   data-tx="56.5"></div>
  <div id="rimshade"></div>
  <img id="basket" src="basket.webp" alt="Looking over the rim of the balloon basket">
  <div id="caption">BALLOON RIDE &middot; FORWARD DRIFT</div>
  <div id="picker">
    <button class="pill on" id="btnLiving" type="button">LIVING</button>
    <button class="pill" id="btnStill" type="button">STILL</button>
  </div>
</div>
<script>
  // One ride, two states: LIVING (the endless forward drift) and STILL
  // (the painting at rest). The basket never moves; only the world
  // flows — toward us. A single JS clock drives the far layers and
  // every mover, so the whole scene keeps one time.
  (function(){
    var params = new URLSearchParams(location.search);
    // QA hooks: ?zoom=<seconds> shortens the far-layer cycle so the
    // crossfade reset can be straddled on demand; ?pace=<n> multiplies
    // clock speed. Normal visits use the full, calm defaults.
    var P = parseFloat(params.get('zoom'));
    if (!(P >= 8 && P <= 1200)) P = 24;
    var FW = 0.38 * P; if (FW < 2) FW = 2;          // crossfade window, seconds
    var S = 1.33;                                    // total far-layer growth per cycle
    var pace = parseFloat(params.get('pace'));
    if (!(pace >= 0.1 && pace <= 50)) pace = 1;

    var W = innerWidth, H = innerHeight;
    var VPX = 0.50, VPY = 0.42;                      // the vanishing point

    // ---- Far layers: endless approach of the valley itself ----------
    var farA = document.getElementById('farA'), farB = document.getElementById('farB');
    var farABlur = document.getElementById('farABlur'), farBBlur = document.getElementById('farBBlur');
    function farLayer(el, blurEl, off, t){
      var p = ((t + off) % P) / P;                   // 0..1 through its cycle
      var sc = Math.pow(S, p);
      el.style.transform = 'scale(' + sc.toFixed(5) + ')';
      blurEl.style.transform = 'scale(' + (sc * 1.05).toFixed(5) + ')';  // bleed pushed off-frame
      return p;
    }

    // ---- Movers: balloons, clouds, birds on approach paths ----------
    // th: bearing in degrees (0 = straight up from the vanishing point,
    // + clockwise). w0/w1: width as a fraction of viewport width at the
    // far/near ends of the path (px when px:true). off: radial distance
    // in units of the mover's own width — size and distance grow
    // together, which is what makes the approach read as real depth.
    var BIRD = '<svg viewBox="0 0 26 10"><path d="M1 8 Q7 1 13 7 Q19 1 25 8" fill="none" stroke="rgba(16,10,34,.8)" stroke-width="2" stroke-linecap="round"/></svg>';
    var MOVERS = [
      { img:'fwd_purple.webp', th:  62, T:205, w0:.014, w1:.30, cap:215, off:2.6, ph:.30 },
      { img:'fwd_pink.webp',   th: -70, T:190, w0:.016, w1:.26, cap:165, off:2.8, ph:.85 },
      { img:'fwd_rose.webp',   th:-150, T:215, w0:.014, w1:.24, cap:150, off:2.1, ph:.40 },
      { img:'fwd_orange.webp', th: 140, T:200, w0:.015, w1:.33, cap:200, off:2.0, ph:.45 },
      { img:'fwd_teal2.webp',  th: 118, T: 60, w0:.022, w1:.50, cap:260, off:1.6, ph:.20 },
      { img:'fwd_gold.webp',   th: -95, T: 44, w0:.026, w1:.58, cap:250, off:1.4, ph:.27 },
      { img:'fwd_red.webp',    th:  30, T: 93, w0:.024, w1:.55, cap:350, off:1.7, ph:.53, burner:true },
      { img:'fwd_teal.webp',   th: -38, T: 79, w0:.028, w1:.62, cap:340, off:1.5, ph:.45, burner:true },
      { img:'cloud1.webp', cloud:true, th: -58, T: 85, w0:.05, w1:.95, cap:900, off:3.1, ph:.30, op:.34 },
      { img:'cloud2.webp', cloud:true, th:  78, T:100, w0:.04, w1:.80, cap:760, off:3.4, ph:.80, op:.26 },
      { bird:true, th: -25, T:120, w0:9,  w1:30,  cap:30,  off:14, ph:.20, px:true, op:.85 },
      { bird:true, th:  48, T:135, w0:8,  w1:26,  cap:26,  off:15, ph:.65, px:true, op:.7 }
    ];
    var host = document.getElementById('movers');
    MOVERS.forEach(function(m){
      var d = document.createElement('div');
      d.className = 'mv' + (m.cloud ? ' cloudMv' : '') + (m.bird ? ' birdMv' : '');
      if (m.bird) { d.innerHTML = BIRD; m.ar = 26/10; }
      else {
        var im = document.createElement('img');
        im.src = m.img; im.alt = '';
        if (m.burner) im.className = 'burner';
        m.ar = 0.85;
        im.addEventListener('load', function(){ if (im.naturalHeight) m.ar = im.naturalWidth / im.naturalHeight; });
        d.appendChild(im);
      }
      host.appendChild(d); m.el = d;
    });

    function place(m, t){
      var u = (t / m.T + m.ph) % 1;
      var g = Math.exp(Math.log(m.w1 / m.w0) * u);       // growth factor
      var wRaw = m.px ? m.w0 * g : m.w0 * g * W;         // uncapped approach width
      var w = Math.min(wRaw, m.cap);
      var h = w / m.ar;
      var rho = m.off * (m.px ? w : wRaw);               // distance follows the true
                                                         // approach, even past the size cap
      var rad = m.th * Math.PI / 180;
      var cx = VPX * W + rho * Math.sin(rad);
      var cy = VPY * H - rho * Math.cos(rad);
      var op = (m.op != null ? m.op : 1);
      if (u < 0.07) op *= u / 0.07;                      // materialise far away, in the haze
      else if (u > 0.93) op *= (1 - u) / 0.07;           // dissolve as it passes
      m.el.style.width = w + 'px';
      m.el.style.left = (cx - w / 2) + 'px';
      m.el.style.top = (cy - h / 2) + 'px';
      m.el.style.opacity = op.toFixed(3);
    }

    // ---- The clock ---------------------------------------------------
    var simT = 0, last = null;
    function render(){
      var pa = farLayer(farA, farABlur, 0, simT), pb = farLayer(farB, farBBlur, P / 2, simT);
      // The senior layer (further through its cycle, hence larger) rides
      // on top; as it nears its end it fades, revealing the junior
      // beneath — and at the wrap it restarts below, already invisible.
      var aSenior = pa >= pb;
      var sen = aSenior ? farA : farB, jun = aSenior ? farB : farA;
      var senBlur = aSenior ? farABlur : farBBlur, junBlur = aSenior ? farBBlur : farABlur;
      var pSen = aSenior ? pa : pb;
      sen.style.zIndex = 1; jun.style.zIndex = 0;
      senBlur.style.zIndex = 1; junBlur.style.zIndex = 0;   // twins stack with their
                                                           // sharp layer (DOM order
                                                           // keeps blur under sharp)
      jun.style.opacity = 1; junBlur.style.opacity = 1;
      var fadeStart = 1 - FW / P;
      sen.style.opacity = senBlur.style.opacity =
        pSen > fadeStart ? Math.max(0, 1 - (pSen - fadeStart) / (FW / P)) : 1;
      for (var i = 0; i < MOVERS.length; i++) place(MOVERS[i], simT);
    }
    function tick(ts){
      if (last == null) last = ts;
      var dt = (ts - last) / 1000; last = ts;
      if (!document.body.classList.contains('still')) simT += dt * pace;
      render();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // QA handle: jump the clock, read state.
    window.__ride = {
      setTime: function(s){ simT = s; render(); },
      time: function(){ return simT; },
      far: function(){ return { P: P, FW: FW }; },
      mover: function(i){ var r = MOVERS[i].el.getBoundingClientRect();
        return { x:r.x, y:r.y, w:r.width, h:r.height }; }
    };

    // Lay out the ropes: feet on the rim (percent of frame), heads out
    // the top (percent of frame), shafts exactly 5px on any screen.
    function layRopes(){
      W = innerWidth; H = innerHeight;
      var topY = -0.05 * H;
      Array.prototype.forEach.call(document.querySelectorAll('.rope'), function(r){
        var x1 = parseFloat(r.getAttribute('data-ax')) / 100 * W;
        var y1 = parseFloat(r.getAttribute('data-ay')) / 100 * H;
        var x2 = parseFloat(r.getAttribute('data-tx')) / 100 * W;
        var len = Math.hypot(x2 - x1, y1 - topY);
        var ang = Math.atan2(x2 - x1, y1 - topY) * 180 / Math.PI;
        r.style.left = (x1 - 2.5) + 'px';
        r.style.top = (y1 - len) + 'px';
        r.style.height = len + 'px';
        r.style.transform = 'rotate(' + ang + 'deg)';
      });
    }
    layRopes();
    addEventListener('resize', layRopes);
    var living = document.getElementById('btnLiving'), still = document.getElementById('btnStill');
    function setMode(s){
      document.body.classList.toggle('still', s);
      living.classList.toggle('on', !s); still.classList.toggle('on', s);
    }
    living.addEventListener('click', function(){ setMode(false); });
    still.addEventListener('click', function(){ setMode(true); });
  })();
</script>
</body>
</html>
