<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Balloon Ride (Side View) — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#141033; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.72); transform:scale(1.18); }
  #ride { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:#141033; }
</style>
</head>
<body>
<div id="fill"></div>
<iframe id="ride" src="https://geemondc.github.io/balloon-ride/" title="Balloon Ride — Temple Valley Drift" allow="autoplay" allowfullscreen></iframe>
<script>
  // The Balloon Ride (Side View) scene: the ride itself, full frame —
  // the same sideways Temple Valley drift that plays on its own page.
  // In #wall (inside a Living Card) the ride's own caption and
  // LIVING/STILL pills hide; the card brings its own chrome. The hide
  // is a same-origin style injection, retried until the ride answers;
  // if it never does, the ride still plays untouched.
  (function(){
    if (!/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) return;
    var fr = document.getElementById('ride');
    function hide(){
      try {
        var d = fr.contentDocument;
        if (!d) return false;
        if (!d.getElementById('lcWallStyle')){
          var st = d.createElement('style');
          st.id = 'lcWallStyle';
          st.textContent = '#caption,#picker{display:none!important}';
          (d.head || d.documentElement).appendChild(st);
        }
        return true;
      } catch(e){ return true; }
    }
    fr.addEventListener('load', hide);
    var n = 0, iv = setInterval(function(){ if (hide() || ++n > 40) clearInterval(iv); }, 250);
  })();
</script>
</body>
</html>
