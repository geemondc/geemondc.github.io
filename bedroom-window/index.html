<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bedroom Window — a living picture</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#070a12;overflow:hidden;}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#070a12;}
  #bgBlur{position:absolute;inset:0;background:linear-gradient(rgba(4,6,12,.5),rgba(4,6,12,.5)),url('backdrop.jpg') center/cover no-repeat;}
  /* The whole photo, always: a 16:9 frame fitted inside the screen,
     its own blurred painting filling whatever is left around it. */
  #frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.6);background:#0a0f1e;}
  #master{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* The window: everything outside the room lives in this one clipped box,
     measured off the painting's own frame (15.8% / 3.3% / 74.2% / 62.8%). */
  #windowFx{position:absolute;left:15.8%;top:3.3%;width:74.2%;height:62.8%;overflow:hidden;}
  .plate{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 14s ease;}
  #starsWrap{position:absolute;left:0;top:0;width:100%;height:57.5%;opacity:0;transition:opacity 14s ease;pointer-events:none;}
  #stars{width:100%;height:100%;display:block;animation:twinkle 3.6s ease-in-out infinite alternate;}
  @keyframes twinkle{from{opacity:.5}to{opacity:1}}
  #moonGlow{position:absolute;left:67%;top:14.2%;width:36%;height:58%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(205,225,255,.55), rgba(205,225,255,0) 70%);
    mix-blend-mode:screen;opacity:0;transition:opacity 14s ease;pointer-events:none;}
  #pondGlow{position:absolute;left:71.7%;top:84%;width:58%;height:20%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(170,205,255,.4), rgba(170,205,255,0) 70%);
    mix-blend-mode:screen;opacity:0;transition:opacity 14s ease;pointer-events:none;
    animation:shimmer 5.2s ease-in-out infinite alternate;}
  @keyframes shimmer{from{transform:translate(-50%,-50%) scaleX(1)}to{transform:translate(-50%,-50%) scaleX(1.07)}}
  /* Clouds: the day painting's own clouds, cut out and set drifting.
     The phase tints them — white at noon, gold at sunset, blue-grey at night. */
  .clouds{position:absolute;inset:0;pointer-events:none;transition:filter 12s ease,opacity 12s ease;}
  #windowFx[data-phase="day"] .clouds{filter:none;opacity:.95;}
  #windowFx[data-phase="sunset"] .clouds{filter:sepia(.5) saturate(1.35) hue-rotate(-14deg) brightness(1.03);opacity:.85;}
  #windowFx[data-phase="night"] .clouds{filter:brightness(.48) saturate(.55) hue-rotate(10deg);opacity:.6;}
  .cloud{position:absolute;left:0;display:block;will-change:transform;animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite;}
  .ca{top:4%;width:54%;animation-duration:150s;animation-delay:-40s;}
  .cb{top:12%;width:62%;animation-duration:215s;animation-delay:-130s;}
  .cc{top:-2%;width:40%;animation-duration:115s;animation-delay:-75s;}
  @keyframes drift{from{transform:translateX(-105%)}to{transform:translateX(185%)}}
  .fog{position:absolute;left:5%;width:90%;pointer-events:none;filter:blur(10px);
    background:radial-gradient(50% 50% at 50% 50%, rgba(235,240,250,.16), rgba(235,240,250,0) 70%);}
  .f1{top:56%;height:26%;animation:fogdrift 170s ease-in-out infinite alternate;}
  .f2{top:68%;height:20%;opacity:.7;animation:fogdrift 230s ease-in-out infinite alternate-reverse;}
  @keyframes fogdrift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
  #rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  /* Inside the room: the lamp breathes, the game screen flickers —
     the only motion in the room, per the piece's rule. */
  #lampGlow{position:absolute;left:3.7%;top:43.5%;width:18%;height:36%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(255,176,92,.5), rgba(255,176,92,0) 70%);
    mix-blend-mode:screen;opacity:.13;pointer-events:none;animation:lampBreathe 6.5s ease-in-out infinite alternate;}
  @keyframes lampBreathe{from{opacity:.09}to{opacity:.17}}
  #screenGlow{position:absolute;left:38.5%;top:80.1%;width:13%;height:12%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(165,208,255,.85), rgba(120,170,255,.25) 55%, rgba(120,170,255,0) 72%);
    mix-blend-mode:screen;pointer-events:none;animation:gameFlicker 3.7s linear infinite;}
  @keyframes gameFlicker{
    0%{opacity:.55;transform:translate(-50%,-50%) scale(1)}
    13%{opacity:.82;transform:translate(-50%,-50%) scale(1.04)}
    27%{opacity:.6;transform:translate(-50%,-50%) scale(1.01)}
    44%{opacity:.92;transform:translate(-50%,-50%) scale(1.06)}
    61%{opacity:.66;transform:translate(-50%,-50%) scale(1.02)}
    79%{opacity:.85;transform:translate(-50%,-50%) scale(1.05)}
    100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}}
  #screenSpill{position:absolute;left:41%;top:84.5%;width:30%;height:13%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(120,170,255,.28), rgba(120,170,255,0) 70%);
    mix-blend-mode:screen;pointer-events:none;animation:spillPulse 3.7s ease-in-out infinite alternate;}
  @keyframes spillPulse{from{opacity:.45}to{opacity:.8}}
  /* Family chrome (the Glass pattern): quiet pills that get out of the way. */
  #capPill{position:fixed;left:18px;top:calc(14px + env(safe-area-inset-top));z-index:3;
    background:rgba(8,12,22,.42);border-radius:999px;padding:7px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:rgba(240,244,248,.85);font-size:12px;letter-spacing:.18em;text-transform:uppercase;transition:opacity .7s ease;pointer-events:none;}
  #capPill b{color:#fff;font-weight:600;}
  #controls{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:12px;z-index:3;transition:opacity .7s ease;}
  body.ui-hidden #controls, body.ui-hidden #capPill{opacity:0;pointer-events:none;}
  body.ui-hidden{cursor:none;}
  .grp{display:flex;gap:4px;align-items:center;background:rgba(8,12,22,.42);border-radius:999px;padding:4px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .grp button{appearance:none;border:0;cursor:pointer;padding:6px 12px;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;border-radius:999px;color:rgba(240,244,248,.72);background:transparent;transition:background .25s,color .25s;}
  .grp button:hover{color:#fff;}
  .grp button.on{background:rgba(244,246,250,.92);color:#101623;}
  /* Still: the painting itself, untouched — every living layer rests. */
  body.still .plate{opacity:0 !important;}
  body.still #starsWrap, body.still #moonGlow, body.still #pondGlow{opacity:0 !important;}
  body.still .cloud, body.still #stars, body.still .fog, body.still #lampGlow,
  body.still #screenGlow, body.still #screenSpill, body.still #pondGlow{animation-play-state:paused;}
</style>
</head>
<body>
<div id="stage">
  <div id="bgBlur"></div>
  <div id="frame" role="img" aria-label="A living picture: a boy in bed, seen from behind, playing a handheld game beside a bedside lamp, while outside his big bedroom window the same valley passes from night to day to sunset and back — moon, sun, rain on the glass, drifting clouds and fog.">
    <img id="master" src="master.jpg" alt="">
    <div id="windowFx" data-phase="night">
      <img class="plate" id="plateDay" src="plate-day.jpg" alt="">
      <img class="plate" id="plateSunset" src="plate-sunset.jpg" alt="">
      <div id="starsWrap"><img id="stars" src="stars.webp" alt=""></div>
      <div id="moonGlow"></div>
      <div id="pondGlow"></div>
      <div class="clouds">
        <img class="cloud ca" src="cloud-a.webp" alt="">
        <img class="cloud cb" src="cloud-b.webp" alt="">
        <img class="cloud cc" src="cloud-c.webp" alt="">
      </div>
      <div class="fog f1"></div>
      <div class="fog f2"></div>
      <canvas id="rain"></canvas>
    </div>
    <div id="lampGlow"></div>
    <div id="screenGlow"></div>
    <div id="screenSpill"></div>
  </div>
  <div id="capPill"><b>The Bedroom Window</b> · <span id="phaseName">Night</span></div>
  <div id="controls">
    <div class="grp">
      <button id="btnStill" type="button">Still</button>
      <button id="btnLiving" type="button" class="on">Living</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
/* The Bedroom Window — the Big View's little brother. INSIDE stays still
   (lamp breathing, the game screen's glow on the boy's hands); OUTSIDE lives:
   the window cross-fades day -> sunset -> night on three separate paintings
   of the same valley, with the day painting's own clouds set drifting
   (tinted per phase), fog low over the pond, and spells of rain that fall
   on the glass only. Scene time is a loop: Night 4 min, Day 3 min,
   Sunset 2 min, with long 14-second dissolves between. */
const fx = document.getElementById('windowFx');
const plateDay = document.getElementById('plateDay');
const plateSunset = document.getElementById('plateSunset');
const starsWrap = document.getElementById('starsWrap');
const moonGlow = document.getElementById('moonGlow');
const pondGlow = document.getElementById('pondGlow');
const phaseName = document.getElementById('phaseName');
const rainC = document.getElementById('rain');
const rctx = rainC.getContext('2d');

const PHASES = [
  { id:'night',  label:'Night',  dur:240 },
  { id:'day',    label:'Day',    dur:180 },
  { id:'sunset', label:'Sunset', dur:120 }
];
const params = new URLSearchParams(location.search);
let phaseIdx = 0, phaseT = 0, frozen = false, forceRain = null;
if (params.get('phase')) {
  const i = PHASES.findIndex(p => p.id === params.get('phase'));
  if (i >= 0) phaseIdx = i;
  if (params.get('freeze')) frozen = true;
}
if (params.get('rain') !== null) forceRain = Math.max(0, Math.min(1, parseFloat(params.get('rain')) || 0));

let living = true;
function applyPhase(){
  const p = PHASES[phaseIdx];
  fx.dataset.phase = p.id;
  plateDay.style.opacity = p.id === 'day' ? 1 : 0;
  plateSunset.style.opacity = p.id === 'sunset' ? 1 : 0;
  const night = p.id === 'night';
  starsWrap.style.opacity = night ? .95 : 0;
  moonGlow.style.opacity = night ? .85 : 0;
  pondGlow.style.opacity = night ? .55 : 0;
  phaseName.textContent = p.label;
}
const smooth = (t, a, b) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
function rainTarget(){
  if (forceRain !== null) return forceRain;
  if (!living) return 0;
  const p = PHASES[phaseIdx];
  if (p.id === 'day')   return phaseT > 95 ? smooth(phaseT, 95, 115) * (1 - smooth(phaseT, 166, 180)) : 0;
  if (p.id === 'night') return phaseT < 122 ? 1 - smooth(phaseT, 100, 122) : 0;
  return 0;
}

/* Rain on the glass only: streaks that run down inside the window box,
   plus condensation specks that breathe while it rains. */
let RW = 0, RH = 0, DPR = 1;
function sizeRain(){
  const r = fx.getBoundingClientRect();
  DPR = Math.min(1.5, window.devicePixelRatio || 1);
  RW = Math.max(50, Math.round(r.width)); RH = Math.max(50, Math.round(r.height));
  rainC.width = Math.round(RW * DPR); rainC.height = Math.round(RH * DPR);
}
window.addEventListener('resize', sizeRain);
const drops = [];
const specks = Array.from({ length: 70 }, () => ({
  x: Math.random(), y: Math.random(), r: .8 + Math.random() * 1.8, ph: Math.random() * 6.28
}));
let intensity = 0;
function drawRain(now){
  rctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  rctx.clearRect(0, 0, RW, RH);
  if (intensity > .04) {
    rctx.fillStyle = 'rgba(200,222,250,.5)';
    for (const s of specks) {
      rctx.globalAlpha = (.05 + .07 * (0.5 + 0.5 * Math.sin(now / 900 + s.ph))) * intensity;
      rctx.beginPath(); rctx.arc(s.x * RW, s.y * RH, s.r, 0, 6.29); rctx.fill();
    }
    rctx.globalAlpha = 1;
  }
  const maxDrops = Math.floor(120 * intensity);
  while (drops.length < maxDrops && Math.random() < .6) {
    drops.push({ x: Math.random() * RW, y: -20 - Math.random() * 40,
      len: 9 + Math.random() * 15, spd: RH * (.5 + Math.random() * .55), wob: Math.random() * 6.28 });
  }
  rctx.strokeStyle = 'rgba(198,220,252,.55)';
  rctx.lineWidth = 1.3; rctx.lineCap = 'round';
  rctx.globalAlpha = Math.min(1, intensity * 1.2);
  rctx.beginPath();
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.y += d.spd / 60; d.x += d.spd * .07 / 60 + Math.sin(now / 300 + d.wob) * .15;
    if (d.y - d.len > RH) { drops.splice(i, 1); continue; }
    rctx.moveTo(d.x, d.y); rctx.lineTo(d.x - d.len * .07, d.y - d.len);
  }
  rctx.stroke();
  rctx.globalAlpha = 1;
}

/* The loop: one rAF drives the phase clock and the rain together. */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  if (living && !frozen) {
    phaseT += dt;
    if (phaseT >= PHASES[phaseIdx].dur) { phaseT = 0; phaseIdx = (phaseIdx + 1) % PHASES.length; applyPhase(); }
  }
  const tgt = rainTarget();
  intensity += (tgt - intensity) * Math.min(1, dt / 5);
  if (intensity > .01 || drops.length) drawRain(now);
  else if (RW) rctx.clearRect(0, 0, rainC.width, rainC.height);
  requestAnimationFrame(loop);
}

/* Chrome: Still / Living, tap for full screen, idle fade (Glass pattern). */
const btnStill = document.getElementById('btnStill');
const btnLiving = document.getElementById('btnLiving');
function setLiving(on){
  living = on;
  document.body.classList.toggle('still', !on);
  btnStill.classList.toggle('on', !on);
  btnLiving.classList.toggle('on', on);
  if (on) applyPhase();
}
btnStill.addEventListener('click', e => { e.stopPropagation(); setLiving(false); });
btnLiving.addEventListener('click', e => { e.stopPropagation(); setLiving(true); });
document.getElementById('stage').addEventListener('click', e => {
  if (e.target.closest('#controls')) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
});
let idleTimer = null;
function wake(){
  document.body.classList.remove('ui-hidden');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 4500);
}
window.addEventListener('pointermove', wake);
window.addEventListener('touchstart', wake, { passive: true });
wake();

sizeRain();
applyPhase();
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches && !params.get('phase')) setLiving(false);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
