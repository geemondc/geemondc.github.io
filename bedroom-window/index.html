<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bedroom Window — a living picture</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070f;overflow:hidden;}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#05070f;}
  #bgBlur{position:absolute;inset:0;background:linear-gradient(rgba(3,5,11,.5),rgba(3,5,11,.5)),url('twin-backdrop.jpg') center/cover no-repeat;}
  /* The whole photo, always: a 16:9 frame fitted inside the screen,
     its own blurred painting filling whatever is left around it. */
  #frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.65);background:#060a18;}
  #master{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* The window: everything outside lives in this one clipped box, measured
     off the painting's own frame (27.6% / 1.6% / 68.8% / 69.5%). */
  #windowFx{position:absolute;left:27.6%;top:1.6%;width:68.8%;height:69.5%;overflow:hidden;}
  #starsWrap{position:absolute;left:0;top:0;width:100%;height:55%;pointer-events:none;animation:twinkle 3.8s ease-in-out infinite alternate;}
  #starsWrap img{width:100%;height:100%;display:block;}
  @keyframes twinkle{from{opacity:.45}to{opacity:1}}
  #moonGlow{position:absolute;left:83.6%;top:15.8%;width:30%;height:44%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(210,228,255,.5), rgba(210,228,255,0) 70%);
    mix-blend-mode:screen;pointer-events:none;animation:moonPulse 7s ease-in-out infinite alternate;}
  @keyframes moonPulse{from{opacity:.55}to{opacity:.8}}
  /* The cloud river: the painting's own wisps, cut out and set sliding
     across the moon — one smooth direction, brisk but never a storm. */
  .cloud{position:absolute;left:0;display:block;will-change:transform;opacity:.92;
    filter:brightness(.94) saturate(.95);animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite;}
  .ca{top:9%;width:56%;animation-duration:74s;animation-delay:-22s;}
  .cb{top:16%;width:66%;animation-duration:92s;animation-delay:-48s;}
  .cc{top:2%;width:46%;animation-duration:122s;animation-delay:-80s;}
  .cd{top:22%;width:50%;animation-duration:84s;animation-delay:-8s;}
  .ce{top:13%;width:40%;animation-duration:104s;animation-delay:-64s;opacity:.8;}
  .cf{top:19.5%;width:44%;animation-duration:98s;animation-delay:-36s;opacity:.85;}
  .cg{top:6.5%;width:42%;animation-duration:116s;animation-delay:-70s;opacity:.75;}
  @keyframes drift{from{transform:translateX(-108%)}to{transform:translateX(195%)}}
  /* The tree's outer leaves, cut by their green, stir in the night air. */
  #leaf{position:absolute;left:25.1%;top:3.2%;width:32.4%;display:block;pointer-events:none;
    transform-origin:15% 0%;animation:sway 7.5s ease-in-out infinite alternate;}
  @keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.5deg) translateX(.9%)}}
  #leaf2{position:absolute;left:41%;top:5%;width:19%;display:block;pointer-events:none;transform-origin:20% 0%;animation:sway2 5.6s ease-in-out infinite alternate-reverse;}
  @keyframes sway2{from{transform:rotate(1.2deg)}to{transform:rotate(-1.4deg) translateX(-.7%)}}
  .fog{position:absolute;left:5%;width:90%;pointer-events:none;filter:blur(10px);
    background:radial-gradient(50% 50% at 50% 50%, rgba(200,216,245,.14), rgba(200,216,245,0) 70%);}
  .f1{top:40%;height:22%;animation:fogdrift 150s ease-in-out infinite alternate;}
  .f2{top:50%;height:18%;opacity:.7;animation:fogdrift 210s ease-in-out infinite alternate-reverse;}
  @keyframes fogdrift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
  .vl{position:absolute;width:1.15%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(closest-side, rgba(255,205,110,.95), rgba(255,170,60,.35) 55%, rgba(255,170,60,0) 75%);animation:vlTw ease-in-out infinite alternate;}
  @keyframes vlTw{from{opacity:.3;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1.18)}}
  body.still .vl{opacity:0;animation-play-state:paused}
  /* The terraces shimmer; the lake holds the moon's path. */
  #terraceGlow{position:absolute;left:24.3%;top:70.2%;width:69.1%;height:20%;pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%, rgba(190,255,170,.20), rgba(190,255,170,0) 70%);
    mix-blend-mode:screen;animation:shimmer 6.5s ease-in-out infinite alternate;}
  @keyframes shimmer{from{opacity:.35;transform:scaleX(1)}to{opacity:.7;transform:scaleX(1.04)}}
  #lakeGlow{position:absolute;left:68%;top:60%;width:20.7%;height:10.2%;pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%, rgba(205,228,255,.35), rgba(205,228,255,0) 70%);
    mix-blend-mode:screen;animation:shimmer 5s ease-in-out infinite alternate-reverse;}
  /* Inside the room, only the lights are awake — each on its own clock. */
  .glow{position:absolute;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;}
  #phoneGlow{left:21%;top:54.4%;width:11%;height:10%;
    background:radial-gradient(closest-side, rgba(165,208,255,.85), rgba(120,170,255,.25) 55%, rgba(120,170,255,0) 72%);
    animation:gameFlicker 3.1s linear infinite;}
  @keyframes gameFlicker{
    0%{opacity:.35;transform:translate(-50%,-50%) scale(.97)}
    13%{opacity:.85;transform:translate(-50%,-50%) scale(1.06)}
    27%{opacity:.5;transform:translate(-50%,-50%) scale(1.0)}
    44%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
    61%{opacity:.55;transform:translate(-50%,-50%) scale(1.01)}
    79%{opacity:.92;transform:translate(-50%,-50%) scale(1.07)}
    100%{opacity:.35;transform:translate(-50%,-50%) scale(.97)}}
  #ledGlow1{left:10.8%;top:11.2%;width:16%;height:13%;
    background:radial-gradient(closest-side, rgba(255,64,40,.55), rgba(255,64,40,0) 70%);animation:breathe 5.5s ease-in-out infinite alternate;}
  #ledGlow2{left:7.2%;top:27.6%;width:17%;height:14%;
    background:radial-gradient(closest-side, rgba(255,64,40,.5), rgba(255,64,40,0) 70%);animation:breathe 6.3s ease-in-out infinite alternate-reverse;}
  @keyframes breathe{from{opacity:.35}to{opacity:.65}}
  #shelfLantern{left:14.8%;top:25.5%;width:7%;height:11%;
    background:radial-gradient(closest-side, rgba(255,186,92,.6), rgba(255,186,92,0) 70%);animation:lantern 4.3s ease-in-out infinite alternate;}
  #bedLantern{left:2.4%;top:71%;width:8%;height:12%;
    background:radial-gradient(closest-side, rgba(255,196,105,.55), rgba(255,196,105,0) 70%);animation:lantern 5.1s ease-in-out infinite alternate-reverse;}
  @keyframes lantern{from{opacity:.4}to{opacity:.75}}
  /* Family chrome: quiet pills that get out of the way. */
  #capPill{position:fixed;left:18px;top:calc(14px + env(safe-area-inset-top));z-index:3;
    background:rgba(6,9,18,.42);border-radius:999px;padding:7px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:rgba(240,244,248,.85);font-size:12px;letter-spacing:.18em;text-transform:uppercase;transition:opacity .7s ease;pointer-events:none;}
  #capPill b{color:#fff;font-weight:600;}
  #controls{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:12px;z-index:3;transition:opacity .7s ease;}
  body.ui-hidden #controls, body.ui-hidden #capPill{opacity:0;pointer-events:none;}
  body.ui-hidden{cursor:none;}
  .grp{display:flex;gap:4px;align-items:center;background:rgba(6,9,18,.42);border-radius:999px;padding:4px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .grp button{appearance:none;border:0;cursor:pointer;padding:6px 12px;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;border-radius:999px;color:rgba(240,244,248,.72);background:transparent;transition:background .25s,color .25s;}
  .grp button:hover{color:#fff;}
  .grp button.on{background:rgba(244,246,250,.92);color:#101623;}
  /* Still: the painting itself, untouched — every living layer rests. */
  body.still #starsWrap, body.still #moonGlow, body.still #terraceGlow, body.still #lakeGlow,
  body.still .glow{opacity:0;}
  body.still .cloud, body.still #leaf, body.still .fog, body.still #starsWrap, body.still #moonGlow,
  body.still #terraceGlow, body.still #lakeGlow, body.still .glow{animation-play-state:paused;}
  body.still .cloud, body.still #leaf, body.still #leaf2, body.still .fog{opacity:0;}
</style>
</head>
<body>
<div id="stage">
  <div id="bgBlur"></div>
  <div id="frame" role="img" aria-label="A living picture: a boy lying in bed in a wood cabin room, headphones on, playing a handheld game, while outside the giant window a moonlit valley glows — clouds sliding across the full moon, terraced fields shimmering, a tree stirring, cottage lights twinkling in the hills.">
    <img id="master" src="twin-master.jpg" alt="">
    <div id="windowFx">
      <div id="starsWrap"><img src="twin-stars.webp" alt=""></div>
      <div id="moonGlow"></div>
      <img class="cloud ca" src="twin-cloud-a.webp" alt="">
      <img class="cloud cb" src="twin-cloud-b.webp" alt="">
      <img class="cloud cc" src="twin-cloud-c.webp" alt="">
      <img class="cloud cd" src="twin-cloud-d.webp" alt="">
      <img class="cloud ce" src="twin-cloud-e.webp" alt="">
      <img class="cloud cf" src="twin-cloud-f.webp" alt="">
      <img class="cloud cg" src="twin-cloud-g.webp" alt="">
      <div class="fog f1"></div>
      <div class="fog f2"></div>
      <div id="valleyLights"><span class="vl" style="left:25.3%;top:69.6%;animation-duration:2.3s;animation-delay:-0.0s"></span><span class="vl" style="left:29.7%;top:68.9%;animation-duration:2.8s;animation-delay:-0.7s"></span><span class="vl" style="left:35.5%;top:70.4%;animation-duration:3.4s;animation-delay:-1.4s"></span><span class="vl" style="left:42.7%;top:68.2%;animation-duration:4.0s;animation-delay:-2.1s"></span><span class="vl" style="left:45.6%;top:69.6%;animation-duration:4.5s;animation-delay:-2.8s"></span><span class="vl" style="left:51.5%;top:72.5%;animation-duration:2.3s;animation-delay:-3.5s"></span><span class="vl" style="left:55.8%;top:71.8%;animation-duration:2.8s;animation-delay:-4.2s"></span><span class="vl" style="left:77.6%;top:73.9%;animation-duration:3.4s;animation-delay:-4.9s"></span><span class="vl" style="left:81.3%;top:74.7%;animation-duration:4.0s;animation-delay:-5.6s"></span><span class="vl" style="left:84.9%;top:73.9%;animation-duration:4.5s;animation-delay:-6.3s"></span><span class="vl" style="left:61.6%;top:78.3%;animation-duration:2.3s;animation-delay:-7.0s"></span><span class="vl" style="left:67.4%;top:80.4%;animation-duration:2.8s;animation-delay:-7.7s"></span><span class="vl" style="left:73.3%;top:81.1%;animation-duration:3.4s;animation-delay:-8.4s"></span><span class="vl" style="left:64.5%;top:84.0%;animation-duration:4.0s;animation-delay:-9.1s"></span></div>
      <div id="terraceGlow"></div>
      <div id="lakeGlow"></div>
      <img id="leaf" src="twin-leaf.webp" alt="">
      <img id="leaf2" src="twin-leaf.webp" alt="">
    </div>
    <div class="glow" id="ledGlow1"></div>
    <div class="glow" id="ledGlow2"></div>
    <div class="glow" id="shelfLantern"></div>
    <div class="glow" id="bedLantern"></div>
    <div class="glow" id="phoneGlow"></div>
  </div>
  <div id="capPill"><b>The Bedroom Window</b></div>
  <div id="controls">
    <div class="grp">
      <button id="btnStill" type="button">Still</button>
      <button id="btnLiving" type="button" class="on">Living</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
/* The Bedroom Window — the twin. Built to match the reel Gary loves:
   INSIDE still (only the lights are awake — the game glow in his hands,
   the red LED strips breathing, two lanterns flickering on their own
   clocks); OUTSIDE alive in one calm night: a river of the painting's own
   clouds sliding across the full moon, stars twinkling, mist in the
   valleys, the terraces shimmering, the lake holding the moon's path,
   and the tree's outer leaves stirring. Nothing hurried, nothing stormy. */
const btnStill = document.getElementById('btnStill');
const btnLiving = document.getElementById('btnLiving');
function setLiving(on){
  document.body.classList.toggle('still', !on);
  btnStill.classList.toggle('on', !on);
  btnLiving.classList.toggle('on', on);
}
btnStill.addEventListener('click', e => { e.stopPropagation(); setLiving(false); });
btnLiving.addEventListener('click', e => { e.stopPropagation(); setLiving(true); });
document.getElementById('stage').addEventListener('click', e => {
  if (e.target.closest('#controls')) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
});
let idleTimer = null;
function wake(){
  document.body.classList.remove('ui-hidden');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 4500);
}
window.addEventListener('pointermove', wake);
window.addEventListener('touchstart', wake, { passive: true });
wake();
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) setLiving(false);
})();
</script>
</body>
</html>
