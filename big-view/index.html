<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>The Big View — A Living Photo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b0b0d; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:34px 18px 30px; }
  h1 { font-size:clamp(28px, 4.5vw, 44px); font-weight:normal; letter-spacing:.14em;
       text-transform:uppercase; color:#f2ead6; text-align:center; }
  .statement { margin-top:8px; font-style:italic; font-size:clamp(14px, 2vw, 18px);
               color:#b9b09a; text-align:center; }
  .stage { position:relative; width:min(1120px, 100%); margin-top:26px;
           aspect-ratio: 2560 / 1440; cursor:pointer; background:#000;
           box-shadow: 0 18px 60px rgba(0,0,0,.65); }
  .stage img { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  .stage img.acc { inset:auto; object-fit:fill; }
  .controls { margin-top:22px; display:flex; justify-content:center; }
  button { font-family:inherit; cursor:pointer; background:transparent;
           color:#e8e2d4; border:1px solid #8a7f63; letter-spacing:.12em; }
  #ignite { font-size:17px; padding:13px 34px; border-radius:999px;
            text-transform:uppercase; }
  #ignite:hover { background:#1c1a14; }
  .toggle { display:none; border:1px solid #8a7f63; border-radius:999px; overflow:hidden; }
  .toggle button { border:none; font-size:15px; padding:11px 30px;
                   text-transform:uppercase; background:transparent; }
  .toggle button.on { background:#e8e2d4; color:#141310; }
  .credit { margin-top:16px; font-size:13px; letter-spacing:.1em; color:#8f887a;
            text-align:center; }
  footer { padding:26px 18px 40px; text-align:center; font-size:14px; color:#8f887a; }
  footer a { color:#b9b09a; }
  #fs { position:fixed; inset:0; background:#000; display:none; z-index:50; cursor:pointer; }
  #fs .wrap { position:absolute; inset:0; }
  #fs img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  #fs img.acc { inset:auto; object-fit:fill; }
</style>

    <img class="acc" id="fsAccLampB" src="acc-lampb.png" alt="" style="opacity:0;left:88.9844%;top:39.9306%;width:9.5312%;height:11.8750%">
    <img class="acc" id="fsAccCandles" src="acc-candles.png" alt="" style="opacity:0;left:42.8125%;top:85.9028%;width:8.1641%;height:12.5000%">
    <img class="acc" id="fsAccMoon" src="acc-moon.png" alt="" style="opacity:0;left:70.9766%;top:7.7083%;width:2.4219%;height:4.3056%">
    <img class="acc" id="fsAccFireworks" src="acc-fireworks.png" alt="" style="opacity:0;left:68.2031%;top:21.1806%;width:8.5938%;height:9.0278%">
    <img class="acc" id="fsAccStars" src="acc-stars.png" alt="" style="opacity:0;left:55.6641%;top:4.3056%;width:34.0234%;height:26.1806%">
    <img class="acc" id="fsAccCityA" src="acc-citya.png" alt="" style="opacity:0;left:17.6172%;top:33.4028%;width:68.6719%;height:13.7500%">
    <img class="acc" id="fsAccCityB" src="acc-cityb.png" alt="" style="opacity:0;left:18.5156%;top:33.2639%;width:69.1016%;height:14.0972%">
    <img class="acc" id="fsAccCityC" src="acc-cityc.png" alt="" style="opacity:0;left:13.7500%;top:33.4028%;width:74.8047%;height:13.8889%">
    <img class="acc" id="fsAccLakeA" src="acc-lakea.png" alt="" style="opacity:0;left:38.0469%;top:41.7361%;width:35.1953%;height:11.1111%">

</div></div>

<script>
(function(){
  "use strict";
  var T = 20;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var frozen = null;          // QA: freeze the clock at this many seconds
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  var anchor = 0;             // scene seconds at anchorNow (phase anchor)
  var anchorNow = 0;          // performance.now() at the anchor
  var clock = 0;              // current scene clock, seconds (QA state)

  function stack(p){
    return {
             day: document.getElementById(p+'Day'),
             gold: document.getElementById(p+'Gold'),
             dusk: document.getElementById(p+'Dusk'),
             deep: document.getElementById(p+'Deep'),
             accGuitar: document.getElementById(p+'AccGuitar'),
             accLaser: document.getElementById(p+'AccLaser'),
             accStrip: document.getElementById(p+'AccStrip'),
             accMonitors: document.getElementById(p+'AccMonitors'),
             accLampA: document.getElementById(p+'AccLampA'),
             accLampB: document.getElementById(p+'AccLampB'),
             accCandles: document.getElementById(p+'AccCandles'),
             accMoon: document.getElementById(p+'AccMoon'),
             accFireworks: document.getElementById(p+'AccFireworks'),
             accStars: document.getElementById(p+'AccStars'),
             accCityA: document.getElementById(p+'AccCityA'),
             accCityB: document.getElementById(p+'AccCityB'),
             accCityC: document.getElementById(p+'AccCityC'),
             accLakeA: document.getElementById(p+'AccLakeA'),
             accLakeB: document.getElementById(p+'AccLakeB'),
             accLakeC: document.getElementById(p+'AccLakeC')
    };
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsWrap = document.getElementById('fsWrap');
  var fsOpen = false;

  // Fullscreen letterbox geometry: the wrap is sized to the whole picture
  // fitted inside the screen (contain), centred, so the cropped accent
  // layers (positioned in % of the picture) line up at any screen shape.
  function fitFs(){
    var vw = window.innerWidth, vh = window.innerHeight, ar = 2560 / 1440;
    var w = vw, h = vw / ar;
    if (h > vh) { h = vh; w = vh * ar; }
    fsWrap.style.left = ((vw - w) / 2) + 'px';
    fsWrap.style.top = ((vh - h) / 2) + 'px';
    fsWrap.style.width = w + 'px';
    fsWrap.style.height = h + 'px';
  }
  window.addEventListener('resize', function(){ if (fsOpen) fitFs(); });

  // The journey (20s): as painted (the crossroads) -> golden (the sunset
  // half swells) -> dusk (blue takes the window, course to teal-green) ->
  // night (deep blue; the guitar swells) -> back through the bands.
  // Nested plates: gold under dusk under deep; the return fades the plates
  // out in reverse order with overlaps. t=20 wraps exactly to t=0.
  // (TRUE-NIGHT WAVE 2 retime: night melts in 30-38 and is HELD 38-52,
  // the longest stretch of the loop, on the fleet's standard curve.)
  function opacities(t){
    t = ((t % T) + T) % T;
    var gold = 0, dusk = 0, deep = 0;
    if (t >= 1.3333 && t < 4) gold = (t - 1.3333) / 2.6667;
    else if (t >= 4 && t < 16.6667) gold = 1;
    else if (t >= 16.6667) gold = 1 - (t - 16.6667) / 2.6667;
    if (t >= 5.3333 && t < 8.3333) dusk = (t - 5.3333) / 3;
    else if (t >= 8.3333 && t < 17.3333) dusk = 1;
    else if (t >= 17.3333) dusk = 1 - (t - 17.3333) / 2.6667;
    if (t >= 10 && t < 12.6667) deep = (t - 10) / 2.6667;
    else if (t >= 12.6667 && t < 17.3333) deep = 1;
    else if (t >= 17.3333) deep = 1 - (t - 17.3333) / 2.6667;
    return { day:1, gold:gold, dusk:dusk, deep:deep };
  }
  // Accents, each in its own colour on its own slow rhythm. Envelopes:
  // 'night' - wakes as the window deepens, strongest at night (the guitar
  //   is the signature swell, brightest thing outside);
  // 'lamp' - the room's own warm lights, present early, fuller at night;
  // 'room' - the monitor bank: steady glow, a touch stronger at night,
  //   screen content never changes (the layer is its own brightened glow);
  // 'strip' - the LED strip stands out more as the window deepens;
  // 'city' - the towers' windows and the city field wake in offset groups
  //   from dusk on;
  // 'deep2' - STAR-DOSE LAW: stars, lake flecks and fireworks gain nothing
  //   through the golden leg (deep^2 gate); point size never changes.
  // [key, period, phase, max, envelope, pulse floor]
  var ACC = [ ['accGuitar',   5, 0, 0.95, 'night', 0.35],
              ['accLaser',    5.6667, 1, 0.75, 'night', 0.50],
              ['accStrip',    4.3333, 0, 0.95, 'strip', 0.50],
              ['accMonitors', 3.6667, 0.6667, 0.85, 'room',  0.72],
              ['accLampA',    3.3333, 0.3333, 0.90, 'lamp',  0.50],
              ['accLampB',    4, 1.6667, 0.90, 'lamp',  0.50],
              ['accCandles',   3, 0, 0.90, 'lamp',  0.55],
              ['accMoon',     4.6667, 1.3333, 0.85, 'night', 0.40],
              ['accFireworks',5.3333, 2, 0.85, 'deep2', 0.30],
              ['accStars',    4.3333, 0, 0.90, 'deep2', 0.55],
              ['accCityA',     3, 0, 0.95, 'city',  0.30],
              ['accCityB',    4.3333, 1.4, 0.95, 'city',  0.30],
              ['accCityC',    5.6667, 2.9667, 0.95, 'city',  0.30],
              ['accLakeA',     3, 0.3333, 0.95, 'deep2', 0.30],
              ['accLakeB',    4.3333, 1.6667, 0.95, 'deep2', 0.30],
              ['accLakeC',    5.6667, 3.1667, 0.95, 'deep2', 0.30] ];
  function accOpacities(t){
    var so = opacities(t);
    var env = { night: 0.15 + 0.85 * Math.max(0.5 * so.dusk, so.deep),
                lamp: 0.20 + 0.80 * Math.max(0.55 * so.gold, 0.8 * so.dusk, so.deep),
                room: 0.45 + 0.55 * Math.max(so.dusk, so.deep),
                strip: 0.25 + 0.75 * Math.max(so.dusk, so.deep),
                city: Math.max(so.dusk, so.deep),
                deep2: so.deep * so.deep };
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);
      o[a[0]] = a[3] * env[a[4]] * (a[5] + (1 - a[5]) * p);
    }
    if (forcedAcc !== null){ for (var k in o) o[k] = forcedAcc; }
    return o;
  }
  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.gold.style.opacity = living ? so.gold : 0;
    st.dusk.style.opacity = living ? so.dusk : 0;
    st.deep.style.opacity = living ? so.deep : 0;
    for (var i = 0; i < ACC.length; i++){
      var k = ACC[i][0];
      st[k].style.opacity = living ? ao[k] : 0;
    }
  }
  function frame(now){
    // Scene time is a pure function of wall time (performance.now) since
    // ignition: frame rate or throttling can never stretch the 20s cycle,
    // and entering/leaving fullscreen never touches the clock.
    if (ignited && frozen === null) clock = anchor + (now - anchorNow) / 1000;
    var t = frozen !== null ? frozen : clock;
    var so = opacities(t), ao = accOpacities(t);
    var living = state === 'living';
    apply(page, so, ao, living);
    if (fsOpen) apply(fs, so, ao, living);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){ ignited = true; anchor = 0; anchorNow = performance.now(); clock = 0; }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    if (!ignited){ ignite(); return; }
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  // Fullscreen changes size, never state: from STILL it shows the still,
  // from LIVING the living picture at the same phase; exit restores the
  // page exactly (mode untouched, clock untouched).
  function openFs(){
    fsOpen = true; fitFs(); fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsEl.style.display = 'none';
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape' || e.key)) closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ if (frozen !== null){ frozen = null; anchor = clock; anchorNow = performance.now(); } },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : clock); },
    state: function(){ return { state: state, fsOpen: fsOpen, clock: clock }; },
    opacities: opacities
  };
})();
</script>
<style>
  /* Wall mode fit (added for the Living Photos wall): whole photo, with
     the photo's own blurred plates filling any surround. */
  #fs .lp-wallbg { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #fs .lp-wallbg img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; filter:blur(26px) brightness(.7) saturate(1.06);
    transform:scale(1.14); display:block; }
  #fs.lp-wallfit img:not(.acc):not(.crop):not(.lp-bgimg) { object-fit:contain !important; }
</style>
<script>
(function(){
  "use strict";
  // Wall mode: embedded in the Living Photos wall (#wall), open directly
  // on the full-screen living view, framed whole — the wall owns taps
  // and keys, so the usual tap/key exits are disarmed in this mode only.
  if (!/(^|[#&])wall([&#]|$)/.test(location.hash || '')) return;
  var fsEl = document.getElementById('fs');
  if (!fsEl || !window.LP) return;
  // Blurred-extension surround: blurred copies of this piece's own
  // photographic plates (the .jpg layers), crossfaded in step with them.
  var plates = [];
  fsEl.querySelectorAll('img').forEach(function(im){
    if (/\.jpe?g($|\?)/i.test(im.getAttribute('src') || '')) plates.push(im);
  });
  if (plates.length){
    var bg = document.createElement('div');
    bg.className = 'lp-wallbg';
    var clones = plates.map(function(im){
      var c = document.createElement('img');
      c.src = im.src; c.alt = ''; c.className = 'lp-bgimg';
      c.style.opacity = getComputedStyle(im).opacity;
      bg.appendChild(c);
      return [c, im];
    });
    fsEl.insertBefore(bg, fsEl.firstChild);
    (function mirror(){
      for (var i = 0; i < clones.length; i++){
        var o = clones[i][1].style.opacity;
        if (o !== '') clones[i][0].style.opacity = o;
      }
      requestAnimationFrame(mirror);
    })();
  }
  fsEl.classList.add('lp-wallfit');
  if (LP.ignite){ try { LP.ignite(); } catch(e){} }
  if (LP.openFs){ try { LP.openFs(); } catch(e){} }
  document.addEventListener('keydown', function(e){ e.stopImmediatePropagation(); }, true);
  fsEl.addEventListener('click', function(e){ e.stopImmediatePropagation(); }, true);
})();
</script>
