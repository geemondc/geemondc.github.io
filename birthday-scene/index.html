<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Birthday Room — a living card scene</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d0906;overflow:hidden;}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0d0906;}
  #bgBlur{position:absolute;inset:-40px;background:url('still.jpg') center/cover no-repeat;filter:blur(34px) brightness(.55);}
  #frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.65);background:#171008;}
  #master{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* The five balloons, cut from the painting itself, swaying on their strings. */
  .bal{position:absolute;display:block;pointer-events:none;transform-origin:50% 100%;animation-name:sway;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;}
  .b-red{left:20.5%;top:4.5%;width:14%;animation-duration:6.4s;}
  .b-yellow{left:36%;top:8.5%;width:10.5%;animation-duration:5.5s;animation-delay:-2s;}
  .b-teal{left:50.5%;top:11.5%;width:11.5%;animation-duration:7.2s;animation-delay:-4s;}
  .b-purple{left:66%;top:10.5%;width:11%;animation-duration:5.9s;animation-delay:-1s;}
  .b-pink{left:78%;top:13.5%;width:11%;animation-duration:6.8s;animation-delay:-3s;}
  @keyframes sway{from{transform:rotate(-.9deg) translateY(0)}to{transform:rotate(.9deg) translateY(-.35%)}}
  /* Every real light on its own clock. */
  .glow{position:absolute;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;border-radius:50%;}
  .flame{width:3.4%;height:5.5%;background:radial-gradient(closest-side, rgba(255,214,130,.95), rgba(255,150,50,.4) 55%, rgba(255,140,40,0) 75%);animation-name:flk;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;}
  @keyframes flk{from{opacity:.55;transform:translate(-50%,-50%) scale(.9) rotate(-2deg)}to{opacity:1;transform:translate(-50%,-52%) scale(1.12) rotate(2deg)}}
  .bulb{width:1.5%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,220,150,.95), rgba(255,180,80,.3) 55%, rgba(255,180,80,0) 75%);animation-name:twk;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;}
  @keyframes twk{from{opacity:.35;transform:translate(-50%,-50%) scale(.82)}to{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
  .lant{width:7%;height:11%;background:radial-gradient(closest-side, rgba(255,186,92,.55), rgba(255,170,80,0) 70%);animation:breathe 4.8s ease-in-out infinite alternate;}
  @keyframes breathe{from{opacity:.4}to{opacity:.78}}
  #cakeAura{left:56%;top:57%;width:34%;height:30%;background:radial-gradient(50% 50% at 50% 50%, rgba(255,190,100,.20), rgba(255,190,100,0) 70%);animation:breathe 6.5s ease-in-out infinite alternate;}
  /* Family chrome: quiet pills that get out of the way. */
  #capPill{position:fixed;left:18px;top:calc(14px + env(safe-area-inset-top));z-index:3;
    background:rgba(16,10,4,.45);border-radius:999px;padding:7px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:rgba(248,240,224,.85);font-size:12px;letter-spacing:.18em;text-transform:uppercase;transition:opacity .7s ease;pointer-events:none;}
  #capPill b{color:#fff;font-weight:600;}
  #controls{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:12px;z-index:3;transition:opacity .7s ease;}
  body.ui-hidden #controls, body.ui-hidden #capPill{opacity:0;pointer-events:none;}
  body.ui-hidden{cursor:none;}
  body.wallmode #controls, body.wallmode #capPill{display:none;}
  .grp{display:flex;gap:4px;align-items:center;background:rgba(16,10,4,.45);border-radius:999px;padding:4px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .grp button{appearance:none;border:0;cursor:pointer;padding:6px 12px;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;border-radius:999px;color:rgba(248,240,224,.75);background:transparent;transition:background .25s,color .25s;}
  .grp button:hover{color:#fff;}
  .grp button.on{background:rgba(248,242,228,.92);color:#241505;}
  /* Still: the painting itself, untouched — every living layer rests. */
  body.still .bal, body.still .glow{opacity:0;animation-play-state:paused;}
</style>
</head>
<body>
<div id="stage">
  <div id="bgBlur"></div>
  <div id="frame" role="img" aria-label="A living birthday room: five balloons swaying over a candle-lit cake, presents on the table, string lights twinkling under the bunting, and garden lights glowing through the window.">
    <img id="master" src="still.jpg" alt="">
    <img class="bal b-red" src="bal-red.webp" alt="">
    <img class="bal b-yellow" src="bal-yellow.webp" alt="">
    <img class="bal b-teal" src="bal-teal.webp" alt="">
    <img class="bal b-purple" src="bal-purple.webp" alt="">
    <img class="bal b-pink" src="bal-pink.webp" alt="">
    <div class="glow" id="cakeAura"></div>
    <div class="glow flame" style="left:51.2%;top:43.2%;animation-duration:1.15s"></div>
    <div class="glow flame" style="left:53.8%;top:43%;animation-duration:1.4s;animation-delay:-.5s"></div>
    <div class="glow flame" style="left:56.3%;top:43.2%;animation-duration:1.05s;animation-delay:-.9s"></div>
    <div class="glow flame" style="left:58.8%;top:43%;animation-duration:1.3s;animation-delay:-.3s"></div>
    <div class="glow flame" style="left:61.4%;top:43.3%;animation-duration:1.2s;animation-delay:-.7s"></div>
    <div class="glow bulb" style="left:43.5%;top:6.8%;animation-duration:2.6s"></div>
    <div class="glow bulb" style="left:49.5%;top:10.8%;animation-duration:3.4s;animation-delay:-1.2s"></div>
    <div class="glow bulb" style="left:56%;top:12.8%;animation-duration:2.9s;animation-delay:-.6s"></div>
    <div class="glow bulb" style="left:63%;top:13.8%;animation-duration:3.9s;animation-delay:-2s"></div>
    <div class="glow bulb" style="left:70.5%;top:12.3%;animation-duration:2.4s;animation-delay:-1.6s"></div>
    <div class="glow bulb" style="left:77.5%;top:9.8%;animation-duration:3.1s;animation-delay:-.9s"></div>
    <div class="glow bulb" style="left:85%;top:7.3%;animation-duration:2.7s;animation-delay:-1.9s"></div>
    <div class="glow bulb" style="left:91%;top:9.5%;animation-duration:3.6s;animation-delay:-.4s"></div>
    <div class="glow bulb" style="left:8.3%;top:27.5%;animation-duration:4.2s;animation-delay:-1s"></div>
    <div class="glow bulb" style="left:11.2%;top:37.8%;animation-duration:3.3s;animation-delay:-2.2s"></div>
    <div class="glow bulb" style="left:16.5%;top:24.5%;animation-duration:4.7s;animation-delay:-.2s"></div>
    <div class="glow lant" style="left:28.7%;top:44.5%"></div>
    <div class="glow lant" style="left:95.3%;top:35.5%;animation-duration:5.4s;animation-delay:-2.4s"></div>
  </div>
  <div id="capPill"><b>The Birthday Room</b> · a living card scene</div>
  <div id="controls">
    <div class="grp">
      <button id="btnStill" type="button">Still</button>
      <button id="btnLiving" type="button" class="on">Living</button>
    </div>
  </div>
</div>
<script>
(() => {
"use strict";
if (location.hash === '#wall') document.body.classList.add('wallmode');
const btnStill = document.getElementById('btnStill');
const btnLiving = document.getElementById('btnLiving');
function setLiving(on){
  document.body.classList.toggle('still', !on);
  btnStill.classList.toggle('on', !on);
  btnLiving.classList.toggle('on', on);
}
btnStill.addEventListener('click', e => { e.stopPropagation(); setLiving(false); });
btnLiving.addEventListener('click', e => { e.stopPropagation(); setLiving(true); });
document.getElementById('stage').addEventListener('click', e => {
  if (e.target.closest('#controls')) return;
  if (document.body.classList.contains('wallmode')) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
});
let idleTimer = null;
function wake(){
  document.body.classList.remove('ui-hidden');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 4500);
}
window.addEventListener('pointermove', wake);
window.addEventListener('touchstart', wake, { passive: true });
wake();
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) setLiving(false);
})();
</script>
</body>
</html>
