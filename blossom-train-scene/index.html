<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Cherry-Blossom Train — Long Ride</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#1c1030; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('master.jpg') center/cover no-repeat; filter:blur(26px) brightness(.72); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:1248/704; width:min(100vw, 177.27dvh); max-height:100dvh; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,.55); background:#1c1030; }
  #poster { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .vid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #vidB { opacity:0; }
  #caption { position:absolute; left:50%; top:2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(30,12,34,.55); color:#ffeef6; font-size:clamp(10px, 2.6vw, 13px); letter-spacing:2.5px;
             padding:6px 14px; border-radius:999px; border:1px solid rgba(255,190,215,.5); pointer-events:none; }
  #picker { position:absolute; left:50%; bottom:2%; transform:translateX(-50%); z-index:6; display:flex; gap:4px; max-width:98%; }
  .pill { background:rgba(30,12,34,.62); color:#ffeef6; border:1px solid rgba(255,190,215,.5); border-radius:999px;
          font-family: Georgia, 'Times New Roman', serif; font-size:clamp(9px, 2.5vw, 12px); letter-spacing:.5px;
          padding:7px 8px; cursor:pointer; white-space:nowrap; }
  .pill.on { background:#ffd3e4; color:#1c1030; border-color:#ffd3e4; font-weight:bold; }
  #startbtn { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:9; display:none;
             background:rgba(30,12,34,.72); color:#ffd3e4; border:2px solid #ffd3e4; border-radius:999px;
             font-family: Georgia, 'Times New Roman', serif; font-size:clamp(17px, 5vw, 22px); letter-spacing:2px;
             padding:16px 30px; cursor:pointer; box-shadow:0 6px 30px rgba(0,0,0,.5); }
  #startbtn:active { background:rgba(255,211,228,.9); color:#1c1030; }
  body.wall #caption { display:none; }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame" data-clip="0">
    <img id="poster" src="master.jpg" alt="First-person ride on the Cherry-Blossom Train, down the blossom-lined track">
    <video class="vid" id="vidA" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
    <video class="vid" id="vidB" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
    <button id="startbtn" type="button">&#9654; START THE RIDE</button>
    <div id="caption">CHERRY-BLOSSOM TRAIN &middot; THE LONG RIDE</div>
    <div id="picker">
      <button class="pill" type="button" data-mode="station">STATION</button>
      <button class="pill" type="button" data-mode="river">RIVER</button>
      <button class="pill" type="button" data-mode="fields">TEA FIELDS</button>
      <button class="pill" type="button" data-mode="long">LONG RIDE</button>
    </div>
  </div>
</div>
<script>
  // Four ways to ride: the three routes (Station, River, Tea Fields)
  // and the Long Ride, which chains all three with dissolves and melts
  // back to the station start. Two stacked players crossfade every seam;
  // the next leg is always buffered in the hidden player. If the viewer
  // blocks autoplay, a START THE RIDE button appears; one tap starts it.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var LEGS = { station:'ride-station.mp4', river:'ride-river.mp4', fields:'ride-fields.mp4' };
    var LONG = ['ride-station.mp4', 'ride-river.mp4', 'ride-fields.mp4'];
    var frame = document.getElementById('frame');
    var A = document.getElementById('vidA'), B = document.getElementById('vidB');
    var btn = document.getElementById('startbtn');
    var pills = Array.prototype.slice.call(document.querySelectorAll('.pill'));
    var list = [LEGS.station], idx = 0, front = A, back = B, fading = false;
    function tryPlay(v){ var p = v.play(); if (p && p.catch) p.catch(function(){}); }
    function preload(v, i){ var src = list[i % list.length]; if (v.getAttribute('src') !== src) { v.src = src; v.load(); } }
    function fadeLen(){ if (list.length === 1) return 1.6; return (idx + 1) % list.length === 0 ? 2.5 : 1.4; }
    function crossTo(newList){
      list = newList;
      // quick fade into the new ride's first leg
      fading = true;
      back.src = list[0]; back.load(); back.currentTime = 0; tryPlay(back);
      var t0 = performance.now();
      (function step(){
        var k = Math.min(1, (performance.now() - t0) / 600);
        front.style.opacity = String(1 - k); back.style.opacity = String(k);
        if (k < 1) requestAnimationFrame(step);
        else { var f = front; front = back; back = f; idx = 0; frame.setAttribute('data-clip', '0'); back.pause(); preload(back, 1); fading = false; }
      })();
    }
    function swap(){
      fading = true;
      var F = fadeLen();
      back.currentTime = 0;
      tryPlay(back);
      var t0 = performance.now();
      (function step(){
        var k = Math.min(1, (performance.now() - t0) / (F * 1000));
        front.style.opacity = String(1 - k); back.style.opacity = String(k);
        if (k < 1) requestAnimationFrame(step);
        else { var f = front; front = back; back = f; idx = (idx + 1) % list.length; frame.setAttribute('data-clip', String(idx)); back.pause(); preload(back, idx + 1); fading = false; }
      })();
    }
    function setMode(mode){
      pills.forEach(function(p){ p.classList.toggle('on', p.getAttribute('data-mode') === mode); });
      crossTo(mode === 'long' ? LONG.slice() : [LEGS[mode]]);
    }
    pills.forEach(function(p){ p.addEventListener('click', function(){ if (!fading) setMode(p.getAttribute('data-mode')); }); });
    setInterval(function(){
      if (!fading && front.duration && front.currentTime > 0 && front.currentTime >= front.duration - fadeLen()) swap();
      btn.style.display = (front.paused && !fading) ? 'block' : 'none';
    }, 400);
    btn.addEventListener('click', function(){ tryPlay(front); });
    // Start: ?ride=long (or station/river/fields) picks the first ride.
    var start = (new URLSearchParams(location.search).get('ride') || 'station').toLowerCase();
    if (!LEGS[start] && start !== 'long') start = 'station';
    A.src = start === 'long' ? LONG[0] : LEGS[start];
    front.style.opacity = '1'; back.style.opacity = '0';
    list = start === 'long' ? LONG.slice() : [LEGS[start]];
    pills.forEach(function(p){ p.classList.toggle('on', p.getAttribute('data-mode') === start); });
    preload(B, 1);
    tryPlay(A);
    // Tap the scene: if the ride has not started (autoplay blocked inside
    // the Rides page frame), the tap STARTS it. Once playing, a tap closes.
    frame.addEventListener('click', function(e){
      if (e.target.closest && e.target.closest('.pill')) return;
      if (e.target.id === 'startbtn') return;
      if (front.paused) { tryPlay(front); return; }
      if (window.parent !== window) window.parent.postMessage('lc-close-fs', '*');
    });
  })();
  // (tap-to-close handler lives inside the engine, below)
</script>
</body>
</html>
