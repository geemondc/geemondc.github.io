<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boat Ride — Florida Intracoastal</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b1026; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('master.jpg') center/cover no-repeat; filter:blur(26px) brightness(.72); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:704/1248; width:min(100vw, 56.41dvh); max-height:100dvh; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,.55); background:#0b1026; }
  #poster { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .vid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #vidB { opacity:0; }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(9,14,34,.55); color:#ffeec2; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,210,62,.45); animation:capfade 9s ease forwards; }
  @keyframes capfade { 0%,70% { opacity:1; } 100% { opacity:.38; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <img id="poster" src="master.jpg" alt="First-person boat ride on the Florida Intracoastal at golden hour">
    <video class="vid" id="vidA" src="ride.mp4" muted playsinline autoplay preload="auto"></video>
    <video class="vid" id="vidB" src="ride.mp4" muted playsinline preload="auto"></video>
    <div id="caption">BOAT RIDE &middot; FLORIDA INTRACOASTAL</div>
  </div>
</div>
<script>
  // Endless ride: two stacked copies of the clip crossfade at the seam,
  // so the return to the start melts instead of jumping.
  (function(){
    var A = document.getElementById('vidA'), B = document.getElementById('vidB');
    var FADE = 2.0, front = A, back = B, fading = false;
    front.style.opacity = '1'; back.style.opacity = '0';
    function swap(){
      fading = true;
      back.currentTime = 0;
      var p = back.play(); if (p && p.catch) p.catch(function(){});
      var t0 = performance.now();
      (function step(){
        var k = Math.min(1, (performance.now() - t0) / (FADE * 1000));
        front.style.opacity = String(1 - k); back.style.opacity = String(k);
        if (k < 1) requestAnimationFrame(step);
        else { var f = front; front = back; back = f; back.pause(); fading = false; }
      })();
    }
    setInterval(function(){
      if (!fading && front.duration && front.currentTime > 0 && front.currentTime >= front.duration - FADE) swap();
    }, 200);
    // Tap anywhere: pause / resume the ride.
    var paused = false;
    document.getElementById('frame').addEventListener('click', function(){
      paused = !paused;
      [A, B].forEach(function(v){ if (paused) v.pause(); else if (v === front) { var p = v.play(); if (p && p.catch) p.catch(function(){}); } });
    });
  })();
</script>
</body>
</html>
