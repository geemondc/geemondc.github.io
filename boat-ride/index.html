<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boat Ride on the Florida Intracoastal</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#16283f; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center;
         background:linear-gradient(180deg,#274a7c 0%,#3a4a6e 45%,#101f33 100%); }
  #stage { position:relative; width:min(100vw, 56.25vh); aspect-ratio:9/16;
           box-shadow:0 0 60px rgba(0,0,0,.45); }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="scene" width="810" height="1440"></canvas></div>
<script>
"use strict";
/* Boat Ride on the Florida Intracoastal — an endless first-person living scene.
   The world is Gary's Manus master painting, cut into layers; the natives come
   from his element sheet. Shores parade past forever (recycled with flip/tint
   variants, staggered cycles), water flows toward the viewer, the raised
   drawbridge is a periodic event, and our bow never moves. The frame NEVER rocks. */
const DW = 1440, DH = 2560, HORIZON = 988;
const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
ctx.scale(cv.width / DW, cv.width / DW);

const FILES = ["distant.webp","water.jpg","sparkle.webp","cloud1.webp","cloud2.webp",
  "cloud3.webp","shoreL_a.webp","shoreL_b.webp","shoreR_a.webp","shoreR_b.webp",
  "bow.webp","foamL.webp","foamR.webp","pelican.webp","boatL.webp","boatR.webp",
  "el_boat.webp","el_glide.webp","el_dive.webp","el_dolphin.webp","el_marker.webp",
  "el_dock.webp","el_palms.webp","el_bridge.webp"];
const IMG = {};
let ready = 0;
FILES.forEach(f => { const i = new Image(); i.onload = i.onerror = () => ready++;
                     i.src = f; IMG[f] = i; });

function variant(img, flip, tint) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d');
  if (tint) x.filter = tint;
  if (flip) { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(img, 0, 0); return c;
}
/* shore parade pools: {img, dw} — dw = design width at scale 1 */
let SHORE = null;
function buildShores() {
  const P = (img, dw) => ({ img, dw });
  const La = IMG["shoreL_a.webp"], Lb = IMG["shoreL_b.webp"],
        Ra = IMG["shoreR_a.webp"], Rb = IMG["shoreR_b.webp"],
        dk = IMG["el_dock.webp"], pl = IMG["el_palms.webp"];
  SHORE = {
    L: [P(La, La.naturalWidth / 0.78), P(Lb, Lb.naturalWidth / 0.78),
        P(variant(La, true, null), La.naturalWidth / 0.78),
        P(variant(Lb, true, "brightness(1.06) saturate(1.05)"), Lb.naturalWidth / 0.78),
        P(variant(pl, true, null), 450), P(variant(dk, true, null), 730)],
    R: [P(Ra, Ra.naturalWidth / 0.78), P(Rb, Rb.naturalWidth / 0.78),
        P(variant(Ra, true, null), Ra.naturalWidth / 0.78),
        P(variant(Rb, true, "brightness(1.05) hue-rotate(-4deg)"), Rb.naturalWidth / 0.78),
        P(pl, 450), P(dk, 730)]
  };
}

/* soft shadow / wake blobs, pre-rendered */
function blob(rgba) {
  const c = document.createElement('canvas'); c.width = 240; c.height = 64;
  const x = c.getContext('2d'), g = x.createRadialGradient(120, 32, 4, 120, 32, 118);
  g.addColorStop(0, rgba); g.addColorStop(1, "rgba(0,0,0,0)");
  x.save(); x.translate(120, 32); x.scale(1, 64 / 240); x.translate(-120, -32);
  x.fillStyle = g; x.fillRect(0, -88, 240, 240); x.restore(); return c;
}
const shadowC = blob("rgba(8,35,55,0.50)"), wakeC = blob("rgba(255,255,255,0.55)");
function drawShadow(cx, y, w, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.drawImage(shadowC, cx - w / 2, y - w * 0.13, w, w * 0.27); ctx.restore();
}

/* sky gradient, cached */
const skyC = document.createElement('canvas'); skyC.width = 720; skyC.height = 500;
{ const x = skyC.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 500);
  g.addColorStop(0.00, "#2c5fc4"); g.addColorStop(0.30, "#6f7fd0");
  g.addColorStop(0.52, "#d98bb4"); g.addColorStop(0.72, "#f7a56b");
  g.addColorStop(0.88, "#ffc46b"); g.addColorStop(1.00, "#ffd98a");
  x.fillStyle = g; x.fillRect(0, 0, 720, 500); }

/* patch that hides the painted (closed) bridge while the raised-bridge event plays */
const patchC = document.createElement('canvas'); patchC.width = 620; patchC.height = 230;
{ const x = patchC.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 230);
  g.addColorStop(0, "#f6a768"); g.addColorStop(0.55, "#f7b96e"); g.addColorStop(0.82, "#d9a06a");
  g.addColorStop(1, "#4d93a8");
  x.filter = "blur(20px)"; x.fillStyle = g;
  x.beginPath(); x.roundRect(6, 6, 608, 218, 70); x.fill(); }

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPD = reduced ? 0.35 : 1;
const frac = v => v - Math.floor(v);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const T0OFF = parseFloat(new URLSearchParams(location.search).get('t0') || '0') || 0;
const HIDE = new URLSearchParams(location.search).get('hide') || '';

/* ---------- water: true perspective flow — source advance proportional to
   screen advance (depth-consistent), so ripples never smear or squash ---------- */
function drawWater(t) {
  const tex = IMG["water.jpg"]; if (!tex.naturalWidth) return;
  const TW = tex.naturalWidth, TH = tex.naturalHeight;
  const scroll = t * 21 * SPD, NS = 90;
  const dep = s => 1 / (1.07 - s), dMin = dep(0), dMax = dep(1);
  const yOf = s => (HORIZON - 16) + (DH - HORIZON + 16) * (dep(s) - dMin) / (dMax - dMin);
  for (let i = 0; i < NS; i++) {
    const s0 = i / NS, s1 = (i + 1) / NS;
    const y0 = yOf(s0), y1 = yOf(s1);
    let v0 = scroll + dep(s0) * 84, v1 = scroll + dep(s1) * 84, yy = y0;
    while (v0 < v1 - 0.01) {
      const tile = Math.floor(v0 / TH), within = v0 - tile * TH;
      const take = Math.min(TH - within, v1 - v0), yEnd = yy + (y1 - y0) * (take / (v1 - v0));
      ctx.save();
      if (tile % 2) { ctx.translate(DW, 0); ctx.scale(-1, 1); }
      ctx.drawImage(tex, 0, within, TW, take, 0, yy, DW, (yEnd - yy) + 1.2);
      ctx.restore();
      v0 += take; yy = yEnd;
    }
  }
}

/* ---------- sparkle on the sun path ---------- */
function drawSparkle(t) {
  const sp = IMG["sparkle.webp"]; if (!sp.naturalWidth) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const layers = [[42, 0.24, 1.7, 0], [68, 0.18, 2.3, 2.1]];
  for (const [spd, base, wob, ph] of layers) {
    ctx.globalAlpha = base + 0.11 * Math.sin(t * wob + ph);
    const off = (t * spd * SPD) % 900;
    for (let y = -900 + off; y < 1000; y += 900)
      ctx.drawImage(sp, 480, 995 + y, 960, 900);
  }
  ctx.restore();
}

/* ---------- the raised drawbridge: a periodic event (cycle 165s) ---------- */
function drawBridge(t) {
  const img = IMG["el_bridge.webp"]; if (!img.naturalWidth) return;
  const lt = t % 165;
  if (lt > 96) return;
  let w, yb, alpha = 1;
  if (lt < 80) { const q = Math.pow(lt / 80, 1.35); w = 190 + 770 * q; yb = 990 + 330 * Math.pow(lt / 80, 1.6); }
  else { const q = (lt - 80) / 16; w = 960 + 1290 * q; yb = 1320 + 480 * q; alpha = 1 - clamp01((q - 0.72) / 0.28); }
  const pA = clamp01((lt - 6) / 14) * (lt > 88 ? 1 - clamp01((lt - 88) / 8) : 1);
  if (pA > 0) { ctx.save(); ctx.globalAlpha = pA * 0.93; ctx.drawImage(patchC, 410, 795, 620, 230); ctx.restore(); }
  const h = w * img.naturalHeight / img.naturalWidth;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.drawImage(img, DW / 2 - w / 2, yb - h, w, h); ctx.restore();
}

/* ---------- parading shores ---------- */
function drawShore(side, t) {
  const pool = SHORE[side]; if (!pool) return;
  const T = side === "L" ? 67 : 73, off = side === "L" ? 0 : 0.37;
  for (let k = 0; k < 3; k++) {
    const cyc = t / T + k / 3 + off, p = frac(cyc);
    const e = pool[(Math.floor(cyc) + k) % pool.length];
    const s = 0.40 + 0.85 * Math.pow(p, 1.3), w = e.dw * s;
    const h = w * e.img.height / e.img.width;
    const yb = 992 + p * 600, y = yb - h;
    const x = side === "L" ? -p * 150 - w * 0.02 : DW - w + p * 150 + w * 0.02;
    ctx.globalAlpha = clamp01(p / 0.06) * (p > 0.82 ? (1 - p) / 0.18 : 1);
    ctx.drawImage(e.img, x, y, w, h);
  }
  ctx.globalAlpha = 1;
}

/* ---------- passing moored boats (from the painting) ---------- */
function drawBoat(img, side, t, off) {
  if (!img.naturalWidth) return;
  const p = frac(t / 30 + off); if (p > 0.96) return;
  const s = 0.55 + 0.75 * p, w = img.naturalWidth * s, h = img.naturalHeight * s;
  const yb = 1005 + 380 * p, y = yb - h;
  const inset = 330 - 320 * p;
  const x = side === "L" ? inset : DW - inset - w;
  ctx.globalAlpha = clamp01(p / 0.08) * (p > 0.8 ? (1 - p) / 0.2 : 1);
  ctx.drawImage(img, x, y, w, h); ctx.globalAlpha = 1;
}

/* ---------- the sheet's side-view boat, crossing the far channel ---------- */
function drawPassBoat(t) {
  const img = IMG["el_boat.webp"]; if (!img.naturalWidth) return;
  const lt = t % 85; if (lt > 32) return;
  const p = lt / 32, w = 400, h = w * img.naturalHeight / img.naturalWidth;
  const x = -w - 60 + (DW + w + 120) * p, yb = 1130 + Math.sin(t * 1.3) * 3;
  ctx.save(); ctx.globalAlpha = 0.10;                       /* reflection */
  ctx.translate(0, 2 * (yb + 6)); ctx.scale(1, -0.38); ctx.drawImage(img, x, yb - h, w, h); ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.5 + 0.2 * Math.sin(t * 2.2);  /* wake streak */
  ctx.drawImage(wakeC, x - w * 0.55, yb - 8, w * 0.75, w * 0.16); ctx.restore();
  drawShadow(x + w / 2, yb + 8, w * 0.9, 0.5);
  ctx.drawImage(img, x, yb - h, w, h);
}

/* ---------- red channel marker, sliding past the right edge ---------- */
function drawMarker(t) {
  const img = IMG["el_marker.webp"]; if (!img.naturalWidth) return;
  const p = frac(t / 47), s = 0.14 + 0.95 * Math.pow(p, 1.25);
  const w = 265 * s, h = w * img.naturalHeight / img.naturalWidth;
  const x = 1045 + 300 * p, yb = 995 + 565 * p;
  ctx.save(); ctx.globalAlpha = clamp01(p / 0.05) * (p > 0.9 ? (1 - p) / 0.1 : 1);
  drawShadow(x + w / 2, yb, w * 1.05, 0.7);
  ctx.drawImage(img, x, yb - h, w, h); ctx.restore();
}

/* ---------- clouds ---------- */
const CLOUDS = [
  { f: "cloud1.webp", x: -120, y: 30,  v: 2.4, w: 560 },
  { f: "cloud2.webp", x: 620,  y: 250, v: 3.4, w: 540 },
  { f: "cloud3.webp", x: 1080, y: 55,  v: 2.9, w: 430 },
];
function drawClouds(t) {
  for (const c of CLOUDS) {
    const img = IMG[c.f]; if (!img.naturalWidth) continue;
    const span = DW + c.w * 2, x = ((c.x + t * c.v * SPD) % span) - c.w;
    ctx.globalAlpha = 0.95;
    ctx.drawImage(img, x, c.y, c.w, c.w * img.naturalHeight / img.naturalWidth);
  }
  ctx.globalAlpha = 1;
}

/* ---------- pelicans: painting bird + sheet glider alternate; the diver is rare ---------- */
function drawPelican(t) {
  const cyc = Math.floor(t / 52), lt = t - cyc * 52;
  const img = cyc % 2 ? IMG["el_glide.webp"] : IMG["pelican.webp"];
  if (!img.naturalWidth || lt > 24) return;
  const p = lt / 24, ltr = cyc % 2 === 0;
  const w = 350, h = w * img.naturalHeight / img.naturalWidth;
  const x = ltr ? -w + (DW + w) * p : DW - (DW + w) * p;
  const y = 300 + (cyc % 3) * 45 + Math.sin(p * 9) * 14;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(Math.sin(p * 9 + 1) * 0.03); ctx.scale(ltr ? 1 : -1, 1 + 0.03 * Math.sin(t * 5));
  ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
}
function drawDiver(t) {
  const img = IMG["el_dive.webp"]; if (!img.naturalWidth) return;
  const lt = t % 97;
  if (lt < 3.4) {
    const p = lt / 3.4, w = 150, h = w * img.naturalHeight / img.naturalWidth;
    ctx.save(); ctx.translate(240 + 900 * p, 240 + 700 * p * p);
    ctx.rotate(-0.2 + 0.3 * p); ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
  } else if (lt < 4.8) {                                   /* splash ring where it went in */
    const q = (lt - 3.4) / 1.4;
    ctx.save(); ctx.globalAlpha = (1 - q) * 0.75; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(1140, 1088, 30 + 90 * q, (30 + 90 * q) * 0.32, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
}

/* ---------- dolphin leaping beside the bow ---------- */
function drawDolphin(t) {
  const img = IMG["el_dolphin.webp"]; if (!img.naturalWidth) return;
  const CYC = 74, cyc = Math.floor(t / CYC), lt = t - cyc * CYC;
  if (lt > 3.2) return;
  const p = lt / 3.2, left = cyc % 2 === 0;
  const cx = (left ? 305 : DW - 305) + (left ? -45 : 45) * p;
  const w = 335, h = w * img.naturalHeight / img.naturalWidth;
  const y = 1620 - Math.sin(p * Math.PI) * 335;
  ctx.save(); ctx.translate(cx, y); ctx.rotate(-0.55 + 1.1 * p); ctx.scale(left ? -1 : 1, 1);
  ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
  const ring = (q, rx) => { if (q < 0 || q > 1) return;
    ctx.save(); ctx.globalAlpha = (1 - q) * 0.7; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(rx, 1632, 26 + 80 * q, (26 + 80 * q) * 0.32, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); };
  ring(p / 0.22, left ? 268 : DW - 268); ring((p - 0.8) / 0.2, left ? 348 : DW - 348);
}

/* ---------- frame ---------- */
let T0 = null;
function frame(ts) {
  requestAnimationFrame(frame);
  if (T0 === null) T0 = ts;
  const t = (ts - T0) / 1000 + T0OFF;
  ctx.clearRect(0, 0, DW, DH);
  ctx.drawImage(skyC, 0, 0, DW, 1000);
  const pulse = 0.5 + 0.05 * Math.sin(t * 0.6);
  const g = ctx.createRadialGradient(945, 872, 10, 945, 872, 300);
  g.addColorStop(0, `rgba(255,240,180,${pulse})`); g.addColorStop(1, "rgba(255,240,180,0)");
  ctx.fillStyle = g; ctx.fillRect(600, 540, 760, 640);
  drawClouds(t);
  if (IMG["distant.webp"].naturalWidth) ctx.drawImage(IMG["distant.webp"], 0, 795, DW, 197);
  if (!HIDE.includes('water')) drawWater(t);
  { const dg = ctx.createLinearGradient(0, HORIZON, 0, DH);   /* depth shading over the detrended water */
    dg.addColorStop(0, "rgba(7,52,74,0)"); dg.addColorStop(1, "rgba(7,52,74,0.20)");
    ctx.fillStyle = dg; ctx.fillRect(0, HORIZON, DW, DH - HORIZON); }
  if (!HIDE.includes('sparkle')) drawSparkle(t);
  if (!HIDE.includes('bridge')) drawBridge(t);
  if (!HIDE.includes('passboat')) drawPassBoat(t);
  if (!HIDE.includes('movers')) {
    drawShore("L", t); drawShore("R", t);
    drawBoat(IMG["boatL.webp"], "L", t, 0); drawBoat(IMG["boatR.webp"], "R", t, 0.5);
    drawMarker(t);
    drawDolphin(t);
  }
  const fl = IMG["foamL.webp"], fr = IMG["foamR.webp"];
  if (fl.naturalWidth) {
    ctx.globalAlpha = 0.88 + 0.11 * Math.sin(t * 1.4);
    ctx.drawImage(fl, 0, 1650, 520, 610);
    ctx.globalAlpha = 0.88 + 0.11 * Math.sin(t * 1.4 + 2.2);
    ctx.drawImage(fr, DW - 520, 1650, 520, 610);
    ctx.globalAlpha = 1;
  }
  if (IMG["bow.webp"].naturalWidth) ctx.drawImage(IMG["bow.webp"], 0, 1740, DW, 820);
  drawPelican(t);
  drawDiver(t);
}
const iv = setInterval(() => {
  if (ready >= FILES.length) { clearInterval(iv); buildShores(); requestAnimationFrame(frame); }
}, 120);
document.addEventListener('visibilitychange', () => { T0 = null; });
</script>
</body>
</html>
