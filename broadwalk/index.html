<script>
(function(){
  "use strict";
  var T = 60;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living' (the PAGE's mode)
  var started = false;        // the wall clock has been started
  var frozen = null;          // QA: freeze the clock at this many seconds
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  var anchor = 0;             // scene seconds at anchorNow (phase anchor)
  var anchorNow = 0;          // performance.now() at the anchor
  var clock = 0;              // current scene clock, seconds (QA state)

  function stack(p){
    return {
             day: document.getElementById(p+'Day'),
             gold: document.getElementById(p+'Gold'),
             dusk: document.getElementById(p+'Dusk'),
             night: document.getElementById(p+'Night'),
             accLampA: document.getElementById(p+'AccLampA'),
             accLampB: document.getElementById(p+'AccLampB'),
             accLampC: document.getElementById(p+'AccLampC'),
             accWinNear: document.getElementById(p+'AccWinNear'),
             accWinFar: document.getElementById(p+'AccWinFar'),
             accWinWake: document.getElementById(p+'AccWinWake'),
             accTerrace: document.getElementById(p+'AccTerrace'),
             accNeon: document.getElementById(p+'AccNeon'),
             accSparkA: document.getElementById(p+'AccSparkA'),
             accSparkB: document.getElementById(p+'AccSparkB'),
             accSparkC: document.getElementById(p+'AccSparkC'),
             accSparkCool: document.getElementById(p+'AccSparkCool'),
             accStarsA: document.getElementById(p+'AccStarsA'),
             accStarsB: document.getElementById(p+'AccStarsB'),
             accTwkA: document.getElementById(p+'AccTwkA'),
             accTwkB: document.getElementById(p+'AccTwkB'),
             accTwkC: document.getElementById(p+'AccTwkC'),
             accStarsC: document.getElementById(p+'AccStarsC'),
             accFwA1: document.getElementById(p+'AccFwA1'),
             accFwA2: document.getElementById(p+'AccFwA2'),
             accFwA3: document.getElementById(p+'AccFwA3'),
             accFwAr: document.getElementById(p+'AccFwAr'),
             accFwB1: document.getElementById(p+'AccFwB1'),
             accFwB2: document.getElementById(p+'AccFwB2'),
             accFwB3: document.getElementById(p+'AccFwB3'),
             accFwBr: document.getElementById(p+'AccFwBr'),
             accFwC1: document.getElementById(p+'AccFwC1'),
             accFwC2: document.getElementById(p+'AccFwC2'),
             accFwC3: document.getElementById(p+'AccFwC3'),
             accFwCr: document.getElementById(p+'AccFwCr')
    };
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsWrap = document.getElementById('fsWrap');
  var fsOpen = false;

  // Fullscreen letterbox geometry: the wrap is sized to the whole picture
  // fitted inside the screen (contain), centred, so the cropped accent
  // layers (positioned in % of the picture) line up at any screen shape.
  function fitFs(){
    var vw = window.innerWidth, vh = window.innerHeight, ar = 2560 / 1440;
    var w = vw, h = vw / ar;
    if (h > vh) { h = vh; w = vh * ar; }
    fsWrap.style.left = ((vw - w) / 2) + 'px';
    fsWrap.style.top = ((vh - h) / 2) + 'px';
    fsWrap.style.width = w + 'px';
    fsWrap.style.height = h + 'px';
  }
  window.addEventListener('resize', function(){ if (fsOpen) fitFs(); });

  // The journey (60s): as painted (the crossroads) -> gold swell -> dusk ->
  // nightfall -> back through dusk and gold -> as painted. Nested plates:
  // gold under dusk under night; the return fades the plates out in reverse
  // order with overlaps, so the scene travels home through the same light.
  // t=60 wraps exactly to t=0: seamless.
  function opacities(t){
    t = ((t % T) + T) % T;
    var gold = 0, dusk = 0, night = 0;
    if (t >= 4 && t < 12) gold = (t - 4) / 8;
    else if (t >= 12 && t < 50) gold = 1;
    else if (t >= 50) gold = 1 - (t - 50) / 8;
    if (t >= 16 && t < 25) dusk = (t - 16) / 9;
    else if (t >= 25 && t < 52) dusk = 1;
    else if (t >= 52) dusk = 1 - (t - 52) / 8;
    if (t >= 30 && t < 38) night = (t - 30) / 8;
    else if (t >= 38 && t < 52) night = 1;
    else if (t >= 52) night = 1 - (t - 52) / 8;
    return { day:1, gold:gold, dusk:dusk, night:night };
  }
  // Accents, each in its own colour on its own slow rhythm. Envelopes:
  // 'lamp' - lamps, lit windows and terrace lights stand out more as the
  // scene deepens; 'wake' - the waking glass and the neon arrive with dusk
  // and own the night; 'path' - the sun-path glitter rides the gold plate
  // and retires as night takes the water; 'deep3' (stars) / 'deep2' (water flecks) - STAR-DOSE LAW: the
  // painting's own stars and the cool moon-glitter gain nothing until the
  // deep phase (night^2 gate); point size never changes.
  // Periods divide the 60s loop (or their envelope is shut at the seam),
  // so every accent is continuous across the wrap.
  // [key, period, phase, max, envelope, pulse floor]
  var ACC = [ ['accLampA',    15, 0.0, 1.00, 'lamp', 0.53],
              ['accLampB',    12, 3.0, 1.00, 'lamp', 0.53],
              ['accLampC',    20, 7.0, 1.00, 'lamp', 0.53],
              ['accWinNear',  10, 1.0, 1.00, 'lamp', 0.48],
              ['accWinFar',   15, 5.0, 1.00, 'lamp', 0.48],
              ['accWinWake',  12, 8.0, 1.00, 'wake', 0.25],
              ['accTerrace',  20, 2.0, 1.00, 'lamp', 0.48],
              ['accNeon',     15, 4.0, 1.00, 'wake', 0.50],
              ['accSparkA',    9, 0.0, 0.95, 'path', 0.30],
              ['accSparkB',   13, 4.2, 0.95, 'path', 0.30],
              ['accSparkC',   17, 8.9, 0.95, 'path', 0.30],
              ['accSparkCool',13, 6.0, 0.90, 'deep2', 0.30],
              ['accStarsA',   13, 0.0, 1.00, 'deep3', 0.30],
              ['accStarsB',   17, 5.0, 1.00, 'deep3', 0.30],
              ['accTwkA',     11, 0.0, 0.95, 'deep2', 0.35],
              ['accTwkB',     15, 5.0, 0.95, 'deep2', 0.35],
              ['accTwkC',     19, 9.0, 0.95, 'deep2', 0.35],
              ['accStarsC',   11, 2.0, 1.00, 'deep3', 0.30] ];
  function accOpacities(t){
    var so = opacities(t);
    var env = { lamp: 0.15 + 0.85 * Math.max(0.55 * so.gold, 0.8 * so.dusk, so.night),
                wake: 0.10 + 0.90 * Math.max(0.7 * so.dusk, so.night),
                path: so.gold * (1 - 0.75 * so.night),
                deep2: so.night * so.night,
                deep3: so.night * so.night * so.night };
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);
      o[a[0]] = a[3] * env[a[4]] * (a[5] + (1 - a[5]) * p);
    }

    return o;

  // Fireworks over the water — a night accent, light only. Three bursts

  // quiet sky between them: gold, rose, teal. Each burst blooms tight and

  // Everything is gated by the night plate itself, so no firework can show
  // in day, gold or dusk. Stage layers grow as they bloom (scale), the way
  // a real shell opens. [key, start (s in loop), duration (s)]
  var FW = [ ['A', 38.8, 3.4], ['B', 43.5, 3.2], ['C', 47.9, 3.2] ];

  function fwOpacities(t){
    var night = opacities(t).night, o = {};
    for (var i = 0; i < FW.length; i++){
      var k = FW[i][0], u = (t - FW[i][1]) / FW[i][2];
      var s1 = 0, s2 = 0, s3 = 0, rf = 0, sc1 = 0.55, sc2 = 0.80;
      if (u > 0 && u < 1){
        s1 = 0.95 * trap(u, 0, 0.05, 0.30, 0.58);
        s2 = 0.90 * trap(u, 0.14, 0.42, 0.62, 0.86);
        s3 = 0.80 * trap(u, 0.40, 0.62, 0.80, 1.0);
        rf = 0.60 * trap(u, 0, 0.08, 0.45, 1.0) * (0.92 + 0.08 * Math.sin(t * 7 + i * 2.1));
        sc1 = 0.55 + 0.30 * Math.min(1, u / 0.58);
        sc2 = 0.80 + 0.20 * Math.min(1, Math.max(0, (u - 0.14) / 0.72));
      }
      o['accFw' + k + '1'] = night * s1;
      o['accFw' + k + '2'] = night * s2;
      o['accFw' + k + '3'] = night * s3;
      o['accFw' + k + 'r'] = night * rf;
      o['scFw' + k + '1'] = sc1;
      o['scFw' + k + '2'] = sc2;
    }
    return o;
  }
  function applyFw(st, fo, living){
    for (var i = 0; i < FW.length; i++){
      var k = FW[i][0];
      st['accFw' + k + '1'].style.opacity = living ? fo['accFw' + k + '1'] : 0;
      st['accFw' + k + '2'].style.opacity = living ? fo['accFw' + k + '2'] : 0;
      st['accFw' + k + '3'].style.opacity = living ? fo['accFw' + k + '3'] : 0;
      st['accFw' + k + 'r'].style.opacity = living ? fo['accFw' + k + 'r'] : 0;
      st['accFw' + k + '1'].style.transform = 'scale(' + fo['scFw' + k + '1'] + ')';
      st['accFw' + k + '2'].style.transform = 'scale(' + fo['scFw' + k + '2'] + ')';
    }
  }
  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.gold.style.opacity = living ? so.gold : 0;
    st.dusk.style.opacity = living ? so.dusk : 0;
    st.night.style.opacity = living ? so.night : 0;
    for (var i = 0; i < ACC.length; i++){
      var k = ACC[i][0];
      st[k].style.opacity = living ? ao[k] : 0;
    }
  }
  function frame(now){
    // Scene time is a pure function of wall time (performance.now) since
    // the clock started: frame rate or throttling can never stretch the
    // 60s cycle, and entering/leaving fullscreen never touches the clock.
    if (started && frozen === null) clock = anchor + (now - anchorNow) / 1000;
    var t = frozen !== null ? frozen : clock;
    var so = opacities(t), ao = accOpacities(t);
    apply(page, so, ao, state === 'living');
    var fo = fwOpacities(t);
    applyFw(page, fo, state === 'living');
    if (fsOpen){ apply(fs, so, ao, true); applyFw(fs, fo, true); }   // fullscreen is ALWAYS living
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ensureClock(){
    if (!started){ started = true; anchor = 0; anchorNow = performance.now(); clock = 0; }
  }
  function ignite(){
    ensureClock();
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    if (!started){ ignite(); return; }
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  // Fullscreen changes size, never the page's mode: it always shows the
  // picture LIVING with the loop running (tapping the picture starts the
  // clock if needed); exit restores the page exactly as it was.
  function openFs(){
    ensureClock();
    fsOpen = true; fitFs(); fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsEl.style.display = 'none';
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape' || e.key)) closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ if (frozen !== null){ frozen = null; anchor = clock; anchorNow = performance.now(); } },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : clock); },
    fwAt: function(t){ return fwOpacities(t); },
    state: function(){ return { state: state, fsOpen: fsOpen, clock: clock, started: started }; },
    opacities: opacities
  };
})();
</script>
</body>
</html>
