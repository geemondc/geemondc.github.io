<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trimming the Tree — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#2a0a0a; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#2a0a0a;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.02) translate(0.4%,0.2%); } to { transform:scale(1.10) translate(-1.1%,-0.6%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #glow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 7s ease-in-out infinite alternate;
         background:radial-gradient(44% 58% at 47% 32%, rgba(255,214,130,.46), rgba(255,180,90,.13) 55%, rgba(255,170,80,0) 78%); }
  @keyframes breathe { from { opacity:.32 } to { opacity:1 } }
  .tl { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        animation:twk ease-in-out infinite alternate; }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.55); filter:brightness(.65) } to { transform:translate(-50%,-50%) scale(1.5); filter:brightness(1.4) } }
  #starGlow { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,230,150,.95), rgba(255,196,80,.4) 55%, rgba(255,180,80,0) 78%);
        animation:starPulse 3.2s ease-in-out infinite alternate; }
  @keyframes starPulse { from { transform:translate(-50%,-50%) scale(.8); opacity:.55 } to { transform:translate(-50%,-50%) scale(1.25); opacity:1 } }
  #fire { position:absolute; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,190,90,.85), rgba(255,120,40,.32) 55%, rgba(255,100,30,0) 78%);
          animation:flick 1.7s ease-in-out infinite; }
  #fireCore { position:absolute; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,240,190,.95), rgba(255,180,80,.4) 55%, rgba(255,160,60,0) 78%);
          animation:flick 0.95s ease-in-out infinite reverse; }
  @keyframes flick { 0% { opacity:.5 } 22% { opacity:.92 } 41% { opacity:.62 } 63% { opacity:1 } 82% { opacity:.7 } 100% { opacity:.5 } }
  .steam { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
        background:radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
        animation:steamUp 3.6s ease-in-out infinite; }
  @keyframes steamUp { 0% { transform:translate(-50%,0) scale(.5); opacity:0 } 30% { opacity:.55 } 100% { transform:translate(-38%,-46px) scale(1.5); opacity:0 } }
  #snow { position:absolute; left:59.5%; top:1.5%; width:27%; height:38%; overflow:hidden; pointer-events:none; }
  .flake { position:absolute; top:-4%; border-radius:50%; pointer-events:none;
           background:radial-gradient(closest-side, rgba(255,255,255,.98), rgba(235,245,255,.55) 60%, rgba(235,245,255,0) 80%);
           animation:fall linear infinite; will-change:transform; }
  @keyframes fall { 0% { transform:translate(0,-3vh); opacity:0 } 8% { opacity:1 } 50% { transform:translate(1.1vw,15vh) } 92% { opacity:1 } 100% { transform:translate(-0.6vw,30vh); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(69,10,10,.58); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #glow, .tl, #starGlow, #fire, #fireCore, .steam, .flake { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends trimming the tree on Christmas Eve — Goggles placing the star on top, Braids hanging a candy cane, Teal holding a red ornament, Phones stringing the lights, Pink with the big red gift, Cap handing Puff a present, Beanie polishing a bauble, the fireplace lit and the cat asleep by the presents">
    </div>
    <div id="glow"></div>
    <div id="fx"></div>
    <div id="snow"></div>
    <div id="caption">TRIMMING THE TREE</div>
  </div>
</div>
<script>
  // Trimming the Tree (Gary's living standard): the painting stays exactly itself; the tree lights twinkle in their own colors, the star breathes at the top, the fireplace flickers at the left, the string lights in Phones' hands chase warm, steam rises off the cocoa mugs, and snow falls past the big window. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    var palette = ['255,209,102', '255,89,100', '126,217,87', '77,178,232', '255,243,196'];
    function light(x, y, ci, size, dur, delay){
      var c = palette[ci % palette.length];
      return '<div class="tl" style="left:' + x + '%;top:' + y + '%;width:' + size + '%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(' + c + ',.98), rgba(' + c + ',.34) 55%, rgba(' + c + ',0) 78%);animation-duration:' + dur + 's;animation-delay:-' + delay + 's"></div>';
    }
    // tree lights — scattered over the tree (apex x~47%, widening to x 34-61% at the base, y 12-68%)
    var tree = [[45,14],[50,14],[43,20],[47,20],[52,20],[41,27],[46,27],[51,27],[55,27],[39,34],[44,34],[49,34],[54,34],[58,34],[37,42],[42,42],[47,42],[52,42],[57,42],[60,42],[36,50],[41,50],[46,50],[51,50],[56,50],[60,50],[35,58],[40,58],[45,58],[50,58],[55,58],[59,58],[36,66],[42,66],[48,66],[54,66],[58,66]];
    for (var i = 0; i < tree.length; i++){
      html += light(tree[i][0], tree[i][1], i, (0.55 + (i % 3) * 0.18).toFixed(2), (1.5 + (i % 5) * 0.35).toFixed(2), (i * 0.37).toFixed(2));
    }
    // mantel garland lights (top left) and staircase garland (right), warm gold
    var gar = [[3,7],[8,5.5],[13,7],[16,10],[93,10],[97,16],[95,23]];
    for (var g = 0; g < gar.length; g++){
      html += light(gar[g][0], gar[g][1], 0, 0.62, (2 + (g % 4) * 0.4).toFixed(1), (g * 0.55).toFixed(2));
    }
    // the string lights in Phones' hands chase warm (x 76-88%, y 30-55%)
    var string = [[79,34],[83,40],[80,47],[85,52]];
    for (var s = 0; s < string.length; s++){
      html += light(string[s][0], string[s][1], 0, 0.7, 1.1, (s * 0.28).toFixed(2));
    }
    // the star on top of the tree breathes — the biggest glow on the painting
    html += '<div id="starGlow" style="left:47.5%;top:4%;width:4.6%;aspect-ratio:1"></div>';
    // fireplace glow, far left — a broad flicker and a hotter core
    html += '<div id="fire" style="left:0.4%;top:47.5%;width:6.5%;aspect-ratio:0.75"></div>';
    html += '<div id="fireCore" style="left:2.1%;top:52%;width:3%;aspect-ratio:0.85"></div>';
    // steam rising off the cocoa mugs on the table
    var mugs = [[42.5,80],[57,81.5],[68,82.5],[77,83]];
    for (var m = 0; m < mugs.length; m++){
      html += '<div class="steam" style="left:' + mugs[m][0] + '%;top:' + mugs[m][1] + '%;width:1.6%;aspect-ratio:1.6;animation-delay:-' + (m * 0.9).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
    // snow falling past the big window (right of the tree) — real travel
    var snow = document.getElementById('snow'), shtml = '';
    for (var f = 0; f < 26; f++){
      var lx = (2 + (f * 37) % 94), sz = (2.2 + (f % 4) * 1.1).toFixed(1), dur = (5.5 + (f % 6) * 0.9).toFixed(1), del = (f * 0.83).toFixed(2);
      shtml += '<div class="flake" style="left:' + lx + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
    }
    snow.innerHTML = shtml;
  })();
</script>
</body>
</html>
