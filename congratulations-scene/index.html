<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Big Win — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#17301f; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.6); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#17301f;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 11s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* midday sun breathing over the garden */
  #sun { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite alternate;
         background:radial-gradient(60% 55% at 50% 0%, rgba(255,244,190,.30), rgba(255,244,190,.06) 55%, rgba(255,244,190,0) 78%); }
  @keyframes breathe { from { opacity:.55 } to { opacity:1 } }
  /* the trophy catches the light */
  #glint { position:absolute; left:30.5%; top:10%; width:13%; aspect-ratio:1; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
           background:radial-gradient(closest-side, rgba(255,246,200,.85), rgba(255,220,120,.25) 55%, rgba(255,220,120,0) 78%);
           animation:glint 4.6s ease-in-out infinite alternate; }
  @keyframes glint { from { transform:translate(-50%,-50%) scale(.8); opacity:.45 } to { transform:translate(-50%,-50%) scale(1.15); opacity:1 } }
  /* the balloons bob — soft light where they ride */
  .bob { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
         background:radial-gradient(closest-side, rgba(255,255,255,.35), rgba(255,255,255,0) 72%);
         animation:bob 5.5s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:translate(-50%,-54%) } to { transform:translate(-50%,-46%) } }
  /* confetti keeps falling, gently, forever */
  .conf { position:absolute; top:-4%; pointer-events:none; opacity:0; animation:fall linear infinite; }
  @keyframes fall { 0% { transform:translate(0,-4vh) rotate(0deg); opacity:0 } 10% { opacity:.75 } 88% { opacity:.7 } 100% { transform:translate(2.5vw,106vh) rotate(340deg); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(16,44,30,.55); color:#ffedb5; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,237,181,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #sun, #glint, .bob, .conf { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="The eight friends celebrating around the trophy and sunflowers">
    </div>
    <div id="sun"></div>
    <div id="glint"></div>
    <div id="fx"></div>
    <div id="caption">THE BIG WIN</div>
  </div>
</div>
<script>
  // The celebration (Gary's living standard): the painting stays exactly
  // itself; the trophy glints, the balloons bob, and confetti keeps falling.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    var bobs = [[86,9,17],[95,13,13]];
    for (var i = 0; i < bobs.length; i++){
      html += '<div class="bob" style="left:' + bobs[i][0] + '%;top:' + bobs[i][1] + '%;width:' + bobs[i][2] + '%;aspect-ratio:1;animation-duration:' + (5 + i).toFixed(1) + 's;animation-delay:-' + (i * 1.7).toFixed(1) + 's"></div>';
    }
    var colors = ['#ff5d8f','#ffd93b','#39c2d7','#7ed957','#ff9f2e','#b388ff'];
    for (var k = 0; k < 22; k++){
      var px = 3 + (k * 4.4) % 94, sz = (0.55 + (k % 3) * 0.22).toFixed(2);
      html += '<div class="conf" style="left:' + px.toFixed(1) + '%;width:' + sz + '%;aspect-ratio:0.62;background:' + colors[k % 6] + ';animation-duration:' + (9 + (k % 5) * 2.2).toFixed(1) + 's;animation-delay:-' + (k * 1.93).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
