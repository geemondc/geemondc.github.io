<script>
(() => {
'use strict';
/* =====================================================================
   Day Flight — engine ported faithfully from the Lovable source
   (engine.ts / NightFlight.tsx), with three rebuild fixes:
   1) PHONE WINDOW SIZE — portrait phones get a window-seat framing:
      the scene is scaled so the glass covers ~62% of the screen height,
      centred on a focus point that keeps the wing + wingtip in frame,
      with the ambient backdrop and warm frame surround visible around
      it (a fill-the-screen pass at ~86% left no cabin frame at all;
      the Lovable original managed only ~21%). Landscape/desktop scale
      by height so the glass covers ~90% of the screen height (an
      earlier contained 85% pass, glass ≈ 75%, left fat ambient
      pillars on a wide monitor — Gary asked for the window larger).
   2) NEAR-GROUND SHARPNESS — (a) the strip is now built at native
      resolution: the original drew each 1024px painting into a 1244px
      slot (a 21.5% horizontal stretch); segments now sit 1:1 with a
      true crossfade at the seams. (b) Ground rows sample the actual
      perspective band of texture each row covers, instead of a 1px
      source row stretched over every 2.2px screen row.
   3) PAINTERLIER REGISTER — warm sunlit wing shading with a soft cast
      shadow, warmed sky/horizon, warm ivory frame with a soft inner
      shadow inside the glass. The four segment paintings are untouched.
   4) DAY/NIGHT + FRAMING (Nov 4) — a DAY|NIGHT pill crossfades the whole
      scene between the noon grade above and a night grade derived from
      the SAME master scene (deep sky, stars + moon, silver-edged clouds,
      multiply-graded ground, prominent nav lights + a double strobe,
      dimmed cabin frame) — one window, one wing, two times of day,
      ~600ms crossfade. Framing: portrait now FITS THE WHOLE window
      frame inside the viewport (fit-whole; it previously cropped to a
      focus point and sliced both bezels), and landscape is plainly
      centred (an old clamp shoved the scene flush right whenever it
      was narrower than the screen, leaving a wide blurred band down
      the left side).
   ===================================================================== */
const W = 1600, H = 1000;
const HOR = 340;          // horizon line (canvas px)
const F = 820;            // focal length
const S = 4000;           // world units per journey segment
const L = S * 4;          // loop length
const V = 22;             // cruise speed (world units / sim second)
const DMIN = 380, DMAX = 5200, DFAR = 9000;
const WIN = { x: 150, y: 60, w: 1300, h: 880, r: 340 };
const TILE = 1024;
const OV = 220;           // crossfade between journey segments (texture px)

function rng(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const smooth = (e0, e1, x) => {
  const k = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
  return k * k * (3 - 2 * k);
};
const wrap = (x) => ((x % L) + L) % L;
const C3 = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
const mix3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
const css3 = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

/* ---- day/night state (fix 4): nightMix crossfades 0 (day) <-> 1 (night) ---- */
let nightTarget = 0;
let nightMix = 0;
const MOON = { x: 1135, y: 148, r: 30 };
const stars = (() => {
  const r = rng(777);
  const out = [];
  for (let i = 0; i < 340; i++) {
    out.push({
      x: WIN.x + r() * WIN.w,
      y: WIN.y + 8 + Math.pow(r(), 1.35) * (HOR - WIN.y - 20),
      r: 0.7 + r() * 1.6, p: r() * 6.283, s: 0.6 + r() * 1.8, a: 0.35 + r() * 0.65,
    });
  }
  return out;
})();

function buildClouds() {
  const r = rng(42);
  const out = [];
  for (let k = 0; k < 8; k++) {
    const ca = (k + 0.3 + r() * 0.5) * (L / 8);
    const cd = 600 + r() * 1600;
    for (let i = 0; i < 16; i++)
      out.push({ a: ca + (r() - 0.5) * 1000, d: cd + (r() - 0.5) * 600, r: 120 + r() * 240, o: 0.55 + r() * 0.4 });
  }
  return out;
}
function buildShadows() {
  const r = rng(9);
  return Array.from({ length: 70 }, () => ({
    a: r() * L, d: DMIN + 200 + r() * (DMAX - DMIN), r: 220 + r() * 420, o: 0.18 + r() * 0.14,
  }));
}
const altitude = (a) => {
  const x = wrap(a) / S; // 0..4
  if (x >= 3) return 640 - 260 * smooth(3.05, 3.85, x);
  if (x < 0.7) return 380 + 260 * smooth(0, 0.7, x);
  return 640;
};

/* ---- journey strip: segments at NATIVE resolution (fix 2a) ----
   Strip index i holds segment 3-i, exactly as the source. Each painting
   is drawn 1:1 at i*TILE; the incoming segment's first OV columns are
   then faded in over the previous segment's tail — including across the
   loop seam — so boundaries stay invisible without stretching art. */
const SRCS = [
  'farmland--gGVp22A.jpg',
  'coast-zMnrGEYU.jpg',
  'mountains-ExOH924J.jpg',
  'city-Br_CqNvi.jpg',
];
const imgs = SRCS.map((s) => { const im = new Image(); im.src = s; return im; });
const loaded = [false, false, false, false];
let strip = null;
let onStripDirty = () => {};
function buildStrip() {
  const c = document.createElement('canvas');
  c.width = TILE * 4;
  c.height = TILE;
  const x = c.getContext('2d');
  // neutral terrain placeholder for segments still in flight (progressive delivery)
  const pg = x.createLinearGradient(0, 0, 0, TILE);
  pg.addColorStop(0, '#a7b8a2');
  pg.addColorStop(1, '#7e916c');
  x.fillStyle = pg;
  x.fillRect(0, 0, TILE * 4, TILE);
  const order = [3, 2, 1, 0].map((s) => imgs[s]);
  const has = [3, 2, 1, 0].map((s) => loaded[s]);
  for (let i = 0; i < 4; i++) if (has[i]) x.drawImage(order[i], i * TILE, 0);
  const tmp = document.createElement('canvas');
  tmp.width = OV;
  tmp.height = TILE;
  const tx = tmp.getContext('2d');
  for (let i = 0; i < 4; i++) {
    if (!has[i]) continue;
    tx.globalCompositeOperation = 'source-over';
    tx.clearRect(0, 0, OV, TILE);
    tx.drawImage(order[i], 0, 0, OV, TILE, 0, 0, OV, TILE);
    tx.globalCompositeOperation = 'destination-in';
    const g = tx.createLinearGradient(0, 0, OV, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
    tx.fillStyle = g;
    tx.fillRect(0, 0, OV, TILE);
    x.drawImage(tmp, i === 0 ? TILE * 4 - OV : i * TILE - OV, 0);
  }
  strip = c;
}
buildStrip();
imgs.forEach((im, i) => {
  const mark = () => {
    if (loaded[i]) return;
    loaded[i] = true;
    buildStrip();
    onStripDirty();
  };
  im.addEventListener('load', mark);
  if (im.complete && im.naturalWidth) mark();
  if (im.decode) im.decode().then(mark).catch(() => {});
});

const clouds = buildClouds();
const shadows = buildShadows();
const winPath = new Path2D();
winPath.roundRect(WIN.x, WIN.y, WIN.w, WIN.h, WIN.r);
const start = S * 0.2;
const kTex = (TILE * 4) / L; // texture px per world unit
const uOf = (a) => (L - wrap(a)) * kTex;

function drawScene(ctx, t) {
  const camA = start + t * V;
  const h = altitude(camA);
  const cx = W / 2;
  const bottom = WIN.y + WIN.h;
  const nm = nightMix;

  ctx.save();
  ctx.clip(winPath);

  // sky — noon blue overhead warming to a pale sunlit haze at the horizon
  // (fix 3); the same gradient sinks to a deep night sky at night (fix 4)
  const sky = ctx.createLinearGradient(0, WIN.y, 0, HOR + 10);
  sky.addColorStop(0, css3(mix3(C3('#2b65ba'), C3('#03061a'), nm)));
  sky.addColorStop(0.52, css3(mix3(C3('#5f94d8'), C3('#0a1334'), nm)));
  sky.addColorStop(0.85, css3(mix3(C3('#b9d4ee'), C3('#22335e'), nm)));
  sky.addColorStop(1, css3(mix3(C3('#f4e9c9'), C3('#46598c'), nm)));
  ctx.fillStyle = sky;
  ctx.fillRect(WIN.x, WIN.y, WIN.w, HOR + 10 - WIN.y);
  // sun high above — glare spilling in from the top (fades out at night)
  const sg = ctx.createRadialGradient(420, WIN.y - 80, 10, 420, WIN.y - 80, 520);
  sg.addColorStop(0, `rgba(255,252,235,${0.9 * (1 - nm)})`);
  sg.addColorStop(0.25, `rgba(255,245,215,${0.35 * (1 - nm)})`);
  sg.addColorStop(1, 'rgba(255,245,215,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(WIN.x, WIN.y, WIN.w, 600);
  // stars + moon (night only) — in the sky, outside stays clear, no veil
  if (nm > 0.01) {
    for (const st of stars) {
      const tw = 0.72 + 0.28 * Math.sin(t * st.s + st.p);
      ctx.fillStyle = `rgba(235,242,255,${(st.a * tw * nm).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283); ctx.fill();
    }
    const mg = ctx.createRadialGradient(MOON.x, MOON.y, 4, MOON.x, MOON.y, 170);
    mg.addColorStop(0, `rgba(215,228,255,${0.5 * nm})`);
    mg.addColorStop(0.3, `rgba(190,205,245,${0.16 * nm})`);
    mg.addColorStop(1, 'rgba(190,205,245,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(MOON.x - 170, MOON.y - 170, 340, 340);
    ctx.fillStyle = `rgba(238,243,252,${nm})`;
    ctx.beginPath(); ctx.arc(MOON.x, MOON.y, MOON.r, 0, 6.283); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(MOON.x, MOON.y, MOON.r, 0, 6.283); ctx.clip();
    ctx.fillStyle = `rgba(168,182,208,${0.20 * nm})`;
    for (const cr of [[-9, -5, 6], [8, 9, 4.5], [11, -11, 3.4], [-13, 12, 3]]) {
      ctx.beginPath(); ctx.arc(MOON.x + cr[0], MOON.y + cr[1], cr[2], 0, 6.283); ctx.fill();
    }
    const term = ctx.createLinearGradient(MOON.x - MOON.r, 0, MOON.x + MOON.r, 0);
    term.addColorStop(0, `rgba(120,135,170,${0.18 * nm})`);
    term.addColorStop(0.5, 'rgba(120,135,170,0)');
    ctx.fillStyle = term;
    ctx.fillRect(MOON.x - MOON.r, MOON.y - MOON.r, MOON.r * 2, MOON.r * 2);
    ctx.restore();
  }

  // ground — painted terrain, one perspective row at a time.
  // Fix 2b: each 2px screen row now samples the true band of texture it
  // covers (v at the row's top and bottom edges), instead of the source's
  // single 1px row stretched to 2.2px — no more streaks or blocky smear
  // in the near ground under the wing.
  ctx.fillStyle = '#a8b9b8';
  ctx.fillRect(WIN.x, HOR, WIN.w, bottom - HOR);
  if (strip) {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const vRaw = (y) => ((DMAX - (F * h) / (y - HOR)) / (DMAX - DMIN)) * TILE;
    for (let y = HOR + 1; y < bottom; y += 2) {
      const d = (F * h) / (y - HOR);
      if (d > DFAR) continue;
      let vs = ((Math.min(vRaw(y), vRaw(y + 2)) % TILE) + TILE) % TILE;
      let sh = Math.abs(vRaw(y + 2) - vRaw(y));
      if (sh < 0.35) sh = 0.35;
      if (vs + sh > TILE) sh = TILE - vs;
      const aL = camA + ((cx - WIN.x) * d) / F;
      const uw = ((WIN.w * d) / F) * kTex;
      const u0 = uOf(aL);
      const first = Math.min(uw, TILE * 4 - u0);
      const dw = (first / uw) * WIN.w;
      ctx.drawImage(strip, u0, vs, first, sh, WIN.x, y, dw + 0.5, 2.3);
      if (first < uw) ctx.drawImage(strip, 0, vs, uw - first, sh, WIN.x + dw, y, WIN.w - dw, 2.3);
    }
  }

  // night grade on the ground (fix 4): the paintings sink into a deep blue
  // night — darker near the plane, a touch lighter toward the moonlit
  // distance. A multiply, graded like a real night photo, never a flat veil.
  if (nm > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const gg = ctx.createLinearGradient(0, HOR, 0, bottom);
    gg.addColorStop(0, css3(mix3([255, 255, 255], [104, 118, 164], nm)));
    gg.addColorStop(1, css3(mix3([255, 255, 255], [30, 38, 78], nm)));
    ctx.fillStyle = gg;
    ctx.fillRect(WIN.x, HOR, WIN.w, bottom - HOR);
    ctx.restore();
    ctx.fillStyle = `rgba(22,32,78,${0.14 * nm})`;
    ctx.fillRect(WIN.x, HOR, WIN.w, bottom - HOR);
  }

  // cloud shadows drifting slowly across the ground
  const half = L / 2;
  const proj = (a, d, alt) => {
    let da = wrap(a) - wrap(camA);
    if (da > half) da -= L; else if (da < -half) da += L;
    return { x: cx - (F * da) / d, y: HOR + (F * alt) / d };
  };
  for (const s of shadows) {
    const p = proj(s.a + t * 3.5, s.d, h);
    const rr = (s.r * F) / s.d;
    if (p.x + rr < WIN.x || p.x - rr > WIN.x + WIN.w || p.y - rr > bottom) continue;
    const sq = Math.max(0.12, h / s.d) * 1.6;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(1, sq);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rr);
    g.addColorStop(0, `rgba(18,32,48,${s.o * (1 - 0.75 * nm)})`);
    g.addColorStop(0.6, `rgba(18,32,48,${s.o * 0.6 * (1 - 0.75 * nm)})`);
    g.addColorStop(1, 'rgba(18,32,48,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  // sun sparkling on the coastal water
  const coastW = 1 - smooth(0.35, 0.85, Math.min(Math.abs(wrap(camA) / S - 1.5), 4 - Math.abs(wrap(camA) / S - 1.5)));
  if (coastW > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 420; i++) {
      const sx = WIN.x + ((Math.sin(i * 91.7) * 0.5 + 0.5) * WIN.w);
      const sy = HOR + 30 + Math.pow((Math.sin(i * 12.9898) * 0.5 + 0.5), 0.7) * 520;
      const d = (F * h) / (sy - HOR);
      if (d > 2700) continue; // the sea lies on the near side
      const a = camA - ((sx - cx) * d) / F;
      const seg = Math.floor(wrap(a) / S);
      if (seg !== 1) continue;
      const fl = Math.pow(Math.max(0, Math.sin(t * (1.6 + (i % 9) * 0.35) + i * 2.3)), 6);
      if (fl < 0.05) continue;
      const near = 1 - Math.abs(sx - 900) / 900;
      const al = fl * coastW * (0.35 + 0.65 * near);
      const z = 1.2 + (sy - HOR) / 180;
      ctx.fillStyle = `rgba(255,250,230,${al})`;
      ctx.fillRect(sx - z * 1.5, sy, z * 3, 1);
      ctx.fillRect(sx, sy - z * 0.6, 1, z * 1.3);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // atmospheric haze toward the horizon
  const hz = ctx.createLinearGradient(0, HOR, 0, HOR + 260);
  const hzA = 1 - 0.45 * nm;
  hz.addColorStop(0, css3(mix3([228, 230, 222], [64, 78, 120], nm), hzA));
  hz.addColorStop(0.08, css3(mix3([210, 224, 236], [40, 50, 88], nm), 0.85 * hzA));
  hz.addColorStop(0.2, css3(mix3([200, 218, 232], [34, 44, 80], nm), 0.55 * hzA));
  hz.addColorStop(0.5, css3(mix3([190, 210, 228], [20, 28, 54], nm), 0.25 * hzA));
  hz.addColorStop(1, css3(mix3([190, 210, 228], [20, 28, 54], nm), 0));
  ctx.fillStyle = hz;
  ctx.fillRect(WIN.x, HOR, WIN.w, 260);

  // white cloud passing between us and the earth
  for (const c of clouds) {
    const p = proj(c.a, c.d, h - 200);
    const rr = (c.r * F) / c.d;
    if (p.x + rr < WIN.x || p.x - rr > WIN.x + WIN.w) continue;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(1, 0.45);
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, rr);
    cg.addColorStop(0, css3(mix3([238, 242, 248], [56, 68, 108], nm), c.o * 0.85));
    cg.addColorStop(0.5, css3(mix3([216, 226, 238], [36, 46, 80], nm), c.o * 0.5));
    cg.addColorStop(1, css3(mix3([205, 218, 232], [24, 32, 62], nm), 0));
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.283); ctx.fill();
    const tg = ctx.createRadialGradient(0, -rr * 0.25, 0, 0, -rr * 0.25, rr * 0.6);
    tg.addColorStop(0, css3(mix3([255, 255, 252], [208, 222, 248], nm), c.o * (0.7 - 0.18 * nm)));
    tg.addColorStop(1, 'rgba(255,255,252,0)');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(0, -rr * 0.25, rr * 0.6, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  drawWing(ctx, t);

  // glass: soft brightening and a faint sheen
  const vg = ctx.createRadialGradient(cx, 500, 320, cx, 500, 820);
  vg.addColorStop(0, 'rgba(255,255,255,0)');
  vg.addColorStop(1, css3(mix3([40, 55, 75], [6, 8, 20], nm), 0.35 + 0.17 * nm));
  ctx.fillStyle = vg;
  ctx.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);
  const rf = ctx.createLinearGradient(WIN.x, WIN.y, WIN.x + 700, WIN.y + 600);
  rf.addColorStop(0, `rgba(255,255,255,${0.10 - 0.05 * nm})`);
  rf.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rf;
  ctx.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);
  // soft inner shadow inside the glass — depth against the frame (fix 3)
  const ishT = ctx.createLinearGradient(0, WIN.y, 0, WIN.y + 170);
  ishT.addColorStop(0, `rgba(24,30,46,${0.20 + 0.16 * nm})`);
  ishT.addColorStop(1, 'rgba(24,30,46,0)');
  ctx.fillStyle = ishT;
  ctx.fillRect(WIN.x, WIN.y, WIN.w, 170);
  const ishB = ctx.createLinearGradient(0, WIN.y + WIN.h - 190, 0, WIN.y + WIN.h);
  ishB.addColorStop(0, 'rgba(24,30,46,0)');
  ishB.addColorStop(1, `rgba(24,30,46,${0.24 + 0.18 * nm})`);
  ctx.fillStyle = ishB;
  ctx.fillRect(WIN.x, WIN.y + WIN.h - 190, WIN.w, 190);
  ctx.lineWidth = 3;
  ctx.strokeStyle = `rgba(22,28,42,${0.30 + 0.2 * nm})`;
  ctx.stroke(winPath);
  ctx.restore();

  drawFrame(ctx);
}

function drawWing(ctx, t) {
  const nm = nightMix;
  const tipX = 1265, tipY = 610;
  const body = new Path2D();
  body.moveTo(60, 820);
  body.bezierCurveTo(500, 700, 900, 640, tipX, tipY);
  body.lineTo(tipX + 18, tipY + 10);
  body.bezierCurveTo(1000, 700, 600, 860, 300, 1020);
  body.lineTo(60, 1020);
  body.closePath();
  // soft shadow the wing casts on the world below — grounds it (fix 3)
  ctx.save();
  ctx.shadowColor = 'rgba(13,24,44,0.38)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 18;
  // warm sunlit metal: ivory in the sun, cool blue-grey in shade (fix 3)
  const wg = ctx.createLinearGradient(0, 600, 0, 1020);
  wg.addColorStop(0, css3(mix3(C3('#f6f2e4'), C3('#7d889c'), nm)));
  wg.addColorStop(0.25, css3(mix3(C3('#e8e9e2'), C3('#576274'), nm)));
  wg.addColorStop(0.6, css3(mix3(C3('#bcc5cc'), C3('#333c4a'), nm)));
  wg.addColorStop(1, css3(mix3(C3('#808e9b'), C3('#20242d'), nm)));
  ctx.fillStyle = wg;
  ctx.fill(body);
  ctx.restore();
  ctx.save();
  ctx.clip(body);
  // warm sunlight washing in from the sun side (fades out at night)
  const sun = ctx.createRadialGradient(340, 630, 40, 340, 630, 880);
  sun.addColorStop(0, `rgba(255,240,200,${0.42 * (1 - nm)})`);
  sun.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(0, 580, 1400, 460);
  // cool moonlight washing in from the moon side (night)
  if (nm > 0.01) {
    const mw = ctx.createRadialGradient(1090, 600, 40, 1090, 600, 820);
    mw.addColorStop(0, `rgba(188,203,240,${0.20 * nm})`);
    mw.addColorStop(1, 'rgba(188,203,240,0)');
    ctx.fillStyle = mw;
    ctx.fillRect(0, 580, 1400, 460);
  }
  // sky reflected along the top surface
  const sk = ctx.createLinearGradient(0, 620, 600, 1000);
  sk.addColorStop(0, css3(mix3([140, 180, 225], [110, 140, 220], nm), 0.30 + 0.08 * nm));
  sk.addColorStop(1, 'rgba(140,180,225,0)');
  ctx.fillStyle = sk;
  ctx.fillRect(0, 600, 1400, 420);
  // gentle shading pooling along the underside
  const oc = ctx.createLinearGradient(0, 870, 0, 1020);
  oc.addColorStop(0, css3(mix3([43, 40, 36], [8, 10, 18], nm), 0));
  oc.addColorStop(1, css3(mix3([43, 40, 36], [8, 10, 18], nm), 0.20 + 0.16 * nm));
  ctx.fillStyle = oc;
  ctx.fillRect(0, 860, 1400, 170);
  // sunlight glint on the wing — gently breathing; at night it becomes a
  // cooler, dimmer moon glint riding toward the moon side
  const gx = 760 + 30 * Math.sin(t * 0.07) + 230 * nm, gy = 705 - 35 * nm;
  const gl = ctx.createRadialGradient(gx, gy, 0, gx, gy, 260);
  const gi = (0.75 + 0.2 * Math.sin(t * 0.31)) * (1 - 0.5 * nm);
  gl.addColorStop(0, css3(mix3([255, 253, 240], [205, 218, 248], nm), gi));
  gl.addColorStop(0.2, css3(mix3([255, 250, 232], [205, 218, 248], nm), gi * 0.45));
  gl.addColorStop(1, 'rgba(255,250,232,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = gl;
  ctx.fillRect(gx - 260, gy - 260, 520, 520);
  ctx.globalCompositeOperation = 'source-over';
  // panel lines
  ctx.strokeStyle = `rgba(56,62,76,${0.26 + 0.08 * nm})`;
  ctx.lineWidth = 1;
  for (let k = 1; k < 5; k++) {
    ctx.beginPath();
    ctx.moveTo(60 + k * 40, 840 + k * 30);
    ctx.bezierCurveTo(500, 730 + k * 25, 900, 665 + k * 10, tipX - 20 * k, tipY + 8 + k * 3);
    ctx.stroke();
  }
  ctx.restore();
  // sunlit leading edge
  ctx.beginPath();
  ctx.moveTo(60, 820);
  ctx.bezierCurveTo(500, 700, 900, 640, tipX, tipY);
  ctx.strokeStyle = css3(mix3([255, 253, 240], [190, 205, 235], nm), 0.92 - 0.37 * nm);
  ctx.lineWidth = 2.6;
  ctx.stroke();
  // winglet
  ctx.beginPath();
  ctx.moveTo(tipX - 6, tipY + 4);
  ctx.lineTo(tipX + 8, tipY - 70);
  ctx.lineTo(tipX + 26, tipY - 74);
  ctx.lineTo(tipX + 20, tipY + 12);
  ctx.closePath();
  const wl = ctx.createLinearGradient(tipX, tipY - 74, tipX + 20, tipY + 10);
  wl.addColorStop(0, css3(mix3(C3('#f8f4e8'), C3('#6e7a8e'), nm)));
  wl.addColorStop(1, css3(mix3(C3('#a3adb8'), C3('#2e3540'), nm)));
  ctx.fillStyle = wl;
  ctx.fill();
  ctx.strokeStyle = `rgba(84,92,104,${0.45 + 0.1 * nm})`;
  ctx.stroke();
  // nav lights + strobe. By day the red light keeps its slow blink from
  // the source; at night the nav lights burn steady and prominent — red
  // at the tip, green on the winglet — and the white strobe double-
  // flashes on the real aviation rhythm (fix 4).
  const p = (t % 2.6) / 2.6;
  const blink = p < 0.45 ? smooth(0, 0.06, p) * (1 - smooth(0.36, 0.45, p)) : 0;
  const steady = 0.86 + 0.14 * Math.sin(t * 2.1);
  const on = blink + (steady - blink) * nm * 0.92;
  const lx = tipX + 14, ly = tipY + 2;
  const lr = 46 + 34 * nm;
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, lr);
  lg.addColorStop(0, `rgba(255,70,55,${0.95 * on})`);
  lg.addColorStop(0.25, `rgba(255,50,40,${0.3 * on})`);
  lg.addColorStop(1, 'rgba(255,40,30,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgb(${180 + 75 * on},${40 + 60 * on},${40 + 50 * on})`;
  ctx.beginPath(); ctx.arc(lx, ly, 3.4, 0, 6.283); ctx.fill();
  if (nm > 0.01) {
    // green nav light on the winglet
    const gx2 = tipX + 17, gy2 = tipY - 70;
    const gon = (0.85 + 0.15 * Math.sin(t * 1.7 + 1)) * nm;
    ctx.globalCompositeOperation = 'lighter';
    const gg2 = ctx.createRadialGradient(gx2, gy2, 0, gx2, gy2, 36);
    gg2.addColorStop(0, `rgba(70,255,150,${0.8 * gon})`);
    gg2.addColorStop(0.3, `rgba(50,230,120,${0.28 * gon})`);
    gg2.addColorStop(1, 'rgba(50,230,120,0)');
    ctx.fillStyle = gg2;
    ctx.fillRect(gx2 - 36, gy2 - 36, 72, 72);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(120,255,175,${nm})`;
    ctx.beginPath(); ctx.arc(gx2, gy2, 2.6, 0, 6.283); ctx.fill();
    // white strobe: double flash every 1.7s, gated by sim speed so a
    // frozen STILL frame never holds a flash mid-burst
    const sp = t % 1.7;
    const pulse = (c) => Math.max(0, 1 - Math.abs(sp - c) / 0.055);
    const si = Math.max(pulse(0.03), pulse(0.24)) * Math.min(1, speed * 4);
    if (si > 0.01) {
      const sx = tipX + 24, sy = tipY + 8;
      const sa = si * (0.35 + 0.65 * nm);
      ctx.globalCompositeOperation = 'lighter';
      const sgr = ctx.createRadialGradient(sx, sy, 0, sx, sy, 120);
      sgr.addColorStop(0, `rgba(255,255,255,${0.9 * sa})`);
      sgr.addColorStop(0.2, `rgba(240,246,255,${0.35 * sa})`);
      sgr.addColorStop(1, 'rgba(240,246,255,0)');
      ctx.fillStyle = sgr;
      ctx.fillRect(sx - 120, sy - 120, 240, 240);
      // the flash spills across the wing and the nearby glass
      const wgr = ctx.createRadialGradient(sx, sy, 0, sx, sy, 430);
      wgr.addColorStop(0, `rgba(235,242,255,${0.13 * si * nm})`);
      wgr.addColorStop(1, 'rgba(235,242,255,0)');
      ctx.fillStyle = wgr;
      ctx.fillRect(sx - 430, sy - 430, 860, 860);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(255,255,255,${sa})`;
      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, 6.283); ctx.fill();
    }
  }
}

function drawFrame(ctx) {
  const nm = nightMix;
  ctx.save();
  const outer = new Path2D();
  outer.rect(0, 0, W, H);
  outer.addPath(winPath);
  // warm ivory fuselage, softly shaded (fix 3); the cabin goes dim at night
  const fg = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1000);
  fg.addColorStop(0, css3(mix3(C3('#e4dfd3'), C3('#4c4d55'), nm)));
  fg.addColorStop(0.6, css3(mix3(C3('#c0bbae'), C3('#2f3038'), nm)));
  fg.addColorStop(1, css3(mix3(C3('#7d776c'), C3('#141519'), nm)));
  ctx.fillStyle = fg;
  ctx.fill(outer, 'evenodd');
  // inner bevel rings
  for (let i = 0; i < 4; i++) {
    const p = new Path2D();
    const o = 6 + i * 14;
    p.roundRect(WIN.x - o, WIN.y - o, WIN.w + o * 2, WIN.h + o * 2, WIN.r + o);
    ctx.strokeStyle = i === 0 ? 'rgba(58,54,48,0.7)' : `rgba(255,252,244,${(0.35 - i * 0.07) * (1 - 0.55 * nm)})`;
    ctx.lineWidth = i === 0 ? 10 : 3;
    ctx.stroke(p);
  }
  // seat-back hint
  const sb = ctx.createLinearGradient(0, 955, 0, H);
  sb.addColorStop(0, 'rgba(52,56,72,0)');
  sb.addColorStop(0.4, css3(mix3([48, 52, 66], [18, 19, 26], nm), 0.9));
  sb.addColorStop(1, css3(mix3(C3('#2b303e'), C3('#101116'), nm)));
  ctx.fillStyle = sb;
  ctx.beginPath();
  ctx.moveTo(1050, H);
  ctx.bezierCurveTo(1060, 960, 1120, 950, 1260, 950);
  ctx.bezierCurveTo(1450, 950, 1560, 960, W, 975);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ---- sound: the source's procedural cabin (brown-noise rush + hum) ---- */
function startSound() {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const master = ac.createGain();
  master.gain.value = 0;
  master.gain.linearRampToValueAtTime(0.5, ac.currentTime + 2.5);
  master.connect(ac.destination);
  const len = ac.sampleRate * 4;
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      d[i] = last * 3.2;
    }
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 700;
  const ng = ac.createGain();
  ng.gain.value = 0.55;
  src.connect(lp).connect(ng).connect(master);
  src.start();
  for (const [f, g] of [[82, 0.05], [123, 0.025], [164.5, 0.012]]) {
    const o = ac.createOscillator();
    o.frequency.value = f;
    const og = ac.createGain();
    og.gain.value = g;
    o.connect(og).connect(master);
    o.start();
  }
  return () => {
    master.gain.linearRampToValueAtTime(0, ac.currentTime + 0.6);
    setTimeout(() => ac.close(), 700);
  };
}

/* ---- player: offscreen scene canvas + responsive view transform ---- */
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const bg = document.getElementById('bg');
const bctx = bg.getContext('2d');
const SS = 1.5; // scene render scale, as in the source
const scene = document.createElement('canvas');
scene.width = W * SS;
scene.height = H * SS;
const sctx = scene.getContext('2d');

let living = true;
let t = 0, speed = 1, last = performance.now(), frame = 0, dirty = 3;
onStripDirty = () => { dirty = Math.max(dirty, 3); };

/* Framing per breakpoint (fix 1, corrected Nov 4).
   Landscape / wide: scaled by height so the GLASS covers ~90% of the
   screen height — Gary's ruling after the earlier contained 85% pass
   (glass ≈ 75%) left fat ambient pillars on both sides of his wide
   monitor — and plainly CENTRED both ways. The old clamps were the
   landscape defect: `dx = Math.max(dx, cw - W*s)` fires whenever the
   scene is narrower than the screen and shoves the scene flush right,
   leaving a wide blurred band down the left and zero margin on the
   right; on wider screens the band grew to ~30% of the width.
   Portrait: FIT-WHOLE — the scale is the smallest of the 62.5%-glass-
   height scale and the scales that fit the whole scene inside the
   viewport, so the complete window frame (all four bezels) always
   sits inside the screen, centred, with the ambient backdrop around
   it. The old focus-point crop (glass at 62.5% of height, centred on
   x=1070) sliced both bezels off a phone-width screen — the frame is
   never cropped on any side now. On a tall phone the width fit binds
   first, so the whole frame reads at ~25% of the screen height; that
   is the honest price of fit-whole for a 16:10 scene. */
function computeView() {
  const cw = view.clientWidth, ch = view.clientHeight;
  let s, dx, dy;
  if (cw / ch >= 0.95) {
    s = (ch * 0.90) / WIN.h;            // glass ≈ 90% of screen height
    dx = (cw - W * s) / 2;
    dy = (ch - H * s) / 2;
  } else {
    s = Math.min((ch * 0.625) / WIN.h, (cw * 0.98) / W, (ch * 0.96) / H);
    dx = (cw - W * s) / 2;
    dy = (ch - H * s) / 2;
  }
  return { s, dx, dy, cw, ch };
}
let viewInfo = null;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.width = Math.max(1, Math.round(view.clientWidth * dpr));
  view.height = Math.max(1, Math.round(view.clientHeight * dpr));
  viewInfo = computeView();
  dirty = Math.max(dirty, 3);
}
window.addEventListener('resize', resize);
resize();

function render() {
  sctx.setTransform(SS, 0, 0, SS, 0, 0);
  drawScene(sctx, t);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vctx.clearRect(0, 0, viewInfo.cw, viewInfo.ch);
  vctx.drawImage(scene, viewInfo.dx, viewInfo.dy, W * viewInfo.s, H * viewInfo.s);
  if (frame % 6 === 0) bctx.drawImage(scene, 0, 0, bg.width, bg.height);
  document.body.style.background = css3(mix3([13, 20, 32], [4, 6, 13], nightMix));
}
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const target = living ? 1 : 0;
  speed += (target - speed) * Math.min(1, dt * 1.1);
  if (!living && speed < 0.002) speed = 0;
  t += dt * speed;
  if (nightMix !== nightTarget) {
    // ~600ms day<->night crossfade on the real clock, so it runs even
    // while STILL (the sim clock is frozen then; the grade still moves)
    const step = dt / 0.6;
    nightMix = nightTarget > nightMix
      ? Math.min(nightTarget, nightMix + step)
      : Math.max(nightTarget, nightMix - step);
    dirty = Math.max(dirty, 2);
  }
  if (speed > 0 || frame < 2 || dirty > 0) {
    render();
    if (dirty > 0) dirty--;
  }
  frame++;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---- controls (source behavior: action label for STILL/LIVING,
        state label for sound, chrome auto-hides after 3.5s idle) ---- */
const controls = document.getElementById('controls');
const btnMode = document.getElementById('btnMode');
const btnLiving = document.getElementById('btnLiving');
const btnSound = document.getElementById('btnSound');
let stopSoundFn = null;
let hideTimer = 0;
function wake() {
  controls.classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => controls.classList.add('hidden'), 3500);
}
wake();
window.addEventListener('pointermove', wake);
window.addEventListener('pointerdown', wake);
btnMode.addEventListener('click', (e) => {
  e.stopPropagation();
  nightTarget = nightTarget ? 0 : 1;
  btnMode.textContent = nightTarget ? '☀ Day' : '☾ Night';
  wake();
});
btnLiving.addEventListener('click', (e) => {
  e.stopPropagation();
  living = !living;
  btnLiving.textContent = living ? 'Still' : 'Living';
  wake();
});
btnSound.addEventListener('click', (e) => {
  e.stopPropagation();
  if (stopSoundFn) {
    stopSoundFn();
    stopSoundFn = null;
    btnSound.textContent = 'Sound off';
  } else {
    stopSoundFn = startSound();
    btnSound.textContent = 'Sound on';
  }
  wake();
});
view.addEventListener('click', (e) => {
  // Clicks aimed at the controls are never scene clicks: while the chrome
  // is auto-hidden it is pointer-events:none, so such a click lands here —
  // swallow it (the pointerdown already woke the controls) instead of
  // toggling fullscreen or eating the click meant for a pill.
  const r = controls.getBoundingClientRect();
  if (r.width > 0 && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
});

/* verification hooks */
window.__df = {
  get t() { return t; },
  get speed() { return speed; },
  get living() { return living; },
  get mode() { return nightTarget; },
  get nightMix() { return nightMix; },
  loaded: () => loaded.slice(),
  view: () => viewInfo,
  sceneRect: () => ({ x: viewInfo.dx, y: viewInfo.dy, w: W * viewInfo.s, h: H * viewInfo.s }),
  glassRect: () => ({ x: viewInfo.dx + WIN.x * viewInfo.s, y: viewInfo.dy + WIN.y * viewInfo.s, w: WIN.w * viewInfo.s, h: WIN.h * viewInfo.s }),
  sample: (x, y) => {
    const d = sctx.getImageData(Math.round(x * SS), Math.round(y * SS), 1, 1).data;
    return [d[0], d[1], d[2]];
  },
  glassShare: () => {
    // fraction of the screen covered by the window glass (grid-sampled
    // point-in-rounded-rect against the live view transform)
    const { s, dx, dy, cw, ch } = viewInfo;
    const step = 4;
    let hit = 0, total = 0;
    const inRound = (px, py) => {
      const lx = px - WIN.x, ly = py - WIN.y;
      if (lx < 0 || ly < 0 || lx > WIN.w || ly > WIN.h) return false;
      const qx = Math.max(WIN.r - lx, lx - (WIN.w - WIN.r), 0);
      const qy = Math.max(WIN.r - ly, ly - (WIN.h - WIN.r), 0);
      return qx * qx + qy * qy <= WIN.r * WIN.r;
    };
    for (let y = step / 2; y < ch; y += step) {
      for (let x = step / 2; x < cw; x += step) {
        total++;
        if (inRound((x - dx) / s, (y - dy) / s)) hit++;
      }
    }
    return hit / total;
  },
};
})();
</script>

<script>
/* Wall mode: embedded in the Living Photos wall via #wall, this page's own title/controls stay hidden — the scene and its interactions stay live. */
if (location.hash === '#wall') {
  var lpWallStyle = document.createElement('style');
  lpWallStyle.textContent = '#btnLiving{display:none !important}#btnSound{display:none !important}#controls{opacity:1 !important}#controls.hidden{opacity:1 !important;pointer-events:auto !important}';
  document.head.appendChild(lpWallStyle);
}
</script>
<div id="lpFsBar"><button id="lpFsStill" type="button">Still</button><button id="lpFsLiving" type="button" class="on">Living</button><button id="lpFsClose" type="button" class="x" aria-label="Close">&times;</button></div>
<script id="lp-nativefs-js">
(function(){
  "use strict";

  var bl = document.getElementById('btnLiving');
  function isLiving(){ return bl && bl.textContent.trim() === 'Still'; }
  function setStill(){ if (isLiving()) bl.click(); sync(); }
  function setLiving(){ if (!isLiving()) bl.click(); sync(); }
  var b = document.getElementById('lpFsStill'), c = document.getElementById('lpFsLiving'), x = document.getElementById('lpFsClose');
  function sync(){ if (b && c){ var lv = isLiving(); b.classList.toggle('on', !lv); c.classList.toggle('on', lv); } }
  if (b) b.addEventListener('click', function(e){ e.stopPropagation(); setStill(); });
  if (c) c.addEventListener('click', function(e){ e.stopPropagation(); setLiving(); });
  if (x) x.addEventListener('click', function(e){ e.stopPropagation(); if (document.fullscreenElement) document.exitFullscreen(); });
  document.addEventListener('fullscreenchange', function(){ setTimeout(sync, 30); });
  sync();
})();
</script>

<script id="lp-pair-js">
(function(){
  "use strict";
  var s = document.getElementById('lpStill'), l = document.getElementById('lpLiving');
  var fs = document.getElementById('lpFsStill'), fl = document.getElementById('lpFsLiving');
  if (s && fs) s.addEventListener('click', function(){ fs.click(); s.classList.add('on'); l.classList.remove('on'); });
  if (l && fl) l.addEventListener('click', function(){ fl.click(); l.classList.add('on'); s.classList.remove('on'); });
})();
</script>
