<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deep Space — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#050914; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.5); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#050914;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 13s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .glow { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity:.45 } to { opacity:1 } }
  .twk { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(200,220,255,.30) 55%, rgba(200,220,255,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.8); filter:brightness(.75) } to { transform:translate(-50%,-50%) scale(1.2); filter:brightness(1.35) } }
  .pulse { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; animation:pl 2.6s ease-in-out infinite; }
  @keyframes pl { 0%,100% { opacity:.25; transform:translate(-50%,-50%) scale(.85) } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.15) } }

  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(6,10,24,.55); color:#eaf2ff; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(183,156,255,.4); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, .glow, .twk, .pulse { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="A ringed giant planet, a lit space station, a small rocket and the moon in deep space">
    </div>
    <div id="fx"></div>
    <div id="caption">DEEP SPACE</div>
  </div>
</div>
<script>
  // Deep space, living quietly: the stars twinkle, the station windows breathe warm, its beacon pulses, and the nebulas glow slow. The painting stays exactly itself. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    html += '<div class="glow" style="left:76%;top:44%;width:10%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,196,110,0.3), rgba(255,196,110,0) 72%);animation-duration:8s"></div>';
    html += '<div class="glow" style="left:64%;top:10%;width:7%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(190,220,255,0.35), rgba(190,220,255,0) 72%);animation-duration:7s"></div>';
    html += '<div class="glow" style="left:57%;top:38%;width:24%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,120,170,0.16), rgba(255,120,170,0) 72%);animation-duration:11s"></div>';
    html += '<div class="glow" style="left:90%;top:74%;width:22%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(64,224,208,0.14), rgba(64,224,208,0) 72%);animation-duration:12s"></div>';
    html += '<div class="pulse" style="left:77.5%;top:31.5%;width:2.4%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,90,80,.95), rgba(255,90,80,0) 72%)"></div>';
    var stars = [[54,14],[62,20],[72,12],[68,30],[90,32],[95,44],[60,55],[66,62],[55,72],[48,88],[30,92],[12,90],[8,62],[95,68],[84,52],[58,44],[76,58],[42,96],[88,88],[20,58],[64,80],[36,84]];
    for (var i = 0; i < stars.length; i++){
      var w = (0.9 + (i % 3) * 0.45).toFixed(2);
      html += '<div class="twk" style="left:' + stars[i][0] + '%;top:' + stars[i][1] + '%;width:' + w + '%;aspect-ratio:1;animation-duration:' + (2.4 + (i % 5) * 0.65).toFixed(1) + 's;animation-delay:-' + (i * 0.55).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
