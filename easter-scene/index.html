<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Easter Garden — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#2c4a22; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.62); transform:scale(1.18); animation:egFill 11s ease-in-out infinite alternate; }
  @keyframes egFill { from { filter:blur(26px) brightness(.56) } to { filter:blur(26px) brightness(.74) } }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#2c4a22;
           box-shadow:0 18px 60px rgba(20,40,10,.55); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:egDrift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes egDrift { from { transform:scale(1.03) translate(0.7%,0.35%); } to { transform:scale(1.095) translate(-0.9%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* warm morning sun washing in over the blossoms, top left */
  #sunwash { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:egBreathe 10s ease-in-out infinite alternate;
        background:radial-gradient(52% 56% at 26% 6%, rgba(255,236,170,.42), rgba(255,220,130,.12) 55%, rgba(255,220,130,0) 78%); }
  @keyframes egBreathe { from { opacity:.5 } to { opacity:1 } }
  /* the golden egg Teal holds up, glowing warm */
  #gold { position:absolute; left:19.5%; top:12.5%; width:9%; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen;
        background:radial-gradient(closest-side, rgba(255,205,60,.66), rgba(255,175,40,.24) 55%, rgba(255,175,40,0) 78%);
        animation:egTwk 3.4s ease-in-out infinite alternate; }
  /* sparkles on the painted eggs — in the baskets and tucked in the grass */
  .spk { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        animation:egTwk ease-in-out infinite alternate; }
  @keyframes egTwk { from { opacity:.3; transform:translate(-50%,-50%) scale(.82) } to { opacity:1; transform:translate(-50%,-50%) scale(1.18) } }
  /* blossom petals drifting down through the garden — a traveling element */
  #petals { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .petal { position:absolute; border-radius:82% 4px 82% 4px; pointer-events:none; opacity:0;
        animation:egPetal linear infinite; will-change:transform,opacity; }
  @keyframes egPetal { 0% { transform:translate(0,0) rotate(0deg); opacity:0 } 10% { opacity:.92 } 55% { opacity:.78 } 100% { transform:translate(var(--mx), var(--my)) rotate(320deg); opacity:0 } }
  /* one butterfly crossing the upper garden, wings flapping — the other traveler */
  .bfly { position:absolute; left:5%; top:15%; width:3.4%; aspect-ratio:1.5; pointer-events:none; z-index:3;
        animation:egFly 34s ease-in-out infinite alternate; will-change:transform; }
  .bfly .bw { position:absolute; top:8%; width:46%; height:84%; border-radius:50% 50% 46% 46%;
        background:radial-gradient(closest-side, rgba(255,166,48,.95), rgba(240,120,30,.85) 70%, rgba(200,80,20,.9)); }
  .bfly .bw.l { left:2%; transform-origin:100% 50%; animation:egWing .34s ease-in-out infinite alternate; }
  .bfly .bw.r { right:2%; transform-origin:0% 50%; animation:egWing .34s ease-in-out infinite alternate-reverse; }
  .bfly .bd { position:absolute; left:50%; top:16%; width:9%; height:68%; transform:translateX(-50%); border-radius:999px; background:#5a3418; }
  @keyframes egWing { from { transform:scaleX(.35) rotate(-8deg) } to { transform:scaleX(1) rotate(6deg) } }
  @keyframes egFly { 0% { transform:translate(0,0) } 30% { transform:translate(30vw,-2.5vh) } 55% { transform:translate(52vw,3.5vh) } 78% { transform:translate(74vw,-1.5vh) } 100% { transform:translate(88vw,2.5vh) } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(46,84,32,.55); color:#fff3c4; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,209,102,.6); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #fill, #drift, #sunwash, #gold, .spk, .petal, .bfly, .bfly .bw { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends in a spring garden on Easter morning, each holding a woven basket of painted eggs — Teal holding up the golden egg, Goggles, Braids and Phones standing behind, Pink, Cap, Puff holding a baby chick and Beanie in front — a white bunny by the garden path, tulips and daffodils in front, cherry blossoms overhead, a robin on the picket fence and a jar of jelly beans on the stool">
    </div>
    <div id="sunwash"></div>
    <div id="gold"></div>
    <div id="fx"></div>
    <div id="petals"></div>
    <div class="bfly"><span class="bw l"></span><span class="bw r"></span><span class="bd"></span></div>
    <div id="caption">HAPPY EASTER</div>
  </div>
</div>
<script>
  // Easter Garden (Gary's living standard): the painting stays exactly itself; the morning sun breathes over the blossoms, the golden egg glows, the painted eggs sparkle in their own colors in the baskets and the grass, blossom petals drift down through it all, and one butterfly crosses the garden. Cards move faster than photos. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    // sparkles on the painted eggs — basket eggs first, then the eggs tucked in the grass
    var eggs = [
      [22.5,40,'255,150,190'],[38,38.5,'140,200,255'],[58.5,43.5,'255,190,120'],[80,39.5,'190,160,255'],
      [24,79,'255,170,205'],[43,78,'170,225,160'],[70.5,80.5,'255,160,190'],[88,81.5,'140,200,255'],
      [8,93.5,'140,200,255'],[17,88.5,'255,205,110'],[33,97.5,'255,230,140'],[46.5,96.5,'140,200,255'],[59.5,96.5,'255,170,205']
    ];
    for (var i = 0; i < eggs.length; i++) {
      var sz = 0.8 + (i % 3) * 0.22;
      html += '<div class="spk" style="left:' + eggs[i][0] + '%;top:' + eggs[i][1] + '%;width:' + sz.toFixed(2) + '%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(' + eggs[i][2] + ',.95), rgba(' + eggs[i][2] + ',.3) 55%, rgba(' + eggs[i][2] + ',0) 78%);animation-duration:' + (1.9 + (i % 4) * 0.45).toFixed(1) + 's;animation-delay:-' + (i * 0.41).toFixed(2) + 's"></div>';
    }
    host.innerHTML = html;
    // blossom petals drifting down across the whole garden
    var petals = document.getElementById('petals'), phtml = '';
    var cols = ['#f9c6dd', '#f7a8c4', '#fdf0f5', '#f5b8cf'];
    for (var m = 0; m < 17; m++) {
      var lx = 3 + (m * 37) % 92, ly = (m * 23) % 40;
      var dx = ((m % 5) - 2) * 2.6, dy = 48 + (m % 4) * 7;
      var ldur = (9 + (m % 5) * 1.6).toFixed(1), ldel = (m * 1.47).toFixed(2);
      var lsz = (1.2 + (m % 3) * 0.42).toFixed(2);
      phtml += '<div class="petal" style="left:' + lx + '%;top:' + ly + '%;width:' + lsz + '%;aspect-ratio:1;background:' + cols[m % 4] + ';--mx:' + dx.toFixed(1) + 'vw;--my:' + dy.toFixed(0) + 'vh;animation-duration:' + ldur + 's;animation-delay:-' + ldel + 's"></div>';
    }
    petals.innerHTML = phtml;
  })();
</script>
</body>
</html>
