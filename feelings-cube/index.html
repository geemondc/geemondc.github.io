<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Spin a Feeling — a feelings cube</title>
<link rel="preload" as="image" href="joy.jpg">
<link rel="preload" as="image" href="love.jpg">
<link rel="preload" as="image" href="wow.jpg">
<link rel="preload" as="image" href="silly.jpg">
<link rel="preload" as="image" href="calm.jpg">
<link rel="preload" as="image" href="cozy.jpg">
<style>
  :root{
    --s: min(62vmin, 340px);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#000;
    color:#fff;
    font-family: Georgia, 'Times New Roman', serif;
    overflow:hidden;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    -webkit-user-select:none;
    cursor:grab;
    touch-action:none;
  }
  body.dragging{ cursor:grabbing; }
  /* faint studio ambience in the void */
  .void-glow{
    position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 46% at 50% 62%, rgba(70,90,160,.16), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 45%, rgba(24,26,40,.55), transparent 75%);
  }
  .stage{
    position:relative;
    width:var(--s); height:var(--s);
    perspective: calc(var(--s) * 3.4);
    perspective-origin: 50% 42%;
    opacity:0;
    transition: opacity 1.1s ease .15s;
    touch-action:none;
  }
  body.ready .stage{ opacity:1; }
  .float{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    animation: cubeBob 7.5s ease-in-out infinite;
  }
  .cube{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transform: rotateX(-17deg) rotateY(-24deg);
    will-change: transform;
  }
  .face{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.55), inset 0 0 calc(var(--s)*.14) rgba(0,0,0,.28);
    overflow:hidden;
  }
  .face .sheen, .face .shimmer{
    position:absolute; inset:-30%;
    pointer-events:none;
  }
  /* joy face: a slow drift of warm light */
  .f-front .sheen{
    background: radial-gradient(circle at 30% 30%, rgba(255,236,180,.34), rgba(255,236,180,0) 46%);
    mix-blend-mode:soft-light;
    animation: lightDrift 11s ease-in-out infinite alternate;
  }
  /* love face: a slow drift of rose light */
  .f-right .sheen{
    background: radial-gradient(circle at 34% 30%, rgba(255,170,190,.32), rgba(255,170,190,0) 48%);
    mix-blend-mode:soft-light;
    animation: lightDrift 13s ease-in-out infinite alternate-reverse;
  }
  /* the feeling word, banded along the bottom edge of each face */
  .face .tag{
    position:absolute; left:0; right:0; bottom:0;
    padding: calc(var(--s)*.030) 0 calc(var(--s)*.036);
    text-align:center;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: calc(var(--s)*.054);
    font-weight:600;
    letter-spacing:.34em;
    text-indent:.34em;
    color:#fff;
    background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
    text-shadow: 0 1px 10px rgba(0,0,0,.65);
    pointer-events:none;
  }
  .f-front { transform: rotateY(0deg)    translateZ(calc(var(--s)/2)); background-image:url('joy.jpg'); }
  .f-right { transform: rotateY(90deg)   translateZ(calc(var(--s)/2)); background-image:url('love.jpg'); }
  .f-back  { transform: rotateY(180deg)  translateZ(calc(var(--s)/2)); background-image:url('wow.jpg'); }
  .f-left  { transform: rotateY(-90deg)  translateZ(calc(var(--s)/2)); background-image:url('silly.jpg'); }
  .f-top   { transform: rotateX(90deg)   translateZ(calc(var(--s)/2)); background-image:url('calm.jpg'); }
  .f-bottom{ transform: rotateX(-90deg)  translateZ(calc(var(--s)/2)); background-image:url('cozy.jpg'); }
  /* dark paper core: any hairline seam reads as the cube's edge, never the void */
  .core{ position:absolute; inset:0; transform-style:preserve-3d; transform:scale(.994); }
  .core .cf{
    position:absolute; inset:0; background:#0a0a10;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .cf-front { transform: rotateY(0deg)   translateZ(calc(var(--s)/2)); }
  .cf-right { transform: rotateY(90deg)  translateZ(calc(var(--s)/2)); }
  .cf-back  { transform: rotateY(180deg) translateZ(calc(var(--s)/2)); }
  .cf-left  { transform: rotateY(-90deg) translateZ(calc(var(--s)/2)); }
  .cf-top   { transform: rotateX(90deg)  translateZ(calc(var(--s)/2)); }
  .cf-bottom{ transform: rotateX(-90deg) translateZ(calc(var(--s)/2)); }
  /* soft studio glow pooling under the cube */
  .floor-glow{
    position:absolute;
    left:50%; top:calc(100% + var(--s)*.16);
    width:calc(var(--s)*1.25); height:calc(var(--s)*.30);
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(150,170,255,.30), rgba(120,140,220,.12) 45%, transparent 72%);
    filter:blur(6px);
    border-radius:50%;
    animation: glowPulse 7.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes cubeBob{
    0%,100%{ transform: translateY(calc(var(--s)*-.018)); }
    50%    { transform: translateY(calc(var(--s)* .022)); }
  }
  @keyframes glowPulse{
    0%,100%{ transform:translateX(-50%) scaleX(1.04); opacity:.85; }
    50%    { transform:translateX(-50%) scaleX(.94);  opacity:.6; }
  }
  @keyframes lightDrift{
    from{ transform: translate(-7%, -4%); }
    to  { transform: translate(9%, 6%); }
  }
  .caption{
    margin-top: calc(var(--s)*.30);
    text-align:center;
    opacity:0;
    transition: opacity 1.2s ease .5s;
  }
  body.ready .caption{ opacity:1; }
  /* the landing caption: the feeling the spin settled on */
  .feel{
    min-height: calc(var(--s)*.24);
    margin-bottom: 12px;
    opacity:0;
    transform: translateY(5px);
    transition: opacity .55s ease, transform .55s ease;
  }
  .feel.show{ opacity:1; transform:none; }
  .feel-name{
    display:block;
    font-size: clamp(21px, 3.6vmin, 28px);
    letter-spacing:.32em;
    text-indent:.32em;
    color:#fff;
    text-shadow: 0 1px 16px rgba(0,0,0,.9);
  }
  .feel-line{
    display:block;
    margin-top:5px;
    font-size: clamp(14px, 2.2vmin, 17px);
    font-style: italic;
    letter-spacing:.1em;
    color: rgba(255,255,255,.68);
    text-shadow: 0 1px 12px rgba(0,0,0,.9);
  }
  .line{
    font-size: clamp(17px, 2.6vmin, 22px);
    font-style: italic;
    letter-spacing:.14em;
    color: rgba(255,255,255,.78);
    text-shadow: 0 1px 14px rgba(0,0,0,.9);
  }
  .hint{
    margin-top: 10px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11px;
    letter-spacing:.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,.30);
  }
  @media (prefers-reduced-motion: reduce){
    .float, .floor-glow, .f-front .sheen, .f-right .sheen{ animation:none; }
  }
</style>
</head>
<body>
  <div class="void-glow"></div>

  <div class="stage" id="stage" aria-label="A cube of feelings you can drag to spin, or flick to send it whirling. Each face is one of the friends wearing a big feeling: Teal laughing with joy, Pink making a heart for love, Goggles amazed with wow, Cap being silly, Braids calm with her eyes closed, and Puff cozy in a scarf. When the spin settles, the cube names the feeling facing you.">
    <div class="float">
      <div class="cube" id="cube">
        <div class="core">
          <div class="cf cf-front"></div><div class="cf cf-right"></div>
          <div class="cf cf-back"></div><div class="cf cf-left"></div>
          <div class="cf cf-top"></div><div class="cf cf-bottom"></div>
        </div>
        <div class="face f-front"><div class="sheen"></div><div class="tag">JOY</div></div>
        <div class="face f-right"><div class="sheen"></div><div class="tag">LOVE</div></div>
        <div class="face f-back"><div class="tag">WOW</div></div>
        <div class="face f-left"><div class="tag">SILLY</div></div>
        <div class="face f-top"><div class="tag">CALM</div></div>
        <div class="face f-bottom"><div class="tag">COZY</div></div>
      </div>
    </div>
    <div class="floor-glow"></div>
  </div>

  <div class="caption">
    <div class="feel" id="feel"><span class="feel-name" id="feelName"></span><span class="feel-line" id="feelLine"></span></div>
    <div class="line">six feelings, one cube.</div>
    <div class="hint">drag to spin &middot; flick it fast</div>
  </div>

<script>
  (function(){
    function ready(){ document.body.classList.add('ready'); }
    window.addEventListener('load', ready);
    setTimeout(ready, 1600);

    var cube = document.getElementById('cube');
    var stage = document.getElementById('stage');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---- rotation state (degrees) ---- */
    var REST_X = -17;              /* resting tilt, as shipped */
    var IDLE = 360 / 52;           /* the original slow turn: one revolution per 52s */
    var X_MIN = -50, X_MAX = 15;   /* tilt clamp: never flips into unreadability */
    var SENS_Y = 0.45;             /* deg of spin per px dragged horizontally */
    var SENS_X = 0.35;             /* deg of tilt per px dragged vertically */
    var TAP_SLOP = 6;              /* px of movement under which a press is a tap */
    var VEL_CAP = 900;             /* deg/s, fastest flick we honour */

    var rotY = -24, rotX = REST_X;
    var momY = 0, momX = 0;        /* momentum velocity (deg/s) beyond the idle turn */
    var dragging = false, moved = false;
    var lastX = 0, lastY = 0, downX = 0, downY = 0;
    var trail = [];                /* recent {t, rotY, rotX} samples for release velocity */

    function clampX(v){ return Math.max(X_MIN, Math.min(X_MAX, v)); }
    function clampV(v){ return Math.max(-VEL_CAP, Math.min(VEL_CAP, v)); }
    function paused(){ return document.body.classList.contains('paused'); }
    function apply(){
      cube.style.transform = 'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg)';
    }

    /* ---- the six feelings: name, tiny line, and the face's outward normal ---- */
    var FEEL = {
      joy:  { name:'JOY',   line:'pass it on',      n:[0,0,1]  },
      love: { name:'LOVE',  line:'send some today', n:[1,0,0]  },
      wow:  { name:'WOW',   line:'look up',         n:[0,0,-1] },
      silly:{ name:'SILLY', line:'stay loose',      n:[-1,0,0] },
      calm: { name:'CALM',  line:'breathe out',     n:[0,-1,0] },
      cozy: { name:'COZY',  line:'settle in',       n:[0,1,0]  }
    };
    var ORDER = ['joy','love','wow','silly','calm','cozy'];
    /* the face whose outward normal points most at the viewer right now,
       under the cube's own transform: rotateX(rotX) rotateY(rotY) */
    function frontKey(){
      var cy = Math.cos(rotY * Math.PI/180), sy = Math.sin(rotY * Math.PI/180);
      var cx = Math.cos(rotX * Math.PI/180), sx = Math.sin(rotX * Math.PI/180);
      var best = 'joy', bz = -2;
      for(var i = 0; i < ORDER.length; i++){
        var n = FEEL[ORDER[i]].n;
        var z1 = -n[0]*sy + n[2]*cy;   /* after rotateY */
        var z2 = n[1]*sx + z1*cx;      /* after rotateX */
        if(z2 > bz){ bz = z2; best = ORDER[i]; }
      }
      return best;
    }

    /* ---- the landing caption ---- */
    var feelEl = document.getElementById('feel');
    var feelName = document.getElementById('feelName');
    var feelLine = document.getElementById('feelLine');
    var shownKey = null;
    var holdUntil = 0;               /* while now < holdUntil the idle turn waits and the caption stays */
    var HOLD_MS = 4200;
    function showFeel(key){
      if(key !== shownKey){
        shownKey = key;
        feelName.textContent = FEEL[key].name;
        feelLine.textContent = FEEL[key].line;
      }
      feelEl.classList.add('show');
    }
    function hideFeel(){ feelEl.classList.remove('show'); }

    /* ---- main loop: idle turn + momentum with smooth friction, tilt settles home ---- */
    var prevT = null;
    function frame(now){
      if(prevT === null) prevT = now;
      var dt = Math.min(0.05, (now - prevT) / 1000);
      prevT = now;
      if(!dragging && dt > 0){
        if(momY !== 0 || momX !== 0){
          rotY += momY * dt;
          rotX = clampX(rotX + momX * dt);
          var decay = Math.exp(-dt / 0.85);   /* friction: eases out over a few seconds */
          momY *= decay; momX *= decay;
          if(Math.abs(momY) < 2) momY = 0;
          if(Math.abs(momX) < 2) momX = 0;
        }
        if(!paused() && !reduced && now > holdUntil) rotY += IDLE * dt;
        /* tilt drifts gently back to its resting angle once the hand lets go */
        if(Math.abs(momX) < 30) rotX += (REST_X - rotX) * (1 - Math.exp(-dt / 1.4));
      }
      apply();
      /* caption: named only once the spin has settled — while the cube is
         being dragged or whirling, no feeling is named; once it settles,
         the front feeling is announced and the idle turn waits a few
         seconds before carrying the cube on. Paused (or reduced motion):
         the caption simply stays with whatever faces front. */
      var moving = dragging || Math.abs(momY) > 12 || Math.abs(momX) > 12;
      if(moving){
        holdUntil = 0;
        hideFeel();
      } else if(paused() || reduced){
        showFeel(frontKey());
      } else {
        if(!holdUntil) holdUntil = now + HOLD_MS;
        if(now <= holdUntil) showFeel(frontKey());
        else hideFeel();
      }
      requestAnimationFrame(frame);
    }
    apply();
    requestAnimationFrame(frame);

    /* ---- pointer: drag to turn, flick to spin, tap to pause ---- */
    stage.addEventListener('pointerdown', function(e){
      dragging = true; moved = false;
      downX = lastX = e.clientX; downY = lastY = e.clientY;
      momY = 0; momX = 0;
      trail = [{ t: performance.now(), rotY: rotY, rotX: rotX }];
      document.body.classList.add('dragging');
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    stage.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      if(!moved && Math.hypot(e.clientX - downX, e.clientY - downY) < TAP_SLOP) return;
      moved = true;
      rotY -= dx * SENS_Y;   /* grab feel: the face follows the finger */
      rotX = clampX(rotX - dy * SENS_X);
      var now = performance.now();
      trail.push({ t: now, rotY: rotY, rotX: rotX });
      while(trail.length > 2 && now - trail[0].t > 120) trail.shift();
      apply();
    });
    function release(){
      if(!dragging) return;
      dragging = false;
      document.body.classList.remove('dragging');
      if(!moved){
        document.body.classList.toggle('paused');   /* a clean tap still pauses / resumes */
        if(!paused()) holdUntil = performance.now() + 1200;   /* let the caption linger a breath after unpausing */
        return;
      }
      if(reduced) return;                            /* reduced motion: no momentum */
      var now = performance.now();
      while(trail.length && now - trail[0].t > 120) trail.shift();
      if(trail.length < 2) return;
      var first = trail[0], last = trail[trail.length - 1];
      if(now - last.t > 80) return;                  /* hand had already stopped: no flick */
      var span = (last.t - first.t) / 1000;
      if(span <= 0) return;
      var vY = (last.rotY - first.rotY) / span;
      var vX = (last.rotX - first.rotX) / span;
      /* keep spinning at the speed of the hand, above the idle turn it returns to */
      momY = clampV(vY - (paused() ? 0 : IDLE));
      momX = clampV(vX);
    }
    stage.addEventListener('pointerup', release);
    stage.addEventListener('pointercancel', release);

    document.addEventListener('keydown', function(e){
      if(e.code === 'Space'){ e.preventDefault(); document.body.classList.toggle('paused'); }
    });

    /* test handle (invisible in normal use) */
    window.__cube = {
      get rotY(){ return rotY; }, get rotX(){ return rotX; },
      get momY(){ return momY; }, get dragging(){ return dragging; },
      get paused(){ return paused(); },
      get front(){ return frontKey(); }, get feel(){ return shownKey; },
      get holdUntil(){ return holdUntil; }
    };
  })();
</script>
</body>
</html>
