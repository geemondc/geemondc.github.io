<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Love — Pink — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#33060f; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.5); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#33060f;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:feelDrift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes feelDrift { from { transform:scale(1.02) translate(0.4%,0.2%); } to { transform:scale(1.08) translate(-0.9%,-0.5%); } }
  /* the portrait is square: it stands whole and uncropped at the frame's heart,
     its own blurred extension filling the rest of the frame around it */
  #back { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; filter:blur(16px) brightness(.62); transform:scale(1.06); }
  #still { position:relative; height:100%; aspect-ratio:1/1; width:auto; max-width:100%; margin:0 auto; object-fit:cover; display:block;
           box-shadow:0 10px 44px rgba(0,0,0,.45); }
  #glow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:feelBreathe 7s ease-in-out infinite alternate;
         background:radial-gradient(46% 58% at 50% 42%, rgba(255,150,150,.30), rgba(255,110,110,.09) 55%, rgba(255,190,110,0) 78%); }
  @keyframes feelBreathe { from { opacity:.30 } to { opacity:.95 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(30,19,4,.62); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; text-transform:uppercase; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #glow { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="back" src="still.jpg" alt="" aria-hidden="true">
      <img id="still" src="still.jpg" alt="Pink smiling adoringly, her hands forming a heart, purple-pink hair and gold star earrings, rose-red painterly light all around her — pure love">
    </div>
    <div id="glow"></div>
    <div id="caption">LOVE</div>
  </div>
</div>
<script>
  // Love — Pink: the portrait stays exactly itself; a warm light breathes slowly
  // across it and the picture drifts a little, the house living manner.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
  })();
</script>
</body>
</html>
