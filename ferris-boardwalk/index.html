<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Boardwalk — A Living Photo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:34px 18px 30px; }
  h1 { font-size:clamp(28px, 4.5vw, 44px); font-weight:normal; letter-spacing:.14em;
       text-transform:uppercase; color:#f2ead6; text-align:center; }
  .statement { margin-top:8px; font-style:italic; font-size:clamp(14px, 2vw, 18px);
               color:#b9b09a; text-align:center; }
  .stage { position:relative; width:min(1180px, 100%); margin-top:26px;
           aspect-ratio: 2560 / 1440; cursor:pointer; background:#000;
           box-shadow: 0 18px 60px rgba(0,0,0,.65); }
  .stage img, .fsstage img { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  .stage img.crop, .fsstage img.crop { object-fit:fill; }
  .controls { margin-top:22px; display:flex; justify-content:center; }
  button { font-family:inherit; cursor:pointer; background:transparent;
           color:#e8e2d4; border:1px solid #8a7f63; letter-spacing:.12em; }
  #ignite { font-size:17px; padding:13px 34px; border-radius:999px;
            text-transform:uppercase; }
  #ignite:hover { background:#1c1a14; }
  .toggle { display:none; border:1px solid #8a7f63; border-radius:999px; overflow:hidden; }
  .toggle button { border:none; font-size:15px; padding:11px 30px;
                   text-transform:uppercase; background:transparent; }
  .toggle button.on { background:#e8e2d4; color:#141310; }
  .credit { margin-top:16px; font-size:14px; color:#8f887a; text-align:center; }
  .credit a { color:#b9b09a; }
  #fs { position:fixed; inset:0; background:#000; display:none; z-index:50;
        cursor:pointer; align-items:center; justify-content:center; }
  .fsstage { position:relative; aspect-ratio: 2560 / 1440;
             width:min(100vw, calc(100vh * 2560 / 1440)); background:#000; }
</style>
</head>
<body>
<main>
  <h1>The Boardwalk</h1>
  <div class="statement">Every light, twice — once in the sky, once in the sea</div>

  <div class="stage" id="stage" title="Tap for full screen">
    <img id="lyrDay" src="still.jpg" alt="">
    <img id="lyrGold" src="gold.jpg" alt="" style="opacity:0">
    <img id="lyrDeep" src="deep.jpg" alt="" style="opacity:0">
    <img id="lyrStars" class="crop" src="acc-stars.png" alt="" style="left:39.6484%;top:0.0000%;width:55.0000%;height:22.3611%;opacity:0">
    <img id="lyrFireworks" class="crop" src="acc-fireworks.png" alt="" style="left:21.7578%;top:28.9583%;width:12.3828%;height:12.6389%;opacity:0">
    <img id="lyrWheelRed" class="crop" src="acc-wheel-red.png" alt="" style="left:43.2422%;top:11.1806%;width:19.7656%;height:36.1111%;opacity:0">
    <img id="lyrWheelGold" class="crop" src="acc-wheel-gold.png" alt="" style="left:42.4609%;top:11.3889%;width:22.2266%;height:35.9722%;opacity:0">
    <img id="lyrWheelGreen" class="crop" src="acc-wheel-green.png" alt="" style="left:45.0781%;top:14.3750%;width:14.1797%;height:25.8333%;opacity:0">
    <img id="lyrWheelBlue" class="crop" src="acc-wheel-blue.png" alt="" style="left:43.6719%;top:6.1806%;width:15.9375%;height:35.3472%;opacity:0">
    <img id="lyrWheelViolet" class="crop" src="acc-wheel-violet.png" alt="" style="left:40.3125%;top:11.1806%;width:16.7969%;height:30.2778%;opacity:0">
    <img id="lyrNeonShell" class="crop" src="acc-neon-shell.png" alt="" style="left:81.5234%;top:28.4722%;width:6.7969%;height:13.1944%;opacity:0">
    <img id="lyrNeonPalm" class="crop" src="acc-neon-palm.png" alt="" style="left:89.4531%;top:26.3889%;width:4.1016%;height:13.9583%;opacity:0">
    <img id="lyrLamps" class="crop" src="acc-lamps.png" alt="" style="left:35.8594%;top:27.9167%;width:64.1406%;height:23.5417%;opacity:0">
    <img id="lyrWindows" class="crop" src="acc-windows.png" alt="" style="left:9.2578%;top:15.2778%;width:90.7422%;height:31.8750%;opacity:0">
    <img id="lyrShimA" class="crop" src="acc-shim-a.png" alt="" style="left:0.0000%;top:44.0972%;width:84.1406%;height:55.9028%;opacity:0">
    <img id="lyrShimB" class="crop" src="acc-shim-b.png" alt="" style="left:0.0000%;top:44.0972%;width:84.7266%;height:55.9028%;opacity:0">
    <img id="lyrShimC" class="crop" src="acc-shim-c.png" alt="" style="left:0.0000%;top:44.0972%;width:84.8438%;height:55.9028%;opacity:0">
  </div>

  <div class="controls">
    <button id="ignite">&#10022; Bring it to life</button>
    <div class="toggle" id="toggle">
      <button id="btnStill">Still</button><button id="btnLiving" class="on">Living</button>
    </div>
  </div>
  <div class="credit"><a href="https://thelivingphotos.com" target="_blank" rel="noopener">Living Photos</a> — Future Ready</div>
</main>

<div id="fs">
  <div class="fsstage" id="fsstage">
    <img id="fsDay" src="still.jpg" alt="">
    <img id="fsGold" src="gold.jpg" alt="" style="opacity:0">
    <img id="fsDeep" src="deep.jpg" alt="" style="opacity:0">
    <img id="fsStars" class="crop" src="acc-stars.png" alt="" style="left:39.6484%;top:0.0000%;width:55.0000%;height:22.3611%;opacity:0">
    <img id="fsFireworks" class="crop" src="acc-fireworks.png" alt="" style="left:21.7578%;top:28.9583%;width:12.3828%;height:12.6389%;opacity:0">
    <img id="fsWheelRed" class="crop" src="acc-wheel-red.png" alt="" style="left:43.2422%;top:11.1806%;width:19.7656%;height:36.1111%;opacity:0">
    <img id="fsWheelGold" class="crop" src="acc-wheel-gold.png" alt="" style="left:42.4609%;top:11.3889%;width:22.2266%;height:35.9722%;opacity:0">
    <img id="fsWheelGreen" class="crop" src="acc-wheel-green.png" alt="" style="left:45.0781%;top:14.3750%;width:14.1797%;height:25.8333%;opacity:0">
    <img id="fsWheelBlue" class="crop" src="acc-wheel-blue.png" alt="" style="left:43.6719%;top:6.1806%;width:15.9375%;height:35.3472%;opacity:0">
    <img id="fsWheelViolet" class="crop" src="acc-wheel-violet.png" alt="" style="left:40.3125%;top:11.1806%;width:16.7969%;height:30.2778%;opacity:0">
    <img id="fsNeonShell" class="crop" src="acc-neon-shell.png" alt="" style="left:81.5234%;top:28.4722%;width:6.7969%;height:13.1944%;opacity:0">
    <img id="fsNeonPalm" class="crop" src="acc-neon-palm.png" alt="" style="left:89.4531%;top:26.3889%;width:4.1016%;height:13.9583%;opacity:0">
    <img id="fsLamps" class="crop" src="acc-lamps.png" alt="" style="left:35.8594%;top:27.9167%;width:64.1406%;height:23.5417%;opacity:0">
    <img id="fsWindows" class="crop" src="acc-windows.png" alt="" style="left:9.2578%;top:15.2778%;width:90.7422%;height:31.8750%;opacity:0">
    <img id="fsShimA" class="crop" src="acc-shim-a.png" alt="" style="left:0.0000%;top:44.0972%;width:84.1406%;height:55.9028%;opacity:0">
    <img id="fsShimB" class="crop" src="acc-shim-b.png" alt="" style="left:0.0000%;top:44.0972%;width:84.7266%;height:55.9028%;opacity:0">
    <img id="fsShimC" class="crop" src="acc-shim-c.png" alt="" style="left:0.0000%;top:44.0972%;width:84.8438%;height:55.9028%;opacity:0">
  </div>
</div>

<script>
(function(){
  "use strict";
  var T = 20;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var frozen = null;          // QA: freeze the clock at this many seconds
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  var anchor = 0;             // scene seconds at anchorNow (phase anchor)
  var anchorNow = 0;          // performance.now() at the anchor
  var rate = 1;               // scene seconds per wall second (7 during the ignition sweep)
  var SWEEP_END = 6.6667;         // scene time where the sweep hands over (gold reached)
  var clock = 0;              // current scene clock, seconds (QA state)

  var ACCN = ['Stars','Fireworks','WheelRed','WheelGold','WheelGreen','WheelBlue',
              'WheelViolet','NeonShell','NeonPalm','Lamps','Windows','ShimA','ShimB','ShimC'];
  function stack(p){
    var s = { day: document.getElementById(p+'Day'),
              gold: document.getElementById(p+'Gold'),
              deep: document.getElementById(p+'Deep') };
    for (var i = 0; i < ACCN.length; i++) s[ACCN[i]] = document.getElementById(p + ACCN[i]);
    return s;
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsOpen = false;

  function ss(x){ x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
  function goldW(t){
    t = ((t % T) + T) % T;
    if (t < 2) return 0;
    if (t < 4.6667) return (t - 2) / 2.6667;
    if (t < 17.3333) return 1;
    return 1 - (t - 17.3333) / 2.6667;
  }
  function deepW(t){
    t = ((t % T) + T) % T;
    if (t < 7.3333) return 0;
    if (t < 10.6667) return (t - 7.3333) / 3.3333;
    if (t < 17.3333) return 1;
    return 1 - (t - 17.3333) / 2.6667;
  }
  var WSTART = { WheelRed:0.05, WheelGold:0.20, WheelGreen:0.35, WheelBlue:0.50, WheelViolet:0.65 };
  var WPER = { WheelRed:4, WheelGold:5, WheelGreen:3.3333, WheelBlue:6.6667, WheelViolet:10 };
  var WPH = { WheelRed:0, WheelGold:1.1667, WheelGreen:0.4, WheelBlue:2.3333, WheelViolet:3.6667 };
  function accOpacities(t){
    var dep = deepW(t), o = {}, fams = ['WheelRed','WheelGold','WheelGreen','WheelBlue','WheelViolet'];
    for (var i = 0; i < fams.length; i++){
      var f = fams[i];
      var g = ss((dep - WSTART[f]) / (1 - WSTART[f]) * 1.15);
      var pulse = 0.62 + 0.38 * Math.cos(2 * Math.PI * (t + WPH[f]) / WPER[f]);
      o[f] = g * pulse * 0.95;
    }
    o.Lamps = ss((dep - 0.10) / 0.70) * (0.78 + 0.22 * Math.cos(2 * Math.PI * (t + 0.6667) / 5));
    o.Windows = ss((dep - 0.18) / 0.72) * (0.82 + 0.18 * Math.cos(2 * Math.PI * (t + 1.6667) / 6.6667));
    o.NeonShell = ss((dep - 0.05) / 0.60) * (0.72 + 0.28 * Math.cos(2 * Math.PI * t / 4));
    o.NeonPalm = ss((dep - 0.05) / 0.60) * (0.72 + 0.28 * Math.cos(2 * Math.PI * (t + 1.3333) / 5));
    o.Fireworks = ss((dep - 0.42) / 0.58) * Math.pow(0.5 - 0.5 * Math.cos(2 * Math.PI * t / 6.6667), 3) * 0.85;
    o.Stars = ss((dep - 0.50) / 0.50) * (0.88 + 0.12 * Math.cos(2 * Math.PI * (t + 3) / 10));
    var amp = 0.22 + 0.78 * Math.max(goldW(t), dep);
    var P = [3, 4.3333, 5.6667], PH = [0, 1.4333, 2.7], NM = ['ShimA','ShimB','ShimC'];
    for (var k = 0; k < 3; k++){
      var pu = ss(0.5 - 0.5 * Math.cos(2 * Math.PI * (t + PH[k]) / P[k]));
      o[NM[k]] = amp * (0.30 + 0.70 * pu) * 0.9;
    }
    if (forcedAcc !== null){ for (var key in o) o[key] = forcedAcc; }
    return o;
  }
  function apply(st, ao, living, gw, dw){
    st.day.style.opacity = 1;
    st.gold.style.opacity = living ? gw : 0;
    st.deep.style.opacity = living ? dw : 0;
    for (var i = 0; i < ACCN.length; i++)
      st[ACCN[i]].style.opacity = living ? ao[ACCN[i]] : 0;
  }
  function frame(now){
    // Scene time is a pure function of wall time (performance.now): the phase
    // is anchor + rate * elapsed, re-anchored only at ignite/freeze boundaries,
    // so frame rate can never stretch the 20s cycle.
    if (ignited && frozen === null){
      var tNow = anchor + rate * (now - anchorNow) / 1000;
      if (rate === 7 && tNow >= SWEEP_END){ anchor = tNow; anchorNow = now; rate = 1; }
      clock = tNow;
    }
    var t = frozen !== null ? frozen : clock;
    var ao = accOpacities(t);
    var living = state === 'living';
    apply(page, ao, living, goldW(t), deepW(t));
    if (fsOpen) apply(fs, ao, living, goldW(t), deepW(t));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){ ignited = true; anchor = 0; anchorNow = performance.now(); rate = 7; clock = 0; }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  // Full screen is STATE-PRESERVING: it shows exactly what the page shows
  // (still stays still; living keeps its phase - the clock never stops),
  // letterboxed whole on black, and exiting restores the page exactly.
  function openFs(){ fsOpen = true; fsEl.style.display = 'flex'; }
  function closeFs(){ fsOpen = false; fsEl.style.display = 'none'; }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && e.key === 'Escape') closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ if (frozen !== null){ frozen = null; anchor = clock; anchorNow = performance.now(); } },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : clock); },
    state: function(){ return { state: state, fsOpen: fsOpen, clock: clock }; },
    goldW: goldW, deepW: deepW
  };
})();
</script>
<style>
  /* Wall mode fit (added for the Living Photos wall): whole photo, with
     the photo's own blurred plates filling any surround. */
  #fs .lp-wallbg { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #fs .lp-wallbg img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; filter:blur(26px) brightness(.7) saturate(1.06);
    transform:scale(1.14); display:block; }
  #fs.lp-wallfit img:not(.acc):not(.crop):not(.lp-bgimg) { object-fit:contain !important; }
</style>
<script>
(function(){
  "use strict";
  // Wall mode: embedded in the Living Photos wall (#wall), open directly
  // on the full-screen living view, framed whole — the wall owns taps
  // and keys, so the usual tap/key exits are disarmed in this mode only.
  if (!/(^|[#&])wall([&#]|$)/.test(location.hash || '')) return;
  var fsEl = document.getElementById('fs');
  if (!fsEl || !window.LP) return;
  // Blurred-extension surround: blurred copies of this piece's own
  // photographic plates (the .jpg layers), crossfaded in step with them.
  var plates = [];
  fsEl.querySelectorAll('img').forEach(function(im){
    if (/\.jpe?g($|\?)/i.test(im.getAttribute('src') || '')) plates.push(im);
  });
  if (plates.length){
    var bg = document.createElement('div');
    bg.className = 'lp-wallbg';
    var clones = plates.map(function(im){
      var c = document.createElement('img');
      c.src = im.src; c.alt = ''; c.className = 'lp-bgimg';
      c.style.opacity = getComputedStyle(im).opacity;
      bg.appendChild(c);
      return [c, im];
    });
    fsEl.insertBefore(bg, fsEl.firstChild);
    (function mirror(){
      for (var i = 0; i < clones.length; i++){
        var o = clones[i][1].style.opacity;
        if (o !== '') clones[i][0].style.opacity = o;
      }
      requestAnimationFrame(mirror);
    })();
  }
  fsEl.classList.add('lp-wallfit');
  if (LP.ignite){ try { LP.ignite(); } catch(e){} }
  if (LP.openFs){ try { LP.openFs(); } catch(e){} }
  document.addEventListener('keydown', function(e){ e.stopImmediatePropagation(); }, true);
  fsEl.addEventListener('click', function(e){ e.stopImmediatePropagation(); }, true);
})();
</script>
</body>
</html>
