<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Fireside — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#2a1608; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#2a1608;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 13s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* firelight breathing out of the fireplace across the room */
  #firewash { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 5.5s ease-in-out infinite alternate;
         background:radial-gradient(60% 75% at 24% 58%, rgba(255,166,66,.30), rgba(255,140,50,.08) 55%, rgba(255,140,50,0) 80%); }
  @keyframes breathe { from { opacity:.6 } to { opacity:1 } }
  /* the fire itself — a big restless glow on the logs, and the embers below */
  #fire { position:absolute; left:24%; top:54%; width:21%; aspect-ratio:1.15; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,214,130,.95), rgba(255,150,50,.38) 55%, rgba(255,120,40,0) 78%);
          animation:flk 1.15s ease-in-out infinite alternate; }
  #embers { position:absolute; left:24%; top:64.5%; width:15%; aspect-ratio:2.6; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,170,80,.85), rgba(255,110,40,.30) 55%, rgba(255,110,40,0) 78%);
          animation:flk 1.9s ease-in-out infinite alternate-reverse; }
  @keyframes flk { from { transform:translate(-50%,-50%) scale(.88); filter:brightness(.82) } to { transform:translate(-50%,-50%) scale(1.13); filter:brightness(1.28) } }
  /* the two mantel candles, each flickering on its own clock */
  .candle { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
           background:radial-gradient(closest-side, rgba(255,226,160,.95), rgba(255,180,90,.32) 55%, rgba(255,180,90,0) 78%);
           animation:flk ease-in-out infinite alternate; }
  /* snow falling past the window, slow and quiet */
  #snow { position:absolute; left:79.5%; top:0; width:20.5%; height:49%; overflow:hidden; pointer-events:none; }
  .flake { position:absolute; top:-4%; border-radius:50%; background:rgba(255,255,255,.85); animation:fall linear infinite; }
  @keyframes fall { from { transform:translate(0,-6%) } to { transform:translate(-14px, 540%) } }
  /* steam curling off the cocoa */
  #steam { position:absolute; left:86.8%; top:47.5%; width:3.4%; aspect-ratio:.62; border-radius:50%; pointer-events:none;
           background:radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,0) 72%); filter:blur(2px);
           animation:steam 4.2s ease-in-out infinite; }
  @keyframes steam { 0% { transform:translate(-50%,0) scale(.7); opacity:0 } 30% { opacity:.75 } 100% { transform:translate(-38%,-190%) scale(1.5); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(42,20,6,.55); color:#ffe6bd; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,230,189,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #firewash, #fire, #embers, .candle, .flake, #steam { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="A cozy cabin fireside with a stone fireplace, a plaid armchair, cocoa and an open book, snow falling outside the window">
    </div>
    <div id="firewash"></div>
    <div id="fire"></div>
    <div id="embers"></div>
    <div id="fx"></div>
    <div id="snow"></div>
    <div id="steam"></div>
    <div id="caption">THE FIRESIDE</div>
  </div>
</div>
<script>
  // The fireside, nobody home yet (Gary's living standard): the painting
  // stays exactly itself; the fire flickers, the candles burn, snow falls
  // past the window and the cocoa steams. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var fx = document.getElementById('fx'), html = '';
    var candles = [[13.2,4.6],[44.2,5.6]];
    for (var j = 0; j < candles.length; j++){
      html += '<div class="candle" style="left:' + candles[j][0] + '%;top:' + candles[j][1] + '%;width:2.4%;aspect-ratio:1;animation-duration:' + (1.3 + j * 0.5).toFixed(2) + 's;animation-delay:-' + (j * 0.55).toFixed(2) + 's"></div>';
    }
    fx.innerHTML = html;
    var snow = document.getElementById('snow'), sh = '';
    for (var i = 0; i < 14; i++){
      var x = (4 + (i * 29) % 92), sz = (2 + (i % 3)), dur = (7 + (i * 1.7) % 8).toFixed(1), del = (-(i * 1.3) % 9).toFixed(1);
      sh += '<div class="flake" style="left:' + x + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + dur + 's;animation-delay:' + del + 's"></div>';
    }
    snow.innerHTML = sh;
  })();
</script>
</body>
</html>
