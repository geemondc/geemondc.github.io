<title>Galaga Reborn</title>
<meta name="description" content="Galaga Reborn is a free remake of the classic arcade shooter — blast the swarm and rescue your captured fighter to fly as two, right in your browser." />

<style>
  :root{
    --bg:#04040c; --panel:#0d0d22; --ink:#f4f4ff; --dim:#a7a7d8;
    --red:#ff3355; --yellow:#ffd23e; --cyan:#37e2ff; --green:#59ff7a; --pink:#ff5fd2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;}
  body{min-height:100dvh; overflow-x:hidden;
    background:radial-gradient(900px 500px at 50% -10%, #1b1440 0%, transparent 60%), var(--bg);}
  button{font-family:inherit; cursor:pointer;}
  .px{font-family:"Press Start 2P",monospace;}

  /* ---------- INTRO ---------- */
  #intro{min-height:100dvh; display:flex; flex-direction:column; max-width:560px; margin:0 auto;}
  .heroWrap{position:relative; flex:1 1 auto; min-height:52dvh; overflow:hidden;}
  .heroWrap img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block;}
  .heroWrap::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(4,4,12,.18) 40%, rgba(4,4,12,.88) 96%);}
  .heroTitle{position:absolute; left:0; right:0; bottom:10px; z-index:2; text-align:center; padding:0 14px;}
  .heroTitle h1{margin:0; font-family:"Press Start 2P",monospace; font-size:clamp(26px,8.4vw,46px);
    color:#fff; letter-spacing:1px;
    text-shadow:0 0 18px rgba(55,226,255,.85), 0 3px 0 #123, 3px 3px 0 rgba(255,51,85,.75);}
  .heroTitle h1 .r{color:var(--yellow); text-shadow:0 0 18px rgba(255,210,62,.8), 3px 3px 0 rgba(255,51,85,.8);}
  .heroTitle p{margin:10px 0 2px; font-weight:800; font-size:clamp(14px,4vw,17px); color:#e8e8ff;
    text-shadow:0 2px 8px #000;}
  .introBar{padding:14px 16px calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px;
    background:linear-gradient(180deg, rgba(13,13,34,.4), #07071a);}
  #startBtn{border:none; border-radius:16px; padding:18px 10px; font-family:"Press Start 2P",monospace;
    font-size:clamp(16px,5vw,21px); color:#081018;
    background:linear-gradient(180deg,#ffe259,#ffa751); box-shadow:0 6px 0 #b3541e, 0 12px 26px rgba(255,167,81,.35);}
  #startBtn:active{transform:translateY(4px); box-shadow:0 2px 0 #b3541e;}
  .togRow{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .tog{flex:1 1 0; min-width:96px; border:2px solid #34346b; background:#12122e; color:var(--ink);
    border-radius:12px; padding:11px 6px; font-weight:900; font-size:13px; letter-spacing:.4px;}
  .tog:active{transform:scale(.97);}
  .tog .on{color:var(--green);} .tog .off{color:var(--red);}
  .hubLink{text-align:center; font-size:12px; color:var(--dim); text-decoration:none; font-weight:700; letter-spacing:2px;}
  .hubLink b{color:var(--cyan);}

  /* ---------- GAME ---------- */
  #game{display:none; position:fixed; inset:0; width:100%; height:100dvh; flex-direction:column; overflow:hidden;
    background:radial-gradient(900px 500px at 50% -10%, #1b1440 0%, transparent 60%), var(--bg);}
  #hud{flex:0 0 auto; width:100%; display:flex; justify-content:space-between; align-items:flex-end; gap:8px; padding:8px 12px 6px;}
  .hudCell{text-align:center; min-width:0;}
  .hudCell .lab{font-family:"Press Start 2P",monospace; font-size:8px; color:var(--red); letter-spacing:1px;}
  .hudCell .val{font-family:"Press Start 2P",monospace; font-size:clamp(12px,4vw,16px); color:#fff; margin-top:4px;}
  .hudCell .val.hi{color:var(--yellow);}
  #stageVal{color:var(--cyan);}
  #cvWrap{position:relative; flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center;
    background-image:radial-gradient(1.5px 1.5px at 24px 36px, rgba(255,255,255,.85) 50%, transparent 52%),
      radial-gradient(1px 1px at 130px 90px, rgba(159,216,255,.8) 50%, transparent 52%),
      radial-gradient(1px 1px at 70px 170px, rgba(255,255,255,.5) 50%, transparent 52%),
      radial-gradient(2px 2px at 190px 215px, rgba(255,210,62,.45) 50%, transparent 52%),
      radial-gradient(1px 1px at 232px 60px, rgba(255,255,255,.65) 50%, transparent 52%),
      radial-gradient(1px 1px at 44px 252px, rgba(255,95,210,.4) 50%, transparent 52%);
    background-size:260px 300px;}
  canvas{display:block; flex:0 0 auto; background:#000; touch-action:none; outline:none;
    border-top:2px solid #26265a; border-bottom:2px solid #26265a;}
  #deck{flex:0 0 auto; width:100%; display:flex; gap:10px; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); align-items:stretch;}
  .deckBtn{border:2px solid #34346b; background:#12122e; color:#fff; border-radius:14px;
    font-size:24px; font-weight:900; padding:14px 0; flex:1; user-select:none; -webkit-user-select:none; touch-action:none;}
  .deckBtn:active{background:#23235c;}
  #fireBtn{flex:1.4; background:linear-gradient(180deg,#ff5f7a,#d81b46); border-color:#ff8fa5;
    font-family:"Press Start 2P",monospace; font-size:15px; letter-spacing:1px;}
  #fireBtn:active{filter:brightness(1.25);}
  #pauseBtn{flex:.55; font-size:18px;}

  /* ---------- MODALS ---------- */
  #modalBk{display:none; position:fixed; inset:0; background:rgba(2,2,10,.78); z-index:50;
    align-items:center; justify-content:center; padding:18px;}
  #modalBk.open{display:flex;}
  #modal{background:var(--panel); border:2px solid #3a3a7d; border-radius:18px; max-width:430px; width:100%;
    max-height:86dvh; overflow:auto; padding:20px 20px 16px; box-shadow:0 24px 60px rgba(0,0,0,.6);}
  #modal h2{margin:0 0 12px; font-family:"Press Start 2P",monospace; font-size:15px; color:var(--yellow); line-height:1.5;}
  #modal p, #modal li{font-size:15px; line-height:1.5; color:#e6e6ff; font-weight:600;}
  #modal ul{margin:6px 0; padding-left:20px;}
  #modal table{width:100%; border-collapse:collapse; margin:8px 0; font-size:14px; font-weight:700;}
  #modal td{padding:5px 4px; border-bottom:1px solid #26265a;}
  #modal td:last-child{text-align:right; color:var(--yellow); font-family:"Press Start 2P",monospace; font-size:11px;}
  .modalClose{margin-top:14px; width:100%; border:none; border-radius:12px; padding:14px;
    background:linear-gradient(180deg,#37e2ff,#1b8fd8); color:#04121c; font-weight:900; font-size:15px;}
  #qrCv{display:block; margin:8px auto; background:#fff; border-radius:10px; padding:8px;}
  .qrUrl{text-align:center; font-size:12px; color:var(--dim); word-break:break-all;}
  .bigScore{text-align:center; font-family:"Press Start 2P",monospace; font-size:22px; color:#fff; margin:10px 0;}
  .rowBtns{display:flex; gap:10px;} .rowBtns button{flex:1;}
  .altBtn{background:#23235c !important; color:#fff !important; border:2px solid #3a3a7d;}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   GALAGA REBORN — faithful to Namco's Galaga (1981)
   Documented values used (strategyWiki / Galaga manuals):
   SCORE_TABLE below, extra fighter 20,000, challenging stages 3,7,11…
   ===================================================================== */
const SCORE_TABLE = {
  bee:       { formation: 50,  diving: 100 },
  butterfly: { formation: 80,  diving: 160 },
  boss:      { formation: 150, diving: 400 },   // diving boss alone
  bossEscortBonus: [400, 800, 1600],            // by escorts killed first (0,1,2)
  challengingAlien: 100,
  challengingGroupPerfect: 1000,
  challengingStagePerfect: 10000,
  extraFighterAt: 20000
};
const W = 448, H = 576;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

/* ---------------- audio: synthesized one-shot SFX only, NO music ---------------- */
let AC = null, soundOn = true, beamOsc = null, beamGain = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); return AC; }
function beep(f0,f1,dur,type,vol,when){
  if(!soundOn) return; const a=ac(); if(!a) return;
  const t=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noiseBurst(dur,vol){
  if(!soundOn) return; const a=ac(); if(!a) return;
  const n=a.sampleRate*dur, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=vol||.25;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const sShoot = ()=>beep(920,240,.14,'square',.06);
const sAlienDie = ()=>{ beep(300,60,.18,'sawtooth',.14); noiseBurst(.12,.12); };
const sExplode = ()=>{ noiseBurst(.5,.35); beep(120,30,.5,'triangle',.2); };
const sStinger = ()=>{ [660,880,1100,1320].forEach((f,i)=>beep(f,f,.12,'square',.1,i*.09)); };
const sCaptureSweep = ()=>beep(180,1400,1.1,'sine',.1);
function beamHumStart(){ if(!soundOn) return; const a=ac(); if(!a||beamOsc) return;
  beamOsc=a.createOscillator(); beamGain=a.createGain();
  beamOsc.type='sawtooth'; beamOsc.frequency.value=55; beamGain.gain.value=.045;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300;
  beamOsc.connect(f); f.connect(beamGain); beamGain.connect(a.destination); beamOsc.start(); }
function beamHumStop(){ if(beamOsc){ try{beamOsc.stop();}catch(e){} beamOsc=null; beamGain=null; } }

/* ---------------- game state ---------------- */
let G = null;
function newGame(){
  return {
    run:false, over:false, paused:false,
    score:0, hi:(G?G.hi:0), stage:1, lives:3, extraGiven:false,
    t:0, lastTs:0,
    player:{ x:W/2, tx:W/2, alive:true, dual:false, invuln:0, respawn:0, captureAnim:0 },
    bullets:[], ebullets:[], aliens:[], parts:[], floaters:[],
    stars: makeStars(),
    phase:'stageIntro', phaseT:0,         // stageIntro | enter | play | challenge | tally | beamWait
    banner:'', bannerT:0,
    diveTimer:3, fireTimer:1.2, beamTimer:16, beamEvent:null,
    captured:null,                          // {boss, state:'parked'|'rescuing'|'gone', x,y,t}
    groupSeq:0, challenge:null,
    shake:0, flashT:0
  };
}
function makeStars(){
  const s=[]; for(let i=0;i<100;i++) s.push({x:Math.random()*W, y:Math.random()*H,
    sp:14+Math.random()*46, sz:Math.random()<.85?1:2,
    c:['#ffffff','#ffffff','#9fd8ff','#ffd9a0','#ff9fb0'][Math.floor(Math.random()*5)],
    tw:Math.random()*6.28});
  return s;
}
const isChallengingStage = st => st>=3 && (st-3)%4===0;

/* ---------------- formation ---------------- */
function slotPos(a){
  const b = 1 + 0.07*Math.sin(G.t*0.85);                       // breathing
  const cx = W/2 + Math.sin(G.t*0.5)*20;                      // sway
  return { x: cx + (a.col-4.5)*37*b, y: 122 + (a.row-1.5)*35*b };
}
function buildFormation(){
  const defs=[];
  for(let c=3;c<=6;c++) defs.push({type:'boss', row:0, col:c});
  for(let c=1;c<=8;c++) defs.push({type:'butterfly', row:1, col:c});
  for(let r=2;r<=3;r++) for(let c=0;c<=9;c++) defs.push({type:'bee', row:r, col:c});
  return defs; // 4 + 8 + 20 = 32 — Gary's arcade grid: bosses / butterflies / bees x2 rows
}
function makeAlien(type,row,col){
  return { type, row, col, hp: type==='boss'?2:1, x:-40, y:-40, angle:0,
    state:'wait', t:0, dur:2.4, delay:0, path:null, fireCd:1+Math.random()*2,
    group:null, isEscort:false, dead:false, flap:Math.random()*6.28 };
}
/* entrance paths: cubic beziers swooping in like the original */
function enterPath(kind, slot){
  const L = kind%2===0;
  switch(kind%5){
    case 0: return {p0:{x:L?-30:W+30, y:H*0.52}, p1:{x:L?70:W-70, y:H*0.75}, p2:{x:L?60:W-60, y:60}};
    case 1: return {p0:{x:L?-30:W+30, y:40},     p1:{x:L?150:W-150, y:-10}, p2:{x:L?W-90:90, y:120}};
    case 2: return {p0:{x:W/2+(L?-30:30), y:H+30}, p1:{x:L?40:W-40, y:H*0.55}, p2:{x:L?W-70:70, y:150}};
    case 3: return {p0:{x:L?-30:W+30, y:H*0.3},  p1:{x:L?190:W-190, y:H*0.5}, p2:{x:L?70:W-70, y:210}};
    default:return {p0:{x:W/2, y:-30},          p1:{x:L?30:W-30, y:90},    p2:{x:L?W-80:80, y:70}};
  }
}
function cubic(p0,p1,p2,p3,t){
  const u=1-t;
  return { x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,
           y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y };
}
function startStage(){
  G.aliens=[]; G.bullets=[]; G.ebullets=[]; G.beamEvent=null; beamHumStop();
  G.captured=null; G.player.dual=false;
  G.diveTimer=3.5; G.fireTimer=1.4; G.beamTimer=13+Math.random()*7;
  if(isChallengingStage(G.stage)){
    G.phase='challenge'; G.phaseT=0;
    G.challenge={ spawned:0, hits:0, groups:[], cur:null, spawnT:0, done:false, tallyT:0 };
    setBanner('CHALLENGING STAGE', 2.2); sStinger();
  } else {
    const defs=buildFormation();
    const groups=[[],[],[],[],[]];
    defs.forEach((d,i)=>groups[i%5].push(d));
    /* interleave so rows fill mixed like original waves */
    const order=[]; for(let k=0;k<8;k++) groups.forEach(g=>{ if(g[k]) order.push(g[k]); });
    order.forEach((d,i)=>{
      const a=makeAlien(d.type,d.row,d.col);
      a.state='enter'; a.dur=2.3; a.delay=0.7 + i*0.14;
      a.path=enterPath(i, d); a.t=0;
      G.aliens.push(a);
    });
    G.phase='enter'; G.phaseT=0;
    setBanner('STAGE '+G.stage, 1.8);
  }
  updateHUD();
}
function setBanner(txt, dur){ G.banner=txt; G.bannerT=dur; }

/* ---------------- challenging stage ---------------- */
function challengePath(gi){
  const L = gi%2===0;
  return { p0:{x:L?-30:W+30, y:120+ (gi%3)*40},
           p1:{x:L?W*0.35:W*0.65, y:40},
           p2:{x:L?W*0.65:W*0.35, y:330},
           p3:{x:L?W+30:-30, y:180+(gi%2)*60} };
}
function spawnChallengeGroup(){
  const ch=G.challenge, gi=ch.groups.length;
  const types=['bee','butterfly','boss','bee','butterfly'];
  const grp={ aliens:[], killed:0, awarded:false };
  for(let k=0;k<8;k++){
    const a=makeAlien(types[gi%5], 0, k);
    a.state='challenge'; a.dur=5.2; a.delay=k*0.22; a.t=0;
    a.path=challengePath(gi); a.group=grp; a.chalGroup=gi;
    grp.aliens.push(a); G.aliens.push(a);
  }
  ch.groups.push(grp); ch.spawned+=8;
}

/* ---------------- firing & dives ---------------- */
function playerFire(){
  const p=G.player; if(!p.alive || G.beamEvent) return;
  const limit = p.dual?4:2;                              // original 2-shot limit per fighter
  if(G.bullets.length>=limit) return;
  if(p.dual){
    G.bullets.push({x:p.x-17, y:H-84, vy:-560},{x:p.x+17, y:H-84, vy:-560});
  } else G.bullets.push({x:p.x, y:H-84, vy:-560});
  sShoot();
}
let fireHeld=false, fireCd=0;
function alienShoot(a){
  const p=G.player;
  /* original shots angle only loosely toward the fighter */
  const vx = Math.max(-34, Math.min(34, (p.x-a.x)*0.13 + (Math.random()*28-14)));
  G.ebullets.push({x:a.x, y:a.y+12, vx, vy:185 + G.stage*9 + Math.random()*30});
}
function startDive(a, withEscorts){
  a.state='dive'; a.t=0; a.dur=3.6;
  const dir = a.x < W/2 ? 1 : -1;
  const bx = Math.max(36, Math.min(W-36, G.player.x + (Math.random()*70-35)));
  a.dive={ sx:a.x, sy:a.y, dir, bx, group:null };
  if(withEscorts && a.type==='boss'){
    const grp={ boss:a, escorts:[], escortsKilled:0 };
    a.dive.group=grp;
    const cand=G.aliens.filter(o=>o!==a && o.state==='form' && o.type!=='boss');
    cand.sort((p,q)=>Math.abs(p.col-a.col)-Math.abs(q.col-a.col));
    cand.slice(0,2).forEach(e=>{
      e.state='dive'; e.t=0; e.dur=3.6; e.isEscort=true;
      e.dive={ sx:e.x, sy:e.y, dir, bx: bx+(e.col-a.col)*22, group:grp, off:(e.col-a.col)*22 };
      grp.escorts.push(e);
    });
  }
}
function divePos(a, t){
  const d=a.dive, slot=slotPos(a);
  if(t<0.34){ const u=t/0.34;
    return cubic({x:d.sx,y:d.sy},{x:d.sx+d.dir*100,y:d.sy+6},{x:d.sx+d.dir*150,y:d.sy+150},{x:d.sx+d.dir*46,y:d.sy+250},u); }
  if(t<0.68){ const u=(t-0.34)/0.34;
    return cubic({x:d.sx+d.dir*46,y:d.sy+250},{x:d.sx-d.dir*30,y:d.sy+330},{x:d.bx+d.dir*50,y:H-60},{x:d.bx,y:H+34},u); }
  const u=(t-0.68)/0.32, home={x:slot.x+(d.off||0)*0, y:slot.y};
  return cubic({x:d.bx,y:-34},{x:d.bx-d.dir*60,y:120},{x:home.x,y:190},home,u);
}
/* tractor beam: boss dives to a hover point and beams */
function startBeamDive(boss){
  boss.state='beamgo'; boss.t=0; boss.dur=1.5;
  boss.beam={ sx:boss.x, sy:boss.y, hx: Math.max(70,Math.min(W-70, boss.x+(Math.random()*60-30))), hy:300 };
  G.beamEvent={ boss, phase:'go' };
}
function updateBeam(dt){
  const ev=G.beamEvent; if(!ev) return;
  const b=ev.boss;
  if(b.dead){ endBeam(false); return; }
  if(ev.phase==='go'){
    b.t+=dt; const u=Math.min(1,b.t/b.dur), e=u*u*(3-2*u);
    b.x=b.beam.sx+(b.beam.hx-b.beam.sx)*e; b.y=b.beam.sy+(b.beam.hy-b.beam.sy)*e;
    b.angle=Math.sin(G.t*3)*0.1;
    if(u>=1){ ev.phase='hover'; ev.t=0; beamHumStart(); setBanner('',0); }
  } else if(ev.phase==='hover'){
    ev.t+=dt; b.x=b.beam.hx+Math.sin(G.t*1.4)*3;
    const p=G.player;
    const halfAtPlayer = 14 + ( (H-64) - b.y ) * 0.30;
    if(p.alive && Math.abs(p.x-b.x) < halfAtPlayer*0.62 && ev.t>0.3){
      ev.phase='capture'; ev.t=0; sCaptureSweep();
      G.player.captureAnim=0; setBanner('FIGHTER CAPTURED', 2);
    }
    if(ev.t>3.6) { ev.phase='return'; ev.t=0; beamHumStop(); }
  } else if(ev.phase==='capture'){
    ev.t+=dt; const p=G.player;
    p.captureAnim=Math.min(1, ev.t/1.6);
    p.x += (b.x-p.x)*Math.min(1,dt*3.2);
    p.y = (H-64) - ((H-64)-(b.y+26)) * (p.captureAnim*p.captureAnim);
    if(p.captureAnim>=1){
      p.alive=false;
      G.captured={ boss:b, state:'parked', x:b.x+38, y:b.y, t:0 };
      ev.phase='return'; ev.t=0; beamHumStop();
      if(G.lives>1){ G.lives--; G.player.respawn=1.4; }
      else { G.lives=0; }
      updateHUD();
    }
  } else if(ev.phase==='return'){
    ev.t+=dt; const slot=slotPos(b), u=Math.min(1,ev.t/1.1);
    b.x += (slot.x-b.x)*Math.min(1,dt*4); b.y += (slot.y-b.y)*Math.min(1,dt*4);
    if(u>=1 || (Math.abs(b.x-slot.x)<2 && Math.abs(b.y-slot.y)<2)){
      b.state='form'; b.x=slot.x; b.y=slot.y; b.angle=0;
      if(G.captured && G.captured.state==='parked'){ /* stays parked at slot */ }
      const wasCapture = !!G.captured;
      G.beamEvent=null;
      if(G.lives<=0 && !G.player.alive){ gameOver(); }
      else if(wasCapture){ /* new fighter respawns via respawn timer */ }
    }
  }
}
function endBeam(){ beamHumStop(); G.beamEvent=null; }

/* ---------------- scoring ---------------- */
function addScore(n){
  G.score+=n;
  if(!G.extraGiven && G.score>=SCORE_TABLE.extraFighterAt){
    G.extraGiven=true; G.lives=Math.min(6,G.lives+1);
    setBanner('EXTRA FIGHTER!', 2); sStinger(); floater(W/2, H/2+40, 'EXTRA FIGHTER', '#59ff7a');
  }
  if(G.score>G.hi) G.hi=G.score;
  updateHUD();
}
function floater(x,y,txt,c){ G.floaters.push({x,y,txt,c:c||'#ffd23e',t:0}); }
function explode(x,y,big){
  const n=big?26:14;
  for(let i=0;i<n;i++){ const a=Math.random()*6.28, sp=40+Math.random()*(big?190:120);
    G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:.4+Math.random()*.4,
      c:['#ffd23e','#ff3355','#37e2ff','#ffffff'][i%4], sz:2+Math.random()*3}); }
}
function killAlien(a, byBullet){
  a.dead=true; explode(a.x,a.y,a.type==='boss'); sAlienDie();
  const diving = (a.state==='dive'||a.state==='beamgo'||a.state==='beamhover'||a.state==='enter');
  let pts=0;
  if(G.phase==='challenge'){
    pts=SCORE_TABLE.challengingAlien; G.challenge.hits++;
    if(a.group){ a.group.killed++;
      if(a.group.killed===8 && !a.group.awarded){ a.group.awarded=true;
        pts+=SCORE_TABLE.challengingGroupPerfect; floater(a.x,a.y-14,'PERFECT 1000','#59ff7a'); } }
  } else if(a.type==='boss'){
    if(a.state==='dive' && a.dive && a.dive.group){
      pts=SCORE_TABLE.bossEscortBonus[Math.min(2,a.dive.group.escortsKilled)];
      if(pts>400) floater(a.x,a.y-14,'BONUS '+pts,'#ff5fd2');
    } else pts = diving? SCORE_TABLE.boss.diving : SCORE_TABLE.boss.formation;
    /* rescue / loss of captured fighter */
    if(G.captured && G.captured.boss===a){
      if(a.state==='dive'){ G.captured.state='rescuing'; G.captured.t=0;
        floater(W/2,150,'FIGHTER RESCUED!','#59ff7a'); sStinger(); }
      else { G.captured.state='gone'; explode(G.captured.x,G.captured.y,false);
        floater(W/2,150,'CAPTURED FIGHTER LOST','#ff3355'); G.captured=null; }
    }
    if(G.beamEvent && G.beamEvent.boss===a) endBeam();
  } else {
    pts = diving? SCORE_TABLE[a.type].diving : SCORE_TABLE[a.type].formation;
    if(a.isEscort && a.dive && a.dive.group) a.dive.group.escortsKilled++;
  }
  addScore(pts);
  if(byBullet && pts) floater(a.x, a.y-8, pts, '#ffffff');
}
function playerHit(){
  const p=G.player;
  explode(p.x, H-64, true); sExplode(); G.shake=8; G.flashT=.18;
  if(p.dual){ p.dual=false; p.invuln=2; floater(p.x,H-110,'DUAL FIGHTER HIT','#ff3355'); return; }
  G.lives--; updateHUD();
  p.alive=false;
  if(G.lives<=0){ gameOver(); }
  else p.respawn=1.5;
}
function gameOver(){
  G.over=true; G.run=false; beamHumStop();
  setTimeout(()=>showGameOver(), 700);
}

/* ---------------- update ---------------- */
function update(dt){
  G.t+=dt;
  if(G.bannerT>0) G.bannerT-=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*22);
  if(G.flashT>0) G.flashT-=dt;
  G.stars.forEach(s=>{ s.y+=s.sp*dt; if(s.y>H){s.y-=H; s.x=Math.random()*W;} });
  G.parts.forEach(pt=>{ pt.t+=dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; });
  G.parts=G.parts.filter(pt=>pt.t<pt.life);
  G.floaters.forEach(f=>{ f.t+=dt; f.y-=26*dt; });
  G.floaters=G.floaters.filter(f=>f.t<1.1);
  const p=G.player;
  if(p.invuln>0) p.invuln-=dt;
  if(!p.alive && p.respawn>0 && !G.beamEvent){
    p.respawn-=dt;
    if(p.respawn<=0 && G.lives>0){ p.alive=true; p.x=W/2; p.tx=W/2; p.invuln=2; p.y=H-64; }
  }
  if(G.beamEvent) updateBeam(dt);

  /* ---- player movement ---- */
  if(p.alive && !G.beamEvent){
    const spd=340;
    if(keys.left) p.tx-=spd*dt;
    if(keys.right) p.tx+=spd*dt;
    if(deckMove!==0) p.tx+=deckMove*spd*dt;
    p.tx=Math.max(20,Math.min(W-20,p.tx));
    p.x += (p.tx-p.x)*Math.min(1,dt*18);
    p.y=H-64;
    fireCd-=dt;
    if(fireHeld && fireCd<=0){ playerFire(); fireCd=0.19; }   // original fire cadence
  }

  /* ---- bullets ---- */
  G.bullets.forEach(b=>b.y+=b.vy*dt);
  G.bullets=G.bullets.filter(b=>b.y>-16);
  G.ebullets.forEach(b=>{ b.x+=b.vx*dt; b.y+=b.vy*dt; });
  G.ebullets=G.ebullets.filter(b=>b.y<H+14 && b.x>-10 && b.x<W+10);

  /* ---- challenging stage flow ---- */
  if(G.phase==='challenge'){
    const ch=G.challenge;
    ch.spawnT-=dt;
    if(ch.spawned<40 && ch.spawnT<=0){ spawnChallengeGroup(); ch.spawnT=1.6; }
    G.aliens.forEach(a=>{
      if(a.state!=='challenge') return;
      if(a.delay>0){ a.delay-=dt; return; }
      a.t+=dt/a.dur;
      const pos=cubic(a.path.p0,a.path.p1,a.path.p2,a.path.p3,Math.min(1,a.t));
      a.angle=Math.atan2(pos.y-a.y,pos.x-a.x)+Math.PI/2;
      a.x=pos.x; a.y=pos.y;
      if(a.t>=1) a.dead=true;
    });
    G.aliens=G.aliens.filter(a=>!a.dead);
    if(ch.spawned>=40 && G.aliens.length===0 && !ch.done){
      ch.done=true;
      if(ch.hits===40){ addScore(SCORE_TABLE.challengingStagePerfect);
        setBanner('PERFECT!! 10000', 2.6); }
      else setBanner('HITS '+ch.hits+' / 40', 2.2);
      sStinger();
      setTimeout(()=>{ if(!G.over){ G.stage++; startStage(); } }, 2400);
    }
  }

  /* ---- aliens: entrance / formation / dive ---- */
  let anyEnter=false;
  G.aliens.forEach(a=>{
    a.flap+=dt*7;
    if(a.state==='wait') return;
    if(a.state==='enter'){
      anyEnter=true;
      if(a.delay>0){ a.delay-=dt; a.x=-60; a.y=-60; return; }
      a.t+=dt/a.dur;
      const slot=slotPos(a), tt=Math.min(1,a.t);
      const pos=cubic(a.path.p0,a.path.p1,a.path.p2,slot,tt);
      a.angle=Math.atan2(pos.y-a.y,pos.x-a.x)+Math.PI/2;
      a.x=pos.x; a.y=pos.y;
      /* firing as they come — sparse on early stages, denser later, per original ramp */
      a.fireCd-=dt;
      if(G.stage>=3 && a.fireCd<=0 && tt>0.3 && G.ebullets.length< 2+G.stage){ alienShoot(a); a.fireCd=2.6+Math.random()*2.6; }
      if(a.t>=1){ a.state='form'; a.angle=0; }
    }
    else if(a.state==='form'){
      const slot=slotPos(a); a.x=slot.x; a.y=slot.y; a.angle=0;
    }
    else if(a.state==='dive'){
      a.t+=dt/a.dur;
      const pos=divePos(a, Math.min(1,a.t));
      a.angle=Math.atan2(pos.y-a.y,pos.x-a.x)+Math.PI/2;
      a.x=pos.x; a.y=pos.y;
      a.fireCd-=dt;
      if(a.fireCd<=0 && a.y>0 && a.y<H-90){ alienShoot(a); a.fireCd=1.1+Math.random()*1.6; }
      if(a.t>=1){ a.state='form'; a.isEscort=false; a.dive=null; const s=slotPos(a); a.x=s.x; a.y=s.y; a.angle=0; }
    }
  });
  G.aliens=G.aliens.filter(a=>!a.dead);
  if(G.phase==='enter' && !anyEnter){ G.phase='play'; }

  /* captured fighter parked beside boss slot / rescue descent */
  if(G.captured){
    const c=G.captured;
    if(c.state==='parked'){
      const b=c.boss;
      if(b && !b.dead){
        if(b.state==='form'){ const s=slotPos(b); c.x=s.x+38; c.y=s.y; }
        else { c.x=b.x+38; c.y=b.y; }  /* rides beside its captor through the dive — the rescue moment */
      }
    } else if(c.state==='rescuing'){
      c.t+=dt; c.y+=120*dt; c.x+=Math.sin(c.t*5)*30*dt;
      if(c.y>=H-64){
        if(G.player.alive && !G.player.dual){ G.player.dual=true; floater(G.player.x,H-110,'DUAL FIGHTER!','#59ff7a'); }
        else if(G.player.alive && G.player.dual){ addScore(0); }
        else if(!G.player.alive && G.lives>0){ G.player.alive=true; G.player.invuln=2; }
        G.captured=null; updateHUD();
      }
    }
  }

  /* ---- combat scheduling (play phase) ---- */
  if(G.phase==='play' && !G.beamEvent){
    const formed=G.aliens.filter(a=>a.state==='form');
    G.diveTimer-=dt;
    if(G.diveTimer<=0 && formed.length){
      const bossDive = Math.random()<0.3;
      const pool = bossDive? formed.filter(a=>a.type==='boss') : formed;
      const pick=(pool.length?pool:formed)[Math.floor(Math.random()* (pool.length?pool:formed).length)];
      if(pick) startDive(pick, true);
      G.diveTimer=Math.max(1.1, 3.4 - G.stage*0.22) + Math.random()*1.4;
    }
    G.fireTimer-=dt;
    const maxEB = Math.min(3+G.stage, 11);
    if(G.fireTimer<=0){
      const shooters=G.aliens.filter(a=>a.state==='form' && a.y>0);
      if(shooters.length && G.ebullets.length<maxEB){
        alienShoot(shooters[Math.floor(Math.random()*shooters.length)]);
      }
      G.fireTimer=Math.max(0.4, 1.6 - G.stage*0.1) + Math.random()*0.6;
    }
    G.beamTimer-=dt;
    if(G.beamTimer<=0 && !G.captured && G.player.alive){
      const bosses=formed.filter(a=>a.type==='boss');
      if(bosses.length){ startBeamDive(bosses[Math.floor(Math.random()*bosses.length)]); }
      G.beamTimer=16+Math.random()*9;
    }
  }

  /* ---- collisions ---- */
  for(const b of G.bullets){
    for(const a of G.aliens){
      if(a.dead || a.state==='wait' || a.delay>0) continue;
      const rr = a.type==='boss'?17:15;
      if(Math.abs(b.x-a.x)<rr && Math.abs(b.y-a.y)<rr){
        b.y=-999;
        a.hp--;
        if(a.hp<=0) killAlien(a,true);
        else { explode(a.x,a.y,false); beep(500,200,.08,'square',.08); }
        break;
      }
    }
  }
  G.bullets=G.bullets.filter(b=>b.y>-100);
  if(p.alive && p.invuln<=0 && !G.beamEvent){
    for(const b of G.ebullets){
      const hitShip = p.dual
        ? (Math.abs(b.x-(p.x-17))<11 || Math.abs(b.x-(p.x+17))<11)
        : Math.abs(b.x-p.x)<11;
      if(hitShip && Math.abs(b.y-(H-64))<13){ b.y=H+999; playerHit(); break; }
    }
    for(const a of G.aliens){
      if(a.state==='dive'||a.state==='enter'||a.state==='challenge'){
        if(Math.abs(a.x-p.x)<20 && Math.abs(a.y-(H-64))<18){ killAlien(a,false); playerHit(); break; }
      }
    }
  }
  G.ebullets=G.ebullets.filter(b=>b.y<H+100);

  /* ---- stage clear ---- */
  if((G.phase==='play'||G.phase==='enter') && G.aliens.length===0 && !G.beamEvent){
    G.phase='tally';
    setTimeout(()=>{ if(!G.over){ G.stage++; startStage(); } }, 900);
    G.phase='waitNext';
  }
}

/* ---------------- drawing ---------------- */
/* ---------------- pixel sprites: arcade silhouettes ----------------
   Crisp block-drawn insects after the 1981 originals (Gary's refs):
   bee = yellow body / blue wings, butterfly = red wings / blue-white
   body, boss = green body / purple wings / gold crown, visibly larger.
   Two frames each — wings up / wings down — flipped by the flap clock. */
function drawPx(g, map, pal, u, cx, cy){
  const h=map.length, w=map[0].length;
  const ox=cx-w*u/2, oy=cy-h*u/2;
  for(let r=0;r<h;r++){ const row=map[r];
    for(let c=0;c<row.length;c++){ const col=pal[row[c]]; if(!col) continue;
      g.fillStyle=col; g.fillRect(ox+c*u, oy+r*u, u+0.04, u+0.04); } }
}
const PAL = {
  bee:      { B:'#2e6bff', b:'#6ec3ff', Y:'#ffd23e', W:'#ffffff', R:'#ff3355', O:'#ff9f1a', K:'#181828' },
  butterfly:{ R:'#ff3355', B:'#2255ff', W:'#ffffff', K:'#181828' },
  boss:     { P:'#b04dff', G:'#39d353', W:'#ffffff', R:'#ff3355', Y:'#ffd23e', K:'#141020' },
  bossHurt: { P:'#7a5cff', G:'#3ec6ff', W:'#ffffff', R:'#ff3355', Y:'#ffd23e', K:'#141020' },
  fighter:  { W:'#eef1ff', C:'#37e2ff', R:'#ff3355', K:'#14101e' }
};
const BEE_A = [
"......K..K......",
".......KK.......",
"..BB...YY...BB..",
".BBBb.YWWY.bBBB.",
".BBBBbYYYYbBBBB.",
"..BBB.YRRY.BBB..",
"...B..YOOY..B...",
"......YOOY......",
"......YRRY......",
".......YY.......",
".......YY......."];
const BEE_B = [
"......K..K......",
".......KK.......",
".......YY.......",
"......YWWY......",
"..BB..YYYY..BB..",
".BBBB.YRRY.BBBB.",
".BBBB.YOOY.BBBB.",
"...B..YRRY..B...",
"......YOOY......",
".......YY.......",
".......YY......."];
const BUT_A = [
"......K..K......",
".......KK.......",
".RRR...BB...RRR.",
"RRRRR..BB..RRRRR",
"RRWRRR.BB.RRRWRR",
"RRRRRR.BB.RRRRRR",
".RRRR..BB..RRRR.",
"..RR...BB...RR..",
".......BB.......",
"......B..B......"];
const BUT_B = [
"......K..K......",
".......KK.......",
".......BB.......",
"......BBBB......",
".RRR...BB...RRR.",
"RRRRR..BB..RRRRR",
"RRWRRR.BB.RRRWRR",
"RRRRRR.BB.RRRRRR",
".RRRR..BB..RRRR.",
"..RR...BB...RR.."];
const BOSS_A = [
".......Y..Y.......",
"......YY..YY......",
"......YYYYYY......",
"..PP...GGGG...PP..",
".PPPP.GWWWWG.PPPP.",
"PPPPP.GGGGGG.PPPPP",
"PPPPP.GKGGKG.PPPPP",
".PPP..GGGGGG..PPP.",
"..P...GGRRGG...P..",
"......GGGGGG......",
"......GG..GG......",
".......G..G......."];
const BOSS_B = [
".......Y..Y.......",
"......YY..YY......",
"......YYYYYY......",
"..PP...GGGG...PP..",
".PPPP.GWWWWG.PPPP.",
"..PP..GGGGGG..PP..",
".PPPP.GKGGKG.PPPP.",
"PPPPP.GGGGGG.PPPPP",
".PPP..GGRRGG..PPP.",
"..P...GGGGGG...P..",
"......GG..GG......",
".......G..G......."];
const FIGHTER_MAP = [
".......WW.......",
".......WW.......",
"......WWWW......",
"......WCCW......",
".....WWWWWW.....",
".....WWRRWW.....",
"....WWWRRWWW....",
"...WWRRRRRRWW...",
"..WW.WRRRRW.WW..",
".WWK.WWRRWW.KWW.",
".WKK........KKW.",
"..K..........K.."];
const SPR = { bee:[BEE_A,BEE_B], butterfly:[BUT_A,BUT_B], boss:[BOSS_A,BOSS_B] };
function drawFighterShape(x,y,small){
  ctx.save(); ctx.translate(x,y);
  drawPx(ctx, FIGHTER_MAP, PAL.fighter, small?1.3:2, 0, 0);
  ctx.restore();
}
function drawAlien(a){
  if(a.delay>0 && (a.state==='enter'||a.state==='challenge')) return;
  ctx.save(); ctx.translate(a.x,a.y);
  if(a.state==='dive'||a.state==='enter'||a.state==='challenge'||a.state==='beamgo') ctx.rotate(a.angle||0);
  const frame = Math.sin(a.flap)>0 ? 0 : 1;
  const pal = a.type==='boss' ? (a.hp===1 ? PAL.bossHurt : PAL.boss) : PAL[a.type];
  drawPx(ctx, SPR[a.type][frame], pal, a.type==='boss'?2.15:2, 0, 0);
  ctx.restore();
}
function spriteImg(type){
  const map=SPR[type][0], pal=(type==='boss'?PAL.boss:PAL[type]), u=2;
  const c=document.createElement('canvas'); c.width=map[0].length*u; c.height=map.length*u;
  drawPx(c.getContext('2d'), map, pal, u, c.width/2, c.height/2);
  return '<img src="'+c.toDataURL()+'" width="'+c.width+'" height="'+c.height+'" alt="" style="vertical-align:middle; image-rendering:pixelated;">';
}
function scoreRows(){
  return '<tr><td>'+spriteImg('bee')+' Bee</td><td>50</td><td>100</td></tr>'
       + '<tr><td>'+spriteImg('butterfly')+' Butterfly</td><td>80</td><td>160</td></tr>'
       + '<tr><td>'+spriteImg('boss')+' Boss Galaga (2 hits!)</td><td>150</td><td>400</td></tr>'
       + '<tr><td>Boss diving &mdash; escorts shot first</td><td colspan="2">400 / 800 / 1600</td></tr>'
       + '<tr><td>Challenging Stage alien</td><td colspan="2">100</td></tr>';
}
function drawBeam(){
  const ev=G.beamEvent; if(!ev) return;
  const b=ev.boss;
  if(ev.phase!=='hover' && ev.phase!=='capture') return;
  const topY=b.y+12, botY=H-58, grow = ev.phase==='capture'?1:Math.min(1,(ev.t||0)/0.5);
  const halfBot=64*grow, halfTop=7;
  const grad=ctx.createLinearGradient(0,topY,0,botY);
  grad.addColorStop(0,'rgba(120,255,190,0.55)'); grad.addColorStop(1,'rgba(80,200,255,0.20)');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(b.x-halfTop,topY); ctx.lineTo(b.x+halfTop,topY);
  ctx.lineTo(b.x+halfBot,botY); ctx.lineTo(b.x-halfBot,botY); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(160,255,220,0.5)';
  for(let i=0;i<4;i++){ const yy=topY+((botY-topY)*(0.2+0.2*i) + (G.t*60)%28);
    if(yy<botY){ const hw=halfTop+(halfBot-halfTop)*((yy-topY)/(botY-topY));
      ctx.beginPath(); ctx.moveTo(b.x-hw,yy); ctx.lineTo(b.x+hw,yy); ctx.stroke(); } }
}
function pennants(n){
  /* original-style stage emblems: 50/30/20/10/5/1 denominations */
  const denoms=[50,30,20,10,5,1]; let x=W-12; const y=H-14;
  ctx.font='7px "Press Start 2P"'; ctx.textAlign='right';
  for(const d of denoms){ while(n>=d){ n-=d;
    ctx.fillStyle= d>=20?'#ffd23e':(d>=5?'#37e2ff':'#e8ecff');
    ctx.beginPath(); ctx.moveTo(x,y-6); ctx.lineTo(x-13,y-2); ctx.lineTo(x,y+3); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#04040c'; ctx.fillText(d, x-2.4, y+1); x-=16;
    if(x<W-190) return;
  } }
}
function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(G.shake>0) ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  /* starfield */
  for(const s of G.stars){ ctx.globalAlpha=.45+.55*Math.abs(Math.sin(G.t*2+s.tw));
    ctx.fillStyle=s.c; ctx.fillRect(s.x,s.y,s.sz,s.sz); }
  ctx.globalAlpha=1;
  drawBeam();
  /* captured fighter (parked / rescuing) */
  if(G.captured && G.captured.state!=='gone'){
    const cb=G.captured.boss;
    if(G.captured.state==='parked' && cb && cb.state==='dive'){
      ctx.save(); ctx.translate(G.captured.x,G.captured.y); ctx.rotate(cb.angle||0);
      ctx.translate(-G.captured.x,-G.captured.y);
      drawFighterShape(G.captured.x, G.captured.y, true); ctx.restore();
    } else drawFighterShape(G.captured.x, G.captured.y, true);
  }
  G.aliens.forEach(drawAlien);
  /* player */
  const p=G.player;
  if(p.alive){
    const blink = p.invuln>0 && Math.floor(G.t*14)%2===0;
    if(!blink){
      if(G.beamEvent && G.beamEvent.phase==='capture'){
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(G.t*9); ctx.translate(-p.x,-p.y);
        drawFighterShape(p.x,p.y); ctx.restore();
      } else if(p.dual){ drawFighterShape(p.x-17,H-64); drawFighterShape(p.x+17,H-64); }
      else drawFighterShape(p.x,H-64);
    }
  }
  /* bullets */
  ctx.fillStyle='#ffe9a8';
  G.bullets.forEach(b=>{ ctx.fillRect(b.x-1.6,b.y-8,3.2,11); ctx.fillStyle='#ff9d3c'; ctx.fillRect(b.x-1.6,b.y+2,3.2,3); ctx.fillStyle='#ffe9a8'; });
  ctx.fillStyle='#ff5f7a';
  G.ebullets.forEach(b=>ctx.fillRect(b.x-1.6,b.y-5,3.2,10));
  /* particles & floaters */
  G.parts.forEach(pt=>{ ctx.globalAlpha=1-pt.t/pt.life; ctx.fillStyle=pt.c; ctx.fillRect(pt.x,pt.y,pt.sz,pt.sz); });
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.font='10px "Press Start 2P"';
  G.floaters.forEach(f=>{ ctx.globalAlpha=Math.max(0,1-f.t/1.1); ctx.fillStyle=f.c; ctx.fillText(f.txt,f.x,f.y); });
  ctx.globalAlpha=1;
  /* reserve fighters + stage pennants */
  for(let i=0;i<Math.max(0,G.lives-1);i++) drawFighterShape(18+i*26, H-13, true);
  pennants(G.stage);
  /* banners */
  if(G.bannerT>0 && G.banner){
    ctx.font='15px "Press Start 2P"'; ctx.textAlign='center';
    ctx.fillStyle='#ff3355'; ctx.fillText(G.banner, W/2, H/2-8);
    if(G.phase==='challenge' || isChallengingStage(G.stage) && G.banner.indexOf('CHALL')===0){
      ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#37e2ff';
      ctx.fillText('SHOOT THE WHOLE WAVE!', W/2, H/2+16);
    }
  }
  if(G.phase==='stageIntro'){ }
  if(G.flashT>0){ ctx.fillStyle='rgba(255,60,60,'+(G.flashT*1.4)+')'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}

/* ---------------- main loop ---------------- */
let rafId=null;
function loop(ts){
  if(!G.run){ return; }
  rafId=requestAnimationFrame(loop);
  const dt=Math.min(0.033,(ts-G.lastTs)/1000||0.016); G.lastTs=ts;
  if(!G.paused){ update(dt); draw(); }
}

/* ---------------- input ----------------
   Keyboard is bound on WINDOW in the CAPTURE phase: arrows + space work
   no matter where the mouse is parked or which element last held focus,
   and the page can never scroll or steal the keys mid-game. */
const keys={left:false,right:false};
let deckMove=0;
function claimFocus(){
  try{ window.focus(); }catch(e){}
  const a=document.activeElement;
  if(a && a.tagName==='BUTTON' && a.blur) a.blur();   /* a focused button would eat Space as a click */
  const g=document.getElementById('game');
  if(g && g.style.display==='flex'){ try{ cv.focus({preventScroll:true}); }catch(e){ try{ cv.focus(); }catch(e2){} } }
}
function togglePause(){
  if(!G||!G.run) return;
  if(G.paused){ closeModal(); return; }
  G.paused=true;
  openModal(`<h2>PAUSED</h2><p style="text-align:center">Stage ${G.stage} · Score ${G.score}</p>
    <div class="rowBtns"><button class="modalClose" id="mResume">RESUME</button>
    <button class="modalClose altBtn" id="mHow">HOW TO PLAY</button></div>
    <button class="modalClose altBtn" id="mQuit">QUIT TO INTRO</button>`);
  $('mClose').style.display='none';
  $('mResume').onclick=closeModal;
  $('mHow').onclick=()=>{ openModal(HOW_HTML); };
  $('mQuit').onclick=()=>{ closeModal(); stopToIntro(); };
}
function onKeyDown(e){
  claimFocus();   /* first keystroke after any focus loss re-engages AND counts as input */
  switch(e.code){
    case 'ArrowLeft': keys.left=true; e.preventDefault(); break;
    case 'ArrowRight': keys.right=true; e.preventDefault(); break;
    case 'ArrowUp': case 'ArrowDown': e.preventDefault(); break;
    case 'Space': fireHeld=true; e.preventDefault(); break;
    case 'KeyP': if(!e.repeat) togglePause(); break;
    case 'Escape':
      if(e.repeat) break;
      if(document.getElementById('modalBk').classList.contains('open')){
        if(G && (G.paused || !G.over)) closeModal();
      } else togglePause();
      break;
  }
}
function onKeyUp(e){
  switch(e.code){
    case 'ArrowLeft': keys.left=false; e.preventDefault(); break;
    case 'ArrowRight': keys.right=false; e.preventDefault(); break;
    case 'ArrowUp': case 'ArrowDown': e.preventDefault(); break;
    case 'Space': fireHeld=false; e.preventDefault(); break;
  }
}
window.addEventListener('keydown', onKeyDown, true);
window.addEventListener('keyup', onKeyUp, true);
window.addEventListener('blur', ()=>{ keys.left=false; keys.right=false; fireHeld=false; deckMove=0; });
document.addEventListener('pointerdown', claimFocus, true);
window.addEventListener('load', claimFocus);
/* relative drag (touch) + mouse move; hold = fire */
let dragId=null, lastPX=0;
cv.addEventListener('pointerdown',e=>{
  ac(); dragId=e.pointerId; lastPX=e.clientX; fireHeld=true;
  cv.setPointerCapture(e.pointerId); e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  const rect=cv.getBoundingClientRect(), scale=W/rect.width;
  if(e.pointerType==='mouse'){
    if(G && G.player) G.player.tx=Math.max(20,Math.min(W-20,(e.clientX-rect.left)*scale));
  } else if(dragId===e.pointerId && G && G.player){
    const dx=(e.clientX-lastPX)*scale*1.12; lastPX=e.clientX;
    G.player.tx=Math.max(20,Math.min(W-20,G.player.tx+dx));
  }
});
function endPointer(e){ if(dragId===e.pointerId){ dragId=null; fireHeld=false; } }
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
function holdBtn(el, on, off){
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); on(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>off&&off()));
}
holdBtn(document.getElementById('leftBtn'), ()=>deckMove=-1, ()=>{ if(deckMove<0) deckMove=0; });
holdBtn(document.getElementById('rightBtn'), ()=>deckMove=1, ()=>{ if(deckMove>0) deckMove=0; });
holdBtn(document.getElementById('fireBtn'), ()=>{ fireHeld=true; }, ()=>{ fireHeld=false; });

/* ---------------- HUD / screens / modals ---------------- */
const $=id=>document.getElementById(id);
function updateHUD(){
  $('scoreVal').textContent=G.score;
  $('hiVal').textContent=G.hi;
  $('stageVal').textContent=G.stage;
}
function openModal(html){ $('modal').innerHTML=html+'<button class="modalClose" id="mClose">CLOSE</button>';
  $('modalBk').classList.add('open'); $('mClose').onclick=closeModal; }
function closeModal(){ $('modalBk').classList.remove('open'); if(G&&G.paused&&G.run){ G.paused=false; } }
$('modalBk').addEventListener('click',e=>{ if(e.target===$('modalBk')) closeModal(); });

const HOW_HTML = `<h2>HOW TO PLAY</h2>
<p><b>Move:</b> drag your finger — the fighter follows your drag, not your fingertip, so it never hides under your finger. Or use ◀ ▶, mouse, or arrow keys.</p>
<p><b>Fire:</b> press &amp; hold anywhere (or hold FIRE / SPACE). Max <b>2 shots</b> on screen per fighter — just like the 1981 original.</p>
<p><b>Tractor beam:</b> a Boss Galaga will hover and beam your fighter up. It costs that fighter — but shoot that same Boss <b>while it is diving</b> and your fighter flies back down and docks beside you: <b>DUAL FIGHTER</b>, double firepower! Shoot the Boss in formation instead, and the captured fighter is lost.</p>
<p><b>Challenging Stage</b> (stages 3, 7, 11…): waves fly through and nobody shoots back. 100 a hit, 1,000 per perfect group, <b>10,000 PERFECT!!</b> for all 40.</p>
<p style="text-align:center" class="px">&mdash; SCORE &mdash;</p>
<table>
<tr><td></td><td>FORMATION</td><td>DIVING</td></tr>
${scoreRows()}
</table>
<p>Extra fighter at <b>20,000</b>. Stage pennants collect at the bottom right.</p>`;
$('howBtn').onclick=()=>openModal(HOW_HTML);
$('soundBtn').onclick=()=>{
  soundOn=!soundOn; $('soundState').textContent=soundOn?'ON':'OFF';
  $('soundState').className=soundOn?'on':'off';
  if(!soundOn) beamHumStop(); else ac();
};
$('qrBtn').onclick=()=>{
  openModal(`<h2>PLAY ON YOUR PHONE</h2><canvas id="qrCv" width="200" height="200"></canvas>
    <p class="qrUrl">https://ready-future-hub-life.lovable.app/</p>
    <p style="text-align:center">Scan to open the Future Ready hub — Galaga Reborn lives there with the whole game room.</p>`);
  try{ if(window.QRCode) QRCode.toCanvas($('qrCv'),'https://ready-future-hub-life.lovable.app/',{width:184,margin:1}); }catch(e){}
};
$('pauseBtn').onclick=()=>togglePause();
function showGameOver(){
  openModal(`<h2>GAME OVER</h2><div class="bigScore">${G.score}</div>
    <p style="text-align:center">Hi-Score ${G.hi} · Reached Stage ${G.stage}</p>
    <div class="rowBtns"><button class="modalClose" id="mAgain">PLAY AGAIN</button>
    <button class="modalClose altBtn" id="mIntro">INTRO</button></div>`);
  $('mClose').style.display='none';
  $('mAgain').onclick=()=>{ closeModal(); startGame(); };
  $('mIntro').onclick=()=>{ closeModal(); stopToIntro(); };
}
function stopToIntro(){
  if(G){ G.run=false; } beamHumStop();
  if(rafId) cancelAnimationFrame(rafId);
  $('game').style.display='none'; $('intro').style.display='flex';
}
/* full-screen stage: the canvas backing store stays 448x576 (all game
   logic untouched); only its CSS box is fitted to the largest 448:576
   rectangle the stage area offers, so the playfield touches the edges
   of the limiting axis on phone, tablet and desktop alike */
function fitCanvas(){
  const wrap=$('cvWrap'); if(!wrap) return;
  const aw=wrap.clientWidth, ah=wrap.clientHeight;
  if(aw<20||ah<20) return;
  const s=Math.min(aw/W, ah/H);
  cv.style.width=Math.max(1,Math.floor(W*s))+'px';
  cv.style.height=Math.max(1,Math.floor(H*s))+'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas,80));

function startGame(){
  ac();
  G=newGame(); G.run=true; G.hi=Math.max(G.hi||0, parseInt($('hiVal').textContent)||0);
  $('intro').style.display='none'; $('game').style.display='flex';
  fitCanvas(); setTimeout(fitCanvas, 60);
  updateHUD(); startStage();
  G.lastTs=performance.now();
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
  claimFocus();
}
$('startBtn').onclick=startGame;

/* expose verification hooks */
window.__GALAGA = {
  SCORE_TABLE, isChallengingStage,
  get state(){ return G; },
  debug: {
    start: ()=>startGame(),
    setStage: n=>{ G.stage=n; startStage(); },
    forceBeam: ()=>{ const b=G.aliens.find(a=>a.type==='boss'&&a.state==='form'); if(b&&!G.beamEvent) startBeamDive(b); return !!b; },
    forceDive: ()=>{ const a=G.aliens.find(x=>x.state==='form'); if(a) startDive(a,true); return !!a; },
    fire: ()=>playerFire(),
    bullets: ()=>G.bullets.length,
    alienCount: ()=>G.aliens.length,
    formationCounts: ()=>{ const c={boss:0,butterfly:0,bee:0}; G.aliens.forEach(a=>c[a.type]++); return c; }
  }
};
G=newGame(); updateHUD();
claimFocus();
</script>
