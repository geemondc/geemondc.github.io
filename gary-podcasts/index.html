<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Gary Podcasts</title>
<meta name="description" content="Gary Podcasts — a clean, Apple Podcasts-style player. Search any podcast, follow shows and people, pick up right where you left off. Free, no account — your library lives on your device. Part of Future Ready.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23872ec4'/%3E%3Cg fill='white'%3E%3Crect x='14' y='26' width='4' height='12' rx='2'/%3E%3Crect x='22' y='20' width='4' height='24' rx='2'/%3E%3Crect x='30' y='14' width='4' height='36' rx='2'/%3E%3Crect x='38' y='20' width='4' height='24' rx='2'/%3E%3Crect x='46' y='26' width='4' height='12' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ============ TOKENS — Apple Podcasts visual system (Gary's screenshots) ============ */
:root{
  --accent:#872ec4; --accent-ink:#872ec4; --accent-soft:rgba(135,46,196,.10);
  --bg:#ffffff; --bg-grouped:#f2f2f7; --card:#ffffff; --card-2:#f2f2f7;
  --text:#17171a; --sub:#6e6e73; --sub2:#a7a7ad;
  --sep:rgba(60,60,67,.13); --hairline:rgba(60,60,67,.09);
  --pill-bg:#e9e4f5; --pill-fg:#7a28b8;
  --tab-bg:rgba(255,255,255,.82); --mini-bg:rgba(250,250,252,.86);
  --sheet-bg:#ffffff; --scrim:rgba(20,10,30,.38);
  --shadow:0 10px 34px rgba(30,0,60,.16);
  --np-bg:#101013; --np-card:#1d1d21; --np-text:#ffffff; --np-sub:#a9a9b0;
  --radius:14px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tabbar-h:64px; --mini-h:64px;
}
[data-theme="dark"]{
  --bg:#000000; --bg-grouped:#1c1c1e; --card:#1c1c1e; --card-2:#2c2c2e;
  --text:#f5f5f7; --sub:#98989f; --sub2:#6d6d72;
  --sep:rgba(84,84,88,.5); --hairline:rgba(84,84,88,.36);
  --accent:#a55eea; --accent-ink:#c39bf5; --accent-soft:rgba(165,94,234,.16);
  --pill-bg:#2c2c2e; --pill-fg:#d3aef7;
  --tab-bg:rgba(28,28,30,.82); --mini-bg:rgba(36,36,40,.88);
  --sheet-bg:#1c1c1e; --scrim:rgba(0,0,0,.55);
  --shadow:0 10px 34px rgba(0,0,0,.5);
}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16.5px;line-height:1.42;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;background:var(--card-2)}
a{color:var(--accent-ink);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}
.ic{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.ic svg{width:100%;height:100%;display:block}
/* ============ APP FRAME ============ */
#app{display:flex;min-height:100dvh}
#sidebar{display:none}
#mainWrap{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:var(--tab-bg);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:.5px solid var(--hairline)}
#topbar .brand{font-size:19px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
#topbar .brand .dot{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
#topbar .brand .dot svg{width:18px;height:18px}
#topbar .sp{flex:1}
.fr-mark{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.08em;
  color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:999px;padding:6px 11px;min-height:32px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.icon-btn:active{background:var(--accent-soft)}
main{flex:1;width:100%;max-width:860px;margin:0 auto;padding:8px 18px 190px}
section.screen{display:none}
section.screen.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1.page{font-size:33px;font-weight:800;letter-spacing:-.025em;padding:10px 0 4px}
h2.sec{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:26px 0 4px;display:flex;align-items:baseline;gap:8px}
h2.sec .chev{color:var(--sub2);font-weight:700}
.sec-note{font-size:13.5px;color:var(--sub);margin:2px 0 10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.text-btn{color:var(--accent-ink);font-size:15px;font-weight:600;min-height:44px;padding:0 4px}
/* ============ TAB BAR (floating capsule, as in Gary's screenshots) ============ */
#tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;
  display:flex;background:var(--tab-bg);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:.5px solid var(--sep);border-radius:999px;box-shadow:var(--shadow);padding:6px;max-width:520px;margin:0 auto}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;
  border-radius:999px;color:var(--text);font-size:10.5px;font-weight:600;min-height:52px;justify-content:center}
#tabbar button .ic{width:25px;height:25px}
#tabbar button.on{color:var(--accent-ink)}
#tabbar button.on .ic{color:var(--accent)}
/* ============ MINI PLAYER ============ */
#mini{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom));z-index:49;
  max-width:520px;margin:0 auto;display:none;align-items:center;gap:11px;padding:8px 10px 8px 8px;
  background:var(--mini-bg);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:.5px solid var(--sep);border-radius:18px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
#mini.on{display:flex}
#mini img{width:48px;height:48px;border-radius:9px;object-fit:cover}
#mini .mt{flex:1;min-width:0}
#mini .mt .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mt .s{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
#mini .mb .ic{width:27px;height:27px}
#miniProg{position:absolute;left:0;bottom:0;height:2.5px;background:var(--accent);width:0%}
/* ============ CARDS & ROWS ============ */
.lead-card{position:relative;border-radius:18px;overflow:hidden;margin-top:12px;cursor:pointer;background:#111;aspect-ratio:16/10.2}
.lead-card img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lead-card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 34%,rgba(0,0,0,.78) 88%)}
.lead-card .lc-in{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#fff}
.lead-card .lc-meta{font-size:13px;font-weight:600;color:rgba(255,255,255,.75)}
.lead-card .lc-title{font-size:19px;font-weight:700;line-height:1.25;margin:2px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--pill-bg);color:var(--pill-fg);
  border-radius:999px;padding:7px 13px 7px 10px;font-size:14.5px;font-weight:700;min-height:36px;position:relative;overflow:hidden}
.pill .ic{width:16px;height:16px}
.pill .pfill{position:absolute;left:0;top:0;bottom:0;background:rgba(135,46,196,.22);width:0%}
.pill>*{position:relative;z-index:1}
.lead-card .pill{background:rgba(255,255,255,.24);color:#fff;backdrop-filter:blur(6px)}
.lead-card .pill .pfill{background:rgba(255,255,255,.26)}
.hrow{display:flex;gap:14px;overflow-x:auto;padding:10px 18px 8px;margin:0 -18px;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}
.tile{flex:none;width:128px;scroll-snap-align:start;cursor:pointer}
.tile img{width:128px;height:128px;border-radius:12px;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.tile .tt{font-size:13.5px;font-weight:600;line-height:1.25;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.wide{width:158px}
.tile.wide img{width:158px;height:158px}
.ep-row{display:flex;gap:13px;padding:13px 0;border-bottom:.5px solid var(--hairline);cursor:pointer;align-items:flex-start}
.ep-row img{width:92px;height:92px;border-radius:10px;object-fit:cover;flex:none}
.ep-row .eb{flex:1;min-width:0}
.ep-row .em{font-size:12.5px;color:var(--sub);font-weight:600;letter-spacing:.01em;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ep-row .em .done{color:var(--accent-ink)}
.ep-row .et{font-size:16.5px;font-weight:700;line-height:1.28;margin:2px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-row .ed{font-size:13.5px;color:var(--sub);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-row .ea{display:flex;align-items:center;gap:8px;margin-top:8px}
.ep-row .dots{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--sub);flex:none}
.ep-row.playing .et{color:var(--accent-ink)}
.person-card{display:flex;gap:14px;align-items:center;background:var(--card-2);border-radius:16px;padding:14px;cursor:pointer;margin-top:10px}
.avatar-ini{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:23px;font-weight:800;flex:none;letter-spacing:.01em}
.person-card .pt{font-size:17.5px;font-weight:700}
.person-card .ps{font-size:13.5px;color:var(--sub)}
.chev-r{color:var(--sub2);margin-left:auto}
/* states */
.empty{padding:26px 8px;text-align:center;color:var(--sub)}
.empty .et2{font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px}
.empty p{font-size:14.5px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;
  font-size:15.5px;font-weight:700;border-radius:999px;padding:11px 22px;min-height:46px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.btn.gray{background:var(--card-2);color:var(--text)}
.btn:active{opacity:.82}
.skel{border-radius:12px;background:linear-gradient(100deg,var(--card-2) 40%,var(--hairline) 50%,var(--card-2) 60%);
  background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{from{background-position:120% 0}to{background-position:-80% 0}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);
  animation:sp .8s linear infinite;margin:22px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.err-box{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:14.5px;margin:12px 0}
</style>
</head>
<style>
/* ============ SEARCH ============ */
.search-box{display:flex;align-items:center;gap:9px;background:var(--card-2);border-radius:12px;
  padding:0 8px 0 13px;margin:12px 0 4px;min-height:48px}
.search-box .ic{color:var(--sub);width:21px;height:21px}
.search-box input{flex:1;border:none;background:none;font:inherit;font-size:17px;color:var(--text);min-width:0;height:48px}
.search-box input::-webkit-search-cancel-button{display:none}
.search-box input::placeholder{color:var(--sub2)}
.search-box .clr{display:none;width:38px;height:38px;border-radius:50%;place-items:center;color:var(--sub)}
.search-box .clr.on{display:grid}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--card-2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:38px}
/* ============ LIBRARY SEGMENTS ============ */
.seg{display:flex;background:var(--card-2);border-radius:11px;padding:2.5px;margin:14px 0 4px}
.seg button{flex:1;font-size:13.5px;font-weight:600;padding:8px 2px;border-radius:9px;color:var(--text);min-height:38px}
.seg button.on{background:var(--card);box-shadow:0 1px 5px rgba(0,0,0,.16);font-weight:700}
.show-row{display:flex;gap:13px;align-items:center;padding:11px 0;border-bottom:.5px solid var(--hairline);cursor:pointer}
.show-row img{width:58px;height:58px;border-radius:9px;object-fit:cover}
.show-row .st{font-size:16.5px;font-weight:600}
.show-row .ss{font-size:13px;color:var(--sub)}
/* ============ PAGE VIEW (show / bank / episode / queue) ============ */
#pageView{position:fixed;inset:0;z-index:44;background:var(--bg);transform:translateX(102%);transition:transform .3s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column}
#pageView.on{transform:none}
#pageView .pv-head{position:relative;display:flex;align-items:center;min-height:calc(56px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 14px 0;border-bottom:.5px solid var(--hairline)}
.back-btn{width:40px;height:40px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;flex:none}
#pageView .pv-title{position:absolute;left:64px;right:64px;text-align:center;font-size:16.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#pvBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 170px;width:100%;max-width:860px;margin:0 auto}
.hero-art{width:min(230px,58vw);aspect-ratio:1;border-radius:16px;object-fit:cover;margin:6px auto 14px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.hero-title{font-size:24px;font-weight:800;text-align:center;letter-spacing:-.02em;line-height:1.18}
.hero-sub{font-size:14.5px;color:var(--sub);text-align:center;margin-top:3px}
.hero-actions{display:flex;gap:10px;justify-content:center;margin:15px 0 6px;flex-wrap:wrap}
.desc{font-size:15px;line-height:1.5;color:var(--text);margin:12px 0}
.desc a{word-break:break-word}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{color:var(--accent-ink);font-weight:600;font-size:14.5px;min-height:40px}
.sort-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px}
.sort-row .lbl{font-size:15px;font-weight:700}
.sort-seg{display:flex;background:var(--card-2);border-radius:9px;padding:2px}
.sort-seg button{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:7px;min-height:32px}
.sort-seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.big-play{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--accent);color:#fff;
  font-size:17px;font-weight:700;border-radius:14px;min-height:54px;margin:14px 0 4px}
.big-play:active{opacity:.85}
.act-row{display:flex;justify-content:space-around;margin:12px 0 4px}
.act-row button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--accent-ink);min-width:64px;min-height:56px;justify-content:center}
.act-row button .ic{width:25px;height:25px}
.act-row button.off{color:var(--sub)}
.prog-line{height:5px;border-radius:3px;background:var(--card-2);overflow:hidden;margin:10px 0 4px}
.prog-line i{display:block;height:100%;background:var(--accent);width:0%}
/* ============ QUEUE ============ */
.q-now{display:flex;gap:13px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:12px;margin-bottom:8px}
.q-now img{width:56px;height:56px;border-radius:9px;object-fit:cover}
.q-row{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:.5px solid var(--hairline)}
.q-row img{width:50px;height:50px;border-radius:8px;object-fit:cover;flex:none}
.q-row .qb{flex:1;min-width:0}
.q-row .qt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-row .qs{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-row .qb2{display:flex;flex-direction:column}
.q-row .qb2 button{width:36px;height:32px;display:grid;place-items:center;color:var(--sub)}
.q-row .drag{color:var(--sub2);cursor:grab;padding:6px 2px;touch-action:none}
.q-row.dragging{opacity:.55;background:var(--accent-soft);border-radius:10px}
/* ============ ACTION SHEET / MENUS ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--sheet-bg);border-radius:20px 20px 0 0;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.28,1);max-width:560px;margin:0 auto;
  padding:10px 14px calc(14px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:2px auto 10px}
.sheet .sh-head{display:flex;gap:12px;align-items:center;padding:2px 4px 12px;border-bottom:.5px solid var(--hairline)}
.sheet .sh-head img{width:52px;height:52px;border-radius:9px;object-fit:cover}
.sheet .sh-head .t{font-size:15.5px;font-weight:700;line-height:1.3}
.sheet .sh-head .s{font-size:13px;color:var(--sub)}
.a-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:16.5px;font-weight:500;
  padding:13px 6px;min-height:52px;border-bottom:.5px solid var(--hairline)}
.a-item:last-child{border-bottom:none}
.a-item .ic{color:var(--accent-ink);width:23px;height:23px}
.a-item.danger{color:#d63a2f}.a-item.danger .ic{color:#d63a2f}
.a-item .val{margin-left:auto;color:var(--sub);font-size:14.5px}
/* ============ NOW PLAYING ============ */
#np{position:fixed;inset:0;z-index:65;background:var(--np-bg);color:var(--np-text);
  transform:translateY(103%);transition:transform .34s cubic-bezier(.32,.72,.28,1);display:flex;flex-direction:column;overflow:hidden}
#np.on{transform:none}
#npBg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(60px) brightness(.5);opacity:.55;transform:scale(1.4)}
#npIn{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top)) 22px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;width:100%}
#np .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:2px auto 4px;flex:none}
#npClose{align-self:flex-start;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.1);flex:none}
/* STAGE — the skinnable slot. data-skin on #stage selects the skin; only "screen" ships now. */
#stage{position:relative;flex:none;width:min(76vw,336px);aspect-ratio:1;margin:4px auto 0}
.stage-skin{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#1d1d21;box-shadow:0 18px 44px rgba(0,0,0,.55)}
#stage[data-skin="screen"] .stage-skin{background:#000}
#npArt{width:100%;height:100%;object-fit:cover}
#npWords{position:absolute;inset:0;z-index:2;display:none;padding:18px 16px;overflow-y:auto;
  font-size:15.5px;line-height:1.6;background:rgba(12,12,15,.94);color:#e9e9ed}
#npWords.on{display:block}
#npWords .wline{opacity:.5;padding:3px 0;cursor:pointer;border-radius:6px}
#npWords .wline.act{opacity:1;color:#fff;font-weight:700}
#npWords .wnone{color:var(--np-sub);text-align:center;padding-top:30px;font-size:14.5px;line-height:1.55}
#npWordsBtn{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:6px;
  background:rgba(18,18,22,.74);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;
  padding:8px 13px;font-size:12.5px;font-weight:700;min-height:38px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#npWordsBtn .ic{width:18px;height:18px}
#npWordsBtn.on{background:var(--accent);border-color:transparent}
#npWordsBtn.off{opacity:.55}
/* ON-DECK STRIP */
#npDeck{flex:none;margin:14px auto 0;width:100%;background:var(--np-card);border-radius:14px;
  padding:10px 12px;cursor:pointer;color:var(--np-text)}
.deck-row{display:flex;gap:11px;align-items:center;min-width:0}
.deck-row img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none}
.deck-mid{flex:1;min-width:0}
.deck-lbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:#dcbcff;display:flex;align-items:center;gap:6px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px;flex:none}
.eq i{width:3px;background:#dcbcff;border-radius:1px;height:10px;transform-origin:bottom;animation:eqb 1s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(1){height:6px}.eq i:nth-child(2){height:10px;animation-delay:.18s}.eq i:nth-child(3){height:5px;animation-delay:.36s}
#np.playing .eq i{animation-play-state:running}
@keyframes eqb{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.deck-t{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.deck-s{font-size:12.5px;color:var(--np-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-chev{color:var(--np-sub);flex:none}
.deck-next{display:flex;gap:8px;margin-top:9px}
.deck-chip{flex:1;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.06);border-radius:9px;padding:6px 8px;min-width:0}
.deck-chip img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex:none}
.deck-chip .dc-m{min-width:0}
.deck-chip .dc-l{font-size:9px;font-weight:800;letter-spacing:.09em;color:var(--np-sub)}
.deck-chip .dc-t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#npDate{color:var(--np-sub);font-size:14.5px;margin-top:14px}
#npTitleRow{display:flex;align-items:flex-start;gap:8px}
#npTitle{flex:1;font-size:21.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#npShow{color:var(--np-sub);font-size:17px;margin-top:1px;cursor:pointer}
#npDots{color:#fff;width:40px;height:40px;display:grid;place-items:center;flex:none}
.seek{margin-top:16px}
.seek-track{position:relative;height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek-track .rail{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.seek-track .fillbar{position:absolute;left:0;height:6px;border-radius:3px;background:#fff;width:0%}
.seek-track .knob{position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;left:0%;transform:translateX(-50%);opacity:0;transition:opacity .15s}
.seek-track:active .knob,.seek-track.drag .knob{opacity:1}
.seek-times{display:flex;justify-content:space-between;font-size:13px;color:var(--np-sub);font-variant-numeric:tabular-nums;margin-top:-4px}
.transport{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:0 2px}
.transport button{color:#fff;display:grid;place-items:center;border-radius:50%}
.transport .tp-play{width:76px;height:76px}
.transport .tp-play .ic{width:66px;height:66px}
.transport .tp-skip{width:60px;height:60px}
.transport .tp-skip .ic{width:52px;height:52px}
.transport .tp-txt{font-size:16.5px;font-weight:600;color:#fff;min-width:52px;height:52px}
.transport .tp-txt small{display:block;font-size:9.5px;color:var(--np-sub);font-weight:600}
.transport button:active{opacity:.7}
.vol-row{display:flex;align-items:center;gap:12px;margin-top:10px;color:var(--np-sub)}
.vol-row .ic{width:20px;height:20px}
input[type=range].vol{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:rgba(255,255,255,.3);outline-offset:4px}
input[type=range].vol::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
input[type=range].vol::-moz-range-thumb{width:26px;height:26px;border:none;border-radius:50%;background:#fff}
#npErr{display:none;background:rgba(214,58,47,.16);color:#ffb4ab;border-radius:10px;padding:10px 13px;font-size:14px;margin-top:12px}
#npErr.on{display:flex;gap:10px;align-items:center;justify-content:space-between}
#npErr button{color:#fff;font-weight:700;text-decoration:underline;min-height:36px}
/* ADD BY LINK (Search) */
.addlink{background:var(--card-2);border-radius:16px;padding:16px;margin-top:16px}
.addlink .al-t{font-size:17px;font-weight:800}
.addlink .al-p{font-size:13.5px;color:var(--sub);margin:4px 0 12px;line-height:1.45}
.al-row{display:flex;gap:9px}
.al-row input{flex:1;min-width:0;border:1px solid var(--sep);background:var(--card);border-radius:12px;
  padding:0 13px;height:48px;font:inherit;font-size:15px;color:var(--text)}
.al-row .btn{flex:none}
.al-msg{font-size:14px;margin-top:10px;line-height:1.45}
.al-msg.err{color:#c22f24}
.al-msg.ok{color:var(--accent-ink);font-weight:600}
/* ============ TOAST ============ */
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--mini-h) + 44px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);z-index:90;background:rgba(28,24,34,.94);color:#fff;font-size:14.5px;font-weight:600;
  padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ============ DESKTOP / TABLET ============ */
@media (min-width:900px){
  #sidebar{display:flex;flex-direction:column;gap:4px;width:236px;flex:none;padding:26px 14px;
    border-right:.5px solid var(--hairline);position:sticky;top:0;height:100dvh;background:var(--bg)}
  #sidebar .brand{font-size:20px;font-weight:800;display:flex;gap:9px;align-items:center;padding:2px 10px 18px}
  #sidebar .brand .dot{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
  #sidebar .brand .dot svg{width:19px;height:19px}
  #sidebar nav{display:flex;flex-direction:column;gap:2px}
  #sidebar nav button{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;padding:11px 12px;border-radius:10px;text-align:left;min-height:48px}
  #sidebar nav button.on{background:var(--accent-soft);color:var(--accent-ink)}
  #sidebar .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
  #tabbar{display:none}
  #mini{left:236px;right:0;bottom:0;max-width:none;border-radius:0;border-left:none;border-right:none;border-bottom:none;margin:0}
  main{padding-bottom:130px}
  #pageView{left:236px}
  .tile{width:150px}.tile img{width:150px;height:150px}
  .tile.wide{width:180px}.tile.wide img{width:180px;height:180px}
}
@media (max-width:374px){ .ep-row img{width:76px;height:76px} h1.page{font-size:30px} }
/* fit law: short screens — sheet & NP compress, everything reachable by scroll */
@media (max-height:700px){
  #stage{width:min(50vw,228px)}
  #npIn{padding-top:calc(4px + env(safe-area-inset-top))}
  .transport{margin-top:6px}
  #npDeck{margin-top:10px}
}
/* desktop Now Playing: stage left, controls spread right — composed, not a stranded column */
@media (min-width:900px){
  #npIn{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);column-gap:48px;
    max-width:1060px;align-content:center}
  #np .grab{grid-column:1/-1}
  #npClose{grid-column:1/-1;justify-self:start}
  #stage{grid-column:1;grid-row:3/11;width:100%;margin:0;align-self:start}
  #npDeck,#npDate,#npTitleRow,#npShow,#npErr{grid-column:2}
  #npDeck{margin-top:0}
  .seek{grid-column:2}
  .transport{grid-column:2}
  .vol-row{grid-column:2}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

</div>

<!-- sub-page (show / bank / episode / queue) -->
<div id="pageView" role="dialog" aria-modal="false">

    <div class="pv-title" id="pvTitle"></div>
  </div>
  <div id="pvBody"></div>
</div>

<!-- Now Playing -->
<div id="np" role="dialog" aria-label="Now Playing">
  <div id="npBg"></div>
  <div id="npIn">
    <div class="grab"></div>
    <button id="npClose" aria-label="Close Now Playing"><span class="ic" data-ic="chevd"></span></button>
    <div id="stage" data-skin="screen">
      <div class="stage-skin stage-skin-screen">
        <img id="npArt" alt="Episode artwork">
        <div id="npWords" aria-live="off"></div>
      </div>
      <button id="npWordsBtn" aria-label="Words (transcript)"><span class="ic" data-ic="words"></span>WORDS</button>

        <img id="deckArt" alt="">

          <div class="deck-lbl"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="deckLbl">NOW PLAYING</span></div>

      <div class="deck-next" id="deckNext"></div>

    <div id="npErr"><span id="npErrTxt">Playback hit a snag.</span><button id="npRetry">Retry</button></div>
    <div class="seek">
      <div class="seek-track" id="seekTrack" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="rail"></div><div class="fillbar" id="seekFill"></div><div class="knob" id="seekKnob"></div>

    </div>
    <div class="transport">
      <button class="tp-txt" id="npSpeed" aria-label="Playback speed">1×<small>SPEED</small></button>

      <button class="tp-txt" id="npSleep" aria-label="Sleep timer"><span class="ic" data-ic="moon" style="width:26px;height:26px"></span><small id="npSleepLbl">SLEEP</small></button>
    </div>
    <div class="vol-row">
      <span class="ic" data-ic="volLo"></span>
      <input type="range" class="vol" id="npVol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <span class="ic" data-ic="volHi"></span>
    </div>
  </div>
</div>

<!-- mini player -->
<div id="mini" role="button" aria-label="Open Now Playing">
  <img id="miniArt" alt="">
  <div class="mt"><div class="t" id="miniTitle"></div><div class="s" id="miniShow"></div></div>
  <button class="mb" id="miniPlay" aria-label="Play or pause"><span class="ic" data-ic="play"></span></button>
  <button class="mb" id="miniFwd" aria-label="Skip forward 15 seconds"><span class="ic" data-ic="fwd15"></span></button>

</div>

<!-- tab bar -->

<!-- action sheet -->

<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div id="toast" role="status"></div>

  set(k, v){ try{ localStorage.setItem('gp_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('gp_'+k); }catch(e){} }
};

  follows: LS.get('follows', {}),     // showId -> {ts, show}
  saved:   LS.get('saved', {}),       // epKey -> {ts, ep}
  progress:LS.get('progress', {}),    // epKey -> {pos, dur, done, updatedAt}
  played:  LS.get('played', {}),      // epKey -> true (explicit marks)
  queue:   LS.get('queue', []),       // [epKey,...] upcoming (excludes current)
  snaps:   LS.get('snaps', {}),       // epKey -> episode snapshot
  recents: LS.get('recents', []),     // [term]
  settings:LS.get('settings', {speed:1, theme:'auto'}),
};
function persist(...keys){
  const map = {follows:'follows',saved:'saved',progress:'progress',played:'played',queue:'queue',snaps:'snaps',recents:'recents',settings:'settings'};
  (keys.length?keys:Object.keys(map)).forEach(k=>LS.set(map[k], S[k]));
}
function snap(ep){ if(ep && ep.key && !S.snaps[ep.key]) { S.snaps[ep.key]=ep; persist('snaps'); } }

/* ================= UTILS ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtClock(sec){ sec=Math.max(0,Math.round(sec||0)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h>0 ? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') : m+':'+String(s).padStart(2,'0'); }
function fmtDur(sec){ if(!sec||!isFinite(sec)) return ''; sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60);
  if(h>0) return m>0 ? h+'h '+m+'m' : h+'h'; return Math.max(1,Math.round(sec/60))+'m'; }
function fmtDate(iso){ const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:(d.getFullYear()!==new Date().getFullYear()?'numeric':undefined)}); }
function fmtDateLong(iso){ const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function relTime(iso){ const t=new Date(iso).getTime(); if(isNaN(t)) return ''; const s=(Date.now()-t)/1000;
  if(s<3600) return Math.max(1,Math.floor(s/60))+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<86400*7) return Math.floor(s/86400)+'d ago'; return fmtDate(iso); }
function epKey(feed, guid, audio){ return (feed||'')+'|'+(guid||audio||''); }
function isDone(key){ const p=S.progress[key]; return !!(S.played[key] || (p && p.done)); }
function progOf(key){ return S.progress[key] || null; }
function remaining(key, durFallback){ const p=progOf(key); const dur=(p&&p.dur)||durFallback||0; if(!dur) return 0;
  if(isDone(key)) return 0; return Math.max(0, dur-(p?p.pos:0)); }
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'), 2400); }
function sanitizeHTML(html){ const d=document.createElement('div'); d.innerHTML=html||'';
  d.querySelectorAll('script,style,iframe,object,embed,form,input,button,img,video,audio,link,meta,svg').forEach(n=>n.remove());
  d.querySelectorAll('*').forEach(n=>{ [...n.attributes].forEach(a=>{ const nm=a.name.toLowerCase();
    if(nm.startsWith('on') || nm==='style') n.removeAttribute(a.name);
    else if(nm==='href'){ if(!/^https?:\/\//i.test(a.value)) n.removeAttribute('href'); else { n.setAttribute('target','_blank'); n.setAttribute('rel','noopener'); } }
    else n.removeAttribute(a.name); }); });
  return d.innerHTML; }
function htmlToText(html){ const d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').replace(/\s+/g,' ').trim(); }
function initials(name){ return (name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

/* ================= NETWORK: fetch with relay fallback chain ================= */
function withTimeout(promise, ms){ return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]); }
async function fetchText(url){
  const tries = [ url,
    'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
    'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url) ];
  let lastErr = new Error('network');
  for(const u of tries){
    try{ const r = await withTimeout(fetch(u), 14000); if(r.ok) return await r.text(); lastErr = new Error('HTTP '+r.status); }
    catch(e){ lastErr = e; }
  }
  throw lastErr;
}
async function fetchJSON(url){ const t = await fetchText(url); return JSON.parse(t); }

async function itunesSearch(term, entity, limit){
  const u = 'https://itunes.apple.com/search?'+new URLSearchParams({term, entity, limit:String(limit||25), country:'US'});
  const j = await fetchJSON(u); return j.results||[];
}
async function itunesLookupEpisodes(showId, limit){
  const u = 'https://itunes.apple.com/lookup?'+new URLSearchParams({id:String(showId), entity:'podcastEpisode', limit:String(limit||60), country:'US'});
  const j = await fetchJSON(u); return (j.results||[]).filter(r=>r.kind==='podcast-episode');
}
function showFromItunes(r){
  return { id:r.collectionId, name:r.collectionName||'', artist:r.artistName||'',
    art:(r.artworkUrl600||r.artworkUrl100||''), feed:r.feedUrl||'', genres:r.genres||[] };
}
function epFromItunes(r, showRec){
  const feed = r.feedUrl || (showRec&&showRec.feed) || '';
  const guid = r.episodeGuid || '';
  return { key: epKey(feed, guid, r.episodeUrl), feed, guid, audio:r.episodeUrl||'',
    title:r.trackName||'', date:r.releaseDate||'', durSec: r.trackTimeMillis? Math.round(r.trackTimeMillis/1000):0,
    art: r.artworkUrl600 || (showRec&&showRec.art) || '', desc: htmlToText(r.description||''),
    showId: r.collectionId || (showRec&&showRec.id), showName: r.collectionName || (showRec&&showRec.name)||'',
    transcript:null };
}

/* ================= RSS FEED LAYER ================= */
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return 'fc_'+(h>>>0).toString(36); }
function childEls(el, local){ return [...el.children].filter(c=>c.localName===local); }
function childText(el, local){ const c = childEls(el, local)[0]; return c ? c.textContent.trim() : ''; }
function parseDuration(v){ if(!v) return 0; v=String(v).trim(); if(/^\d+$/.test(v)) return parseInt(v,10);
  const p=v.split(':').map(Number); if(p.some(isNaN)) return 0;
  return p.reduce((a,n)=>a*60+n,0); }
function parseFeed(xmlText, feedUrl){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('Bad feed XML');
  const ch = doc.querySelector('channel'); if(!ch) throw new Error('No channel in feed');
  const showArt = (childEls(ch,'image')[0] && childEls(ch,'image')[0].getAttribute('href')) ||
                  (childEls(ch,'image')[0] ? childText(childEls(ch,'image')[0],'url') : '') || '';
  const show = { title: childText(ch,'title'), desc: childText(ch,'description') || childText(ch,'summary'),
                 art: showArt, author: childText(ch,'author') || childText(ch,'owner') };
  const items = [...ch.querySelectorAll('item')];
  const eps = items.map(it=>{
    const enc = childEls(it,'enclosure')[0];
    const audio = enc ? enc.getAttribute('url')||'' : '';
    const guid = childText(it,'guid') || audio;
    const imgEl = childEls(it,'image')[0];
    const trEl = childEls(it,'transcript')[0];
    const descRaw = childText(it,'encoded') || childText(it,'description') || childText(it,'summary');
    return { key: epKey(feedUrl, guid, audio), feed: feedUrl, guid, audio,
      title: childText(it,'title'), date: childText(it,'pubDate'),
      durSec: parseDuration(childText(it,'duration')),
      art: (imgEl && imgEl.getAttribute('href')) || showArt,
      desc: descRaw, descText: htmlToText(descRaw),
      transcript: trEl ? (trEl.getAttribute('url')||'') : null,
      showName: show.title };
  }).filter(e=>e.audio);
  return { show, eps };
}
const feedMem = {};   // feedUrl -> {t, show, eps}
async function loadFeed(feedUrl, force){
  if(!feedUrl) throw new Error('This show has no public feed.');
  const now = Date.now();
  if(!force && feedMem[feedUrl] && now-feedMem[feedUrl].t < 30*60*1000) return feedMem[feedUrl];
  const ck = hashStr(feedUrl);
  if(!force){ const c = LS.get(ck, null); if(c && now-c.t < 30*60*1000){ feedMem[feedUrl]=c; return c; } }
  const xml = await fetchText(feedUrl);
  const parsed = parseFeed(xml, feedUrl);
  parsed.t = now;
  feedMem[feedUrl] = parsed;
  // cache a trimmed copy (cap storage)
  try{ const trim = { t:now, show:parsed.show, eps: parsed.eps.slice(0,80).map(e=>({...e, desc:(e.desc||'').slice(0,900), descText:(e.descText||'').slice(0,280)})) };
    LS.set(ck, trim); }catch(e){}
  return parsed;
}

function pillHTML(ep){
  const p = progOf(ep.key), dur = (p&&p.dur) || ep.durSec || 0;

  return '<button class="pill" data-act="play" data-key="'+ep.key+'">'+icon('play')+(dur?'<span>'+fmtDur(dur)+'</span>':'<span>Play</span>')+'</button>';

/* ================= ADD BY LINK (the universal door) ================= */
async function addByLink(raw, msgEl, btn){
  const url = (raw||'').trim();
  const say = (t, ok)=>{ if(msgEl){ msgEl.textContent = t; msgEl.className = 'al-msg '+(ok?'ok':'err'); } };
  if(!url){ say('Paste a link first — an RSS feed address or an Apple Podcasts show link.', false); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Adding…'; }
  try{
    let feedUrl = null, appleShow = null;
    const appleId = (url.match(/id(\d{5,})/)||[])[1];
    if(/apple\.com/i.test(url)){
      if(!appleId) throw new Error('That Apple link doesn\u2019t carry a show ID — open the show\u2019s own page in Apple Podcasts and copy that link.');
      const j = await fetchJSON('https://itunes.apple.com/lookup?'+new URLSearchParams({id:appleId, entity:'podcast', country:'US'}));
      const r = (j.results||[])[0];
      if(!r) throw new Error('Apple doesn\u2019t list a show at that link — nothing was added.');
      if(!r.feedUrl) throw new Error('Apple lists \u201C'+(r.collectionName||'this show')+'\u201D, but it publishes no open feed we can play — nothing was added.');
      appleShow = showFromItunes(r); feedUrl = r.feedUrl;
    } else if(/^https?:\/\/\S+$/i.test(url)){
      feedUrl = url;
    } else {
      throw new Error('That doesn\u2019t look like a link — paste the full address, starting with https://');
    }
    const f = await loadFeed(feedUrl, true);
    if(!f.eps.length) throw new Error('That feed answered, but it holds no playable episodes — nothing was added.');
    let show = appleShow;
    if(!show) show = { id: hashStr(feedUrl), name: f.show.title || 'Podcast', artist: f.show.author || '',
      art: f.show.art || (f.eps[0] && f.eps[0].art) || '', feed: feedUrl, genres: [] };
    registerShow(show);
    say('Added \u201C'+show.name+'\u201D — opening it now.', true);
    toast('Added: '+show.name);
    openShowPage(show);
  }catch(err){
    const m = String((err && err.message) || '');
    if(/show ID|doesn\u2019t list|no open feed|no playable episodes|look like a link/i.test(m)) say(m, false);
    else say('Couldn\u2019t turn that link into a playable show. Some shows — Spotify- or YouTube-only ones, for example — don\u2019t publish an open feed, so there is nothing here to play. Nothing was added.', false);
  }finally{ if(btn){ btn.disabled = false; btn.textContent = 'Add'; } }
}
async function doSearch(q){
  const seq = ++searchSeq; const el = $('#searchBody');
  el.innerHTML = '<div class="spin"></div>';
  const [sh, ep] = await Promise.allSettled([ itunesSearch(q,'podcast',14), itunesSearch(q,'podcastEpisode',24) ]);
  if(seq !== searchSeq) return;
  const shows = sh.status==='fulfilled' ? sh.value.map(showFromItunes).filter(s=>s.feed) : [];
  const rawEps = ep.status==='fulfilled' ? ep.value : [];
  const showById = {}; shows.forEach(s=>showById[s.id]=s);
  const eps = rawEps.map(r=> epFromItunes(r, showById[r.collectionId] || (r.collectionId? {id:r.collectionId,name:r.collectionName,feed:r.feedUrl,art:r.artworkUrl600}:null)) ).filter(e=>e.audio);
  if(sh.status==='rejected' && ep.status==='rejected'){
    el.innerHTML = '<div class="err-box"><b>Search couldn\u2019t get through.</b><br>Check your connection and try again — no results were made up to fill the gap.<br><button class="btn ghost" style="margin-top:10px" data-act="research" data-q="'+esc(q)+'">Retry search</button></div>'; return;
  }
  if(!shows.length && !eps.length){
    el.innerHTML = '<div class="empty"><div class="et2">No matches for \u201C'+esc(q)+'\u201D</div><p>Try a show\u2019s exact name, or a person\u2019s full name.</p></div>'; return;
  }
  let html = '';
  if(shows.length) html += '<h2 class="sec" style="font-size:20px">Shows</h2><div class="hrow">'+shows.map(s=>showTileHTML(s)).join('')+'</div>';
  if(eps.length) html += '<h2 class="sec" style="font-size:20px">Episodes</h2>'+eps.map(e=>epRowHTML(e)).join('');
  el.innerHTML = html;
}
function noteRecent(q){
  q = q.trim(); if(!q) return;
  S.recents = [q, ...S.recents.filter(t=>t.toLowerCase()!==q.toLowerCase())].slice(0,8); persist('recents');
}

function renderQueue(body){

    + (S.queue.length? '<button class="text-btn" id="qClear">Clear Queue</button>':'') + '</div>';

  html += S.queue.map((k,i)=>{ const ep = S.snaps[k]; if(!ep) return '';
    return '<div class="q-row" data-qi="'+i+'"><span class="drag" data-drag="'+i+'" aria-label="Drag to reorder">'+icon('grip')+'</span>'
      + '<img src="'+esc(ep.art||'')+'" alt=""><div class="qb"><div class="qt">'+esc(ep.title)+'</div><div class="qs">'+esc(ep.showName||'')+'</div></div>'
      + '<div class="qb2"><button data-qup="'+i+'" aria-label="Move up">'+icon('up')+'</button><button data-qdn="'+i+'" aria-label="Move down">'+icon('down')+'</button></div>'
      + '<button class="dots" data-qrm="'+i+'" aria-label="Remove from queue" style="width:40px;height:40px;display:grid;place-items:center;color:var(--sub)">'+icon('x')+'</button></div>'; }).join('');
  /* Section 2 — Continue Playing: the rest of the current show, automatically after the Queue */
  const cont = (typeof continuePlayingList==='function') ? continuePlayingList() : [];
  html += '<div class="sec-head"><h2 class="sec" style="margin-top:22px">Continue Playing</h2></div>';
  if(cont.length){
    html += '<div class="sec-note" style="margin-top:0">More from '+(curEp? esc(curEp.showName||'this show') : 'this show')+' — plays automatically after your Queue.</div>';
    html += cont.slice(0,20).map(ep=>'<div class="q-row" data-cont="'+esc(ep.key)+'">'
      + '<img src="'+esc(ep.art||'')+'" alt=""><div class="qb"><div class="qt">'+esc(ep.title)+'</div><div class="qs">'+esc(ep.showName||'')+(ep.durSec?' · '+fmtDur(ep.durSec):'')+'</div></div>'
      + '<button class="dots" data-contplay="'+esc(ep.key)+'" aria-label="Play now" style="width:40px;height:40px;display:grid;place-items:center;color:var(--accent-ink)">'+icon('play')+'</button></div>').join('');
  } else {
    html += '<div class="empty" style="padding:14px 8px 6px"><p>Nothing lined up after this. Play an episode from a show and the rest of that show lines up here.</p></div>';
  }
  body.innerHTML = html;
  const clr = body.querySelector('#qClear');
  if(clr) clr.addEventListener('click', ()=>{ if(clr.dataset.arm){ S.queue=[]; persist('queue'); updateQBadge(); renderQueue(body); toast('Queue cleared'); }
    else { clr.dataset.arm='1'; clr.textContent='Tap again to confirm'; setTimeout(()=>{ clr.dataset.arm=''; clr.textContent='Clear Queue'; }, 2600); } });
  body.querySelectorAll('[data-qup]').forEach(b=>b.addEventListener('click', ()=>moveQ(+b.dataset.qup, -1, body)));
  body.querySelectorAll('[data-qdn]').forEach(b=>b.addEventListener('click', ()=>moveQ(+b.dataset.qdn, +1, body)));
  body.querySelectorAll('[data-qrm]').forEach(b=>b.addEventListener('click', ()=>{ S.queue.splice(+b.dataset.qrm,1); persist('queue'); updateQBadge(); renderQueue(body); }));
  body.querySelectorAll('[data-drag]').forEach(h=>wireDrag(h, body));
  body.querySelectorAll('[data-contplay]').forEach(b=>b.addEventListener('click', ()=>{ const ep = epReg[b.dataset.contplay]; if(ep) playEpisode(ep, {context: (typeof currentCtxList==='function'? currentCtxList() : null)}); }));
}
function moveQ(i, d, body){ const j = i+d; if(j<0||j>=S.queue.length) return;
  const [it] = S.queue.splice(i,1); S.queue.splice(j,0,it); persist('queue'); renderQueue(body); }
function wireDrag(handle, body){
  handle.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    const row = handle.closest('.q-row'); const idx = +handle.dataset.drag;
    const startY = ev.clientY; row.classList.add('dragging'); handle.setPointerCapture(ev.pointerId);
    const mv = e2=>{ row.style.transform = 'translateY('+(e2.clientY-startY)+'px)'; };
    const up = e2=>{ handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up);
      row.classList.remove('dragging'); row.style.transform='';
      const dy = e2.clientY - startY; const step = Math.round(dy/72);
      const j = Math.max(0, Math.min(S.queue.length-1, idx+step));
      if(j!==idx){ const [it]=S.queue.splice(idx,1); S.queue.splice(j,0,it); persist('queue'); }
      renderQueue(body); };
    handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up);
  });
}
function updateQBadge(){ if(typeof updateDeck==='function') updateDeck(); }
function playNext(ep){ if(!ep) return; regEp(ep); snap(ep);
  if(window.__cur && ep.key===window.__cur.key){ toast('That\u2019s playing right now'); return; }
  S.queue = [ep.key, ...S.queue.filter(k=>k!==ep.key)]; persist('queue','snaps'); updateQBadge(); toast('Up next: '+ep.title.slice(0,42)); }
function addToQueue(ep){ if(!ep) return; regEp(ep); snap(ep);
  if(window.__cur && ep.key===window.__cur.key){ toast('That\u2019s playing right now'); return; }
  if(S.queue.includes(ep.key)){ toast('Already in Up Next'); return; }
  S.queue.push(ep.key); persist('queue','snaps'); updateQBadge(); toast('Added to Up Next'); }

/* ================= THEME ================= */
function effectiveTheme(){ if(S.settings.theme==='light'||S.settings.theme==='dark') return S.settings.theme;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'; }
function applyTheme(){ const t = effectiveTheme(); document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').setAttribute('content', t==='dark' ? '#000000' : '#ffffff');
  const ic = t==='dark' ? 'sun' : 'moon';
  $('#themeBtn').innerHTML = icon(ic); $('#themeBtnSide').innerHTML = icon(ic); }
function toggleTheme(){ S.settings.theme = effectiveTheme()==='dark' ? 'light':'dark'; persist('settings'); applyTheme(); }
$('#themeBtn').addEventListener('click', toggleTheme);
$('#themeBtnSide').addEventListener('click', toggleTheme);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ if(S.settings.theme==='auto') applyTheme(); });

/* ================= GLOBAL CLICK DELEGATION ================= */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act, ep = t.dataset.key ? epReg[t.dataset.key] : null;
  switch(act){
    case 'play': e.stopPropagation(); if(ep) playEpisode(ep, {context: showContexts[ep.showId]||null}); break;
    case 'dots': e.stopPropagation(); if(ep) openEpMenu(ep); break;
    case 'eppage': if(ep) openEpisodePage(ep); break;
    case 'show': { const sh = showReg[t.dataset.show]; if(sh){ if(pageStack.length && pageStack[pageStack.length-1].title===sh.name){} else openShowPage(sh); } break; }
    case 'bank-ethan': openBankPage(); break;
    case 'tab': e.preventDefault(); goTab(t.dataset.tab); break;
    case 'research': { const q=t.dataset.q; $('#searchInput').value=q; $('#searchClear').classList.add('on'); noteRecent(q); doSearch(q); break; }
    case 'm-play': closeSheet(); if(window.__menuEp) playEpisode(window.__menuEp, {fromStart: isDone(window.__menuEp.key), context: showContexts[window.__menuEp.showId]||null}); break;
    case 'm-next': closeSheet(); playNext(window.__menuEp); break;
    case 'm-addq': closeSheet(); addToQueue(window.__menuEp); break;
    case 'm-save': toggleSave(window.__menuEp); closeSheet(); refreshViews(); break;
    case 'm-played': togglePlayed(window.__menuEp); closeSheet(); refreshViews(); break;
    case 'm-share': closeSheet(); if(window.__menuEp) shareEp(window.__menuEp); break;
    case 'm-show': { const m = window.__menuEp; closeSheet(); if(m) openShowPage(showForEp(m)); break; }
    case 'menu-pick': pickMenu(t.dataset.val); break;
  }
});
</script>
<script>
"use strict";
/* ================= PLAYER ENGINE ================= */
const audio = document.getElementById('audio');
const ART_PH = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="600" height="600" fill="#ece4f7"/><g fill="#872ec4"><rect x="196" y="268" width="26" height="64" rx="13"/><rect x="240" y="238" width="26" height="124" rx="13"/><rect x="284" y="258" width="26" height="84" rx="13"/><rect x="328" y="218" width="26" height="164" rx="13"/><rect x="372" y="248" width="26" height="104" rx="13"/></g></svg>');
document.addEventListener('error', (e) => { const t = e.target; if(t && t.tagName === 'IMG' && !t.dataset.ph){ t.dataset.ph = '1'; t.src = ART_PH; } }, true);
let cur = null; window.__cur = null;
let ctxList = [], ctxIdx = -1;
let deliberatePause = true;
let resumeArm = null, resumeTries = 0;
let pendingSeek = 0, lastProgSave = 0;
let sleepMode = 'off', sleepEndsAt = 0, sleepTick = null;
let dragging = false;
function setCtx(list, ep){ if(list && list.length) ctxList = list;
  else if(ep && !ctxList.find(e=>e.key===ep.key)) ctxList = [ep];
  ctxIdx = ep ? ctxList.findIndex(e=>e.key===ep.key) : -1; }
function currentCtxList(){ return ctxList; }
/* Continue Playing = the rest of the current context after the anchor episode,
   minus the playing episode and anything already sitting in the Queue. */
function continuePlayingList(){ if(ctxIdx<0 || !ctxList.length) return [];
  const qk = new Set(S.queue);
  return ctxList.slice(ctxIdx+1).filter(e=>e && e.audio && e.key!==(cur&&cur.key) && !qk.has(e.key)); }
function queuedEpisodes(){ const out = [];
  for(const k of S.queue){ const ep = S.snaps[k]; if(ep && ep.audio) out.push(ep); } return out; }
/* What plays after the current episode, in order: Queue first, then Continue Playing. */
function nextUpList(){ const seen = new Set([cur && cur.key]); const out = [];
  for(const ep of queuedEpisodes().concat(continuePlayingList())){ if(!seen.has(ep.key)){ seen.add(ep.key); out.push(ep); } }
  return out; }
function playEpisode(ep, opts){
  opts = opts||{};
  if(!ep) return;
  if(!ep.audio){ toast('This episode has no playable audio file.'); return; }
  regEp(ep); snap(ep);
  const same = cur && cur.key===ep.key && audio.src;
  const prevCtxIdx = ctxIdx;
  cur = ep; window.__cur = ep; setCtx(opts.context, ep);
  /* a queued episode stepping in shouldn't lose the show's place — when it ends,
     Continue Playing resumes right where the anchor episode left off */
  if(opts.keepCtx) ctxIdx = prevCtxIdx;
  LS.set('lastkey', ep.key);
  if(!same){ audio.src = ep.audio;
    const p = progOf(ep.key);
    pendingSeek = (!opts.fromStart && p && !p.done && !S.played[ep.key] && p.pos>5 && (!p.dur || p.pos/p.dur<0.97)) ? p.pos : 0; }
  else if(audio.ended){ try{ audio.currentTime = 0; }catch(e){} }
  audio.playbackRate = S.settings.speed||1;
  try{ audio.preservesPitch = true; }catch(e){}
  showMini(); updateNP(); updateMS(); updateTransport(); refreshRowStates();
  deliberatePause = false;
  const pr = audio.play();
  if(pr && pr.catch) pr.then(()=>hideNpErr()).catch(err=>onPlayRejected(err));
}
function onPlayRejected(err){ deliberatePause = true; updateTransport();
  if(err && err.name==='NotAllowedError') showNpErr('Tap play to start — your browser paused an automatic start.');
  else showNpErr('Playback couldn\u2019t start. Tap Retry, or check your connection.'); }
function userPlay(){ if(!cur) return; deliberatePause = false;
  const pr = audio.play(); if(pr && pr.catch) pr.then(()=>hideNpErr()).catch(err=>onPlayRejected(err)); }
function userPause(){ deliberatePause = true; resumeArm = null; saveProgress(); audio.pause(); }
function togglePlay(){ if(!cur) return; if(audio.paused || audio.ended) userPlay(); else userPause(); }
function skip(sec){ if(!cur) return; const d = audio.duration;
  if(!isFinite(d) || d<=0){ pendingSeek = Math.max(0, (pendingSeek||0) + sec); return; }
  let t = (audio.currentTime||0) + sec; if(t<0) t=0; if(t>d) t=d;
  try{ audio.currentTime = t; }catch(e){} updateNPTime(); }
function markDone(ep){ const p = progOf(ep.key)||{}; const dur = p.dur || ep.durSec || Math.floor(audio.duration||0);
  S.progress[ep.key] = { pos: dur, dur, done:true, updatedAt: Date.now() }; snap(ep); persist('progress','snaps'); }
function saveProgress(){ if(!cur) return;
  const dur = (isFinite(audio.duration)&&audio.duration>0) ? audio.duration : ((progOf(cur.key)||{}).dur || cur.durSec || 0);
  const pos = isFinite(audio.currentTime) ? audio.currentTime : 0;
  if(!dur && !pos) return;
  // a media element being torn down at page unload can read exactly 0 — never let that erase a real saved spot
  const prevP = progOf(cur.key);
  if(pos === 0 && prevP && prevP.pos > 5 && !audio.ended) return;
  const done = audio.ended || (dur>0 && pos/dur>0.985);
  S.progress[cur.key] = { pos: Math.floor(pos), dur: Math.floor(dur||0), done, updatedAt: Date.now() };
  snap(cur); LS.set('progress', S.progress); LS.set('snaps', S.snaps); }
function onEnded(){ if(!cur) return; markDone(cur); refreshRowStates();
  if(sleepMode==='episode'){ sleepMode='off'; updateSleepLbl(); toast('Sleep timer: stopped at the end of the episode'); updateTransport(); return; }
  if(S.queue.length){ const nk = S.queue.shift(); persist('queue'); updateQBadge();
    const nep = S.snaps[nk]; if(nep && nep.audio){ playEpisode(nep, {context: ctxList, keepCtx:true}); return; } }
  let ni = ctxIdx+1; while(ni<ctxList.length && ctxList[ni].key===cur.key) ni++;
  if(ctxIdx>=0 && ni<ctxList.length){ playEpisode(ctxList[ni], {context: ctxList}); return; }
  updateTransport(); }
function nextEp(){ if(S.queue.length){ const nk = S.queue.shift(); persist('queue'); updateQBadge();
    const nep = S.snaps[nk]; if(nep && nep.audio){ playEpisode(nep, {context: ctxList, keepCtx:true}); return; } }
  let ni = ctxIdx+1; while(ni<ctxList.length && cur && ctxList[ni].key===cur.key) ni++;
  if(ctxIdx>=0 && ni<ctxList.length) playEpisode(ctxList[ni], {context: ctxList}); }
function prevEp(){ if(audio.currentTime>3){ try{ audio.currentTime=0; }catch(e){} return; }
  if(ctxIdx>0) playEpisode(ctxList[ctxIdx-1], {context: ctxList}); else { try{ audio.currentTime=0; }catch(e){} } }
audio.addEventListener('loadedmetadata', ()=>{ if(pendingSeek){ try{ audio.currentTime = pendingSeek; }catch(e){} pendingSeek=0; } updateNPTime(); saveProgress(); });
audio.addEventListener('timeupdate', ()=>{ updateNPTime(); const n=Date.now(); if(n-lastProgSave>5000){ lastProgSave=n; saveProgress(); } });
audio.addEventListener('play', ()=>{ deliberatePause=false; resumeArm=null; updateTransport(); });
audio.addEventListener('pause', ()=>{ updateTransport(); saveProgress(); refreshRowStates();
  if(!deliberatePause && !audio.ended && cur && audio.currentTime>1){ resumeArm = {t: Date.now()}; resumeTries = 0; } });
audio.addEventListener('ended', onEnded);
audio.addEventListener('error', ()=>{ if(cur && audio.src) showNpErr('This episode\u2019s audio couldn\u2019t load.'); });
function tryResume(){ if(!resumeArm || !cur) return;
  if(Date.now()-resumeArm.t > 60*60*1000){ resumeArm=null; return; }
  if(!audio.paused){ resumeArm=null; return; }
  resumeTries++;
  const pr = audio.play(); if(pr && pr.then) pr.then(()=>{ resumeArm=null; }).catch(()=>{ if(resumeTries>6) resumeArm=null; }); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') tryResume(); else saveProgress(); });
window.addEventListener('focus', tryResume);
window.addEventListener('pageshow', tryResume);
window.addEventListener('pagehide', saveProgress);

/* ================= PLAYER UI ================= */
function showMini(){ if(!cur) return; $('#miniArt').src = cur.art||ART_PH; $('#miniTitle').textContent = cur.title;
  $('#miniShow').textContent = cur.showName||''; $('#mini').classList.add('on'); }
function updateTransport(){ const playing = !audio.paused && !audio.ended;
  $('#npPlay').innerHTML = icon(playing?'pause':'playBig');
  $('#miniPlay').innerHTML = icon(playing?'pause':'play');
  $('#np').classList.toggle('playing', playing); }
function refreshRowStates(){ if(!cur) return;
  $$('.ep-row').forEach(r=>{ if(r.dataset.rowkey===cur.key){ r.classList.add('playing');
    const ea = r.querySelector('.ea'); if(ea) ea.innerHTML = pillHTML(cur)
      + '<button class="dots" data-act="dots" data-key="'+cur.key+'" aria-label="Episode options">'+icon('dots')+'</button>'; } }); }
function showNpErr(msg){ $('#npErrTxt').textContent = msg; $('#npErr').classList.add('on'); }
function hideNpErr(){ $('#npErr').classList.remove('on'); }
$('#npRetry').addEventListener('click', ()=>{ if(!cur) return; hideNpErr();
  const pos = audio.currentTime||0; audio.src = cur.audio;
  const om = ()=>{ audio.removeEventListener('loadedmetadata', om); try{ audio.currentTime = pos; }catch(e){} userPlay(); };
  audio.addEventListener('loadedmetadata', om); });
function updateNP(){ if(!cur) return;
  $('#npArt').src = cur.art||ART_PH; $('#npBg').style.backgroundImage = cur.art? 'url("'+cur.art+'")':'none';
  $('#npDate').textContent = fmtDateLong(cur.date);
  $('#npTitle').textContent = cur.title; $('#npShow').textContent = cur.showName||'';
  $('#npSpeed').childNodes[0].textContent = (S.settings.speed||1)+'×';
  /* WORDS button is honest about availability before it's ever tapped */
  $('#npWordsBtn').classList.toggle('off', !cur.transcript);
  wordsOn = false; wordsCues = null; wordsForKey = null;
  $('#npWords').classList.remove('on'); $('#npWordsBtn').classList.remove('on');
  updateDeck();
  updateNPTime(); }
/* On-deck strip: playing episode highlighted, next two up beside/under it. */
function updateDeck(){ if(!cur) return;
  $('#deckArt').src = cur.art||ART_PH;
  $('#deckTitle').textContent = cur.title;
  $('#deckShow').textContent = cur.showName||'';
  const next = nextUpList().slice(0,2);
  $('#deckNext').innerHTML = next.map((ep,i)=>'<div class="deck-chip"><img src="'+esc(ep.art||ART_PH)+'" alt=""><div class="dc-m"><div class="dc-l">'+(i===0?'UP NEXT':'THEN')+'</div><div class="dc-t">'+esc(ep.title)+'</div></div></div>').join('');
  $('#deckNext').style.display = next.length? 'flex':'none'; }
function npDur(){ const d = audio.duration; if(isFinite(d)&&d>0) return d;
  const p = progOf(cur&&cur.key); return (p&&p.dur) || (cur&&cur.durSec) || 0; }
function updateNPTime(){ if(!cur) return; const dur = npDur(), pos = audio.currentTime||0;
  if(!dragging && dur>0){ const pct = Math.min(100, pos/dur*100);
    $('#seekFill').style.width = pct+'%'; $('#seekKnob').style.left = pct+'%';
    $('#seekTrack').setAttribute('aria-valuenow', Math.round(pct)); }
  $('#tElapsed').textContent = fmtClock(pos);
  $('#tRemain').textContent = '−'+fmtClock(Math.max(0, dur-pos));
  $('#miniProg').style.width = dur>0 ? Math.min(100, pos/dur*100)+'%' : '0%';
  if(wordsOn) syncWords(pos); }
const seekTrack = $('#seekTrack');
function seekRatio(e){ const r = seekTrack.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)); }
function previewSeek(r){ const dur = npDur(); $('#seekFill').style.width = (r*100)+'%'; $('#seekKnob').style.left = (r*100)+'%';
  $('#tElapsed').textContent = fmtClock(r*dur); $('#tRemain').textContent = '−'+fmtClock(dur-r*dur); }
seekTrack.addEventListener('pointerdown', e=>{ if(!cur) return; dragging=true; seekTrack.classList.add('drag');
  seekTrack.setPointerCapture(e.pointerId); previewSeek(seekRatio(e)); });
seekTrack.addEventListener('pointermove', e=>{ if(dragging) previewSeek(seekRatio(e)); });
seekTrack.addEventListener('pointerup', e=>{ if(!dragging) return; dragging=false; seekTrack.classList.remove('drag');
  const d = audio.duration; if(isFinite(d)&&d>0){ try{ audio.currentTime = seekRatio(e)*d; }catch(err){} saveProgress(); } updateNPTime(); });
seekTrack.addEventListener('keydown', e=>{ if(e.key==='ArrowLeft'){ skip(-15); e.preventDefault(); } if(e.key==='ArrowRight'){ skip(15); e.preventDefault(); } });
$('#npPlay').addEventListener('click', togglePlay);
$('#npBack15').addEventListener('click', ()=>skip(-15));
$('#npFwd15').addEventListener('click', ()=>skip(15));
$('#miniPlay').addEventListener('click', e=>{ e.stopPropagation(); togglePlay(); });
$('#miniFwd').addEventListener('click', e=>{ e.stopPropagation(); skip(15); });
$('#mini').addEventListener('click', e=>{ if(e.target.closest('button')) return; openNP(); });
$('#npClose').addEventListener('click', closeNP);
$('#npShow').addEventListener('click', ()=>{ if(cur){ closeNP(); openShowPage(showForEp(cur)); } });
$('#npDots').addEventListener('click', ()=>{ if(cur) openEpMenu(cur); });
$('#npDeck').addEventListener('click', ()=>{ closeNP(); openQueuePage(); });
$('#npDeck').addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); closeNP(); openQueuePage(); } });
$('#npVol').addEventListener('input', e=>{ audio.volume = parseFloat(e.target.value); LS.set('vol', audio.volume); });
function openNP(){ if(!cur){ toast('Pick an episode first'); return; } updateNP(); $('#np').classList.add('on'); }
function closeNP(){ $('#np').classList.remove('on'); }

/* ================= SPEED (tap to cycle) & SLEEP MENU ================= */
const SPEED_CYCLE = [1, 1.5, 2];
function cycleSpeed(){ let i = SPEED_CYCLE.indexOf(S.settings.speed||1); i = (i+1)%SPEED_CYCLE.length;
  const v = SPEED_CYCLE[i]; S.settings.speed = v; persist('settings');
  audio.playbackRate = v; try{ audio.preservesPitch = true; }catch(e){}
  $('#npSpeed').childNodes[0].textContent = v+'×'; toast('Speed '+v+'×'); }
function openSleepMenu(){ window.__menuKind='sleep';
  window.__menuCur = sleepMode==='off' ? 'off' : (sleepMode==='episode' ? 'ep' : String(sleepMode));
  const opts = [['off','Off'],['5','5 minutes'],['10','10 minutes'],['15','15 minutes'],['30','30 minutes'],['45','45 minutes'],['60','60 minutes'],['ep','End of Episode']];
  openSheet('<div class="sh-head"><div><div class="t">Sleep Timer</div><div class="s">Playback pauses when the timer runs out</div></div></div>'
    + opts.map(([v,l])=>sheetItem('', l, v, 'menu-pick')).join('')); }
function pickMenu(val){ const kind = window.__menuKind; closeSheet();
  if(kind==='sleep') setSleep(val); }
$('#npSpeed').addEventListener('click', cycleSpeed);
$('#npSleep').addEventListener('click', openSleepMenu);
function stopSleepTick(){ if(sleepTick){ clearInterval(sleepTick); sleepTick = null; } }
function setSleep(val){ stopSleepTick();
  if(val==='off'){ sleepMode='off'; toast('Sleep timer off'); }
  else if(val==='ep'){ sleepMode='episode'; toast('Will stop at the end of this episode'); }
  else { sleepMode = parseInt(val,10); sleepEndsAt = Date.now()+sleepMode*60*1000;
    sleepTick = setInterval(()=>{ if(Date.now()>=sleepEndsAt){ stopSleepTick(); sleepMode='off'; updateSleepLbl();
      deliberatePause = true; resumeArm = null; audio.pause(); toast('Sleep timer — playback paused'); } else updateSleepLbl(); }, 1000);
    toast('Sleep timer: '+sleepMode+' minutes'); }
  updateSleepLbl(); }
function updateSleepLbl(){ const lbl = $('#npSleepLbl'); const b = $('#npSleep');
  if(sleepMode==='off'){ lbl.textContent='SLEEP'; b.style.color=''; }
  else if(sleepMode==='episode'){ lbl.textContent='EP END'; b.style.color='#e3b8ff'; }
  else { lbl.textContent = fmtClock(Math.max(0,(sleepEndsAt-Date.now())/1000)); b.style.color='#e3b8ff'; } }

/* ================= WORDS (transcripts) ================= */
let wordsOn = false, wordsCues = null, wordsForKey = null, wordsIdx = -1;
$('#npWordsBtn').addEventListener('click', toggleWords);
async function toggleWords(){ if(!cur) return; wordsOn = !wordsOn;
  $('#npWordsBtn').classList.toggle('on', wordsOn);
  const w = $('#npWords'); w.classList.toggle('on', wordsOn);
  if(!wordsOn) return;
  if(wordsForKey===cur.key && wordsCues!==null){ renderWords(); syncWords(audio.currentTime||0); return; }
  wordsForKey = cur.key; wordsCues = null; wordsIdx = -1;
  w.innerHTML = '<div class="wnone">Loading words…</div>';
  if(!cur.transcript){ wordsCues = []; renderWords(); return; }
  try{ const txt = await fetchText(cur.transcript); wordsCues = parseTranscript(txt); }
  catch(e){ wordsCues = []; }
  if(wordsForKey===cur.key && wordsOn){ renderWords(); syncWords(audio.currentTime||0); } }
function renderWords(){ const w = $('#npWords');
  if(!wordsCues || !wordsCues.length){ w.innerHTML = '<div class="wnone"><b style="color:#fff;font-size:16px">Words aren\u2019t published for this episode.</b><br><br>When a podcast includes a transcript, the words appear right here — on the artwork. This episode\u2019s publisher didn\u2019t include one, and we won\u2019t make words up.</div>'; return; }
  w.innerHTML = wordsCues.map((c,i)=>'<div class="wline" data-wi="'+i+'">'+esc(c.text)+'</div>').join('');
  w.querySelectorAll('.wline').forEach(n=>n.addEventListener('click', ()=>{
    const c = wordsCues[+n.dataset.wi];
    if(c && c.t>=0 && isFinite(audio.duration)){ try{ audio.currentTime = c.t; }catch(e){} syncWords(c.t); }
  })); }
function parseTranscript(txt){ const lines = String(txt).replace(/\r/g,'').split('\n'); const cues = [];
  let curT = -1; let buf = [];
  const flush = ()=>{ if(buf.length && curT>=0) cues.push({t:curT, text:buf.join(' ')}); buf = []; };
  for(const ln of lines){ if(ln.includes('-->')){ flush();
      const m = ln.match(/(\d+):(\d\d):(\d\d)[.,](\d{3})/) || ln.match(/(\d\d):(\d\d)[.,](\d{3})/);
      if(m) curT = m.length===5 ? (+m[1])*3600+(+m[2])*60+(+m[3]) : (+m[1])*60+(+m[2]);
      continue; }
    const s = ln.trim(); if(!s || s.startsWith('WEBVTT') || /^\d+$/.test(s)) continue; buf.push(s); }
  flush();
  if(cues.length) return cues;
  return String(txt).split(/\n\s*\n/).map(p=>p.replace(/<[^>]+>/g,'').trim()).filter(Boolean).map(p=>({t:-1, text:p})); }
function syncWords(pos){ if(!wordsCues || !wordsCues.length || wordsCues[0].t<0) return;
  let idx = -1; for(let i=0;i<wordsCues.length;i++){ if(wordsCues[i].t<=pos) idx=i; else break; }
  if(idx===wordsIdx || idx<0) return; wordsIdx = idx;
  const w = $('#npWords'); w.querySelectorAll('.wline.act').forEach(n=>n.classList.remove('act'));
  const node = w.querySelector('[data-wi="'+idx+'"]'); if(node){ node.classList.add('act'); node.scrollIntoView({block:'center', behavior:'smooth'}); } }

/* ================= MEDIA SESSION ================= */
function setupMS(){ if(!('mediaSession' in navigator)) return; const ms = navigator.mediaSession;
  try{
    ms.setActionHandler('play', userPlay); ms.setActionHandler('pause', userPause);
    ms.setActionHandler('seekbackward', e=>skip(-(e.seekOffset||15)));
    ms.setActionHandler('seekforward', e=>skip(e.seekOffset||30));
    ms.setActionHandler('seekto', e=>{ if(isFinite(e.seekTime)) { try{ audio.currentTime = e.seekTime; }catch(err){} } });
    ms.setActionHandler('previoustrack', prevEp); ms.setActionHandler('nexttrack', nextEp);
  }catch(e){} }
function updateMS(){ if(!('mediaSession' in navigator) || !cur) return;
  try{ navigator.mediaSession.metadata = new MediaMetadata({ title: cur.title, artist: cur.showName||'', album: 'Gary Podcasts',
    artwork: cur.art ? [{src: cur.art, sizes:'600x600'}] : [] }); }catch(e){} }

/* ================= INIT ================= */
function restore(){ const lk = LS.get('lastkey', null);
  if(lk && S.snaps[lk] && S.snaps[lk].audio){ cur = S.snaps[lk]; window.__cur = cur;
    const rp = progOf(cur.key);
    pendingSeek = (rp && !rp.done && rp.pos > 2) ? rp.pos : 0;
    audio.src = cur.audio; setCtx([cur], cur); showMini(); updateNP(); updateMS(); updateTransport(); } }
applyTheme();
const savedVol = LS.get('vol', 1); audio.volume = savedVol; $('#npVol').value = savedVol;
audio.playbackRate = S.settings.speed||1;
setupMS(); updateQBadge(); goTab('home'); restore();
</script>
