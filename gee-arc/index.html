<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#17102b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gee Arc" />
    <link rel="icon" href="data:," />
    <title>Gee Arc</title>
    <style>
      :root {
        --bg: #0d0918;
        --screen: #17102b;
        --screen2: #1f1540;
        --ink: #f2eefc;
        --dim: #a99fd0;
        --faint: #6f639f;
        --orange: #ff8a1e;
        --orange-hi: #ffa64d;
        --purple: #7a48be;
        --rowline: rgba(255, 255, 255, 0.07);
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(1100px 700px at 50% -10%, #2c1a56 0%, transparent 60%),
          radial-gradient(900px 600px at 85% 110%, #241147 0%, transparent 55%),
          var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ============ HANDHELD SHELL (wide screens) ============ */
      .shell {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .device {
        display: flex;
        align-items: stretch;
        gap: 0;
        width: 100%;
        height: 100%;
      }
      .grip { display: none; }
      .screen-wrap {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, var(--screen2), var(--screen) 22%);
        position: relative;
        overflow: hidden;
      }
      @media (min-width: 980px) {
        .shell { padding: 26px 10px; }
        .device {
          width: min(1060px, 97vw);
          height: min(880px, 94vh);
          background: linear-gradient(155deg, rgba(150, 100, 230, 0.5), rgba(96, 52, 168, 0.55) 45%, rgba(62, 30, 118, 0.6));
          border: 2px solid rgba(210, 180, 255, 0.35);
          border-radius: 64px;
          box-shadow: 0 40px 90px rgba(0, 0, 0, 0.65), inset 0 2px 0 rgba(255, 255, 255, 0.25), inset 0 -14px 34px rgba(20, 6, 48, 0.45);
          backdrop-filter: blur(6px);
          padding: 34px 12px 40px;
          position: relative;
        }
        .device::after {
          content: "GEE ARC";
          position: absolute;
          left: 0; right: 0; bottom: 9px;
          text-align: center;
          font-weight: 800;
          font-size: 13px;
          letter-spacing: 0.55em;
          text-indent: 0.55em;
          color: rgba(240, 228, 255, 0.5);
        }
        .grip {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 128px;
          flex: none;
          gap: 18px;
        }
        .screen-wrap {
          border-radius: 26px;
          border: 3px solid rgba(10, 4, 26, 0.85);
          box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06), inset 0 0 60px rgba(0, 0, 0, 0.45);
          height: auto;
        }
        /* decorative D-pad */
        .dpad { position: relative; width: 96px; height: 96px; opacity: 0.9; }
        .dpad::before, .dpad::after {
          content: "";
          position: absolute;
          background: linear-gradient(160deg, #2c1c52, #180d33);
          border: 1px solid rgba(220, 195, 255, 0.35);
          border-radius: 8px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .dpad::before { left: 31px; top: 0; width: 34px; height: 96px; }
        .dpad::after { left: 0; top: 31px; width: 96px; height: 34px; }
        .stick {
          width: 44px; height: 44px; border-radius: 50%;
          background: radial-gradient(circle at 35% 30%, #4b2f86, #1c1038 70%);
          border: 1px solid rgba(220, 195, 255, 0.3);
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .abxy { position: relative; width: 108px; height: 108px; }
        .abxy span {
          position: absolute;
          width: 40px; height: 40px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-weight: 800; font-size: 14px; color: #f4ecff;
          border: 1px solid rgba(255, 255, 255, 0.35);
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45), inset 0 2px 3px rgba(255, 255, 255, 0.35);
          text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .abxy .b-x { left: 34px; top: 0;    background: radial-gradient(circle at 35% 30%, #6d8dff, #2c46b8 75%); }
        .abxy .b-y { left: 0;   top: 34px;  background: radial-gradient(circle at 35% 30%, #57d98a, #1d8a47 75%); }
        .abxy .b-a { right: 0;  top: 34px;  background: radial-gradient(circle at 35% 30%, #ff7a6b, #c93a2a 75%); }
        .abxy .b-b { left: 34px; bottom: 0; background: radial-gradient(circle at 35% 30%, #ffd94d, #d99a12 75%); }
        .pill-btn {
          width: 52px; height: 14px; border-radius: 8px;
          background: linear-gradient(180deg, #3a2566, #1c1038);
          border: 1px solid rgba(220, 195, 255, 0.3);
          box-shadow: 0 3px 6px rgba(0, 0, 0, 0.45);
        }
        .grip-label { font-size: 10px; letter-spacing: 0.3em; color: rgba(240, 228, 255, 0.55); font-weight: 700; }
      }

      /* ============ SCREEN CHROME ============ */
      .topbar {
        flex: none;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        padding: calc(12px + var(--sat)) 18px 0;
      }
      .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
      .tab {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--faint);
        font: inherit;
        font-weight: 800;
        font-size: clamp(14px, 2.6vw, 19px);
        letter-spacing: 0.08em;
        padding: 8px 12px 10px;
        cursor: pointer;
        border-bottom: 4px solid transparent;
      }
      .tab.on { color: var(--ink); border-bottom-color: var(--orange); }
      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 10px;
        flex: none;
      }
      .clock {
        font-size: clamp(17px, 3vw, 22px);
        font-weight: 800;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .clock small { font-size: 0.62em; color: var(--dim); font-weight: 700; margin-left: 3px; }
      .battery { display: none; align-items: center; gap: 6px; }
      .battery.show { display: flex; }
      .battery .pct { font-size: 13px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
      .batt-body {
        width: 27px; height: 13px;
        border: 2px solid var(--dim);
        border-radius: 4px;
        position: relative;
      }
      .batt-body::after {
        content: "";
        position: absolute;
        right: -6px; top: 2.5px;
        width: 3px; height: 5px;
        background: var(--dim);
        border-radius: 0 2px 2px 0;
      }
      .batt-fill {
        position: absolute; inset: 1.5px auto 1.5px 1.5px;
        background: #57d98a;
        border-radius: 1.5px;
        max-width: calc(100% - 3px);
      }
      .batt-fill.low { background: #ff5a4d; }

      /* ============ PREVIEW STRIP ============ */
      .preview {
        flex: none;
        margin: 12px 14px 4px;
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        align-items: stretch;
        min-height: 74px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .preview .swatch {
        flex: none;
        width: 92px;
        position: relative;
      }
      .preview .swatch::after {
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.28), transparent 55%);
      }
      .preview .ptext {
        padding: 11px 14px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        min-width: 0;
      }
      .preview .pname {
        font-size: clamp(17px, 3.4vw, 22px);
        font-weight: 800;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .preview .pblurb {
        font-size: clamp(13px, 2.6vw, 15.5px);
        color: var(--dim);
        line-height: 1.3;
      }

      /* ============ LIST ============ */
      .list {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 8px 0 14px;
        scrollbar-width: none;
        touch-action: pan-y;
      }
      .list::-webkit-scrollbar { display: none; }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 15px 20px;
        cursor: pointer;
        border-bottom: 1px solid var(--rowline);
        color: var(--ink);
      }
      .row .gname {
        font-size: clamp(20px, 4.4vw, 27px);
        font-weight: 700;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      .tag {
        flex: none;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        padding: 4px 8px 3px;
        border-radius: 6px;
        border: 1.5px solid var(--faint);
        color: var(--dim);
      }
      .tag.FUN { border-color: #b06ee8; color: #cf9bf5; }
      .tag.RELAX { border-color: #3fa7a0; color: #7fd8d0; }
      .tag.LEARN { border-color: #c9a227; color: #ecd27a; }
      .row.sel {
        background: linear-gradient(180deg, var(--orange-hi), var(--orange));
        color: #22100a;
        border-bottom-color: transparent;
        box-shadow: 0 6px 18px rgba(255, 138, 30, 0.35);
      }
      .row.sel .gname { font-weight: 800; }
      .row.sel .tag { border-color: rgba(34, 16, 10, 0.55); color: #22100a; }
      .lane-head {
        padding: 20px 20px 8px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.3em;
        color: var(--faint);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .lane-head::after { content: ""; flex: 1; height: 1px; background: var(--rowline); }
      .lane-head:first-child { padding-top: 8px; }

      /* ============ FOOTER ============ */
      .footer {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px calc(12px + var(--sab));
        border-top: 1px solid var(--rowline);
        background: rgba(0, 0, 0, 0.25);
      }
      .hints {
        flex: 1;
        text-align: center;
        font-size: clamp(11px, 2.4vw, 14px);
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
      }
      .fbtn {
        appearance: none;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.1em;
        border-radius: 12px;
        padding: 13px 18px;
        font-size: clamp(14px, 3vw, 17px);
        cursor: pointer;
        flex: none;
      }
      .fbtn.random {
        background: transparent;
        color: var(--ink);
        border: 2px solid var(--purple);
      }
      .fbtn.random:active { background: rgba(122, 72, 190, 0.35); }
      .fbtn.launch {
        background: linear-gradient(180deg, var(--orange-hi), var(--orange));
        color: #22100a;
        border: 0;
        box-shadow: 0 5px 16px rgba(255, 138, 30, 0.4);
        padding: 13px 26px;
      }
      .fbtn.launch:active { transform: translateY(1px); }
      @media (max-width: 560px) {
        .hints { display: none; }
        .fbtn.random { flex: 1; }
        .fbtn.launch { flex: 1.4; }
      }

      /* ============ BOOT SPLASH ============ */
      .boot {
        position: fixed; inset: 0;
        background: #07040f;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        transition: opacity 0.45s ease;
        cursor: pointer;
      }
      .boot.hide { opacity: 0; pointer-events: none; }
      .boot .wordmark {
        font-size: clamp(52px, 13vw, 96px);
        font-weight: 900;
        letter-spacing: 0.06em;
        font-style: italic;
        color: var(--ink);
        text-shadow: 0 0 34px rgba(150, 100, 230, 0.8);
      }
      .boot .wordmark em { font-style: italic; color: var(--orange); }
      .boot .sub {
        font-size: clamp(12px, 2.6vw, 15px);
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        color: var(--faint);
        font-weight: 700;
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

      /* ============ RANDOM OVERLAY ============ */
      .slot {
        position: absolute; inset: 0;
        z-index: 30;
        background: rgba(7, 4, 15, 0.88);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .slot.show { display: flex; }
      .slot .slot-label {
        font-size: 13px; font-weight: 800; letter-spacing: 0.4em; text-indent: 0.4em; color: var(--faint);
      }
      .slot .slot-name {
        font-size: clamp(34px, 8.5vw, 58px);
        font-weight: 900;
        line-height: 1.1;
        color: var(--ink);
      }
      .slot.landed .slot-name { color: var(--orange); text-shadow: 0 0 30px rgba(255, 138, 30, 0.55); }

      .vignette {
        position: absolute; inset: 0;
        pointer-events: none;
        background: radial-gradient(120% 90% at 50% 45%, transparent 70%, rgba(0, 0, 0, 0.28));
        z-index: 5;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot .sub { animation: none; }
        .boot { transition: none; }
      }
    </style>
  </head>
  <body>
    <!-- BOOT -->
    <div class="boot" id="boot" role="presentation">
      <div class="wordmark">GEE <em>ARC</em></div>
      <div class="sub">POWERING ON</div>
    </div>

    <div class="shell">
      <div class="device">
        <div class="grip" aria-hidden="true">
          <div class="dpad"></div>
          <div class="stick"></div>
          <div class="pill-btn"></div>
          <div class="grip-label">SELECT</div>
        </div>

        <div class="screen-wrap" id="screenWrap">
          <div class="topbar">
            <nav class="tabs" aria-label="Shelves">
              <button class="tab on" data-shelf="fav" type="button">FAVORITES</button>
              <button class="tab" data-shelf="all" type="button">ALL GAMES</button>
              <button class="tab" data-shelf="lanes" type="button">LANES</button>
            </nav>
            <div class="status">
              <div class="battery" id="battery" aria-hidden="true">
                <span class="pct" id="battPct"></span>
                <span class="batt-body"><span class="batt-fill" id="battFill"></span></span>
              </div>
              <div class="clock" id="clock">--:--</div>
            </div>
          </div>

          <div class="preview" id="preview">
            <div class="swatch" id="pSwatch"></div>
            <div class="ptext">
              <div class="pname" id="pName">—</div>
              <div class="pblurb" id="pBlurb">—</div>
            </div>
          </div>

          <div class="list" id="list" role="listbox" aria-label="Games"></div>

          <div class="footer">
            <button class="fbtn random" id="btnRandom" type="button">RANDOM</button>
            <div class="hints">&#9664; &#9654; MOVE &middot; TAP / ENTER LAUNCH &middot; R = RANDOM</div>
            <button class="fbtn launch" id="btnLaunch" type="button">LAUNCH &#9654;</button>
          </div>

          <div class="slot" id="slot">
            <div class="slot-label">RANDOM PICK</div>
            <div class="slot-name" id="slotName">?</div>
          </div>

          <div class="vignette"></div>
        </div>

        <div class="grip" aria-hidden="true">
          <div class="abxy">
            <span class="b-x">X</span><span class="b-y">Y</span><span class="b-a">A</span><span class="b-b">B</span>
          </div>
          <div class="pill-btn"></div>
          <div class="grip-label">START</div>
        </div>
      </div>
    </div>

    <script>
      "use strict";
      var BASE = "https://geemondc.github.io/";
      // name, path, lane, accent, blurb
      var G = [
        ["After Burner", "after-burner-reborn/", "FUN", "#4da3ff", "The original jet blast — speed is the whole sky."],
        ["After Burner II", "after-burner-ii-reborn/", "FUN", "#2f7fe0", "F-14 at full throttle: lock on, roll, burn."],
        ["Arkanoid Reborn", "arkanoid-reborn/", "FUN", "#37d0e0", "Paddle, ball, bricks — break them all."],
        ["Asteroids Deluxe", "asteroids-deluxe-reborn/", "FUN", "#c8ccd4", "Blast the rocks. Mind the saucers."],
        ["Backgammon", "future-ready-backgammon/", "LEARN", "#c98d4b", "Race your checkers home and bear off first."],
        ["Blip", "blip/", "FUN", "#ff5a4d", "The tiny handheld pong that started it all."],
        ["Block-Off Boxing", "block-off-boxing/", "FUN", "#e0564b", "Block, jab, and time the counter."],
        ["Boardwalk Defense", "boardwalk-defense/", "FUN", "#7a5af5", "Hold the boardwalk line against the swarm."],
        ["Darts Reborn", "darts-reborn/", "FUN", "#3fae62", "Step up to the oche — three darts, steady hand."],

        ["Dragon Garden", "dragon-garden/", "RELAX", "#e0567a", "A quiet garden where a dragon tends the blooms."],
        ["Face Drop", "face-drop/", "FUN", "#ffb02e", "Catch the falling faces — don't drop the grin."],
        ["Frogger Reborn", "frogger-reborn/", "FUN", "#52c256", "Dodge the traffic, ride the logs, get home."],

        ["Garage Ping Pong", "garage-ping-pong/", "FUN", "#e07840", "Back to the childhood garage — paddle up."],

        ["Lava Lamp", "lava-lamp/", "RELAX", "#ff7a45", "Slow blobs, warm glow. Pure sit-and-watch."],
        ["Light Bright", "light-bright-reborn/", "RELAX", "#f2e14c", "Peg by peg, light up your own picture."],
        ["Marble Royale", "marble-royale-reborn/", "FUN", "#e84e7a", "Pick, bet, watch — ten marbles, one winner."],
        ["Mattel Auto Race", "mattel-auto-race/", "FUN", "#ff4d4d", "Dodge traffic on the little red LED road."],
        ["Mattel Baseball", "mattel-baseball/", "FUN", "#ff6b5e", "LED diamond classic — pitch, swing, run."],
        ["Mattel Basketball", "mattel-basketball/", "FUN", "#ff7a59", "Two minutes, LED court, beat the buzzer."],
        ["Mattel Bowling", "mattel-bowling/", "FUN", "#e85d75", "Line it up, roll it straight, pick the spare."],
        ["Mattel Football", "mattel-football/", "FUN", "#ff5347", "The 1977 pocket classic. Run for daylight."],
        ["Mattel Ski Slalom", "mattel-ski-slalom/", "FUN", "#ff6a5e", "Thread the gates on the glowing slope."],
        ["Merlin", "merlin/", "LEARN", "#d94f4f", "The wizard's games of memory and music."],
        ["Origami Master", "origami-master/", "RELAX", "#f0ead8", "Fold along with the master, step by step."],
        ["Pay Roulette", "pay-roulette/", "FUN", "#ff3d71", "Everyone taps — one finger pays. You win, you pay!"],
        ["Pineapple OFC Poker", "pineapple-ofc/", "LEARN", "#ffd23f", "Set your rows, chase the royalties."],
        ["Qix", "qix/", "FUN", "#37e0c8", "Box off the board while the spark hunts you."],
        ["Simon", "simon/", "LEARN", "#57d98a", "Watch, listen, repeat — how long can you last?"],
        ["Sky Diver Reborn", "sky-diver-reborn/", "FUN", "#6ec6ff", "Pull the cord late. Land on the target."],
        ["Sky Drifter", "sky-drifter/", "RELAX", "#ff9a5c", "You ARE the flyer. No score — just the sky."],
        ["Space Harrier", "space-harrier-reborn/", "FUN", "#ff8ac2", "Welcome to the Fantasy Zone — run and gun."],
        ["Speak & Spell", "speak-spell/", "LEARN", "#ffcf3f", "The talking teacher — spell it right."],
        ["Star Castle", "star-castle-reborn/", "FUN", "#ffe14d", "Crack the rings, kill the castle — bounce off the shield."],
        ["Tempest", "tempest-reborn/", "FUN", "#4dd7ff", "Ride the web's rim and blast what's climbing."],
        ["Tetris", "tetris-reborn/", "LEARN", "#b06ee8", "Stack clean, think ahead, don't lose your head."],
        ["Trainer Tetris", "trainer-tetris/", "LEARN", "#7a5af5", "Tetris with a coach — learn the real strategies."],
        ["Trench Run", "trench-run-reborn/", "FUN", "#8fd0ff", "Down the trench — one torpedo, one shot."]
      ];
      var byName = {};
      G.forEach(function (g) { byName[g[0]] = { name: g[0], url: BASE + g[1], lane: g[2], color: g[3], blurb: g[4] }; });

      var FAVORITES = ["Sky Drifter", "Pay Roulette", "Marble Royale", "Tetris", "Trainer Tetris",
        "Face Drop", "Iron Orbit", "Heads-Up Spades", "Tempest", "Star Castle", "Kaboom Reborn",
        "Frogger Reborn", "Sky Diver Reborn", "Asteroids Deluxe", "Arkanoid Reborn", "Galaga Reborn",
        "Dig Dug Reborn", "Qix", "Gyruss", "After Burner II", "Trench Run", "Dragon Garden"];
      var RELAX = ["Sky Drifter", "Dragon Garden", "Lava Lamp", "Light Bright", "Origami Master"];
      var LEARN = ["Tetris", "Trainer Tetris", "Simon", "Merlin", "Speak & Spell", "Pineapple OFC Poker", "Backgammon", "Dominoes"];
      var ALL = G.map(function (g) { return g[0]; }).sort(function (a, b) { return a < b ? -1 : 1; });
      var FUN = ALL.filter(function (n) { return RELAX.indexOf(n) < 0 && LEARN.indexOf(n) < 0; });

      // Each shelf = flat entries: {h:"LABEL"} headers or {g:game}
      var SHELVES = {
        fav: FAVORITES.map(function (n) { return { g: byName[n] }; }),
        all: ALL.map(function (n) { return { g: byName[n] }; }),
        lanes: [{ h: "FUN" }].concat(
          FUN.map(function (n) { return { g: byName[n] }; }),
          [{ h: "RELAX" }],
          RELAX.map(function (n) { return { g: byName[n] }; }),
          [{ h: "LEARN" }],
          LEARN.map(function (n) { return { g: byName[n] }; })
        )
      };

      var listEl = document.getElementById("list");
      var pName = document.getElementById("pName");
      var pBlurb = document.getElementById("pBlurb");
      var pSwatch = document.getElementById("pSwatch");
      var slotEl = document.getElementById("slot");
      var slotName = document.getElementById("slotName");

      var shelf = "fav";
      var selIdx = { fav: 0, all: 0, lanes: 1 }; // lanes: first entry is a header
      var rowEls = [];

      /* ---------- audio (SFX only; created on first interaction) ---------- */
      var actx = null;
      function audio() {
        if (!actx) {
          try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
        }
        if (actx && actx.state === "suspended") { actx.resume(); }
        return actx;
      }
      function tone(freq, dur, type, gain, when) {
        var ac = audio(); if (!ac) return;
        var t = ac.currentTime + (when || 0);
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(gain || 0.04, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + dur + 0.02);
      }
      function blip() { tone(660, 0.06, "square", 0.035); }
      function tabBlip() { tone(440, 0.06, "square", 0.035); tone(660, 0.07, "square", 0.03, 0.05); }
      function launchSfx() { tone(523, 0.09, "square", 0.05); tone(784, 0.1, "square", 0.05, 0.08); tone(1047, 0.16, "square", 0.05, 0.16); }
      function tickSfx() { tone(1200, 0.03, "square", 0.025); }
      window.addEventListener("pointerdown", function () { audio(); }, { passive: true });
      window.addEventListener("keydown", function () { audio(); });

      /* ---------- rendering ---------- */
      function entries() { return SHELVES[shelf]; }
      function selectedGame() {
        var e = entries()[selIdx[shelf]];
        return e && e.g ? e.g : null;
      }
      function render() {
        listEl.innerHTML = "";
        rowEls = [];
        entries().forEach(function (e, i) {
          if (e.h) {
            var h = document.createElement("div");
            h.className = "lane-head";
            h.textContent = e.h;
            listEl.appendChild(h);
            rowEls.push(null);
            return;
          }
          var r = document.createElement("div");
          r.className = "row" + (i === selIdx[shelf] ? " sel" : "");
          r.setAttribute("role", "option");
          r.setAttribute("aria-selected", i === selIdx[shelf] ? "true" : "false");
          var nm = document.createElement("span");
          nm.className = "gname";
          nm.textContent = e.g.name;
          var tg = document.createElement("span");
          tg.className = "tag " + e.g.lane;
          tg.textContent = e.g.lane;
          r.appendChild(nm); r.appendChild(tg);
          r.addEventListener("mouseenter", function () { if (selIdx[shelf] !== i) { select(i, false); } });
          r.addEventListener("click", function () {
            if (selIdx[shelf] === i) { launch(e.g); }
            else { select(i, true); }
          });
          listEl.appendChild(r);
          rowEls.push(r);
        });
        updatePreview();
        keepVisible(false);
      }
      function updatePreview() {
        var g = selectedGame(); if (!g) return;
        pName.textContent = g.name;
        pBlurb.textContent = g.blurb;
        pSwatch.style.background = "linear-gradient(150deg, " + g.color + ", " + shade(g.color, -45) + ")";
      }
      function shade(hex, amt) {
        var n = parseInt(hex.slice(1), 16);
        var r = Math.max(0, Math.min(255, (n >> 16) + amt));
        var gg = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
        var b = Math.max(0, Math.min(255, (n & 255) + amt));
        return "rgb(" + r + "," + gg + "," + b + ")";
      }
      function keepVisible(smooth) {
        var el = rowEls[selIdx[shelf]];
        if (el) { el.scrollIntoView({ block: "nearest", behavior: smooth ? "smooth" : "auto" }); }
      }
      function select(i, sound) {
        var list = entries();
        if (i < 0 || i >= list.length || !list[i].g) return;
        var prev = rowEls[selIdx[shelf]];
        if (prev) { prev.classList.remove("sel"); prev.setAttribute("aria-selected", "false"); }
        selIdx[shelf] = i;
        var cur = rowEls[i];
        if (cur) { cur.classList.add("sel"); cur.setAttribute("aria-selected", "true"); }
        updatePreview();
        keepVisible(true);
        if (sound) blip();
      }
      function move(d) {
        var list = entries();
        var i = selIdx[shelf];
        do { i += d; } while (i >= 0 && i < list.length && !list[i].g);
        if (i < 0 || i >= list.length) return;
        select(i, true);
      }
      function switchShelf(name) {
        if (name === shelf || !SHELVES[name]) return;
        shelf = name;
        var tabs = document.querySelectorAll(".tab");
        for (var k = 0; k < tabs.length; k++) {
          tabs[k].classList.toggle("on", tabs[k].getAttribute("data-shelf") === name);
        }
        tabBlip();
        render();
      }
      function launch(g) {
        if (!g) return;
        launchSfx();
        setTimeout(function () { window.location.href = g.url; }, 240);
      }

      /* ---------- random ---------- */
      var spinning = false;
      function randomPick() {
        if (spinning) return;
        spinning = true;
        slotEl.classList.add("show");
        slotEl.classList.remove("landed");
        var pool = ALL.map(function (n) { return byName[n]; });
        var start = Date.now(), dur = 1050;
        var finalGame = pool[Math.floor(Math.random() * pool.length)];
        function frame() {
          var t = Date.now() - start;
          var g = pool[Math.floor(Math.random() * pool.length)];
          slotName.textContent = g.name;
          slotName.style.color = g.color;
          tickSfx();
          if (t < dur) {
            var p = t / dur;
            setTimeout(frame, 45 + p * p * 170);
          } else {
            slotName.textContent = finalGame.name;
            slotName.style.color = "";
            slotEl.classList.add("landed");
            launchSfx();
            setTimeout(function () { window.location.href = finalGame.url; }, 420);
          }
        }
        frame();
      }

      /* ---------- controls ---------- */
      var tabs = document.querySelectorAll(".tab");
      for (var k = 0; k < tabs.length; k++) {
        (function (tab) {
          tab.addEventListener("click", function () { switchShelf(tab.getAttribute("data-shelf")); });
        })(tabs[k]);
      }
      document.getElementById("btnLaunch").addEventListener("click", function () { launch(selectedGame()); });
      document.getElementById("btnRandom").addEventListener("click", randomPick);

      document.addEventListener("keydown", function (ev) {
        if (spinning) return;
        if (ev.key === "ArrowDown") { ev.preventDefault(); move(1); }
        else if (ev.key === "ArrowUp") { ev.preventDefault(); move(-1); }
        else if (ev.key === "PageDown") { ev.preventDefault(); for (var a = 0; a < 6; a++) move(1); }
        else if (ev.key === "PageUp") { ev.preventDefault(); for (var b = 0; b < 6; b++) move(-1); }
        else if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); launch(selectedGame()); }
        else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
          ev.preventDefault();
          var order = ["fav", "all", "lanes"];
          var i = order.indexOf(shelf) + (ev.key === "ArrowRight" ? 1 : -1);
          if (i >= 0 && i < order.length) switchShelf(order[i]);
        }
        else if (ev.key === "r" || ev.key === "R") { randomPick(); }
      });

      // side-swipe to switch shelves
      var tx = 0, ty = 0, tOn = false;
      var wrap = document.getElementById("screenWrap");
      wrap.addEventListener("touchstart", function (ev) {
        var t = ev.changedTouches[0]; tx = t.clientX; ty = t.clientY; tOn = true;
      }, { passive: true });
      wrap.addEventListener("touchend", function (ev) {
        if (!tOn) return; tOn = false;
        var t = ev.changedTouches[0];
        var dx = t.clientX - tx, dy = t.clientY - ty;
        if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
          var order = ["fav", "all", "lanes"];
          var i = order.indexOf(shelf) + (dx < 0 ? 1 : -1);
          if (i >= 0 && i < order.length) switchShelf(order[i]);
        }
      }, { passive: true });

      /* ---------- clock ---------- */
      var clockEl = document.getElementById("clock");
      function clockTick() {
        var d = new Date();
        var h = d.getHours(), m = d.getMinutes();
        var ap = h >= 12 ? "PM" : "AM";
        h = h % 12; if (h === 0) h = 12;
        clockEl.innerHTML = h + ":" + (m < 10 ? "0" : "") + m + "<small>" + ap + "</small>";
      }
      clockTick();
      setInterval(clockTick, 1000);

      /* ---------- battery ---------- */
      if (navigator.getBattery) {
        navigator.getBattery().then(function (b) {
          var box = document.getElementById("battery");
          var pct = document.getElementById("battPct");
          var fill = document.getElementById("battFill");
          function upd() {
            var p = Math.round(b.level * 100);
            box.classList.add("show");
            pct.textContent = p + "%";
            pct.style.color = b.charging ? "#57d98a" : "";
            fill.style.width = p + "%";
            fill.classList.toggle("low", p <= 20 && !b.charging);
          }
          upd();
          b.addEventListener("levelchange", upd);
          b.addEventListener("chargingchange", upd);
        }).catch(function () { /* battery readout unavailable — omitted */ });
      }

      /* ---------- boot ---------- */
      render();
      var boot = document.getElementById("boot");
      var bootGone = false;
      function endBoot() {
        if (bootGone) return;
        bootGone = true;
        boot.classList.add("hide");
        setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 550);
      }
      setTimeout(endBoot, 1200);
      boot.addEventListener("click", endBoot);
      boot.addEventListener("touchstart", endBoot, { passive: true });
    </script>
  </body>
</html>
