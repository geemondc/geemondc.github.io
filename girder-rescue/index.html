<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Girder Rescue</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;color:#fff;font-family:ui-monospace,Menlo,monospace;overflow:hidden;height:100dvh}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#wrap{position:relative;width:min(100vw,560px);margin:0 auto}
canvas{width:100%;height:auto;display:block;image-rendering:auto;touch-action:none;background:#000}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:30}
article{max-width:410px;background:#121426;border:2px solid #f34a78;text-align:center;padding:26px;margin:20px;border-radius:10px;box-shadow:0 0 44px rgba(243,74,120,.35)}
article h1{margin:0 0 6px;font-size:30px;letter-spacing:.12em;color:#ffd7e6;text-shadow:0 0 14px rgba(243,74,120,.8)}
article p{line-height:1.6;color:#c7cbea;font-size:14px}
button{background:#222844;color:#fff;border:2px solid #72d5ec;padding:14px 22px;font:inherit;touch-action:none;border-radius:8px;cursor:pointer}
#go{font-size:18px;letter-spacing:.1em;background:#3d0f22;border-color:#f34a78}
#ctl{position:fixed;left:0;right:0;bottom:0;height:118px;display:none;z-index:20;pointer-events:none}
body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
@media(pointer:coarse){#ctl{display:block}}
#stick{position:absolute;left:22px;bottom:14px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#2a3358,#141a30 70%);border:2px solid rgba(140,180,255,.55);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#9fd8ff,#3f7fd0 55%,#1d3f74);box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 -4px 8px rgba(0,0,0,.35)}
#jumpBtn{position:absolute;right:22px;bottom:18px;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 42% 34%,#ff8f6b,#e2483d 58%,#8f1f1f);border:2px solid rgba(255,190,160,.7);color:#fff;font-weight:800;letter-spacing:.08em;font-size:15px;pointer-events:auto;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.6)}
#jumpBtn:active{filter:brightness(1.35)}
#pauseBtn{position:absolute;left:50%;bottom:44px;margin-left:-21px;width:42px;height:42px;border-radius:50%;background:#172343cc;border:2px solid rgba(140,180,255,.5);color:#dceaff;font-size:15px;pointer-events:auto;touch-action:none}
</style></head><body>
<div id="wrap"><canvas id="c" width="600" height="720" aria-label="Girder Rescue — a barrel-and-girders rescue game"></canvas></div>
<div id="ctl"><div id="stick"><div id="knob"></div></div><button id="jumpBtn">JUMP</button></div>
<div id="overlay"><article><h1 id="title">GIRDER RESCUE</h1><p id="msg">The ape has her at the top. Climb the girders, leap the barrels, pull the rivets, ride the elevators — rescue her on all four boards.<br><br>🕹️ Flight stick: move &amp; climb · JUMP button: leap<br>Keyboard: Arrows / WASD + Space · P pauses<br>Grab a hammer to smash barrels. Three lives.</p><button id="go">START GAME</button></article></div>
<script>
'use strict';
const cv=document.querySelector('#c'), g=cv.getContext('2d'), $=s=>document.querySelector(s); g.imageSmoothingEnabled=false;
const keys=new Set();
let mode='menu', score=0, lives=3, best=0, level=1, boardIdx=0, bonus=5000, bonusT=0,
    player=null, barrels=[], fires=[], parts=[], sparks=[], hammerT=0, hammersLeft=[],
    spawnT=1.2, clock=0, last=0, acc=0, interT=0, clearT=0, apeFall=0, extraGiven=false, fireSpawnT=6;
try{ best=+localStorage.getItem('girder-best')||0 }catch(e){}
const BOARDS=['BARRELS','RIVETS','ELEVATORS','PIE FACTORY'];
const HEIGHTS=['25 m','50 m','75 m','100 m'];
let B=null; // current board def

/* ---------- geometry helpers ---------- */
function surfY(p,x){ return p.y1 + (p.y2-p.y1)*((x-p.x1)/((p.x2-p.x1)||1)); }
function onPlat(p,x){ return x>=Math.min(p.x1,p.x2)-4 && x<=Math.max(p.x1,p.x2)+4; }

/* ---------- boards ---------- */
function boardBarrels(){
  const P=[
    {x1:26,y1:664,x2:574,y2:640},   // 0 bottom
    {x1:30,y1:534,x2:500,y2:558},   // 1
    {x1:100,y1:450,x2:570,y2:426},  // 2
    {x1:30,y1:342,x2:500,y2:366},   // 3
    {x1:100,y1:258,x2:570,y2:234},  // 4
    {x1:30,y1:166,x2:500,y2:178},   // 5 ape girder
    {x1:318,y1:94,x2:452,y2:94},     // 6 girl platform (center-top, twin ladders)
  ];
  const L=[ {x:452,lo:0,hi:1},{x:150,lo:0,hi:1},{x:330,lo:1,hi:2},{x:480,lo:1,hi:2},
            {x:190,lo:2,hi:3},{x:430,lo:2,hi:3},{x:120,lo:3,hi:4},{x:352,lo:3,hi:4},
            {x:262,lo:4,hi:5},{x:452,lo:4,hi:5},{x:352,lo:5,hi:6},{x:428,lo:5,hi:6} ];
  return { name:'BARRELS', plats:P, ladders:L, palette:'pink', ladderCol:'cyan',
    start:{x:520,p:0}, ape:{x:118,p:5}, girl:{x:404,p:6}, oil:{x:52,p:0},
    stubs:[{x:330,p:1},{x:215,p:2},{x:300,p:3},{x:262,p:0},{x:520,p:2,up:1},{x:150,p:3,up:1}],
    hammers:[{x:210,p:2},{x:430,p:4}], prizes:[] };
}
function boardRivets(){
  const P=[ {x1:60,y1:668,x2:540,y2:668},   // 0 widest
            {x1:88,y1:562,x2:512,y2:562},   // 1
            {x1:116,y1:456,x2:484,y2:456},  // 2
            {x1:146,y1:350,x2:454,y2:350},  // 3 ape stands here
            {x1:196,y1:244,x2:404,y2:244} ];// 4 girl on top — held up by cyan posts
  const L=[ {x:110,lo:0,hi:1},{x:300,lo:0,hi:1},{x:490,lo:0,hi:1},
            {x:180,lo:1,hi:2},{x:420,lo:1,hi:2},
            {x:140,lo:2,hi:3},{x:300,lo:2,hi:3},{x:440,lo:2,hi:3} ];
  const R=[]; [0,1,2,3].forEach(p=>{ R.push({p,x:205,got:false}); R.push({p,x:395,got:false}); });
  return { name:'RIVETS', plats:P, ladders:L, palette:'blue', ladderCol:'yellow',
    start:{x:90,p:0}, ape:{x:300,p:3}, girl:{x:336,p:4}, oil:null,
    posts:[250,350], hammers:[], rivets:R,
    prizes:[{x:150,p:2,kind:'umbrella'},{x:430,p:0,kind:'purse'}] };
}
function boardElevators(){
  const P=[
    {x1:26,y1:668,x2:574,y2:668},   // 0 bottom
    {x1:26,y1:548,x2:180,y2:548},   // 1 left-mid
    {x1:420,y1:548,x2:574,y2:548},  // 2 right-mid
    {x1:246,y1:492,x2:354,y2:492},  // 3 center perch
    {x1:26,y1:428,x2:180,y2:428},   // 4 left-high
    {x1:420,y1:428,x2:574,y2:428},  // 5 right-high
    {x1:26,y1:288,x2:574,y2:288},   // 6 top girder (ape + springs)
    {x1:330,y1:196,x2:520,y2:196},  // 7 girl platform
  ];
  const L=[ {x:140,lo:4,hi:6},{x:470,lo:5,hi:6},{x:392,lo:6,hi:7},{x:472,lo:6,hi:7} ];
  return { name:'ELEVATORS', plats:P, ladders:L, palette:'pink', ladderCol:'cyan',
    start:{x:66,p:0}, ape:{x:92,p:6}, girl:{x:452,p:7}, oil:null, hammers:[],
    prizes:[{x:300,p:3,kind:'hat'}],
    lifts:[ {x:196,w:40,yMin:428,yMax:668,y:668,dir:-1,sp:52},
            {x:364,w:40,yMin:428,yMax:668,y:428,dir:1,sp:52} ],
    springs:[ {x:250,vx:88}, {x:430,vx:-104} ] };
}
function boardPie(){
  const P=[
    {x1:26,y1:668,x2:574,y2:640},
    {x1:26,y1:556,x2:574,y2:584},
    {x1:26,y1:472,x2:574,y2:444},
    {x1:26,y1:360,x2:574,y2:388},
    {x1:26,y1:276,x2:574,y2:248,belt:-1},  // conveyor (pushes left)
    {x1:26,y1:164,x2:470,y2:180,belt:1},   // conveyor (pushes right)
    {x1:330,y1:96,x2:520,y2:96},
  ];
  const L=[ {x:486,lo:0,hi:1},{x:120,lo:0,hi:1},{x:330,lo:1,hi:2},{x:520,lo:1,hi:2},
            {x:180,lo:2,hi:3},{x:452,lo:2,hi:3},{x:96,lo:3,hi:4},{x:368,lo:3,hi:4},
            {x:250,lo:4,hi:5},{x:432,lo:4,hi:5},{x:392,lo:5,hi:6},{x:470,lo:5,hi:6} ];
  return { name:'PIE FACTORY', plats:P, ladders:L, palette:'pink', ladderCol:'cyan',
    start:{x:88,p:0}, ape:{x:96,p:5}, girl:{x:452,p:6}, oil:{x:52,p:0},
    hammers:[{x:390,p:2}], prizes:[{x:150,p:1,kind:'purse'}], tubs:true };
}
const BUILDERS=[boardBarrels, boardRivets, boardElevators, boardPie];

/* ---------- game flow ---------- */
function record(){ best=Math.max(best,score); try{ localStorage.setItem('girder-best',best) }catch(e){} }
function setupBoard(){
  B=BUILDERS[boardIdx]();
  barrels=[]; fires=[]; parts=[]; sparks=[]; hammerT=0; fireSpawnT=5;
  hammersLeft = (B.hammers||[]).map(h=>({...h, got:false}));
  if (B.name==='RIVETS'){ // firefoxes roam from the start
    fires.push(mkFire(0,470,1), mkFire(2,140,-1));
  }
  bonus=5000; bonusT=0; spawnT=1.4; apeFall=0;
  spawnPlayer();
}
function spawnPlayer(){
  player={ x:B.start.x, y:surfY(B.plats[B.start.p],B.start.x), vx:0, vy:0, p:B.start.p, on:true, climb:null, inv:2, face:1, lift:null };
  keys.clear();
}
function mkFire(p,x,dir){ return { x, y:surfY(B.plats[p],x), p, dir:dir||1, climb:null, ct:2+Math.random()*3 }; }
function init(){ score=0; lives=3; level=1; boardIdx=0; extraGiven=false; setupBoard(); mode='play'; $('#overlay').style.display='none'; }
function modal(t,m,b){ $('#title').textContent=t; $('#msg').innerHTML=m; $('#go').textContent=b; $('#overlay').style.display='grid'; }
$('#go').onclick=()=>{ if(mode==='pause'){ mode='play'; $('#overlay').style.display='none'; } else init(); last=0; acc=0; };
function pauseGame(){ if(mode==='play'){ mode='pause'; keys.clear(); modal('PAUSED','Your bonus timer is stopped.','RESUME'); } else if(mode==='pause'){ $('#go').click(); } }
function die(){
  lives--; record();
  burst(player.x, player.y-14, '#ffd34d');
  if (lives<=0){ mode='over'; modal('GAME OVER',`Score ${score.toLocaleString()} · Best ${best.toLocaleString()}<br>The ape keeps her — this time. Short, deliberate jumps beat the barrel rhythm.`,'PLAY AGAIN'); }
  else { barrels=[]; fires = B.name==='RIVETS' ? [mkFire(0,470,1)] : []; spawnT=1.6; if (bonus<=0) bonus=2600; spawnPlayer(); }
}
function boardClear(){
  score += bonus; record(); mode='inter'; interT=0;
  if (!extraGiven && score>=10000){ extraGiven=true; lives++; sparkText(300,300,'1UP!','#7dff8a'); }
}
function nextBoard(){
  boardIdx++;
  if (boardIdx>3){ boardIdx=0; level++; }
  setupBoard(); mode='play';
}
function burst(x,y,col){ for(let i=0;i<14;i++) parts.push({x,y,vx:(Math.random()-0.5)*160,vy:-Math.random()*160-30,t:0.7,col}); }
function sparkText(x,y,s,col){ sparks.push({x,y,t:1.1,s:s||'+100',col:col||'#fff18b'}); }

/* ---------- input: keyboard + our flight joystick + JUMP ---------- */
addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k)) e.preventDefault(); if(k==='p'&&!e.repeat) pauseGame(); keys.add(k); });
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{ keys.clear(); });
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
const stick=$('#stick'), knob=$('#knob');
let stickId=null;
function stickVec(e){ const r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; let dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2); const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; } return {dx,dy}; }
function stickApply(v){
  knob.style.transform=`translate(${v.dx*26}px,${v.dy*26}px)`;
  ['arrowleft','arrowright','arrowup','arrowdown'].forEach(k=>keys.delete(k));
  if (v.dx<-0.38) keys.add('arrowleft'); if (v.dx>0.38) keys.add('arrowright');
  if (v.dy<-0.45) keys.add('arrowup'); if (v.dy>0.45) keys.add('arrowdown');
}
stick.addEventListener('pointerdown',e=>{ e.preventDefault(); stickId=e.pointerId; stick.setPointerCapture(e.pointerId); stickApply(stickVec(e)); });
stick.addEventListener('pointermove',e=>{ if(e.pointerId===stickId) stickApply(stickVec(e)); });
const stickEnd=e=>{ if(e.pointerId===stickId){ stickId=null; knob.style.transform=''; ['arrowleft','arrowright','arrowup','arrowdown'].forEach(k=>keys.delete(k)); } };
stick.addEventListener('pointerup',stickEnd); stick.addEventListener('pointercancel',stickEnd);
const jb=$('#jumpBtn');
jb.addEventListener('pointerdown',e=>{ e.preventDefault(); keys.add(' '); });
jb.addEventListener('pointerup',()=>keys.delete(' ')); jb.addEventListener('pointercancel',()=>keys.delete(' '));
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*600/r.width, y=(e.clientY-r.top)*720/r.height; if (x>252&&x<348&&y>64&&y<100) pauseGame(); });

/* ---------- physics & play ---------- */
const WALK=138, CLIMB=98, JUMPV=-285, GRAV=760;
let jumpHeld=false;
function allSurfs(){ const s=B.plats.map((p,i)=>({p,i,lift:null})); if(B.lifts) for(const lf of B.lifts) s.push({p:{x1:lf.x,y1:lf.y,x2:lf.x+lf.w,y2:lf.y},i:-1,lift:lf}); return s; }
function step(dt){
  if (mode==='inter'){ interT+=dt; if (interT>2.8) nextBoard(); return; }
  if (mode==='clearfall'){ clearT+=dt; apeFall=clearT; for (const q of parts){ q.t-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=300*dt; } parts=parts.filter(q=>q.t>0); if (clearT>1.7){ boardClear(); } return; }
  if (mode!=='play') return;
  clock+=dt;
  bonusT+=dt; if (bonusT>=1.4){ bonusT=0; bonus=Math.max(0,bonus-100); if (bonus<=0){ die(); return; } }
  const p=player; p.inv=Math.max(0,p.inv-dt);
  const L=keys.has('arrowleft')||keys.has('a'), R=keys.has('arrowright')||keys.has('d'),
        U=keys.has('arrowup')||keys.has('w'), D=keys.has('arrowdown')||keys.has('s'), J=keys.has(' ');
  /* lifts */
  if (B.lifts) for (const lf of B.lifts){ lf.y+=lf.dir*lf.sp*dt; if (lf.y<=lf.yMin){ lf.y=lf.yMin; lf.dir=1; } if (lf.y>=lf.yMax){ lf.y=lf.yMax; lf.dir=-1; } if (p.lift===lf && p.on) p.y=lf.y; }
  /* hammer timer */
  if (hammerT>0) hammerT-=dt;
  /* --- player --- */
  p.vx=(R-L)*WALK; if (R) p.face=1; if (L) p.face=-1;
  if (!p.climb && p.on && hammerT<=0 && (U||D)){
    const lad=B.ladders.find(l=>Math.abs(l.x-p.x)<14 && ((U&&p.p===l.lo)||(D&&p.p===l.hi)));
    if (lad){ p.climb=lad; p.x=lad.x; p.on=false; p.lift=null; }
  }
  if (p.climb){
    const lad=p.climb, topY=surfY(B.plats[lad.hi],lad.x), botY=surfY(B.plats[lad.lo],lad.x);
    p.y += (D-U)*CLIMB*dt;
    if (p.y<=topY){ p.y=topY; p.p=lad.hi; p.on=true; p.climb=null; }
    else if (p.y>=botY){ p.y=botY; p.p=lad.lo; p.on=true; p.climb=null; }
  } else {
    if (J && !jumpHeld && p.on){ p.vy=JUMPV; p.on=false; p.lift=null; }
    p.x=Math.max(30,Math.min(570,p.x+p.vx*dt));
    if (!p.on){
      const before=p.y; p.vy+=GRAV*dt; p.y+=p.vy*dt;
      if (p.vy>=0){ for (const s of allSurfs()){ if (!onPlat(s.p,p.x)) continue; const y=surfY(s.p,p.x); if (before<=y+0.5 && p.y>=y){ p.y=y; p.p=s.i; p.lift=s.lift; p.on=true; p.vy=0; break; } } }
      if (p.y>760){ die(); return; }
    } else {
      /* standing: follow surface slope / belt / walk off an edge */
      const cur = p.lift ? {x1:p.lift.x,y1:p.lift.y,x2:p.lift.x+p.lift.w,y2:p.lift.y} : B.plats[p.p];
      if (cur.belt) p.x=Math.max(30,Math.min(570,p.x+cur.belt*46*dt));
      if (onPlat(cur,p.x)) p.y=surfY(cur,p.x);
      else { let stepped=false; for (const s of allSurfs()){ if (s.p===cur) continue; if (onPlat(s.p,p.x) && Math.abs(surfY(s.p,p.x)-p.y)<9){ p.p=s.i; p.lift=s.lift; p.y=surfY(s.p,p.x); stepped=true; break; } } if (!stepped){ p.on=false; p.vy=0; p.lift=null; } }
    }
  }
  jumpHeld=J;
  /* hammer pickup */
  /* hammers HANG in the air under the girder above (arcade): jump up to grab one */
  if (hammerT<=0) for (const h of hammersLeft){ if (!h.got && !p.on && !p.climb && Math.abs(p.x-h.x)<20 && Math.abs((p.y-22)-(surfY(B.plats[h.p],h.x)-40))<24){ h.got=true; hammerT=12; sparkText(p.x,p.y-56,'HAMMER!','#ffd34d'); } }
  /* prizes */
  if (B.prizes) for (const pr of B.prizes){ if (!pr.got && p.p===pr.p && Math.abs(p.x-pr.x)<18 && p.on){ pr.got=true; score+=300; sparkText(pr.x,surfY(B.plats[pr.p],pr.x)-44,'+300'); } }
  /* rivets */
  if (B.rivets) for (const r of B.rivets){ if (!r.got && p.p===r.p && p.on && Math.abs(p.x-r.x)<13){ r.got=true; score+=100; sparkText(r.x,surfY(B.plats[r.p],r.x)-30,'+100'); burst(r.x,surfY(B.plats[r.p],r.x)-4,'#9fd8ff'); if (B.rivets.every(v=>v.got)){ score+=2000; mode='clearfall'; clearT=0; } } }
  /* --- barrels (boards 1 & 4) --- */
  if (B.name==='BARRELS'||B.name==='PIE FACTORY'){
    spawnT-=dt;
    if (spawnT<=0){ barrels.push({x:B.ape.x+26, y:surfY(B.plats[B.ape.p],B.ape.x+26)-11, p:B.ape.p, dir:1, vy:0, fall:false, ang:0, ladSeen:false});
      spawnT=Math.max(1.15, 2.6-(level-1)*0.22-(boardIdx)*0.05)+Math.random()*0.6; }
  }
  for (const b of barrels){
    const sp=(96+(level-1)*9)*b.dir; b.ang+=sp*dt/11;
    if (b.fall){ b.vy+=GRAV*0.85*dt; b.y+=b.vy*dt; for (let i=0;i<B.plats.length;i++){ const pl=B.plats[i]; if (!onPlat(pl,b.x)) continue; const y=surfY(pl,b.x)-11; if (b.y>=y && b.vy>0){ b.y=y; b.p=i; b.fall=false; b.dir=(pl.y2>pl.y1)?1:(pl.y2<pl.y1)?-1:b.dir; break; } } if (b.y>740) b.dead=true; }
    else {
      const pl=B.plats[b.p]; b.x+=sp*dt; if (pl.belt) b.x+=pl.belt*46*dt; b.y=surfY(pl,b.x)-11;
      if (!b.ladSeen){ const lad=B.ladders.find(l=>l.hi===b.p && Math.abs(l.x-b.x)<3); if (lad){ b.ladSeen=true; if (Math.random()<Math.min(0.14+(level-1)*0.03,0.32)){ b.x=lad.x; b.fall=true; b.vy=10; } } }
      if (b.x>566||b.x<34){ if (b.p===0 && B.oil && b.x<70){ b.dead=true; if (fires.length<2) fires.push(mkFire(0,84,-1)); burst(52,surfY(B.plats[0],52)-16,'#ff9a3d'); }
        else if (b.p===0) b.dead=true; else { b.fall=true; b.vy=0; b.x=Math.max(34,Math.min(566,b.x)); } }
    }
    if (b.dead) continue;
    /* hammer smash */
    if (hammerT>0 && Math.abs(p.x-b.x)<34 && Math.abs((p.y-16)-b.y)<40){ b.dead=true; score+=100; sparkText(b.x,b.y-20,'+100'); burst(b.x,b.y,'#ffb35c'); continue; }
    if (p.inv===0 && !p.climb && Math.abs(p.x-b.x)<18 && Math.abs((p.y-13)-b.y)<19){ die(); return; }
    if (!b.scored && !p.on && !p.climb && Math.abs(p.x-b.x)<15 && p.y<b.y-6 && p.y>b.y-88){ b.scored=true; score+=100; sparkText(b.x,b.y-34,'+100'); }
  }
  barrels=barrels.filter(b=>!b.dead);

    if (B._tubT<=0){ B._tubs=(B._tubs||[]); B._tubs.push({x:44,p:5,y:surfY(B.plats[5],44)-12,fall:false,vy:0}); B._tubT=6.5; }

    if (p.inv===0 && !p.climb && Math.abs(p.x-f.x)<17 && Math.abs((p.y-12)-(f.y-10))<20){ die(); return; }

function grad(x0,y0,x1,y1,stops){ const gr=g.createLinearGradient(x0,y0,x1,y1); for (const [o,c] of stops) gr.addColorStop(o,c); return gr; }

  if (B.prizes) for (const pr of B.prizes) drawPrize(pr);
  if (B.oil) drawOil(B.oil.x, surfY(B.plats[B.oil.p],B.oil.x));
  if (B.lifts) for (const lf of B.lifts) drawLift(lf);
  for (const h of hammersLeft) if (!h.got) drawHammerItem(h);
  if (B.springs) for (const s of B.springs) drawSpring(s);
  for (const b of barrels) drawBarrelShape(b.x,b.y,b.ang);
  if (B._tubs) for (const t of B._tubs) drawTub(t);
  for (const f of fires) drawFire(f);
  const apeY=surfY(B.plats[B.ape.p],B.ape.x);
  drawApe(B.ape.x,apeY,{stack:B.name==='BARRELS'||B.name==='PIE FACTORY',fall:mode==='clearfall'?apeFall:0});
  drawGirl(B.girl.x, surfY(B.plats[B.girl.p],B.girl.x));
  if (player && mode!=='clearfall') drawHero(player);
  for (const q of parts){ g.globalAlpha=Math.max(0,q.t*1.6); rect(q.x-2.4,q.y-2.4,4.8,4.8,q.col); } g.globalAlpha=1;
  for (const s of sparks) txt(s.s||'+100',s.x,s.y-(1.1-s.t)*22,15,s.col||'#fff18b','center');
  /* HUD */
  txt('1UP',24,27,16,'#ff617f'); txt(String(score).padStart(6,'0'),24,49,18,'white');
  txt('HIGH SCORE',300,27,16,'#ff617f','center'); txt(String(Math.max(best,score)).padStart(6,'0'),300,49,18,'white','center');
  txt('L='+String(level).padStart(2,'0'),576,27,16,'#4d7dff','right');
  txt('❚❚',300,90,13,'#79839f','center');
  g.strokeStyle='#57e6ff'; g.lineWidth=2; g.strokeRect(486,38,90,42); txt('BONUS',531,54,12,'#7cdded','center'); txt(String(bonus),531,73,17,bonus<800?'#ff7373':'#f6d66d','center');
  for(let i=0;i<Math.max(0,lives-1);i++){ g.drawImage(SPR_JM_MINI, 24+i*19, 57); }
  txt(B.name,300,712,12,'#8a90a8','center');
  if (hammerT>0){ txt('HAMMER '+Math.ceil(hammerT),24,712,12,'#ffd34d'); }
}
function loop(t){ if(!last) last=t; acc+=Math.min(0.1,(t-last)/1000); last=t; while(acc>=1/120){ step(1/120); acc-=1/120; } render(); requestAnimationFrame(loop); }
setupBoard();
window.__gr={ get mode(){return mode}, get board(){return B?B.name:null}, get player(){return player}, get barrels(){return barrels}, get fires(){return fires}, get hammerT(){return hammerT}, get hammersLeft(){return hammersLeft},
  goto(n){ boardIdx=n; setupBoard(); mode='play'; $('#overlay').style.display='none'; }, start(){ init(); } };
requestAnimationFrame(loop);
</script>
