<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Graduation Green — a living card scene</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b112e;overflow:hidden;}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0b112e;}
  #bgBlur{position:absolute;inset:-40px;background:url('still.jpg') center/cover no-repeat;filter:blur(34px) brightness(.5);}
  #frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.65);background:#0e1434;}
  .layer{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* The arc: ONE master timeline (JS-driven). The night plate blends in across
     the arc while every light ignites at its own threshold — the lantern
     formula: start = per-light, ramp = a short window. */
  #night{opacity:0;}
  /* Ignition anchors: JS sets opacity from the master timeline; the light
     inside keeps its own twinkle/drift animation on transform+filter. */
  .ig{position:absolute;transform:translate(-50%,-50%);opacity:0;pointer-events:none;}
  .glow{position:absolute;left:0;top:0;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;border-radius:50%;}
  /* Lampposts — big warm lantern glows, slow breathing clocks. */
  .lamp{width:3.4%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,226,155,.95), rgba(255,185,85,.35) 55%, rgba(255,185,85,0) 78%);animation:twk ease-in-out infinite alternate;}
  .lampMid{width:2.5%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,226,155,.95), rgba(255,185,85,.33) 55%, rgba(255,185,85,0) 78%);animation:twk ease-in-out infinite alternate;}
  /* Small lamps — stage pair, path lamps, the distant ones by the trees. */
  .lampSm{width:1.35%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,228,165,.92), rgba(255,195,95,.3) 55%, rgba(255,195,95,0) 78%);animation:twk ease-in-out infinite alternate;}
  /* Festoon bulbs — gentle breathing clocks. */
  .bulb{width:1.35%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,222,150,.95), rgba(255,180,80,.3) 55%, rgba(255,180,80,0) 75%);animation:twk ease-in-out infinite alternate;}
  /* Hall windows — soft warm halos behind the painted glass. */
  .win{width:2%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,216,140,.85), rgba(255,180,90,.28) 55%, rgba(255,180,90,0) 78%);animation:twk ease-in-out infinite alternate;}
  .winBig{width:2.8%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,220,150,.85), rgba(255,185,95,.28) 55%, rgba(255,185,95,0) 78%);animation:twk ease-in-out infinite alternate;}
  /* Stars — the slowest clocks of all. */
  .star{width:.55%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(240,246,255,.95), rgba(200,220,255,0) 70%);animation:twk ease-in-out infinite alternate;}
  @keyframes twk{from{transform:translate(-50%,-50%) scale(.82);filter:brightness(.78)}to{transform:translate(-50%,-50%) scale(1.18);filter:brightness(1.28)}}
  /* Fireflies — not twinkles: each one BLINKS and DRIFTS on its own clock.
     Four wander paths; duration and delay are set per fly in JS. */
  .fly{width:.55%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,246,175,.95), rgba(255,216,95,.4) 55%, rgba(255,216,95,0) 78%);}
  .flyBig{width:.9%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,246,175,.95), rgba(255,216,95,.42) 55%, rgba(255,216,95,0) 78%);}
  @keyframes flyA{0%,100%{transform:translate(-50%,-50%) translate(0px,0px);filter:brightness(.3)}22%{transform:translate(-50%,-50%) translate(7px,-9px);filter:brightness(1.3)}47%{transform:translate(-50%,-50%) translate(13px,-2px);filter:brightness(.45)}71%{transform:translate(-50%,-50%) translate(4px,6px);filter:brightness(1.15)}}
  @keyframes flyB{0%,100%{transform:translate(-50%,-50%) translate(0px,0px);filter:brightness(1.2)}26%{transform:translate(-50%,-50%) translate(-9px,-5px);filter:brightness(.35)}52%{transform:translate(-50%,-50%) translate(-13px,4px);filter:brightness(1.25)}76%{transform:translate(-50%,-50%) translate(-4px,9px);filter:brightness(.5)}}
  @keyframes flyC{0%,100%{transform:translate(-50%,-50%) translate(0px,0px);filter:brightness(.45)}30%{transform:translate(-50%,-50%) translate(3px,-13px);filter:brightness(1.3)}58%{transform:translate(-50%,-50%) translate(-5px,-7px);filter:brightness(.3)}82%{transform:translate(-50%,-50%) translate(-2px,3px);filter:brightness(1.1)}}
  @keyframes flyD{0%,100%{transform:translate(-50%,-50%) translate(0px,0px);filter:brightness(1.25)}20%{transform:translate(-50%,-50%) translate(10px,5px);filter:brightness(.4)}45%{transform:translate(-50%,-50%) translate(5px,12px);filter:brightness(1.15)}68%{transform:translate(-50%,-50%) translate(-8px,6px);filter:brightness(.35)}88%{transform:translate(-50%,-50%) translate(-11px,-4px);filter:brightness(1.2)}}
  /* The clock face is lit in both paintings — its halo DEEPENS as the
     green settles into night (it never switches on, it was always on). */
  #clockWrap{position:absolute;inset:0;opacity:0;pointer-events:none;}
  #clockGlow{position:absolute;left:65.8%;top:14.2%;width:7%;height:13%;transform:translate(-50%,-50%);
    background:radial-gradient(50% 50% at 50% 50%, rgba(255,214,130,.40), rgba(255,185,90,.14) 55%, rgba(255,185,90,0) 75%);
    mix-blend-mode:screen;pointer-events:none;animation:breathe 6.4s ease-in-out infinite alternate;}
  @keyframes breathe{from{opacity:.45}to{opacity:.85}}
  /* The blank screen — the class montage screen. Softly lit at dusk;
     its glow gathers as the sky darkens. */
  #screenWrap{position:absolute;inset:0;opacity:0;pointer-events:none;}
  #screenGlow{position:absolute;left:22.6%;top:46.8%;width:19%;height:21%;transform:translate(-50%,-50%);
    background:radial-gradient(50% 50% at 50% 50%, rgba(255,240,205,.30), rgba(255,225,170,.10) 55%, rgba(255,225,170,0) 78%);
    mix-blend-mode:screen;pointer-events:none;}
  /* Family chrome. */
  #capPill{position:fixed;left:18px;top:calc(14px + env(safe-area-inset-top));z-index:3;
    background:rgba(8,10,28,.45);border-radius:999px;padding:7px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:rgba(240,240,250,.85);font-size:12px;letter-spacing:.18em;text-transform:uppercase;transition:opacity .7s ease;pointer-events:none;}
  #capPill b{color:#fff;font-weight:600;}
  #controls{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:12px;z-index:3;transition:opacity .7s ease;}
  body.ui-hidden #controls, body.ui-hidden #capPill{opacity:0;pointer-events:none;}
  body.ui-hidden{cursor:none;}
  body.wallmode #controls, body.wallmode #capPill{display:none;}
  .grp{display:flex;gap:4px;align-items:center;background:rgba(8,10,28,.45);border-radius:999px;padding:4px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .grp button{appearance:none;border:0;cursor:pointer;padding:6px 12px;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;border-radius:999px;color:rgba(240,240,250,.75);background:transparent;transition:background .25s,color .25s;}
  .grp button:hover{color:#fff;}
  .grp button.on{background:rgba(244,246,250,.92);color:#101623;}
  /* Still: the dusk painting itself, untouched — glows off, dusk plate full. */
  body.still .ig, body.still #clockWrap, body.still #screenWrap{opacity:0 !important;}
  body.still #night{opacity:0 !important;}
</style>
</head>
<body>
<div id="stage">
  <div id="bgBlur"></div>
  <div id="frame" role="img" aria-label="A living graduation green settling from dusk into night: six tall lampposts catch front to back, festoon bulbs sweep across the lawn over rows of white chairs with black and gold balloons, the brick hall's windows and clock face glow deeper, the blank montage screen gathers its light, stars come out, and fireflies rise blinking and drifting over the grass aisle.">
    <img class="layer" src="still.jpg" alt="">
    <img class="layer" id="night" src="night.jpg" alt="">
    <div id="clockWrap"><div id="clockGlow"></div></div>
    <div id="screenWrap"><div id="screenGlow"></div></div>
  </div>
  <div id="capPill"><b>The Graduation Green</b> · a living card scene</div>
  <div id="controls">
    <div class="grp">
      <button id="btnStill" type="button">Still</button>
      <button id="btnLiving" type="button" class="on">Living</button>
    </div>
  </div>
</div>
<script>
(() => {
"use strict";
if (location.hash === '#wall') document.body.classList.add('wallmode');
const frame = document.getElementById('frame');
const night = document.getElementById('night');
const clockWrap = document.getElementById('clockWrap');
const screenWrap = document.getElementById('screenWrap');
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

/* ---- The lights. Every point below sits on a real light in the night
   master, grounded by viewing the painting and measuring its crops:
   6 tall lampposts, 7 small lamps, 56 festoon bulbs, 16 hall windows,
   the clock face's halo, the montage screen's glow, 10 stars, and
   43 fireflies. Each light gets a start threshold on ONE master
   timeline; ignition order tells the story: the lampposts catch, front
   pair first → the festoons sweep across the green → the hall windows
   and the clock deepen → the screen gathers its glow → the stars come
   out → the fireflies rise last, blinking and drifting. ---- */
const lights = []; // {el, start}
function dot(cls, x, y, dur, dl, start){
  const a = document.createElement('span');
  a.className = 'ig'; a.style.left = x + '%'; a.style.top = y + '%';
  const s = document.createElement('span');
  s.className = 'glow ' + cls;
  s.style.animationDuration = dur + 's'; s.style.animationDelay = dl + 's';
  a.appendChild(s); frame.appendChild(a);
  lights.push({ el: a, start });
}

/* Tall lampposts — the front pair first, then the pairs walking back
   toward the hall. Slow breathing clocks. */
const lamps = [
  [6.0,19.0,'lamp',0.08],[95.0,19.3,'lamp',0.11],
  [24.6,30.6,'lampMid',0.14],[80.4,31.8,'lampMid',0.17],
  [36.6,36.7,'lampMid',0.20],[69.0,37.2,'lampMid',0.23]
];
lamps.forEach((p, i) => dot(p[2], p[0], p[1], 3.6 + (i % 3) * 0.8, -1.2 * i, p[3]));

/* Small lamps — the stage pair flanking the podium, the path lamps on
   the right walk, and the distant lamps in the far-left trees. */
const lampsSm = [
  [53.5,45.5,0.25],[61.8,45.5,0.27],[82.3,45.8,0.29],[83.6,49.0,0.31],
  [4.6,42.8,0.33],[32.5,45.8,0.35],[10.2,48.4,0.37]
];
lampsSm.forEach((p, i) => dot('lampSm', p[0], p[1], 3.0 + (i % 3) * 0.6, -0.9 * i, p[2]));

/* Festoon bulbs — one canopy, swept left to right across the green:
   each bulb's threshold follows its x position. Two runs off the left
   lampposts (a short hop from the oak, then the long sagging wire),
   a short center run in front of the hall, and the right run climbing
   back up to the right oak. */
const festoon = [
  [0.6,26.2],[2.8,26.1],[4.6,24.3],[7.7,24.5],
  [9.3,27.4],[11.4,29.6],[13.6,31.3],[15.7,32.3],[17.7,33.0],[19.7,33.3],[21.5,32.9],[23.1,32.1],
  [26.2,33.3],[27.8,34.8],[29.5,35.8],[31.2,36.5],[32.8,37.1],[34.2,37.4],[35.4,37.6],
  [37.8,39.2],[39.0,39.3],[40.5,40.0],[42.1,40.4],[43.7,40.9],[45.5,41.2],[46.8,41.4],[48.4,41.5],[50.7,41.2],
  [53.3,41.5],[55.8,41.7],[58.2,41.6],[60.5,41.2],
  [62.8,40.8],[64.4,40.6],[65.5,40.0],[66.5,39.6],[67.6,39.2],[70.1,38.0],[71.0,38.4],[72.1,38.2],
  [73.5,37.8],[75.0,37.2],[76.2,36.4],[77.6,35.0],[79.0,33.7],[81.5,31.5],[82.5,32.2],[83.8,32.2],
  [85.3,32.1],[86.9,31.4],[88.7,30.2],[90.4,29.1],[92.1,26.9],[93.7,25.1],[96.6,23.8],[98.6,26.2]
];
festoon.forEach((p, i) => dot('bulb', p[0], p[1], 2.4 + (i % 5) * 0.5, -0.6 * i,
  0.30 + (p[0] / 100) * 0.26));

/* Hall windows — dormers, the great window over the door, the tower's
   tall window, and the ground-floor glass, warming up together. */
const windows = [
  [47.7,31.2,'win'],[69.3,31.1,'win'],[63.5,30.0,'win'],
  [46.9,37.6,'win'],[48.4,37.6,'win'],[55.9,36.8,'winBig'],[59.5,36.8,'winBig'],[70.0,38.6,'win'],
  [47.3,46.7,'win'],[55.7,47.7,'win'],[57.9,47.6,'winBig'],[64.1,47.7,'win'],
  [68.7,46.7,'win'],[70.0,46.7,'win'],[77.2,49.6,'win'],[92.3,51.0,'win']
];
windows.forEach((p, i) => dot(p[2], p[0], p[1], 3.4 + (i % 4) * 0.7, -1.0 * i,
  0.52 + (i / (windows.length - 1)) * 0.14));

/* Stars — out before the fireflies, slowest clocks. */
const stars = [[42.7,7.5],[49.2,12.5],[58.5,6.5],[76.5,11.0],[70.0,3.5],[52.0,3.0],[63.0,9.5],[79.0,19.5],[44.0,17.0],[56.0,16.5]];
stars.forEach((p, i) => dot('star', p[0], p[1], 3.6 + (i % 4) * 0.9, -0.8 * i,
  0.74 + (i / (stars.length - 1)) * 0.12));

/* Fireflies — measured one by one in the night master's grass: the
   aisle and the chair rows, far specks to near sparks. Each keeps its
   anchor on the master timeline like every other light, but inside it
   BLINKS and DRIFTS on its own clock — four wander paths, every fly
   with its own duration and phase. They rise last of all. */
function fly(x, y, big, variant, dur, dl, start){
  const a = document.createElement('span');
  a.className = 'ig'; a.style.left = x + '%'; a.style.top = y + '%';
  const s = document.createElement('span');
  s.className = 'glow ' + (big ? 'flyBig' : 'fly');
  s.style.animationName = variant;
  s.style.animationDuration = dur + 's'; s.style.animationDelay = dl + 's';
  s.style.animationTimingFunction = 'ease-in-out';
  s.style.animationIterationCount = 'infinite';
  a.appendChild(s); frame.appendChild(a);
  lights.push({ el: a, start });
}
const fireflies = [
  [45.7,63.5],[56.2,64.7],[49.8,65.9],[55.4,66.6],[44.4,67.4],[43.2,68.3],[54.5,68.5],
  [51.5,69.8],[58.6,70.3],[42.9,71.1],[53.9,71.6],[45.8,72.7],[49.9,72.8],[38.2,75.8],[57.0,76.8],
  [48.3,77.0],[57.5,78.5],[46.9,79.4],[58.0,79.8],[36.8,81.3],[56.8,81.0],[60.0,81.6],[40.7,82.4],[51.4,83.7],
  [35.1,86.1],[43.5,84.5],[62.2,86.1],[51.8,86.4],[64.8,86.6],[25.6,86.9],[46.8,87.8],[51.4,88.6],[21.5,89.5],
  [77.2,89.4],[80.1,91.6],[49.3,92.2],[57.6,93.2],[62.2,93.7],[73.4,93.5],[29.5,94.1],[42.1,95.7],[52.9,95.9],[27.2,98.0]
];
const flyPaths = ['flyA', 'flyB', 'flyC', 'flyD'];
fireflies.forEach((p, i) => fly(p[0], p[1], p[1] >= 86, flyPaths[i % 4],
  6 + (i % 5) * 1.1, -1.37 * i, 0.82 + (i / (fireflies.length - 1)) * 0.09));

/* ---- The master timeline. ---- */
const RAMP = 0.09;          // each light's ignition window on the timeline
const DELAY = 1500;         // ms before the arc begins
const DURATION = 30000;     // ms, dusk → night
let raf = null, t0 = 0;
function applyT(T){
  night.style.opacity = sstep(0.02, 0.92, T).toFixed(3);
  clockWrap.style.opacity = (0.30 + 0.70 * sstep(0.50, 0.68, T)).toFixed(3);
  screenWrap.style.opacity = (0.35 + 0.65 * sstep(0.62, 0.80, T)).toFixed(3);
  for (const L of lights) L.el.style.opacity = sstep(L.start, L.start + RAMP, T).toFixed(3);
}
function tick(now){
  const T = clamp01((now - t0) / DURATION);
  applyT(T);
  raf = T < 1 ? requestAnimationFrame(tick) : null;
}
function startArc(){
  cancelArc();
  t0 = performance.now() + DELAY;
  raf = requestAnimationFrame(tick);
}
function cancelArc(){ if (raf) cancelAnimationFrame(raf); raf = null; }
function finishArc(){ cancelArc(); applyT(1); }

const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- Still / Living, tap-fullscreen, idle chrome: the family pattern. ---- */
const btnStill = document.getElementById('btnStill');
const btnLiving = document.getElementById('btnLiving');
function setLiving(on){
  document.body.classList.toggle('still', !on);
  btnStill.classList.toggle('on', !on);
  btnLiving.classList.toggle('on', on);
  if (!on) { cancelArc(); }
  else if (reduced) { finishArc(); }
  else { startArc(); } // entering Living replays the waking
}
btnStill.addEventListener('click', e => { e.stopPropagation(); setLiving(false); });
btnLiving.addEventListener('click', e => { e.stopPropagation(); setLiving(true); });
document.getElementById('stage').addEventListener('click', e => {
  if (e.target.closest('#controls')) return;
  if (document.body.classList.contains('wallmode')) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
});
let idleTimer = null;
function wake(){
  document.body.classList.remove('ui-hidden');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 4500);
}
window.addEventListener('pointermove', wake);
window.addEventListener('touchstart', wake, { passive: true });
wake();
if (reduced) finishArc(); else startArc();
})();
</script>
</body>
</html>
