<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Halloween Porch — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#17102b; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.6); transform:scale(1.18); animation:hwFill 11s ease-in-out infinite alternate; }
  @keyframes hwFill { from { filter:blur(26px) brightness(.55) } to { filter:blur(26px) brightness(.72) } }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#17102b;
           box-shadow:0 18px 60px rgba(10,4,24,.6); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:hwDrift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes hwDrift { from { transform:scale(1.03) translate(0.7%,0.35%); } to { transform:scale(1.095) translate(-0.9%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* cool moonlight washing in from the top right */
  #moonwash { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:hwBreathe 12s ease-in-out infinite alternate;
        background:radial-gradient(50% 55% at 91% 11%, rgba(190,205,255,.30), rgba(160,180,240,.10) 55%, rgba(160,180,240,0) 78%); }
  @keyframes hwBreathe { from { opacity:.5 } to { opacity:1 } }
  /* the two jack-o'-lanterns, their candle glow flickering warm */
  .pumpglow { position:absolute; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen;
        background:radial-gradient(closest-side, rgba(255,165,50,.62), rgba(255,120,25,.22) 55%, rgba(255,120,25,0) 78%);
        animation:hwFlicker 3.1s ease-in-out infinite alternate; will-change:opacity,transform; }
  #pumpL { left:7%; top:84%; width:25%; }
  #pumpR { left:90.5%; top:83%; width:26%; animation-duration:2.7s; animation-delay:-1.3s; }
  @keyframes hwFlicker { 0% { opacity:.55; transform:translate(-50%,-50%) scale(.96) } 30% { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } 55% { opacity:.65; transform:translate(-50%,-50%) scale(.99) } 80% { opacity:1; transform:translate(-50%,-50%) scale(1.04) } 100% { opacity:.72; transform:translate(-50%,-50%) scale(1.0) } }
  /* the full moon, softly pulsing */
  #moon { position:absolute; left:92%; top:11.5%; width:11%; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen;
        background:radial-gradient(closest-side, rgba(235,240,255,.5), rgba(200,215,250,.16) 55%, rgba(200,215,250,0) 78%);
        animation:hwTwk 6.5s ease-in-out infinite alternate; }
  /* the porch sconces, glowing warm */
  .sconce { position:absolute; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen;
        background:radial-gradient(closest-side, rgba(255,214,130,.75), rgba(255,180,90,.25) 55%, rgba(255,180,90,0) 78%);
        animation:hwTwk 4.2s ease-in-out infinite alternate; }
  /* the ghost balloon's sheen, swaying gently */
  #sheen { position:absolute; left:85%; top:26%; width:11%; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen;
        background:radial-gradient(closest-side, rgba(255,255,255,.38), rgba(255,255,255,.10) 55%, rgba(255,255,255,0) 78%);
        animation:hwSway 6s ease-in-out infinite alternate; }
  @keyframes hwSway { from { transform:translate(-53%,-50%); opacity:.3 } to { transform:translate(-47%,-50%); opacity:.55 } }
  /* string-light bulbs twinkling along the posts, garland and railing */
  .bulb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,226,150,.95), rgba(245,180,90,.3) 55%, rgba(245,180,90,0) 78%);
        animation:hwTwk ease-in-out infinite alternate; }
  @keyframes hwTwk { from { opacity:.3; transform:translate(-50%,-50%) scale(.82) } to { opacity:1; transform:translate(-50%,-50%) scale(1.18) } }
  /* autumn leaves drifting down through the porch light — the traveling element */
  #leaves { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .leaf { position:absolute; border-radius:62% 4px 62% 4px; pointer-events:none; opacity:0;
        animation:hwLeaf linear infinite; will-change:transform,opacity; }
  @keyframes hwLeaf { 0% { transform:translate(0,0) rotate(0deg); opacity:0 } 10% { opacity:.9 } 55% { opacity:.75 } 100% { transform:translate(var(--mx), var(--my)) rotate(300deg); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(42,16,54,.5); color:#ffe9c9; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,170,80,.65); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #fill, #drift, #moonwash, .pumpglow, #moon, .sconce, #sheen, .bulb, .leaf { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends in friendly Halloween costumes on a front porch at night — two glowing jack-o'-lanterns, a bowl of wrapped candy, a black cat by the steps, a ghost balloon, string lights, paper bats and a big full moon">
    </div>
    <div id="moonwash"></div>
    <div id="pumpL" class="pumpglow"></div>
    <div id="pumpR" class="pumpglow"></div>
    <div id="moon"></div>
    <div class="sconce" style="left:26%;top:8%;width:6.5%"></div>
    <div class="sconce" style="left:72.5%;top:9%;width:6%;animation-delay:-2.1s"></div>
    <div id="sheen"></div>
    <div id="fx"></div>
    <div id="leaves"></div>
    <div id="caption">TRICK OR TREAT</div>
  </div>
</div>
<script>
  // Halloween Porch (Gary's living standard): the painting stays exactly itself; the two jack-o'-lanterns flicker warm, the string lights twinkle along the posts and railing, the full moon breathes cool light over the porch, and autumn leaves drift down through it all. Cards move faster than photos. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    // string lights: down the left post, across the top garland, along the right railing
    var bulbs = [];
    for (var a = 0; a < 7; a++) bulbs.push([4.6, 7 + a * 6.2]);            // left post
    for (var b = 0; b < 7; b++) bulbs.push([10 + b * 8.5, 3.2]);          // top garland
    for (var c = 0; c < 5; c++) bulbs.push([88.5 + c * 2.6, 44 + c * 3.6]); // right railing
    bulbs.push([63, 6.5]); bulbs.push([80, 5]);
    for (var i = 0; i < bulbs.length; i++) {
      var sz = 0.85 + (i % 3) * 0.22;
      html += '<div class="bulb" style="left:' + bulbs[i][0] + '%;top:' + bulbs[i][1] + '%;width:' + sz.toFixed(2) + '%;aspect-ratio:1;animation-duration:' + (1.9 + (i % 4) * 0.45).toFixed(1) + 's;animation-delay:-' + (i * 0.41).toFixed(2) + 's"></div>';
    }
    host.innerHTML = html;
    // autumn leaves drifting down across the whole porch
    var leaves = document.getElementById('leaves'), lhtml = '';
    var cols = ['#e8761e', '#d94f1e', '#f2a541', '#b4551d'];
    for (var m = 0; m < 17; m++) {
      var lx = 3 + (m * 37) % 92, ly = (m * 23) % 42;
      var dx = ((m % 5) - 2) * 2.4, dy = 46 + (m % 4) * 7;
      var ldur = (9.5 + (m % 5) * 1.7).toFixed(1), ldel = (m * 1.53).toFixed(2);
      var lsz = (1.15 + (m % 3) * 0.4).toFixed(2);
      lhtml += '<div class="leaf" style="left:' + lx + '%;top:' + ly + '%;width:' + lsz + '%;aspect-ratio:1;background:' + cols[m % 4] + ';--mx:' + dx.toFixed(1) + 'vw;--my:' + dy.toFixed(0) + 'vh;animation-duration:' + ldur + 's;animation-delay:-' + ldel + 's"></div>';
    }
    leaves.innerHTML = lhtml;
  })();
</script>
</body>
</html>
