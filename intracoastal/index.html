<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooftop on the Intracoastal — A Living Photo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:34px 18px 30px; }
  h1 { font-size:clamp(28px, 4.5vw, 44px); font-weight:normal; letter-spacing:.14em;
       text-transform:uppercase; color:#f2ead6; text-align:center; }
  .statement { margin-top:8px; font-style:italic; font-size:clamp(14px, 2vw, 18px);
               color:#b9b09a; text-align:center; }
  .stage { position:relative; width:min(1120px, 100%); margin-top:26px;
           aspect-ratio: 2400 / 1792; cursor:pointer; background:#000;
           box-shadow: 0 18px 60px rgba(0,0,0,.65); }
  .stage img { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  .stage img.acc { inset:auto; object-fit:fill; }
  .controls { margin-top:22px; display:flex; justify-content:center; }
  button { font-family:inherit; cursor:pointer; background:transparent;
           color:#e8e2d4; border:1px solid #8a7f63; letter-spacing:.12em; }
  #ignite { font-size:17px; padding:13px 34px; border-radius:999px;
            text-transform:uppercase; }
  #ignite:hover { background:#1c1a14; }
  .toggle { display:none; border:1px solid #8a7f63; border-radius:999px; overflow:hidden; }
  .toggle button { border:none; font-size:15px; padding:11px 30px;
                   text-transform:uppercase; background:transparent; }
  .toggle button.on { background:#e8e2d4; color:#141310; }
  footer { padding:26px 18px 40px; text-align:center; font-size:14px; color:#8f887a; }
  footer a { color:#b9b09a; }
  #fs { position:fixed; inset:0; background:#000; display:none; z-index:50; cursor:pointer; }
  #fs .wrap { position:absolute; inset:0; }
  #fs img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  #fs img.acc { inset:auto; object-fit:fill; }
</style>
</head>
<body>
<main>
  <h1>Rooftop on the Intracoastal</h1>
  <div class="statement">A sunny day over the waterway</div>

  <div class="stage" id="stage" title="Tap for full screen">
    <img id="lyrDay" src="still.jpg" alt="The original painting, untouched">
    <img id="lyrGolden" src="golden.jpg" alt="" style="opacity:0">
    <img id="lyrDusk" src="dusk.jpg" alt="" style="opacity:0">
    <img id="lyrNight" src="night.jpg" alt="" style="opacity:0">
    <img class="acc" id="lyrAccPool" src="acc-pool.png" alt="" style="opacity:0;left:23.7083%;top:65.4576%;width:50.2917%;height:25.6138%">
    <img class="acc" id="lyrAccWinA" src="acc-wina.png" alt="" style="opacity:0;left:19.0417%;top:45.8705%;width:28.6250%;height:10.8259%">
    <img class="acc" id="lyrAccWinB" src="acc-winb.png" alt="" style="opacity:0;left:66.2500%;top:45.9821%;width:32.8750%;height:10.1562%">
    <img class="acc" id="lyrAccWinC" src="acc-winc.png" alt="" style="opacity:0;left:3.5833%;top:31.1384%;width:94.8333%;height:7.6451%">
    <img class="acc" id="lyrAccMarina" src="acc-marina.png" alt="" style="opacity:0;left:1.2500%;top:39.5647%;width:81.3750%;height:11.1607%">
    <img class="acc" id="lyrAccBuoyA" src="acc-buoysa.png" alt="" style="opacity:0;left:23.0000%;top:38.8393%;width:34.0000%;height:10.9375%">
    <img class="acc" id="lyrAccBuoyB" src="acc-buoysb.png" alt="" style="opacity:0;left:35.0000%;top:40.8482%;width:50.1667%;height:5.0223%">
    <img class="acc" id="lyrAccStars" src="acc-stars.png" alt="" style="opacity:0;left:3.7500%;top:0.7254%;width:95.5833%;height:29.7433%">
    <img class="acc" id="lyrAccShimA" src="acc-shima.png" alt="" style="opacity:0;left:0.0833%;top:35.1562%;width:99.9167%;height:19.9777%">
    <img class="acc" id="lyrAccShimB" src="acc-shimb.png" alt="" style="opacity:0;left:0.5833%;top:35.4911%;width:99.4167%;height:19.9219%">
    <img class="acc" id="lyrAccShimC" src="acc-shimc.png" alt="" style="opacity:0;left:0.0000%;top:33.5379%;width:99.6667%;height:21.5402%">
  </div>

  <div class="controls">
    <button id="ignite">&#10022; Bring it to life</button>
    <div class="toggle" id="toggle">
      <button id="btnStill">Still</button><button id="btnLiving" class="on">Living</button>
    </div>
  </div>
</main>

<footer>
  A <a href="https://thelivingphotos.com" target="_blank" rel="noopener">Living Photo</a>
  — a rooftop pool, a pink flamingo, and the whole blue Intracoastal.
</footer>

<div id="fs"><div class="wrap" id="fsWrap">
    <img id="fsDay" src="still.jpg" alt="The original painting, untouched">
    <img id="fsGolden" src="golden.jpg" alt="" style="opacity:0">
    <img id="fsDusk" src="dusk.jpg" alt="" style="opacity:0">
    <img id="fsNight" src="night.jpg" alt="" style="opacity:0">
    <img class="acc" id="fsAccPool" src="acc-pool.png" alt="" style="opacity:0;left:23.7083%;top:65.4576%;width:50.2917%;height:25.6138%">
    <img class="acc" id="fsAccWinA" src="acc-wina.png" alt="" style="opacity:0;left:19.0417%;top:45.8705%;width:28.6250%;height:10.8259%">
    <img class="acc" id="fsAccWinB" src="acc-winb.png" alt="" style="opacity:0;left:66.2500%;top:45.9821%;width:32.8750%;height:10.1562%">
    <img class="acc" id="fsAccWinC" src="acc-winc.png" alt="" style="opacity:0;left:3.5833%;top:31.1384%;width:94.8333%;height:7.6451%">
    <img class="acc" id="fsAccMarina" src="acc-marina.png" alt="" style="opacity:0;left:1.2500%;top:39.5647%;width:81.3750%;height:11.1607%">
    <img class="acc" id="fsAccBuoyA" src="acc-buoysa.png" alt="" style="opacity:0;left:23.0000%;top:38.8393%;width:34.0000%;height:10.9375%">
    <img class="acc" id="fsAccBuoyB" src="acc-buoysb.png" alt="" style="opacity:0;left:35.0000%;top:40.8482%;width:50.1667%;height:5.0223%">
    <img class="acc" id="fsAccStars" src="acc-stars.png" alt="" style="opacity:0;left:3.7500%;top:0.7254%;width:95.5833%;height:29.7433%">
    <img class="acc" id="fsAccShimA" src="acc-shima.png" alt="" style="opacity:0;left:0.0833%;top:35.1562%;width:99.9167%;height:19.9777%">
    <img class="acc" id="fsAccShimB" src="acc-shimb.png" alt="" style="opacity:0;left:0.5833%;top:35.4911%;width:99.4167%;height:19.9219%">
    <img class="acc" id="fsAccShimC" src="acc-shimc.png" alt="" style="opacity:0;left:0.0000%;top:33.5379%;width:99.6667%;height:21.5402%">
</div></div>

<script>
(function(){
  "use strict";
  var T = 60;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var clockStarted = false;   // the 60s clock runs once anything ignites it
  var fsFromStill = false;    // fullscreen was opened from STILL -> FS is living
  var frozen = null;          // QA: freeze the clock at this many seconds
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  var anchor = 0;             // scene seconds at anchorNow (phase anchor)
  var anchorNow = 0;          // performance.now() at the anchor
  var clock = 0;              // current scene clock, seconds (QA state)

  function stack(p){
    return {
             day: document.getElementById(p+'Day'),
             golden: document.getElementById(p+'Golden'),
             dusk: document.getElementById(p+'Dusk'),
             night: document.getElementById(p+'Night'),
             accPool: document.getElementById(p+'AccPool'),
             accWinA: document.getElementById(p+'AccWinA'),
             accWinB: document.getElementById(p+'AccWinB'),
             accWinC: document.getElementById(p+'AccWinC'),
             accMarina: document.getElementById(p+'AccMarina'),
             accBuoyA: document.getElementById(p+'AccBuoyA'),
             accBuoyB: document.getElementById(p+'AccBuoyB'),
             accStars: document.getElementById(p+'AccStars'),
             accShimA: document.getElementById(p+'AccShimA'),
             accShimB: document.getElementById(p+'AccShimB'),
             accShimC: document.getElementById(p+'AccShimC')
    };
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsWrap = document.getElementById('fsWrap');
  var fsOpen = false;

  // Fullscreen letterbox geometry: the wrap is sized to the whole picture
  // fitted inside the screen (contain), centred, so the cropped accent
  // layers (positioned in % of the picture) line up at any screen shape.
  function fitFs(){
    var vw = window.innerWidth, vh = window.innerHeight, ar = 2400 / 1792;
    var w = vw, h = vw / ar;
    if (h > vh) { h = vh; w = vh * ar; }
    fsWrap.style.left = ((vw - w) / 2) + 'px';
    fsWrap.style.top = ((vh - h) / 2) + 'px';
    fsWrap.style.width = w + 'px';
    fsWrap.style.height = h + 'px';
  }
  window.addEventListener('resize', function(){ if (fsOpen) fitFs(); });

  // The journey (60s): full daylight -> GOLDEN (the light warms and
  // the colours ripen) -> DUSK (rose sunset; the windows and the marina
  // begin to wake) -> NIGHT (the sky goes black, the stars come out,
  // the pool glows and the water answers every light) -> melt back to
  // morning. Nested plates: golden under dusk under night; the return
  // fades them out in reverse order with overlaps. t=60 wraps to t=0.
  function opacities(t){
    t = ((t % T) + T) % T;
    var golden = 0, dusk = 0, night = 0;
    if (t >= 4 && t < 12) golden = (t - 4) / 8;
    else if (t >= 12 && t < 50) golden = 1;
    else if (t >= 50) golden = 1 - (t - 50) / 8;
    if (t >= 16 && t < 25) dusk = (t - 16) / 9;
    else if (t >= 25 && t < 52) dusk = 1;
    else if (t >= 52) dusk = 1 - (t - 52) / 8;
    if (t >= 30 && t < 38) night = (t - 30) / 8;
    else if (t >= 38 && t < 52) night = 1;
    else if (t >= 52) night = 1 - (t - 52) / 8;
    return { day:1, golden:golden, dusk:dusk, night:night };
  }
  // Accents, each in its own colour on its own slow rhythm. Envelopes:
  // 'lamp' - the pool glow, the windows ashore and on the rooftops, and
  // the marina lights wake through dusk and stand out most at night;
  // 'blink' - the channel buoys breathe on and off, night-gated; 'deep2'
  // - STAR-DOSE LAW: the star points gain nothing until night itself
  // (night^2 gate), point size never changes; 'spark' - the water's own
  // flecks shimmer with the day glitter, quieten at dusk, and answer
  // every light at night. All periods divide 60.
  // [key, period, phase, max, envelope, pulse floor]
  var ACC = [ ['accPool',   15, 0, 0.85, 'lamp', 0.55],
              ['accWinA',   12, 2.7, 0.95, 'lamp', 0.45],
              ['accWinB',   15, 5.3, 0.95, 'lamp', 0.45],
              ['accWinC',   20, 8.1, 0.9, 'lamp', 0.4],
              ['accMarina',   17, 4.4, 0.95, 'lamp', 0.4],
              ['accBuoyA',    9, 0, 1, 'blink', 0.03],
              ['accBuoyB',    9, 4.5, 1, 'blink', 0.03],
              ['accStars',   13, 0, 0.9, 'deep2', 0.55],
              ['accShimA',    9, 0, 0.95, 'spark', 0.3],
              ['accShimB',   13, 4.2, 0.95, 'spark', 0.3],
              ['accShimC',   17, 8.9, 0.95, 'spark', 0.3] ];
  function accOpacities(t){
    var so = opacities(t);
    var env = { lamp: 0.10 + 0.90 * Math.max(0.45 * so.dusk, so.night),
                moon: Math.pow(so.night, 1.5),
                deep2: so.night * so.night,
                blink: Math.max(0.55 * so.dusk, so.night),
                spark: Math.max(0.70 * so.golden, 0.55 * so.dusk, 0.90 * so.night) };
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);
      if (a[4] === 'blink') p = p * p * p;
      o[a[0]] = a[3] * env[a[4]] * (a[5] + (1 - a[5]) * p);
    }
    if (forcedAcc !== null){ for (var k in o) o[k] = forcedAcc; }
    return o;
  }
  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.golden.style.opacity = living ? so.golden : 0;
    st.dusk.style.opacity = living ? so.dusk : 0;
    st.night.style.opacity = living ? so.night : 0;
    for (var i = 0; i < ACC.length; i++){
      var k = ACC[i][0];
      st[k].style.opacity = living ? ao[k] : 0;
    }
  }
  function frame(now){
    // Scene time is a pure function of wall time (performance.now) since
    // ignition: frame rate or throttling can never stretch the 60s cycle,
    // and entering/leaving fullscreen never touches the clock.
    if (clockStarted && frozen === null) clock = anchor + (now - anchorNow) / 1000;
    var t = frozen !== null ? frozen : clock;
    var so = opacities(t), ao = accOpacities(t);
    var living = state === 'living';
    apply(page, so, ao, living);
    if (fsOpen) apply(fs, so, ao, living || fsFromStill);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){ ignited = true; clockStarted = true; anchor = 0; anchorNow = performance.now(); clock = 0; }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    if (!ignited){ ignite(); return; }
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  // Fullscreen law: tapping the photo opens it edge-to-edge on black.
  // From STILL, fullscreen opens LIVING - the loop ignites and runs; from
  // LIVING it continues at the same phase. Exit restores the exact prior
  // page state (a page that was STILL is STILL again, untouched).
  function openFs(){
    fsFromStill = (state === 'still');
    if (fsFromStill && !clockStarted){ clockStarted = true; anchor = 0; anchorNow = performance.now(); clock = 0; }
    fsOpen = true; fitFs(); fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsFromStill = false; fsEl.style.display = 'none';
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape' || e.key)) closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ if (frozen !== null){ frozen = null; anchor = clock; anchorNow = performance.now(); } },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : clock); },
    state: function(){ return { state: state, fsOpen: fsOpen, fsFromStill: fsFromStill, clock: clock }; },
    opacities: opacities
  };
})();
</script>
</body>
</html>
