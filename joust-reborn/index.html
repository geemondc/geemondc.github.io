function textW(str, sc){ return str.length ? (str.length * 6 - 1) * sc : 0; }
function drawText(str, x, y, sc, color){
  ctx.fillStyle = color;
  str = String(str).toUpperCase();
  for (let i = 0; i < str.length; i++){
    const g = FONT[str[i]] || FONT[' '];
    const gx = x + i * 6 * sc;
    for (let r = 0; r < 7; r++){
      const row = g[r];
      for (let c = 0; c < 5; c++){
        if (row[c] === '#') ctx.fillRect(gx + c * sc, y + r * sc, sc, sc);
      }
    }
  }
}

/* sprite builder: map + palette -> offscreen canvas at unit=2 */
const SPR = {};
function buildSprite(rows, pal){
  const h = rows.length, w = rows[0].length, U = 2;
  const c = document.createElement('canvas'); c.width = w * U; c.height = h * U;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const ch = rows[y][x];
    if (ch === '.') continue;
    g.fillStyle = pal[ch] || '#ff00ff';
    g.fillRect(x * U, y * U, U, U);
  }
  return c;
}
function buildAllSprites(){
  for (const pk of Object.keys(PAL)){
    SPR[pk] = {
      flyA: buildSprite(FLY_A, PAL[pk]), flyB: buildSprite(FLY_B, PAL[pk]),
      standA: buildSprite(STAND_A, PAL[pk]), standB: buildSprite(STAND_B, PAL[pk]),
      knight: buildSprite(KNIGHT, PAL[pk]), icon: buildSprite(ICON_MAP, PAL[pk])
    };
  }
  SPR.birdA = buildSprite(BIRD_A, PAL.bounder);
  SPR.birdB = buildSprite(BIRD_B, PAL.bounder);
  SPR.egg = buildSprite(EGG_MAP, PAL.p1);

/* ---------------- rock textures ---------------- */
function mulberry(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rockPath(g, w, h, seed, taper){
  const rnd = mulberry(seed);
  g.beginPath();
  g.moveTo(1, 7);
  g.lineTo(w - 1, 7);
  g.lineTo(w - taper, h * 0.55);
  const steps = Math.max(4, Math.floor(w / 26));
  for (let i = 1; i <= steps; i++){
    const x = (w - taper) - (w - taper * 2) * (i / steps);
    g.lineTo(x, h - 2 - rnd() * (h * 0.30));
  }
  g.lineTo(taper, h * 0.55);
  g.closePath();
}
function paintRock(g, w, h, seed){
  const rnd = mulberry(seed * 7 + 3);
  const grad = g.createLinearGradient(0, 7, 0, h);
  grad.addColorStop(0, '#d97c1e'); grad.addColorStop(0.5, '#b35c14'); grad.addColorStop(1, '#7a3c0c');
  rockPath(g, w, h, seed, Math.min(16, w * 0.08));
  g.fillStyle = grad; g.fill();
  rockPath(g, w, h, seed, Math.min(16, w * 0.08));
  g.clip();
  for (let i = 0; i < w * h / 260; i++){
    g.fillStyle = rnd() < 0.6 ? 'rgba(94,47,4,0.5)' : 'rgba(255,166,62,0.45)';
    g.fillRect(rnd() * w, 9 + rnd() * (h - 11), 2 + rnd() * 5, 2 + rnd() * 3);
  }
  g.restore();
}
function paintTopBand(g, w){
  g.fillStyle = '#6e7885'; g.fillRect(0, 5, w, 2);
  g.fillStyle = '#9aa7b4'; g.fillRect(0, 1, w, 5);
  g.fillStyle = '#d6dbe2'; g.fillRect(0, 0, w, 2);
  g.fillStyle = '#7e8894'; g.fillRect(0, 6, w, 1);
}
function makePlatTexture(w, seed){
  const h = 34;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.save(); paintRock(g, w, h, seed); g.restore();
  paintTopBand(g, w);
  return c;
}
function drawSlot(g, x, y, w, h){
  g.fillStyle = '#2e1a06';
  g.beginPath(); g.roundRect(x, y, w, h, 9); g.fill();
  g.strokeStyle = '#59331a'; g.lineWidth = 2;
  g.beginPath(); g.roundRect(x + 1, y + 1, w - 2, h - 2, 8); g.stroke();
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x + 4, y + 3, w - 8, 3);
}
const SLOT = { w: 225, h: 26, x1: 207, x2: 462 };
function makeBaseTexture(){
  const w = 562, h = 68;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.save(); paintRock(g, w, h + 26, 99); g.restore();
  paintTopBand(g, w);
  drawSlot(g, SLOT.x1 - 177, 12, SLOT.w, SLOT.h);
  drawSlot(g, SLOT.x2 - 177, 12, SLOT.w, SLOT.h);
  return c;
}
function makeBarTexture(){
  const w = 660, h = 46;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.save(); paintRock(g, w, h + 20, 55); g.restore();
  paintTopBand(g, w);
  drawSlot(g, SLOT.x1 - 150, 10, SLOT.w, SLOT.h);
  drawSlot(g, SLOT.x2 - 150, 10, SLOT.w, SLOT.h);

}
function makeThinTexture(w, seed){
  const h = 13;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.save(); paintRock(g, w, h + 16, seed); g.restore();
  paintTopBand(g, w);
  return c;
}

for (const p of PLATS_ALL){
  p.seed = 1000 + p.x * 3 + p.w;
  if (p.base) p.tex = makeBaseTexture();
  else if (p.thin) p.tex = makeThinTexture(p.w, p.seed);
  else p.tex = makePlatTexture(p.w, p.seed);
}
const BAR_TEX = makeBarTexture();
function platformsForWave(wave, eggWave){
  if (eggWave || wave <= 1) return PLATS_ALL.slice();
  const gone = new Set();
  if (wave >= 2){ gone.add('fr'); gone.add('hiL'); }
  if (wave >= 3){ gone.add('cl'); }
  if (wave >= 4){ gone.add('base'); gone.add('gndL'); gone.add('gndR'); }
  return PLATS_ALL.filter(p => !gone.has(p.id));
}
function platById(plats, id){ return plats.find(p => p.id === id); }

/* ---------------- audio (Williams-style synth, effects only) ---------------- */
let AC = null, masterGain = null, noiseBuf = null, muted = false;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, filterType, f0, f1, gain, when){
  if (!AC || muted) return;
  const t = AC.currentTime + (when || 0);
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = filterType;
  fl.frequency.setValueAtTime(f0, t);
  if (f1) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(fl); fl.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + dur + 0.02);
}
function tone(type, f0, f1, dur, gain, when, lfoFreq, lfoDepth){
  if (!AC || muted) return null;
  const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  let lfo = null;
  if (lfoFreq){
    lfo = AC.createOscillator(); lfo.frequency.value = lfoFreq;
    const lg = AC.createGain(); lg.gain.value = lfoDepth || 100;
    lfo.connect(lg); lg.connect(o.frequency);
    lfo.start(t); lfo.stop(t + dur + 0.02);
  }
  const g = AC.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.02);
  return o;
}
const SFX = {
  flap(vol){ noise(0.07, 'lowpass', 850, 300, 0.35 * (vol || 1)); tone('sine', 150, 68, 0.09, 0.30 * (vol || 1)); },
  skid(){ noise(0.05, 'bandpass', 2300, 1900, 0.10); },
  bonk(){ tone('square', 165, 120, 0.07, 0.22); noise(0.03, 'highpass', 2800, null, 0.12); },
  clank(){
    tone('square', 2093, 1900, 0.13, 0.10); tone('square', 2637, 2500, 0.10, 0.08);
    tone('square', 3520, 3300, 0.07, 0.06); noise(0.05, 'highpass', 3200, null, 0.16);
  },
  poof(){ noise(0.22, 'lowpass', 1300, 180, 0.4); },
  egg(n){ const f = 620 + Math.min(n, 5) * 95; tone('square', f, f * 1.6, 0.10, 0.20); tone('square', f * 2, f * 3.1, 0.07, 0.06); },
  hatch(){ tone('square', 980, 1300, 0.06, 0.16); tone('square', 1180, 1560, 0.08, 0.16, 0.09); },
  screech(long){
    const dur = long ? 0.9 : 0.5;
    tone('sawtooth', 1500, 590, dur, 0.20, 0, 27, 300);
    tone('square', 760, 300, dur, 0.07, 0, 31, 140);
  },
  grab(){ tone('square', 84, 60, 0.34, 0.30, 0, 22, 26); noise(0.25, 'lowpass', 500, 200, 0.2); },
  splash(){ noise(0.4, 'lowpass', 520, 130, 0.5); tone('sine', 300, 60, 0.3, 0.12); },
  zapDown(){ tone('square', 880, 58, 0.42, 0.22, 0, 9, 60); },
  zapUp(){ tone('square', 130, 740, 0.22, 0.18); },
  blip(){ tone('square', 523, null, 0.08, 0.18); tone('square', 784, null, 0.1, 0.18, 0.09); },
  extraLife(){ [659, 784, 988, 1319].forEach((f, i) => tone('square', f, null, 0.1, 0.18, i * 0.09)); tone('square', 1319, null, 0.2, 0.16, 0.38); }
};

const keys = new Set();

const GAMEKEYS = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'];
window.addEventListener('keydown', e => {
  initAudio();
  if (GAMEKEYS.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'KeyM'){ muted = !muted; return; }
  if (game.state === 'title'){
    if (e.code === 'ArrowUp' || e.code === 'KeyW'){ titleSel = 0; SFX.blip(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS'){ titleSel = 1; SFX.blip(); }
    if (e.code === 'Enter' || e.code === 'Space') startGame(titleSel + 1);
    return;
  }
  if (game.state === 'gameover'){
    if (e.code === 'Enter' || e.code === 'Space'){ game.state = 'title'; }
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape'){
    if (game.state === 'play' || game.state === 'intro') game.paused = !game.paused;

  if (game.paused) return;

function addScore(p, pts, x, y, color){

function burst(x, y, n, colors, spd, grav, life){

    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * (spd || 90);
    particles.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
      t: 0, life: (life || 0.5) * (0.6 + Math.random() * 0.7),

function startGame(n){
  game.nPlayers = n;

    ? 'P1 &larr;&rarr; MOVE &middot; &uarr;/SPACE FLAP &middot; P PAUSE &middot; M MUTE'
    : 'P1 &larr;&rarr; MOVE &middot; &uarr;/SPACE FLAP &nbsp;&nbsp; P2 A/D MOVE &middot; W FLAP &nbsp;&nbsp; P PAUSE &middot; M MUTE';

function waveKind(w){
  const egg = w % 5 === 0;
  const surv = w >= 3 && (w - 3) % 10 === 0;
  const team = game.nPlayers === 2 && (surv || w === 6);
  const glad = game.nPlayers === 2 && w === 7;
  const pteroStart = w === 8 || (w > 8 && (w - 8) % 10 === 0);
  return { egg, surv, team, glad, pteroStart };
}
function nextWave(){
  game.wave++;
  const w = game.wave;
  const kind = waveKind(w);
  game.plats = platformsForWave(w, kind.egg);
  enemies = []; eggs = []; standings = []; birds = []; ptero = null; hand = null;
  popups = []; particles = [];
  waveInfo = Object.assign({}, kind, {
    time: 0, lostLife: [false, false], pvpUnseat: false, gladDone: false,
    pteroTimerDone: false, letter: kind.egg ? 'E' : kind.glad ? 'G' : kind.pteroStart ? 'P' : (kind.surv || kind.team) ? 'S' : ''
  });
  for (const p of players){
    p.eggsWave = 0;
    if (!p.eliminated){ placePlayerSpawn(p); p.state = 'play'; p.invulnT = 1; }
    p.flapQ = false;
  }
  if (kind.egg){
    const spots = game.plats.filter(pl => !pl.thin);
    for (let i = 0; i < 12; i++){
      const pl = spots[(Math.random() * spots.length) | 0];
      const ex = pl.x + 20 + Math.random() * (pl.w - 40);
      eggs.push({x: ex, y: pl.y - 11, vx: 0, vy: 0, resting: true, plat: pl,
        hatchT: -i * 0.8 - Math.random() * 2, landed: true, bounced: true, fromCls: 0, shake: false});
    }
    spawnQueue = 0;
  } else {
    spawnQueue = Math.min(14, 4 + (w - 1));
    spawnTimer = 0.4;
  }

  game.introT = 1.9;
  game.paused = false;
}
function spawnPlatList(){
  const order = ['base', 'cl', 'cu', 'lm', 'rm', 'hiR', 'hiL', 'fr'];
  const out = [];
  for (const id of order){ const p = platById(game.plats, id); if (p) out.push(p); }
  return out.length ? out : game.plats;
}
function placePlayerSpawn(p){
  const list = spawnPlatList();
  const pref = p.idx === 0 ? list[0] : (platById(game.plats, 'lm') || list[list.length - 1]);
  p.x = pref.x + pref.w / 2 - 31 + (p.idx === 0 ? 0 : 0);
  p.y = pref.y - 46;
  p.vx = 0; p.vy = 0; p.grounded = true; p.plat = pref;
  p.dir = p.idx === 0 ? 1 : -1;
}
function classForSpawn(w){
  const r = Math.random();
  const shadowP = w >= 16 ? 0.25 : 0;
  const hunterP = w >= 4 ? Math.min(0.6, 0.12 * (w - 3)) : 0;
  if (r < shadowP) return 2;
  if (r < shadowP + hunterP) return 1;
  return 0;
}
function spawnEnemy(){
  const list = spawnPlatList().filter(pl => !pl.thin);
  const busy = pl => {
    const cx = pl.x + pl.w / 2;
    for (const e of enemies) if (Math.abs(riderCX(e) - cx) < 80 && Math.abs(e.y - (pl.y - 46)) < 60) return true;
    for (const p of players) if (p.state === 'play' && Math.abs(riderCX(p) - cx) < 80 && Math.abs(p.y - (pl.y - 46)) < 60) return true;
    return false;
  };
  const free = list.filter(pl => !busy(pl));
  const pool = free.length ? free : list;
  const pl = pool[(Math.random() * pool.length) | 0];
  const e = makeEnemy(classForSpawn(game.wave), pl.x + pl.w / 2 - 31, pl.y - 46);
  e.plat = pl;
  enemies.push(e);
}

/* ---------------- shared rider physics ---------------- */
const RUN_MAX = 215, AIR_MAX = 305;
function riderCX(e){ return e.x + 31; }
function dust(x, y){ burst(x, y, 5, ['#c9a06a', '#8a6a3a', '#e8d8a8'], 55, 260, 0.35); }
function stepRider(e, dt, dirIn, isPlayer){
  if (e.clashCD > 0) e.clashCD -= dt;
  if (e.trollCD > 0) e.trollCD -= dt;
  const flapPow = e.flapPow || FLAP_VY;
  const doFlap = () => {
    e.vy = flapPow;
    e.wingT = 0.18;
    if (isPlayer) SFX.flap(1);
    else if (Math.random() < 0.4) SFX.flap(0.3);
  };
  if (e.grounded){
    const pl = e.plat;
    if (!pl || !game.plats.includes(pl) || riderCX(e) < pl.x - 12 || riderCX(e) > pl.x + pl.w + 12){
      e.grounded = false;
    } else {
      e.y = pl.y - 46; e.vy = 0;
      if (e.flapQ){ e.flapQ = false; e.grounded = false; doFlap(); dust(riderCX(e), pl.y); }
      else {
        if (dirIn !== 0){
          if (e.vx * dirIn < -60){
            e.vx += 1800 * dt * dirIn;
            e.skidT += dt;
            if (isPlayer && e.skidT > 0.07){ e.skidT = 0; SFX.skid(); }
          } else {
            e.vx += 1400 * dt * dirIn;
            if (e.vx > RUN_MAX) e.vx = RUN_MAX;
            if (e.vx < -RUN_MAX) e.vx = -RUN_MAX;
          }
          e.dir = dirIn;
          e.runDist += Math.abs(e.vx) * dt;
        } else {
          if (e.vx > 0) e.vx = Math.max(0, e.vx - 1600 * dt);
          else e.vx = Math.min(0, e.vx + 1600 * dt);
        }
        e.x += e.vx * dt;
        if (e.x < -62) e.x += VW + 62;
        if (e.x > VW) e.x -= VW + 62;
        return;
      }
    }
  }
  /* airborne */
  if (e.flapQ){ e.flapQ = false; if (e.vy > flapPow) doFlap(); else e.wingT = 0.18; }
  e.vy += GRAV * dt;
  if (e.vy > MAXFALL) e.vy = MAXFALL;
  if (dirIn !== 0){
    e.vx += 300 * dt * dirIn;
    if (e.vx > AIR_MAX) e.vx = AIR_MAX;
    if (e.vx < -AIR_MAX) e.vx = -AIR_MAX;
    e.dir = dirIn;
  } else {
    e.vx -= e.vx * 0.12 * dt;
  }
  const prevFeet = e.y + 46, prevHead = e.y + 4;
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  if (e.x < -62) e.x += VW + 62;
  if (e.x > VW) e.x -= VW + 62;
  if (e.y < 8){ e.y = 8; if (e.vy < 30) e.vy = 30; }
  const feet = e.y + 46, head = e.y + 4;
  for (const pl of game.plats){
    if (!(e.x + 50 > pl.x && e.x + 12 < pl.x + pl.w)) continue;
    const pBottom = pl.y + 16;
    if (e.vy >= 0 && prevFeet <= pl.y + 1 && feet >= pl.y){
      e.y = pl.y - 46; e.vy = 0; e.grounded = true; e.plat = pl;
      if (prevFeet < pl.y - 30) dust(riderCX(e), pl.y);
      break;
    }
    if (e.vy < 0 && prevHead >= pBottom && head < pBottom){
      e.y = pBottom - 4; e.vy = 40;
    }
  }
  if (!e.grounded && e.y + 46 > LAVA_Y + 8) lavaDeath(e);
}
function lavaDeath(e){
  burst(riderCX(e), LAVA_Y, 16, ['#ff5a1a', '#ffd21f', '#ff8a3a'], 170, 300, 0.6);
  SFX.splash();
  if (e.kind === 'player') killPlayer(e);
  else e.state = 'gone';
}
function killPlayer(p){
  if (p.state !== 'play' && p.state !== 'grabbed') return;
  p.lives--;
  addScore(p, 50);
  waveInfo.lostLife[p.idx] = true;
  SFX.zapDown(); SFX.poof();
  burst(riderCX(p), p.y + 20, 14, ['#ffffff', PAL[p.palKey].Y, PAL[p.palKey].B], 150, 200, 0.7);
  p.flapQ = false;
  if (p.lives <= 0){ p.state = 'out'; p.eliminated = true; }
  else { p.state = 'dead'; p.respawnT = 1.2; }
}
function unseatEnemy(e, winner){
  eggs.push({x: riderCX(e), y: e.y + 30, vx: e.vx * 0.3, vy: -40,
    resting: false, plat: null, hatchT: 0, landed: false, bounced: false, fromCls: e.cls, shake: false});
  birds.push({mode: 'leave', x: e.x, y: e.y, vx: (e.dir > 0 ? 1 : -1) * 260, t: 0, target: null});
  burst(riderCX(e), e.y + 20, 12, ['#ffffff', '#1d9e4b', '#5fd67f'], 140, 200, 0.6);
  SFX.clank(); SFX.poof();
  e.state = 'gone';
}
function bounceApart(a, b){
  const d = riderCX(a) < riderCX(b) ? -1 : 1;
  a.vx = d * 175; b.vx = -d * 175;
  a.vy = Math.min(a.vy, -50); b.vy = Math.min(b.vy, -50);
  a.grounded = false; b.grounded = false;
  a.clashCD = 0.3; b.clashCD = 0.3;
  SFX.bonk();
}
function combat(){
  const riders = [];
  for (const p of players) if (p.state === 'play') riders.push(p);
  for (const e of enemies) if (e.state === 'play') riders.push(e);
  for (let i = 0; i < riders.length; i++){
    for (let j = i + 1; j < riders.length; j++){
      const a = riders[i], b = riders[j];
      if (a.clashCD > 0 || b.clashCD > 0) continue;
      if (!(a.x + 50 > b.x + 12 && b.x + 50 > a.x + 12 && a.y + 42 > b.y + 8 && b.y + 42 > a.y + 8)) continue;
      const dy = a.y - b.y; // lance height difference (lance row is fixed)
      if (Math.abs(dy) <= 5){ bounceApart(a, b); continue; }
      const loser = dy > 0 ? a : b, winner = dy > 0 ? b : a;
      if (loser.kind === 'enemy'){
        if (winner.kind === 'player') addScore(winner, CLS_PTS[loser.cls], riderCX(loser), loser.y, '#ffffff');
        unseatEnemy(loser, winner);
      } else {
        if (loser.invulnT > 0){ bounceApart(a, b); continue; }
        if (winner.kind === 'player'){
          let pts = 2000;
          if (waveInfo.glad && !waveInfo.gladDone){ pts = 3000; waveInfo.gladDone = true; popup(480, 250, 'GLADIATOR 3000', '#ffd21f'); }
          addScore(winner, pts, riderCX(loser), loser.y, '#ffffff');
          waveInfo.pvpUnseat = true;
        }
        killPlayer(loser);
      }
    }
  }
}

/* ---------------- entity updates ---------------- */
function playerInput(p){
  let l, r;
  if (p.idx === 0){ l = keys.has('ArrowLeft') || touch.p1L; r = keys.has('ArrowRight') || touch.p1R; }
  else { l = keys.has('KeyA') || touch.p2L; r = keys.has('KeyD') || touch.p2R; }
  return l && r ? 0 : l ? -1 : r ? 1 : 0;
}
function updatePlayer(p, dt){
  if (p.invulnT > 0) p.invulnT -= dt;
  if (p.state === 'dead'){
    p.respawnT -= dt;
    if (p.respawnT <= 0 && p.lives > 0){
      placePlayerSpawn(p); p.state = 'play'; p.invulnT = 2; SFX.zapUp();
    }
    return;
  }
  if (p.state !== 'play') return;
  stepRider(p, dt, playerInput(p), true);
}
const ENEMY_FLAP = [-300, -320, -335];
const ENEMY_CD = [0.46, 0.38, 0.30];
const ENEMY_SPD = [195, 240, 290];
function updateEnemy(e, dt){

      e.vx = (riderCX(e) < 480 ? 1 : -1) * 60;
      SFX.flap(0.4);
    }
    return;
  }
  if (e.state !== 'play') return;
  e.flapPow = ENEMY_FLAP[e.cls];
  let tp = null;
  for (const p of players) if (p.state === 'play'){ if (!tp || Math.abs(p.x - e.x) < Math.abs(tp.x - e.x)) tp = p; }
  const tcx = tp ? riderCX(tp) : 480, ty = tp ? tp.y : 300, tvx = tp ? tp.vx : 0;
  let wantX = tcx;
  if (e.cls === 0) wantX = tcx + Math.sin(game.time * 0.6 + e.seed) * 130;
  if (e.cls === 2) wantX = tcx + tvx * 0.35;
  const dx = wantX - riderCX(e);
  const dirIn = Math.abs(dx) > 12 ? (dx > 0 ? 1 : -1) : 0;
  e.flapCD -= dt;
  if (e.grounded){
    e.groundT += dt;
    if (e.groundT > 0.5 || ty < e.y - 30){ e.flapQ = true; e.groundT = 0; }
  } else {
    e.groundT = 0;
    const wantAbove = e.cls === 2 ? 26 : e.cls === 1 ? 16 : 6;
    const desiredY = Math.max(40, Math.min(545, ty - wantAbove));
    if (e.flapCD <= 0 && (e.y > desiredY + 8 || e.y > 556)){
      e.flapQ = true;
      e.flapCD = ENEMY_CD[e.cls] * (0.9 + Math.random() * 0.2);
    }
  }
  const spdCap = ENEMY_SPD[e.cls] + Math.min(40, game.wave * 3);
  stepRider(e, dt, dirIn, false);
  if (e.vx > spdCap) e.vx = spdCap;
  if (e.vx < -spdCap) e.vx = -spdCap;
}
function updateEgg(e, dt){
  if (!e.resting){
    const prevBottom = e.y + 11;
    e.vy += GRAV * dt;
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (e.x < 9) { e.x = 9; e.vx = Math.abs(e.vx) * 0.5; }
    if (e.x > VW - 9) { e.x = VW - 9; e.vx = -Math.abs(e.vx) * 0.5; }
    for (const pl of game.plats){
      if (e.x < pl.x || e.x > pl.x + pl.w) continue;
      if (prevBottom <= pl.y + 1 && e.y + 11 >= pl.y){
        if (e.vy > 170 && !e.bounced){ e.vy = -e.vy * 0.35; e.vx *= 0.5; e.bounced = true; e.y = pl.y - 11; }
        else { e.resting = true; e.plat = pl; e.y = pl.y - 11; e.vy = 0; e.vx = 0; e.landed = true; }
        break;
      }
    }
    if (e.y + 11 > LAVA_Y + 4){
      burst(e.x, LAVA_Y, 10, ['#ff5a1a', '#ffd21f'], 130, 260, 0.5);
      SFX.splash();
      e.dead = true;
    }
    return;
  }
  e.hatchT += dt;
  e.shake = e.hatchT > 6;
  if (e.hatchT >= 8){
    standings.push({x: e.x, feetY: e.plat.y, cls: Math.min(e.fromCls + 1, 2), t: 0, birdCalled: false, dead: false});
    SFX.hatch();
    burst(e.x, e.plat.y - 14, 7, ['#f2ead8', '#c9b896'], 80, 160, 0.4);
    e.dead = true;
  }
}
function updateStanding(s, dt){
  s.t += dt;
  if (s.t > 2.5 && !s.birdCalled){
    s.birdCalled = true;
    birds.push({mode: 'pickup', target: s, x: s.x < VW / 2 ? -70 : VW + 10, y: s.feetY - 72, vx: 0, t: 0});
  }
}
function updateBird(b, dt){
  b.t += dt;
  if (b.mode === 'leave'){
    b.x += b.vx * dt;
    b.y += Math.sin(b.t * 9) * 0.5;
    if (b.x < -90 || b.x > VW + 30) b.dead = true;
    return;
  }
  const s = b.target;
  if (!s || s.dead){ b.mode = 'leave'; b.vx = (b.x < VW / 2 ? -1 : 1) * 260; return; }
  const tx = s.x - 31, ty = s.feetY - 46;
  const dx = tx - b.x, dy = ty - b.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 16){
    const e = makeEnemy(s.cls, s.x - 31, s.feetY - 46);
    e.state = 'play'; e.grounded = false; e.vy = -170;
    enemies.push(e);
    s.dead = true; b.dead = true;
    SFX.flap(0.6);
    return;
  }
  const sp = 300, vx = dx / dist * sp, vy = dy / dist * sp;
  b.x += vx * dt; b.y += vy * dt;
}
function spawnPtero(){
  const fromLeft = Math.random() < 0.5;
  ptero = {x: fromLeft ? -90 : VW + 10, y: 250, baseY: 250, dir: fromLeft ? 1 : -1, vx: 0, t: 0, screechT: 0};
  SFX.screech(true);
}
function updatePtero(dt){
  if (!ptero) return;
  const pt = ptero;
  pt.t += dt;
  pt.screechT -= dt;
  if (pt.screechT <= 0){ pt.screechT = 2.4; SFX.screech(false); }
  let tp = null;
  for (const p of players) if (p.state === 'play'){ tp = p; break; }
  if (tp){
    const wantDir = riderCX(tp) > pt.x + 40 ? 1 : -1;
    pt.dir = wantDir;
    const targetY = Math.max(110, Math.min(520, tp.y));
    pt.baseY += (targetY - pt.baseY) * 0.85 * dt;
  }
  pt.vx += ((pt.dir * 340) - pt.vx) * 3 * dt;
  pt.x += pt.vx * dt;
  pt.y = pt.baseY + Math.sin(pt.t * 7) * 13;
  if (pt.x < -100) pt.x = VW + 12;
  if (pt.x > VW + 20) pt.x = -100;
  for (const p of players){
    if (p.state !== 'play') continue;
    const tipX = p.x + (p.dir > 0 ? 62 : 0), tipY = p.y + 14;
    const hx = pt.dir > 0 ? pt.x + 50 : pt.x - 2, hy = pt.y + 2;
    if (tipX > hx && tipX < hx + 32 && tipY > hy && tipY < hy + 22){
      addScore(p, 1000, pt.x + 40, pt.y, '#ffd21f');
      burst(pt.x + 40, pt.y + 16, 16, ['#d8a860', '#a8763e', '#efe6cc'], 160, 220, 0.7);
      SFX.poof();
      ptero = null;
      return;
    }
    if (p.invulnT <= 0 &&
        p.x + 50 > pt.x + 8 && pt.x + 72 > p.x + 12 && p.y + 42 > pt.y + 10 && pt.y + 32 > p.y + 8){
      killPlayer(p);
    }
  }
}
function updateTroll(dt){
  if (game.wave < 3){ return; }
  if (!hand){
    const riders = [];
    for (const p of players) if (p.state === 'play') riders.push(p);
    for (const e of enemies) if (e.state === 'play') riders.push(e);
    for (const r of riders){
      if (r.trollCD > 0 || r.grounded) continue;
      const feet = r.y + 46;
      if (feet <= LAVA_Y - 48) continue; // must be down in the lava band
      const cx = riderCX(r);
      // safe if a platform surface is right beneath (skimming/landing), else open lava
      const under = game.plats.some(pl => cx > pl.x - 6 && cx < pl.x + pl.w + 6 && pl.y >= feet - 2 && pl.y <= feet + 18);
      if (!under){
        hand = {x: cx, target: r, phase: 'rise', t: 0, flaps: 0};
        r.state = 'grabbed';
        SFX.grab();
        break;
      }
    }
    return;
  }
  const r = hand.target;
  if (!r || r.state !== 'grabbed'){ hand = null; return; }
  hand.t += dt;
  r.x = hand.x - 31;
  r.vx = 0; r.vy = 0;
  r.y = LAVA_Y - 76 - (hand.phase === 'drag' ? (hand.t / 0.35) * 56 : 0);
  if (hand.phase === 'rise' && hand.t > 0.25){ hand.phase = 'hold'; hand.t = 0; }
  else if (hand.phase === 'hold'){
    if (r.kind === 'player'){
      if (r.flapQ){ r.flapQ = false; hand.flaps++; SFX.flap(0.6); }
      if (hand.flaps >= 6) return trollEscape(r);
      if (hand.t > 1.6){ hand.phase = 'drag'; hand.t = 0; }
    } else {
      if (hand.t > 1.0 && Math.random() < 0.5) return trollEscape(r);
      if (hand.t > 1.35){ hand.phase = 'drag'; hand.t = 0; }
    }
  }
  else if (hand.phase === 'drag' && hand.t > 0.35){
    burst(hand.x, LAVA_Y, 16, ['#ff5a1a', '#ffd21f', '#ff8a3a'], 170, 300, 0.6);
    SFX.splash();
    if (r.kind === 'player') killPlayer(r); else r.state = 'gone';
    hand = null;
  }
}
function trollEscape(r){
  r.state = 'play';
  r.vy = -390; r.grounded = false; r.trollCD = 2.5;
  SFX.flap(1);
  hand = null;
}
function playerVsStandingEggs(){
  for (const p of players){
    if (p.state !== 'play') continue;
    for (const s of standings){
      if (s.dead) continue;
      if (p.x + 50 > s.x - 11 && s.x + 11 > p.x + 12 && p.y + 42 > s.feetY - 28 && s.feetY > p.y + 8){
        addScore(p, CLS_PTS[s.cls], s.x, s.feetY - 34, '#ffffff');
        burst(s.x, s.feetY - 14, 10, ['#ffffff', PAL[CLS_PAL[s.cls]].Y], 120, 180, 0.5);
        SFX.clank();
        s.dead = true;
      }
    }
    for (const e of eggs){
      if (e.dead) continue;
      if (p.x + 50 > e.x - 9 && e.x + 9 > p.x + 12 && p.y + 42 > e.y - 11 && e.y + 11 > p.y + 8){
        const ladder = [250, 500, 750, 1000];
        let pts = ladder[Math.min(p.eggsWave, 3)];
        if (!e.landed){ pts += 500; popup(e.x, e.y - 26, '+500 AIR', '#ffd21f'); }
        p.eggsWave++;
        addScore(p, pts, e.x, e.y - 14, '#ffffff');
        SFX.egg(p.eggsWave);
        burst(e.x, e.y, 6, ['#f2ead8', '#ffd21f'], 70, 120, 0.35);
        e.dead = true;
      }
    }
  }
}

/* ---------------- main update ---------------- */
function update(dt){
  game.time += dt;
  if (game.state === 'intro'){
    game.introT -= dt;
    if (game.introT <= 0){
      game.state = 'play';
      SFX.blip();
      if (waveInfo.pteroStart && !ptero) spawnPtero();
    }
    return;
  }
  if (game.state === 'clear'){
    game.clearT -= dt;
    stepFx(dt);
    if (game.clearT <= 0) nextWave();
    return;
  }
  if (game.state !== 'play' || game.paused) return;
  waveInfo.time += dt;
  for (const p of players) updatePlayer(p, dt);
  if (spawnQueue > 0){
    spawnTimer -= dt;
    const active = enemies.filter(e => e.state === 'play' || e.state === 'spawn').length;
    const maxConc = Math.min(6, 3 + Math.floor(game.wave / 2));
    if (spawnTimer <= 0 && active < maxConc){
      spawnEnemy(); spawnQueue--; spawnTimer = 1.5;
    }
  }
  for (const e of enemies) updateEnemy(e, dt);
  enemies = enemies.filter(e => e.state !== 'gone');
  for (const e of eggs) updateEgg(e, dt);
  eggs = eggs.filter(e => !e.dead);
  for (const s of standings) updateStanding(s, dt);
  standings = standings.filter(s => !s.dead);
  for (const b of birds) updateBird(b, dt);
  birds = birds.filter(b => !b.dead);
  combat();
  playerVsStandingEggs();
  updatePtero(dt);
  updateTroll(dt);
  if (!waveInfo.pteroTimerDone && waveInfo.time > 40 && !ptero && (enemies.length > 0 || spawnQueue > 0)){
    waveInfo.pteroTimerDone = true;
    spawnPtero();
  }
  stepFx(dt);
  /* game over? */
  if (players.every(p => p.state === 'out')){
    game.overT += dt;
    if (game.overT > 1.2){ game.state = 'gameover'; }
    return;
  }
  game.overT = 0;
  /* wave clear? */
  const anyAlive = players.some(p => p.state === 'play' || p.state === 'dead' || p.state === 'grabbed');
  if (anyAlive && spawnQueue <= 0 && enemies.length === 0 && eggs.length === 0 &&
      standings.length === 0 && birds.length === 0 && !ptero){
    if (waveInfo.team){
      if (!waveInfo.pvpUnseat){
        for (const p of players) if (p.state !== 'out'){ addScore(p, 3000, 480, 250, '#ffd21f'); }
        popup(480, 210, 'TEAM 3000 EACH', '#ffd21f');
      }
    } else if (waveInfo.surv && players.length === 1){
      if (!waveInfo.lostLife[0] && players[0].state !== 'out'){
        addScore(players[0], 3000, 480, 250, '#ffd21f');
        popup(480, 210, 'SURVIVAL 3000', '#ffd21f');
      }
    }
    game.state = 'clear';
    game.clearT = 1.6;
    SFX.blip();
  }
}
function stepFx(dt){
  for (const pt of particles){
    pt.t += dt;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vy += (pt.grav || 0) * dt;
  }
  particles = particles.filter(p => p.t < p.life);
  for (const pp of popups) pp.t += dt;
  popups = popups.filter(p => p.t < 0.95);
}

/* ---------------- rendering ---------------- */
function drawLava(t){
  const g = ctx.createLinearGradient(0, LAVA_Y, 0, VH);
  g.addColorStop(0, '#ff5a1a'); g.addColorStop(0.25, '#f03c0c'); g.addColorStop(1, '#c21404');
  ctx.fillStyle = g;
  ctx.fillRect(0, LAVA_Y, VW, VH - LAVA_Y);
  ctx.fillStyle = '#ff8a3a';
  ctx.fillRect(0, LAVA_Y, VW, 2);
  for (let i = 0; i < 30; i++){
    const bx = ((i * 173 + 41) % 940) + 10;
    const ph = (t * 0.7 + i * 0.37) % 1;
    const by = LAVA_Y + 6 + ((i * 29) % 20) - ph * 5;
    ctx.fillStyle = ph < 0.5 ? 'rgba(255,176,58,0.8)' : 'rgba(255,90,26,0.5)';
    ctx.fillRect(bx, by, 3, 2);
  }
}
function drawArena(plats, withHUD){
  drawLava(game.time);
  let basePresent = false;
  for (const pl of plats){
    if (pl.base){ basePresent = true; ctx.drawImage(pl.tex, pl.x, pl.y); }
    else ctx.drawImage(pl.tex, pl.x, pl.y);
  }
  if (withHUD){
    let slotY;
    if (basePresent) slotY = 652 + 12;
    else { ctx.drawImage(BAR_TEX, 150, 676); slotY = 676 + 10; }
    drawPanel(slotY);
  }
}
function drawPanel(slotY){
  for (let i = 0; i < players.length; i++){
    const p = players[i];
    const sx = i === 0 ? SLOT.x1 : SLOT.x2;
    const col = i === 0 ? '#ffd21f' : '#5aa2ff';
    const sTxt = '' + p.score;
    drawText(sTxt, sx + 10, slotY + 6, 2, col);
    const iconX = sx + 10 + textW(sTxt, 2) + 10;
    const n = Math.min(Math.max(p.lives, 0), 6);
    for (let k = 0; k < n; k++){
      ctx.drawImage(SPR[p.palKey].icon, iconX + k * 17, slotY + 4);
    }
  }
}
function drawSpriteFlipped(spr, x, y, dir, alpha){
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  if (dir < 0){
    ctx.translate(Math.round(x) + spr.width / 2, Math.round(y));
    ctx.scale(-1, 1);
    ctx.drawImage(spr, -spr.width / 2, 0);
  } else {
    ctx.drawImage(spr, Math.round(x), Math.round(y));
  }
  ctx.restore();
}
function riderSprite(e){
  const S = SPR[e.palKey];
  if (e.grounded){
    if (Math.abs(e.vx) > 25) return (Math.floor(e.runDist / 26) % 2 === 0) ? S.standA : S.standB;
    return S.standA;
  }
  return (Math.floor(game.time * 7 + (e.seed || 0) * 3) % 2 === 0) ? S.flyA : S.flyB;
}
function drawRider(e){
  if (e.state === 'gone' || e.state === 'out' || e.state === 'dead') return;
  let alpha = 1;
  if (e.state === 'spawn') alpha = 1 - (e.spawnT / 0.6) * 0.75;
  if (e.kind === 'player' && e.invulnT > 0 && Math.floor(game.time * 14) % 2 === 0) alpha = 0.35;
  drawSpriteFlipped(riderSprite(e), e.x, e.y, e.dir, alpha);
}
function drawEntities(){
  for (const e of eggs){
    const sx = e.shake ? (Math.random() < 0.5 ? -1 : 1) : 0;
    ctx.drawImage(SPR.egg, Math.round(e.x - 9 + sx), Math.round(e.y - 11));
  }
  for (const s of standings){
    if (s.dead) continue;
    drawSpriteFlipped(SPR[CLS_PAL[s.cls]].knight, s.x - 12, s.feetY - 28, 1, 1);
  }
  if (hand){
    const rise = hand.phase === 'rise' ? (0.25 - Math.min(hand.t, 0.25)) / 0.25 * 30 : 0;
    ctx.drawImage(SPR.hand, Math.round(hand.x - 14), Math.round(LAVA_Y - 36 + rise));
  }
  for (const b of birds){
    const spr = Math.floor(game.time * 8 + b.t * 3) % 2 === 0 ? SPR.birdA : SPR.birdB;
    drawSpriteFlipped(spr, b.x, b.y, b.mode === 'leave' ? Math.sign(b.vx) : (b.target && b.target.x > b.x + 31 ? 1 : -1), 1);
  }
  for (const e of enemies) drawRider(e);
  for (const p of players) drawRider(p);
  if (ptero){
    const spr = Math.floor(game.time * 6) % 2 === 0 ? SPR.pteroA : SPR.pteroB;
    drawSpriteFlipped(spr, ptero.x, ptero.y, ptero.dir, 1);
  }
  for (const pt of particles){
    ctx.globalAlpha = Math.max(0, 1 - pt.t / pt.life);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  for (const pp of popups){
    ctx.globalAlpha = Math.max(0, 1 - pp.t / 0.95);
    drawTextC(pp.text, pp.x, pp.y - pp.t * 34, 2, pp.color);
  }
  ctx.globalAlpha = 1;
}
function drawIntro(){
  drawTextC('WAVE ' + game.wave, 480, 258, 5, '#ffd21f');
  if (waveInfo.letter) drawText(waveInfo.letter, 918, 630, 3, '#ffd21f');
  if (waveInfo.team){
    drawTextC('TEAM WAVE', 480, 330, 4, '#ffd21f');
    drawTextC('WORK TOGETHER - 3000 EACH', 480, 386, 2, '#ffffff');
  } else if (waveInfo.glad){
    drawTextC('GLADIATOR WAVE', 480, 330, 4, '#ffd21f');
    drawTextC('FIRST UNSEAT WINS 3000', 480, 386, 2, '#ffffff');
  } else if (waveInfo.egg){
    drawTextC('EGG WAVE', 480, 330, 4, '#ffd21f');
    drawTextC('COLLECT THEM BEFORE THEY HATCH', 480, 386, 2, '#ffffff');
  } else if (waveInfo.surv){
    drawText('COLLECT 3000 SURVIVAL POINTS', 70, 470, 3, '#ffd21f');
  } else if (waveInfo.pteroStart){
    drawTextC('BEWARE THE PTERODACTYL', 480, 330, 3, '#ffd21f');
  }
}
function drawTitle(){
  drawArena(PLATS_ALL, false);
  drawTextC('HIGH SCORE', 480, 26, 2, '#e63229');
  drawTextC('' + game.high, 480, 48, 2, '#ffffff');
  drawText('JOUST', Math.round(480 - textW('JOUST', 13) / 2) + 5, 113, 13, '#a31f18');
  drawTextC('JOUST', 480, 108, 13, '#ffd21f');
  drawTextC('WILLIAMS 1982', 480, 212, 2, '#9aa7b4');
  const opts = ['1 PLAYER', '2 PLAYERS'];
  for (let i = 0; i < 2; i++){
    const y = 306 + i * 50;
    const col = i === titleSel ? '#ffd21f' : '#8a8f6a';
    drawTextC(opts[i], 480, y, 3, col);
    if (i === titleSel) drawText('>', 480 - textW(opts[i], 3) / 2 - 34, y, 3, '#ffd21f');
  }
  drawTextC('P1: ARROWS MOVE - UP OR SPACE FLAP', 480, 500, 2, '#c8cdd4');
  drawTextC('P2: A D MOVE - W FLAP', 480, 528, 2, '#c8cdd4');
  drawTextC('P PAUSE - M MUTE', 480, 556, 2, '#8a8f6a');
  if (Math.floor(game.time * 1.6) % 2 === 0)
    drawTextC('INSERT COIN', 480, 598, 2, '#ffd21f');
  drawTextC('UNSEAT RIDERS - GRAB THE EGGS', 480, 630, 2, '#8a8f6a');
}
function drawGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, VW, VH);
  drawTextC('GAME OVER', 480, 210, 8, '#e63229');
  players.forEach((p, i) => {
    const col = i === 0 ? '#ffd21f' : '#5aa2ff';
    drawTextC('P' + (i + 1) + '  ' + p.score, 480, 330 + i * 44, 3, col);
  });
  drawTextC('HIGH SCORE ' + game.high, 480, 440, 2, '#ffffff');
  if (Math.floor(game.time * 1.6) % 2 === 0)
    drawTextC('PRESS ENTER', 480, 520, 2, '#ffd21f');
}
function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, VW, VH);
  if (game.state === 'title'){ drawTitle(); return; }
  drawArena(game.plats, true);
  drawEntities();
  if (game.state === 'intro') drawIntro();
  if (game.state === 'gameover') drawGameOver();
  if (game.paused){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, VW, VH);
    drawTextC('PAUSED', 480, 330, 5, '#ffd21f');
  }
}

/* ---------------- main loop + fit ---------------- */
let lastT = 0, acc = 0;
const STEP = 1 / 60;
function loop(ts){
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  let frame = (ts - lastT) / 1000;
  lastT = ts;
  if (frame > 0.25) frame = 0.25;
  acc += frame;
  while (acc >= STEP){
    if (!game.paused) update(STEP);
    acc -= STEP;
  }
  draw();
}
function fit(){
  const legend = document.getElementById('legend');
  const lh = legend ? legend.offsetHeight : 24;
  const availW = window.innerWidth, availH = window.innerHeight - lh;
  const sc = Math.min(availW / VW, availH / VH);
  cv.style.width = Math.floor(VW * sc) + 'px';
  cv.style.height = Math.floor(VH * sc) + 'px';
}
window.addEventListener('resize', fit);
fit();
requestAnimationFrame(loop);
</script>
