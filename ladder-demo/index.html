<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lighting — a living photo that ripens</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a1024;overflow:hidden;}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef0fa;}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:18px 12px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box;}
  #bgBlur{position:absolute;inset:-40px;background:url('../christmas-scene/still.jpg') center/cover no-repeat;filter:blur(34px) brightness(.42);z-index:0;}
  header{position:relative;z-index:2;text-align:center;pointer-events:none;}
  h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;}
  h1 .sub{display:block;margin-top:5px;font-size:11px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:#e8c47c;}
  #expl{position:relative;z-index:2;margin:0;max-width:520px;text-align:center;font-size:13px;line-height:1.45;color:rgba(238,240,250,.72);}
  #frame{position:relative;z-index:1;width:min(94vw,112vh);aspect-ratio:16/9;overflow:hidden;background:#101736;box-shadow:0 30px 90px rgba(0,0,0,.65);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .layer{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #night{opacity:0;transition:opacity 3.2s ease;}
  /* Ignition wrapper: the twinkle lives on the child, the waking on the parent. */
  .ig{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity 1.1s ease;pointer-events:none;mix-blend-mode:screen;border-radius:50%;}
  .ig.on{opacity:1;}
  .ig>i{display:block;width:100%;height:100%;border-radius:50%;}
  .noround,.noround>i{border-radius:0;}
  .bulbI{background:radial-gradient(closest-side, rgba(255,230,160,.95), rgba(255,190,90,.32) 55%, rgba(255,190,90,0) 75%);animation:twk ease-in-out infinite alternate;}
  .stringI{background:radial-gradient(closest-side, rgba(255,226,170,.9), rgba(255,200,110,0) 70%);animation:twk ease-in-out infinite alternate;}
  .starI{background:radial-gradient(closest-side, rgba(240,246,255,.95), rgba(200,220,255,0) 70%);animation:twk ease-in-out infinite alternate;}
  @keyframes twk{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1.18)}}
  .lampI{background:radial-gradient(closest-side, rgba(255,196,100,.5), rgba(255,170,80,0) 70%);animation:breathe 4.9s ease-in-out infinite alternate;}
  .winI{background:radial-gradient(closest-side, rgba(255,198,105,.42), rgba(255,175,85,0) 70%);animation:breathe 5.4s ease-in-out infinite alternate;}
  @keyframes breathe{from{opacity:.38}to{opacity:.75}}
  #starGlowI{display:block;position:absolute;inset:0;background:radial-gradient(50% 50% at 50% 50%, rgba(255,214,110,.5), rgba(255,180,70,.16) 55%, rgba(255,180,70,0) 75%);animation:starbreathe 5.2s ease-in-out infinite;}
  @keyframes starbreathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.07)}}
  #epitaph{position:relative;z-index:2;margin:2px 0 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:17px;color:#f3e9d2;text-align:center;min-height:22px;}
  #advance{position:relative;z-index:2;appearance:none;cursor:pointer;margin-top:2px;padding:12px 28px;border-radius:999px;border:1px solid rgba(232,196,124,.8);background:rgba(24,18,6,.55);color:#eec987;font-size:14px;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s ease,background .25s;}
  #advance:hover{background:rgba(52,38,10,.65);}
  #advance.gone{opacity:0;pointer-events:none;}
  #reset{position:relative;z-index:2;background:none;border:0;cursor:pointer;font-size:12px;color:rgba(238,240,250,.45);text-decoration:underline;text-underline-offset:3px;padding:2px 6px;transition:opacity .4s;}
  #reset.gone{opacity:0;pointer-events:none;}
  #fsBtn{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top));z-index:5;width:38px;height:38px;border-radius:50%;border:1px solid rgba(238,240,250,.25);background:rgba(8,10,26,.5);color:rgba(238,240,250,.85);font-size:16px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  body.instant .ig, body.instant #night{transition:none!important;}
  body.rm .ig, body.rm #night{transition-duration:.01s!important;}
</style>
</head>
<body>
<div id="stage">
  <div id="bgBlur"></div>
  <header>
    <h1>The Lighting<span class="sub">a living photo that ripens</span></h1>
  </header>
  <p id="expl">Tap the picture — or the button — to light the village, one family of lights at a time. It remembers where you left it.</p>
  <div id="frame" role="img" aria-label="A living Christmas village at dusk: a great tree of golden lights crowned with a shining star in a snowy stone plaza, lamps, shop windows, garlands strung between the houses, and a church spire across the water under a starry sky. It lights up in stages as you tap.">
    <img class="layer" src="../christmas-scene/still.jpg" alt="">
    <img class="layer" id="night" src="../christmas-scene/night.jpg" alt="">
  </div>
  <p id="epitaph" aria-live="polite"></p>
  <button id="advance" type="button"></button>
  <button id="reset" type="button" class="gone">start over</button>
</div>
<button id="fsBtn" type="button" aria-label="Full screen">&#9974;</button>
<script>
(() => {
"use strict";
const frame = document.getElementById('frame');
const night = document.getElementById('night');
const epitaph = document.getElementById('epitaph');
const adv = document.getElementById('advance');
const resetBtn = document.getElementById('reset');
const RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
if (RM) document.body.classList.add('rm');
/* The Christmas Village light map, reused from christmas-scene — same points, same clocks. */
const LAMPS = [[13.0,31.3,7.0,11.0,4.9,0.0],[89.2,34.2,7.0,11.0,5.3,-2.0],[22.5,49.0,4.5,7.5,4.6,-1.0],[34.8,53.4,3.5,6.0,5.6,-3.0],[80.7,46.4,4.5,7.5,5.0,-1.5]];
const SHOPS = [[20.3,45.6,5.0,8.0,5.9,-2.0],[66.5,48.6,3.6,7.5,5.8,-0.5],[84.7,43.4,4.5,7.0,5.6,-4.4],[1.0,56.8,6.5,12.0,5.7,-0.8],[98.8,56.3,5.5,11.0,5.3,-2.8]];
const HOUSES = [[3.4,17.9,5.5,9.0,5.4,0.0],[19.6,59.3,4.5,7.0,5.1,-3.5],[29.4,50.1,4.5,7.0,6.2,-1.0],[31.2,61.3,4.5,7.0,5.5,-4.0],[68.5,37.2,2.6,5.0,6.4,-2.5],[96.6,39.3,5.0,8.0,5.2,-1.2],[94.1,23.1,4.5,7.0,6.0,-3.2]];
const GARL = [[0.4,46.2,2.9,-0.0],[1.4,46.6,3.5,-1.0],[2.5,47.1,4.1,-2.0],[3.6,47.5,2.9,-3.0],[4.7,48,3.5,-4.0],[5.8,48.4,4.1,-5.0],[6.9,48.9,2.9,-6.0],[7.9,49.4,3.5,-7.0],[9,49.8,4.1,-8.0],[10,50.3,2.9,-9.0],[71.4,56.8,2.9,-0.0],[72.4,56.5,3.5,-0.9],[73.4,56.2,4.1,-1.8],[74.6,55.9,2.9,-2.7],[75.7,55.6,3.5,-3.6],[76.8,55.3,4.1,-4.5],[78.1,55,2.9,-5.4],[79.3,54.7,3.5,-6.3],[81,54.2,4.1,-7.2],[82.2,53.9,2.9,-8.1],[83.4,53.6,3.5,-9.0],[84.6,53.3,4.1,-9.9],[85.8,53,2.9,-10.8],[87,52.7,3.5,-11.7],[88.3,52.3,4.1,-12.6],[89.6,52,2.9,-13.5],[90.9,51.7,3.5,-14.4],[92.2,51.4,4.1,-15.3],[93.5,51.2,2.9,-16.2],[94.8,50.9,3.5,-17.1],[96.1,50.6,4.1,-18.0],[97.4,50.4,2.9,-18.9],[98.7,50.1,3.5,-19.8],[99.8,49.8,4.1,-20.7]];
const TREE = [[50.1,9.5,2.1,-0.0],[48.5,11.9,2.55,-0.55],[50.8,12.7,3.0,-1.1],[49.4,14.4,3.45,-1.65],[46.6,16.8,3.9,-2.2],[49.4,17.4,2.1,-2.75],[52,18.1,2.55,-3.3],[54.2,19.1,3.0,-3.85],[47.9,20.4,3.45,-4.4],[50.6,21.3,3.9,-4.95],[52.7,22.4,2.1,-5.5],[45.2,22.9,2.55,-6.05],[47.7,24,3.0,-6.6],[50.6,24.9,3.45,-7.15],[54.4,24.9,3.9,-7.7],[45.3,26.4,2.1,-8.25],[48.2,26.7,2.55,-8.8],[51.5,27.3,3.0,-9.35],[55.1,27.1,3.45,-9.9],[46.6,28.8,3.9,-10.45],[49.6,28.8,2.1,-11.0],[53,29.3,2.55,-11.55],[56.1,29.7,3.0,-12.1],[43.8,30.9,3.45,-12.65],[47,31.3,3.9,-13.2],[50.1,31.6,2.1,-13.75],[53.5,31.8,2.55,-14.3],[56.9,32.9,3.0,-14.85],[44.8,33.2,3.45,-15.4],[48,34,3.9,-15.95],[51.1,34.6,2.1,-16.5],[54.5,34.9,2.55,-17.05],[42.3,35.7,3.0,-17.6],[45.8,36.5,3.45,-18.15],[49,37.1,3.9,-18.7],[52.2,37.4,2.1,-19.25],[55.5,38,2.55,-19.8],[58.5,38.2,3.0,-20.35],[43.4,38.9,3.45,-20.9],[46.7,39.6,3.9,-21.45],[49.8,40,2.1,-22.0],[53,40.3,2.55,-22.55],[56.3,41,3.0,-23.1],[40.9,42,3.45,-23.65],[44.2,42.8,3.9,-24.2],[47.5,43.2,2.1,-24.75],[54,43.6,2.55,-25.3],[57.2,44.2,3.0,-25.85],[41.8,45.2,3.45,-26.4],[45,45.8,3.9,-26.95],[48.3,46.4,2.1,-27.5],[51.6,46.7,2.55,-28.05],[54.8,47.2,3.0,-28.6],[58,47.8,3.45,-29.15],[39.8,48.2,3.9,-29.7],[43,49,2.1,-30.25],[46.1,49.6,2.55,-30.8],[49.4,50,3.0,-31.35],[52.7,50.5,3.45,-31.9],[55.8,51,3.9,-32.45],[59.2,51.7,2.1,-33.0],[41,52.2,2.55,-33.55],[44.2,52.9,3.0,-34.1],[47.5,53.4,3.45,-34.65],[50.7,53.8,3.9,-35.2],[54,54.4,2.1,-35.75],[57.2,55,2.55,-36.3],[60.1,55.8,3.0,-36.85],[38.8,56.2,3.45,-37.4],[42,57,3.9,-37.95],[45.3,57.6,2.1,-38.5],[48.6,58.1,2.55,-39.05],[51.9,58.7,3.0,-39.6],[55.1,59.3,3.45,-40.15],[58.3,59.9,3.9,-40.7],[61.3,60.4,2.1,-41.25],[39.8,60.3,2.55,-41.8],[43,61,3.0,-42.35],[46.3,61.6,3.45,-42.9],[49.6,62.2,3.9,-43.45],[52.9,62.7,2.1,-44.0],[56.1,63.3,2.55,-44.55],[59.3,64,3.0,-45.1],[37.1,63.1,3.45,-45.65],[40.4,63.9,3.9,-46.2],[43.7,64.6,2.1,-46.75],[47,65.1,2.55,-47.3],[50.3,65.6,3.0,-47.85],[53.5,66.2,3.45,-48.4],[56.8,66.8,3.9,-48.95],[60,67.3,2.1,-49.5],[35.3,66.1,2.55,-50.05],[38.5,66.9,3.0,-50.6],[41.8,67.5,3.45,-51.15],[45.1,68.1,3.9,-51.7],[48.4,68.6,2.1,-52.25],[51.7,69.1,2.55,-52.8],[54.9,69.6,3.0,-53.35],[58.2,70.2,3.45,-53.9],[43.6,71.3,3.9,-54.45],[50.5,71.8,2.1,-55.0],[56.5,71.3,2.55,-55.55]];
const STARS = [[21,7.9,2.6,-0.0],[42.2,6.9,3.2,-0.85],[44.7,8.3,3.8,-1.7],[84.2,4.5,4.4,-2.55],[63.6,9,2.6,-3.4],[4.8,2.8,3.2,-4.25],[19.5,6.7,3.8,-5.1],[69.4,7.4,4.4,-5.95],[36.6,3.9,2.6,-6.8],[76.6,2.9,3.2,-7.65],[58.8,9.6,3.8,-8.5],[15.2,11.4,4.4,-9.35],[89.4,10.8,2.6,-10.2],[30.8,5.2,3.2,-11.05]];
const groups = [[], [], [], [], [], [], []]; /* tiers 1..6 */
function mk(cls, x, y, w, h, dur, dl, tier){
  const o = document.createElement('span');
  o.className = 'ig';
  o.style.left = x + '%'; o.style.top = y + '%'; o.style.width = w + '%';
  if (h) o.style.height = h + '%'; else o.style.aspectRatio = '1';
  const i = document.createElement('i');
  i.className = cls;
  i.style.animationDuration = dur + 's'; i.style.animationDelay = dl + 's';
  o.appendChild(i); frame.appendChild(o); groups[tier].push(o);
  return o;
}
LAMPS.forEach(p => mk('lampI', p[0], p[1], p[2], p[3], p[4], p[5], 1));
SHOPS.forEach(p => mk('winI', p[0], p[1], p[2], p[3], p[4], p[5], 2));
GARL.forEach(p => mk('stringI', p[0], p[1], 0.8, null, p[2], p[3], 3));
HOUSES.forEach(p => mk('winI', p[0], p[1], p[2], p[3], p[4], p[5], 4));
TREE.forEach(p => mk('bulbI', p[0], p[1], 1.15, null, p[2], p[3], 5));
/* the star crowns the tree last */
const sg = document.createElement('span');
sg.className = 'ig noround';
sg.style.left = '49.6%'; sg.style.top = '5.4%'; sg.style.width = '13%'; sg.style.height = '19%';
sg.style.transitionDuration = '2.6s';
const sgi = document.createElement('span'); sgi.id = 'starGlowI';
sg.appendChild(sgi); frame.appendChild(sg); groups[6].push(sg);
STARS.forEach(p => mk('starI', p[0], p[1], 0.55, null, p[2], p[3], 6));
const LINES = [
  "Dusk. The village is holding its breath.",
  "The lamps wake first.",
  "The shops open their eyes.",
  "The garlands remember the season.",
  "Every house is home now.",
  "The tree takes its time.",
  "The village is lit. Merry Christmas."
];
const NEXT = ["Light the lamps", "Wake the shops", "String the garlands", "Bring the houses home", "Light the tree", "Raise the star"];
const STEP = {1: 380, 2: 320, 3: 85, 4: 320, 5: 42, 6: 140};
const NIGHTOP = [0, .07, .13, .19, .25, .33, 1];
let tier = 0;
try {
  const s = parseInt(localStorage.getItem('theLightingTier'), 10);
  if (s >= 0 && s <= 6) tier = s;
} catch (e) {}
function save(){ try { localStorage.setItem('theLightingTier', String(tier)); } catch (e) {} }
function render(instant){
  if (instant) document.body.classList.add('instant');
  for (let t = 1; t <= 6; t++){
    groups[t].forEach((el, idx) => {
      if (t <= tier){
        el.style.transitionDelay = (!instant && !RM) ? (idx * STEP[t]) + 'ms' : '0ms';
        el.classList.add('on');
      } else {
        el.style.transitionDelay = '0ms';
        el.classList.remove('on');
      }
    });
  }
  night.style.opacity = NIGHTOP[tier];
  frame.style.boxShadow = '0 30px 90px rgba(0,0,0,.65), 0 0 ' + (18 + tier * 16) + 'px rgba(255,180,80,' + (0.03 + tier * 0.04).toFixed(3) + ')';
  epitaph.textContent = LINES[tier];
  if (tier >= 6){ adv.classList.add('gone'); adv.textContent = ''; }
  else { adv.classList.remove('gone'); adv.textContent = NEXT[tier]; }
  resetBtn.classList.toggle('gone', tier === 0);
  if (instant){ void frame.offsetWidth; document.body.classList.remove('instant'); }
}
function advance(){
  if (tier >= 6) return;
  tier++; save(); render(false);
}
frame.addEventListener('click', advance);
adv.addEventListener('click', e => { e.stopPropagation(); advance(); });
resetBtn.addEventListener('click', e => { e.stopPropagation(); tier = 0; save(); render(false); });
document.getElementById('fsBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
});
render(true);
})();
</script>
</body>
</html>
