<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#07080c" />
  <link rel="icon" href="data:," />
  <title>Light Bright Reborn</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap');

    :root {
      color-scheme: light dark;
      --night: #07080c;
      --night-2: #11131a;
      --ink: #17181c;
      --muted: #5e5f65;
      --cream: #f4f1e8;
      --shell-hi: #fffef9;
      --shell: #ebe8df;
      --shell-lo: #c8c4b9;
      --orange: #ef5b22;
      --gold: #f5b323;
      --focus: #1e78d7;
      --brightness: 1;
      --gap: clamp(2px, .45vmin, 5px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --night: #030407;
        --night-2: #0b0d12;
        --ink: #f8f5eb;
        --muted: #bbb8ae;
        --cream: #d9d5ca;
        --shell-hi: #f5f2e9;
        --shell: #dedad0;
        --shell-lo: #aaa69d;
        --focus: #73b8ff;
      }
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 12%, rgba(255,255,255,.05), transparent 25%),
        linear-gradient(150deg, #171922 0%, var(--night) 62%);
      color: var(--ink);
      font-family: "Nunito", ui-rounded, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .template-btn, .guide-toggle, .effect-btn { touch-action: manipulation; }

    .app {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
    }

    .toy {
      width: min(1180px, 100%);
      height: min(780px, 100%);
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 244px;
      grid-template-areas: "screen console";
      gap: clamp(12px, 2vw, 24px);
      padding: clamp(13px, 2vw, 24px);
      border-radius: 34px 34px 42px 42px;
      background:
        linear-gradient(90deg, transparent 0 55%, rgba(255,255,255,.38) 55% 56%, transparent 56% 100%),
        linear-gradient(145deg, var(--shell-hi), var(--shell) 52%, var(--shell-lo));
      border: 2px solid rgba(255,255,255,.74);
      box-shadow:
        0 24px 80px rgba(0,0,0,.55),
        0 4px 0 #9d998f,
        inset 0 2px 3px rgba(255,255,255,.95),
        inset 0 -3px 7px rgba(55,48,33,.18);
      position: relative;
    }

    .screen-wrap {
      grid-area: screen;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      position: relative;
      padding: clamp(10px, 1.6vmin, 17px);
      border-radius: 24px 24px 29px 29px;
      background: #25262a;
      border: 3px solid #b7b3aa;
      box-shadow: inset 0 0 0 2px #101114, inset 0 0 20px #000, 0 2px 0 #fff;
    }

    .screen {
      width: min(100%, 660px, calc(100vh - 180px));
      width: min(100%, 660px, calc(100dvh - 180px));
      height: auto;
      max-height: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      grid-template-rows: repeat(15, minmax(0, 1fr));
      gap: var(--gap);
      padding: clamp(8px, 1.4vmin, 16px);
      border-radius: 12px;
      background-color: #050609;
      background-image:
        radial-gradient(circle at 48% 42%, rgba(255,255,255,.025) 0 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.01), rgba(0,0,0,.2));
      background-size: 5px 5px, 100% 100%;
      box-shadow: inset 0 0 42px #000, inset 0 0 0 2px #000, 0 0 0 1px #555;
      touch-action: none;
      user-select: none;
    }

    .hole {
      appearance: none;
      width: 100%;
      aspect-ratio: 1;
      align-self: center;
      justify-self: center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      position: relative;
      background:
        radial-gradient(circle at 42% 40%, #101319 0 20%, #030406 42%, #000 66%, #17191f 72%, #050609 83%);
      box-shadow: inset 0 1px 2px rgba(255,255,255,.1), 0 1px 0 rgba(255,255,255,.035);
      transition: transform 90ms ease, filter 140ms ease;
    }
    .hole::after {
      content: "";
      position: absolute;
      inset: 21%;
      border-radius: 50%;
      background: #020205;
      box-shadow: inset 0 1px 2px #000;
    }
    .hole:hover { filter: brightness(1.35); }
    .hole:active { transform: scale(.78); }
    .hole:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; z-index: 4; }

    .hole.filled {
      z-index: 2;
      transform: scale(.96);
      background:
        radial-gradient(circle at 34% 25%, rgba(255,255,255,.98) 0 4%, rgba(255,255,255,.58) 5% 11%, transparent 13%),
        radial-gradient(circle at 48% 46%, color-mix(in srgb, var(--peg) 78%, white) 0 24%, var(--peg) 48%, color-mix(in srgb, var(--peg) 52%, black) 72%, transparent 75%);
      box-shadow:
        0 0 calc(8px * var(--brightness)) color-mix(in srgb, var(--peg) 88%, white),
        0 0 calc(18px * var(--brightness)) color-mix(in srgb, var(--peg) 72%, transparent),
        0 0 calc(31px * var(--brightness)) color-mix(in srgb, var(--peg) 28%, transparent),
        inset -2px -3px 4px rgba(0,0,0,.35),
        inset 2px 2px 3px rgba(255,255,255,.42);
      filter: saturate(1.25) brightness(calc(.85 + (.26 * var(--brightness))));
      animation: pegIn 170ms cubic-bezier(.2, 1.9, .55, 1);
    }
    .hole.filled::after {
      inset: 17%;
      background: radial-gradient(circle at 42% 35%, rgba(255,255,255,.36), transparent 56%);
      box-shadow: inset 0 0 2px rgba(255,255,255,.7);
    }
    .hole.guide:not(.filled)::before {
      content: "";
      position: absolute;
      inset: 8%;
      z-index: 1;
      border-radius: 50%;
      border: clamp(1px, .24vmin, 2px) solid var(--guide, #ffe33c);
      background: color-mix(in srgb, var(--guide, #ffe33c) 14%, transparent);
      box-shadow: 0 0 7px color-mix(in srgb, var(--guide, #ffe33c) 38%, transparent), inset 0 0 5px color-mix(in srgb, var(--guide, #ffe33c) 20%, transparent);
      opacity: .62;
      pointer-events: none;
    }
    .screen.guide-hidden .hole.guide::before { display: none; }
    @keyframes pegIn { 0% { transform: scale(.35); } 72% { transform: scale(1.14); } 100% { transform: scale(.96); } }

    .console {
      grid-area: console;
      min-height: 0;
      display: flex;
      flex-direction: column;
      color: #282720;
      padding: 4px 2px 3px;
    }
    .product-title {
      margin: 0 0 9px;
      font: 900 13px/1 "Nunito", sans-serif;
      letter-spacing: .11em;
      color: #706a5d;
      text-transform: uppercase;
    }
    .prompt {
      margin: 0 0 6px;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(23px, 2.4vw, 32px);
      line-height: .97;
      letter-spacing: -.025em;
      color: #26241d;
    }
    .prompt span { color: var(--orange); }
    .hint {
      margin: 0 0 13px;
      color: #5d594e;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .stripes {
      height: 10px;
      margin: 2px 0 14px;
      border-radius: 4px 1px 4px 1px;
      background: linear-gradient(to bottom, var(--orange) 0 42%, transparent 42% 58%, var(--gold) 58% 100%);
    }

    .palette-label, .brightness-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 7px;
      font: 800 12px/1 "Nunito", sans-serif;
      color: #48453e;
    }
    .palette-label output, .brightness-label output { font-size: 11px; color: #777166; }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }
    .color-btn {
      appearance: none;
      border: 0;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      justify-self: center;
      background:
        radial-gradient(circle at 33% 27%, white 0 5%, rgba(255,255,255,.6) 6% 13%, transparent 15%),
        radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--swatch) 78%, white) 0 27%, var(--swatch) 52%, color-mix(in srgb, var(--swatch) 58%, black) 76%);
      box-shadow: 0 3px 4px rgba(56,48,31,.38), inset -3px -4px 5px rgba(0,0,0,.26), inset 2px 2px 3px rgba(255,255,255,.48);
      cursor: pointer;
      position: relative;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .color-btn::after {
      content: attr(data-key);
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #37352f;
      color: white;
      font-size: 9px;
      font-weight: 900;
      box-shadow: 0 1px 2px rgba(0,0,0,.3);
    }
    .color-btn:hover { transform: translateY(-1px); }
    .color-btn.selected {
      transform: scale(1.12);
      box-shadow: 0 0 0 4px #26241d, 0 0 0 6px #fff, 0 6px 10px rgba(56,48,31,.4), inset -3px -4px 5px rgba(0,0,0,.2), inset 2px 2px 3px rgba(255,255,255,.55);
    }
    .color-btn:focus-visible, .template-btn:focus-visible, .guide-toggle:focus-visible, .effect-btn:focus-visible, .control-btn:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .template-tools { margin: 0 0 14px; }
    .template-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 900;
      color: #48453e;
    }
    .template-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .template-btn {
      appearance: none;
      min-width: 0;
      height: 47px;
      padding: 3px 2px 2px;
      border: 0;
      border-radius: 10px 10px 12px 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #fffef7, #d8d3c6);
      color: var(--thumb, #ef5b22);
      box-shadow: 0 3px 0 #9e998e, inset 0 1px 0 rgba(255,255,255,.9);
      cursor: pointer;
      transition: transform 100ms ease, box-shadow 100ms ease;
    }
    .template-btn svg { width: 26px; height: 26px; overflow: visible; }
    .template-btn .template-name {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #4b473e;
      font-size: 7px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }
    .template-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #9e998e; }
    .template-btn.selected {
      background: #2e2d29;
      color: var(--thumb, #ffe33c);
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #26241d, 0 3px 0 #111;
    }
    .template-btn.selected .template-name { color: white; }
    .guide-toggle {
      appearance: none;
      width: 100%;
      min-height: 34px;
      margin-top: 8px;
      border: 0;
      border-radius: 9px 9px 11px 11px;
      background: var(--orange);
      color: white;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 3px 0 #a6330e, inset 0 1px 0 rgba(255,255,255,.25);
      cursor: pointer;
    }
    .guide-toggle[aria-pressed="false"] { background: #6e6a61; box-shadow: 0 3px 0 #403e39; }
    .guide-toggle:active { transform: translateY(2px); box-shadow: 0 1px 0 #403e39; }

    .effect-tools { margin: 0 0 12px; }
    .effect-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 900;
      color: #48453e;
    }
    .effect-heading span:last-child { font-size: 9px; color: #777166; }
    .effect-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .effect-btn {
      appearance: none;
      min-width: 0;
      min-height: 44px;
      padding: 4px 2px;
      border: 0;
      border-radius: 9px 9px 11px 11px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 3px;
      background: #3a3935;
      color: white;
      font-size: 7px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 3px 0 #171714, inset 0 1px 0 rgba(255,255,255,.2);
      cursor: pointer;
    }
    .effect-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #171714; }
    .effect-btn.active { background: var(--effect, var(--orange)); box-shadow: 0 0 0 2px #fff, 0 0 0 4px #26241d, 0 3px 0 #171714; }
    .effect-dot {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--effect, var(--orange));
      box-shadow: 0 0 9px var(--effect, var(--orange)), inset 2px 2px 3px rgba(255,255,255,.65);
    }
    .effect-btn[data-effect="disco"] .effect-dot,
    .effect-btn[data-effect="rainbow"] .effect-dot,
    .effect-btn[data-effect="fireworks"] .effect-dot,
    .effect-btn[data-effect="confetti"] .effect-dot { background: conic-gradient(#ff2438, #ffe33c, #31e36f, #198dff, #a65cff, #ff2438); }
    .effect-btn[data-effect="smoke"] .effect-dot { background: radial-gradient(circle at 35% 35%, #fff, #8b8d94 48%, #3f4249); }
    .effect-btn[data-effect="flicker"] .effect-dot { background: #ffe33c; animation: effectFlicker .7s steps(2,end) infinite; }

    .screen.fx-disco .hole.filled { animation: discoPeg .58s steps(2,end) infinite; }
    .screen.fx-pulse .hole.filled { animation: pulsePeg 1.45s ease-in-out infinite; }
    .screen.fx-flicker { animation: powerBoard 4.8s steps(1,end) infinite; }
    .screen.fx-flicker .hole.filled { animation: powerFlicker 4.8s steps(1,end) infinite; }
    .screen.fx-flicker .hole.filled:nth-child(3n) { animation-delay: -.13s; }
    .screen.fx-flicker .hole.filled:nth-child(5n) { animation-delay: -.29s; }
    .screen.fx-flicker .hole.filled:nth-child(7n) { animation-delay: -.47s; }
    .screen.fx-high .hole.filled { filter: brightness(1.75) saturate(1.35); }
    .screen.fx-rainbow .hole.filled { animation: rainbowPeg 2.2s linear infinite; }
    .screen.fx-fireworks .hole.filled { animation: fireworkGlow 1.15s ease-in-out infinite; }
    .screen.fx-fireworks .hole.filled:nth-child(3n) { animation-delay: -.35s; }
    .screen.fx-fireworks .hole.filled:nth-child(5n) { animation-delay: -.72s; }
    @keyframes discoPeg { 0% { filter: hue-rotate(0deg) brightness(1.1); } 33% { filter: hue-rotate(110deg) brightness(1.55); } 66% { filter: hue-rotate(240deg) brightness(.88); } 100% { filter: hue-rotate(360deg) brightness(1.1); } }
    @keyframes pulsePeg { 0%, 100% { transform: scale(.82); filter: brightness(.78); } 50% { transform: scale(1.04); filter: brightness(1.5); } }
    @keyframes powerFlicker {
      0%, 5% { opacity: 1; filter: brightness(1.08) saturate(1.2); }
      6% { opacity: .24; filter: brightness(.3) saturate(.6); }
      7% { opacity: .88; filter: brightness(1.8) saturate(1.35); }
      8%, 12% { opacity: .42; filter: brightness(.46) saturate(.75); }
      13% { opacity: 1; filter: brightness(2.25) saturate(1.45); }
      14%, 27% { opacity: .7; filter: brightness(.75) saturate(.92); }
      28%, 31% { opacity: .08; filter: brightness(.12) saturate(.35); }
      32% { opacity: .95; filter: brightness(1.72) saturate(1.3); }
      33% { opacity: .2; filter: brightness(.25) saturate(.5); }
      34%, 48% { opacity: .58; filter: brightness(.62) saturate(.82); }
      49% { opacity: 1; filter: brightness(2.5) saturate(1.5); }
      50%, 52% { opacity: .12; filter: brightness(.18) saturate(.4); }
      53% { opacity: .8; filter: brightness(1.25) saturate(1.1); }
      54%, 70% { opacity: .46; filter: brightness(.5) saturate(.74); }
      71%, 74% { opacity: .04; filter: brightness(.08) saturate(.25); }
      75% { opacity: 1; filter: brightness(2.1) saturate(1.5); }
      76%, 81% { opacity: .32; filter: brightness(.38) saturate(.62); }
      82% { opacity: .92; filter: brightness(1.55) saturate(1.28); }
      83% { opacity: .16; filter: brightness(.2) saturate(.45); }
      84%, 100% { opacity: .74; filter: brightness(.82) saturate(1); }
    }
    @keyframes powerBoard {
      0%, 12%, 34%, 48%, 75%, 82%, 100% { box-shadow: inset 0 0 42px #000, inset 0 0 0 2px #000, 0 0 0 1px #555; }
      13%, 49%, 76% { box-shadow: inset 0 0 42px #000, inset 0 0 0 2px #000, 0 0 24px rgba(196,224,255,.75), 0 0 0 1px #bde0ff; }
      28%, 31%, 50%, 52%, 71%, 74% { box-shadow: inset 0 0 70px #000, inset 0 0 0 2px #000, 0 0 0 1px #24262b; }
    }
    @keyframes rainbowPeg { from { filter: hue-rotate(0deg) saturate(1.4); } to { filter: hue-rotate(360deg) saturate(1.4); } }
    @keyframes fireworkGlow { 0%, 72%, 100% { filter: brightness(.9); } 80% { filter: brightness(2.2) saturate(1.35); transform: scale(1.08); } }
    @keyframes effectFlicker { 0%, 12%, 34%, 48%, 75%, 82%, 100% { opacity: 1; } 13%, 49%, 76% { opacity: .2; } 28%, 31%, 50%, 52%, 71%, 74% { opacity: .05; } }

    .smoke-puff {
      position: fixed;
      z-index: 29;
      width: clamp(34px, 5vw, 68px);
      height: clamp(34px, 5vw, 68px);
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 42% 42%, rgba(255,255,255,.98) 0 18%, rgba(245,248,255,.88) 30%, rgba(206,214,225,.58) 52%, rgba(139,148,164,.22) 69%, transparent 74%);
      box-shadow:
        0 0 18px rgba(255,255,255,.55),
        0 0 36px rgba(220,228,240,.28);
      filter: blur(2px);
      mix-blend-mode: screen;
      animation: smokeRise 2.35s ease-out forwards;
    }
    @keyframes smokeRise {
      0% { transform: translate(-50%, -5%) scale(.35); opacity: 0; }
      14% { opacity: .96; }
      62% { opacity: .82; }
      100% { transform: translate(calc(-50% + var(--drift)), -150px) scale(2.35); opacity: 0; }
    }

    .brightness { margin-top: auto; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--orange);
      cursor: pointer;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 9px;
      margin-top: 14px;
    }
    .control-btn {
      appearance: none;
      border: 0;
      min-height: 44px;
      border-radius: 12px 12px 15px 15px;
      background: #32312e;
      color: white;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 0 #171714, 0 6px 9px rgba(50,43,30,.25), inset 0 1px 0 rgba(255,255,255,.22);
    }
    .control-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #171714; }
    .sound-btn { display: grid; place-items: center; padding: 0; }
    .sound-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .sound-btn .sound-off { display: none; }
    .sound-btn.muted .sound-on { display: none; }
    .sound-btn.muted .sound-off { display: block; }

    .maker-mark {
      margin: 18px 0 0;
      color: #706a5d;
      font: 800 10px/1.2 "Nunito", sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 20;
      translate: -50% 18px;
      opacity: 0;
      pointer-events: none;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.95);
      color: #1b1b1b;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 6px 30px rgba(0,0,0,.35);
      transition: opacity 160ms ease, translate 160ms ease;
    }
    .toast.show { opacity: 1; translate: -50% 0; }

    .sparkle, .celebration-bit {
      position: fixed;
      z-index: 30;
      width: 7px;
      height: 7px;
      pointer-events: none;
      background: var(--spark, #ffe33c);
      clip-path: polygon(50% 0, 61% 36%, 100% 50%, 61% 64%, 50% 100%, 39% 64%, 0 50%, 39% 36%);
      filter: drop-shadow(0 0 4px var(--spark, #ffe33c));
      animation: sparklePop 520ms ease-out forwards;
    }
    .celebration-bit {
      width: 13px;
      height: 20px;
      border-radius: 2px;
      clip-path: none;
      filter: drop-shadow(0 0 5px var(--spark, #ffe33c));
      animation: celebrate 1.65s cubic-bezier(.15,.72,.32,1) forwards;
    }
    .hole.filled::after { animation: pegShimmer 3.2s ease-in-out infinite; }
    @keyframes pegShimmer { 0%, 78%, 100% { opacity: .55; } 86% { opacity: 1; } }
    @keyframes sparklePop {
      0% { transform: translate(-50%, -50%) scale(.2) rotate(0); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.15) rotate(145deg); opacity: 0; }
    }
    @keyframes celebrate {
      0% { transform: translate(-50%, -50%) scale(.35) rotate(0); opacity: 0; }
      8% { opacity: 1; }

      function selectColor(index) {

      });

      function makeSparkles(hole, count) {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var rect = hole.getBoundingClientRect();
        var shades = [colors[selected].value, '#ffffff', '#ffe33c'];
        for (var i = 0; i < count; i++) {
          var bit = document.createElement('i');
          var angle = (Math.PI * 2 * i / count) + Math.random() * .35;
          var distance = 16 + Math.random() * 18;
          bit.className = 'sparkle';
          bit.style.left = (rect.left + rect.width / 2) + 'px';
          bit.style.top = (rect.top + rect.height / 2) + 'px';
          bit.style.setProperty('--dx', (Math.cos(angle) * distance) + 'px');
          bit.style.setProperty('--dy', (Math.sin(angle) * distance) + 'px');
          bit.style.setProperty('--spark', shades[i % shades.length]);
          document.body.appendChild(bit);
          setTimeout(function (particle) { particle.remove(); }, 550, bit);
        }
      }

      function celebrateTemplate() {
        if (templateCelebrated) return;
        var missing = board.querySelectorAll('.hole.guide:not(.filled)').length;
        if (missing) return;
        templateCelebrated = true;
        showToast(templates[selectedTemplate].name + ' complete!');
        burstConfetti();
      }

      function updateHoleLabel(hole) {
        var position = 'row ' + (Number(hole.dataset.row) + 1) + ', column ' + (Number(hole.dataset.col) + 1);
        if (hole.classList.contains('filled')) {
          hole.setAttribute('aria-label', colors[Number(hole.dataset.color)].name + ' peg at ' + position + '. Press to remove.');
        } else {
          hole.setAttribute('aria-label', 'Empty hole at ' + position + '. Press to place ' + colors[selected].name + '.');
        }
      }

      function popSound(removing) {
        if (muted) return;
        try {
          audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume();
          var now = audioContext.currentTime;
          var osc = audioContext.createOscillator();
          var gain = audioContext.createGain();
          var filter = audioContext.createBiquadFilter();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(removing ? 190 : 285, now);
          osc.frequency.exponentialRampToValueAtTime(removing ? 95 : 155, now + .07);
          filter.type = 'lowpass';
          filter.frequency.value = 850;
          gain.gain.setValueAtTime(.0001, now);
          gain.gain.exponentialRampToValueAtTime(.22, now + .006);
          gain.gain.exponentialRampToValueAtTime(.0001, now + .085);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioContext.destination);
          osc.start(now);
          osc.stop(now + .09);
        } catch (e) { /* Sound is a bonus; interaction still works. */ }
      }

      function place(hole, mode, makeSound) {
        var filled = hole.classList.contains('filled');
        if (mode === 'remove') {
          if (!filled) return;
          hole.classList.remove('filled');
          hole.style.removeProperty('--peg');
          delete hole.dataset.color;
          if (hole.classList.contains('guide')) templateCelebrated = false;
          if (makeSound) popSound(true);
        } else {
          if (filled) return;
          hole.dataset.color = String(selected);
          hole.style.setProperty('--peg', colors[selected].value);
          hole.classList.add('filled');
          makeSparkles(hole, makeSound ? 6 : 2);
          if (makeSound) popSound(false);
        }
        updateHoleLabel(hole);
        if (mode === 'place' && hole.classList.contains('guide')) celebrateTemplate();
        if (navigator.vibrate && makeSound) navigator.vibrate(7);
      }

      for (var row = 0; row < 15; row++) {
        for (var col = 0; col < 15; col++) {
          var hole = document.createElement('button');
          hole.type = 'button';
          hole.className = 'hole';
          hole.dataset.row = String(row);
          hole.dataset.col = String(col);
          updateHoleLabel(hole);
          hole.addEventListener('pointerdown', function (event) {
            event.preventDefault();
            dragging = true;
            touched = new Set();
            dragMode = this.classList.contains('filled') ? 'remove' : 'place';
            touched.add(this);
            place(this, dragMode, true);
            try { this.setPointerCapture(event.pointerId); } catch (e) {}
          });
          board.appendChild(hole);
        }
      }

      guideToggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        setGuideVisible(!guideVisible, true);
      });

      board.addEventListener('pointermove', function (event) {
        if (!dragging) return;
        var target = document.elementFromPoint(event.clientX, event.clientY);
        if (!target || !target.classList.contains('hole') || touched.has(target)) return;
        touched.add(target);
        place(target, dragMode, false);
      });
      window.addEventListener('pointerup', function () { dragging = false; touched.clear(); });
      window.addEventListener('pointercancel', function () { dragging = false; touched.clear(); });

      glow.addEventListener('input', function () {
        var value = Number(glow.value);
        document.documentElement.style.setProperty('--brightness', String(value / 100));
        glowValue.textContent = value < 75 ? 'Soft' : value > 120 ? 'Super' : 'Bright';
      });

      resetBtn.addEventListener('click', function () {
        board.querySelectorAll('.filled').forEach(function (hole) {
          hole.classList.remove('filled');
          hole.style.removeProperty('--peg');
          delete hole.dataset.color;
          updateHoleLabel(hole);
        });
        templateCelebrated = false;
        popSound(true);
        showToast('Board cleared');
      });

      soundBtn.addEventListener('click', function () {
        muted = !muted;
        soundBtn.classList.toggle('muted', muted);
        soundBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
        soundBtn.setAttribute('aria-label', muted ? 'Turn on pop sound' : 'Mute pop sound');
        if (!muted) popSound(false);
      });

      document.addEventListener('keydown', function (event) {
        if (/^[1-8]$/.test(event.key) && document.activeElement !== glow) selectColor(Number(event.key) - 1);
      });
    }());
  </script>
</body>
</html>
