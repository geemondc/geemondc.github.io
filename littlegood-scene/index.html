<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A Little Good for You — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#26301f; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#26301f;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 11s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.02) translate(0.4%,0.2%); } to { transform:scale(1.09) translate(-1%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #glow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 8s ease-in-out infinite alternate;
         background:radial-gradient(46% 60% at 68% 30%, rgba(255,214,130,.42), rgba(255,180,90,.12) 55%, rgba(255,170,80,0) 78%); }
  @keyframes breathe { from { opacity:.32 } to { opacity:1 } }
  #warmth { position:absolute; inset:0; pointer-events:none;
         background:linear-gradient(180deg, rgba(255,196,110,.10), rgba(120,70,20,.10));
         animation:warm 17s ease-in-out infinite alternate; }
  @keyframes warm { from { opacity:.25 } to { opacity:.8 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(38,48,31,.58); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #glow, #warmth { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="A painted cottage garden at sunrise — a stone path winds between flower beds toward a wooden gate, a cup of coffee steaming on the porch table, the sun rising over a misty valley beyond">
    </div>
    <div id="glow"></div>
    <div id="warmth"></div>
    <div id="caption">A LITTLE GOOD FOR YOU</div>
  </div>
</div>
<script>
  // A Little Good for You (Gary's living standard, the gentle scenery class): the painting stays exactly itself; the sunrise light breathes slowly over the garden and the warmth of the morning comes and goes — nothing else moves. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
  })();
</script>
</body>
</html>
