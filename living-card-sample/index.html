<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Living Card — Happy New Year, Sofia (sample)</title>
<meta name="description" content="A Living Card: a sealed greeting that opens onto a living photo — a beginning, a middle, and an end. Personalized, sendable, one link.">
<style>
  :root{
    --burgundy:#5d1220; --burgundy-deep:#3d0a15; --burgundy-flap:#6e1626;
    --gold:#c9a24d; --gold-bright:#ecd28a;
    --ivory:#faf5ea; --ink:#3a2c22;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:Didot,"Playfair Display",Georgia,"Times New Roman",serif;
    background:#221016 radial-gradient(120% 90% at 50% 0%, #3a0e1a 0%, #221016 60%);
    color:var(--ink); overflow:hidden;
  }
  #scene{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:18px; perspective:1100px;}

  /* ---------- the inside card (sits beneath the envelope front) ---------- */
  #card{
    position:relative; width:min(430px, 94vw); max-height:94dvh; overflow:auto; scrollbar-width:none;
    background:var(--ivory);
    border-radius:6px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.4);
    padding:26px 22px 18px;
    text-align:center;
    opacity:0; transform:translateY(26px) scale(.93);
    transition:opacity .8s ease .5s, transform .8s cubic-bezier(.22,.9,.3,1) .5s;
  }
  #card::-webkit-scrollbar{display:none}
  #card::before{
    content:""; position:absolute; inset:9px; border:1px solid var(--gold);
    border-radius:3px; pointer-events:none; opacity:.75;
  }
  body.open #card{opacity:1; transform:none}
  .over{font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:#8a6d2f; margin-top:4px}
  .frame{
    position:relative; border:2px solid var(--gold); border-radius:3px; overflow:hidden;
    box-shadow:0 10px 26px rgba(60,30,10,.25); background:#101018;
    aspect-ratio:4/3.4; margin:14px 4px 0;
  }
  .frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block; overflow:hidden}
  .frame canvas#fx{position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none}
  #burst{position:fixed; inset:0; pointer-events:none; opacity:0; z-index:4;
    background:radial-gradient(60% 50% at 50% 46%, rgba(255,236,170,.95) 0%, rgba(236,210,138,.45) 42%, transparent 72%)}
  body.opening #burst{animation:burstflash 1s ease .3s}
  @keyframes burstflash{0%{opacity:0}22%{opacity:.85}100%{opacity:0}}
  /* The photo is HELD STILL — no push-in, no zoom, no pan.
     The living light inside the photo is the only motion. */
  .frame img.still{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
    opacity:0; transition:opacity 1.6s ease; pointer-events:none;
  }
  body.settled .frame img.still{opacity:1}
  .message{
    font-family:Georgia,serif; font-style:italic; font-size:18.5px; line-height:1.55;
    color:#5c4a38; margin:16px 12px 0; text-align:center;
  }
  .closing{
    font-size:22px; line-height:1.35; color:var(--ink); margin:18px 10px 0; text-align:center;
    opacity:0; transform:translateY(8px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .signature{
    font-family:Georgia,serif; font-style:italic; font-size:16.5px; color:#5c4a38; margin-top:8px; text-align:center;
    opacity:0; transform:translateY(8px);
    transition:opacity .9s ease .25s, transform .9s ease .25s;
  }
  body.settled .closing, body.settled .signature{opacity:1; transform:none}
  .flourish{color:var(--gold); letter-spacing:.5em; font-size:12px; margin:14px 0 6px}
  .brand{margin-top:6px; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:#a08b62}
  #replay{
    margin-top:12px; background:var(--burgundy); color:#f5e7c8; border:1px solid var(--gold);
    border-radius:999px; cursor:pointer; padding:10px 26px;
    font-family:Georgia,serif; font-size:14px; letter-spacing:.12em;
    opacity:0; pointer-events:none; transition:opacity .9s ease .5s;
  }
  body.settled #replay{opacity:1; pointer-events:auto}
  #replay:active{transform:scale(.97)}

  /* ---------- the sealed envelope front ---------- */
  #front{
    position:absolute; inset:0; z-index:5; cursor:pointer; border:none; width:100%; text-align:center;
    background:
      linear-gradient(155deg, transparent 49.6%, rgba(0,0,0,.28) 50%, transparent 50.6%),
      linear-gradient(-155deg, transparent 49.6%, rgba(0,0,0,.28) 50%, transparent 50.6%),
      radial-gradient(130% 100% at 50% 0%, #7a1a2c 0%, var(--burgundy) 55%, var(--burgundy-deep) 100%);
    color:#f5e7c8; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:9vh 18px calc(26px + env(safe-area-inset-bottom)); padding:9dvh 18px calc(26px + env(safe-area-inset-bottom));
    transform-style:preserve-3d;
    transition:opacity .45s ease .55s, transform .45s ease .55s;
    font-family:inherit;
  }
  body.open #front{opacity:0; transform:translateY(-30px); pointer-events:none}
  /* top envelope flap — lifts open on rotateX */
  #flap{
    position:absolute; top:0; left:0; right:0; height:41%;
    background:linear-gradient(180deg, var(--burgundy-flap) 0%, var(--burgundy) 100%);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    transition:transform .55s ease .18s, opacity .3s ease .55s;
    backface-visibility:hidden;
  }
  body.opening #flap, body.open #flap{transform:rotateX(-165deg); opacity:0}
  #front .f-for,#front .f-name,#front .f-from,#front .tap{position:relative; z-index:2}
  #front .f-for{font-size:15px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold-bright); opacity:.95; margin-top:8px}
  #front .f-name{font-size:52px; line-height:1.15; margin:10px 12px 6px; font-weight:600; text-shadow:0 2px 14px rgba(0,0,0,.35)}
  #front .f-from{font-family:Georgia,serif; font-style:italic; font-size:16px; color:#efe0ba; margin-bottom:34px}
  #seal{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; width:96px; height:96px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8c877 0%, var(--gold) 45%, #97742c 100%);
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 2px 5px rgba(255,255,255,.55), inset 0 -4px 8px rgba(90,60,0,.55);
    outline:2px solid rgba(236,210,138,.5); outline-offset:5px;
  }
  #seal .half{
    position:absolute; top:0; bottom:0; width:50%; overflow:hidden;
    display:flex; align-items:center; color:#5d4413; font-size:26px; letter-spacing:.04em;
    transition:transform .35s ease, opacity .35s ease;
  }
  #seal .half.l{left:0; justify-content:flex-end; padding-right:2px; border-radius:48px 0 0 48px}
  #seal .half.r{right:0; justify-content:flex-start; padding-left:2px; border-radius:0 48px 48px 0}
  /* the seal cracks: halves split apart and fade */
  body.opening #seal .half.l, body.open #seal .half.l{transform:translate(-14px,-6px) rotate(-14deg); opacity:0}
  body.opening #seal .half.r, body.open #seal .half.r{transform:translate(14px,6px) rotate(14deg); opacity:0}
  body.opening #seal, body.open #seal{box-shadow:0 6px 18px rgba(0,0,0,.2)}
  #front .tap{margin-top:auto; font-family:Georgia,serif; font-style:italic; font-size:15.5px; letter-spacing:.04em; color:#e9d9ae; animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.78}50%{opacity:1}}
  #pop{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6}
  /* ---------- envelope variants: same card soul, different envelope ---------- */

    background:
      linear-gradient(155deg, transparent 49.6%, rgba(31,90,140,.13) 50%, transparent 50.6%),
      linear-gradient(-155deg, transparent 49.6%, rgba(31,90,140,.13) 50%, transparent 50.6%),
      radial-gradient(circle at 12% 20%, #ffd93b 0 10px, transparent 11px),
      radial-gradient(circle at 84% 14%, #ff6b9d 0 8px, transparent 9px),
      radial-gradient(circle at 90% 78%, #39c2d7 0 11px, transparent 12px),
      radial-gradient(circle at 8% 84%, #7ed957 0 9px, transparent 10px),
      radial-gradient(circle at 70% 88%, #ff9f2e 0 7px, transparent 8px),
      radial-gradient(circle at 30% 8%, #b388ff 0 7px, transparent 8px),
      linear-gradient(160deg, #fffdf4 0%, #fdf3d8 55%, #fbe8c8 100%);
    color:#274268;
  }
  body.env-kid #flap{background:linear-gradient(180deg, #ffe9a8 0%, #ffd93b 100%)}
  body.env-kid #front .f-for{color:#e2543e}
  body.env-kid #front .f-name{color:#274268; text-shadow:0 2px 0 rgba(255,217,59,.55)}

  body.env-kid #seal{background:radial-gradient(circle at 35% 30%, #ffb3cd 0%, #ff6b9d 45%, #d6336c 100%); outline-color:rgba(255,107,157,.45)}

  body.env-kid .frame{border-color:#ff9f2e}
  body.env-kid #card::before{border-color:rgba(255,159,46,.55)}
  body.env-kid .over{color:#e2543e}
  body.env-kid #replay{background:#ff6b9d; border-color:#ffd93b; color:#fff}

      var st10 = document.querySelector('.frame img.still');
      if (st10){ st10.src = 'https://geemondc.github.io/get-well-scene/still.jpg'; st10.alt = 'The Window Seat, at rest'; }
    }
    if (scene === 'surprise'){
      var fr7 = document.querySelector('.frame iframe');
      if (fr7){ fr7.src = 'https://geemondc.github.io/surprise-scene/#wall'; fr7.title = 'Living photo — the Surprise Room'; }
      var st7 = document.querySelector('.frame img.still');
      if (st7){ st7.src = 'https://geemondc.github.io/surprise-scene/still.jpg'; st7.alt = 'The Surprise Room, at rest'; }
    }
    if (scene === 'baby'){
      var fr13 = document.querySelector('.frame iframe');
      if (fr13){ fr13.src = 'https://geemondc.github.io/baby-scene/#wall'; fr13.title = 'Living photo — the Nursery Cottage'; }
      var st13 = document.querySelector('.frame img.still');
      if (st13){ st13.src = 'https://geemondc.github.io/baby-scene/still.jpg'; st13.alt = 'The Nursery Cottage, at rest'; }
    }
    if (scene === 'christmas'){
      var fr8 = document.querySelector('.frame iframe');
      if (fr8){ fr8.src = 'https://geemondc.github.io/christmas-scene/#wall'; fr8.title = 'Living photo — the Christmas Village'; }
      var st8 = document.querySelector('.frame img.still');
      if (st8){ st8.src = 'https://geemondc.github.io/christmas-scene/still.jpg'; st8.alt = 'The Christmas Village, at rest'; }
    }
  })();

  var front = document.getElementById('front');
  var settleTimer = null;
  var MIDDLE_MS = 11300; /* living middle, a firework finale, then the scene settles to rest */
  var finaleTimer = null;

  /* the box openings: butterflies flutter out, or dollar bills burst and rain */
  function popBurst2(sc){
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.getElementById('pop'); if (!cv) return;
    var W = window.innerWidth, H = window.innerHeight; if (!W || !H) return;
    cv.width = W; cv.height = H;
    var cx = cv.getContext('2d'); if (!cx) return;
    var flies = sc === 'butterfly';
    var COLORS = ['#ff9f2e','#9b6dd6','#4db2e8','#ff7ba9'];
    var N = flies ? 14 : 26, parts = [], t0 = performance.now();
    for (var i = 0; i < N; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = flies ? 0.8 + Math.random() * 1.8 : 2.0 + Math.random() * 4.6;
      parts.push({
        x: W * 0.5, y: H * 0.5,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (flies ? 1.8 : 2.6),
        s: flies ? 13 + Math.random() * 9 : 40 + Math.random() * 16,
        c: COLORS[i % COLORS.length],
        ph: Math.random() * Math.PI * 2,
        fs: 0.9 + Math.random() * 0.7
      });
    }
    var LIFE = flies ? 3500 : 3000;
    function tick(now){
      var t = now - t0, k = t / LIFE;
      cx.clearRect(0, 0, W, H);
      if (k >= 1) return;
      var fade = k > 0.72 ? 1 - (k - 0.72) / 0.28 : 1;
      parts.forEach(function(p){
        if (flies){
          p.vx *= 0.985; p.vy *= 0.99;
          p.x += p.vx + Math.cos(t / 230 + p.ph) * 0.9;
          p.y += p.vy - 0.35 + Math.sin(t / 190 + p.ph) * 0.85;
          var w01 = 0.25 + 0.75 * Math.abs(Math.sin(t * 0.022 * p.fs + p.ph));
          cx.save(); cx.globalAlpha = fade; cx.translate(p.x, p.y); cx.rotate(Math.sin(t / 300 + p.ph) * 0.45);
          cx.fillStyle = p.c;
          cx.beginPath(); cx.ellipse(-p.s * 0.52 * w01 - p.s * 0.06, 0, p.s * 0.55 * w01, p.s * 0.34, -0.35, 0, Math.PI * 2); cx.fill();
          cx.beginPath(); cx.ellipse( p.s * 0.52 * w01 + p.s * 0.06, 0, p.s * 0.55 * w01, p.s * 0.34,  0.35, 0, Math.PI * 2); cx.fill();
          cx.fillStyle = 'rgba(43,30,22,.92)';
          cx.beginPath(); cx.ellipse(0, 0, p.s * 0.10, p.s * 0.36, 0, 0, Math.PI * 2); cx.fill();
          cx.restore();
        } else {
          p.vy += 0.055; if (p.vy > 1.35) p.vy = 1.35;
          p.vx *= 0.99;
          p.x += p.vx + Math.sin(t / 300 + p.ph) * 0.8;
          p.y += p.vy;
          var w = p.s, h = p.s * 0.48;
          cx.save(); cx.globalAlpha = fade; cx.translate(p.x, p.y); cx.rotate(Math.sin(t / 280 + p.ph) * 0.85);
          cx.fillStyle = '#2e7d43'; cx.fillRect(-w / 2, -h / 2, w, h);
          cx.strokeStyle = '#1d5c2f'; cx.lineWidth = 2; cx.strokeRect(-w / 2 + 3, -h / 2 + 3, w - 6, h - 6);
          cx.fillStyle = '#f3ead2';
          cx.beginPath(); cx.ellipse(0, 0, w * 0.17, h * 0.30, 0, 0, Math.PI * 2); cx.fill();
          cx.fillStyle = '#1d5c2f';
          cx.beginPath(); cx.ellipse(0, 0, w * 0.07, h * 0.13, 0, 0, Math.PI * 2); cx.fill();
          cx.restore();
        }
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  /* the celebration openings: petals drift, stars burst, confetti flies,
     sun-dots and leaves rise, bubbles rise, pastel hearts drift up */
  function popBurst3(sc){
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.getElementById('pop'); if (!cv) return;
    var W = window.innerWidth, H = window.innerHeight; if (!W || !H) return;
    cv.width = W; cv.height = H;
    var cx = cv.getContext('2d'); if (!cx) return;
    var CONF = {
      wedding:    {n: 44,  life: 3400, colors: ['#ffffff', '#f7d9e0', '#f3e6ee', '#fbeef3']},
      barmitzvah: {n: 34,  life: 2600, colors: ['#ffd873', '#7db4ff', '#ffffff', '#c9a24d']},
      surprise:   {n: 130, life: 2400, colors: ['#ff2ea6', '#ffd93b', '#39c2d7', '#7ed957', '#b388ff', '#ff9f2e']},
      thankyou:   {n: 40,  life: 3200, colors: ['#e8c877', '#d9a441', '#7a9e43', '#f3d98b']},
      getwell:    {n: 30,  life: 3600, colors: ['#ffffff', '#cfeaff', '#9fd0f5']},
      graduation: {n: 38,  life: 2600, colors: ['#ffd873', '#e9b949', '#fff0b8', '#c9a24d']},
      baby:       {n: 26,  life: 3400, colors: ['#ffb7cd', '#a8d8ff', '#b5e7c8', '#e3c8ff', '#ffe1a8']}
    };
    var cfg = CONF[sc]; if (!cfg) return;
    var isStars = sc === 'barmitzvah' || sc === 'graduation';
    var parts = [], t0 = performance.now();
    for (var i = 0; i < cfg.n; i++){
      var p = {
        c: cfg.colors[i % cfg.colors.length],
        ph: Math.random() * Math.PI * 2,
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.12
      };
      var a = Math.random() * Math.PI * 2;
      if (sc === 'wedding'){
        var spw = 0.7 + Math.random() * 1.6;
        p.x = W * 0.5; p.y = H * 0.5;
        p.vx = Math.cos(a) * spw; p.vy = Math.sin(a) * spw - 1.2;
        p.s = 7 + Math.random() * 7;
      } else if (isStars){
        var sps = 2.0 + Math.random() * 3.4;
        p.x = W * 0.5; p.y = H * 0.5;
        p.vx = Math.cos(a) * sps; p.vy = Math.sin(a) * sps - 1.6;
        p.s = 6 + Math.random() * 7;
      } else if (sc === 'surprise'){
        var spc = 2.6 + Math.random() * 5.4;
        p.x = W * 0.5; p.y = H * 0.5;
        p.vx = Math.cos(a) * spc; p.vy = Math.sin(a) * spc - 3.6;
        p.s = 5 + Math.random() * 6;
        p.streamer = i % 6 === 0;
      } else { /* thankyou, getwell, baby: rise from below the seal */
        p.x = W * (0.22 + Math.random() * 0.56);
        p.y = H * (0.55 + Math.random() * 0.15);
        p.vx = (Math.random() - 0.5) * 0.3;
        p.vy = -(0.5 + Math.random() * 1.1);
        p.s = (sc === 'baby' ? 9 : 6) + Math.random() * 8;
        p.leaf = p.ph > 3.4;
      }
      parts.push(p);
    }
    function star(x, y, r, rot){
      cx.beginPath();
      for (var i = 0; i < 10; i++){
        var rr = i % 2 ? r * 0.46 : r;
        var aa = rot + i * Math.PI / 5 - Math.PI / 2;
        var px = x + Math.cos(aa) * rr, py = y + Math.sin(aa) * rr;
        if (i) cx.lineTo(px, py); else cx.moveTo(px, py);
      }
      cx.closePath(); cx.fill();
    }
    function heart(x, y, s){
      cx.beginPath();
      cx.moveTo(x, y + s * 0.85);
      cx.bezierCurveTo(x - s * 1.15, y + s * 0.05, x - s * 0.85, y - s * 0.95, x, y - s * 0.2);
      cx.bezierCurveTo(x + s * 0.85, y - s * 0.95, x + s * 1.15, y + s * 0.05, x, y + s * 0.85);
      cx.closePath(); cx.fill();
    }
    function tick(now){
      var t = now - t0, k = t / cfg.life;
      cx.clearRect(0, 0, W, H);
      if (k >= 1) return;
      var fade = k > 0.72 ? 1 - (k - 0.72) / 0.28 : 1;
      parts.forEach(function(p){
        cx.save(); cx.globalAlpha = fade; cx.fillStyle = p.c;
        if (sc === 'wedding'){
          p.vy += 0.008; if (p.vy > 0.75) p.vy = 0.75; p.vx *= 0.99;
          p.x += p.vx + Math.sin(t / 300 + p.ph) * 1.0;
          p.y += p.vy; p.r += p.vr * 0.4;
          cx.translate(p.x, p.y); cx.rotate(p.r + Math.sin(t / 340 + p.ph) * 0.5);
          cx.beginPath(); cx.ellipse(0, 0, p.s / 2, p.s / 3.1, 0, 0, Math.PI * 2); cx.fill();
        } else if (isStars){
          p.vy += 0.05; p.vx *= 0.99; p.vy *= 0.995;
          p.x += p.vx; p.y += p.vy; p.r += p.vr;
          star(p.x, p.y, p.s, p.r);
        } else if (sc === 'surprise'){
          p.vy += 0.09; p.vx *= 0.99; p.vy *= 0.995;
          p.x += p.vx + Math.sin(t / 260 + p.ph) * 0.7;
          p.y += p.vy; p.r += p.vr;
          cx.translate(p.x, p.y); cx.rotate(p.r);
          if (p.streamer){
            cx.strokeStyle = p.c; cx.lineWidth = 3; cx.beginPath();
            for (var sx = -p.s * 2.4; sx <= p.s * 2.4; sx += 4){
              var sy = Math.sin(sx / 7 + t / 160 + p.ph) * 4;
              if (sx === -p.s * 2.4) cx.moveTo(sx, sy); else cx.lineTo(sx, sy);
            }
            cx.stroke();
          } else { cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
        } else if (sc === 'thankyou'){
          p.x += p.vx + Math.sin(t / 320 + p.ph) * 0.7;
          p.y += p.vy; p.r += p.vr * 0.5;
          cx.translate(p.x, p.y); cx.rotate(p.r);
          if (p.leaf){ cx.beginPath(); cx.ellipse(0, 0, p.s / 2, p.s / 3.2, 0, 0, Math.PI * 2); cx.fill(); }
          else { cx.beginPath(); cx.arc(0, 0, p.s / 2.4, 0, Math.PI * 2); cx.fill(); }
        } else if (sc === 'getwell'){
          p.x += p.vx + Math.sin(t / 380 + p.ph) * 0.55;
          p.y += p.vy;
          cx.strokeStyle = p.c; cx.lineWidth = 1.6;
          cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, Math.PI * 2); cx.stroke();
          cx.globalAlpha = fade * 0.85; cx.fillStyle = 'rgba(255,255,255,.4)';
          cx.beginPath(); cx.arc(p.x - p.s * 0.32, p.y - p.s * 0.32, p.s * 0.22, 0, Math.PI * 2); cx.fill();
        } else if (sc === 'baby'){
          p.x += p.vx + Math.sin(t / 340 + p.ph) * 0.8;
          p.y += p.vy;
          heart(p.x, p.y, p.s);
        }
        cx.restore();
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function popBurst(){
    var sc = window.__lcScene;
    if (sc === 'butterfly' || sc === 'money'){ popBurst2(sc); return; }
    if (sc === 'wedding' || sc === 'barmitzvah' || sc === 'surprise' || sc === 'thankyou' || sc === 'getwell' || sc === 'graduation' || sc === 'baby'){
      /* the SVG signature moment leads; the canvas burst is its tail */
      var tailDelay = {wedding: 1000, barmitzvah: 1150, surprise: 120, thankyou: 900, getwell: 620, graduation: 700, baby: 820}[sc] || 0;
      setTimeout(function(){ if (document.body.classList.contains('open')) popBurst3(sc); }, tailDelay);
      return;
    }
    if (sc !== 'birthday' && sc !== 'heart') return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.getElementById('pop'); if (!cv) return;
    var W = window.innerWidth, H = window.innerHeight; if (!W || !H) return;
    cv.width = W; cv.height = H;
    var cx = cv.getContext('2d'); if (!cx) return;
    var kid = sc === 'birthday';
    var COLORS = kid ? ['#ff6b9d','#ffd93b','#39c2d7','#7ed957','#ff9f2e','#b388ff'] : ['#f2a7c3','#e77fa2','#f6c9d4','#ecd28a','#d77a9b'];
    var N = kid ? 120 : 52, parts = [], t0 = performance.now();
    for (var i = 0; i < N; i++){
      var a = Math.random() * Math.PI * 2, sp = (kid ? 2.4 : 1.1) + Math.random() * (kid ? 5.2 : 2.0);
      parts.push({
        x: W * 0.5, y: H * 0.5,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (kid ? 3.4 : 1.6),
        s: (kid ? 4 : 5) + Math.random() * 6,
        c: COLORS[i % COLORS.length],
        r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
        circ: Math.random() < 0.4, ph: Math.random() * Math.PI * 2
      });
    }
    var LIFE = kid ? 2100 : 3000;
    function tick(now){
      var t = now - t0, k = t / LIFE;
      cx.clearRect(0, 0, W, H);
      if (k >= 1) return;
      var fade = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      parts.forEach(function(p){
        p.vy += kid ? 0.09 : -0.012;
        p.vx *= 0.99; p.vy *= kid ? 0.995 : 0.99;
        p.x += p.vx + Math.sin(t / 260 + p.ph) * (kid ? 0.7 : 1.1);
        p.y += p.vy; p.r += p.vr;
        cx.save(); cx.globalAlpha = fade; cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
        if (p.circ){ cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, Math.PI * 2); cx.fill(); }
        else if (kid){ cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
        else { cx.beginPath(); cx.ellipse(0, 0, p.s / 2, p.s / 3.2, 0, 0, Math.PI * 2); cx.fill(); }
        cx.restore();
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function open(){
    if (document.body.classList.contains('open')) return;
    /* registers immediately: crack + flap + lift begin on this tap */
    document.body.classList.add('opening');
    document.body.classList.add('open');
    popBurst();
    clearTimeout(settleTimer); clearTimeout(finaleTimer);
    if (!window.__lcScene || window.__lcScene === 'bigview' || window.__lcScene === 'chilling') finaleTimer = setTimeout(finale, MIDDLE_MS - 1900);
    settleTimer = setTimeout(function(){
      document.body.classList.add('settled');
    }, MIDDLE_MS);
  }
  function reseal(){
    clearTimeout(settleTimer); clearTimeout(finaleTimer);
    var cv = document.getElementById('fx');
    if (cv) { var cx = cv.getContext('2d'); if (cx) cx.clearRect(0, 0, cv.width, cv.height); }
    document.body.classList.remove('settled');
    document.body.classList.remove('open');
    document.body.classList.remove('opening');
    window.scrollTo(0,0);
  }
  /* the finale: three bursts over the living fireworks, then the photo comes to rest */
  function finale(){
    var cv = document.getElementById('fx'); if (!cv) return;
    var frame = cv.parentElement;
    var W = frame.clientWidth, H = frame.clientHeight; if (!W || !H) return;
    cv.width = W; cv.height = H;
    var cx = cv.getContext('2d'); if (!cx) return;
    var COLORS = ['#ecd28a', '#fff6dd', '#e88ca0', '#c9a24d'];
    var parts = [];
    function burst(bx, by, delay){
      setTimeout(function(){
        var col = COLORS[Math.floor(Math.random() * COLORS.length)];
        for (var i = 0; i < 46; i++){
          var a = (i / 46) * Math.PI * 2 + Math.random() * 0.2;
          var sp = 1.1 + Math.random() * 2.3;
          parts.push({x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.4, life: 1, col: col, r: 1 + Math.random() * 1.6});
        }
      }, delay);
    }
    burst(W * 0.30, H * 0.34, 0);
    burst(W * 0.68, H * 0.26, 380);
    burst(W * 0.50, H * 0.46, 760);
    var t0 = null;
    function tick(ts){
      if (!t0) t0 = ts;
      var el = ts - t0;
      cx.clearRect(0, 0, W, H);
      parts = parts.filter(function(p){ return p.life > 0; });
      parts.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.vy += 0.016; p.vx *= 0.985; p.vy *= 0.99; p.life -= 0.011;
        cx.globalAlpha = Math.max(p.life, 0);
        cx.fillStyle = p.col;
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI * 2); cx.fill();
      });
      cx.globalAlpha = 1;
      if (el < 2100) requestAnimationFrame(tick);
      else cx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(tick);
  }
  front.addEventListener('click', open);
  document.getElementById('replay').addEventListener('click', reseal);
</script>
