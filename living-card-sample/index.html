<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Living Card — Happy New Year, Sofia (sample)</title>
<meta name="description" content="A Living Card: a sealed greeting that opens onto a living photo — a beginning, a middle, and an end. Personalized, sendable, one link.">
<style>
  :root{
    --burgundy:#5d1220; --burgundy-deep:#3d0a15; --burgundy-flap:#6e1626;
    --gold:#c9a24d; --gold-bright:#ecd28a;
    --ivory:#faf5ea; --ink:#3a2c22;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:Didot,"Playfair Display",Georgia,"Times New Roman",serif;
    background:#221016 radial-gradient(120% 90% at 50% 0%, #3a0e1a 0%, #221016 60%);
    color:var(--ink); overflow:hidden;
  }
  #scene{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:18px; perspective:1100px;}

  /* ---------- the inside card (sits beneath the envelope front) ---------- */
  #card{
    position:relative; width:min(430px, 94vw); max-height:94dvh; overflow:auto; scrollbar-width:none;
    background:var(--ivory);
    border-radius:6px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.4);
    padding:26px 22px 18px;
    text-align:center;
    opacity:0; transform:translateY(26px) scale(.93);
    transition:opacity .8s ease .5s, transform .8s cubic-bezier(.22,.9,.3,1) .5s;
  }
  #card::-webkit-scrollbar{display:none}
  #card::before{
    content:""; position:absolute; inset:9px; border:1px solid var(--gold);
    border-radius:3px; pointer-events:none; opacity:.75;
  }
  body.open #card{opacity:1; transform:none}
  .over{font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:#8a6d2f; margin-top:4px}
  .frame{
    position:relative; border:2px solid var(--gold); border-radius:3px; overflow:hidden;
    box-shadow:0 10px 26px rgba(60,30,10,.25); background:#101018;
    aspect-ratio:4/3.4; margin:14px 4px 0;
  }
  .frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block; overflow:hidden}
  .frame canvas#fx{position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none}
  #burst{position:fixed; inset:0; pointer-events:none; opacity:0; z-index:4;
    background:radial-gradient(60% 50% at 50% 46%, rgba(255,236,170,.95) 0%, rgba(236,210,138,.45) 42%, transparent 72%)}
  body.opening #burst{animation:burstflash 1s ease .3s}
  @keyframes burstflash{0%{opacity:0}22%{opacity:.85}100%{opacity:0}}
  /* The photo is HELD STILL — no push-in, no zoom, no pan.
     The living light inside the photo is the only motion. */
  .frame img.still{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
    opacity:0; transition:opacity 1.6s ease; pointer-events:none;
  }
  body.settled .frame img.still{opacity:1}
  .message{
    font-family:Georgia,serif; font-style:italic; font-size:17px; line-height:1.55;
    color:#5c4a38; margin:16px 12px 0;
  }
  .closing{
    font-size:21px; line-height:1.35; color:var(--ink); margin:18px 10px 0;
    opacity:0; transform:translateY(8px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .signature{
    font-family:Georgia,serif; font-style:italic; font-size:16px; color:#5c4a38; margin-top:8px;
    opacity:0; transform:translateY(8px);
    transition:opacity .9s ease .25s, transform .9s ease .25s;
  }
  body.settled .closing, body.settled .signature{opacity:1; transform:none}
  .flourish{color:var(--gold); letter-spacing:.5em; font-size:12px; margin:14px 0 6px}
  .brand{margin-top:6px; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:#a08b62}
  #replay{
    margin-top:12px; background:var(--burgundy); color:#f5e7c8; border:1px solid var(--gold);
    border-radius:999px; cursor:pointer; padding:10px 26px;
    font-family:Georgia,serif; font-size:14px; letter-spacing:.12em;
    opacity:0; pointer-events:none; transition:opacity .9s ease .5s;
  }
  body.settled #replay{opacity:1; pointer-events:auto}
  #replay:active{transform:scale(.97)}

  /* ---------- the sealed envelope front ---------- */
  #front{
    position:absolute; inset:0; z-index:5; cursor:pointer; border:none; width:100%; text-align:center;
    background:
      linear-gradient(155deg, transparent 49.6%, rgba(0,0,0,.28) 50%, transparent 50.6%),
      linear-gradient(-155deg, transparent 49.6%, rgba(0,0,0,.28) 50%, transparent 50.6%),
      radial-gradient(130% 100% at 50% 0%, #7a1a2c 0%, var(--burgundy) 55%, var(--burgundy-deep) 100%);
    color:#f5e7c8; display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform-style:preserve-3d;
    transition:opacity .45s ease .55s, transform .45s ease .55s;
    font-family:inherit;
  }
  body.open #front{opacity:0; transform:translateY(-30px); pointer-events:none}
  /* top envelope flap — lifts open on rotateX */
  #flap{
    position:absolute; top:0; left:0; right:0; height:41%;
    background:linear-gradient(180deg, var(--burgundy-flap) 0%, var(--burgundy) 100%);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    transition:transform .55s ease .18s, opacity .3s ease .55s;
    backface-visibility:hidden;
  }
  body.opening #flap, body.open #flap{transform:rotateX(-165deg); opacity:0}
  #front .f-for,#front .f-name,#front .f-from,#front .tap{position:relative; z-index:2}
  #front .f-for{font-size:15px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold-bright); opacity:.95; margin-top:8px}
  #front .f-name{font-size:52px; line-height:1.15; margin:10px 12px 6px; font-weight:600; text-shadow:0 2px 14px rgba(0,0,0,.35)}
  #front .f-from{font-family:Georgia,serif; font-style:italic; font-size:16px; color:#efe0ba; margin-bottom:34px}
  #seal{
    position:relative; width:96px; height:96px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8c877 0%, var(--gold) 45%, #97742c 100%);
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 2px 5px rgba(255,255,255,.55), inset 0 -4px 8px rgba(90,60,0,.55);
    outline:2px solid rgba(236,210,138,.5); outline-offset:5px;
  }
  #seal .half{
    position:absolute; top:0; bottom:0; width:50%; overflow:hidden;
    display:flex; align-items:center; color:#5d4413; font-size:26px; letter-spacing:.04em;
    transition:transform .35s ease, opacity .35s ease;
  }
  #seal .half.l{left:0; justify-content:flex-end; padding-right:2px; border-radius:48px 0 0 48px}
  #seal .half.r{right:0; justify-content:flex-start; padding-left:2px; border-radius:0 48px 48px 0}
  /* the seal cracks: halves split apart and fade */
  body.opening #seal .half.l, body.open #seal .half.l{transform:translate(-14px,-6px) rotate(-14deg); opacity:0}
  body.opening #seal .half.r, body.open #seal .half.r{transform:translate(14px,6px) rotate(14deg); opacity:0}
  body.opening #seal, body.open #seal{box-shadow:0 6px 18px rgba(0,0,0,.2)}
  #front .tap{margin-top:36px; font-family:Georgia,serif; font-style:italic; font-size:14px; color:#e9d9ae; animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    #front, #card, #seal .half, #flap, .closing, .signature, #replay, .frame img.still{
      transition-duration:.2s; transition-delay:0s;
    }
    #flap{transform:none}
    body.opening #flap, body.open #flap{opacity:0}
    #front .tap{animation:none}
  }
</style>
</head>
<body>
<div id="scene">
  <div id="burst" aria-hidden="true"></div>

  <main id="card" aria-label="The opened New Year card for Sofia">
    <div class="over">A Living Card</div>
    <div class="frame">
      <iframe src="https://geemondc.github.io/big-view/#wall" title="Living photo — fireworks over the water" allow="autoplay" loading="eager" scrolling="no"></iframe>
      <canvas id="fx" aria-hidden="true"></canvas>
      <img class="still" src="https://geemondc.github.io/big-view/still.jpg" alt="Fireworks over the water, at rest">
    </div>
    <p class="message">Another year, same favorite view — you, right next to me.</p>
    <p class="closing">Happy New Year, Sofia.</p>
    <p class="signature">With love, James — here&rsquo;s to 2027</p>
    <div class="flourish">✦ ✦ ✦</div>
    <div class="brand">A Living Card · Living Photos</div>
    <button id="replay" type="button">Replay</button>
  </main>

  <button id="front" type="button" aria-label="Sealed card for Sofia, from James. Tap the seal to open.">
    <div id="flap" aria-hidden="true"></div>
    <div class="f-for">For Sofia</div>
    <div class="f-name">Sofia</div>
    <div class="f-from">Happy New Year, from James</div>
    <div id="seal" aria-hidden="true"><span class="half l">S</span><span class="half r">J</span></div>
    <div class="tap">Tap the seal to open</div>
  </button>

</div>
<script>
  /* ---------- personalization via URL params: ?to=&from=&line=&scene=bigview|chilling ----------
     No params at all renders the original Sofia & James sample, untouched. */
  (function(){
    var q = new URLSearchParams(window.location.search);
    function clean(v, cap){
      if (v == null) return '';
      return String(v).replace(/[\u0000-\u001F\u007F]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, cap);
    }
    var hasParams = ['to','from','line','scene'].some(function(k){ return q.has(k); });
    if (!hasParams) return;
    var scene = clean(q.get('scene'), 20).toLowerCase() === 'chilling' ? 'chilling' : 'bigview';
    var to = clean(q.get('to'), 60) || 'Sofia';
    var from = clean(q.get('from'), 60) || 'James';
    var rawLine = q.has('line') ? clean(q.get('line'), 140) : null;
    var DEF_LINE = 'Another year, same favorite view — you, right next to me.';
    var line = rawLine !== null ? rawLine : (scene === 'bigview' ? DEF_LINE : '');
    var headline = scene === 'chilling' ? ('For ' + to + ', with love.') : ('Happy New Year, ' + to + '.');
    var greeting = scene === 'chilling' ? 'Thinking of you' : 'Happy New Year';
    function setText(sel, txt){ var el = document.querySelector(sel); if (el) el.textContent = txt; }
    setText('#front .f-for', 'For ' + to);
    setText('#front .f-name', to);
    setText('#front .f-from', greeting + ', from ' + from);
    var sealL = document.querySelector('#seal .half.l'), sealR = document.querySelector('#seal .half.r');
    if (sealL) sealL.textContent = (to.charAt(0) || '•').toUpperCase();
    if (sealR) sealR.textContent = (from.charAt(0) || '•').toUpperCase();
    var frontEl = document.getElementById('front');
    if (frontEl) frontEl.setAttribute('aria-label', 'Sealed card for ' + to + ', from ' + from + '. Tap the seal to open.');
    var cardEl = document.getElementById('card');
    if (cardEl) cardEl.setAttribute('aria-label', 'The opened card for ' + to);
    var msg = document.querySelector('#card .message');
    if (msg){ if (line){ msg.textContent = line; } else { msg.style.display = 'none'; } }
    setText('#card .closing', headline);
    setText('#card .signature', 'With love, ' + from);
    document.title = 'A Living Card — for ' + to;
    if (scene === 'chilling'){
      var fr = document.querySelector('.frame iframe');
      if (fr){ fr.src = 'https://chillingathome.lovable.app'; fr.title = 'Living photo — golden hour at home'; }
      var st = document.querySelector('.frame img.still');
      if (st){ st.src = 'https://thelivingphotos.com/img/p-84bd458431.jpg'; st.alt = 'Golden hour at home, at rest'; }
    }
  })();

  var front = document.getElementById('front');
  var settleTimer = null;
  var MIDDLE_MS = 11300; /* living middle, a firework finale, then the scene settles to rest */
  var finaleTimer = null;

  function open(){
    if (document.body.classList.contains('open')) return;
    /* registers immediately: crack + flap + lift begin on this tap */
    document.body.classList.add('opening');
    document.body.classList.add('open');
    clearTimeout(settleTimer); clearTimeout(finaleTimer);
    finaleTimer = setTimeout(finale, MIDDLE_MS - 1900);
    settleTimer = setTimeout(function(){
      document.body.classList.add('settled');
    }, MIDDLE_MS);
  }
  function reseal(){
    clearTimeout(settleTimer); clearTimeout(finaleTimer);
    var cv = document.getElementById('fx');
    if (cv) { var cx = cv.getContext('2d'); if (cx) cx.clearRect(0, 0, cv.width, cv.height); }
    document.body.classList.remove('settled');
    document.body.classList.remove('open');
    document.body.classList.remove('opening');
    window.scrollTo(0,0);
  }
  /* the finale: three bursts over the living fireworks, then the photo comes to rest */
  function finale(){
    var cv = document.getElementById('fx'); if (!cv) return;
    var frame = cv.parentElement;
    var W = frame.clientWidth, H = frame.clientHeight; if (!W || !H) return;
    cv.width = W; cv.height = H;
    var cx = cv.getContext('2d'); if (!cx) return;
    var COLORS = ['#ecd28a', '#fff6dd', '#e88ca0', '#c9a24d'];
    var parts = [];
    function burst(bx, by, delay){
      setTimeout(function(){
        var col = COLORS[Math.floor(Math.random() * COLORS.length)];
        for (var i = 0; i < 46; i++){
          var a = (i / 46) * Math.PI * 2 + Math.random() * 0.2;
          var sp = 1.1 + Math.random() * 2.3;
          parts.push({x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.4, life: 1, col: col, r: 1 + Math.random() * 1.6});
        }
      }, delay);
    }
    burst(W * 0.30, H * 0.34, 0);
    burst(W * 0.68, H * 0.26, 380);
    burst(W * 0.50, H * 0.46, 760);
    var t0 = null;
    function tick(ts){
      if (!t0) t0 = ts;
      var el = ts - t0;
      cx.clearRect(0, 0, W, H);
      parts = parts.filter(function(p){ return p.life > 0; });
      parts.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.vy += 0.016; p.vx *= 0.985; p.vy *= 0.99; p.life -= 0.011;
        cx.globalAlpha = Math.max(p.life, 0);
        cx.fillStyle = p.col;
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI * 2); cx.fill();
      });
      cx.globalAlpha = 1;
      if (el < 2100) requestAnimationFrame(tick);
      else cx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(tick);
  }
  front.addEventListener('click', open);
  document.getElementById('replay').addEventListener('click', reseal);
</script>
</body>
</html>
