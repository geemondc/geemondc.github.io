  #phxStage .phx-photo, #phxStage .phx-flap{position:absolute; inset:0; background-image:var(--phxImg); background-size:100% 100%; background-repeat:no-repeat}
  #phxStage .phx-photo{opacity:1; transition:opacity .35s ease 1.5s}
  body.open #phxStage .phx-photo{opacity:0}
  body:not(.open) #phxStage .phx-photo{transition:opacity .3s ease .15s}
  #phxStage .phx-in{position:absolute; left:3.3%; right:2.8%; top:7.2%; bottom:6.1%; opacity:0;
    transition:opacity .6s ease .5s; background:var(--phxIn); box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
  body.open #phxStage .phx-in{opacity:1}
  #phxStage .phx-flap{clip-path:polygon(3.3% 7.2%, 97.2% 7.2%, 97.2% 16%, 56.9% 50.3%, 55.7% 55.7%, 49.6% 57.6%, 43.5% 55.7%, 42.3% 50.3%, 3.3% 16%);
    transform-origin:50% 7.2%;
    transition:transform 1.5s cubic-bezier(.3,.6,.35,1) .5s, opacity .35s ease 1.95s}
  body.open #phxStage .phx-flap{transform:perspective(900px) rotateX(168deg); opacity:0}
  #phxStage .phx-fu{position:absolute; inset:0; background:var(--phxUnder); opacity:0; transition:opacity .01s linear 1.22s}
  body.open #phxStage .phx-fu{opacity:1}
  /* Seal initials — E for Em, G for gee — stamped on the seal, riding the flap */
  #phxStage .phx-ini{position:absolute; left:49.6%; top:50.3%; transform:translate(-50%,-50%);
    font-size:4.6vw; font-size:4.4cqw; letter-spacing:.05em; color:#57101f; pointer-events:none;
    text-shadow:0 1px 0 rgba(255,238,190,.45)}
  #phxStage .phx-halo{position:absolute; left:41.1%; top:41.8%; width:17%; aspect-ratio:1/1; border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(circle, rgba(255,236,170,.9) 0%, rgba(236,210,138,.38) 45%, rgba(236,210,138,0) 72%)}
  body.opening #phxStage .phx-halo{animation:ptGlowFade 1.25s ease both}
  #phxStage .phx-seams{position:absolute; inset:0; width:100%; height:100%; opacity:0; overflow:visible}
  body.opening #phxStage .phx-seams{animation:ptGlowFade 1.25s ease both}
  #phxStage .phx-seams path{fill:none; stroke:#ffe9a8; stroke-width:2.4; vector-effect:non-scaling-stroke; filter:drop-shadow(0 0 4px rgba(255,233,168,.95))}
  @keyframes ptGlowFade{0%{opacity:0}18%{opacity:1}62%{opacity:1}100%{opacity:0}}

  #hint{position:fixed; left:50%; bottom:calc(50dvh - max(0dvh, min(13dvh, calc(100vw - 52dvh))) - min(48vw, 31dvh) + 96px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5; pointer-events:none;
    font-size:16px; font-weight:700; letter-spacing:.34em; text-transform:uppercase; color:#96791d; text-shadow:0 1px 0 rgba(255,255,255,.45), 0 0 6px rgba(201,162,39,.35);
    opacity:1; transition:opacity .4s ease}
  body.open #hint, body.opening #hint{opacity:0}

  /* ---- The card ---- */
  #card{position:absolute; left:50%; top:50%; z-index:6; width:min(92vw, 430px);
    transform:translate(-50%,-45%) scale(.97); opacity:0; pointer-events:none;
    transition:opacity .7s ease, transform .7s ease;
    background:linear-gradient(170deg, #fbf6ea, #f4ecd9);
    border:1px solid #c9a227;
    box-shadow:0 24px 60px rgba(10,2,6,.55), inset 0 0 0 4px #fbf6ea, inset 0 0 0 5px rgba(201,162,39,.45);
    padding:20px 18px 18px; text-align:center; color:#43301f}
  body.card-in #card{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1)}
  .c-to{font-size:23px; letter-spacing:.14em; color:#5e1220; margin-bottom:12px}
  .c-frame{border:1px solid rgba(201,162,39,.75); background:#fffdf6; padding:6px}
  .c-photo{position:relative; aspect-ratio:1930/1364; background:#14100c; box-shadow:0 4px 18px rgba(40,10,20,.35)}
  .c-photo img{position:absolute; inset:0; width:100%; height:100%; display:block}
  .c-msg{margin-top:14px; font-size:15.5px; line-height:1.6; font-style:italic}
  .c-sign{margin-top:12px; font-size:16.5px; line-height:1.5; color:#5e1220}

  /* ---- Controls ---- */
  #bar{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%, 14px); z-index:10;
    display:flex; gap:8px; opacity:0; pointer-events:none; transition:opacity .45s ease, transform .45s ease}
  #bar.show{opacity:1; pointer-events:auto; transform:translate(-50%, 0)}
  #bar button{appearance:none; cursor:pointer; font-family:inherit; font-size:12.5px; letter-spacing:.2em; text-transform:uppercase;
    padding:10px 18px; border-radius:999px; border:1px solid #c9a227; background:#5e1220; color:#ffeec9}
  #bar button.on{background:#ffeec9; color:#5e1220}

  <div id="tapZone" role="button" aria-label="Open the envelope"></div>

  <div id="phxStage" aria-hidden="true">
    <div class="phx-photo"></div>
    <div class="phx-in"></div>
    <div class="phx-flap"><i class="phx-fu"></i><span class="phx-ini">E&middot;G</span></div>
    <div class="phx-halo"></div>
    <svg class="phx-seams" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <g><path d="M3.3 16 L42.3 50.3"/><path d="M97.2 16 L56.9 50.3"/></g>
    </svg>
  </div>

  <div id="card" aria-hidden="true">
    <div class="c-to">Em</div>
    <div class="c-frame">
      <div class="c-photo">
        <img src="https://geemondc.github.io/fletch/still.jpg" alt="Gary and Emily with Glenn's dog Fletch, September 1996">
        <img id="pDay" src="https://geemondc.github.io/fletch/day.jpg" alt="">
        <img id="pGolden" src="https://geemondc.github.io/fletch/golden.jpg" alt="">
      </div>
    </div>
    <p class="c-msg">Hey Em.... just wanted to send you a photo from 1996 at Glenn's townhouse. I'm working on a photo project and a more modern way to send emails and invitations and notes. looks like you having fun in Philly.. :P</p>
    <div class="c-sign"><div>xoxo,</div><div>gee</div></div>
  </div>

  <div id="hint">Tap to open</div>

  <div id="bar">
    <button id="btnStill" type="button">Still</button><button id="btnLiving" type="button" class="on">Living</button><button id="btnReplay" type="button">Replay</button>
  </div>

<script>
(function(){
  "use strict";
  var body = document.body;
  var bar = document.getElementById('bar');
  var btnStill = document.getElementById('btnStill');
  var btnLiving = document.getElementById('btnLiving');
  var opened = false, arriveTimer = null, barTimer = null;

  /* The Fletch living cycle — the current live build's timeline, verbatim
     (trim #3, Nov 10): T = 12.3333s. Still holds 0-4s, day fades in
     4-7.33s, day dwell to 10s, golden rises 10-10.33s cut off at 0.125,
     then a 2s return to the still. The glow/evening leg stays cut. */
  var T = 12.3333;
  function opacities(t){
    t = ((t % T) + T) % T;
    if (t < 4)       return { day:0, golden:0 };
    if (t < 7.3333)  return { day:(t-4)/3.3333, golden:0 };
    if (t < 10.0)    return { day:1, golden:0 };
    if (t < 10.3333) return { day:1, golden:(t-10)/2.6667 };
    var u = 1-(t-10.3333)/2.0;
    return { day:u, golden:0.125*u };
  }
  var lyrDay = document.getElementById('pDay');
  var lyrGolden = document.getElementById('pGolden');
  var mode = 'still';           // 'still' | 'living'
  var anchorT = 0, anchorP = 0, pausedP = 0;
  function phaseNow(now){ return anchorP + (now - anchorT)/1000; }
  function frame(now){
    var so = { day:0, golden:0 };
    if (mode === 'living') so = opacities(phaseNow(now));
    lyrDay.style.opacity = so.day;
    lyrGolden.style.opacity = so.golden;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function syncBtns(){
    btnStill.classList.toggle('on', mode === 'still');
    btnLiving.classList.toggle('on', mode === 'living');
  }
  function startLiving(){
    anchorP = 0; anchorT = performance.now(); pausedP = 0;
    mode = 'living'; syncBtns();
  }
  function openCard(){
    if (opened) return;
    opened = true;
    body.classList.add('opening');
    body.classList.add('open');
    clearTimeout(arriveTimer); clearTimeout(barTimer);
    arriveTimer = setTimeout(function(){
      body.classList.add('card-in');
      document.getElementById('card').setAttribute('aria-hidden','false');
      startLiving();
      barTimer = setTimeout(function(){ bar.classList.add('show'); }, 450);
    }, 2050);
  }
  function reseal(){
    opened = false;
    clearTimeout(arriveTimer); clearTimeout(barTimer);
    bar.classList.remove('show');
    body.classList.remove('card-in');
    document.getElementById('card').setAttribute('aria-hidden','true');
    body.classList.remove('open');
    body.classList.remove('opening');
    mode = 'still'; pausedP = 0; syncBtns();
  }
  document.getElementById('tapZone').addEventListener('click', openCard);
  btnStill.addEventListener('click', function(){
    if (mode === 'living') pausedP = phaseNow(performance.now());
    mode = 'still'; syncBtns();
  });
  btnLiving.addEventListener('click', function(){
    if (mode !== 'living'){
      anchorP = pausedP; anchorT = performance.now();
      mode = 'living'; syncBtns();
    }
  });
  document.getElementById('btnReplay').addEventListener('click', reseal);
  syncBtns();
})();
</script>
</body>
</html>
