<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living Cards — Birthday · The Birthday Room</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  .stage { position:fixed; inset:0; background:#000; }
  video.bg {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    filter: blur(30px) brightness(.48) saturate(1.2);
    transform: scale(1.15);
  }
  video.fg {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; object-position:center;
  }
  .caption {
    position:absolute; left:0; right:0;
    bottom: calc(14px + env(safe-area-inset-bottom));
    text-align:center; pointer-events:none;
    color: rgba(255,255,255,.82);
    font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase;
    text-shadow: 0 1px 10px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9);
  }
</style>
</head>
<body>
  <div class="stage">
    <video class="bg" id="bg" src="film.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
    <video class="fg" id="fg" src="film.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="caption">Living Cards — Birthday · The Birthday Room</div>
  </div>
<script>
  // Keep the blurred backdrop in step with the main film.
  var fg = document.getElementById('fg'), bg = document.getElementById('bg');
  fg.addEventListener('timeupdate', function () {
    if (Math.abs(bg.currentTime - fg.currentTime) > 0.35) {
      try { bg.currentTime = fg.currentTime; } catch (e) {}
    }
  });
</script>
</body>
</html>
