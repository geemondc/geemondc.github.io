<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Christmas</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#2a0a0c;
    overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  /* soft blurred garden glow filling the letterbox on tall phones */
  .backdrop {
    position:fixed; inset:-40px;
    background:url('frames/frame1-ready.webp') center/cover no-repeat;
    filter: blur(28px) brightness(.55) saturate(1.2);
  }
  .stage {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  /* the scene: 16:9 painted firelit Christmas room (the master's own shape), one screen, no scroll */
  .scene {
    position:relative;
    width:min(100vw, calc(100dvh * 1.7778));
    aspect-ratio: 16 / 9;
    overflow:hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,.5);
  }
  /* perspective drift: the whole world breathes — slow scale + pan,
     10s out-and-back so it never jumps at the loop seam */
  .drift {
    position:absolute; inset:0;
    animation: drift 10s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes drift {
    from { transform: scale(1.015) translate(0.35%, 0.2%); }
    to   { transform: scale(1.065) translate(-0.9%, -0.6%); }
  }
  /* impact pulse on the master beat */
  .pulse { animation: pulse .45s ease-out; }
  @keyframes pulse {
    0% { transform: scale(1); } 30% { transform: scale(1.018); } 100% { transform: scale(1); }
  }
  .frame {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    transition: opacity .28s ease-in-out;
  }
  .frame.on { opacity:1; }
  /* quiet furniture riding on top */
  .chip {
    position:absolute; left:14px; bottom:12px; z-index:5;
    background:rgba(42,10,12,.55); color:#ffe3ae;
    border:1px solid rgba(255,227,174,.35);
    padding:6px 12px; border-radius:999px;
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    backdrop-filter: blur(4px);
    pointer-events:none;
  }
  .hint {
    position:absolute; right:14px; bottom:12px; z-index:5;
    color:rgba(255,255,255,.75); font-size:12px; letter-spacing:.08em;
    pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,.6);
  }

  /* closing title beat (the GOOD SPIKE standard):
     after the play resolves, the closing words fade/scale in across the TOP
     of the final frame — Baloo 2 ExtraBold, red #E8232A, cream outline —
     hold ~1.1 s, then melt away as the loop resets. The title is a rendered
     overlay in frames/ (same asset the preview uses); it lives outside the
     drift layer: it sits ON the picture, it doesn't ride it. */
  .gametitle-img {
    position:absolute; inset:0; z-index:6;
    width:100%; height:100%;
    pointer-events:none;
    opacity:0; transform: scale(.82) translateY(-6px);
    transition: opacity .28s ease-in-out, transform .28s ease-in-out;
  }
  .gametitle-img.show {
    opacity:1; transform: scale(1) translateY(0);
    transition: opacity .3s ease-out, transform .5s cubic-bezier(.2,1.4,.35,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .drift { animation:none; }
  }

  .cap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(28,6,8,.55);color:#ffedd0;padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:.04em;backdrop-filter:blur(4px);white-space:nowrap}
  .cap{display:none}
  body.wallmode .cap{display:none}
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="stage">
    <div class="scene" id="scene">
      <div class="drift" id="drift">
        <img class="frame" src="frames/frame1-ready.webp" alt="Ready — the tree stands plain and unlit, all eight friends stepped back holding ornaments at waist height, the golden star resting on the gifts, everyone looking at the tree expectant">
        <img class="frame" src="frames/frame2-hanging.webp" alt="Decorating — everyone reaching to hang baubles, the garland partly draped, the tree still dark">
        <img class="frame" src="frames/frame3-starlift.webp" alt="The lift — the tree fully ornamented but unlit; Braids on the stool holds the golden star just below the treetop, every gaze up">
        <img class="frame" src="frames/frame4-master.webp" alt="The blaze — the star seated and glowing, the whole tree blazing, all eight friends delighted — the original painting">
        <img class="frame" src="frames/frame5-titlebase.webp" alt="The master holds — the blaze breathes, the tree glowing steady, everyone still delighted">
      </div>
      <img class="gametitle-img" id="gametitle" src="frames/title-merry-christmas.png" alt="">
    </div>
  </div>
<script>
(function () {
  var frames = Array.prototype.slice.call(document.querySelectorAll('.frame'));
  var scene  = document.getElementById('scene');
  /* one 6.1-second loop: the ready, the decorating, the star lift,
     the master (the tree blazing), the master holds.
     The final frame's hold crossfades back into frame 1's ready — the next decorating. */
  var holds  = [900, 700, 1100, 500, 1800, 1100]; /* ms — sums to 6100; the last beat is the title over the final frame */
  var CONTACT_FRAME = 2; /* 0-based: frame 3, the star lift — the pulse lands as the master arrives */
  var title  = document.getElementById('gametitle');
  var TITLE_BEAT = frames.length; /* one past the last frame: the final frame stays up, the title shows */
  var i = 0, timer = null, paused = false;

  function show(n) {
    var d = Math.min(n, frames.length - 1); /* the title beat keeps the final frame up */
    frames.forEach(function (f, k) {
      f.classList.toggle('on', k === d);
      f.style.zIndex = (k === d) ? 2 : 1;
    });
    title.classList.toggle('show', n === TITLE_BEAT);
    if (n === CONTACT_FRAME + 1) {        /* the beat right after the lift, as the blaze lands */
      scene.classList.remove('pulse'); void scene.offsetWidth; scene.classList.add('pulse');
    }
  }
  function step() {
    show(i);
    timer = setTimeout(function () { i = (i + 1) % (frames.length + 1); step(); }, holds[i]);
  }
  function start() { if (!timer) step(); }
  function stop()  { clearTimeout(timer); timer = null; }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { show(0); }
  else {
    /* start only once the first two frames are ready, so there's no blank flash */
    var ready = 0;
    [0, 1].forEach(function (k) {
      if (frames[k].complete) { if (++ready === 2) start(); }
      else frames[k].addEventListener('load', function () { if (++ready === 2) start(); });
    });
    if (!timer && ready < 2) setTimeout(start, 900); /* never sit blank */
  }

})();
</script>
<div class="cap">Christmas &middot; a living card scene</div>
<script>
if (location.hash.indexOf('wall') >= 0) document.body.classList.add('wallmode');
window.LP = { state: function(){ return document.body.className; } };
</script>
</body>
</html>
