<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baseball B</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b0e1a;font-family:Georgia,serif}
.stage{position:fixed;inset:0;background:#000}.stage::before{content:"";position:absolute;inset:0;background:url(still.jpg) center/cover no-repeat;filter:blur(26px) brightness(.72) saturate(1.15);transform:scale(1.15)}
.stage img.lyr{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;aspect-ratio:1.7778;margin:auto;max-width:min(100%,calc(100vh * 1.7778));max-height:min(100%,calc(100vw / 1.7778))}
img.day{}
img.sunset{opacity:0;filter:sepia(.38) saturate(1.55) hue-rotate(-14deg) brightness(.97) contrast(1.04)}
img.nightl{opacity:0;filter:brightness(.34) saturate(.9) hue-rotate(16deg) contrast(1.08)}
body.living img.sunset{animation:sunsetPh 20s linear infinite}
body.living img.nightl{animation:nightPh 20s linear infinite}
@keyframes sunsetPh{0%,12%{opacity:0}19%,26%{opacity:1}34%,100%{opacity:0}}
@keyframes nightPh{0%,28%{opacity:0}36%,44%{opacity:1}50%,100%{opacity:0}}
.wash{position:absolute;inset:0;pointer-events:none;opacity:0}
.washSun{background:linear-gradient(180deg,rgba(255,138,42,.14),rgba(255,94,58,.20) 58%,rgba(120,40,70,.16))}
.washNight{background:linear-gradient(180deg,rgba(8,12,48,.34),rgba(12,8,40,.18) 55%,rgba(4,4,20,.34))}
body.living .washSun{animation:sunsetWash 20s linear infinite}
body.living .washNight{animation:nightWash 20s linear infinite}
@keyframes sunsetWash{0%,24%{opacity:0}38%,50%{opacity:.55}64%,100%{opacity:0}}
@keyframes nightWash{0%,56%{opacity:0}70%,86%{opacity:.55}98%,100%{opacity:0}}
.glowlayer{position:absolute;inset:0;pointer-events:none}
body.living .glowlayer{animation:glowPh 20s linear infinite}
@keyframes glowPh{0%,24%{opacity:.45}50%{opacity:.7}70%,86%{opacity:1}98%,100%{opacity:.45}}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;opacity:0}
@keyframes breathe{0%,100%{opacity:.12}50%{opacity:.42}}
body.living .glow{animation:breathe 7s ease-in-out infinite}
body.still img.sunset,body.still img.nightl,body.still .wash{animation:none;opacity:0}
body.still .glow{animation:none;opacity:0}
.cap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(10,12,24,.55);color:#f3e9d2;padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:.04em;backdrop-filter:blur(4px);white-space:nowrap}
body.wallmode .cap{display:none}
</style></head>
<body class="living">
<div class="stage">
<img class="lyr day" src="still.jpg" alt="Baseball B">
<img class="lyr sunset" src="still.jpg" alt="" aria-hidden="true">
<img class="lyr nightl" src="still.jpg" alt="" aria-hidden="true">
<div class="wash washSun"></div>
<div class="wash washNight"></div>
<div class="glowlayer">
<div class="glow" style="left:4%;top:2%;width:210px;height:210px;background:radial-gradient(circle,rgba(255,214,140,.85) 0%,transparent 70%);animation-delay:0.0s"></div>
<div class="glow" style="left:86%;top:2%;width:210px;height:210px;background:radial-gradient(circle,rgba(255,214,140,.85) 0%,transparent 70%);animation-delay:1.6s"></div>
<div class="glow" style="left:44%;top:6%;width:260px;height:260px;background:radial-gradient(circle,rgba(255,214,140,.85) 0%,transparent 70%);animation-delay:3.0s"></div>
</div>
</div>
<div class="cap">Baseball B &middot; a living card scene</div>
<script>
if (location.hash.indexOf('wall') >= 0) document.body.classList.add('wallmode');
window.LP = { state: function(){ return document.body.className; } };
</script>
</body></html>
