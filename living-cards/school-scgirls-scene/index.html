<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer — Girls</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b0e1a;font-family:Georgia,serif}
.stage{position:fixed;inset:0;background:#000}.stage::before{content:"";position:absolute;inset:0;background:url(still.jpg) center/cover no-repeat;filter:blur(26px) brightness(.72) saturate(1.15);transform:scale(1.15)}
.stage img.lyr{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;aspect-ratio:1.7778;margin:auto;max-width:min(100%,calc(100vh * 1.7778));max-height:min(100%,calc(100vw / 1.7778))}
img.day{}
img.sunset{opacity:0;filter:sepia(.38) saturate(1.75) hue-rotate(-18deg) brightness(1.03) contrast(1.02);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 34%,transparent 62%);mask-image:linear-gradient(180deg,#000 0%,#000 34%,transparent 62%)}
img.nightl{opacity:0}
img.bloom{opacity:0;filter:saturate(1.6) contrast(1.05) brightness(1.01);-webkit-mask-image:linear-gradient(180deg,transparent 26%,#000 56%,#000 100%);mask-image:linear-gradient(180deg,transparent 26%,#000 56%,#000 100%)}
body.living img.sunset{animation:skyWarm 20s linear infinite}
body.living img.bloom{animation:bloomPh 20s linear infinite}
@keyframes skyWarm{0%,10%{opacity:0}20%,32%{opacity:1}46%,100%{opacity:0}}
@keyframes bloomPh{0%,22%{opacity:0}38%,64%{opacity:.9}80%,100%{opacity:0}}
.wash{position:absolute;inset:0;pointer-events:none;opacity:0}
.washSun{background:linear-gradient(180deg,rgba(255,150,50,.20),rgba(255,94,58,.16) 55%,transparent 78%);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 34%,transparent 62%);mask-image:linear-gradient(180deg,#000 0%,#000 34%,transparent 62%)}
.washNight{background:linear-gradient(180deg,rgba(52,44,150,.48),rgba(96,58,160,.30) 52%,rgba(140,70,140,.12) 72%,transparent 82%);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 40%,transparent 70%);mask-image:linear-gradient(180deg,#000 0%,#000 40%,transparent 70%)}
body.living .washSun{animation:washWarm 20s linear infinite}
body.living .washNight{animation:washDusk 20s linear infinite}
@keyframes washWarm{0%,14%{opacity:0}24%,34%{opacity:.5}48%,100%{opacity:0}}
@keyframes washDusk{0%,44%{opacity:0}58%,74%{opacity:.85}90%,100%{opacity:0}}
.glowlayer{position:absolute;inset:0;pointer-events:none}
body.living .glowlayer{animation:glowPh 20s linear infinite}
@keyframes glowPh{0%,40%{opacity:.35}58%,76%{opacity:1}92%,100%{opacity:.35}}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;opacity:0}
@keyframes breathe{0%,100%{opacity:.12}50%{opacity:.42}}
body.living .glow{animation:breathe 7s ease-in-out infinite}
body.still img.sunset,body.still img.nightl,body.still img.bloom,body.still .wash{animation:none;opacity:0}
body.still .glow{animation:none;opacity:0}
.cap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(10,12,24,.55);color:#f3e9d2;padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:.04em;backdrop-filter:blur(4px);white-space:nowrap}
body.wallmode .cap{display:none}
</style></head>
<body class="living">
<div class="stage">
<img class="lyr day" src="still.jpg" alt="Soccer — Girls">
<img class="lyr sunset" src="still.jpg" alt="" aria-hidden="true">
<img class="lyr nightl" src="still.jpg" alt="" aria-hidden="true">
<img class="lyr bloom" src="still.jpg" alt="" aria-hidden="true">
<div class="wash washSun"></div>
<div class="wash washNight"></div>
<div class="glowlayer">
<div class="glow" style="left:6%;top:4%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,214,140,.85) 0%,transparent 70%);animation-delay:0.0s"></div>
<div class="glow" style="left:84%;top:4%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,214,140,.85) 0%,transparent 70%);animation-delay:1.6s"></div>
<div class="glow" style="left:44%;top:8%;width:240px;height:240px;background:radial-gradient(circle,rgba(255,214,140,.85) 0%,transparent 70%);animation-delay:3.0s"></div>
</div>
</div>
<div class="cap">Soccer — Girls &middot; a living card scene</div>
<script>
if (location.hash.indexOf('wall') >= 0) document.body.classList.add('wallmode');
window.LP = { state: function(){ return document.body.className; } };
</script>
</body></html>
