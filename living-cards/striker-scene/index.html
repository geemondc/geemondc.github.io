<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Striker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b0e1a;font-family:Georgia,serif}
.stage{position:fixed;inset:0}
.stage img.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage img.night{opacity:0}
@keyframes journey{0%,30%{opacity:0}52%,78%{opacity:1}94%,100%{opacity:0}}
body.living .stage img.night{animation:none 96s ease-in-out infinite}
body.still .stage img.night{animation:none;opacity:0}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0}
@keyframes breathe{0%,100%{opacity:.12}50%{opacity:.42}}
body.living .glow{animation:breathe 7s ease-in-out infinite}
.wash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.5s ease;background:linear-gradient(180deg,rgba(16,20,54,.32),rgba(30,16,54,.18) 55%,rgba(10,10,30,.28))}
body.night .wash{opacity:1}
.cap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(10,12,24,.55);color:#f3e9d2;padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:.04em;backdrop-filter:blur(4px);white-space:nowrap}
body.wallmode .cap{display:none}
</style></head>
<body class="living">
<div class="stage">
<img class="base" src="still.jpg" alt="The Striker">

<div class="glow" style="left:50%;top:50%;width:320px;height:320px;background:radial-gradient(circle,rgba(120,240,230,.8) 0%,transparent 70%);animation-delay:0.0s"></div>
<div class="wash"></div>
</div>
<div class="cap">The Striker &middot; a living card scene</div>
<script>
if (location.hash.indexOf('wall') >= 0) document.body.classList.add('wallmode');
var DUR = 96;
function syncNight(){
  var ph = (Date.now() % (DUR*1000)) / (DUR*1000);
  document.body.classList.toggle('night', ph > 0.50 && ph < 0.82);
}
if (DUR > 0) setInterval(syncNight, 1000);
window.LP = { state: function(){ return document.body.className; } };
</script>
</body></html>
