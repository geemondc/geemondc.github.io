<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wellness Is Non-Negotiable</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b0e1a;font-family:Georgia,serif}
.stage{position:fixed;inset:0}
.stage{position:fixed;inset:0;background:#000}.stage::before{content:"";position:absolute;inset:0;background:url(still.jpg) center/cover no-repeat;filter:blur(26px) brightness(.72) saturate(1.15);transform:scale(1.15)}.stage img.lyr{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;aspect-ratio:1.0000;margin:auto;max-width:min(100%,calc(100vh * 1.0000));max-height:min(100%,calc(100vw / 1.0000))}
img.day{}
img.sunset{opacity:0;filter:sepia(.34) saturate(1.7) hue-rotate(-6deg) brightness(1.03) contrast(1.05)}
img.nightl{opacity:0;filter:brightness(.44) saturate(1.5) hue-rotate(14deg) contrast(1.06)}
body.living img.sunset{animation:sunsetPh 48s linear infinite}
body.living img.nightl{animation:nightPh 48s linear infinite}
@keyframes sunsetPh{0%,12%{opacity:0}19%,26%{opacity:1}34%,100%{opacity:0}}
@keyframes nightPh{0%,28%{opacity:0}36%,44%{opacity:1}50%,100%{opacity:0}}
.wash{position:absolute;inset:0;pointer-events:none;opacity:0}
.washSun{background:linear-gradient(180deg,rgba(255,138,42,.14),rgba(255,94,58,.20) 58%,rgba(120,40,70,.16))}
.washNight{background:linear-gradient(180deg,rgba(10,16,54,.30),rgba(14,10,44,.16) 55%,rgba(6,6,24,.30))}
body.living .washSun{animation:sunsetWash 48s linear infinite}
body.living .washNight{animation:nightWash 48s linear infinite}
@keyframes sunsetWash{0%,24%{opacity:0}38%,50%{opacity:.55}64%,100%{opacity:0}}
@keyframes nightWash{0%,56%{opacity:0}70%,86%{opacity:.5}98%,100%{opacity:0}}
.glowlayer{position:absolute;inset:0;pointer-events:none}
body.living .glowlayer{animation:glowPh 48s linear infinite}
@keyframes glowPh{0%,24%{opacity:.45}50%{opacity:.7}70%,86%{opacity:1}98%,100%{opacity:.45}}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;opacity:0}
@keyframes breathe{0%,100%{opacity:.12}50%{opacity:.42}}
body.living .glow{animation:breathe 7s ease-in-out infinite}
body.still img.sunset,body.still img.nightl,body.still .wash{animation:none;opacity:0}
body.still .glow{animation:none;opacity:0}
.cap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(10,12,24,.55);color:#f3e9d2;padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:.04em;backdrop-filter:blur(4px);white-space:nowrap}
body.wallmode .cap{display:none}
</style></head>
<body class="living">
<div class="stage">
<img class="lyr day" src="still.jpg" alt="Your Wellness Is Non-Negotiable">
<img class="lyr sunset" src="still.jpg" alt="" aria-hidden="true">
<img class="lyr nightl" src="still.jpg" alt="" aria-hidden="true">
<div class="wash washSun"></div>
<div class="wash washNight"></div>
<div class="glowlayer">
<div class="glow" style="left:49%;top:76%;width:300px;height:240px;background:radial-gradient(circle,rgba(255,70,60,.9) 0%,transparent 70%);animation-delay:0.0s"></div><div class="glow" style="left:50%;top:30%;width:320px;height:240px;background:radial-gradient(circle,rgba(150,90,255,.75) 0%,transparent 70%);animation-delay:2.8s"></div><div class="glow" style="left:50%;top:12%;width:360px;height:170px;background:radial-gradient(circle,rgba(255,200,80,.8) 0%,transparent 70%);animation-delay:5.4s"></div>
</div>
</div>
<div class="cap">Your Wellness Is Non-Negotiable &middot; a living card scene</div>
<script>
if (location.hash.indexOf('wall') >= 0) document.body.classList.add('wallmode');
window.LP = { state: function(){ return document.body.className; } };
</script>
</body></html>
