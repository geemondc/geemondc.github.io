<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Fold Sheet — Living Notes</title>
<meta name="description" content="Tap a folded note and watch it open by its real creases. The newest Living Notes folds first — then make one of your own.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2B3A55; --ink2:#3a2c22; --burg:#5d1220; --gold:#8a6d2f; --gold2:#c9a24d; --cream:#faf5ea; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--cream); color:var(--ink2);
    font-family:Georgia,'Times New Roman',serif; min-height:100vh;
    background-image:radial-gradient(ellipse at 50% 30%, #fffdf6 0%, #faf5ea 55%, #f3ecd9 100%); }
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:16px 18px 2px; max-width:680px; margin:0 auto; }
  .wordmark{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#a08b62; }
  .pill{ font-family:Georgia,serif; font-size:14px; color:var(--burg); background:#fffdf6;
    border:1.5px solid var(--gold2); border-radius:999px; padding:8px 16px; text-decoration:none;
    box-shadow:0 3px 8px rgba(60,30,10,.12); white-space:nowrap; }
  .hero{ max-width:680px; margin:0 auto; display:flex; gap:14px; align-items:center; padding:14px 18px 2px; }
  .hero img{ width:86px; height:115px; object-fit:cover; border-radius:18px;
    border:2px solid #d9c48a; box-shadow:0 6px 14px rgba(74,54,16,.22); }
  .hero h1{ font-family:Didot,'Playfair Display',Georgia,serif; font-size:27px; color:var(--burg); font-weight:700; }
  .hero .invite{ font-style:italic; font-size:15.5px; color:var(--gold); margin-top:2px; }
  .hero .tag{ display:inline-block; margin-top:6px; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); border:1px solid #d9c48a; border-radius:20px; padding:2px 10px; }
  main{ max-width:680px; margin:0 auto; padding:4px 14px 8px; }
  .tile{ background:#fffdf6; border:1.5px solid #e3d3a8; border-radius:20px;
    padding:14px 14px 13px; margin:16px 0; box-shadow:0 8px 20px rgba(74,54,16,.10); }
  .tilehead{ display:flex; gap:12px; align-items:center; }
  .tilehead img{ width:52px; height:70px; object-fit:cover; border-radius:14px; border:1.5px solid #d9c48a; }
  .tilehead h2{ font-family:Didot,'Playfair Display',Georgia,serif; font-size:20px; color:var(--burg); }
  .tilehead .sub{ font-style:italic; font-size:13.5px; color:var(--gold); margin-top:1px; }
  .newchip{ margin-left:auto; font-size:10px; letter-spacing:.16em; color:#fdf6dd; background:var(--burg);
    border-radius:12px; padding:3px 9px; text-transform:uppercase; white-space:nowrap; }
  .stage{ position:relative; display:flex; justify-content:center; padding:10px 0 2px; }
  .noteWrap{ position:relative; filter:drop-shadow(0 14px 16px rgba(74,54,16,.28)); }
  .noteWrap.idle{ animation:breathe 3.6s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.014);} }
  svg.note{ display:block; }
  .fac{ stroke:rgba(96,78,45,.40); stroke-width:1.1; stroke-linejoin:round; }
  .words{ position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; opacity:0; padding:4% 7%;
    font-family:Caveat,'Segoe Script',cursive; color:var(--ink); }
  .words .wto{ font-size:clamp(15px,2.6vmin,21px); font-weight:700; margin-bottom:2%; }
  .words .wbody{ font-size:clamp(17px,3.4vmin,27px); line-height:1.32; font-weight:500; white-space:pre-line; }
  .words .wfrom{ font-size:clamp(15px,2.6vmin,21px); font-weight:700; margin-top:3%; }
  .forLabel{ position:absolute; transform:translate(-50%,0); text-align:center;
    font-family:Caveat,'Segoe Script',cursive; font-weight:700; color:#7a2d1d;
    font-size:clamp(15px,2.8vmin,22px); text-shadow:0 1px 0 rgba(255,255,255,.5); }
  .forLabel .heart{ color:#c0392b; }
  .pullMark{ position:absolute; transform:translate(-50%,-50%); text-align:center; line-height:1;
    color:#c0392b; font-family:Caveat,cursive; font-weight:700; pointer-events:none; }
  .pullMark .arr{ display:block; font-size:.95em; margin-top:-.08em; }
  .tapzone{ position:absolute; inset:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .caption{ text-align:center; font-style:italic; font-size:14.5px; color:#6d5a33; min-height:20px; padding:4px 8px 0; }
  .dots{ display:none; justify-content:center; gap:8px; padding:6px 0 0; }
  .dots.on{ display:flex; }
  .dots button{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(96,78,45,.35); cursor:pointer; padding:0; }
  .dots button.on{ border-color:var(--burg); box-shadow:0 0 0 2px #fdf6dd, 0 0 0 4px var(--burg); }
  .makebtn{ display:none; margin:11px auto 2px; font-family:Georgia,serif; font-size:15.5px;
    color:#fdf6dd; background:var(--burg); border:1.5px solid var(--gold2); border-radius:999px;
    padding:10px 22px; text-decoration:none; box-shadow:0 4px 10px rgba(60,30,10,.18); }
  .makebtn.on{ display:table; }
  .strip{ display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 8px 2px; }
  .strip img{ width:60px; height:80px; object-fit:cover; border-radius:15px; border:1.5px solid #d9c48a;
    box-shadow:0 5px 12px rgba(74,54,16,.18); }
  .strip .line{ text-align:center; font-style:italic; font-size:15.5px; color:var(--gold); padding:2px 18px 0; }
  .more{ margin-top:10px; }
  .more h3{ text-align:center; font-family:Didot,'Playfair Display',Georgia,serif; font-size:20px; color:var(--burg); }
  .more .hint2{ text-align:center; font-style:italic; font-size:13.5px; color:var(--gold); margin-top:2px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .mtile{ background:#fffdf6; border:1.5px solid #e3d3a8; border-radius:14px; padding:12px 13px;
    text-decoration:none; box-shadow:0 4px 10px rgba(74,54,16,.07); display:block; }
  .mtile .nm{ font-size:15.5px; color:var(--ink2); }
  .mtile .pp{ display:block; margin-top:2px; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:#a08b62; }
  footer{ text-align:center; padding:22px 18px 28px; font-size:10.5px; letter-spacing:.28em;
    text-transform:uppercase; color:#a08b62; }
</style>
</head>

function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgbHex(r,g,b){ function c(v){ v=Math.max(0,Math.min(255,Math.round(v))); return (v<16?"0":"")+v.toString(16); } return "#"+c(r)+c(g)+c(b); }
function shadeHex(h, amt){ var rgb = hexRgb(h), t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return rgbHex(rgb[0]+(t-rgb[0])*p, rgb[1]+(t-rgb[1])*p, rgb[2]+(t-rgb[2])*p); }
function lerp(a,b,p){ return a+(b-a)*p; }
function lerpColor(c1, c2, p){ var a=hexRgb(c1), b=hexRgb(c2);
  return rgbHex(lerp(a[0],b[0],p), lerp(a[1],b[1],p), lerp(a[2],b[2],p)); }
function smooth(p){ return p<=0?0:p>=1?1:p*p*(3-2*p); }
function easeIO(p){ return p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }

              "M80,310 L320,310", "M140,310 L140,390", "M260,310 L260,390", "M80,350 L320,350"],
  balloon:   ["M90,90 L310,310", "M310,90 L90,310", "M200,90 L200,310", "M90,200 L310,200"]
};

function fillTrack(spec, baseHex){
  if (spec === "W") return "#fffef9";
  if (spec.charAt(0) === "L") return shadeHex(baseHex, parseFloat(spec.slice(1)));
  return spec;
}

function buildTile(cfg){
  var sec = document.createElement("section");
  sec.className = "tile"; sec.id = "tile-" + cfg.fid;
  sec.innerHTML =
    '<div class="tilehead"><img src="' + FRIENDIMG[cfg.friend] + '" alt="">'
    + '<div><h2>' + cfg.name + '</h2><div class="sub">' + cfg.sub + '</div></div>'
    + '<span class="newchip">New</span></div>'
    + '<div class="stage"><div class="noteWrap"></div><div class="tapzone"></div></div>'
    + '<div class="caption"></div>'
    + '<div class="dots" aria-label="Origami paper color"></div>'
    + '<a class="makebtn" href="' + cfg.make + '">Make this one &rarr;</a>';
  document.getElementById("sheet").appendChild(sec);

  var inst = { fid: cfg.fid, fold: DATA[cfg.fid], t: 0, state: "closed", anim: null,
               paperName: "rose",
               wrap: sec.querySelector(".noteWrap"),
               caption: sec.querySelector(".caption"),
               dots: sec.querySelector(".dots"),
               make: sec.querySelector(".makebtn") };
  buildNote(inst);
  sec.querySelector(".tapzone").addEventListener("click", function(){
    if (inst.state === "closed") openNote(inst);
    else if (inst.state === "open") closeNote(inst);
    else if (inst.state === "inflated") deflateThenOpen(inst);
  });
  return inst;
}

function buildNote(inst){
  var fold = inst.fold, fid = inst.fid;
  var W = fold.box[0], H = fold.box[1];
  var stageW = Math.min(inst.wrap.parentElement.clientWidth || 340, 400);
  var size = Math.min(stageW, W);
  var isBal = fid === "balloon";
  var baseHex = isBal ? PAPERS[inst.paperName] : "#ffffff";
  var wrap = inst.wrap;

  var html = "";
  html += '<svg class="note" width="' + size + '" height="' + (size * H / W) + '" viewBox="0 0 ' + W + ' ' + H + '">';
  html += '<g class="noteG">';
  fold.facets.forEach(function(f){ html += '<polygon class="fac" data-id="' + f.id + '" points=""/>'; });
  html += '</g>';
  html += '<g class="dress" opacity="0">';
  if (!isBal){
    for (var y = 104; y <= 372; y += 26)
      html += '<line x1="88" y1="' + y + '" x2="312" y2="' + y + '" stroke="#b9c8e8" stroke-width="1.4" opacity=".55"/>';
    html += '<line x1="102" y1="76" x2="102" y2="384" stroke="#e8a0a0" stroke-width="1.4" opacity=".6"/>';
  }
  (CREASES[fid] || []).forEach(function(d){
    html += '<path d="' + d + '" stroke="rgba(96,78,45,.28)" stroke-width="1" fill="none"/>';
  });
  html += '</g>';
  if (isBal){
    html += '<g class="balloonG" opacity="0" style="transform-origin:200px 208px;">'
      + '<ellipse cx="200" cy="322" rx="64" ry="11" fill="rgba(60,40,10,.20)"/>'
      + '<path class="baBody" d="M200,116 C246,116 270,158 270,206 C270,256 241,294 200,294 C159,294 130,256 130,206 C130,158 154,116 200,116 Z"/>'
      + '<path class="baTop" d="M200,116 C231,116 254,139 264,166 C236,150 164,150 136,166 C146,139 169,116 200,116 Z"/>'
      + '<path d="M136,166 C164,150 236,150 264,166" stroke="rgba(70,45,20,.35)" stroke-width="1.4" fill="none"/>'
      + '<path d="M200,116 L200,294 M130,206 L270,206" stroke="rgba(70,45,20,.22)" stroke-width="1.2" fill="none"/>'
      + '<path d="M200,206 L152,146 M200,206 L248,146 M200,206 L150,262 M200,206 L250,262" stroke="rgba(70,45,20,.16)" stroke-width="1.1" fill="none"/>'
      + '<ellipse cx="167" cy="158" rx="15" ry="25" fill="rgba(255,255,255,.38)" transform="rotate(-18 167 158)"/>'
      + '<polygon points="192,288 208,288 200,302" fill="rgba(50,32,14,.55)"/>'
      + '</g>';
  }
  html += '</svg>';
  var lay = LAYOUT[fid];
  html += '<div class="words" style="left:' + lay.words.l + '%;top:' + lay.words.t + '%;width:' + lay.words.w + '%;height:' + lay.words.h + '%;">'
    + '<div class="wto">To: ' + esc(TO) + '</div>'
    + '<div class="wbody">' + esc(DEMOS[fid]) + '</div>'
    + '<div class="wfrom">— ' + esc(FROM) + '</div></div>';
  html += '<div class="forLabel" style="left:' + lay.label.l + '%;top:' + lay.label.t + '%;">For ' + esc(TO) + ' <span class="heart">♥</span></div>';
  if (lay.pull)
    html += '<div class="pullMark" style="left:' + lay.pull.l + '%;top:' + lay.pull.t + '%;font-size:clamp(14px,2.6vmin,21px);">♥<span class="arr">↓</span></div>';
  wrap.innerHTML = html;

  inst.svgG = wrap.querySelector(".noteG");
  inst.polys = {};
  wrap.querySelectorAll(".fac").forEach(function(p){ inst.polys[p.getAttribute("data-id")] = p; });
  fold.facets.forEach(function(f){ f._fills = f.fills.map(function(s){ return fillTrack(s, baseHex); }); });
  inst.words = wrap.querySelector(".words");
  inst.label = wrap.querySelector(".forLabel");
  inst.pull = wrap.querySelector(".pullMark");
  inst.dress = wrap.querySelector(".dress");
  inst.balloonG = wrap.querySelector(".balloonG");
  if (isBal) paintBalloon(inst);
  inst.state = "closed"; inst.t = 0;
  wrap.classList.add("idle");
  inst.make.classList.remove("on");
  pose(inst, 0);
  inst.caption.textContent = fold.captions[0];
  inst.dots.classList.toggle("on", isBal);
}

function paintBalloon(inst){
  var b = inst.wrap.querySelector(".baBody"), t = inst.wrap.querySelector(".baTop");
  if (b) b.setAttribute("fill", shadeHex(PAPERS[inst.paperName], .06));
  if (t) t.setAttribute("fill", shadeHex(PAPERS[inst.paperName], .34));
}

function pose(inst, t){
  inst.t = t;
  var fold = inst.fold, times = fold.times, K = times.length;
  var seg = K - 2;
  for (var i = 0; i < K - 1; i++){ if (t <= times[i + 1]){ seg = i; break; } }
  var a = times[seg], b = times[seg + 1];
  var p = b > a ? smooth(Math.max(0, Math.min(1, (t - a) / (b - a)))) : 1;
  var off = [lerp(fold.offsets[seg][0], fold.offsets[seg + 1][0], p),
             lerp(fold.offsets[seg][1], fold.offsets[seg + 1][1], p)];
  inst.svgG.setAttribute("transform", "translate(" + off[0].toFixed(1) + "," + off[1].toFixed(1) + ")");
  fold.facets.forEach(function(f){
    var k0 = f.keys[seg], k1 = f.keys[seg + 1], out = [];
    for (var j = 0; j < k0.length; j++)
      out.push(lerp(k0[j][0], k1[j][0], p).toFixed(1) + "," + lerp(k0[j][1], k1[j][1], p).toFixed(1));
    var el = inst.polys[f.id];
    el.setAttribute("points", out.join(" "));
    el.setAttribute("fill", lerpColor(f._fills[seg], f._fills[seg + 1], p));
  });
  var flat = smooth((t - times[K - 2]) / (1 - times[K - 2]));
  inst.words.style.opacity = flat.toFixed(3);
  inst.dress.setAttribute("opacity", (flat * .9).toFixed(3));
  inst.label.style.opacity = (1 - smooth(t / .12)).toFixed(3);
  if (inst.pull) inst.pull.style.opacity = (1 - smooth(t / .10)).toFixed(3);
  return seg;
}

function setCaption(inst, idx){
  inst.caption.textContent = inst.fold.captions[Math.max(0, Math.min(inst.fold.captions.length - 1, idx))];
}
function setState(inst, s){
  inst.state = s;
  inst.make.classList.toggle("on", s === "open");
}

function tween(inst, toT, dur, done){
  if (inst.anim) cancelAnimationFrame(inst.anim);
  var fromT = inst.t, t0 = performance.now();
  inst.wrap.classList.remove("idle");
  function frame(now){
    var p = dur <= 0 ? 1 : Math.min(1, (now - t0) / dur);
    var seg = pose(inst, lerp(fromT, toT, easeIO(p)));
    setCaption(inst, toT > fromT ? seg + 1 : seg);
    if (p < 1) inst.anim = requestAnimationFrame(frame);
    else { inst.anim = null; if (done) done(); }
  }
  inst.anim = requestAnimationFrame(frame);
}

function openNote(inst){
  if (inst.state !== "closed") return;
  if (inst.fid === "balloon"){ inflate(inst); return; }
  setState(inst, "opening");
  tween(inst, 1, REDUCED ? 1 : 3200, function(){
    setState(inst, "open"); setCaption(inst, inst.fold.captions.length - 1);
  });
}
function closeNote(inst){
  if (inst.state !== "open") return;
  setState(inst, "closing");
  tween(inst, 0, REDUCED ? 1 : 2900, function(){
    setState(inst, "closed"); setCaption(inst, 0); inst.wrap.classList.add("idle");
  });
}
function inflate(inst){
  setState(inst, "inflating");
  var g = inst.balloonG, t0 = performance.now(), dur = REDUCED ? 1 : 780;
  inst.caption.textContent = "It inflates — a paper balloon!";
  (function frame(now){
    var p = Math.min(1, (now - t0) / dur);
    var s = p < .55 ? lerp(.55, 1.06, easeIO(p / .55)) : lerp(1.06, 1, smooth((p - .55) / .45));
    g.setAttribute("opacity", Math.min(1, p * 1.6).toFixed(2));
    g.style.transform = "scale(" + s.toFixed(3) + ")";
    inst.svgG.style.opacity = (1 - p).toFixed(2);
    inst.label.style.opacity = (1 - p).toFixed(2);
    if (p < 1) inst.anim = requestAnimationFrame(frame);
    else { inst.anim = null; setState(inst, "inflated"); inst.caption.textContent = "Tap again — let the air out and open it."; }
  })(t0);
}
function deflateThenOpen(inst){
  setState(inst, "deflating");
  var g = inst.balloonG, t0 = performance.now(), dur = REDUCED ? 1 : 430;
  (function frame(now){
    var p = Math.min(1, (now - t0) / dur);
    g.setAttribute("opacity", (1 - p).toFixed(2));
    g.style.transform = "scale(" + lerp(1, .8, p).toFixed(3) + ")";
    inst.svgG.style.opacity = p.toFixed(2);
    if (p < 1) inst.anim = requestAnimationFrame(frame);
    else {
      inst.anim = null; setState(inst, "opening");
      tween(inst, 1, REDUCED ? 1 : 2600, function(){
        setState(inst, "open"); setCaption(inst, inst.fold.captions.length - 1);
      });
    }
  })(t0);
}

var instances = TILES.map(buildTile);
/* balloon color dots */
instances.forEach(function(inst){
  if (inst.fid !== "balloon") return;
  Object.keys(PAPERS).forEach(function(name){
    var b = document.createElement("button");
    b.style.background = PAPERS[name];
    b.title = name;
    if (name === inst.paperName) b.classList.add("on");
    b.addEventListener("click", function(){
      inst.paperName = name;
      inst.dots.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      buildNote(inst);
    });
    inst.dots.appendChild(b);
  });
});

/* more folds grid */
var grid = document.getElementById("moreGrid");
MORE.forEach(function(m){
  var a = document.createElement("a");
  a.className = "mtile"; a.href = m[2];
  a.innerHTML = '<span class="nm">' + m[0] + '</span><span class="pp">' + m[1] + '</span>';
  grid.appendChild(a);
});
</script>
</body>
