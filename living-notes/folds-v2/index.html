<style>
  :root{ --ink:#2B3A55; --burg:#5d1220; --gold:#8a6d2f; --cream:#faf5ea; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    background:var(--cream); color:var(--ink);
    font-family:Georgia, 'Times New Roman', serif;
    background-image:radial-gradient(ellipse at 50% 38%, #fffdf6 0%, #faf5ea 55%, #f3ecd9 100%); }
  header{ text-align:center; padding:10px 12px 2px; }
  header h1{ font-size:19px; color:var(--burg); letter-spacing:.02em; font-weight:700; }
  header .tag{ display:inline-block; margin-top:3px; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); border:1px solid #d9c48a; border-radius:20px; padding:2px 10px; }
  nav.tabs{ display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:8px 8px 2px; }
  nav.tabs button{ font-family:Georgia,serif; font-size:13.5px; color:#6b5320; background:#fffdf6;
    border:1.5px solid #d9c48a; border-radius:20px; padding:6px 13px; cursor:pointer; }
  nav.tabs button.on{ background:var(--burg); border-color:var(--burg); color:#fdf6dd; }
  #stage{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  #noteWrap{ position:relative; filter:drop-shadow(0 14px 16px rgba(74,54,16,.28)); }
  #noteWrap.idle{ animation:breathe 3.6s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.014);} }
  svg.note{ display:block; }
  .fac{ stroke:rgba(96,78,45,.40); stroke-width:1.1; stroke-linejoin:round; }
  .ovl{ position:absolute; inset:0; pointer-events:none; }
  #words{ position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; opacity:0; padding:4% 7%;
    font-family:Caveat,'Segoe Script','Comic Sans MS',cursive; color:var(--ink); }
  #words .wto{ font-size:clamp(15px,2.6vmin,21px); font-weight:700; margin-bottom:2%; }
  #words .wbody{ font-size:clamp(17px,3.4vmin,27px); line-height:1.32; font-weight:500; white-space:pre-line; }
  #words .wfrom{ font-size:clamp(15px,2.6vmin,21px); font-weight:700; margin-top:3%; }
  #forLabel{ position:absolute; transform:translate(-50%,0); text-align:center;
    font-family:Caveat,'Segoe Script',cursive; font-weight:700; color:#7a2d1d;
    font-size:clamp(15px,2.8vmin,22px); text-shadow:0 1px 0 rgba(255,255,255,.5); }
  #forLabel .heart{ color:#c0392b; }
  #pullMark{ position:absolute; transform:translate(-50%,-50%); text-align:center; line-height:1;
    color:#c0392b; font-family:Caveat,cursive; font-weight:700; pointer-events:none; }
  #pullMark .arr{ display:block; font-size:.95em; margin-top:-.08em; }
  footer{ text-align:center; padding:4px 14px 12px; }
  #caption{ font-style:italic; font-size:15px; color:#6d5a33; min-height:20px; }
  #dots{ display:none; justify-content:center; gap:8px; padding:2px 0 4px; }
  #dots.on{ display:flex; }
  #dots button{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(96,78,45,.35); cursor:pointer; padding:0; }
  #dots button.on{ border-color:var(--burg); box-shadow:0 0 0 2px #fdf6dd, 0 0 0 4px var(--burg); }
  .tapzone{ position:absolute; inset:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
</style>

  balloon:   { body:"A little surprise, folded round.\nIt pops to life — then it opens, and it’s a note after all." }
};
var TO = clamp(q.get("to") || "Friend", 40);
var FROM = clamp(q.get("from") || "Me", 40);
var BODY = clamp(q.get("body") || "", 280);

/* origami papers (crane preview palette + friends) */
var PAPERS = { white:"#f2ecdc", blue:"#6aa9e8", green:"#69b96f", rose:"#f191a7",
               yellow:"#f2c14e", lilac:"#9a7fd0", orange:"#f09a56" };
var paperName = (q.get("color") || "rose").toLowerCase();
if (!PAPERS[paperName]) paperName = "rose";

function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgbHex(r,g,b){ function c(v){ v=Math.max(0,Math.min(255,Math.round(v))); return (v<16?"0":"")+v.toString(16); } return "#"+c(r)+c(g)+c(b); }
function shadeHex(h, amt){ var rgb = hexRgb(h), t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return rgbHex(rgb[0]+(t-rgb[0])*p, rgb[1]+(t-rgb[1])*p, rgb[2]+(t-rgb[2])*p); }
function lerp(a,b,p){ return a+(b-a)*p; }
function lerpColor(c1, c2, p){ var a=hexRgb(c1), b=hexRgb(c2);
  return rgbHex(lerp(a[0],b[0],p), lerp(a[1],b[1],p), lerp(a[2],b[2],p)); }
function smooth(p){ return p<=0?0:p>=1?1:p*p*(3-2*p); }
function easeIO(p){ return p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------ per-fold stage layout (percent of stage box) ------------ */
var LAYOUT = {
  writetuck: { words:{l:20, t:15.2, w:60, h:69.6}, label:{l:50, t:56.5}, pull:null },
  pullhere:  { words:{l:20, t:15.2, w:60, h:69.6}, label:{l:50, t:58.5}, pull:{l:50, t:48.9} },
  heart:     { words:{l:20, t:15.2, w:60, h:69.6}, label:{l:50, t:63}, pull:null },
  balloon:   { words:{l:22.5, t:22.5, w:55, h:55}, label:{l:50, t:76}, pull:null }
};
/* crease patterns + ruled lines shown on the flat sheet */
var CREASES = {
  writetuck: ["M133,70 L320,320", "M200,70 L200,390", "M80,177 L320,177", "M80,283 L320,283"],
  pullhere:  ["M80,190 L200,70", "M320,190 L200,70", "M80,270 L200,390", "M320,270 L200,390",
              "M140,70 L140,390", "M260,70 L260,390", "M80,177 L320,177", "M80,283 L320,283"],
  heart:     ["M80,70 L320,310", "M320,70 L80,310", "M200,70 L200,310", "M80,190 L320,190",
              "M80,310 L320,310", "M140,310 L140,390", "M260,310 L260,390", "M80,350 L320,350"],
  balloon:   ["M90,90 L310,310", "M310,90 L90,310", "M200,90 L200,310", "M90,200 L310,200"]
};

/* ------------ note instance ------------ */
var wrap = document.getElementById("noteWrap");
var captionEl = document.getElementById("caption");
var dotsEl = document.getElementById("dots");
var cur = null;   // current note instance

function fillTrack(spec, baseHex){
  /* spec: "#hex" | "W" (reading white) | "L<lvl>" shade-of-base */
  if (spec === "W") return "#fffef9";
  if (spec.charAt(0) === "L") return shadeHex(baseHex, parseFloat(spec.slice(1)));
  return spec;
}

function buildNote(fid){
  var fold = DATA[fid];
  var W = fold.box[0], H = fold.box[1];
  var size = Math.min(window.innerWidth * 0.94, (window.innerHeight - 190) * (W / H), W * 1.35);
  var isBal = fid === "balloon";
  var baseHex = isBal ? PAPERS[paperName] : "#ffffff";

  var html = "";
  html += '<svg class="note" width="' + size + '" height="' + (size * H / W) + '" viewBox="0 0 ' + W + ' ' + H + '">';
  html += '<g id="noteG">';
  fold.facets.forEach(function(f){
    html += '<polygon class="fac" data-id="' + f.id + '" points=""/>';
  });
  html += '</g>';
  /* flat-state dressing: ruled lines (notebook) + crease marks */
  html += '<g id="dress" opacity="0">';
  if (!isBal){
    for (var y = 104; y <= 372; y += 26)
      html += '<line x1="88" y1="' + y + '" x2="312" y2="' + y + '" stroke="#b9c8e8" stroke-width="1.4" opacity=".55"/>';
    html += '<line x1="102" y1="76" x2="102" y2="384" stroke="#e8a0a0" stroke-width="1.4" opacity=".6"/>';
  }
  (CREASES[fid] || []).forEach(function(d){
    html += '<path d="' + d + '" stroke="rgba(96,78,45,.28)" stroke-width="1" fill="none"/>';
  });
  html += '</g>';
  if (isBal){
    html += '<g id="balloonG" opacity="0" style="transform-origin:200px 208px;">'
      + '<ellipse cx="200" cy="322" rx="64" ry="11" fill="rgba(60,40,10,.20)"/>'
      + '<path id="baBody" d="M200,116 C246,116 270,158 270,206 C270,256 241,294 200,294 C159,294 130,256 130,206 C130,158 154,116 200,116 Z"/>'
      + '<path id="baTop" d="M200,116 C231,116 254,139 264,166 C236,150 164,150 136,166 C146,139 169,116 200,116 Z"/>'
      + '<path d="M136,166 C164,150 236,150 264,166" stroke="rgba(70,45,20,.35)" stroke-width="1.4" fill="none"/>'
      + '<path d="M200,116 L200,294 M130,206 L270,206" stroke="rgba(70,45,20,.22)" stroke-width="1.2" fill="none"/>'
      + '<path d="M200,206 L152,146 M200,206 L248,146 M200,206 L150,262 M200,206 L250,262" stroke="rgba(70,45,20,.16)" stroke-width="1.1" fill="none"/>'
      + '<ellipse cx="167" cy="158" rx="15" ry="25" fill="rgba(255,255,255,.38)" transform="rotate(-18 167 158)"/>'
      + '<polygon points="192,288 208,288 200,302" fill="rgba(50,32,14,.55)"/>'
      + '</g>';
  }
  html += '</svg>';
  var lay = LAYOUT[fid];
  html += '<div id="words" style="left:' + lay.words.l + '%;top:' + lay.words.t + '%;width:' + lay.words.w + '%;height:' + lay.words.h + '%;">'
    + '<div class="wto">To: ' + esc(TO) + '</div>'
    + '<div class="wbody">' + esc(BODY || DEMOS[fid].body) + '</div>'
    + '<div class="wfrom">— ' + esc(FROM) + '</div></div>';
  html += '<div id="forLabel" style="left:' + lay.label.l + '%;top:' + lay.label.t + '%;">For ' + esc(TO) + ' <span class="heart">♥</span></div>';
  if (lay.pull)
    html += '<div id="pullMark" style="left:' + lay.pull.l + '%;top:' + lay.pull.t + '%;font-size:clamp(14px,2.6vmin,21px);">♥<span class="arr">↓</span></div>';
  wrap.innerHTML = html;

  var svgG = wrap.querySelector("#noteG");
  var polys = {};
  wrap.querySelectorAll(".fac").forEach(function(p){ polys[p.getAttribute("data-id")] = p; });
  /* resolve fill tracks to hex */
  fold.facets.forEach(function(f){
    f._fills = f.fills.map(function(s){ return fillTrack(s, baseHex); });
  });
  if (isBal) paintBalloon();

  var inst = { fid: fid, fold: fold, t: 0, state: "closed", anim: null,
               polys: polys, svgG: svgG,
               words: wrap.querySelector("#words"),
               label: wrap.querySelector("#forLabel"),
               pull: wrap.querySelector("#pullMark"),
               dress: wrap.querySelector("#dress"),
               balloonG: wrap.querySelector("#balloonG") };
  wrap.classList.add("idle");
  pose(inst, 0);
  captionEl.textContent = fold.captions[0];
  dotsEl.classList.toggle("on", isBal);
  return inst;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function paintBalloon(){
  var b = wrap.querySelector("#baBody"), t = wrap.querySelector("#baTop");
  if (b) b.setAttribute("fill", shadeHex(PAPERS[paperName], .06));
  if (t) t.setAttribute("fill", shadeHex(PAPERS[paperName], .34));
}

function pose(inst, t){
  inst.t = t;
  var fold = inst.fold, times = fold.times, K = times.length;
  /* find segment */
  var seg = K - 2;
  for (var i = 0; i < K - 1; i++){ if (t <= times[i + 1]){ seg = i; break; } }
  var a = times[seg], b = times[seg + 1];
  var p = b > a ? smooth(Math.max(0, Math.min(1, (t - a) / (b - a)))) : 1;
  var off = [lerp(fold.offsets[seg][0], fold.offsets[seg + 1][0], p),
             lerp(fold.offsets[seg][1], fold.offsets[seg + 1][1], p)];
  inst.svgG.setAttribute("transform", "translate(" + off[0].toFixed(1) + "," + off[1].toFixed(1) + ")");
  fold.facets.forEach(function(f){
    var k0 = f.keys[seg], k1 = f.keys[seg + 1], out = [];
    for (var j = 0; j < k0.length; j++)
      out.push(lerp(k0[j][0], k1[j][0], p).toFixed(1) + "," + lerp(k0[j][1], k1[j][1], p).toFixed(1));
    var el = inst.polys[f.id];
    el.setAttribute("points", out.join(" "));
    el.setAttribute("fill", lerpColor(f._fills[seg], f._fills[seg + 1], p));
  });
  var flat = smooth((t - times[K - 2]) / (1 - times[K - 2]));
  inst.words.style.opacity = flat.toFixed(3);
  inst.dress.setAttribute("opacity", (flat * .9).toFixed(3));
  inst.label.style.opacity = (1 - smooth(t / .12)).toFixed(3);
  if (inst.pull) inst.pull.style.opacity = (1 - smooth(t / .10)).toFixed(3);
  return seg;
}

function setCaption(inst, idx){ captionEl.textContent = inst.fold.captions[Math.max(0, Math.min(inst.fold.captions.length - 1, idx))]; }

function tween(inst, toT, dur, done){
  if (inst.anim) cancelAnimationFrame(inst.anim);
  var fromT = inst.t, t0 = performance.now();
  wrap.classList.remove("idle");
  function frame(now){
    var p = dur <= 0 ? 1 : Math.min(1, (now - t0) / dur);
    var seg = pose(inst, lerp(fromT, toT, easeIO(p)));
    setCaption(inst, toT > fromT ? seg + 1 : seg);
    if (p < 1) inst.anim = requestAnimationFrame(frame);
    else { inst.anim = null; if (done) done(); }
  }
  inst.anim = requestAnimationFrame(frame);
}

function openNote(inst){
  if (inst.state !== "closed") return;
  if (inst.fid === "balloon"){ inflate(inst); return; }
  inst.state = "opening";
  tween(inst, 1, REDUCED ? 1 : 3200, function(){
    inst.state = "open"; setCaption(inst, inst.fold.captions.length - 1);
  });
}
function closeNote(inst){
  if (inst.state !== "open") return;
  inst.state = "closing";
  tween(inst, 0, REDUCED ? 1 : 2900, function(){
    inst.state = "closed"; setCaption(inst, 0); wrap.classList.add("idle");
  });
}
/* balloon: inflate / deflate around the same pose track */
function inflate(inst){
  inst.state = "inflating";
  var g = inst.balloonG, t0 = performance.now(), dur = REDUCED ? 1 : 780;
  captionEl.textContent = "It inflates — a paper balloon!";
  (function frame(now){
    var p = Math.min(1, (now - t0) / dur);
    var s = p < .55 ? lerp(.55, 1.06, easeIO(p / .55)) : lerp(1.06, 1, smooth((p - .55) / .45));
    g.setAttribute("opacity", Math.min(1, p * 1.6).toFixed(2));
    g.style.transform = "scale(" + s.toFixed(3) + ")";
    inst.svgG.style.opacity = (1 - p).toFixed(2);
    inst.label.style.opacity = (1 - p).toFixed(2);
    if (p < 1) inst.anim = requestAnimationFrame(frame);
    else { inst.anim = null; inst.state = "inflated"; captionEl.textContent = "Tap again — let the air out and open it."; }
  })(t0);
}
function deflateThenOpen(inst){
  inst.state = "deflating";
  var g = inst.balloonG, t0 = performance.now(), dur = REDUCED ? 1 : 430;
  (function frame(now){
    var p = Math.min(1, (now - t0) / dur);
    g.setAttribute("opacity", (1 - p).toFixed(2));
    g.style.transform = "scale(" + lerp(1, .8, p).toFixed(3) + ")";
    inst.svgG.style.opacity = p.toFixed(2);
    if (p < 1) inst.anim = requestAnimationFrame(frame);
    else {
      inst.anim = null; inst.state = "opening";
      tween(inst, 1, REDUCED ? 1 : 2600, function(){
        inst.state = "open"; setCaption(inst, inst.fold.captions.length - 1);
      });
    }
  })(t0);
}

document.getElementById("tapzone").addEventListener("click", function(){
  if (!cur) return;
  if (cur.state === "closed") openNote(cur);
  else if (cur.state === "open") closeNote(cur);
  else if (cur.state === "inflated") deflateThenOpen(cur);
});

/* tabs */
document.querySelectorAll("#tabs button").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.remove("on"); });
    btn.classList.add("on");
    cur = buildNote(btn.getAttribute("data-fold"));
  });
});
/* color dots */
Object.keys(PAPERS).forEach(function(name){
  var b = document.createElement("button");
  b.style.background = PAPERS[name];
  b.title = name;
  if (name === paperName) b.classList.add("on");
  b.addEventListener("click", function(){
    paperName = name;
    dotsEl.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    if (cur && cur.fid === "balloon") cur = buildNote("balloon");
  });
  dotsEl.appendChild(b);
});

window.addEventListener("resize", function(){ if (cur) cur = buildNote(cur.fid); });
var startFold = DATA[q.get("fold")] ? q.get("fold") : "writetuck";
document.querySelectorAll("#tabs button").forEach(function(b){
  b.classList.toggle("on", b.getAttribute("data-fold") === startFold);
});
cur = buildNote(startFold);
</script>
</body>
</html>
