<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#090a0c" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <title>Magic 8-Ball</title>
  <style>
    :root {
      color-scheme: light dark;
      --room:#08090b;
      --room-mid:#111318;
      --ink:#f5f5f2;
      --muted:#a4a7ae;
      --button:#f1f0eb;
      --button-ink:#111216;
      --blue:#173dc9;
      --blue-deep:#020a2b;
      --focus:#85a6ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --room:#101216;
        --room-mid:#252932;
        --ink:#f5f5f2;
        --muted:#b8bbc2;
        --button:#f1f0eb;
        --button-ink:#111216;
        --focus:#9ab5ff;
      }
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body {
      margin:0;
      overflow:hidden;
      background:
        radial-gradient(ellipse at 50% 43%, color-mix(in srgb, var(--room-mid) 88%, white 12%) 0%, var(--room-mid) 29%, var(--room) 70%),
        var(--room);
      color:var(--ink);
      font-family:"Montserrat", system-ui, sans-serif;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }
    main {
      min-height:100%;
      display:grid;
      grid-template-rows:minmax(0, 1fr) auto;
      align-items:center;
      justify-items:center;
      padding:max(20px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
      position:relative;
      isolation:isolate;
    }
    .stage {
      width:100%;
      min-height:0;
      display:grid;
      place-items:center;
      perspective:1100px;
      padding-top:10px;
    }
    .ball-wrap {
      position:relative;
      width:min(78vw, 64vh, 560px);
      aspect-ratio:1;
      filter:drop-shadow(0 35px 28px rgba(0,0,0,.58));
      cursor:grab;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }
    .ball-wrap:active { cursor:grabbing; }
    .ball-wrap:focus-visible {
      border-radius:50%;
      outline:3px solid var(--focus);
      outline-offset:8px;
    }
    .ground-shadow {
      position:absolute;
      width:72%;
      height:12%;
      left:14%;
      bottom:-4%;
      border-radius:50%;
      background:rgba(0,0,0,.48);
      filter:blur(17px);
      transform:scaleX(.95);
      z-index:-1;
    }
    .ball {
      position:absolute;
      inset:0;
      border-radius:50%;
      transform-style:preserve-3d;
      background:
        radial-gradient(circle at 30% 18%, rgba(255,255,255,.25) 0 2%, rgba(255,255,255,.085) 8%, transparent 21%),
        radial-gradient(circle at 65% 76%, rgba(255,255,255,.045), transparent 23%),
        radial-gradient(circle at 37% 30%, #292b2f 0%, #111216 29%, #050607 65%, #010102 100%);
      box-shadow:
        inset -32px -42px 68px rgba(0,0,0,.92),
        inset 20px 20px 38px rgba(255,255,255,.045),
        0 2px 0 rgba(255,255,255,.14);
      transition:transform 1.15s cubic-bezier(.2,.78,.18,1);
      will-change:transform;
    }
    .ball::before {
      content:"";
      position:absolute;
      inset:2.5%;
      border-radius:50%;
      background:linear-gradient(120deg, rgba(255,255,255,.11), transparent 18%, transparent 67%, rgba(255,255,255,.025));
      pointer-events:none;
    }
    .face {
      position:absolute;
      inset:0;
      border-radius:50%;
      display:grid;
      place-items:center;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      overflow:hidden;
    }
    .front { opacity:1; transition:opacity .28s ease; }
    .eight-disc {
      width:43%;
      aspect-ratio:1;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:radial-gradient(circle at 38% 32%, #fff 0%, #f7f7f2 56%, #c9c9c5 100%);
      color:#07080a;
      box-shadow:
        0 0 0 2px rgba(0,0,0,.55),
        0 7px 18px rgba(0,0,0,.7),
        inset -6px -7px 12px rgba(0,0,0,.12),
        inset 4px 4px 8px rgba(255,255,255,.8);
      transform:translateZ(2px);
    }
    .eight {
      font-family:"Barlow Condensed", Impact, sans-serif;
      font-size:clamp(6.2rem, 24vw, 11.5rem);
      line-height:.8;
      font-weight:800;
      transform:scaleX(.9) translateY(-1%);
      letter-spacing:-.07em;
      text-shadow:0 1px 0 #777;
    }
    .back { opacity:0; transform:rotateY(180deg); transition:opacity .24s .38s ease; }
    .ball.turned { transform:rotateY(180deg) rotateZ(-2deg); }
    .ball.turned .front { opacity:0; }
    .ball.turned .back { opacity:1; }
    .window-rim {
      width:51%;
      aspect-ratio:1;
      padding:7.5%;
      border-radius:50%;
      background:radial-gradient(circle at 40% 34%, #24262b 0 14%, #0b0c0e 56%, #000 82%);
      box-shadow:
        0 5px 17px rgba(0,0,0,.95),
        inset 6px 7px 10px rgba(255,255,255,.07),
        inset -10px -10px 13px rgba(0,0,0,.9);
    }
    .liquid {
      width:100%;
      height:100%;
      position:relative;
      overflow:hidden;
      border-radius:50%;
      background:
        radial-gradient(circle at 48% 47%, rgba(20,54,180,.36), transparent 34%),
        radial-gradient(circle at 45% 38%, #081344 0%, #030a27 48%, #01030f 80%);
      box-shadow:
        inset 0 0 28px 12px #000414,
        inset 0 0 0 2px rgba(61,92,203,.2),
        0 0 2px #273873;
    }
    .liquid::after {
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(ellipse at 35% 25%, rgba(255,255,255,.16), transparent 16%),
        linear-gradient(145deg, rgba(255,255,255,.035), transparent 45%);
      pointer-events:none;
      z-index:3;
    }
    .bubble {
      position:absolute;
      width:5%; aspect-ratio:1; border-radius:50%;
      background:rgba(88,121,235,.22);
      border:1px solid rgba(170,191,255,.18);
      opacity:0;
    }
    .bubble.one { left:25%; bottom:18%; }
    .bubble.two { right:24%; bottom:24%; width:3.4%; }
    .revealed .bubble { animation:bubbleUp 1.4s .6s ease-out both; }
    .revealed .bubble.two { animation-delay:.9s; }
    .die {
      position:absolute;
      width:78%;
      height:69%;
      left:11%;
      top:17%;
      display:grid;
      place-items:center;
      color:white;
      text-align:center;
      transform:translateY(105%) rotate(-8deg) scale(.78);
      opacity:0;
      filter:drop-shadow(0 8px 9px rgba(0,0,0,.9));
      z-index:2;
    }
    .die::before {
      content:"";
      position:absolute;
      inset:0;
      clip-path:polygon(50% 2%, 96% 87%, 4% 87%);
      background:
        linear-gradient(120deg, rgba(255,255,255,.30), transparent 27%),
        linear-gradient(242deg, rgba(1,12,90,.42), transparent 38%),
        linear-gradient(#3159e9, #1739ba 56%, #0a247e 100%);
      box-shadow:inset 0 0 12px rgba(255,255,255,.16);
    }
    .die::after {
      content:"";
      position:absolute;
      inset:6% 10% 13%;
      clip-path:polygon(50% 0, 100% 100%, 0 100%);
      border:1px solid rgba(194,208,255,.24);
    }
    .answer {
      position:relative;
      z-index:1;
      width:64%;
      margin-top:25%;
      font-size:clamp(.62rem, 2.5vw, 1.05rem);
      line-height:1.04;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.015em;
      text-shadow:0 1px 2px #020832;
    }
    .revealed .die { animation:floatUp 1.65s cubic-bezier(.13,.69,.22,1) .25s forwards; }
    .shaking .ball { animation:rattle .1s linear infinite; transition:none; }
    .shaking .ground-shadow { animation:shadowRattle .1s linear infinite; }
    .controls {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:9px;
      padding-bottom:2px;
      z-index:5;
    }
    .shake-button {
      appearance:none;
      border:0;
      min-width:176px;
      min-height:54px;
      border-radius:999px;
      padding:0 29px;
      background:var(--button);
      color:var(--button-ink);
      font:800 1.08rem/1 "Montserrat", sans-serif;
      letter-spacing:.11em;
      box-shadow:0 8px 22px rgba(0,0,0,.34), inset 0 -2px 0 rgba(0,0,0,.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .shake-button:active { transform:translateY(2px); box-shadow:0 4px 10px rgba(0,0,0,.32); }
    .shake-button:focus-visible, .sound:focus-visible { outline:3px solid var(--focus); outline-offset:4px; }
    .hint {
      margin:0;
      color:var(--muted);
      font:700 .72rem/1.2 "Montserrat", sans-serif;
      letter-spacing:.045em;
      text-align:center;
      min-height:1.2em;
    }
    .sound {
      position:fixed;
      top:max(16px, env(safe-area-inset-top));
      right:max(16px, env(safe-area-inset-right));
      width:44px; height:44px;
      border:1px solid color-mix(in srgb, var(--ink) 22%, transparent);
      border-radius:50%;
      display:grid;
      place-items:center;
      background:color-mix(in srgb, var(--room) 68%, transparent);
      color:var(--ink);
      cursor:pointer;
      z-index:10;
    }
    .sound svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .sound .slash { display:none; }
    .sound.muted .waves { display:none; }
    .sound.muted .slash { display:block; }
    .future-ready {
      position:fixed;
      top:max(16px, env(safe-area-inset-top));
      left:max(16px, env(safe-area-inset-left));
      color:color-mix(in srgb, var(--ink) 58%, transparent);
      font:800 .61rem/1 "Montserrat", sans-serif;
      letter-spacing:.13em;
      text-transform:uppercase;
      white-space:nowrap;
      text-decoration:none;
      z-index:4;
    }
    @keyframes rattle {
      0%{transform:translate(-3px,2px) rotate(-2deg)}
      25%{transform:translate(4px,-2px) rotate(2.5deg)}
      50%{transform:translate(-2px,-3px) rotate(-1deg)}
      75%{transform:translate(3px,3px) rotate(1.7deg)}
      100%{transform:translate(-3px,2px) rotate(-2deg)}
    }
    @keyframes shadowRattle { 50% { transform:scaleX(.9) translateX(5px); opacity:.66; } }
    @keyframes floatUp {
      0% { transform:translateY(108%) rotate(-9deg) scale(.76); opacity:0; }
      25% { opacity:.3; }
      72% { transform:translateY(-4%) rotate(1.8deg) scale(1.02); opacity:1; }
      88% { transform:translateY(2%) rotate(-.8deg) scale(.995); opacity:1; }
      100% { transform:translateY(0) rotate(0) scale(1); opacity:1; }
    }
    @keyframes bubbleUp {
      0% { transform:translateY(0) scale(.8); opacity:0; }
      25% { opacity:.65; }
      100% { transform:translateY(-840%) translateX(14px) scale(1.25); opacity:0; }
    }
    @media (max-height:620px) {
      main { padding-block:10px; }
      .ball-wrap { width:min(66vw, 65vh, 400px); }
      .shake-button { min-height:47px; }
      .hint { display:none; }
      .controls { gap:4px; }
    }
    @media (max-width:420px) and (min-height:621px) {
      .ball-wrap { width:min(88vw, 58vh); }
      .stage { padding-top:28px; }
      .answer { font-size:clamp(.56rem, 2.65vw, .78rem); }
    }
    @media (prefers-reduced-motion:reduce) {
      .ball, .front, .back { transition-duration:.01ms; }
      .shaking .ball { animation:softRattle .4s ease 2; }
      .revealed .die { animation-duration:.01ms; animation-delay:.01ms; }
      .revealed .bubble { display:none; }
    }
    @keyframes softRattle { 50% { transform:rotate(2deg); } }
  </style>
</head>
<body>
  <main aria-live="polite">
    <section class="stage" aria-label="Magic 8-Ball">
      <div class="ball-wrap" id="ballWrap" role="button" tabindex="0" aria-label="Magic 8-Ball. Tap or drag to reveal an answer.">
        <div class="ground-shadow"></div>
        <div class="ball" id="ball">
          <div class="face front" aria-hidden="true">
            <div class="eight-disc"><span class="eight">8</span></div>
          </div>
          <div class="face back">
            <div class="window-rim">
              <div class="liquid">
                <span class="bubble one"></span><span class="bubble two"></span>
                <div class="die" id="die"><span class="answer" id="answer">It is certain</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="controls">
      <button class="shake-button" id="shakeButton" type="button">SHAKE</button>
      <p class="hint" id="hint">Tap, drag, or press SHAKE</p>
    </div>
  </main>

  <button class="sound" id="soundButton" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4Z"/>
      <g class="waves"><path d="M16 8.5c1 .9 1.5 2.1 1.5 3.5S17 14.6 16 15.5"/><path d="M18.7 6c1.7 1.6 2.6 3.6 2.6 6s-.9 4.4-2.6 6"/></g>
      <g class="slash"><path d="m17.5 9.5 4 4"/><path d="m21.5 9.5-4 4"/></g>
    </svg>
  </button>
  <a class="future-ready" href="https://ready-future-hub-life.lovable.app/" target="_blank" rel="noopener noreferrer" aria-label="Open the Future Ready Link Hub in a new tab">Future Ready</a>

  <script>
    (function () {
      "use strict";
      var answers = [
        "It is certain", "It is decidedly so", "Without a doubt", "Yes definitely", "You may rely on it",
        "As I see it, yes", "Most likely", "Outlook good", "Yes", "Signs point to yes",
        "Reply hazy, try again", "Ask again later", "Better not tell you now", "Cannot predict now", "Concentrate and ask again",
        "Don't count on it", "My reply is no", "My sources say no", "Outlook not so good", "Very doubtful"
      ];
      var ballWrap = document.getElementById("ballWrap");
      var ball = document.getElementById("ball");
      var answer = document.getElementById("answer");
      var shakeButton = document.getElementById("shakeButton");
      var soundButton = document.getElementById("soundButton");
      var hint = document.getElementById("hint");
      var state = "ready";
      var muted = false;
      var audioContext = null;
      var pointer = null;
      var lastAnswer = -1;

      function audio() {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") audioContext.resume();
        return audioContext;
      }

      function playRattle() {
        if (muted) return;
        var ctx = audio();
        var duration = .62;
        var buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
        var data = buffer.getChannelData(0);
        for (var i = 0; i < data.length; i++) {
          var pulse = (i % Math.floor(ctx.sampleRate * .07)) < ctx.sampleRate * .012 ? 1 : .12;
          data[i] = (Math.random() * 2 - 1) * pulse * (1 - i / data.length);
        }
        var src = ctx.createBufferSource();
        var filter = ctx.createBiquadFilter();
        var gain = ctx.createGain();
        filter.type = "bandpass"; filter.frequency.value = 1100; filter.Q.value = .7;
        gain.gain.value = .16;
        src.buffer = buffer; src.connect(filter); filter.connect(gain); gain.connect(ctx.destination); src.start();
      }

      function playBloop() {
        if (muted) return;
        var ctx = audio();
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(155, now);
        osc.frequency.exponentialRampToValueAtTime(310, now + .16);
        osc.frequency.exponentialRampToValueAtTime(220, now + .38);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.17, now + .025);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .42);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + .43);
      }

      function chooseAnswer() {
        var index;
        do { index = Math.floor(Math.random() * answers.length); } while (index === lastAnswer && answers.length > 1);
        lastAnswer = index;
        answer.textContent = answers[index];
      }

      function reset() {
        if (state === "shaking") return;
        state = "ready";
        ball.classList.remove("turned", "revealed");
        shakeButton.textContent = "SHAKE";
        hint.textContent = "Tap, drag, or press SHAKE";
        ballWrap.setAttribute("aria-label", "Magic 8-Ball. Tap or drag to reveal an answer.");
      }

      function shake() {
        if (state === "answer") { reset(); return; }
        if (state !== "ready") return;
        state = "shaking";
        chooseAnswer();
        ballWrap.classList.add("shaking");
        hint.textContent = "Shaking…";
        shakeButton.textContent = "SHAKING";
        playRattle();
        if (navigator.vibrate) navigator.vibrate([35, 35, 45, 30, 55]);
        setTimeout(function () {
          ballWrap.classList.remove("shaking");
          ball.classList.add("turned");
          setTimeout(function () {
            ball.classList.add("revealed");
            playBloop();
          }, 520);
          setTimeout(function () {
            state = "answer";
            shakeButton.textContent = "ASK AGAIN";
            hint.textContent = "Tap the ball to ask another question";
            ballWrap.setAttribute("aria-label", "The Magic 8-Ball says: " + answer.textContent + ". Tap to ask again.");
          }, 1900);
        }, 720);
      }

      shakeButton.addEventListener("click", shake);
      soundButton.addEventListener("click", function () {
        muted = !muted;
        soundButton.classList.toggle("muted", muted);
        soundButton.setAttribute("aria-pressed", String(muted));
        soundButton.setAttribute("aria-label", muted ? "Turn sound on" : "Mute sound");
        if (!muted) audio();
      });
      ballWrap.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); shake(); }
      });
      ballWrap.addEventListener("pointerdown", function (event) {
        pointer = { id:event.pointerId, x:event.clientX, y:event.clientY, distance:0 };
        ballWrap.setPointerCapture(event.pointerId);
      });
      ballWrap.addEventListener("pointermove", function (event) {
        if (!pointer || pointer.id !== event.pointerId || state !== "ready") return;
        var dx = event.clientX - pointer.x, dy = event.clientY - pointer.y;
        pointer.distance += Math.sqrt(dx*dx + dy*dy);
        pointer.x = event.clientX; pointer.y = event.clientY;
        if (pointer.distance > 115) { pointer = null; shake(); }
      });
      ballWrap.addEventListener("pointerup", function (event) {
        if (!pointer || pointer.id !== event.pointerId) return;
        var moved = pointer.distance;
        pointer = null;
        if (moved < 15) shake();
      });
      ballWrap.addEventListener("pointercancel", function () { pointer = null; });
      document.addEventListener("visibilitychange", function () { if (document.hidden) pointer = null; });
    })();
  </script>
</body>
</html>
