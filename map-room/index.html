<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Map Room — A Living Photo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b0b0d; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:34px 18px 30px; }
  h1 { font-size:clamp(28px, 4.5vw, 44px); font-weight:normal; letter-spacing:.14em;
       text-transform:uppercase; color:#f2ead6; text-align:center; }
  .statement { margin-top:8px; font-style:italic; font-size:clamp(14px, 2vw, 18px);
               color:#b9b09a; text-align:center; }
  .stage { position:relative; width:min(1180px, 100%); margin-top:26px;
           aspect-ratio: 1920 / 1088; cursor:pointer; background:#000;
           box-shadow: 0 18px 60px rgba(0,0,0,.65); }
  .stage img { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  .controls { margin-top:22px; display:flex; justify-content:center; }
  button { font-family:inherit; cursor:pointer; background:transparent;
           color:#e8e2d4; border:1px solid #8a7f63; letter-spacing:.12em; }
  #ignite { font-size:17px; padding:13px 34px; border-radius:999px;
            text-transform:uppercase; }
  #ignite:hover { background:#1c1a14; }
  .toggle { display:none; border:1px solid #8a7f63; border-radius:999px; overflow:hidden; }
  .toggle button { border:none; font-size:15px; padding:11px 30px;
                   text-transform:uppercase; background:transparent; }
  .toggle button.on { background:#e8e2d4; color:#141310; }
  footer { padding:26px 18px 40px; text-align:center; font-size:14px; color:#8f887a; }
  footer a { color:#b9b09a; }
  #fs { position:fixed; inset:0; background:#000; display:none; z-index:50; cursor:pointer; }
  #fs img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<main>
  <h1>The Map Room</h1>
  <div class="statement">Gary and the crew in the clubhouse</div>

  <div class="stage" id="stage" title="Tap for full screen">
    <img id="lyrDay"    src="still.jpg" alt="">
    <img id="lyrGolden" src="golden-2x.jpg" alt="" style="opacity:0">
    <img id="lyrGlow"   src="glow-2x.jpg" alt="" style="opacity:0">
    <img id="lyrHeld"   src="held-people-2x-sharp.png" alt="" style="opacity:0">
    <img id="lyrAccCastle" src="acc-castle-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccRocket" src="acc-rocket-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccRiver" src="acc-river-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccTheater" src="acc-theater-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccFalls" src="acc-falls-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccParklights" src="acc-parklights-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccGuitar" src="acc-guitar-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccLamps" src="acc-lamps-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccTeal" src="acc-teal-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccBraid" src="acc-braid-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccGoggles" src="acc-goggles-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccPink" src="acc-pink-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccPurple" src="acc-purple-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccPhones" src="acc-phones-2x.webp" alt="" style="opacity:0">
    <img id="lyrAccBlond" src="acc-blond-2x.webp" alt="" style="opacity:0">
  </div>

  <div class="controls">
    <button id="ignite">&#10022; Bring it to life</button>
    <div class="toggle" id="toggle">
      <button id="btnStill">Still</button><button id="btnLiving" class="on">Living</button>
    </div>
  </div>
</main>

<footer>
  A Living Photo — <a href="https://thelivingphotos.com" target="_blank" rel="noopener">thelivingphotos.com</a>
</footer>

<div id="fs">
    <img id="fsDay"    src="still.jpg" alt="">
    <img id="fsGolden" src="golden-2x.jpg" alt="" style="opacity:0">
    <img id="fsGlow"   src="glow-2x.jpg" alt="" style="opacity:0">
    <img id="fsHeld"   src="held-people-2x-sharp.png" alt="" style="opacity:0">
    <img id="fsAccCastle" src="acc-castle-2x.webp" alt="" style="opacity:0">
    <img id="fsAccRocket" src="acc-rocket-2x.webp" alt="" style="opacity:0">
    <img id="fsAccRiver" src="acc-river-2x.webp" alt="" style="opacity:0">
    <img id="fsAccTheater" src="acc-theater-2x.webp" alt="" style="opacity:0">
    <img id="fsAccFalls" src="acc-falls-2x.webp" alt="" style="opacity:0">
    <img id="fsAccParklights" src="acc-parklights-2x.webp" alt="" style="opacity:0">
    <img id="fsAccGuitar" src="acc-guitar-2x.webp" alt="" style="opacity:0">
    <img id="fsAccLamps" src="acc-lamps-2x.webp" alt="" style="opacity:0">
    <img id="fsAccTeal" src="acc-teal-2x.webp" alt="" style="opacity:0">
    <img id="fsAccBraid" src="acc-braid-2x.webp" alt="" style="opacity:0">
    <img id="fsAccGoggles" src="acc-goggles-2x.webp" alt="" style="opacity:0">
    <img id="fsAccPink" src="acc-pink-2x.webp" alt="" style="opacity:0">
    <img id="fsAccPurple" src="acc-purple-2x.webp" alt="" style="opacity:0">
    <img id="fsAccPhones" src="acc-phones-2x.webp" alt="" style="opacity:0">
    <img id="fsAccBlond" src="acc-blond-2x.webp" alt="" style="opacity:0">
</div>

<script>
(function(){
  "use strict";
  var T = 72;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var frozen = null;          // QA: freeze the displayed phase
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  // Wall-clock phase (Gary's rule): the phase is a pure function of
  // elapsed WALL time from an anchor, never an accumulation of frame
  // deltas - a delta clamp lets slow rendering stretch the cycle until
  // it looks stopped. Rate changes (the ignition sweep) re-anchor.
  var anchorT = 0;            // performance.now() at the anchor
  var anchorPhase = 0;        // phase at the anchor
  var rate = 1;               // current rate (7 during the sweep)
  var sweepEnd = 0;           // wall time the sweep ends (0 = no sweep)
  function phaseNow(now){
    if (sweepEnd && now >= sweepEnd){
      anchorPhase += (sweepEnd - anchorT) / 1000 * rate;
      anchorT = sweepEnd; rate = 1; sweepEnd = 0;
    }
    return anchorPhase + (now - anchorT) / 1000 * rate;
  }

  var ACCN = ['castle','rocket','river','theater','falls','parklights',
              'guitar','lamps','teal','braid','goggles','pink','purple',
              'phones','blond'];
  function cap(s){ return s[0].toUpperCase() + s.slice(1); }
  function stack(p){
    var st = { day: document.getElementById(p+'Day'),
               golden: document.getElementById(p+'Golden'),
               glow: document.getElementById(p+'Glow'),
               held: document.getElementById(p+'Held') };
    for (var i = 0; i < ACCN.length; i++) st[ACCN[i]] = document.getElementById(p+'Acc'+cap(ACCN[i]));
    return st;
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsOpen = false, priorState = 'still';

  // World timeline: original hold -> golden -> glow -> back to original.
  function opacities(t){
    t = ((t % T) + T) % T;
    if (t < 14) return { day:1, golden:0, glow:0 };
    if (t < 26) return { day:1, golden:(t-14)/12, glow:0 };
    if (t < 40) return { day:1, golden:1, glow:0 };
    if (t < 52) return { day:1, golden:1, glow:(t-40)/12 };
    if (t < 64) return { day:1, golden:1, glow:1 };
    return { day:1, golden:0, glow:1-(t-64)/8 };
  }
  // The Christmas tree: fifteen families, each glowing in its own
  // colour on its own offset rhythm - twinkle, never unison throb.
  var ACC = [ ['castle',13,0.0,0.95], ['rocket',9,2.0,1.0], ['river',12,4.0,0.9],
              ['theater',10,1.0,0.95], ['falls',8,3.0,0.9], ['parklights',7,5.0,1.0],
              ['guitar',11,0.5,1.0], ['lamps',14,2.5,0.9],
              ['teal',10,0.8,1.0], ['braid',9,3.6,1.0], ['goggles',7,1.4,1.0],
              ['pink',12,5.2,1.0], ['purple',11,2.2,1.0], ['phones',8,4.4,1.0],
              ['blond',13,6.0,1.0] ];
  function accOpacities(t){
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);                    // smoothstep ease
      o[a[0]] = a[3] * p;
    }
    if (forcedAcc !== null){ for (var k in o) o[k] = forcedAcc; }
    return o;
  }
  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.golden.style.opacity = so.golden;
    st.glow.style.opacity = so.glow;
    st.held.style.opacity = living ? 1 : 0;
    for (var i = 0; i < ACCN.length; i++)
      st[ACCN[i]].style.opacity = living ? ao[ACCN[i]] : 0;
  }
  function frame(now){
    var t = frozen !== null ? frozen : phaseNow(now);
    var so = opacities(t), ao = accOpacities(t);
    var living = state === 'living';
    if (!living) so = { day:1, golden:0, glow:0 };
    apply(page, so, ao, living);
    if (fsOpen) apply(fs, so, ao, true);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){
      ignited = true;
      var now = performance.now();
      anchorT = now; anchorPhase = 0; rate = 7; sweepEnd = now + 4500;
    }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  function openFs(){
    priorState = state;
    if (!ignited) ignite();           // full screen is the living state
    fsOpen = true; fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsEl.style.display = 'none';
    if (priorState === 'still') setStill(); else setLiving();  // exactly the prior state
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape' || e.key)) closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ frozen = null; },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : phaseNow(performance.now())); },
    phaseNow: function(){ return phaseNow(performance.now()); },
    sampleAt: function(t){ return { scene: opacities(t), acc: accOpacities(t) }; },
    state: function(){ return { state: state, fsOpen: fsOpen, phase: phaseNow(performance.now()) }; },
    opacities: opacities
  };
})();
</script>
</body>
</html>
