<script id="lp-hdr-js">
(function(){
  "use strict";
  
  if (/(^|[#&])(wall|embed)/.test(location.hash || '')) document.documentElement.classList.add('lp-embed');
  var ES = {'ignite':'\u2726 Dale vida','btnStill':'Still','fsStill':'Still','lpStill':'Still','lpFsStill':'Still','btnLiving':'Living','fsLiving':'Living','lpLiving':'Living','lpFsLiving':'Living'};
  var ESVAL = {'Still':'Quieta','Living':'Viva','STILL':'QUIETA','LIVING':'VIVA','\u2726 Bring it to life':'\u2726 Dale vida'};
  var lang = 'en';
  function swap(id, toEs){
    var el = document.getElementById(id); if (!el) return;
    if (el.dataset.lpOrig === undefined) el.dataset.lpOrig = el.textContent;
    var orig = el.dataset.lpOrig;
    el.textContent = toEs ? (ESVAL[orig] || orig) : orig;
  }
  function setLang(l){
    lang = l;
    document.querySelectorAll('[data-lp-en]').forEach(function(el){ el.textContent = (l === 'es') ? el.dataset.lpEs : el.dataset.lpEn; });
    ['ignite','btnStill','btnLiving','fsStill','fsLiving','lpStill','lpLiving','lpFsStill','lpFsLiving'].forEach(function(id){ swap(id, l === 'es'); });
    document.getElementById('lpLang').textContent = (l === 'es') ? 'English' : 'Espa\u00f1ol';
  }
  document.getElementById('lpLang').addEventListener('click', function(){ setLang(lang === 'en' ? 'es' : 'en'); });
  var dk = document.getElementById('lpDark');
  dk.addEventListener('click', function(){
    var light = document.documentElement.classList.toggle('lp-light');
    dk.setAttribute('aria-pressed', light ? 'false' : 'true');
  });
  var qb = document.getElementById('lpQr'), panel = document.getElementById('lpQrPanel');
  qb.addEventListener('click', function(){
    var show = panel.hidden; panel.hidden = !show;
    qb.setAttribute('aria-pressed', show ? 'true' : 'false');
  });
  document.getElementById('lpQrClose').addEventListener('click', function(){ panel.hidden = true; qb.setAttribute('aria-pressed','false'); });
  document.addEventListener('fullscreenchange', function(){
    document.body.classList.toggle('lp-infs', !!document.fullscreenElement);
  });
})();
</script>

<script>
(function(){
  "use strict";
  var T = 20;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var frozen = null;          // QA: freeze the displayed phase
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  // Wall-clock phase (Gary's rule): the phase is a pure function of
  // elapsed WALL time from an anchor, never an accumulation of frame
  // deltas - a delta clamp lets slow rendering stretch the cycle until
  // it looks stopped. Rate changes (the ignition sweep) re-anchor.
  var anchorT = 0;            // performance.now() at the anchor
  var anchorPhase = 0;        // phase at the anchor
  var rate = 1;               // current rate (7 during the sweep)
  var sweepEnd = 0;           // wall time the sweep ends (0 = no sweep)
  function phaseNow(now){
    if (sweepEnd && now >= sweepEnd){
      anchorPhase += (sweepEnd - anchorT) / 1000 * rate;
      anchorT = sweepEnd; rate = 1; sweepEnd = 0;
    }
    return anchorPhase + (now - anchorT) / 1000 * rate;
  }

  var ACCN = ['castle','rocket','river','theater','falls','parklights',
              'guitar','lamps','teal','braid','goggles','pink','purple',
              'phones','blond'];
  function cap(s){ return s[0].toUpperCase() + s.slice(1); }
  function stack(p){
    var st = { day: document.getElementById(p+'Day'),
               golden: document.getElementById(p+'Golden'),
               glow: document.getElementById(p+'Glow'),
               held: document.getElementById(p+'Held') };
    for (var i = 0; i < ACCN.length; i++) st[ACCN[i]] = document.getElementById(p+'Acc'+cap(ACCN[i]));
    return st;
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsOpen = false, priorState = 'still';

  // World timeline: original hold -> golden -> glow -> back to original.
  function opacities(t){
    t = ((t % T) + T) % T;
    if (t < 4) return { day:1, golden:0, glow:0 };
    if (t < 7.3333) return { day:1, golden:(t-4)/3.3333, glow:0 };
    if (t < 10.6667) return { day:1, golden:1, glow:0 };
    if (t < 14) return { day:1, golden:1, glow:(t-10.6667)/3.3333 };
    if (t < 17.3333) return { day:1, golden:1, glow:1 };
    return { day:1, golden:0, glow:1-(t-17.3333)/2.6667 };
  }
  // The Christmas tree: fifteen families, each glowing in its own
  // colour on its own offset rhythm - twinkle, never unison throb.
  var ACC = [ ['castle',4.3333,0,0.95], ['rocket',3,0.6667,1.0], ['river',4,1.3333,0.9],
              ['theater',3.3333,0.3333,0.95], ['falls',2.6667,1,0.9], ['parklights',2.3333,1.6667,1.0],
              ['guitar',3.6667,0.1667,1.0], ['lamps',4.6667,0.8333,0.9],
              ['teal',3.3333,0.2667,1.0], ['braid',3,1.2,1.0], ['goggles',2.3333,0.4667,1.0],
              ['pink',4,1.7333,1.0], ['purple',3.6667,0.7333,1.0], ['phones',2.6667,1.4667,1.0],
              ['blond',4.3333,2,1.0] ];
  function accOpacities(t){
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);                    // smoothstep ease
      o[a[0]] = a[3] * p;
    }
    if (forcedAcc !== null){ for (var k in o) o[k] = forcedAcc; }
    return o;
  }
  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.golden.style.opacity = so.golden;
    st.glow.style.opacity = so.glow;
    st.held.style.opacity = living ? 1 : 0;
    for (var i = 0; i < ACCN.length; i++)
      st[ACCN[i]].style.opacity = living ? ao[ACCN[i]] : 0;
  }
  function frame(now){
    var t = frozen !== null ? frozen : phaseNow(now);
    var so = opacities(t), ao = accOpacities(t);
    var living = state === 'living';
    if (!living) so = { day:1, golden:0, glow:0 };
    apply(page, so, ao, living);
    if (fsOpen) apply(fs, so, ao, true);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){
      ignited = true;
      var now = performance.now();
      anchorT = now; anchorPhase = 0; rate = 7; sweepEnd = now + 1500;
    }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  function openFs(){
    priorState = state;
    if (!ignited) ignite();           // full screen is the living state
    fsOpen = true; fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsEl.style.display = 'none';
    if (priorState === 'still') setStill(); else setLiving();  // exactly the prior state
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape')) closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ frozen = null; },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : phaseNow(performance.now())); },
    phaseNow: function(){ return phaseNow(performance.now()); },
    sampleAt: function(t){ return { scene: opacities(t), acc: accOpacities(t) }; },
    state: function(){ return { state: state, fsOpen: fsOpen, phase: phaseNow(performance.now()) }; },
    opacities: opacities
  };
})();
</script>

  #fs.lp-wallfit img:not(.acc):not(.crop):not(.lp-bgimg) { object-fit:contain !important; }
</style>
<script>
(function(){
  "use strict";
  // Wall mode: embedded in the Living Photos wall (#wall), open directly
  // on the full-screen living view, framed whole — the wall owns taps
  // and keys, so the usual tap/key exits are disarmed in this mode only.
  var embedMode = /(^|[#&])embed([&#]|$)/.test(location.hash || '');
  if (!embedMode && !/(^|[#&])wall([&#]|$)/.test(location.hash || '')) return;
  var fsEl = document.getElementById('fs');
  if (!fsEl || !window.LP) return;
  // Blurred-extension surround: blurred copies of this piece's own
  // photographic plates (the .jpg layers), crossfaded in step with them.
  var plates = [];
  fsEl.querySelectorAll('img').forEach(function(im){
    if (/\.jpe?g($|\?)/i.test(im.getAttribute('src') || '')) plates.push(im);
  });
  if (plates.length){
    var bg = document.createElement('div');
    bg.className = 'lp-wallbg';
    var clones = plates.map(function(im){
      var c = document.createElement('img');
      c.src = im.src; c.alt = ''; c.className = 'lp-bgimg';
      c.style.opacity = getComputedStyle(im).opacity;
      bg.appendChild(c);
      return [c, im];
    });
    fsEl.insertBefore(bg, fsEl.firstChild);
    (function mirror(){
      for (var i = 0; i < clones.length; i++){
        var o = clones[i][1].style.opacity;
        if (o !== '') clones[i][0].style.opacity = o;
      }
      requestAnimationFrame(mirror);
    })();
  }
  fsEl.classList.add('lp-wallfit');
  if (LP.ignite){ try { LP.ignite(); } catch(e){} }
  if (LP.openFs){ try { LP.openFs(); } catch(e){} }
  document.addEventListener('keydown', function(e){ e.stopImmediatePropagation(); }, true);
  fsEl.addEventListener('click', function(e){ e.stopImmediatePropagation(); }, true);
  if (embedMode){
    // Store-embed mode: the host page owns the frame. No title, no statement,
    // no controls, no footer — just the living photo, filling the frame whole.
    var st = document.createElement('style');
    st.textContent = 'html,body{height:100%;background:#000}'
      + 'main{display:none !important}'
      + 'footer{display:none !important}'
      + '#fs{display:block !important;position:absolute;inset:0}'
      + '#fs img{object-fit:contain !important}';
    document.head.appendChild(st);
    document.body.style.margin = '0';
  }
})();
</script>

<script id="lp-fsbar-js">
(function(){
  "use strict";
  var API = window.LP || window.HS;
  var bar = document.getElementById('fsBar');
  var b = document.getElementById('fsStill'), c = document.getElementById('fsLiving'), x = document.getElementById('fsClose');
  if (!API || !bar || !b || !c || !x) return;
  function sync(){ try { var st = API.state().state; b.classList.toggle('on', st === 'still'); c.classList.toggle('on', st !== 'still'); } catch(e){} }
  bar.addEventListener('click', function(e){ e.stopPropagation(); });
  b.addEventListener('click', function(e){ e.stopPropagation(); API.setStill(); sync(); });
  c.addEventListener('click', function(e){ e.stopPropagation(); API.setLiving(); sync(); });
  x.addEventListener('click', function(e){ e.stopPropagation(); API.closeFs(); });
  var st = document.getElementById('stage');
  if (st) st.addEventListener('click', function(){ setTimeout(sync, 30); });
  if (/(^|[#&])wall/.test(location.hash || '')){ [b, c, x].forEach(function(el){ el.setAttribute('disabled',''); el.setAttribute('tabindex','-1'); }); }
  sync();
})();
</script>
