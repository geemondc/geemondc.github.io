<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Porch at Dusk — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#191029; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#191029;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 12s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #sun { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 10s ease-in-out infinite alternate;
         background:radial-gradient(50% 65% at 79% 26%, rgba(255,205,120,.34), rgba(255,180,90,.10) 55%, rgba(255,170,90,0) 78%); }
  @keyframes breathe { from { opacity:.55 } to { opacity:1 } }
  .bulb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,226,160,.95), rgba(255,190,100,.30) 55%, rgba(255,190,100,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  .flame { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
           background:radial-gradient(closest-side, rgba(255,214,140,.9), rgba(255,170,80,.28) 55%, rgba(255,170,80,0) 78%);
           animation:twk ease-in-out infinite alternate; }
  .spark { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,252,230,.95), rgba(255,240,190,.28) 55%, rgba(255,240,190,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  .fly { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(226,255,160,.95), rgba(190,230,110,.30) 55%, rgba(190,230,110,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  .glow { position:absolute; pointer-events:none; mix-blend-mode:screen; border-radius:50%;
          animation:breathe ease-in-out infinite alternate; }
  .steam { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; opacity:0;
          background:radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,.12) 55%, rgba(255,255,255,0) 78%);
          animation:steamrise ease-in-out infinite; }
  @keyframes steamrise { 0% { transform:translate(-50%,0) scale(.6); opacity:0 } 30% { opacity:.5 } 100% { transform:translate(-42%,-8vh) scale(1.25); opacity:0 } }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.82); filter:brightness(.78) } to { transform:translate(-50%,-50%) scale(1.18); filter:brightness(1.3) } }
  .petal { position:absolute; pointer-events:none; opacity:0;
           background:radial-gradient(closest-side, rgba(246,168,190,.0), rgba(246,168,190,0) 75%);
           border-radius:60% 40% 60% 40%; animation:fall linear infinite; }
  @keyframes fall { 0% { transform:translate(0,-4vh) rotate(0deg); opacity:0 } 12% { opacity:.5 } 88% { opacity:.45 } 100% { transform:translate(-3vw,104vh) rotate(300deg); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(22,13,42,.55); color:#ffe9b8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,233,184,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #sun, .bulb, .flame, .spark, .fly, .glow, .steam, .petal { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="Two rocking chairs on a farmhouse porch at dusk, string lights glowing and fireflies over the yard">
    </div>
    <div id="sun"></div>
    <div id="fx"></div>
    <div id="caption">THE PORCH AT DUSK</div>
  </div>
</div>
<script>
  // The porch at dusk (Gary's living standard): the painting stays exactly itself; the string bulbs twinkle, the window gold breathes, fireflies blink over the grass, and the last of the sunset fades slow. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    var bulbs = [[47.5, 10.5], [52, 7.5], [57, 10], [62, 8], [67, 11], [72, 9], [77, 12], [82, 9.5], [86, 11]];
    for (var i = 0; i < bulbs.length; i++){
      html += '<div class="bulb" style="left:' + bulbs[i][0] + '%;top:' + bulbs[i][1] + '%;width:' + (1.9 + (i % 3) * 0.3).toFixed(2) + '%;aspect-ratio:1;animation-duration:' + (2.4 + (i % 5) * 0.7).toFixed(1) + 's;animation-delay:-' + (i * 0.6).toFixed(1) + 's"></div>';
    }
    var flys = [[7, 74], [13, 83], [19, 70], [25, 86], [31, 78], [10, 92], [37, 88], [44, 80], [52, 90]];
    for (var i = 0; i < flys.length; i++){
      html += '<div class="fly" style="left:' + flys[i][0] + '%;top:' + flys[i][1] + '%;width:' + (0.7 + (i % 3) * 0.15).toFixed(2) + '%;aspect-ratio:1;animation-duration:' + (3.6 + (i % 5) * 0.6).toFixed(1) + 's;animation-delay:-' + (i * 0.6).toFixed(1) + 's"></div>';
    }
    var dusk = [[23,43,30]];
    for (var g = 0; g < dusk.length; g++){
      html += '<div class="glow" style="left:' + dusk[g][0] + '%;top:' + dusk[g][1] + '%;width:' + dusk[g][2] + '%;aspect-ratio:1.4;transform:translate(-50%,-50%);background:radial-gradient(closest-side, rgba(255,140,120,.16), rgba(255,140,120,0) 78%);animation-duration:13s"></div>';
    }
    var msteams = [[74.5,43.5]];
    for (var s = 0; s < msteams.length; s++){
      for (var p = 0; p < 2; p++){
        html += '<div class="steam" style="left:' + msteams[s][0] + '%;top:' + msteams[s][1] + '%;width:1.6%;aspect-ratio:1;animation-duration:' + (6.0 + p * 1.6).toFixed(1) + 's;animation-delay:-' + (p * 2.8).toFixed(1) + 's"></div>';
      }
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
