<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mother's Day — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#40182a; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.58); transform:scale(1.18); animation:mdFill 11s ease-in-out infinite alternate; }
  @keyframes mdFill { from { filter:blur(26px) brightness(.52) } to { filter:blur(26px) brightness(.7) } }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#40182a;
           box-shadow:0 18px 60px rgba(30,5,16,.55); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:mdDrift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes mdDrift { from { transform:scale(1.03) translate(0.7%,0.35%); } to { transform:scale(1.095) translate(-0.9%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* warm morning sun washing in over the porch, top left */
  #sunwash { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:mdBreathe 10s ease-in-out infinite alternate;
        background:radial-gradient(52% 56% at 22% 4%, rgba(255,238,180,.42), rgba(255,220,140,.12) 55%, rgba(255,220,140,0) 78%); }
  @keyframes mdBreathe { from { opacity:.5 } to { opacity:1 } }
  /* soft warm glows breathing on the bouquet Braids holds up and the vase on the table */
  .glow { position:absolute; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen; border-radius:50%;
        background:radial-gradient(closest-side, rgba(255,190,205,.5), rgba(255,160,180,.18) 55%, rgba(255,160,180,0) 78%);
        animation:mdBreathe ease-in-out infinite alternate; }
  /* sparkles on the bouquets — each in its own color */
  .spk { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        animation:mdTwk ease-in-out infinite alternate; }
  @keyframes mdTwk { from { opacity:.3; transform:translate(-50%,-50%) scale(.82) } to { opacity:1; transform:translate(-50%,-50%) scale(1.18) } }
  /* cherry-blossom petals drifting down through the porch — a traveling element */
  #petals { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .petal { position:absolute; border-radius:82% 4px 82% 4px; pointer-events:none; opacity:0;
        animation:mdPetal linear infinite; will-change:transform,opacity; }
  @keyframes mdPetal { 0% { transform:translate(0,0) rotate(0deg); opacity:0 } 10% { opacity:.92 } 55% { opacity:.78 } 100% { transform:translate(var(--mx), var(--my)) rotate(320deg); opacity:0 } }
  /* two butterflies crossing the porch, wings flapping — the other travelers */
  .bfly { position:absolute; pointer-events:none; z-index:3; will-change:transform; }
  .bfly .bw { position:absolute; top:8%; width:46%; height:84%; border-radius:50% 50% 46% 46%; }
  .bfly .bw.l { left:2%; transform-origin:100% 50%; animation:mdWing .34s ease-in-out infinite alternate; }
  .bfly .bw.r { right:2%; transform-origin:0% 50%; animation:mdWing .34s ease-in-out infinite alternate-reverse; }
  .bfly .bd { position:absolute; left:50%; top:16%; width:9%; height:68%; transform:translateX(-50%); border-radius:999px; background:#5a3418; }
  .bfly1 { left:4%; top:13%; width:3.4%; aspect-ratio:1.5; animation:mdFly1 36s ease-in-out infinite alternate; }
  .bfly1 .bw { background:radial-gradient(closest-side, rgba(255,166,48,.95), rgba(240,120,30,.85) 70%, rgba(200,80,20,.9)); }
  .bfly2 { left:88%; top:52%; width:2.4%; aspect-ratio:1.5; animation:mdFly2 44s ease-in-out infinite alternate; }
  .bfly2 .bw { background:radial-gradient(closest-side, rgba(255,246,200,.95), rgba(250,225,140,.85) 70%, rgba(230,195,90,.9)); }
  .bfly2 .bd { background:#7a5a28; }
  @keyframes mdWing { from { transform:scaleX(.35) rotate(-8deg) } to { transform:scaleX(1) rotate(6deg) } }
  @keyframes mdFly1 { 0% { transform:translate(0,0) } 30% { transform:translate(28vw,-2vh) } 55% { transform:translate(50vw,4vh) } 78% { transform:translate(72vw,-1vh) } 100% { transform:translate(87vw,3vh) } }
  @keyframes mdFly2 { 0% { transform:translate(0,0) } 35% { transform:translate(-24vw,3vh) } 65% { transform:translate(-48vw,-3vh) } 100% { transform:translate(-76vw,2vh) } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(69,26,44,.55); color:#ffe3ec; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,183,201,.45); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #fill, #drift, #sunwash, .glow, .spk, .petal, .bfly, .bfly .bw { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends on a sunny cottage porch on Mother's Day morning, each holding a spring bouquet out to you — Teal, Pink, Cap, Puff and Beanie in front, Goggles, Braids and Phones standing behind — a brunch table with a teapot and pastries in front, gift boxes on the steps, cherry blossoms overhead and a robin flying in with a pink ribbon">
    </div>
    <div id="sunwash"></div>
    <div id="fx"></div>
    <div id="petals"></div>
    <div class="bfly bfly1"><span class="bw l"></span><span class="bw r"></span><span class="bd"></span></div>
    <div class="bfly bfly2"><span class="bw l"></span><span class="bw r"></span><span class="bd"></span></div>
    <div id="caption">MOTHER'S DAY</div>
  </div>
</div>
<script>
  // Mother's Day Porch (Gary's living standard): the painting stays exactly itself; the morning sun breathes over the porch, the bouquets sparkle in their own colors and glow soft, cherry-blossom petals drift down through it all, and two butterflies cross the porch. Cards move faster than photos. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    // soft glows: the peonies Braids holds up, and the vase of flowers on the brunch table
    var glows = [[43, 29, 11, 6.5], [49, 87, 12, 8]];
    for (var g = 0; g < glows.length; g++){
      html += '<div class="glow" style="left:' + glows[g][0] + '%;top:' + glows[g][1] + '%;width:' + glows[g][2] + '%;aspect-ratio:1;animation-duration:' + glows[g][3] + 's"></div>';
    }
    // sparkles on the bouquets — front row first, then the back row, then the table vase
    var bq = [
      [7,68,'255,150,190'],[25,70,'190,160,255'],[43,67,'255,205,60'],[62,71,'255,150,190'],[83,71,'255,160,90'],
      [23,26,'255,140,110'],[43,29,'255,170,205'],[50,47,'255,230,240'],[76,26,'170,190,255'],
      [49,87,'255,170,205'],[16,60,'255,190,215'],[90,60,'255,180,120']
    ];
    for (var i = 0; i < bq.length; i++) {
      var sz = 0.8 + (i % 3) * 0.22;
      html += '<div class="spk" style="left:' + bq[i][0] + '%;top:' + bq[i][1] + '%;width:' + sz.toFixed(2) + '%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(' + bq[i][2] + ',.95), rgba(' + bq[i][2] + ',.3) 55%, rgba(' + bq[i][2] + ',0) 78%);animation-duration:' + (1.9 + (i % 4) * 0.45).toFixed(1) + 's;animation-delay:-' + (i * 0.41).toFixed(2) + 's"></div>';
    }
    host.innerHTML = html;
    // cherry-blossom petals drifting down across the whole porch
    var petals = document.getElementById('petals'), phtml = '';
    var cols = ['#f9c6dd', '#f7a8c4', '#fdf0f5', '#f5b8cf'];
    for (var m = 0; m < 16; m++) {
      var lx = 3 + (m * 41) % 92, ly = (m * 23) % 40;
      var dx = ((m % 5) - 2) * 2.6, dy = 48 + (m % 4) * 7;
      var ldur = (9 + (m % 5) * 1.6).toFixed(1), ldel = (m * 1.47).toFixed(2);
      var lsz = (1.2 + (m % 3) * 0.42).toFixed(2);
      phtml += '<div class="petal" style="left:' + lx + '%;top:' + ly + '%;width:' + lsz + '%;aspect-ratio:1;background:' + cols[m % 4] + ';--mx:' + dx.toFixed(1) + 'vw;--my:' + dy.toFixed(0) + 'vh;animation-duration:' + ldur + 's;animation-delay:-' + ldel + 's"></div>';
    }
    petals.innerHTML = phtml;
  })();
</script>
</body>
</html>
