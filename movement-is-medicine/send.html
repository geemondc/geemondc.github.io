<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Send a Little Good — Movement Is Medicine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f7ecd9;
    color: #3d2c1c;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 100%;
    max-width: 540px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 20px 18px 16px;
    background: linear-gradient(180deg, #fdf6e7 0%, #f7ecd9 60%, #f3e3c8 100%);
  }
  @media (min-width: 760px) {
    .page { width: 75%; max-width: 1024px; padding: 28px 30px 22px; }
  }

  .cardname {
    text-align: center;
    font-size: clamp(1.7rem, 7.5vw, 2.4rem);
    font-weight: bold;
    line-height: 1.15;
    color: #5d7a2a;
    margin-top: 4px;
  }
  .free {
    text-align: center;
    margin-top: 8px;
    font-size: clamp(1.02rem, 4.4vw, 1.15rem);
    font-style: italic;
    color: #5a4632;
  }

  .scene {
    margin-top: 14px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(90, 60, 20, 0.25);
  }
  .scene img { display: block; width: 100%; height: auto; }

  form { margin-top: 16px; }
  .field { margin-top: 14px; }
  .field label {
    display: block;
    font-size: clamp(1.05rem, 4.6vw, 1.2rem);
    font-weight: bold;
    color: #43301d;
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: clamp(1.05rem, 4.6vw, 1.18rem);
    color: #3d2c1c;
    background: #fffcf4;
    border: 2px solid #e8d5ae;
    border-radius: 12px;
    padding: 12px 14px;
  }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field textarea:focus { outline: 3px solid #b35c1e; outline-offset: 1px; }

  .sendbtn {
    display: block;
    text-align: center;
    margin-top: 20px;
    background: linear-gradient(160deg, #7ba23f, #55701f);
    color: #fff8ec; text-decoration: none; font-weight: bold;
    font-size: clamp(1.15rem, 5vw, 1.35rem);
    padding: 16px 26px; border-radius: 999px;
    box-shadow: 0 5px 16px rgba(90, 60, 20, 0.28);
  }
  .sendbtn:active { filter: brightness(1.1); }

  .others {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .ghost {
    display: inline-block;
    background: transparent;
    color: #55701f; text-decoration: none; font-weight: bold;
    font-family: inherit;
    font-size: clamp(0.98rem, 4.2vw, 1.08rem);
    padding: 10px 20px; border-radius: 999px;
    border: 2px solid #7ba23f;
    cursor: pointer;
  }
  .ghost:active { filter: brightness(1.1); }
  .copied {
    text-align: center;
    margin-top: 10px;
    font-style: italic;
    color: #5d7a2a;
    min-height: 1.4em;
  }

  .bottom { margin-top: auto; padding-top: 18px; text-align: center; }
  .bottom .heal {
    font-size: clamp(1.05rem, 4.6vw, 1.2rem);
    font-weight: bold;
    color: #b35c1e;
  }
  .bottom .sig {
    margin-top: 8px;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a8895c;
  }
</style>
</head>
<body>
  <main class="page">

    <h1 class="cardname">A Little Good for You</h1>
    <p class="free">This card is free. Send it to someone who could use a little good today.</p>

    <div class="scene">
      <img src="garden-path.jpg" alt="A painted cottage garden at sunrise — a stone path winds between flower beds toward a wooden gate, the sun rising over a misty valley beyond">
    </div>

    <form id="sendForm" autocomplete="off">
      <div class="field">
        <label for="fTo">Who is it going to?</label>
        <input id="fTo" type="text" maxlength="60" placeholder="Their name">
      </div>
      <div class="field">
        <label for="fFrom">Your name</label>
        <input id="fFrom" type="text" maxlength="60" placeholder="Your name">
      </div>
      <div class="field">
        <label for="fWords">What do you want to say?</label>
        <textarea id="fWords">Thinking of you. No need to reply. — just a little good for your day.</textarea>
      </div>

      <a class="sendbtn" id="btnMail" href="mailto:">SEND BY EMAIL</a>

      <div class="others">
        <a class="ghost" id="btnSms" href="sms:">Text it</a>
        <a class="ghost" id="btnWa" href="https://wa.me/">WhatsApp</a>
        <button class="ghost" id="btnCopy" type="button">Copy link</button>
      </div>
      <p class="copied" id="copied" aria-live="polite"></p>
    </form>

    <div class="bottom">
      <p class="heal">Healing takes time.</p>
      <p class="sig">Movement Is Medicine &middot; Future Ready</p>
    </div>

  </main>

<script>
  var CARD = 'https://geemondc.github.io/living-card-sample/';
  var fTo = document.getElementById('fTo');
  var fFrom = document.getElementById('fFrom');
  var fWords = document.getElementById('fWords');
  var btnMail = document.getElementById('btnMail');
  var btnSms = document.getElementById('btnSms');
  var btnWa = document.getElementById('btnWa');
  var btnCopy = document.getElementById('btnCopy');
  var copied = document.getElementById('copied');
  var link = '';

  function build() {
    var to = fTo.value.trim() || 'Friend';
    var from = fFrom.value.trim() || 'Me';
    var words = fWords.value.trim();
    link = CARD + '?scene=littlegood&to=' + encodeURIComponent(to) + '&from=' + encodeURIComponent(from);
    if (words) link += '&line=' + encodeURIComponent(words.slice(0, 140));
    var body = (words ? words + '\n\n' : '') + link;
    var enc = encodeURIComponent(body);
    btnMail.href = 'mailto:?subject=' + encodeURIComponent('A Living Card for ' + to) + '&body=' + enc;
    btnSms.href = 'sms:?&body=' + enc;
    btnWa.href = 'https://wa.me/?text=' + enc;
    copied.textContent = '';
  }

  [fTo, fFrom, fWords].forEach(function (el) {
    el.addEventListener('input', build);
    el.addEventListener('change', build);
  });
  build();

  btnCopy.addEventListener('click', function () {
    function done() { copied.textContent = 'Link copied — send it any way you like.'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done, done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = link;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  });

  document.getElementById('sendForm').addEventListener('submit', function (e) { e.preventDefault(); });
</script>
</body>
</html>
