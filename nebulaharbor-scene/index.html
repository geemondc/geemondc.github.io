<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nebula Harbor — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#060a18; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.5); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#060a18;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 13s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .glow { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity:.45 } to { opacity:1 } }
  .twk { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(200,220,255,.30) 55%, rgba(200,220,255,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.8); filter:brightness(.75) } to { transform:translate(-50%,-50%) scale(1.2); filter:brightness(1.35) } }
  .pulse { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; animation:pl 2.6s ease-in-out infinite; }
  @keyframes pl { 0%,100% { opacity:.25; transform:translate(-50%,-50%) scale(.85) } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.15) } }

  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(6,10,24,.55); color:#eaf2ff; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(110,231,242,.4); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, .glow, .twk, .pulse { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="A lighthouse and a rocket on a dock under a ringed planet, reflected in still water">
    </div>
    <div id="fx"></div>
    <div id="caption">NEBULA HARBOR</div>
  </div>
</div>
<script>
  // The harbor at night: the lighthouse beacon and window glow, the rocket's portholes and the dock lamps twinkle, the nebulas breathe, and the still water holds a slow sheen. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    html += '<div class="glow" style="left:20.4%;top:29.5%;width:4%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,205,110,0.5), rgba(255,205,110,0) 72%);animation-duration:6s"></div>';
    html += '<div class="glow" style="left:20%;top:42%;width:4.5%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,190,100,0.4), rgba(255,190,100,0) 72%);animation-duration:8s"></div>';
    html += '<div class="glow" style="left:14%;top:16%;width:22%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(64,224,208,0.13), rgba(64,224,208,0) 72%);animation-duration:12s"></div>';
    html += '<div class="glow" style="left:88%;top:20%;width:20%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,180,90,0.13), rgba(255,180,90,0) 72%);animation-duration:11s"></div>';
    html += '<div class="glow" style="left:50%;top:80%;width:46%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(150,200,255,0.07), rgba(150,200,255,0) 72%);animation-duration:13s"></div>';
    var lamps = [[27.8,55],[34.5,56],[39,56],[29.8,47.5],[29.8,50],[29.8,52.5]];
    for (var j = 0; j < lamps.length; j++){
      html += '<div class="twk" style="left:' + lamps[j][0] + '%;top:' + lamps[j][1] + '%;width:1.7%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,214,140,.95), rgba(255,180,90,.30) 55%, rgba(255,180,90,0) 78%);animation-duration:' + (2.6 + j * 0.5).toFixed(1) + 's;animation-delay:-' + (j * 0.7).toFixed(1) + 's"></div>';
    }
    var stars = [[8,10],[30,8],[44,14],[58,8],[70,14],[96,10],[86,44],[64,52],[50,44],[96,58],[12,58],[38,30],[78,56],[55,64]];
    for (var i = 0; i < stars.length; i++){
      var w = (0.9 + (i % 3) * 0.45).toFixed(2);
      html += '<div class="twk" style="left:' + stars[i][0] + '%;top:' + stars[i][1] + '%;width:' + w + '%;aspect-ratio:1;animation-duration:' + (2.4 + (i % 5) * 0.65).toFixed(1) + 's;animation-delay:-' + (i * 0.55).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
