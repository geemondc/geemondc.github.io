<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooftop Lounge — Neon City — a Living Atmosphere</title>
<meta name="description" content="Rooftop Lounge — a rainy night above the neon city. A living atmosphere for a room.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#05070D; height:100%; }
  body { overflow:hidden; font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  .stage { position:fixed; inset:0; background:#05070D; }
  .frame { position:absolute; overflow:hidden; background:#05070D; }
  .frame img.base { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .frame canvas.fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .glint { position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,244,214,.95) 0%, rgba(255,214,140,.35) 42%, rgba(255,214,140,0) 70%);
    mix-blend-mode:screen; opacity:0; }
  .neon { position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,120,220,.5) 0%, rgba(120,180,255,.22) 46%, rgba(255,120,220,0) 72%);
    mix-blend-mode:screen; opacity:0; }
  .fire { position:absolute; pointer-events:none; border-radius:50%;
    background:radial-gradient(ellipse 60% 100% at 50% 78%, rgba(255,236,190,.95) 0%, rgba(255,176,84,.55) 38%, rgba(255,110,40,.18) 62%, rgba(255,110,40,0) 78%);
    mix-blend-mode:screen; transform-origin:50% 82%; opacity:.8; }
  .vig { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 108% 96% at 50% 46%, transparent 66%, rgba(1,3,8,.34) 100%); }
  .top { position:fixed; top:0; left:0; right:0; padding:20px 22px 30px; pointer-events:none;
    background:linear-gradient(rgba(1,3,8,.5), transparent); color:#EAF2FF;
    opacity:1; transition:opacity 1.2s; }
  .top h1 { font-size:26px; font-weight:700; letter-spacing:.4px; }
  .top p { font-size:15.5px; color:#BFD2EE; margin-top:3px; max-width:560px; line-height:1.45; }
  .bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; justify-content:center; align-items:center;
    padding:16px 12px 20px; background:linear-gradient(transparent, rgba(1,3,8,.55));
    opacity:1; transition:opacity 1.2s; }
  .bbtn { font-size:17px; font-weight:700; padding:11px 20px; border-radius:999px; cursor:pointer;
    border:1.5px solid rgba(190,215,255,.55); background:rgba(8,14,28,.55); color:#EAF2FF; font-family:inherit;
    backdrop-filter:blur(4px); }
  .bbtn:hover { background:rgba(18,30,54,.65); }
  body.idle .top, body.idle .bar { opacity:0; }
  .hint { position:fixed; right:16px; bottom:74px; color:#9DB9DE; font-size:13.5px; opacity:.85; pointer-events:none;
    transition:opacity 1.2s; }
  body.idle .hint { opacity:0; }

  body.expanded .top, body.expanded .bar { display:none; }
  body.expanded .frame { left:0 !important; top:0 !important; width:100vw !important; height:100vh !important; }
  body.expanded .frame img.base, body.expanded .frame canvas.pool, body.expanded .frame canvas.fx { object-fit:cover; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame" id="frame">
    <img class="base" src="still1.jpg" alt="Rooftop Lounge — a rainy night above the neon city">
    <canvas class="fx" id="fx" width="1395" height="744"></canvas>
    <div class="vig"></div>
  </div>
</div>
<div class="bar">
  <button class="bbtn" id="btnPlay" onclick="togglePlay()">⏸</button>
  <button class="bbtn" id="btnMusic" onclick="toggleMusic()">🎵</button>
  <button class="bbtn" onclick="toggleFull()">⛶</button>
</div>
<audio id="scene" src="music1.mp3" loop preload="auto"></audio>
<script>
(function(){
  var stage = document.getElementById('stage'), frame = document.getElementById('frame');
  var IW = 1395, IH = 744;
  function seat(){
    // MAXIMIZE (Gary): the picture fills the screen — cover-fit, whole
    // photo still reachable in the Museum Frame view via the frame chip.
    var w = stage.clientWidth, h = stage.clientHeight, rw, rh;
    if (w / h > IW / IH) { rw = w; rh = w * IH / IW; } else { rh = h; rw = h * IW / IH; }
    frame.style.left = ((w - rw) / 2) + 'px'; frame.style.top = ((h - rh) / 2) + 'px';
    frame.style.width = rw + 'px'; frame.style.height = rh + 'px';
  }
  window.addEventListener('resize', seat); seat();
var CITY=[[7.7,55.6],[63.0,71.9],[21.2,87.1],[14.5,62.6],[20.4,96.8],[25.2,55.2],[71.7,63.8],[19.3,79.8],[34.1,59.9],[13.0,52.2],[20.3,91.8],[21.6,89.2],[50.1,67.3],[15.0,72.2],[96.0,76.6],[22.6,73.8],[9.3,87.8],[22.4,90.5],[23.8,91.0],[25.9,71.6],[21.3,68.1],[23.0,72.4],[16.7,73.8],[26.4,68.0],[77.7,74.5],[30.4,52.2],[67.0,54.4],[19.9,85.9],[8.9,84.9],[18.9,82.4],[21.9,73.8],[12.3,62.6],[31.3,59.4],[22.0,84.4],[20.7,84.5],[23.1,73.8],[30.8,62.8],[20.4,74.5],[37.1,59.7],[50.9,63.4],[27.3,87.5],[41.7,60.1],[18.1,69.5],[19.3,82.1],[21.1,68.8],[11.0,75.3],[21.1,83.6],[13.3,64.4],[17.6,83.5],[20.1,93.3],[15.3,52.2],[25.5,66.9],[20.9,70.7],[15.7,64.4],[16.3,80.1],[25.3,81.5],[10.6,57.7],[24.7,71.6],[24.9,96.0],[21.6,79.4],[15.4,80.9],[35.6,58.9],[33.2,55.5],[16.3,90.9],[35.1,63.8],[17.6,82.4],[73.4,71.4],[15.8,61.7],[22.1,67.6],[21.1,71.1],[19.3,77.2],[24.9,87.8],[36.6,61.3],[19.9,78.1],[21.7,70.8],[31.7,63.6],[19.1,75.9],[7.0,82.3],[21.6,66.8],[11.3,54.2],[41.1,58.6],[32.7,81.0],[96.8,98.8],[18.2,81.9],[17.9,82.9],[16.6,75.1],[11.9,56.0],[25.9,63.3],[10.0,58.6],[95.1,98.8],[9.7,91.8],[23.4,75.3],[15.6,63.7],[19.5,73.7],[21.2,89.5],[18.1,57.5],[9.8,80.2],[16.1,59.9],[12.3,67.6],[21.6,82.3],[35.6,61.2],[42.7,66.9],[72.0,70.2],[34.1,64.9],[42.5,62.4],[15.1,90.7],[95.2,98.1],[21.9,69.5],[32.2,53.0],[14.7,64.4],[16.8,82.9],[32.1,71.0],[42.2,63.3],[22.2,70.8],[25.2,52.6],[14.9,89.2],[19.3,72.2],[25.7,64.0],[20.1,79.8],[20.4,84.9],[31.4,61.6],[24.4,74.9],[16.1,92.2],[35.0,56.2],[73.7,53.2],[46.9,65.3],[15.5,65.6],[33.6,66.1],[22.6,69.0],[13.3,57.5],[23.5,95.8],[23.8,96.6],[26.5,62.0],[25.6,59.3],[20.1,81.3],[14.1,90.7],[17.9,81.0],[24.6,66.5],[34.7,66.8],[36.0,60.9],[21.1,70.2],[23.9,88.0],[13.1,54.7],[97.2,98.3],[19.6,90.2],[24.7,75.7],[23.2,68.1],[19.8,92.5],[41.1,61.6],[14.7,91.4],[35.6,63.0],[71.2,70.4],[19.9,94.0],[23.7,81.7],[21.1,96.8],[18.4,78.5],[47.5,60.8],[73.2,52.3],[99.1,98.9],[25.9,67.6],[23.2,94.2],[34.6,60.2],[17.5,60.5],[78.1,73.7],[36.9,78.2],[22.9,52.4],[34.5,56.6],[22.6,80.2],[42.0,61.4],[42.5,60.3],[71.5,70.0],[45.3,62.8],[34.1,64.1],[24.9,78.0],[18.9,85.6],[18.0,64.9],[11.1,53.0],[48.1,64.2],[71.5,71.0],[2.5,58.1],[12.6,58.2],[11.0,55.1],[24.2,81.9],[19.5,83.2],[74.8,53.6],[60.6,73.0],[33.4,64.8],[19.3,75.4],[4.8,54.2],[21.4,71.6],[47.1,64.5],[70.7,64.1],[37.0,76.9],[23.4,90.1],[34.4,53.4],[46.6,66.4],[43.4,67.5],[23.8,86.7],[40.1,83.9],[34.6,54.8],[5.7,53.0],[10.3,58.1],[22.3,85.2],[18.9,88.4],[25.8,65.1],[17.0,78.5],[20.3,69.9],[18.1,72.6],[20.4,72.8],[24.4,63.3],[20.4,95.2],[78.3,55.4],[18.1,71.4],[24.8,71.0],[32.1,62.4],[19.6,83.9],[25.8,57.7],[75.1,71.8],[41.9,66.8],[5.2,54.7],[34.0,58.6],[19.8,84.4],[15.7,81.9],[21.7,65.2],[35.0,58.6],[37.3,77.7],[78.9,74.2],[21.1,82.0],[22.2,95.2],[93.5,97.6],[25.2,53.2],[24.2,70.4],[32.0,52.3],[6.7,77.6],[22.7,93.8],[28.2,53.9],[35.9,78.9],[37.1,64.2],[41.6,59.3],[4.7,52.7]];
  var NEON=[[39.6,40.2,9],[10.3,58.9,12],[56.8,43.7,15],[71.5,35.1,9],[34.0,60.3,12],[73.3,48.7,15],[79.5,47.0,9],[20.1,46.8,12],[49.8,35.5,15],[66.8,53.9,9]];

  var cv = document.getElementById('fx'), cx = cv.getContext('2d');
  var drops = [];
  (function(){
    for (var i = 0; i < 85; i++){
      drops.push({ x: Math.random(), y: Math.random(), sp: 0.09 + Math.random()*0.19,
                   len: 0.012 + Math.random()*0.03, wob: Math.random()*Math.PI*2 });
    }
  })();
  function drawAll(t, dt){
    cx.clearRect(0, 0, IW, IH);
    var i, d, x, y, s, a, r, g;
    for (i = 0; i < CITY.length; i++){
      d = CITY[i]; x = d[0]/100*IW; y = d[1]/100*IH;
      s = 0.5 - 0.5*Math.cos(2*Math.PI*t/(1.5+(i*37%13)*0.27) + i*1.71);
      s = s*s*(3-2*s); a = 0.10 + 0.38*s; r = 0.9 + 1.0*s;
      g = cx.createRadialGradient(x,y,0,x,y,r*3);
      g.addColorStop(0,'rgba(255,232,185,'+a.toFixed(3)+')'); g.addColorStop(1,'rgba(255,232,185,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(x,y,r*3,0,Math.PI*2); cx.fill();
    }
    cx.lineWidth = 1.1; cx.lineCap = 'round';
    for (i = 0; i < drops.length; i++){
      d = drops[i];
      d.y += d.sp * dt; d.x += Math.sin(t*1.3 + d.wob) * 0.00012;
      if (d.y > 1.02){ d.y = -0.03; d.x = Math.random(); }
      x = d.x*IW; y = d.y*IH;
      var grad = cx.createLinearGradient(x, y - d.len*IH, x, y);
      grad.addColorStop(0,'rgba(190,215,255,0)');
      grad.addColorStop(1,'rgba(190,215,255,'+(0.16+0.1*Math.sin(t+d.wob)).toFixed(3)+')');
      cx.strokeStyle = grad;
      cx.beginPath(); cx.moveTo(x, y - d.len*IH); cx.lineTo(x + 1.5, y); cx.stroke();
      cx.fillStyle = 'rgba(200,225,255,0.35)';
      cx.beginPath(); cx.arc(x + 1.5, y, 1.1, 0, Math.PI*2); cx.fill();
    }
  }
  var neons = NEON.map(function(s, i){
    var d = document.createElement('div'); d.className = 'neon';
    d.style.left = s[0]+'%'; d.style.top = s[1]+'%';
    d.style.width = (s[2]*3.1)+'px'; d.style.height = (s[2]*3.1)+'px';
    d.style.transform = 'translate(-50%,-50%)'; frame.appendChild(d);
    return { el:d, per:3.1+((i*31)%9)*0.61, ph:((i*47)%19)/19*Math.PI*2, amp:.55+((i*23)%10)/20 };
  });
  var t0 = performance.now(), last = t0;
  function tick(now){
    if (window.__frozen) { requestAnimationFrame(tick); return; }
    var t = (now - t0)/1000, dt = Math.min(0.05, (now - last)/1000); last = now;
    for (var i = 0; i < neons.length; i++){
      var g = neons[i];
      var v = 0.5 - 0.5*Math.cos(2*Math.PI*t/g.per + g.ph); v = v*v*(3-2*v);
      var buzz = (Math.sin(t*23 + g.ph*7) > 0.972) ? 0.3 : 1;
      g.el.style.opacity = (v*g.amp*buzz).toFixed(3);
    }
    drawAll(t, dt);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.LP = { state: function(){ return { city: CITY.length, neons: neons.length, drops: drops.length }; } };

  var audio = document.getElementById('scene');
  var btnM = document.getElementById('btnMusic');
  window.togglePlay = function(){
    window.__frozen = !window.__frozen;
    document.getElementById('btnPlay').textContent = window.__frozen ? '▶' : '⏸';
  };
  window.toggleMusic = function(){
    if (audio.paused) { audio.play(); btnM.textContent = '🔇'; }
    else { audio.pause(); btnM.textContent = '🎵'; }
  };
  var expanded = false;
  window.toggleFull = function(){
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function(){ expandFallback(); });
    } else { expandFallback(); }
  };
  function expandFallback(){
    expanded = !expanded;
    document.body.classList.toggle('expanded', expanded);
    seat();
  }
  var idleTimer = null;
  function wake(){
    document.body.classList.remove('idle');
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 5000);
  }
  ['mousemove','touchstart','keydown','click'].forEach(function(ev){ window.addEventListener(ev, wake, {passive:true}); });
  wake();
})();
</script>
</body>
</html>
