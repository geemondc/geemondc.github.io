<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Orleans — A Living Photo (test)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0b0b0d; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:34px 18px 30px; }
  h1 { font-size:clamp(28px, 4.5vw, 44px); font-weight:normal; letter-spacing:.14em;
       text-transform:uppercase; color:#f2ead6; text-align:center; }
  .statement { margin-top:8px; font-style:italic; font-size:clamp(14px, 2vw, 18px);
               color:#b9b09a; text-align:center; }
  .stage { position:relative; width:min(1120px, 100%); margin-top:26px;
           aspect-ratio: 1799 / 1212; cursor:pointer; background:#000;
           box-shadow: 0 18px 60px rgba(0,0,0,.65); }
  .stage img { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  .controls { margin-top:22px; display:flex; justify-content:center; }
  button { font-family:inherit; cursor:pointer; background:transparent;
           color:#e8e2d4; border:1px solid #8a7f63; letter-spacing:.12em; }
  #ignite { font-size:17px; padding:13px 34px; border-radius:999px;
            text-transform:uppercase; }
  #ignite:hover { background:#1c1a14; }
  .toggle { display:none; border:1px solid #8a7f63; border-radius:999px; overflow:hidden; }
  .toggle button { border:none; font-size:15px; padding:11px 30px;
                   text-transform:uppercase; background:transparent; }
  .toggle button.on { background:#e8e2d4; color:#141310; }
  footer { padding:26px 18px 40px; text-align:center; font-size:14px; color:#8f887a; }
  footer a { color:#b9b09a; }
  #fs { position:fixed; inset:0; background:#000; display:none; z-index:50; cursor:pointer; }
  #fs img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<main>
  <h1>New Orleans</h1>
  <div class="statement">Gary in New Orleans</div>

  <div class="stage" id="stage" title="Tap for full screen">
    <img id="lyrDay"    src="still.jpg" alt="The original photo, untouched">
    <img id="lyrGolden" src="golden.jpg" alt="" style="opacity:0">
    <img id="lyrGlow"   src="glow.jpg" alt="" style="opacity:0">
    <img id="lyrHeld"   src="held-group.png" alt="" style="opacity:0">
    <img id="lyrAccBeads"  src="acc-beads.png" alt="" style="opacity:0">
    <img id="lyrAccPurple" src="acc-purple.png" alt="" style="opacity:0">
    <img id="lyrAccPearl"  src="acc-pearl.png" alt="" style="opacity:0">
    <img id="lyrAccSign"   src="acc-sign.png" alt="" style="opacity:0">
    <img id="lyrAccLamp"   src="acc-lamp.png" alt="" style="opacity:0">
  </div>

  <div class="controls">
    <button id="ignite">&#10022; Bring it to life</button>
    <div class="toggle" id="toggle">
      <button id="btnStill">Still</button><button id="btnLiving" class="on">Living</button>
    </div>
  </div>
</main>

<footer>
  A Living Photo — <a href="https://thelivingphotos.com" target="_blank" rel="noopener">thelivingphotos.com</a>
</footer>

<div id="fs">
  <img id="fsDay"    src="still.jpg" alt="">
  <img id="fsGolden" src="golden.jpg" alt="" style="opacity:0">
  <img id="fsGlow"   src="glow.jpg" alt="" style="opacity:0">
  <img id="fsHeld"   src="held-group.png" alt="" style="opacity:0">
  <img id="fsAccBeads"  src="acc-beads.png" alt="" style="opacity:0">
  <img id="fsAccPurple" src="acc-purple.png" alt="" style="opacity:0">
  <img id="fsAccPearl"  src="acc-pearl.png" alt="" style="opacity:0">
  <img id="fsAccSign"   src="acc-sign.png" alt="" style="opacity:0">
  <img id="fsAccLamp"   src="acc-lamp.png" alt="" style="opacity:0">
</div>

<script>
(function(){
  "use strict";
  var T = 60;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var frozen = null;          // QA: freeze the phase at this many seconds
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  // The phase is driven by WALL-CLOCK time (performance.now), never by
  // accumulated frame deltas: a delta clamp lets slow rendering stretch
  // the cycle until it looks stopped. Anchors: anchorP = phase seconds
  // at anchorT (ms); rate is 7 during the ignition sweep, then 1.
  var anchorT = 0, anchorP = 0, rate = 1;
  var last = performance.now();

  function phaseNow(now){
    if (!ignited) return 0;
    if (rate !== 1 && now - anchorT >= 4500){
      anchorP = anchorP + (now - anchorT) / 1000 * rate;
      anchorT = now; rate = 1;
    }
    return anchorP + (now - anchorT) / 1000 * rate;
  }

  function stack(p){
    return { day: document.getElementById(p+'Day'),
             golden: document.getElementById(p+'Golden'),
             glow: document.getElementById(p+'Glow'),
             held: document.getElementById(p+'Held'),
             beads: document.getElementById(p+'AccBeads'),
             purple: document.getElementById(p+'AccPurple'),
             pearl: document.getElementById(p+'AccPearl'),
             sign: document.getElementById(p+'AccSign'),
             lamp: document.getElementById(p+'AccLamp') };
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsOpen = false, priorState = 'still';

  // Outdoor timeline: original hold -> golden -> glow -> back to original.
  function opacities(t){
    t = ((t % T) + T) % T;
    if (t < 12) return { day:1, golden:0, glow:0 };
    if (t < 22) return { day:1, golden:(t-12)/10, glow:0 };
    if (t < 32) return { day:1, golden:1, glow:0 };
    if (t < 42) return { day:1, golden:1, glow:(t-32)/10 };
    if (t < 52) return { day:1, golden:1, glow:1 };
    return { day:1, golden:0, glow:1-(t-52)/8 };
  }
  // The accents: Mardi Gras beads, purple beads, pearls, the stop sign,
  // the door lantern - five independent slow pulses, offset like lights.
  var ACC = [ ['beads', 11, 0.0, 1.0], ['purple', 9, 3.1, 1.0],
              ['pearl', 13, 5.2, 1.0], ['sign', 8, 1.7, 1.0],
              ['lamp', 10, 7.4, 1.0] ];
  function accOpacities(t){
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);                    // smoothstep ease
      o[a[0]] = a[3] * p;
    }
    if (forcedAcc !== null){
      o.beads = o.purple = o.pearl = o.sign = o.lamp = forcedAcc;
    }
    return o;
  }
  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.golden.style.opacity = so.golden;
    st.glow.style.opacity = so.glow;
    st.held.style.opacity = living ? 1 : 0;
    st.beads.style.opacity = living ? ao.beads : 0;
    st.purple.style.opacity = living ? ao.purple : 0;
    st.pearl.style.opacity = living ? ao.pearl : 0;
    st.sign.style.opacity = living ? ao.sign : 0;
    st.lamp.style.opacity = living ? ao.lamp : 0;
  }
  function frame(now){
    last = now;
    var t = frozen !== null ? frozen : phaseNow(now);
    var so = opacities(t), ao = accOpacities(t);
    var living = state === 'living';
    if (!living) so = { day:1, golden:0, glow:0 };
    apply(page, so, ao, living);
    if (fsOpen) apply(fs, so, ao, true);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){
      ignited = true;
      anchorT = performance.now(); anchorP = 0; rate = 7;  // sweep, then 1x
    }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  function openFs(){
    priorState = state;
    if (!ignited) ignite();           // full screen is the living state
    fsOpen = true; fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsEl.style.display = 'none';
    if (priorState === 'still') setStill(); else setLiving();  // exactly the prior state
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape' || e.key)) closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ frozen = null; },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return accOpacities(frozen !== null ? frozen : phaseNow(performance.now())); },
    phase: function(){ return frozen !== null ? frozen : phaseNow(performance.now()); },
    state: function(){ return { state: state, fsOpen: fsOpen, clock: phaseNow(performance.now()) }; },
    opacities: opacities
  };
})();
</script>
<style>
  /* Wall mode fit (added for the Living Photos wall): whole photo, with
     the photo's own blurred plates filling any surround. */
  #fs .lp-wallbg { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #fs .lp-wallbg img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; filter:blur(26px) brightness(.7) saturate(1.06);
    transform:scale(1.14); display:block; }
  #fs.lp-wallfit img:not(.acc):not(.crop):not(.lp-bgimg) { object-fit:contain !important; }
</style>
<script>
(function(){
  "use strict";
  // Wall mode: embedded in the Living Photos wall (#wall), open directly
  // on the full-screen living view, framed whole — the wall owns taps
  // and keys, so the usual tap/key exits are disarmed in this mode only.
  if (!/(^|[#&])wall([&#]|$)/.test(location.hash || '')) return;
  var fsEl = document.getElementById('fs');
  if (!fsEl || !window.LP) return;
  // Blurred-extension surround: blurred copies of this piece's own
  // photographic plates (the .jpg layers), crossfaded in step with them.
  var plates = [];
  fsEl.querySelectorAll('img').forEach(function(im){
    if (/\.jpe?g($|\?)/i.test(im.getAttribute('src') || '')) plates.push(im);
  });
  if (plates.length){
    var bg = document.createElement('div');
    bg.className = 'lp-wallbg';
    var clones = plates.map(function(im){
      var c = document.createElement('img');
      c.src = im.src; c.alt = ''; c.className = 'lp-bgimg';
      c.style.opacity = getComputedStyle(im).opacity;
      bg.appendChild(c);
      return [c, im];
    });
    fsEl.insertBefore(bg, fsEl.firstChild);
    (function mirror(){
      for (var i = 0; i < clones.length; i++){
        var o = clones[i][1].style.opacity;
        if (o !== '') clones[i][0].style.opacity = o;
      }
      requestAnimationFrame(mirror);
    })();
  }
  fsEl.classList.add('lp-wallfit');
  if (LP.ignite){ try { LP.ignite(); } catch(e){} }
  if (LP.openFs){ try { LP.openFs(); } catch(e){} }
  document.addEventListener('keydown', function(e){ e.stopImmediatePropagation(); }, true);
  fsEl.addEventListener('click', function(e){ e.stopImmediatePropagation(); }, true);
})();
</script>
</body>
</html>
