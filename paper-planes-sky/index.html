<!doctype html>
<html lang="en">
<head>

  <style>
    :root{
      color-scheme:light dark;
      --ink:#17344a;--panel:#fffdf1f2;--line:#17344a24;--shadow:#082b4250;
      --pink:#ff6577;--yellow:#ffd94a;--teal:#25beb8;--blue:#218acb;--white:#fffef3;

    @media(prefers-color-scheme:dark){:root{--ink:#effaff;--panel:#102b3af2;--line:#ffffff2c;--shadow:#00000070}}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#3dbce7}
    body{font-family:"Nunito",sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
    .clock-wrap{position:fixed;z-index:5;top:max(15px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);min-width:235px;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(16,54,77,.22),0 8px 26px rgba(4,26,48,.35);pointer-events:auto;touch-action:none}

    #clock{font:700 clamp(48px,8vw,100px)/.93 "Bodoni Moda",serif;font-variant-numeric:tabular-nums;letter-spacing:-.06em;cursor:pointer}
    .clock-wrap.clock-small #clock{font-size:clamp(38px,6vw,68px)}.clock-wrap.clock-large #clock{font-size:clamp(62px,10vw,126px)}

    .clock-control svg,.timelapse-control svg,.sound-control svg,.refresh-control svg{width:15px;height:15px}.timelapse-control .pause-icon,.sound-control .sound-on-icon{display:none}.timelapse-control.playing{background:var(--pink)}.timelapse-control.playing .play-icon{display:none}.timelapse-control.playing .pause-icon{display:block}.sound-control.enabled{background:var(--teal)}.sound-control.enabled .sound-off-icon{display:none}.sound-control.enabled .sound-on-icon{display:block}

    .panel-close{position:absolute;top:12px;right:12px;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:rgba(45,129,157,.1);color:var(--ink);font:900 18px/1 "Nunito",sans-serif;cursor:pointer}
    .hint{position:fixed;z-index:5;left:50%;bottom:max(25px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 150px);padding:9px 15px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(9,49,70,.36);backdrop-filter:blur(10px);color:#fff;box-shadow:0 8px 24px rgba(4,28,45,.18);font-size:12px;font-weight:900;text-align:center;white-space:nowrap;pointer-events:none;transition:opacity .8s ease}

    .future-ready{position:fixed;z-index:6;top:max(16px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));padding:5px 9px 4px;border:2px solid #17344a;border-radius:7px;background:#fffdf0;color:#17344a;box-shadow:0 3px 0 rgba(23,52,74,.26),0 8px 18px rgba(8,43,66,.15);font:700 10px/1 "Fredoka",sans-serif;letter-spacing:.09em;text-transform:uppercase;transform:rotate(-2deg);pointer-events:auto;cursor:pointer;text-decoration:none}
    .world-nav{position:fixed;z-index:9;left:max(14px,env(safe-area-inset-left));bottom:calc(max(15px,env(safe-area-inset-bottom)) + 94px);display:flex;flex-direction:column;align-items:flex-start;gap:7px}.world-link{min-height:34px;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 7px;border:2px solid rgba(23,52,74,.72);border-radius:12px;background:rgba(255,253,240,.9);color:#17344a;box-shadow:0 3px 0 rgba(23,52,74,.22),0 8px 18px rgba(8,43,66,.14);backdrop-filter:blur(8px);font:700 11px/1 "Fredoka",sans-serif;text-decoration:none;transition:transform .16s ease,filter .16s ease}.world-link:first-child{transform:rotate(-1.5deg)}.world-link:last-child{transform:rotate(1deg)}.world-link:hover{filter:saturate(1.16) brightness(1.03);transform:translateY(-2px)}.world-link svg{width:23px;height:20px;flex:none;overflow:visible}
    .scene-btn{position:fixed;z-index:12;right:max(14px,env(safe-area-inset-right));bottom:max(15px,env(safe-area-inset-bottom));width:52px;height:52px;display:grid;place-items:center;border:3px solid #fff;border-radius:50%;background:var(--yellow);color:#17344a;box-shadow:0 5px 0 rgba(23,52,74,.27),0 13px 26px var(--shadow);cursor:pointer;transition:transform .18s ease,filter .18s ease}
    .scene-btn:hover{transform:translateY(-2px);filter:saturate(1.18)}.scene-btn:active{transform:translateY(2px)}.scene-btn svg{width:25px;height:25px}
    .panel{position:fixed;z-index:11;right:max(14px,env(safe-area-inset-right));bottom:calc(max(15px,env(safe-area-inset-bottom)) + 66px);width:min(385px,calc(100vw - 28px));padding:20px;border:2px solid var(--line);border-radius:26px 26px 10px 26px;background:var(--panel);box-shadow:0 20px 60px var(--shadow);backdrop-filter:blur(19px);opacity:0;transform:translateY(12px) scale(.96);transform-origin:bottom right;pointer-events:none;transition:opacity .2s ease,transform .2s cubic-bezier(.2,.85,.3,1.12)}
    .panel.open{opacity:1;transform:none;pointer-events:auto}.panel h2{margin:0 0 4px;padding-right:34px;font:700 25px/1 "Fredoka",sans-serif}.panel .sub{margin:0 0 17px;font-size:13px;line-height:1.42;opacity:.76}.time-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;font-weight:900}.time-row output{color:#ed5367;font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:28px;margin:0;accent-color:var(--pink);cursor:grab}.sunline{display:flex;justify-content:space-between;align-items:center;padding:0 2px 3px;color:var(--ink)}.sunline svg{width:19px;height:19px}.control-label{margin:12px 0 7px;font-size:12px;font-weight:900}.plane-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.plane-choice{min-height:61px;padding:6px 5px 7px;border:2px solid var(--line);border-radius:15px;background:rgba(57,145,172,.11);color:var(--ink);font:900 11px/1.1 "Nunito",sans-serif;cursor:pointer}.plane-choice svg{display:block;width:35px;height:24px;margin:0 auto 3px;overflow:visible;filter:drop-shadow(0 2px 0 rgba(20,46,58,.2))}.plane-choice.active{background:#ffe583;color:#193447;border-color:#ffb92e;box-shadow:inset 0 0 0 2px #fff}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.control-btn,.fold-link{min-height:43px;border:0;border-radius:14px;font:900 13px/1 "Nunito",sans-serif;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;cursor:pointer}.control-btn{background:var(--blue);color:#fff}.control-btn.active{background:var(--pink)}.control-btn.secondary{border:1px solid var(--line);background:rgba(45,129,157,.1);color:var(--ink)}.fold-link{margin-top:9px;background:var(--teal);color:#fff;box-shadow:0 4px 0 rgba(18,92,91,.2)}
    .gust-label{position:fixed;z-index:8;left:0;top:0;padding:7px 11px;border:2px solid rgba(255,255,255,.8);border-radius:999px;background:#fff7b9;color:#17344a;font:700 13px/1 "Fredoka",sans-serif;box-shadow:0 5px 18px rgba(8,38,59,.22);opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.7)}.gust-label.show{animation:gustPop .85s ease both}@keyframes gustPop{15%{opacity:1;transform:translate(-50%,-70%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-125%) scale(.9)}}
    @media(max-width:600px){.future-ready{top:max(12px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));font-size:9px;padding:4px 7px}.world-nav{left:max(10px,env(safe-area-inset-left));bottom:calc(max(15px,env(safe-area-inset-bottom)) + 83px);gap:5px}.world-link{min-height:31px;padding:4px 8px 4px 6px;font-size:10px}.world-link svg{width:21px;height:18px}.clock-wrap{top:max(12px,env(safe-area-inset-top))}#clock{font-size:53px}.clock-wrap.clock-small #clock{font-size:42px}.clock-wrap.clock-large #clock{font-size:68px}#date{font-size:11px;margin-top:5px}#modeTag{margin-top:5px;padding:4px 8px}.clock-actions{gap:6px;margin-top:7px}.clock-control,.timelapse-control,.sound-control,.refresh-control{width:25px;height:25px}.clock-menu{top:calc(100% + 7px);right:3px}.hint{bottom:calc(max(15px,env(safe-area-inset-bottom)) + 5px);max-width:calc(100vw - 90px);font-size:10px;white-space:normal;padding:7px 10px}.panel{padding:17px}.panel h2{font-size:22px}.panel .sub{margin-bottom:12px}.plane-choice{min-height:56px}}
    @media(prefers-reduced-motion:reduce){.panel,.scene-btn,.hint{transition-duration:.01ms}.gust-label.show{animation-duration:.01ms}}
  </style>
</head>
<body>
  <canvas id="sky" role="button" tabindex="0" aria-label="Living sky: launch a paper plane, fold an origami bird, or tap the meadow to grow an origami flower"></canvas>
  <div class="clock-wrap clock-medium" id="clockWrap" aria-live="off">
    <div id="clock">12:00</div>
    <div id="date"></div>
    <div id="modeTag"><span class="mode-dot"></span><span data-i18n="live">Following the sun</span></div>
    <div class="clock-actions">
      <button class="sound-control" id="soundControl" type="button" aria-label="Turn breeze sound on" aria-pressed="false">
        <svg class="sound-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="m17 9 4 6m0-6-4 6"/></svg>
        <svg class="sound-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15 9.5a4 4 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg>
      </button>
      <button class="timelapse-control" id="timelapseControl" type="button" aria-label="Start timelapse" aria-pressed="false">
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
      </button>
      <button class="clock-control" id="clockControl" type="button" aria-label="Clock settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
      </button>
      <button class="refresh-control" id="refreshControl" type="button" aria-label="Refresh sky" title="Refresh sky">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0 .2 4"/></svg>
      </button>
    </div>
    <div class="clock-menu" id="clockMenu" aria-hidden="true">
      <button class="clock-lock" id="clockLock" type="button" data-i18n="unlockClock">Unlock position</button>
      <span class="clock-size-label" data-i18n="clockSize">Clock size</span>
      <div class="clock-sizes" role="group" aria-label="Clock size">
        <button class="clock-size" type="button" data-size="small" data-i18n="small">Small</button>
        <button class="clock-size active" type="button" data-size="medium" data-i18n="medium">Medium</button>
        <button class="clock-size" type="button" data-size="large" data-i18n="large">Large</button>
      </div>
    </div>
  </div>
  <a class="future-ready" href="https://ready-future-hub-life.lovable.app/" target="_blank" rel="noopener noreferrer" aria-label="Open the Future Ready hub in a new tab">Future Ready</a>
  <div class="hint" id="hint" data-i18n="hint">Tap sky to launch · Tap grass for a flower · Swipe for a breeze</div>
  <nav class="world-nav" aria-label="Visit the other paper worlds">
    <a class="world-link" href="https://muse.ai/s/paper-boats-river-xyc6xal3nxgxjxoxg" target="_blank" rel="noopener noreferrer" aria-label="Visit Paper Boats River">
      <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M3 10 16 3l13 7-6 10H9Z" fill="#fffdf0" stroke="#17344a" stroke-width="2" stroke-linejoin="round"/><path d="m3 10 13 3 13-3M16 3v10" fill="none" stroke="#218acb" stroke-width="2" stroke-linejoin="round"/></svg><span data-i18n="river">River</span>
    </a>
    <a class="world-link" href="https://muse.ai/s/paper-garden-xef6xalxaxi3txpxi" target="_blank" rel="noopener noreferrer" aria-label="Visit Paper Garden">
      <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M16 22V11" stroke="#23815a" stroke-width="2.4" stroke-linecap="round"/><path d="M16 9C7 5 8 0 16 5c8-5 9 0 0 4Z" fill="#ff6577" stroke="#17344a" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 12c-5 0-7 3-7 5 4 0 6-1 7-3m0 1c5-1 7 1 8 3-4 1-7 0-8-2" fill="#58be68" stroke="#17344a" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="garden">Garden</span>
    </a>
  </nav>
  <div class="gust-label" id="gustLabel">Whoosh!</div>

  <aside class="panel" id="panel" aria-hidden="true">
    <button class="panel-close" id="panelClose" type="button" aria-label="Close sky controls">×</button>
    <h2 data-i18n="shape">Shape the sky</h2>
    <p class="sub" data-i18n="sub">Follow real time, or gently move the sun yourself.</p>
    <div class="time-row"><span data-i18n="timeofday">Time of day</span><output id="sliderTime">12:00 PM</output></div>
    <input id="timeSlider" type="range" min="0" max="1439" value="720" aria-label="Time of day" />
    <div class="sunline" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M17 17A8 8 0 0 1 8 6a8 8 0 1 0 9 11Z" fill="#6f70d4"/></svg>
      <svg viewBox="0 0 24 24"><path d="M4 17h16M6 13h12M12 3v5M5 8l3 3m11-3-3 3" fill="none" stroke="#ff7c73" stroke-width="2.5" stroke-linecap="round"/><path d="M8 16a4 4 0 0 1 8 0" fill="#ffd64f"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#ffd64f"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M20 4l-2 2M6 18l-2 2" stroke="#ff9e36" stroke-width="2" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24"><path d="M4 17h16M6 13h12M12 3v5M5 8l3 3m11-3-3 3" fill="none" stroke="#e15d67" stroke-width="2.5" stroke-linecap="round"/><path d="M8 16a4 4 0 0 1 8 0" fill="#ff9d43"/></svg>
      <svg viewBox="0 0 24 24"><path d="M17 17A8 8 0 0 1 8 6a8 8 0 1 0 9 11Z" fill="#6f70d4"/></svg>
    </div>
    <div class="time-row"><span data-i18n="planeSpeed">Plane speed</span><output id="speedValue">55%</output></div>
    <input id="speedSlider" type="range" min="45" max="140" step="5" value="55" aria-label="Plane speed" />
    <div class="control-label" data-i18n="choose">Launch a favorite</div>
    <div class="plane-choices" role="group" aria-label="Plane design">
      <button class="plane-choice active" data-plane="dart" type="button"><svg viewBox="0 0 70 40"><path d="M3 20 66 3 43 36 32 23Z" fill="#ff6577" stroke="#17344a" stroke-width="3" stroke-linejoin="round"/><path d="m3 20 29 3L66 3 25 18" fill="#fff" stroke="#17344a" stroke-width="3" stroke-linejoin="round"/></svg><span data-i18n="dart">Dart</span></button>
      <button class="plane-choice" data-plane="glider" type="button"><svg viewBox="0 0 70 40"><path d="M4 22 65 7 50 33 34 25 20 32Z" fill="#ffd64f" stroke="#17344a" stroke-width="3" stroke-linejoin="round"/><path d="m4 22 30 3L65 7 24 19" fill="#fff" stroke="#17344a" stroke-width="3" stroke-linejoin="round"/></svg><span data-i18n="glider">Glider</span></button>
      <button class="plane-choice" data-plane="stunt" type="button"><svg viewBox="0 0 70 40"><path d="M4 21 63 4 47 35 34 24 18 34Z" fill="#22bcb6" stroke="#17344a" stroke-width="3" stroke-linejoin="round"/><path d="m4 21 30 3L63 4 27 17" fill="#fff" stroke="#17344a" stroke-width="3" stroke-linejoin="round"/></svg><span data-i18n="stunt">Looper</span></button>
    </div>
    <div class="button-row">
      <button class="control-btn active" id="autoBtn" type="button"><span aria-hidden="true">●</span><span data-i18n="auto">Live time</span></button>
      <button class="control-btn secondary" id="langBtn" type="button">ES · Español</button>
    </div>
    <a class="fold-link" href="https://muse.ai/s/virtual-origami-master-xqb6xajjpcxzzg" target="_blank" rel="noopener noreferrer"><span data-i18n="fold">Visit Adriana's origami room</span><span aria-hidden="true">→</span></a>
  </aside>

  <button class="scene-btn" id="menuBtn" type="button" aria-label="Open sky controls" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.3" fill="#ffd94a"/><circle cx="15" cy="17" r="2.3" fill="#ffd94a"/></svg>
  </button>

<script>
