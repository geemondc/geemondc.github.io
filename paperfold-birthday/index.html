<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Birthday Cake — Paperfold</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse 120% 90% at 50% 40%, #2a1450 0%, #150a2e 46%, #07040f 74%, #000 100%);
    overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif;
    color:#f1e6ff;
    user-select:none; -webkit-user-select:none;
    cursor:pointer;
  }
  #fit { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #world { position:relative; width:640px; height:480px; flex:0 0 auto; transform-origin:center center; transition:transform .8s ease; }

  /* soft pool of light on the "table" under the card */
  #floorGlow {
    position:absolute; left:50%; top:56%; width:560px; height:190px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(168,85,247,.20) 0%, rgba(255,170,60,.07) 45%, transparent 70%);
    filter:blur(6px); pointer-events:none;
  }
  #scene { position:absolute; inset:0; perspective:1150px; perspective-origin:50% 42%; }
  #orbiter {
    position:absolute; inset:0; transform-style:preserve-3d;
    animation:pfBdaySway 46s ease-in-out infinite alternate;
  }
  @keyframes pfBdaySway { from { transform:rotateY(-11deg); } to { transform:rotateY(11deg); } }
  #tilt {
    position:absolute; inset:0; transform-style:preserve-3d;
    transform:rotateX(54deg) rotateZ(-9deg);
  }

  /* ---------- the card base ---------- */
  #cardBase { position:absolute; left:85px; top:90px; width:470px; height:316px; transform-style:preserve-3d; }
  /* the envelope's back panel — the mat everything sits on once open */
  #basePlate {
    position:absolute; inset:0; border-radius:10px; transform:translateZ(0px);
    background:linear-gradient(160deg, #4a2078 0%, #33145c 55%, #240e45 100%);
    box-shadow: inset 0 0 0 2px rgba(232,182,90,.30), inset 0 0 34px rgba(0,0,0,.45);
  }
  #envShadow {
    position:absolute; left:-14px; top:-8px; width:498px; height:338px;
    background:rgba(0,0,0,.55); border-radius:14px; filter:blur(16px);
    transform:translateZ(1px); transition:opacity .8s ease .8s;
  }
  #world.open #envShadow { opacity:.3; transition-delay:.3s; }
  /* warm candlelight the cake casts onto the base */
  #cakeGlow {
    position:absolute; left:33px; top:21px; width:404px; height:274px;
    transform:translateZ(9px); border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,196,86,.85) 0%, rgba(255,150,60,.34) 52%, transparent 74%);
    filter:blur(11px); opacity:0; pointer-events:none;
  }

  /* ---------- the card that stands (pop-up backdrop) ---------- */
  #cardStand {
    position:absolute; left:45px; top:30px; width:380px; height:0;
    transform:translateZ(3px); transform-style:preserve-3d;
  }
  #cardPanel {
    position:absolute; left:0; top:0; width:380px; height:232px;
    transform-origin:50% 0%; transform:rotateX(0deg); transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.3,.8,.3,1) .55s; /* closing delay */
  }
  #world.open #cardPanel { transform:rotateX(90deg); transition-delay:.8s; }
  .cardFace { position:absolute; inset:0; border-radius:8px 8px 3px 3px; backface-visibility:hidden; overflow:hidden; }
  /* the face that lies up inside the envelope — a quiet inside cover */
  .cardIn {
    background:linear-gradient(170deg, #f6efff 0%, #e6dbf7 58%, #d3c2ee 100%);
    box-shadow: inset 0 0 0 2px rgba(176,138,62,.45), inset 0 0 30px rgba(120,80,180,.22);
  }
  /* the face that greets you once the card stands — party-night backdrop */
  .cardBack {
    transform:rotateX(180deg);
    background:linear-gradient(178deg, #3b1470 0%, #2a0e56 46%, #1c0840 78%, #120430 100%);
    box-shadow: inset 0 0 0 2px rgba(232,182,90,.65), inset 0 0 0 7px rgba(10,4,26,.55), inset 0 0 52px rgba(0,0,0,.5);
  }
  .cardBack svg { position:absolute; inset:0; width:100%; height:100%; }

  /* ---------- the envelope front (sealed card, closed state) ---------- */
  #envGroup {
    position:absolute; inset:0; transform-style:preserve-3d;
    transform:translateZ(30px);
    transition:transform 1.05s cubic-bezier(.3,.8,.3,1) .95s; /* closing delay */
  }
  #world.open #envGroup { transform:translateY(118px) translateZ(6px) scale(.93); transition-delay:.5s; }
  .envFront {
    position:absolute; inset:0; border-radius:10px;
    background:linear-gradient(155deg, #6d28a8 0%, #4c1d95 52%, #341266 100%);
    box-shadow:0 16px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .envFront::before { /* gilt inner edge */
    content:""; position:absolute; inset:4.5%;
    border:1.5px solid rgba(232,182,90,.55); border-radius:6px; pointer-events:none;
  }
  .envFront::after { /* side fold lines */
    content:""; position:absolute; inset:0; border-radius:10px;
    background:
      linear-gradient(24deg, transparent 49.6%, rgba(0,0,0,.13) 50%, transparent 50.6%),
      linear-gradient(-24deg, transparent 49.6%, rgba(0,0,0,.13) 50%, transparent 50.6%);
    pointer-events:none;
  }
  .envFlap {
    position:absolute; left:0; top:-1px; width:100%; height:54%;
    transform-origin:50% 0%; transform:rotateX(0deg); transform-style:preserve-3d;
    transition:transform 1.35s cubic-bezier(.3,.75,.25,1) 1.6s; /* closing delay */
  }
  #world.open .envFlap { transform:rotateX(180deg); transition-delay:.12s; }
  .envFlapFront { position:absolute; inset:0; backface-visibility:hidden; }
  .envFlapFront svg { width:100%; height:100%; display:block; }
  .envFlapBack {
    position:absolute; inset:0; backface-visibility:hidden; transform:rotateX(180deg);
  }
  .envFlapBack svg { width:100%; height:100%; display:block; }
  /* light sweeping across the flap as it turns (synced to the 1.35s swing) */
  #world.open .envFlapFront { animation:pfBdayFlapGlowFront 1.35s ease .12s both; }
  #world.open .envFlapBack { animation:pfBdayFlapGlowBack 1.35s ease .12s both; }
  @keyframes pfBdayFlapGlowFront {
    0% { filter:brightness(1); } 40% { filter:brightness(1.27); }
    70% { filter:brightness(1.1); } 100% { filter:brightness(1); }
  }
  @keyframes pfBdayFlapGlowBack {
    0% { filter:brightness(.8); } 50% { filter:brightness(.86); }
    78% { filter:brightness(1.13); } 100% { filter:brightness(1); }
  }
  /* soft shadow the opened flap casts on the table behind the base */
  #flapShadow {
    position:absolute; left:-6px; top:-59px; width:482px; height:183px;
    transform:translateZ(1px); filter:blur(9px); pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.26) 55%, transparent 75%);
    opacity:0; transition:opacity .6s ease .8s; /* gone before the flap returns on close */
  }
  #world.open #flapShadow { opacity:.5; transition-delay:1.15s; }
  .seal {
    position:absolute; left:50%; top:98.8%; width:62px; height:62px;
    transform:translate(-50%,-50%) translateZ(3px);
    border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #ffeda6 0%, #eec25e 46%, #c08f2e 82%, #a87a24 100%);
    box-shadow:0 3px 7px rgba(40,26,2,.5), inset 0 1px 2px rgba(255,255,255,.7), inset 0 -2px 4px rgba(120,72,10,.5);
    display:flex; align-items:center; justify-content:center;
    color:#8a5a10; font-size:29px; line-height:1;
    transition:opacity .3s ease 2.1s, transform .3s ease 2.1s; /* returns last on close */
  }
  #world.open .seal { opacity:0; transform:translate(-50%,-50%) translateZ(3px) scale(.4); transition-delay:0s, 0s; }
  .seal::after { content:""; position:absolute; inset:11%; border:1.5px solid rgba(122,78,12,.5); border-radius:50%; }

  /* ---------- the cake (rises out of the base, tier by tier) ---------- */
  #cakeWrap { position:absolute; left:45px; top:32px; width:380px; height:252px; transform-style:preserve-3d; }
  /* the plate the cake stands on */
  #plate {
    position:absolute; left:40px; top:53px; width:300px; height:190px; border-radius:50%;
    transform:translateZ(5px);
    background:radial-gradient(ellipse at 50% 42%, #fdf6e0 0%, #f3dfae 55%, #dfc084 82%, #c9a45c 100%);
    box-shadow: inset 0 0 0 3px rgba(176,138,62,.55), inset 0 -10px 22px rgba(150,110,40,.35), 0 4px 14px rgba(0,0,0,.35);
  }
  /* one tier: footprint group sits at the tier's bottom plane; its walls
     grow upward (height set by JS) and its top rides on them (translateZ
     set by JS) — the same grammar as the Sea Card's tank walls */
  .tier { position:absolute; transform-style:preserve-3d; }
  .tierBase { position:absolute; inset:0; transform-style:preserve-3d; }
  .wallWrap { position:absolute; transform-style:preserve-3d; }
  .twall {
    position:absolute; left:0; top:0; transform-origin:top center; transform:rotateX(90deg);
    overflow:hidden;
  }
  .twall::before { /* frosting drips along the top edge of the side */
    content:""; position:absolute; left:0; right:0; top:0; height:13px;
    background-image:radial-gradient(circle at 50% 0, #fff7ea 8.5px, rgba(255,247,234,0) 9.5px);
    background-size:21px 13px; background-repeat:repeat-x;
  }
  .twall::after { /* the frosting band the drips hang from */
    content:""; position:absolute; left:0; right:0; top:0; height:6px; background:#fff7ea;
  }
  .tierTop {
    position:absolute; inset:0; border-radius:16px; overflow:hidden;
    box-shadow: inset 0 0 0 3px rgba(255,247,234,.85), inset 0 0 22px rgba(255,255,255,.35);
  }
  .tierTop::after { /* sprinkles */
    content:""; position:absolute; inset:5px; border-radius:12px; opacity:.85;
    background-image:
      radial-gradient(circle 2.1px at 12px 10px, #ff5da2 98%, rgba(255,93,162,0)),
      radial-gradient(circle 2.1px at 34px 22px, #4dd8ff 98%, rgba(77,216,255,0)),
      radial-gradient(circle 2.1px at 22px 34px, #ffd166 98%, rgba(255,209,102,0)),
      radial-gradient(circle 2.1px at 45px 8px, #7c4dff 98%, rgba(124,77,255,0));
    background-size:52px 42px;
  }
  #tier1 .twall { background:linear-gradient(180deg, #ffabc6 0%, #ff8fb3 55%, #f2739c 100%); }
  #tier1 .tierTop { background:radial-gradient(ellipse at 50% 40%, #ffd9e7 0%, #ffc2d6 62%, #ffabc6 100%); }
  #tier2 .twall { background:linear-gradient(180deg, #a5ecd9 0%, #8fe3cf 55%, #6fd3ba 100%); }
  #tier2 .tierTop { background:radial-gradient(ellipse at 50% 40%, #d8f7ec 0%, #b8f1e4 62%, #a5ecd9 100%); }
  #tier3 .twall { background:linear-gradient(180deg, #ffdf8e 0%, #ffd166 55%, #f2b950 100%); }
  #tier3 .tierTop { background:radial-gradient(ellipse at 50% 40%, #ffefc2 0%, #ffe29a 62%, #ffdf8e 100%); }

  /* candles: point anchors on the top tier's lid; each standee is a flat
     paper strip stood up from its bottom edge (rotateX(-90)) and grown
     from the lid by JS (scale rides the rise) */
  #candleBox { position:absolute; left:128px; top:105px; width:124px; height:86px; transform-style:preserve-3d; }
  .candle { position:absolute; width:0; height:0; transform-style:preserve-3d; }
  .candleStand {
    position:absolute; left:-6px; top:-30px; width:12px; height:30px;
    transform-origin:50% 100%; transform:rotateX(-90deg) scale(0);
  }
  .candleBody {
    position:absolute; inset:0; border-radius:3px 3px 2px 2px;
    box-shadow: inset -3px 0 4px rgba(0,0,0,.18), inset 2px 0 3px rgba(255,255,255,.5);
  }
  .candleBody::after { /* wick */
    content:""; position:absolute; left:50%; top:-4px; width:2px; height:5px; margin-left:-1px;
    background:#4a3220; border-radius:1px;
  }
  .flame {
    position:absolute; left:50%; top:-21px; width:16px; height:21px; margin-left:-8px;
    opacity:0; transform:scale(.3); transform-origin:50% 100%;
    transition:opacity .35s ease, transform .35s ease;
  }
  .flame::before { /* halo */
    content:""; position:absolute; left:50%; top:50%; width:44px; height:44px;
    transform:translate(-50%,-54%); border-radius:50%;
    background:radial-gradient(circle, rgba(255,205,90,.75) 0%, rgba(255,160,50,.28) 45%, rgba(255,160,50,0) 70%);
    filter:blur(2px);
  }
  .flame svg { position:relative; width:100%; height:100%; display:block; }
  .flame.lit { opacity:1; transform:scale(1); }
  .flame.lit svg { animation:pfBdayFlick .45s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 92%; }
  @keyframes pfBdayFlick { from { transform:scale(1,1) rotate(-2.4deg); } to { transform:scale(1.07,1.13) rotate(2.4deg); } }

  /* balloons: standees at the sides of the cake, bobbing once open */
  .balloon { position:absolute; width:0; height:0; transform-style:preserve-3d; opacity:0; transition:opacity .5s ease 0s; }
  #world.open .balloon { opacity:1; transition:opacity .7s ease 1.55s; }
  .balloonBob { position:absolute; left:0; top:0; transform-style:preserve-3d; animation:pfBdayBob 3.6s ease-in-out infinite alternate; }
  .balloon.b2 .balloonBob { animation-duration:4.3s; animation-delay:-1.4s; }
  .balloonStand {
    position:absolute; left:-32px; top:-118px; width:64px; height:118px;
    transform-origin:50% 100%; transform:rotateX(-90deg);
    animation:pfBdayBalloonSway 4.4s ease-in-out infinite alternate;
  }
  .balloon.b2 .balloonStand { animation-duration:5.1s; animation-delay:-2s; }
  @keyframes pfBdayBob { from { transform:translateZ(6px); } to { transform:translateZ(17px); } }
  @keyframes pfBdayBalloonSway { from { transform:rotateX(-90deg) rotateZ(-2.2deg); } to { transform:rotateX(-90deg) rotateZ(2.2deg); } }

  /* confetti: little paper dots drifting over the cake once open */
  .confetti {
    position:absolute; width:8px; height:8px; border-radius:2px; opacity:0; pointer-events:none;
  }
  #world.open .confetti { animation:pfBdayConfetti 5.2s ease-in-out infinite; animation-delay:calc(2.2s + var(--d, 0s)); }
  @keyframes pfBdayConfetti {
    0% { opacity:0; transform:translate3d(0,0,var(--z,120px)) rotate(0deg); }
    12% { opacity:.95; }
    50% { transform:translate3d(var(--dx,8px), var(--dy,12px), var(--z,120px)) rotate(160deg); }
    88% { opacity:.9; }
    100% { opacity:0; transform:translate3d(0,0,var(--z,120px)) rotate(330deg); }
  }

  /* ---------- words & furniture ---------- */
  #pill {
    position:absolute; left:50%; top:368px; transform:translateX(-50%);
    padding:7px 18px 8px; border-radius:999px; white-space:nowrap;
    background:rgba(30,12,54,.72); border:1px solid rgba(216,180,254,.55);
    color:#f1e6ff; font-family:Verdana, sans-serif; font-size:12.5px; letter-spacing:.12em;
    box-shadow:0 4px 18px rgba(0,0,0,.5); pointer-events:none;
    transition:opacity .8s ease; animation:pfBdayPill 2.6s ease-in-out infinite;
  }
  @keyframes pfBdayPill { 0%,100% { transform:translateX(-50%) translateY(0); } 50% { transform:translateX(-50%) translateY(-4px); } }

  /* the line on the sealed cover, under the seal — gone once open */
  #coverLine {
    position:absolute; left:26px; right:26px; top:226px;
    text-align:center; pointer-events:none;
    font-size:19px; font-style:italic; letter-spacing:.1em; color:#ffeec2;
    text-shadow:0 0 9px rgba(255,214,130,.4), 0 1px 3px rgba(16,4,36,.9);
    opacity:1; transition:opacity .35s ease 1.9s; /* drifts back late on close */
  }
  #world.open #coverLine { opacity:0; transition:opacity .3s ease 0s; }

  /* ---------- the writing on the envelope base ----------
     The words live on the violet envelope front itself, in the free area
     below the cake (same geometry as the Sea Card), inside the gilt trim.
     No separate panel. They fade in as the cake settles and are gone
     quickly on close, before the front returns. One clean block —
     swap these words to personalize the card. */
  #baseWords {
    position:absolute; left:26px; right:26px; top:192px;
    text-align:center; pointer-events:none;
    font-family:Georgia, 'Times New Roman', serif; color:#ffeec2;
    text-shadow:0 0 10px rgba(255,214,130,.35), 0 1px 3px rgba(16,4,36,.85);
    opacity:0; transition:opacity .3s ease 0s;
  }
  #world.open #baseWords { opacity:1; transition:opacity .9s ease 1.9s; }
  #baseWords p { margin:0; }
  .bw-greet { font-size:27px; line-height:1.35; letter-spacing:.02em; }
  .bw-sign { font-size:32px; line-height:1.3; font-style:italic; margin-top:10px; color:#ffe9b8; }

  /* QA: freeze every transition so hash states render instantly */
  .qa * { transition:none !important; }
  /* QA mid-open: flap half-swung, card half-standing, envelope half-slid */
  .qa-mid .envFlap { transform:rotateX(82deg) !important; }
  .qa-mid #cardPanel { transform:rotateX(44deg) !important; }
  .qa-mid #envGroup { transform:translateY(59px) translateZ(18px) scale(.965) !important; }
  .qa-mid .seal { opacity:0 !important; }

  @media (prefers-reduced-motion: reduce) {
    #orbiter { animation:none; }
    .flame.lit svg, .balloonBob, .balloonStand { animation:none; }
    #world.open .envFlapFront, #world.open .envFlapBack { animation:none; }
    #world { transition:none; }
  }
</style>
</head>
<body>
<div id="fit">
  <div id="world">
    <div id="floorGlow"></div>
    <div id="scene">
      <div id="orbiter">
        <div id="tilt">
          <div id="cardBase">
            <div id="basePlate"></div>
            <div id="envShadow"></div>

            <!-- the card inside: lies flat in the envelope, stands when open -->
            <div id="cardStand">
              <div id="cardPanel">
                <div class="cardFace cardIn"></div>
                <div class="cardFace cardBack">
                  <svg viewBox="0 0 380 248" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <radialGradient id="pfBdayBackGlow" cx=".5" cy=".62" r=".55">
                        <stop offset="0" stop-color="#ffb35c" stop-opacity=".20"/>
                        <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
                      </radialGradient>
                    </defs>
                    <rect x="0" y="0" width="380" height="248" fill="url(#pfBdayBackGlow)"/>
                    <!-- bunting: two swags of paper flags -->
                    <g stroke-linecap="round">
                      <path d="M6 22 Q97 56 190 26 Q283 56 374 20" fill="none" stroke="#e8b65a" stroke-width="2.2" opacity=".85"/>
                      <path d="M40 62 Q190 92 340 58" fill="none" stroke="#e8b65a" stroke-width="1.6" opacity=".5"/>
                    </g>
                    <g>
                      <polygon points="34,30 52,36 40,50" fill="#ff5da2"/>
                      <polygon points="76,40 94,43 84,58" fill="#ffd166"/>
                      <polygon points="118,42 136,42 128,58" fill="#4dd8ff"/>
                      <polygon points="160,36 178,34 172,50" fill="#b388ff"/>
                      <polygon points="204,34 222,36 214,52" fill="#2ee6a8"/>
                      <polygon points="248,40 266,43 256,58" fill="#ff8fb3"/>
                      <polygon points="290,42 308,41 300,57" fill="#ffd166"/>
                      <polygon points="330,34 348,29 344,46" fill="#4dd8ff"/>
                      <polygon points="96,72 112,76 103,88" fill="#ff8fb3" opacity=".75"/>
                      <polygon points="182,80 198,81 190,94" fill="#4dd8ff" opacity=".75"/>
                      <polygon points="266,74 282,72 276,86" fill="#ffd166" opacity=".75"/>
                    </g>
                    <!-- faint balloons at the edges -->
                    <g opacity=".4">
                      <ellipse cx="34" cy="128" rx="17" ry="21" fill="#8a63d2"/>
                      <path d="M34 149 l-3 5 h6 z" fill="#8a63d2"/>
                      <path d="M34 154 q5 14 -2 26 q-5 10 1 20" fill="none" stroke="#cdbcf2" stroke-width="1.6"/>
                      <ellipse cx="348" cy="118" rx="15" ry="19" fill="#5d7fd2"/>
                      <path d="M348 137 l-3 5 h6 z" fill="#5d7fd2"/>
                      <path d="M348 142 q-5 14 2 26 q5 10 -1 20" fill="none" stroke="#bccdf2" stroke-width="1.6"/>
                    </g>
                    <g fill="#f4d98c">
                      <circle cx="66" cy="108" r="1.7" opacity=".8"/><circle cx="120" cy="140" r="1.3" opacity=".6"/>
                      <circle cx="316" cy="150" r="1.6" opacity=".75"/><circle cx="272" cy="104" r="1.2" opacity=".55"/>
                      <circle cx="88" cy="196" r="1.2" opacity=".5"/><circle cx="330" cy="206" r="1.5" opacity=".65"/>
                      <circle cx="196" cy="150" r="1.1" opacity=".5"/><circle cx="238" cy="212" r="1.2" opacity=".5"/>
                    </g>
                    <path d="M190 178 l3.6 7.2 7.9 1.1 -5.7 5.6 1.3 7.9 -7.1 -3.7 -7.1 3.7 1.3 -7.9 -5.7 -5.6 7.9 -1.1z" fill="#e8b65a" opacity=".9"/>
                  </svg>
                </div>
              </div>
            </div>

            <div id="cakeGlow"></div>

            <!-- the cake: plate, three growing tiers, candles, balloons, confetti -->
            <div id="cakeWrap">
              <div id="plate"></div>

              <div class="tier" id="tier1" style="left:70px; top:73px; width:240px; height:150px;">
                <div class="tierBase">
                  <div class="wallWrap" style="left:0; top:150px;"><div class="twall" style="width:240px;"></div></div>
                  <div class="wallWrap" style="left:0; top:150px; transform:rotate(-90deg);"><div class="twall" style="width:150px;"></div></div>
                  <div class="wallWrap" style="left:240px; top:0; transform:rotate(90deg);"><div class="twall" style="width:150px;"></div></div>
                  <div class="tierTop"></div>
                </div>
              </div>

              <div class="tier" id="tier2" style="left:100px; top:89px; width:180px; height:118px;">
                <div class="tierBase">
                  <div class="wallWrap" style="left:0; top:118px;"><div class="twall" style="width:180px;"></div></div>
                  <div class="wallWrap" style="left:0; top:118px; transform:rotate(-90deg);"><div class="twall" style="width:118px;"></div></div>
                  <div class="wallWrap" style="left:180px; top:0; transform:rotate(90deg);"><div class="twall" style="width:118px;"></div></div>
                  <div class="tierTop"></div>
                </div>
              </div>

              <div class="tier" id="tier3" style="left:128px; top:105px; width:124px; height:86px;">
                <div class="tierBase">
                  <div class="wallWrap" style="left:0; top:86px;"><div class="twall" style="width:124px;"></div></div>
                  <div class="wallWrap" style="left:0; top:86px; transform:rotate(-90deg);"><div class="twall" style="width:86px;"></div></div>
                  <div class="wallWrap" style="left:124px; top:0; transform:rotate(90deg);"><div class="twall" style="width:86px;"></div></div>
                  <div class="tierTop"></div>
                </div>
              </div>

              <!-- candles ride on the top tier's lid (JS keeps this box at the lid's height) -->
              <div id="candleBox"></div>

              <!-- balloons bobbing at both sides -->
              <div class="balloon" style="left:56px; top:128px;">
                <div class="balloonBob"><div class="balloonStand">
                  <svg viewBox="0 0 64 118" width="64" height="118" aria-hidden="true">
                    <ellipse cx="32" cy="29" rx="23" ry="28" fill="#ff5da2"/>
                    <ellipse cx="23" cy="19" rx="7" ry="11" fill="#ffffff" opacity=".38"/>
                    <path d="M32 57 l-3.5 6 h7 z" fill="#e04b8c"/>
                    <path d="M32 63 q7 16 -2 32 q-6 12 2 21" fill="none" stroke="#e8b65a" stroke-width="1.8"/>
                  </svg>
                </div></div>
              </div>
              <div class="balloon b2" style="left:326px; top:122px;">
                <div class="balloonBob"><div class="balloonStand">
                  <svg viewBox="0 0 64 118" width="64" height="118" aria-hidden="true">
                    <ellipse cx="32" cy="29" rx="23" ry="28" fill="#4dd8ff"/>
                    <ellipse cx="23" cy="19" rx="7" ry="11" fill="#ffffff" opacity=".38"/>
                    <path d="M32 57 l-3.5 6 h7 z" fill="#38a8d8"/>
                    <path d="M32 63 q-7 16 2 32 q6 12 -2 21" fill="none" stroke="#e8b65a" stroke-width="1.8"/>
                  </svg>
                </div></div>
              </div>

              <!-- confetti drifting over the cake -->
              <div class="confetti" style="left:120px; top:96px; background:#ff5da2; --z:128px; --dx:10px; --dy:16px; --d:0s;"></div>
              <div class="confetti" style="left:180px; top:80px; background:#ffd166; --z:146px; --dx:-12px; --dy:10px; --d:.7s;"></div>
              <div class="confetti" style="left:238px; top:92px; background:#4dd8ff; --z:134px; --dx:8px; --dy:18px; --d:1.3s;"></div>
              <div class="confetti" style="left:150px; top:130px; background:#2ee6a8; --z:118px; --dx:-9px; --dy:14px; --d:1.9s;"></div>
              <div class="confetti" style="left:214px; top:126px; background:#b388ff; --z:142px; --dx:12px; --dy:8px; --d:2.5s;"></div>
              <div class="confetti" style="left:262px; top:112px; background:#ff8fb3; --z:124px; --dx:-11px; --dy:15px; --d:3.1s;"></div>
              <div class="confetti" style="left:104px; top:118px; background:#ffd166; --z:138px; --dx:9px; --dy:11px; --d:3.8s;"></div>
              <div class="confetti" style="left:196px; top:104px; background:#ff5da2; --z:152px; --dx:-8px; --dy:17px; --d:4.4s;"></div>
            </div><!-- /cakeWrap -->

            <div id="flapShadow"></div>

            <!-- the sealed envelope front: covers everything while closed,
                 slides down-front to lie before the card once open -->
            <div id="envGroup">
              <div class="envFront">
                <div id="coverLine" aria-hidden="true">a cake made of paper.</div>
                <div id="baseWords" aria-hidden="true">
                  <p class="bw-greet">Hey Everyone,<br>make a wish...</p>
                  <p class="bw-sign">Gary</p>
                </div>
              </div>
              <div class="envFlap">
                <div class="envFlapBack">
                  <svg viewBox="0 0 470 171" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="pfBdayFlapBackGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#5b2596"/><stop offset="1" stop-color="#3c1470"/>
                      </linearGradient>
                    </defs>
                    <path d="M2 2 L468 2 L235 169 Z" fill="url(#pfBdayFlapBackGrad)" stroke="#e8b65a" stroke-width="2.5" stroke-linejoin="round"/>
                    <g fill="#f4d98c">
                      <circle cx="176" cy="38" r="2.2" opacity=".75"/><circle cx="212" cy="28" r="1.7" opacity=".6"/>
                      <circle cx="252" cy="34" r="2" opacity=".7"/><circle cx="288" cy="26" r="1.6" opacity=".55"/>
                      <circle cx="198" cy="56" r="1.5" opacity=".5"/><circle cx="268" cy="54" r="1.5" opacity=".5"/>
                    </g>
                    <path d="M235 96 l2.8 5.6 6.2 .9 -4.5 4.4 1.1 6.1 -5.6 -2.9 -5.6 2.9 1.1 -6.1 -4.5 -4.4 6.2 -.9z" fill="#e8b65a" opacity=".65"/>
                  </svg>
                </div>
                <div class="envFlapFront">
                  <svg viewBox="0 0 470 171" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="pfBdayFlapGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#7b34c9"/><stop offset="1" stop-color="#4c1d95"/>
                      </linearGradient>
                    </defs>
                    <path d="M2 2 L468 2 L235 169 Z" fill="url(#pfBdayFlapGrad)" stroke="#e8b65a" stroke-width="2.5" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="seal">&#9733;</div>
              </div>
            </div><!-- /envGroup -->
          </div><!-- /cardBase -->
        </div>
      </div>
    </div>
    <div id="pill">TAP TO OPEN</div>
  </div>
</div>

<script>
(function(){
  var rise = 0, target = 0, opened = false;
  var world = document.getElementById('world');
  var cakeWrap = document.getElementById('cakeWrap');
  var cakeGlow = document.getElementById('cakeGlow');
  var candleBox = document.getElementById('candleBox');
  var pill = document.getElementById('pill');

  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

  /* ---------- the tiers ----------
     Each tier's base group sits at its bottom plane (translateZ = the
     full height of every tier below). Its walls grow with the rise in a
     staggered window; its top rides on the walls. */
  var TIERS = [
    { id:'tier1', start:0.02, end:0.34, depth:36, bottom:8  },
    { id:'tier2', start:0.30, end:0.60, depth:30, bottom:44 },
    { id:'tier3', start:0.56, end:0.84, depth:26, bottom:74 }
  ];
  TIERS.forEach(function(t){
    var el = document.getElementById(t.id);
    t.base = el.querySelector('.tierBase');
    t.base.style.transform = 'translateZ(' + t.bottom + 'px)';
    t.walls = el.querySelectorAll('.twall');
    t.top = el.querySelector('.tierTop');
    t.p = 0;
  });
  var cakeTopZ = TIERS[2].bottom; /* the lid height of the top tier */

  /* ---------- candles ---------- */
  var FLAME_SVG = '<svg viewBox="0 0 16 21" aria-hidden="true"><defs>'
    + '<radialGradient id="pfBdayFlameGrad" cx=".5" cy=".72" r=".65">'
    + '<stop offset="0" stop-color="#fffbe8"/><stop offset=".38" stop-color="#ffd166"/>'
    + '<stop offset=".75" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ff7b2e"/>'
    + '</radialGradient></defs>'
    + '<path d="M8 .5 C11.5 5.5 14.5 8.8 14.5 13.2 A6.5 6.5 0 1 1 1.5 13.2 C1.5 8.8 4.5 5.5 8 .5 Z" fill="url(#pfBdayFlameGrad)"/>'
    + '<ellipse cx="8" cy="14.6" rx="2.6" ry="3.6" fill="#fff6d8" opacity=".9"/></svg>';
  var CANDLE_COLORS = ['#ff5da2', '#4dd8ff', '#ffd166', '#b388ff', '#2ee6a8'];
  var CANDLE_SPOTS = [ [21,37], [44,31], [67,29], [90,31], [113,37] ]; /* x,y on the lid, gentle arc */
  var candles = [];
  CANDLE_SPOTS.forEach(function(spot, i){
    var c = document.createElement('div');
    c.className = 'candle';
    c.style.left = spot[0] + 'px';
    c.style.top = spot[1] + 'px';
    var stand = document.createElement('div');
    stand.className = 'candleStand';
    var body = document.createElement('div');
    body.className = 'candleBody';
    body.style.background = 'repeating-linear-gradient(48deg, #fff8ee 0 3.5px, ' + CANDLE_COLORS[i] + ' 3.5px 7px)';
    var flame = document.createElement('div');
    flame.className = 'flame';
    flame.innerHTML = FLAME_SVG;
    stand.appendChild(body);
    stand.appendChild(flame);
    c.appendChild(stand);
    candleBox.appendChild(c);
    candles.push({ stand:stand, flame:flame });
  });
  var litCount = 0, lightTimer = null;
  function startLighting(){
    if (lightTimer || litCount >= candles.length) return;
    lightTimer = setInterval(function(){
      if (litCount >= candles.length){ clearInterval(lightTimer); lightTimer = null; return; }
      candles[litCount].flame.classList.add('lit');
      litCount++;
    }, 480);
  }
  function douseFlames(){
    if (lightTimer){ clearInterval(lightTimer); lightTimer = null; }
    litCount = 0;
    candles.forEach(function(c){ c.flame.classList.remove('lit'); });
  }

  function applyRise(){
    /* the cake hides inside the envelope while settled shut: it fades in
       as it rises (the Sea Card's tank trick) */
    cakeWrap.style.opacity = Math.min(1, rise / 0.12).toFixed(3);
    cakeWrap.style.visibility = rise <= 0.001 ? 'hidden' : 'visible';
    for (var i=0;i<TIERS.length;i++){
      var t = TIERS[i];
      t.p = clamp01((rise - t.start) / (t.end - t.start));
      var h = (t.p * t.depth).toFixed(2);
      for (var w=0; w<t.walls.length; w++){ t.walls[w].style.height = h + 'px'; }
      t.top.style.transform = 'translateZ(' + h + 'px)';
      t.top.style.opacity = t.p <= 0.01 ? '0' : String(Math.min(1, t.p * 3));
    }
    cakeTopZ = TIERS[2].bottom + TIERS[2].p * TIERS[2].depth;
    candleBox.style.transform = 'translateZ(' + cakeTopZ.toFixed(2) + 'px)';
    /* candles grow off the lid once the top tier is nearly home */
    for (var k=0;k<candles.length;k++){
      var cp = clamp01((rise - (0.80 + k * 0.025)) / 0.09);
      candles[k].stand.style.transform = 'rotateX(-90deg) scale(' + cp.toFixed(3) + ')';
    }
    /* candlelight on the base: a whisper while the cake rises, growing
       warmer with every flame lit */
    cakeGlow.style.opacity = (rise * 0.12 + (litCount / candles.length) * 0.55).toFixed(3);
  }

  /* ---------- main loop ---------- */
  var last = performance.now();
  function tick(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    rise += (target - rise) * Math.min(1, dt * 2.6);
    if (Math.abs(target - rise) < 0.0015) rise = target;
    applyRise();
    if (opened && rise > 0.985 && litCount < candles.length) startLighting();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- interaction ----------
     Open:  seal breaks -> flap swings -> envelope slides down-front ->
            card stands -> cake rises tier by tier (target set at 850ms),
            candles grow, then light one by one.
     Close: flames out, cake settles first -> card folds -> envelope
            returns -> flap swings shut -> seal reappears (CSS delays). */
  var choreoTimer = null;
  function toggle(){
    opened = !opened;
    world.classList.toggle('open', opened);
    fit();
    if (choreoTimer){ clearTimeout(choreoTimer); choreoTimer = null; }
    if (opened){
      pill.style.opacity = '0';
      choreoTimer = setTimeout(function(){ target = 1; }, 850);
    } else {
      douseFlames();
      target = 0;
      choreoTimer = setTimeout(function(){ pill.style.opacity = '1'; }, 1900);
    }
  }
  document.addEventListener('click', toggle);
  document.addEventListener('touchend', function(e){ e.preventDefault(); toggle(); }, { passive:false });

  /* ---------- fit to screen ----------
     Identical to the Sea Card: the open visual span (standing card's top
     to the slid-down base's bottom) is ~510 world units centered ~33
     units above the layout box, so the open fit uses the taller divisor
     and the 33-unit settle; the closed fit is the plain centered one. */
  function fit(){
    var isOpen = world.classList.contains('open');
    var s = Math.min(window.innerWidth / 660, window.innerHeight / (isOpen ? 590 : 530));
    var ty = isOpen ? 33 : 0;
    world.style.transform = 'scale(' + s.toFixed(3) + ') translateY(' + ty + 'px)';
  }
  window.addEventListener('resize', fit);
  fit();
  applyRise();

  /* QA hooks (harmless): #risen = fully open instantly, #mid = half-open */
  if (location.hash === '#risen'){
    opened = true; target = 1; rise = 1;
    world.classList.add('open'); document.body.classList.add('qa');
    pill.style.opacity = '0';
    candles.forEach(function(c){ c.flame.classList.add('lit'); });
    litCount = candles.length;
    applyRise(); fit();
  }
  if (location.hash === '#mid'){
    opened = true; target = 0.52; rise = 0.52;
    world.classList.add('open', 'qa-mid'); document.body.classList.add('qa');
    pill.style.opacity = '0'; applyRise(); fit();
  }
})();
</script>
</body>
</html>
