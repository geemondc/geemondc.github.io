<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Card That Grows a World</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(120% 90% at 50% 34%, #fdf8ec 0%, #f7ecd4 52%, #efdcb8 100%);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 12px 6px 18px; cursor: pointer; user-select: none;
  }

  /* ============ WORLD ============ */
  .world {
    position: relative;
    width: min(94vw, 600px, 108vh);
    aspect-ratio: 6 / 5;
    perspective: 950px;
  }

  /* soft shadow the whole diorama casts on the "table" */
  .ground-shadow {
    position: absolute; left: 50%; bottom: 0.5%; width: 99%; height: 15%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(84,58,18,.34) 0%, rgba(84,58,18,.14) 55%, transparent 72%);
    filter: blur(3px);
    opacity: 0; transition: opacity .8s ease .55s;
    z-index: 0;
  }
  .open .ground-shadow { opacity: 1; }

  /* ============ FAN BASE ============ */
  .base {
    position: absolute; left: 50%; bottom: 3.5%;
    width: 98%; height: 37%;
    transform: translateX(-50%) rotateX(84deg) scale(.22);
    transform-origin: 50% 92%;
    background: radial-gradient(ellipse at 50% 30%, #fffaf0 0%, #fdeed3 58%, #f3dfae 100%);
    border: 2px solid #e6cf96;
    border-radius: 50%;
    box-shadow: inset 0 -14px 28px rgba(190,150,70,.20), inset 0 10px 22px rgba(255,255,255,.65);
    opacity: 0;
    transition: transform .95s cubic-bezier(.22,.9,.3,1) .18s, opacity .5s ease .18s;
    z-index: 1;
  }
  .open .base { transform: translateX(-50%) rotateX(63deg) scale(1); opacity: 1; transition-delay: .5s, .5s; }
  /* foot shadows lying on the base plane */
  .fs { position: absolute; border-radius: 50%; filter: blur(3px);
        background: radial-gradient(ellipse at center, rgba(74,50,14,.38) 0%, rgba(74,50,14,.12) 58%, transparent 72%); }
  .fs-sky   { left: 13%; top: 0%;  width: 74%; height: 30%; }
  .fs-shore { left: 19%; top: 30%; width: 62%; height: 22%; }
  .fs-boat  { left: 36%; top: 55%; width: 30%; height: 20%; }
  .fs-palm-l{ left: 0%;  top: 52%; width: 22%; height: 34%; }
  .fs-palm-r{ right: 0%; top: 52%; width: 22%; height: 34%; }

  /* ============ GROWING PIECES (shared) ============ */
  .piece {
    position: absolute; left: 50%;
    transform: translateX(-50%) translateY(18%) scaleY(.04);
    transform-origin: 50% 100%;
    opacity: 0; visibility: hidden;
    transition: transform .8s cubic-bezier(.25,.9,.3,1.05), opacity .45s ease, visibility 0s linear .5s;
  }
  .open .piece { transform: translateX(-50%) translateY(0) scaleY(1); opacity: 1; visibility: visible; }
  .open .sky { transition-delay: .8s, .8s, .8s; }
  .open .shore { transition-delay: 1.15s, 1.15s, 1.15s; }
  .open .water-back { transition-delay: 1.35s, 1.35s, 1.35s; }
  .open .boat { transition-delay: 1.6s, 1.6s, 1.6s; }
  .open .water-front { transition-delay: 1.75s, 1.75s, 1.75s; }
  .open .palm-l { transition-delay: 1.95s, 1.95s, 1.95s; }
  .open .palm-r { transition-delay: 2.05s, 2.05s, 2.05s; }
  .open .dolphin-layer { transition-delay: 2.2s; }

  /* ============ SKY PANEL ============ */
  .sky {
    bottom: 29.5%; width: 88%; height: 63%; z-index: 2;
    background: linear-gradient(180deg, #2c4470 0%, #6d4a7d 30%, #c65f43 55%, #ef8a3c 74%, #f7b733 88%, #ffd98a 100%);
    border: 3px solid #fff7e6; border-radius: 46% 46% 8px 8px / 26% 26% 8px 8px;
    box-shadow: 0 10px 24px rgba(90,55,15,.22), inset 0 0 0 1px rgba(190,140,60,.25);
    overflow: hidden;
    
  }
  .sun {
    position: absolute; left: 55%; top: 47%; width: 15%; aspect-ratio: 1;
    transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle, #fff6cf 0%, #ffdf8e 52%, rgba(255,196,86,.55) 74%, rgba(255,196,86,0) 100%);
    box-shadow: 0 0 34px 14px rgba(255,190,90,.45);
  }
  .cloud { position: absolute; background: #f9dcc3; border-radius: 999px; opacity: .92; }
  .cloud::before, .cloud::after { content:""; position:absolute; background: inherit; border-radius: 50%; }
  .cloud.c1 { left: 10%; top: 15%; width: 24%; height: 8.5%; }
  .cloud.c1::before { left: 16%; top: -58%; width: 42%; aspect-ratio: 1; }
  .cloud.c1::after  { left: 48%; top: -34%; width: 30%; aspect-ratio: 1; }
  .cloud.c2 { right: 9%; top: 31%; width: 17%; height: 6.5%; background: #f3c6a5; }
  .cloud.c2::before { left: 20%; top: -52%; width: 40%; aspect-ratio: 1; }
  .cloud.c2::after  { left: 52%; top: -28%; width: 27%; aspect-ratio: 1; }
  .open .cloud.c1 { animation: cloudDrift 13s ease-in-out infinite alternate; }
  .open .cloud.c2 { animation: cloudDrift 17s ease-in-out infinite alternate-reverse; }
  @keyframes cloudDrift { from { transform: translateX(-4%);} to { transform: translateX(5%);} }
  .skyline { position:absolute; left:0; right:0; bottom:0; height: 13%;
    background: linear-gradient(180deg, rgba(64,38,74,.0), rgba(64,38,74,.35));
  }

  /* ============ SHORELINE ============ */
  .shore {
    bottom: 27%; width: 93%; aspect-ratio: 560 / 108; z-index: 3;
    
  }
  .shore svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 3px rgba(90,55,15,.28)); }

  /* ============ WATER ============ */
  .water { overflow: hidden; }
  .water svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .water-back {
    bottom: 11.5%; width: 95%; height: 22%; z-index: 4;
    
  }
  .water-front {
    bottom: 5%; width: 98%; height: 14%; z-index: 7;
    
  }
  .shimmer {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(100deg, transparent 28%, rgba(255,255,255,.16) 44%, rgba(255,216,140,.34) 52%, rgba(255,255,255,.10) 60%, transparent 74%);
    background-size: 230% 100%; background-position: 130% 0;
  }
  .open .shimmer { animation: shimmerMove 8s linear infinite; }
  .water-front .shimmer { animation-duration: 6.5s; }
  @keyframes shimmerMove { from { background-position: 130% 0; } to { background-position: -130% 0; } }

  /* ============ BOAT ============ */
  .boat {
    left: 60%; bottom: 16.5%; width: 24%; z-index: 5;
    
  }
  .boat svg { width: 100%; display: block; filter: drop-shadow(0 3px 3px rgba(30,50,70,.30)); }
  .boat-shadow {
    position: absolute; left: 6%; bottom: -7%; width: 88%; height: 12%;
    background: radial-gradient(ellipse at center, rgba(16,44,66,.40), transparent 68%);
    filter: blur(2px);
  }
  .open .bob { animation: bob 3.4s ease-in-out infinite; transform-origin: 50% 82%; }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-1.1deg); }
    50%     { transform: translateY(-4.5%) rotate(1.2deg); }
  }

  /* ============ DOLPHIN (between the two water layers) ============ */
  .dolphin-layer {
    position: absolute; left: 17%; bottom: 5%; width: 66%; height: 27%;
    z-index: 10; opacity: 0; transition: opacity .5s ease; pointer-events: none;
  }
  .open .dolphin-layer { opacity: 1; }
  .dolphin { position: absolute; width: 30%; left: -3%; top: 32%; opacity: 0; }
  .dolphin svg { width: 100%; display: block; filter: drop-shadow(0 2px 2px rgba(20,45,66,.35)); }
  .open .dolphin { animation: dolphinArc 3.4s linear infinite; }
  @keyframes dolphinArc {
    0%   { left: -3%;  top: 32%;  transform: rotate(32deg);  opacity: 0; }
    6%   { opacity: 1; }
    20%  { left: -8%;  top: 6%;   transform: rotate(12deg);  opacity: 1; }
    34%  { left: -13%; top: -18%; transform: rotate(-4deg);  opacity: 1; }
    46%  { left: -18%; top: -10%; transform: rotate(-36deg); opacity: 1; }
    55%  { left: -20%; top: -2%;  transform: rotate(-60deg); opacity: 1; }
    59%  { left: -21%; top: 0%;   transform: rotate(-66deg); opacity: 0; }
    100% { left: -21%; top: 0%;   transform: rotate(-66deg); opacity: 0; }
  }
  .splash {
    position: absolute; width: 15%; aspect-ratio: 2.4; border: 2px solid rgba(255,255,255,.9);
    border-radius: 50%; opacity: 0;
  }
  .splash.s1 { left: 2%; top: 46%; }
  .splash.s2 { left: -20%; top: 48%; }
  .open .splash.s1 { animation: splashA 3.4s linear infinite; }
  .open .splash.s2 { animation: splashB 3.4s linear infinite; }
  @keyframes splashA {
    0% { transform: scale(.35); opacity: 0; } 4% { opacity: .95; }
    13% { transform: scale(1.25); opacity: 0; } 100% { transform: scale(1.25); opacity: 0; }
  }
  @keyframes splashB {
    0%, 48% { transform: scale(.35); opacity: 0; } 53% { opacity: .95; }
    62% { transform: scale(1.3); opacity: 0; } 100% { transform: scale(1.3); opacity: 0; }
  }

  /* ============ FOREGROUND PALMS ============ */
  .palm { z-index: 8; }
  .palm svg { width: 100%; display: block; filter: drop-shadow(2px 4px 3px rgba(90,55,15,.30)); }
  .palm-l { left: 8.5%; bottom: 4.5%; width: 23%; }
  .palm-r { left: 91.5%; bottom: 4.5%; width: 25%; }
  .palm-r svg { transform: scaleX(-1); }
  .open .sway { animation: sway 5.5s ease-in-out infinite; transform-origin: 50% 100%; }
  .palm-r .sway { animation-duration: 6.4s; }
  @keyframes sway { 0%,100% { transform: rotate(-1.3deg);} 50% { transform: rotate(1.4deg);} }

  /* ============ ENVELOPE ============ */
  .env-shadow {
    position: absolute; left: 50%; bottom: 9%; width: 58%; height: 9%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(84,58,18,.36), transparent 68%);
    filter: blur(4px); z-index: 8; transition: opacity .5s ease;
  }
  .open .env-shadow { opacity: .25; }
  .envelope {
    position: absolute; left: 50%; bottom: 14.5%;
    width: 55%; aspect-ratio: 3 / 2; z-index: 9;
    transform: translateX(-50%) rotateY(-15deg) rotateX(6deg);
    transform-origin: 50% 100%;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.3,.8,.3,1) .3s;
  }
  .open .envelope {
    transform: translateX(-50%) translateY(40%) rotateX(-64deg) rotateY(0deg) scale(.78);
    transition-delay: .55s;
  }
  .env-inner { position: absolute; inset: 0; transform-style: preserve-3d; }
  .open .env-inner { animation: none; }
  .env-idle { animation: envIdle 5s ease-in-out infinite alternate; }
  @keyframes envIdle { from { transform: translateY(0);} to { transform: translateY(-1.6%);} }
  .env-body {
    position: absolute; inset: 0; border-radius: 7px;
    background: linear-gradient(155deg, #c02735 0%, #a31621 52%, #86111c 100%);
    box-shadow: 0 18px 34px rgba(90,30,10,.35), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .env-body::before {
    content: ""; position: absolute; inset: 4.5%;
    border: 1.5px solid rgba(232,182,90,.55); border-radius: 4px; pointer-events: none;
  }
  .env-body::after { /* side fold lines */
    content: ""; position: absolute; inset: 0; border-radius: 7px;
    background:
      linear-gradient(24deg, transparent 49.6%, rgba(0,0,0,.10) 50%, transparent 50.6%),
      linear-gradient(-24deg, transparent 49.6%, rgba(0,0,0,.10) 50%, transparent 50.6%);
    pointer-events: none;
  }
  .env-flap {
    position: absolute; left: 0; top: -1px; width: 100%; height: 54%;
    transform-origin: 50% 0%; transform: translateZ(2px) rotateX(0deg);
    transform-style: preserve-3d;
    transition: transform .75s cubic-bezier(.35,.7,.3,1) .8s;
  }
  .open .env-flap { transform: translateZ(2px) rotateX(-171deg); transition-delay: 0s; }
  .env-flap svg { width: 100%; height: 100%; display: block; }
  .seal {
    position: absolute; left: 50%; top: 88%; width: 21%; aspect-ratio: 1;
    transform: translate(-50%,-50%) translateZ(3px);
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffeda6 0%, #eec25e 46%, #c08f2e 82%, #a87a24 100%);
    box-shadow: 0 3px 7px rgba(70,40,5,.45), inset 0 1px 2px rgba(255,255,255,.7), inset 0 -2px 4px rgba(120,72,10,.5);
    display: flex; align-items: center; justify-content: center;
    color: #8a5a10; font-size: clamp(14px, 4.6vw, 27px); line-height: 1;
    transition: opacity .3s ease, transform .3s ease;
  }
  .open .seal { opacity: 0; transform: translate(-50%,-50%) translateZ(3px) scale(.45); }
  .seal::after { content:""; position:absolute; inset: 11%; border: 1.5px solid rgba(122,78,12,.5); border-radius: 50%; }


  /* ============ WORDS ============ */
  .line {
    font-style: italic; font-size: clamp(19px, 3.4vw, 26px);
    color: #6b5636; letter-spacing: .02em; text-align: center;
  }
  .hint {
    font-size: 11px; letter-spacing: .34em; text-transform: uppercase;
    color: #b1986a; text-align: center; transition: opacity .6s ease;
  }
  .open .hint { opacity: 0; }

  /* ============ CARD WRITING (the inside bottom of the card) ============ */
  .card-words {
    display: grid; grid-template-rows: 0fr;
    width: min(88vw, 430px);
    margin-top: -16px; opacity: 0;
    transition: grid-template-rows .5s ease, opacity .4s ease, margin-top .5s ease;
  }
  .open .card-words {
    grid-template-rows: 1fr; margin-top: 0; opacity: 1;
    transition: grid-template-rows .9s ease 2.45s, opacity .8s ease 2.45s, margin-top .9s ease 2.45s;
  }
  .card-words-inner { overflow: hidden; min-height: 0; }
  .card-leaf {
    background: linear-gradient(180deg, #fffaf0 0%, #fdf3dc 100%);
    border: 1px solid #e6cf96; border-radius: 6px;
    box-shadow: 0 8px 20px rgba(90,55,15,.14), inset 0 1px 0 rgba(255,255,255,.8);
    padding: 14px 22px 13px;
    color: #5d4630; text-align: left;
  }
  .cw-hey { font-style: italic; font-size: clamp(19px, 3.2vw, 23px); line-height: 1.3; }
  .cw-msg { font-style: italic; font-size: clamp(19px, 3.2vw, 23px); line-height: 1.3; margin-top: 3px; }
  .cw-sign { margin-top: 11px; font-style: italic; font-size: clamp(17px, 2.8vw, 20px); line-height: 1.25; color: #6b5636; }
  .cw-name { display: inline-block; margin-top: 1px; font-size: clamp(24px, 4.4vw, 29px); color: #54401f; letter-spacing: .01em; }

  /* short viewports: shrink the stage a touch so scene + line + writing fit one screen */
  @media (min-width: 700px) and (max-height: 900px) {
    .world { width: min(94vw, 540px, 108vh); }
  }
  @media (max-height: 760px) {
    .world { width: min(94vw, 480px, 108vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    .open .bob, .open .dolphin, .open .shimmer, .open .sway,
    .open .cloud.c1, .open .cloud.c2, .open .splash.s1, .open .splash.s2,
    .env-idle { animation: none !important; }
    .open .dolphin { opacity: 1; left: -13%; top: -18%; transform: rotate(-4deg); }
  }
</style>
</head>
<body>
<main id="stage" aria-label="A paperfold card. Tap to open or close.">
  <div class="world" id="world">
    <div class="ground-shadow"></div>

    <div class="base">
      <div class="fs fs-sky"></div>
      <div class="fs fs-shore"></div>
      <div class="fs fs-boat"></div>
      <div class="fs fs-palm-l"></div>
      <div class="fs fs-palm-r"></div>
    </div>

    <div class="piece sky">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="skyline"></div>
    </div>

    <div class="piece shore">
      <svg viewBox="0 0 560 108" aria-hidden="true">
        <path d="M0 76 Q 140 64 300 72 T 560 68 V108 H0 Z" fill="#ecd9a8"/>
        <path d="M0 76 Q 140 64 300 72 T 560 68" fill="none" stroke="#d9bd7f" stroke-width="3"/>
        <!-- house 1 -->
        <rect x="38" y="38" width="56" height="38" fill="#fdf3e0"/>
        <polygon points="30,38 66,15 102,38" fill="#c4503c"/>
        <rect x="59" y="56" width="13" height="20" fill="#8a5a3a"/>
        <rect x="45" y="46" width="11" height="11" fill="#ffca66"/>
        <rect x="78" y="46" width="11" height="11" fill="#ffca66"/>
        <!-- small palm -->
        <path d="M128 76 C 126 62 126 52 130 42" stroke="#7a5a34" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M130 42 C 120 34 110 33 103 37 M130 42 C 124 31 116 26 108 25 M130 42 C 133 30 140 24 148 22 M130 42 C 140 35 150 34 157 38" stroke="#2e7d4f" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- house 2 -->
        <rect x="168" y="30" width="46" height="46" fill="#f6e3ee"/>
        <polygon points="161,30 191,9 221,30" fill="#7a4a7e"/>
        <rect x="184" y="54" width="13" height="22" fill="#6b4258"/>
        <rect x="175" y="39" width="10" height="10" fill="#ffca66"/>
        <rect x="198" y="39" width="10" height="10" fill="#ffca66"/>
        <!-- small palm 2 -->
        <path d="M292 74 C 290 60 290 50 294 40" stroke="#7a5a34" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M294 40 C 284 32 274 31 267 35 M294 40 C 288 29 280 24 272 23 M294 40 C 297 28 304 22 312 20 M294 40 C 304 33 314 32 321 36" stroke="#2e7d4f" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- house 3 -->
        <rect x="352" y="42" width="50" height="32" fill="#fdf3e0"/>
        <polygon points="345,42 377,22 409,42" fill="#c4503c"/>
        <rect x="370" y="57" width="12" height="17" fill="#8a5a3a"/>
        <rect x="359" y="48" width="10" height="10" fill="#ffca66"/>
        <rect x="388" y="48" width="10" height="10" fill="#ffca66"/>
        <!-- house 4 -->
        <rect x="448" y="34" width="58" height="40" fill="#e8f1f8"/>
        <polygon points="441,34 477,13 513,34" fill="#3f6d8e"/>
        <rect x="470" y="54" width="13" height="20" fill="#476b84"/>
        <rect x="456" y="43" width="11" height="11" fill="#ffca66"/>
        <rect x="488" y="43" width="11" height="11" fill="#ffca66"/>
      </svg>
    </div>

    <div class="piece water water-back">
      <svg viewBox="0 0 560 120" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="wbGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4b9db4"/><stop offset=".45" stop-color="#35839e"/>
            <stop offset="1" stop-color="#256d8a"/>
          </linearGradient>
        </defs>
        <path d="M0 26 Q 35 13 70 26 T 140 26 T 210 26 T 280 26 T 350 26 T 420 26 T 490 26 T 560 26 V120 H0 Z" fill="url(#wbGrad)"/>
        <path d="M0 26 Q 35 13 70 26 T 140 26 T 210 26 T 280 26 T 350 26 T 420 26 T 490 26 T 560 26" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.5"/>
        <path d="M40 62 q 14 -7 28 0 M180 84 q 14 -7 28 0 M330 58 q 14 -7 28 0 M452 82 q 14 -7 28 0" stroke="rgba(255,255,255,.28)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M318 44 q 16 -6 32 0 M310 74 q 20 -7 40 0 M322 100 q 14 -6 28 0" stroke="rgba(255,202,102,.5)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="shimmer"></div>
    </div>

    <div class="piece boat">
      <div class="bob">
        <svg viewBox="0 0 150 94" aria-hidden="true">
          <line x1="117" y1="54" x2="117" y2="14" stroke="#a8a29a" stroke-width="3" stroke-linecap="round"/>
          <polygon points="117,14 131,22 117,24" fill="#e9b64f"/>
          <rect x="47" y="28" width="56" height="7" rx="3.5" fill="#8c1420"/>
          <rect x="52" y="35" width="46" height="20" rx="3" fill="#ffffff"/>
          <rect x="58" y="40" width="10" height="9" rx="1.5" fill="#ffca66"/>
          <rect x="72" y="40" width="10" height="9" rx="1.5" fill="#ffca66"/>
          <rect x="86" y="40" width="8" height="9" rx="1.5" fill="#ffca66"/>
          <path d="M6 56 C 34 63 116 63 144 53 L131 75 C 98 84 50 84 21 76 Z" fill="#fdf6e9"/>
          <path d="M6 56 C 34 63 116 63 144 53 L140 62 C 110 70 40 70 10 63 Z" fill="#b3202c"/>
          <path d="M18 84 q 16 6 34 2 M96 86 q 16 4 32 -2" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="boat-shadow"></div>
    </div>

    <div class="dolphin-layer">
      <div class="splash s1"></div>
      <div class="splash s2"></div>
      <div class="dolphin">
        <svg viewBox="0 0 120 62" aria-hidden="true">
          <defs>
            <linearGradient id="dGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7fa3c0"/><stop offset=".6" stop-color="#5b7d99"/>
              <stop offset="1" stop-color="#486a86"/>
            </linearGradient>
          </defs>

<script>
  var stage = document.getElementById('stage');
  var hint = document.getElementById('hint');
  function toggle() {
    stage.classList.toggle('open');
    document.body.classList.toggle('open');
    if (stage.classList.contains('open')) hint.textContent = 'tap to fold it away';
    else hint.textContent = 'tap the card';
  }
  stage.addEventListener('click', toggle);
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
  });

  /* QA hooks (invisible in normal use): ?auto=1 opens on load; ?t=SECONDS seeks
     every animation/transition to that moment and pauses, for frame checks. */
  var q = new URLSearchParams(location.search);
  if (q.has('auto')) {
    setTimeout(function () {
      if (!stage.classList.contains('open')) toggle();
      if (q.has('t')) {
        var t = parseFloat(q.get('t')) * 1000;
        setTimeout(function () {
          document.getAnimations().forEach(function (a) {
            try { a.pause(); a.currentTime = t; } catch (e) {}
          });
        }, 120);
      }
    }, 80);
  }
</script>
