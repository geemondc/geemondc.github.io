<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Graduation — Paperfold</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse 120% 90% at 50% 40%, #1b2c52 0%, #0d1834 46%, #04081a 74%, #000 100%);
    overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif;
    color:#eef2ff;
    user-select:none; -webkit-user-select:none;
    cursor:pointer;
  }
  #fit { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #world { position:relative; width:640px; height:480px; flex:0 0 auto; transform-origin:center center; transition:transform .8s ease; }

  /* soft pool of light on the "table" under the card */
  #floorGlow {
    position:absolute; left:50%; top:56%; width:560px; height:190px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(70,110,200,.18) 0%, rgba(255,196,86,.07) 45%, transparent 70%);
    filter:blur(6px); pointer-events:none;
  }
  #scene { position:absolute; inset:0; perspective:1150px; perspective-origin:50% 42%; }
  #orbiter {
    position:absolute; inset:0; transform-style:preserve-3d;
    animation:pfGradSway 46s ease-in-out infinite alternate;
  }
  @keyframes pfGradSway { from { transform:rotateY(-11deg); } to { transform:rotateY(11deg); } }
  #tilt {
    position:absolute; inset:0; transform-style:preserve-3d;
    transform:rotateX(54deg) rotateZ(-9deg);
  }

  /* ---------- the card base ---------- */
  #cardBase { position:absolute; left:85px; top:90px; width:470px; height:316px; transform-style:preserve-3d; }
  /* the envelope's back panel — the mat everything sits on once open */
  #basePlate {
    position:absolute; inset:0; border-radius:10px; transform:translateZ(0px);
    background:linear-gradient(160deg, #1d3263 0%, #12234a 55%, #0a1734 100%);
    box-shadow: inset 0 0 0 2px rgba(232,182,90,.30), inset 0 0 34px rgba(0,0,0,.45);
  }
  #envShadow {
    position:absolute; left:-14px; top:-8px; width:498px; height:338px;
    background:rgba(0,0,0,.55); border-radius:14px; filter:blur(16px);
    transform:translateZ(1px); transition:opacity .8s ease .8s;
  }
  #world.open #envShadow { opacity:.3; transition-delay:.3s; }
  /* warm ceremony light the stage casts onto the base */
  #gradGlow {
    position:absolute; left:33px; top:21px; width:404px; height:274px;
    transform:translateZ(9px); border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,214,130,.85) 0%, rgba(255,180,80,.30) 52%, transparent 74%);
    filter:blur(11px); opacity:0; pointer-events:none;
  }

  /* ---------- the card that stands (pop-up backdrop) ---------- */
  #cardStand {
    position:absolute; left:45px; top:30px; width:380px; height:0;
    transform:translateZ(3px); transform-style:preserve-3d;
  }
  #cardPanel {
    position:absolute; left:0; top:0; width:380px; height:232px;
    transform-origin:50% 0%; transform:rotateX(0deg); transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.3,.8,.3,1) .55s; /* closing delay */
  }
  #world.open #cardPanel { transform:rotateX(90deg); transition-delay:.8s; }
  .cardFace { position:absolute; inset:0; border-radius:8px 8px 3px 3px; backface-visibility:hidden; overflow:hidden; }
  /* the face that lies up inside the envelope — a quiet parchment inside cover */
  .cardIn {
    background:linear-gradient(170deg, #fdf6e3 0%, #f3e8cd 58%, #e7d7ae 100%);
    box-shadow: inset 0 0 0 2px rgba(176,138,62,.45), inset 0 0 30px rgba(120,90,30,.18);
  }
  /* the face that greets you once the card stands — evening ceremony backdrop */
  .cardBack {
    transform:rotateX(180deg);
    background:linear-gradient(178deg, #274069 0%, #1a2c50 46%, #101f3d 78%, #0a1730 100%);
    box-shadow: inset 0 0 0 2px rgba(232,182,90,.65), inset 0 0 0 7px rgba(4,8,20,.55), inset 0 0 52px rgba(0,0,0,.5);
  }
  .cardBack svg { position:absolute; inset:0; width:100%; height:100%; }
  /* string-light bulbs twinkle in the backdrop */
  .twb { animation:pfGradTwinkle 2.8s ease-in-out infinite alternate; }
  @keyframes pfGradTwinkle { from { opacity:.35; } to { opacity:1; } }

  /* ---------- the envelope front (sealed card, closed state) ---------- */
  #envGroup {
    position:absolute; inset:0; transform-style:preserve-3d;
    transform:translateZ(30px);
    transition:transform 1.05s cubic-bezier(.3,.8,.3,1) .95s; /* closing delay */
  }
  #world.open #envGroup { transform:translateY(118px) translateZ(6px) scale(.93); transition-delay:.5s; }
  .envFront {
    position:absolute; inset:0; border-radius:10px;
    background:linear-gradient(155deg, #24407a 0%, #16295a 52%, #0d1c40 100%);
    box-shadow:0 16px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .envFront::before { /* gilt inner edge */
    content:""; position:absolute; inset:4.5%;
    border:1.5px solid rgba(232,182,90,.55); border-radius:6px; pointer-events:none;
  }
  .envFront::after { /* side fold lines */
    content:""; position:absolute; inset:0; border-radius:10px;
    background:
      linear-gradient(24deg, transparent 49.6%, rgba(0,0,0,.13) 50%, transparent 50.6%),
      linear-gradient(-24deg, transparent 49.6%, rgba(0,0,0,.13) 50%, transparent 50.6%);
    pointer-events:none;
  }
  .envFlap {
    position:absolute; left:0; top:-1px; width:100%; height:54%;
    transform-origin:50% 0%; transform:rotateX(0deg); transform-style:preserve-3d;
    transition:transform 1.35s cubic-bezier(.3,.75,.25,1) 1.6s; /* closing delay */
  }
  #world.open .envFlap { transform:rotateX(180deg); transition-delay:.12s; }
  .envFlapFront { position:absolute; inset:0; backface-visibility:hidden; }
  .envFlapFront svg { width:100%; height:100%; display:block; }
  .envFlapBack {
    position:absolute; inset:0; backface-visibility:hidden; transform:rotateX(180deg);
  }
  .envFlapBack svg { width:100%; height:100%; display:block; }
  /* light sweeping across the flap as it turns (synced to the 1.35s swing) */
  #world.open .envFlapFront { animation:pfGradFlapGlowFront 1.35s ease .12s both; }
  #world.open .envFlapBack { animation:pfGradFlapGlowBack 1.35s ease .12s both; }
  @keyframes pfGradFlapGlowFront {
    0% { filter:brightness(1); } 40% { filter:brightness(1.27); }
    70% { filter:brightness(1.1); } 100% { filter:brightness(1); }
  }
  @keyframes pfGradFlapGlowBack {
    0% { filter:brightness(.8); } 50% { filter:brightness(.86); }
    78% { filter:brightness(1.13); } 100% { filter:brightness(1); }
  }
  /* soft shadow the opened flap casts on the table behind the base */
  #flapShadow {
    position:absolute; left:-6px; top:-59px; width:482px; height:183px;
    transform:translateZ(1px); filter:blur(9px); pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.26) 55%, transparent 75%);
    opacity:0; transition:opacity .6s ease .8s; /* gone before the flap returns on close */
  }
  #world.open #flapShadow { opacity:.5; transition-delay:1.15s; }
  .seal {
    position:absolute; left:50%; top:98.8%; width:62px; height:62px;
    transform:translate(-50%,-50%) translateZ(3px);
    border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #ffeda6 0%, #eec25e 46%, #c08f2e 82%, #a87a24 100%);
    box-shadow:0 3px 7px rgba(40,26,2,.5), inset 0 1px 2px rgba(255,255,255,.7), inset 0 -2px 4px rgba(120,72,10,.5);
    display:flex; align-items:center; justify-content:center;
    color:#8a5a10; font-size:29px; line-height:1;
    transition:opacity .3s ease 2.1s, transform .3s ease 2.1s; /* returns last on close */
  }
  #world.open .seal { opacity:0; transform:translate(-50%,-50%) translateZ(3px) scale(.4); transition-delay:0s, 0s; }
  .seal::after { content:""; position:absolute; inset:11%; border:1.5px solid rgba(122,78,12,.5); border-radius:50%; }

  /* ---------- the ceremony stage (rises out of the base) ---------- */
  #gradWrap { position:absolute; left:45px; top:32px; width:380px; height:252px; transform-style:preserve-3d; }
  /* the stage platform: footprint group sits at its bottom plane; its
     walls grow upward (height set by JS) and its top rides on them —
     the same grammar as the Sea Card's tank walls */
  .stage { position:absolute; transform-style:preserve-3d; }
  .stageBase { position:absolute; inset:0; transform-style:preserve-3d; }
  .wallWrap { position:absolute; transform-style:preserve-3d; }
  .gwall {
    position:absolute; left:0; top:0; transform-origin:top center; transform:rotateX(90deg);
    overflow:hidden;
    background:linear-gradient(180deg, #1c2c52 0%, #131f3e 60%, #0c1730 100%);
  }
  .gwall::before { /* gold trim along the top edge of the stage side */
    content:""; position:absolute; left:0; right:0; top:0; height:5px;
    background:linear-gradient(180deg, #e8c87a, #b98c3e);
  }
  .gwall::after { /* stone seams */
    content:""; position:absolute; inset:5px 0 0 0;
    background-image:linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:42px 100%;
  }
  .stageTop {
    position:absolute; inset:0; border-radius:8px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%, #31497a 0%, #22365e 60%, #18294a 100%);
    box-shadow: inset 0 0 0 3px rgba(232,182,90,.5), inset 0 0 26px rgba(0,0,0,.35);
  }
  /* everything that stands on the stage rides at the stage-top height
     (translateZ set by JS) */
  #stageTopBox { position:absolute; transform-style:preserve-3d; }

  /* banner poles: standees stood up from their bottom edge (rotateX(-90))
     and grown by JS; the inner sway wrapper leans them gently */
  .pole { position:absolute; width:0; height:0; transform-style:preserve-3d; }
  .poleStand {
    position:absolute; left:-27px; top:-158px; width:54px; height:158px;
    transform-origin:50% 100%; transform:rotateX(-90deg) scale(0);
  }
  .poleSway { position:absolute; inset:0; transform-style:preserve-3d; animation:pfGradBannerSway 5.2s ease-in-out infinite alternate; }
  .pole.p2 .poleSway { animation-duration:6.1s; animation-delay:-2.2s; }
  @keyframes pfGradBannerSway { from { transform:rotateZ(-1.6deg); } to { transform:rotateZ(1.6deg); } }

  /* the diploma: a standee whose sheet unfurls between two paper rolls
     (sheet width and roll positions set by JS as it opens) */
  #diploma { position:absolute; width:0; height:0; transform-style:preserve-3d; }
  .diplomaStand {
    position:absolute; left:-88px; top:-116px; width:176px; height:116px;
    transform-origin:50% 100%; transform:rotateX(-90deg) scale(0);
  }
  .dSheet {
    position:absolute; left:50%; top:6px; width:16px; height:104px;
    transform:translateX(-50%); border-radius:3px; overflow:hidden;
    background:linear-gradient(100deg, #efe3c2 0%, #fdf6e0 30%, #fffdf2 52%, #f7edd2 78%, #e9dab2 100%);
    box-shadow: inset 0 0 0 2px rgba(176,138,62,.5), inset 0 0 18px rgba(150,120,60,.18), 0 2px 6px rgba(0,0,0,.25);
  }
  .dSheet::before { /* lines of script */
    content:""; position:absolute; left:15px; right:15px; top:16px; bottom:46px;
    background-image:repeating-linear-gradient(180deg, rgba(96,74,32,.45) 0 2px, transparent 2px 11px);
  }
  .dSheet::after { /* the fancy title line */
    content:""; position:absolute; left:26px; right:26px; top:6px; height:4px; border-radius:2px;
    background:rgba(140,104,40,.65);
  }
  .dSeal {
    position:absolute; left:50%; bottom:9px; transform:translateX(-50%);
    width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #ffeda6 0%, #eec25e 46%, #c08f2e 82%, #a87a24 100%);
    box-shadow:0 2px 4px rgba(60,40,4,.4), inset 0 1px 2px rgba(255,255,255,.7), inset 0 -2px 3px rgba(120,72,10,.5);
    display:flex; align-items:center; justify-content:center;
    color:#8a5a10; font-size:15px; line-height:1;
  }
  .dSeal::before, .dSeal::after { /* ribbon tails under the seal */
    content:""; position:absolute; top:24px; width:8px; height:16px; background:#b03050; z-index:-1;
  }
  .dSeal::before { left:4px; transform:rotate(14deg); }
  .dSeal::after { right:4px; transform:rotate(-14deg); }
  .dRoll {
    position:absolute; top:1px; width:17px; height:114px; border-radius:8px;
    background:linear-gradient(90deg, #c9b586 0%, #f7efdb 38%, #fffdf4 52%, #e3d3a8 78%, #b39b62 100%);
    box-shadow: inset 0 0 0 1px rgba(150,120,60,.35), 0 2px 5px rgba(0,0,0,.3);
  }
  .dRoll::before { /* the spiral end of the roll */
    content:""; position:absolute; left:2px; right:2px; top:3px; height:9px; border-radius:50%;
    background:radial-gradient(ellipse at center, #fffdf4 0%, #e8dab4 55%, #b39b62 100%);
    box-shadow: inset 0 0 0 1.5px rgba(150,120,60,.4);
  }

  /* the graduation cap on its stand: the stand is still; the cap itself
     tosses into the air every ~12s and lands back on the stand */
  #capBox { position:absolute; width:0; height:0; transform-style:preserve-3d; }
  .capStand {
    position:absolute; left:-60px; top:-118px; width:120px; height:118px;
    transform-origin:50% 100%; transform:rotateX(-90deg) scale(0);
  }
  .capToss { position:absolute; left:0; top:0; width:120px; height:74px; }
  #world.open .capToss { animation:pfGradToss 12s linear infinite; }
  @keyframes pfGradToss {
    0%, 68% { transform:translate(0,0) rotate(0deg); }
    76% { transform:translate(6px,-70px) rotate(155deg); }
    84% { transform:translate(10px,-94px) rotate(298deg); }
    91% { transform:translate(4px,-36px) rotate(352deg); }
    96%, 100% { transform:translate(0,0) rotate(360deg); }
  }

  /* gold confetti: little paper pieces drifting down over the stage */
  .confetti {
    position:absolute; width:8px; height:8px; border-radius:2px; opacity:0; pointer-events:none;
  }
  #world.open .confetti { animation:pfGradConfetti 6.4s ease-in-out infinite; animation-delay:calc(2.4s + var(--d, 0s)); }
  @keyframes pfGradConfetti {
    0% { opacity:0; transform:translate3d(0,-14px,var(--z,120px)) rotate(0deg); }
    12% { opacity:.95; }
    50% { transform:translate3d(var(--dx,8px), var(--dy,26px), var(--z,120px)) rotate(170deg); }
    88% { opacity:.85; }
    100% { opacity:0; transform:translate3d(0,44px,var(--z,120px)) rotate(340deg); }
  }

  /* ---------- words & furniture ---------- */
  #pill {
    position:absolute; left:50%; top:368px; transform:translateX(-50%);
    padding:7px 18px 8px; border-radius:999px; white-space:nowrap;
    background:rgba(10,20,44,.75); border:1px solid rgba(232,182,90,.55);
    color:#f4ecd8; font-family:Verdana, sans-serif; font-size:12.5px; letter-spacing:.12em;
    box-shadow:0 4px 18px rgba(0,0,0,.5); pointer-events:none;
    transition:opacity .8s ease; animation:pfGradPill 2.6s ease-in-out infinite;
  }
  @keyframes pfGradPill { 0%,100% { transform:translateX(-50%) translateY(0); } 50% { transform:translateX(-50%) translateY(-4px); } }

  /* the line on the sealed cover, under the seal — gone once open */
  #coverLine {
    position:absolute; left:26px; right:26px; top:226px;
    text-align:center; pointer-events:none;
    font-size:19px; font-style:italic; letter-spacing:.1em; color:#ffeec2;
    text-shadow:0 0 9px rgba(255,214,130,.4), 0 1px 3px rgba(6,10,26,.9);
    opacity:1; transition:opacity .35s ease 1.9s; /* drifts back late on close */
  }
  #world.open #coverLine { opacity:0; transition:opacity .3s ease 0s; }

  /* ---------- the writing on the envelope base ----------
     The words live on the navy envelope front itself, in the free area
     below the stage, inside the gilt trim. No separate panel. They fade
     in as the scene settles and are gone quickly on close, before the
     front returns. One clean block — swap these words to personalize. */
  #baseWords {
    position:absolute; left:26px; right:26px; top:192px;
    text-align:center; pointer-events:none;
    font-family:Georgia, 'Times New Roman', serif; color:#ffeec2;
    text-shadow:0 0 10px rgba(255,214,130,.35), 0 1px 3px rgba(6,10,26,.85);
    opacity:0; transition:opacity .3s ease 0s;
  }
  #world.open #baseWords { opacity:1; transition:opacity .9s ease 1.9s; }
  #baseWords p { margin:0; }
  .bw-greet { font-size:27px; line-height:1.35; letter-spacing:.02em; }
  .bw-sign { font-size:32px; line-height:1.3; font-style:italic; margin-top:10px; color:#ffe9b8; }

  /* QA: freeze every transition so hash states render instantly */
  .qa * { transition:none !important; }
  /* QA mid-open: flap half-swung, card half-standing, envelope half-slid */
  .qa-mid .envFlap { transform:rotateX(82deg) !important; }
  .qa-mid #cardPanel { transform:rotateX(44deg) !important; }
  .qa-mid #envGroup { transform:translateY(59px) translateZ(18px) scale(.965) !important; }
  .qa-mid .seal { opacity:0 !important; }

  @media (prefers-reduced-motion: reduce) {
    #orbiter { animation:none; }
    .poleSway, .twb { animation:none; }
    #world.open .capToss, #world.open .confetti { animation:none; }
    #world.open .envFlapFront, #world.open .envFlapBack { animation:none; }
    #world { transition:none; }
  }
</style>
</head>
<body>
<div id="fit">
  <div id="world">
    <div id="floorGlow"></div>
    <div id="scene">
      <div id="orbiter">
        <div id="tilt">
          <div id="cardBase">
            <div id="basePlate"></div>
            <div id="envShadow"></div>

            <!-- the card inside: lies flat in the envelope, stands when open -->
            <div id="cardStand">
              <div id="cardPanel">
                <div class="cardFace cardIn"></div>
                <div class="cardFace cardBack">
                  <svg viewBox="0 0 380 248" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <radialGradient id="pfGradBackGlow" cx=".5" cy=".66" r=".55">
                        <stop offset="0" stop-color="#ffd98a" stop-opacity=".16"/>
                        <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
                      </radialGradient>
                    </defs>
                    <rect x="0" y="0" width="380" height="248" fill="url(#pfGradBackGlow)"/>
                    <!-- evening stars -->
                    <g fill="#dfe8ff">
                      <circle cx="42" cy="30" r="1.5" opacity=".7"/><circle cx="96" cy="16" r="1.1" opacity=".5"/>
                      <circle cx="150" cy="38" r="1.3" opacity=".6"/><circle cx="238" cy="14" r="1.2" opacity=".5"/>
                      <circle cx="292" cy="34" r="1.4" opacity=".65"/><circle cx="356" cy="18" r="1.1" opacity=".5"/>
                      <circle cx="66" cy="66" r="1" opacity=".4"/><circle cx="330" cy="62" r="1" opacity=".4"/>
                    </g>
                    <!-- crescent moon -->
                    <path d="M322 44 a17 17 0 1 1 -10 -22 a13.5 13.5 0 1 0 10 22z" fill="#f4ecd8" opacity=".9"/>
                    <!-- the great hall: two towers and a stone arch -->
                    <g>
                      <path d="M104 248 V138 h22 v-14 h10 v14 h108 v-14 h10 v14 h22 V248 Z" fill="#0b1526"/>
                      <path d="M104 138 h172" stroke="#3a5484" stroke-width="2"/>
                      <rect x="112" y="156" width="9" height="14" rx="4" fill="#ffca7a" opacity=".85"/>
                      <rect x="112" y="186" width="9" height="14" rx="4" fill="#ffca7a" opacity=".6"/>
                      <rect x="259" y="156" width="9" height="14" rx="4" fill="#ffca7a" opacity=".85"/>
                      <rect x="259" y="186" width="9" height="14" rx="4" fill="#ffca7a" opacity=".6"/>
                      <rect x="150" y="150" width="10" height="15" rx="5" fill="#ffca7a" opacity=".7"/>
                      <rect x="220" y="150" width="10" height="15" rx="5" fill="#ffca7a" opacity=".7"/>
                      <rect x="185" y="146" width="10" height="15" rx="5" fill="#ffca7a" opacity=".8"/>
                      <!-- the lit archway -->
                      <path d="M172 248 v-40 a18 18 0 0 1 36 0 v40 Z" fill="#ffd98a" opacity=".92"/>
                      <path d="M172 248 v-40 a18 18 0 0 1 36 0 v40" fill="none" stroke="#e8b65a" stroke-width="2.5"/>
                      <!-- columns -->
                      <rect x="140" y="176" width="6" height="72" fill="#16263f"/>
                      <rect x="234" y="176" width="6" height="72" fill="#16263f"/>
                    </g>
                    <!-- string lights: two swags with twinkling bulbs -->
                    <path d="M6 26 Q97 54 190 30 Q283 54 374 24" fill="none" stroke="#e8b65a" stroke-width="1.8" opacity=".8"/>
                    <path d="M44 66 Q190 92 336 62" fill="none" stroke="#e8b65a" stroke-width="1.3" opacity=".45"/>
                    <g fill="#ffd98a">
                      <circle class="twb" cx="52" cy="38" r="2.6"/><circle class="twb" cx="104" cy="46" r="2.6" style="animation-delay:-.9s"/>
                      <circle class="twb" cx="152" cy="40" r="2.6" style="animation-delay:-1.7s"/><circle class="twb" cx="204" cy="38" r="2.6" style="animation-delay:-.4s"/>
                      <circle class="twb" cx="256" cy="44" r="2.6" style="animation-delay:-2.2s"/><circle class="twb" cx="308" cy="38" r="2.6" style="animation-delay:-1.3s"/>
                      <circle class="twb" cx="112" cy="78" r="2" style="animation-delay:-2.6s" opacity=".8"/><circle class="twb" cx="190" cy="84" r="2" style="animation-delay:-.6s" opacity=".8"/>
                      <circle class="twb" cx="268" cy="76" r="2" style="animation-delay:-1.9s" opacity=".8"/>
                    </g>
                    <path d="M190 104 l2.8 5.6 6.2 .9 -4.5 4.4 1.1 6.1 -5.6 -2.9 -5.6 2.9 1.1 -6.1 -4.5 -4.4 6.2 -.9z" fill="#e8b65a" opacity=".85"/>
                  </svg>
                </div>
              </div>
            </div>

            <div id="gradGlow"></div>

            <!-- the ceremony: stage, banner poles, diploma, cap, confetti -->
            <div id="gradWrap">
              <div class="stage" id="stage" style="left:25px; top:88px; width:330px; height:132px;">
                <div class="stageBase">
                  <div class="wallWrap" style="left:0; top:132px;"><div class="gwall" style="width:330px;"></div></div>
                  <div class="wallWrap" style="left:0; top:132px; transform:rotate(-90deg);"><div class="gwall" style="width:132px;"></div></div>

                <!-- banner pole, right -->

                  <div class="poleStand"><div class="poleSway">
                    <svg viewBox="0 0 54 158" width="54" height="158" aria-hidden="true">
                      <ellipse cx="27" cy="154" rx="13" ry="3.5" fill="#0a1428" opacity=".55"/>
                      <rect x="25.5" y="14" width="3" height="140" fill="#d9b45f"/>
                      <circle cx="27" cy="10" r="5" fill="#e8c87a" stroke="#a87a24" stroke-width="1.2"/>
                      <rect x="5" y="16" width="44" height="3.5" rx="1.5" fill="#c9a45c"/>
                      <polygon points="9,20 45,20 45,66 27,56 9,66" fill="#16295a" stroke="#e8b65a" stroke-width="1.6"/>
                      <path d="M27 30 l2.4 4.9 5.4 .8 -3.9 3.8 .9 5.4 -4.8 -2.5 -4.8 2.5 .9 -5.4 -3.9 -3.8 5.4 -.8z" fill="#e8c87a"/>
                    </svg>
                  </div></div>
                </div>

                <!-- the diploma scroll: rises, then unfurls -->
                <div id="diploma" style="left:138px; top:82px;">
                  <div class="diplomaStand">
                    <div class="dSheet">
                      <div class="dSeal">&#9733;</div>
                    </div>
                    <div class="dRoll" id="rollL"></div>
                    <div class="dRoll" id="rollR"></div>
                  </div>
                </div>

                <!-- the graduation cap on its stand -->
                <div id="capBox" style="left:262px; top:84px;">
                  <div class="capStand">
                    <svg viewBox="0 0 120 118" width="120" height="118" aria-hidden="true">
                      <ellipse cx="60" cy="110" rx="27" ry="6" fill="#0a1428" opacity=".55"/>
                      <path d="M34 108 h52 l5 6 H29 Z" fill="#8a6a24"/>
                      <rect x="57.5" y="58" width="5" height="50" fill="#c9a45c"/>
                      <path d="M44 58 h32 l-4 7 H48 Z" fill="#d9b45f"/>
                    </svg>
                    <div class="capToss">
                      <svg viewBox="0 0 120 74" width="120" height="74" aria-hidden="true">
                        <path d="M38 38 Q60 50 82 38 L82 50 Q60 62 38 50 Z" fill="#0c1425"/>
                        <polygon points="60,6 116,32 60,58 4,32" fill="#131c33" stroke="#c9a45c" stroke-width="1.6" stroke-linejoin="round"/>
                        <polygon points="60,11 108,32 60,53 12,32" fill="#1a2745"/>
                        <circle cx="60" cy="32" r="4.5" fill="#e8c87a" stroke="#a87a24" stroke-width="1"/>

                        <g>
                          <rect x="103" y="33" width="5" height="9" rx="2" fill="#c9a45c"/>

                        </g>
                      </svg>
                    </div>
                  </div>
                </div>

              </div><!-- /stageTopBox -->

              <!-- gold confetti drifting down over the stage -->
              <div class="confetti" style="left:110px; top:84px; background:#e8c87a; --z:132px; --dx:10px; --dy:30px; --d:0s;"></div>
              <div class="confetti" style="left:170px; top:70px; background:#f7efdb; --z:148px; --dx:-12px; --dy:24px; --d:.8s;"></div>
              <div class="confetti" style="left:232px; top:80px; background:#9db8e8; --z:138px; --dx:8px; --dy:32px; --d:1.5s;"></div>
              <div class="confetti" style="left:140px; top:118px; background:#e8c87a; --z:120px; --dx:-9px; --dy:26px; --d:2.2s;"></div>
              <div class="confetti" style="left:206px; top:112px; background:#f7efdb; --z:144px; --dx:12px; --dy:22px; --d:3s;"></div>
              <div class="confetti" style="left:262px; top:100px; background:#e8c87a; --z:126px; --dx:-11px; --dy:30px; --d:3.7s;"></div>
              <div class="confetti" style="left:96px; top:106px; background:#9db8e8; --z:140px; --dx:9px; --dy:25px; --d:4.5s;"></div>
              <div class="confetti" style="left:190px; top:92px; background:#e8c87a; --z:154px; --dx:-8px; --dy:34px; --d:5.2s;"></div>
            </div><!-- /gradWrap -->

            <div id="flapShadow"></div>

            <!-- the sealed envelope front: covers everything while closed,
                 slides down-front to lie before the card once open -->
            <div id="envGroup">
              <div class="envFront">
                <div id="coverLine" aria-hidden="true">a big day made of paper.</div>
                <div id="baseWords" aria-hidden="true">
                  <p class="bw-greet">Hey Everyone,<br>you did it...</p>
                  <p class="bw-sign">Mason</p>
                </div>
              </div>
              <div class="envFlap">
                <div class="envFlapBack">
                  <svg viewBox="0 0 470 171" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="pfGradFlapBackGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#203a6e"/><stop offset="1" stop-color="#12234a"/>
                      </linearGradient>
                    </defs>
                    <path d="M2 2 L468 2 L235 169 Z" fill="url(#pfGradFlapBackGrad)" stroke="#e8b65a" stroke-width="2.5" stroke-linejoin="round"/>
                    <g fill="#f4d98c">
                      <circle cx="176" cy="38" r="2.2" opacity=".75"/><circle cx="212" cy="28" r="1.7" opacity=".6"/>
                      <circle cx="252" cy="34" r="2" opacity=".7"/><circle cx="288" cy="26" r="1.6" opacity=".55"/>
                      <circle cx="198" cy="56" r="1.5" opacity=".5"/><circle cx="268" cy="54" r="1.5" opacity=".5"/>
                    </g>
                    <path d="M235 96 l2.8 5.6 6.2 .9 -4.5 4.4 1.1 6.1 -5.6 -2.9 -5.6 2.9 1.1 -6.1 -4.5 -4.4 6.2 -.9z" fill="#e8b65a" opacity=".65"/>
                  </svg>
                </div>
                <div class="envFlapFront">
                  <svg viewBox="0 0 470 171" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="pfGradFlapGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#2c4a8a"/><stop offset="1" stop-color="#1a2f5e"/>
                      </linearGradient>
                    </defs>
                    <path d="M2 2 L468 2 L235 169 Z" fill="url(#pfGradFlapGrad)" stroke="#e8b65a" stroke-width="2.5" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="seal">&#9733;</div>
              </div>
            </div><!-- /envGroup -->
          </div><!-- /cardBase -->
        </div>
      </div>
    </div>
    <div id="pill">TAP TO OPEN</div>
  </div>
</div>

<script>
(function(){
  var rise = 0, target = 0, opened = false;
  var world = document.getElementById('world');
  var gradWrap = document.getElementById('gradWrap');
  var gradGlow = document.getElementById('gradGlow');
  var stageTopBox = document.getElementById('stageTopBox');
  var pill = document.getElementById('pill');

  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

  /* ---------- the stage platform ----------
     Its base group sits at its bottom plane; its walls grow with the
     rise in a staggered window; its top rides on the walls. */
  var STAGE = { id:'stage', start:0.02, end:0.36, depth:18, bottom:6 };
  var stageEl = document.getElementById(STAGE.id);
  STAGE.base = stageEl.querySelector('.stageBase');
  STAGE.base.style.transform = 'translateZ(' + STAGE.bottom + 'px)';
  STAGE.walls = stageEl.querySelectorAll('.gwall');
  STAGE.top = stageEl.querySelector('.stageTop');
  STAGE.p = 0;

  /* ---------- the pieces standing on the stage ----------
     Each standee grows off the stage top in its own rise window. */
  var poleStands = document.querySelectorAll('.poleStand');
  var diplomaStand = document.querySelector('.diplomaStand');
  var capStand = document.querySelector('.capStand');
  var dSheet = document.querySelector('.dSheet');
  var rollL = document.getElementById('rollL');
  var rollR = document.getElementById('rollR');
  var unfurlP = 0;

  function applyRise(){
    /* the scene hides inside the envelope while settled shut: it fades
       in as it rises (the Sea Card's tank trick) */
    gradWrap.style.opacity = Math.min(1, rise / 0.12).toFixed(3);
    gradWrap.style.visibility = rise <= 0.001 ? 'hidden' : 'visible';

    /* the stage grows */
    STAGE.p = clamp01((rise - STAGE.start) / (STAGE.end - STAGE.start));
    var h = (STAGE.p * STAGE.depth).toFixed(2);
    for (var w=0; w<STAGE.walls.length; w++){ STAGE.walls[w].style.height = h + 'px'; }
    STAGE.top.style.transform = 'translateZ(' + h + 'px)';
    STAGE.top.style.opacity = STAGE.p <= 0.01 ? '0' : String(Math.min(1, STAGE.p * 3));
    var stageTopZ = STAGE.bottom + STAGE.p * STAGE.depth;
    stageTopBox.style.transform = 'translateZ(' + stageTopZ.toFixed(2) + 'px)';

    /* banner poles grow, staggered */
    var pL = clamp01((rise - 0.34) / 0.20);
    var pR = clamp01((rise - 0.44) / 0.20);
    poleStands[0].style.transform = 'rotateX(-90deg) scale(' + pL.toFixed(3) + ')';
    poleStands[1].style.transform = 'rotateX(-90deg) scale(' + pR.toFixed(3) + ')';

    /* the diploma rises, then its sheet unfurls between the rolls */
    var dp = clamp01((rise - 0.56) / 0.22);
    diplomaStand.style.transform = 'rotateX(-90deg) scale(' + dp.toFixed(3) + ')';
    unfurlP = clamp01((rise - 0.76) / 0.21);
    var sheetW = 16 + unfurlP * 134;
    dSheet.style.width = sheetW.toFixed(1) + 'px';
    rollL.style.left = (88 - sheetW / 2 - 9).toFixed(1) + 'px';
    rollR.style.left = (88 + sheetW / 2 - 8).toFixed(1) + 'px';

    /* the cap stand assembles */
    var cp = clamp01((rise - 0.64) / 0.20);
    capStand.style.transform = 'rotateX(-90deg) scale(' + cp.toFixed(3) + ')';

    /* warm ceremony light on the base, growing as the diploma opens */
    gradGlow.style.opacity = (rise * 0.10 + unfurlP * 0.35).toFixed(3);
  }

  /* ---------- main loop ---------- */
  var last = performance.now();
  function tick(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    rise += (target - rise) * Math.min(1, dt * 2.6);
    if (Math.abs(target - rise) < 0.0015) rise = target;
    applyRise();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- interaction ----------
     Open:  seal breaks -> flap swings -> envelope slides down-front ->
            card stands -> stage rises -> poles, diploma and cap grow
            (target set at 850ms), the diploma unfurls last.
     Close: everything settles first -> card folds -> envelope returns
            -> flap swings shut -> seal reappears (CSS delays). */
  var choreoTimer = null;
  function toggle(){
    opened = !opened;
    world.classList.toggle('open', opened);
    fit();
    if (choreoTimer){ clearTimeout(choreoTimer); choreoTimer = null; }
    if (opened){
      pill.style.opacity = '0';
      choreoTimer = setTimeout(function(){ target = 1; }, 850);
    } else {
      target = 0;
      choreoTimer = setTimeout(function(){ pill.style.opacity = '1'; }, 1900);
    }
  }
  document.addEventListener('click', toggle);
  document.addEventListener('touchend', function(e){ e.preventDefault(); toggle(); }, { passive:false });

  /* ---------- fit to screen ----------
     Identical to the Sea Card: the open visual span (standing card's top
     to the slid-down base's bottom) is ~510 world units centered ~33
     units above the layout box, so the open fit uses the taller divisor
     and the 33-unit settle; the closed fit is the plain centered one. */
  function fit(){
    var isOpen = world.classList.contains('open');
    var s = Math.min(window.innerWidth / 660, window.innerHeight / (isOpen ? 590 : 530));
    var ty = isOpen ? 33 : 0;
    world.style.transform = 'scale(' + s.toFixed(3) + ') translateY(' + ty + 'px)';
  }
  window.addEventListener('resize', fit);
  fit();
  applyRise();

  /* QA hooks (harmless): #risen = fully open instantly, #mid = half-open */
  if (location.hash === '#risen'){
    opened = true; target = 1; rise = 1;
    world.classList.add('open'); document.body.classList.add('qa');
    pill.style.opacity = '0';
    applyRise(); fit();
  }
  if (location.hash === '#mid'){
    opened = true; target = 0.52; rise = 0.52;
    world.classList.add('open', 'qa-mid'); document.body.classList.add('qa');
    pill.style.opacity = '0'; applyRise(); fit();
  }
})();
</script>
</body>
