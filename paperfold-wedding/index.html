<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Wedding Arch — Paperfold</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse 120% 90% at 50% 40%, #2b1e3e 0%, #170f26 46%, #0a0614 74%, #000 100%);
    overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif;
    color:#f7ead2;
    user-select:none; -webkit-user-select:none;
    cursor:pointer;
  }
  #fit { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #world { position:relative; width:640px; height:480px; flex:0 0 auto; transform-origin:center center; transition:transform .8s ease; }

  /* soft pool of light on the "table" under the card */
  #floorGlow {
    position:absolute; left:50%; top:56%; width:560px; height:190px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(255,205,120,.16) 0%, rgba(150,180,110,.06) 45%, transparent 70%);
    filter:blur(6px); pointer-events:none;
  }
  #scene { position:absolute; inset:0; perspective:1150px; perspective-origin:50% 42%; }
  #orbiter {
    position:absolute; inset:0; transform-style:preserve-3d;
    animation:pfWedSway 46s ease-in-out infinite alternate;
  }
  @keyframes pfWedSway { from { transform:rotateY(-11deg); } to { transform:rotateY(11deg); } }
  #tilt {
    position:absolute; inset:0; transform-style:preserve-3d;
    transform:rotateX(54deg) rotateZ(-9deg);
  }

  /* ---------- the card base ---------- */
  #cardBase { position:absolute; left:85px; top:90px; width:470px; height:316px; transform-style:preserve-3d; }
  /* the envelope's back panel — the mat everything sits on once open */
  #basePlate {
    position:absolute; inset:0; border-radius:10px; transform:translateZ(0px);
    background:linear-gradient(160deg, #f8f1de 0%, #f0e4c6 55%, #e7d6ab 100%);
    box-shadow: inset 0 0 0 2px rgba(176,138,62,.40), inset 0 0 34px rgba(120,90,30,.18);
  }
  #envShadow {
    position:absolute; left:-14px; top:-8px; width:498px; height:338px;
    background:rgba(0,0,0,.55); border-radius:14px; filter:blur(16px);
    transform:translateZ(1px); transition:opacity .8s ease .8s;
  }
  #world.open #envShadow { opacity:.3; transition-delay:.3s; }
  /* golden-hour light pooled on the lawn where the arch stands */
  #wedGlow {
    position:absolute; left:60px; top:30px; width:260px; height:230px;
    transform:translateZ(9px); border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,214,140,.55) 0%, rgba(255,190,110,.22) 52%, transparent 74%);
    filter:blur(11px); opacity:0; pointer-events:none;
  }

  /* ---------- the card that stands (pop-up backdrop) ---------- */
  #cardStand {
    position:absolute; left:45px; top:30px; width:380px; height:0;
    transform:translateZ(3px); transform-style:preserve-3d;
  }
  #cardPanel {
    position:absolute; left:0; top:0; width:380px; height:232px;
    transform-origin:50% 0%; transform:rotateX(0deg); transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.3,.8,.3,1) .55s; /* closing delay */
  }
  #world.open #cardPanel { transform:rotateX(90deg); transition-delay:.8s; }
  .cardFace { position:absolute; inset:0; border-radius:8px 8px 3px 3px; backface-visibility:hidden; overflow:hidden; }
  /* the face that lies up inside the envelope — a quiet inside cover */
  .cardIn {
    background:linear-gradient(170deg, #fdf8ee 0%, #f6e8da 58%, #eeddc9 100%);
    box-shadow: inset 0 0 0 2px rgba(176,138,62,.45), inset 0 0 30px rgba(190,150,90,.20);
  }
  /* the face that greets you once the card stands — evening garden backdrop */
  .cardBack {
    transform:rotateX(180deg);
    background:linear-gradient(178deg, #2a1e42 0%, #503a63 46%, #9c6472 78%, #e0a878 100%);
    box-shadow: inset 0 0 0 2px rgba(232,182,90,.65), inset 0 0 0 7px rgba(24,14,34,.45), inset 0 0 52px rgba(20,10,30,.45);
  }
  .cardBack svg { position:absolute; inset:0; width:100%; height:100%; }
  /* the string-light bulbs twinkle */
  .cardBack .bulb { animation:pfWedTwinkle 2.8s ease-in-out infinite alternate; }
  @keyframes pfWedTwinkle { from { opacity:.45; } to { opacity:1; } }

  /* ---------- the envelope front (sealed card, closed state) ---------- */
  #envGroup {
    position:absolute; inset:0; transform-style:preserve-3d;
    transform:translateZ(30px);
    transition:transform 1.05s cubic-bezier(.3,.8,.3,1) .95s; /* closing delay */
  }
  #world.open #envGroup { transform:translateY(118px) translateZ(6px) scale(.93); transition-delay:.5s; }
  .envFront {
    position:absolute; inset:0; border-radius:10px;
    background:linear-gradient(155deg, #fffdf6 0%, #f7efdb 52%, #eee0bd 100%);
    box-shadow:0 16px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.65);
  }
  .envFront::before { /* gilt inner edge */
    content:""; position:absolute; inset:4.5%;
    border:1.5px solid rgba(176,138,62,.55); border-radius:6px; pointer-events:none;
  }
  .envFront::after { /* side fold lines */
    content:""; position:absolute; inset:0; border-radius:10px;
    background:
      linear-gradient(24deg, transparent 49.6%, rgba(120,90,30,.10) 50%, transparent 50.6%),
      linear-gradient(-24deg, transparent 49.6%, rgba(120,90,30,.10) 50%, transparent 50.6%);
    pointer-events:none;
  }
  .envFlap {
    position:absolute; left:0; top:-1px; width:100%; height:54%;
    transform-origin:50% 0%; transform:rotateX(0deg); transform-style:preserve-3d;
    transition:transform 1.35s cubic-bezier(.3,.75,.25,1) 1.6s; /* closing delay */
  }
  #world.open .envFlap { transform:rotateX(180deg); transition-delay:.12s; }
  .envFlapFront { position:absolute; inset:0; backface-visibility:hidden; }
  .envFlapFront svg { width:100%; height:100%; display:block; }
  .envFlapBack {
    position:absolute; inset:0; backface-visibility:hidden; transform:rotateX(180deg);
  }
  .envFlapBack svg { width:100%; height:100%; display:block; }
  /* light sweeping across the flap as it turns (synced to the 1.35s swing) */
  #world.open .envFlapFront { animation:pfWedFlapGlowFront 1.35s ease .12s both; }
  #world.open .envFlapBack { animation:pfWedFlapGlowBack 1.35s ease .12s both; }
  @keyframes pfWedFlapGlowFront {
    0% { filter:brightness(1); } 40% { filter:brightness(1.10); }
    70% { filter:brightness(1.05); } 100% { filter:brightness(1); }
  }
  @keyframes pfWedFlapGlowBack {
    0% { filter:brightness(.94); } 50% { filter:brightness(.96); }
    78% { filter:brightness(1.06); } 100% { filter:brightness(1); }
  }
  /* soft shadow the opened flap casts on the table behind the base */
  #flapShadow {
    position:absolute; left:-6px; top:-59px; width:482px; height:183px;
    transform:translateZ(1px); filter:blur(9px); pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.26) 55%, transparent 75%);
    opacity:0; transition:opacity .6s ease .8s; /* gone before the flap returns on close */
  }
  #world.open #flapShadow { opacity:.5; transition-delay:1.15s; }
  .seal {
    position:absolute; left:50%; top:98.8%; width:62px; height:62px;
    transform:translate(-50%,-50%) translateZ(3px);
    border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #ffeda6 0%, #eec25e 46%, #c08f2e 82%, #a87a24 100%);
    box-shadow:0 3px 7px rgba(40,26,2,.5), inset 0 1px 2px rgba(255,255,255,.7), inset 0 -2px 4px rgba(120,72,10,.5);
    display:flex; align-items:center; justify-content:center;
    color:#8a5a10; font-size:29px; line-height:1;
    transition:opacity .3s ease 2.1s, transform .3s ease 2.1s; /* returns last on close */
  }
  #world.open .seal { opacity:0; transform:translate(-50%,-50%) translateZ(3px) scale(.4); transition-delay:0s, 0s; }
  .seal::after { content:""; position:absolute; inset:11%; border:1.5px solid rgba(122,78,12,.5); border-radius:50%; }

  /* ---------- the ceremony (rises out of the base) ---------- */
  #wedWrap { position:absolute; left:45px; top:32px; width:380px; height:252px; transform-style:preserve-3d; }
  /* the lawn the ceremony stands on */
  #lawn {
    position:absolute; left:30px; top:60px; width:320px; height:180px; border-radius:50%;
    transform:translateZ(4px);
    background:radial-gradient(ellipse at 50% 42%, #a9bf7d 0%, #8aa862 55%, #6d8c4c 82%, #57743c 100%);
    box-shadow: inset 0 0 0 3px rgba(240,230,190,.35), inset 0 -10px 22px rgba(50,70,30,.35), 0 4px 14px rgba(0,0,0,.30);
  }
  /* the aisle: a pale runner down the middle, narrowing toward the arch */
  #path {
    position:absolute; left:165px; top:66px; width:50px; height:168px;
    transform:translateZ(5px);
    background:linear-gradient(180deg, #f3e9d2 0%, #efe3c6 60%, #e9dab4 100%);
    clip-path:polygon(34% 0, 66% 0, 100% 100%, 0 100%);
    opacity:.92;
  }

  /* chairs: point anchors on the lawn; each standee is a flat paper chair
     stood up from its bottom edge (rotateX(-90)) and grown by JS.
     The box must keep preserve-3d or the standees flatten into the lawn. */
  #chairBox { position:absolute; inset:0; transform-style:preserve-3d; }
  .chair { position:absolute; width:0; height:0; transform-style:preserve-3d; }
  .chairStand {
    position:absolute; left:-17px; top:-50px; width:34px; height:50px;
    transform-origin:50% 100%; transform:rotateX(-90deg) scale(0);
  }
  .chairStand svg { width:100%; height:100%; display:block; }

  /* the arch: one paper standee — two posts and a curved top — stood up
     at the far end of the aisle and grown by JS; roses and rings ride it */
  .archAnchor { position:absolute; width:0; height:0; transform-style:preserve-3d; }
  .archStand {
    position:absolute; left:-105px; top:-188px; width:210px; height:188px;
    transform-origin:50% 100%; transform:rotateX(-90deg) scale(0);
  }
  .archStand > svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* a rose: layered paper petals, bloomed open one by one by JS */
  .rose {
    position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%;
    transform:scale(0); pointer-events:none;
    box-shadow: inset -2px -3px 4px rgba(120,50,60,.25), 0 1px 2px rgba(60,40,10,.25);
  }
  .rose::after {
    content:""; position:absolute; left:50%; top:50%; width:6px; height:6px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 40% 35%, rgba(255,255,255,.75), rgba(0,0,0,.14) 75%);
  }
  .rose.white { background:radial-gradient(circle at 42% 38%, #fffdf7 0%, #f6e3da 48%, #e8c4b8 82%, #dfb2a2 100%); }
  .rose.blush { background:radial-gradient(circle at 42% 38%, #ffeef2 0%, #f4b8c6 48%, #e58aa2 82%, #d9758f 100%); }
  /* the two gold rings hanging at the arch's center */
  .rings {
    position:absolute; left:105px; top:44px; width:48px; height:36px; margin-left:-24px;
    opacity:0; transform:scale(.6); transform-origin:50% 0%; pointer-events:none;
  }
  .rings svg { width:100%; height:100%; display:block; animation:pfWedGlint 3.6s ease-in-out infinite; }
  @keyframes pfWedGlint {
    0%, 100% { filter:brightness(1); }
    50% { filter:brightness(1.45) drop-shadow(0 0 3px rgba(255,220,130,.8)); }
  }

  /* petals: little paper petals drifting down through the scene once open */
  .petal {
    position:absolute; width:9px; height:12px; border-radius:60% 40% 60% 40%;
    opacity:0; pointer-events:none;
  }
  #world.open .petal { animation:pfWedPetal 6.4s ease-in-out infinite; animation-delay:calc(2.4s + var(--d, 0s)); }
  @keyframes pfWedPetal {
    0% { opacity:0; transform:translate3d(0,-6px,var(--z,140px)) rotate(0deg); }
    10% { opacity:.95; }
    55% { transform:translate3d(var(--sw,14px), 78px, calc(var(--z,140px) - 55px)) rotate(170deg); }
    90% { opacity:.85; }
    100% { opacity:0; transform:translate3d(calc(var(--sw,14px) * -0.6), 158px, calc(var(--z,140px) - 110px)) rotate(330deg); }
  }

  /* ---------- words & furniture ---------- */
  #pill {
    position:absolute; left:50%; top:368px; transform:translateX(-50%);
    padding:7px 18px 8px; border-radius:999px; white-space:nowrap;
    background:rgba(38,24,48,.80); border:1px solid rgba(232,182,90,.65);
    color:#f7ead2; font-family:Verdana, sans-serif; font-size:12.5px; letter-spacing:.12em;
    box-shadow:0 4px 18px rgba(0,0,0,.5); pointer-events:none;
    transition:opacity .8s ease; animation:pfWedPill 2.6s ease-in-out infinite;
  }
  @keyframes pfWedPill { 0%,100% { transform:translateX(-50%) translateY(0); } 50% { transform:translateX(-50%) translateY(-4px); } }

  /* the line on the sealed cover, under the seal — gone once open */
  #coverLine {
    position:absolute; left:26px; right:26px; top:226px;
    text-align:center; pointer-events:none;
    font-size:19px; font-style:italic; letter-spacing:.1em; color:#7c5a1e;
    text-shadow:0 0 8px rgba(255,246,220,.6), 0 1px 2px rgba(255,255,255,.5);
    opacity:1; transition:opacity .35s ease 1.9s; /* drifts back late on close */
  }
  #world.open #coverLine { opacity:0; transition:opacity .3s ease 0s; }

  /* ---------- the writing on the envelope base ----------
     The words live on the ivory envelope front itself, in the free area
     below the ceremony (same geometry as the Sea Card), inside the gilt
     trim. No separate panel. Deep warm gold-brown ink so it reads on
     ivory. They fade in as the arch settles and are gone quickly on
     close, before the front returns. One clean block — swap these
     words to personalize the card. */
  #baseWords {
    position:absolute; left:26px; right:26px; top:192px;
    text-align:center; pointer-events:none;
    font-family:Georgia, 'Times New Roman', serif; color:#6e4f16;
    text-shadow:0 0 9px rgba(255,248,225,.55);
    opacity:0; transition:opacity .3s ease 0s;
  }
  #world.open #baseWords { opacity:1; transition:opacity .9s ease 1.9s; }
  #baseWords p { margin:0; }
  .bw-greet { font-size:27px; line-height:1.35; letter-spacing:.02em; }
  .bw-sign { font-size:32px; line-height:1.3; font-style:italic; margin-top:10px; color:#8a6a24; }

  /* QA: freeze every transition so hash states render instantly */
  .qa * { transition:none !important; }
  /* QA mid-open: flap half-swung, card half-standing, envelope half-slid */
  .qa-mid .envFlap { transform:rotateX(82deg) !important; }
  .qa-mid #cardPanel { transform:rotateX(44deg) !important; }
  .qa-mid #envGroup { transform:translateY(59px) translateZ(18px) scale(.965) !important; }
  .qa-mid .seal { opacity:0 !important; }

  @media (prefers-reduced-motion: reduce) {
    #orbiter { animation:none; }
    .cardBack .bulb, .rings svg { animation:none; }
    #world.open .petal { animation:none; }
    #world.open .envFlapFront, #world.open .envFlapBack { animation:none; }
    #world { transition:none; }
  }
</style>
</head>
<body>
<div id="fit">
  <div id="world">
    <div id="floorGlow"></div>
    <div id="scene">
      <div id="orbiter">
        <div id="tilt">
          <div id="cardBase">
            <div id="basePlate"></div>
            <div id="envShadow"></div>

            <!-- the card inside: lies flat in the envelope, stands when open -->
            <div id="cardStand">
              <div id="cardPanel">
                <div class="cardFace cardIn"></div>
                <div class="cardFace cardBack">
                  <svg viewBox="0 0 380 248" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="pfWedSky" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#2a1e42"/>
                        <stop offset=".46" stop-color="#503a63"/>
                        <stop offset=".78" stop-color="#9c6472"/>
                        <stop offset="1" stop-color="#e0a878"/>
                      </linearGradient>
                      <radialGradient id="pfWedBackGlow" cx=".5" cy=".78" r=".55">
                        <stop offset="0" stop-color="#ffcf96" stop-opacity=".28"/>
                        <stop offset="1" stop-color="#ffcf96" stop-opacity="0"/>
                      </radialGradient>
                    </defs>
                    <rect x="0" y="0" width="380" height="248" fill="url(#pfWedSky)"/>
                    <rect x="0" y="0" width="380" height="248" fill="url(#pfWedBackGlow)"/>
                    <!-- faint early stars -->
                    <g fill="#fff6e0">
                      <circle cx="52" cy="30" r="1.3" opacity=".55"/><circle cx="118" cy="18" r="1" opacity=".4"/>
                      <circle cx="196" cy="26" r="1.2" opacity=".5"/><circle cx="268" cy="14" r="1" opacity=".4"/>
                      <circle cx="330" cy="34" r="1.3" opacity=".5"/><circle cx="156" cy="44" r=".9" opacity=".35"/>
                      <circle cx="238" cy="48" r=".9" opacity=".35"/>
                    </g>
                    <!-- distant hills -->
                    <path d="M0 208 Q70 188 150 202 Q240 216 310 198 Q350 190 380 200 L380 248 L0 248 Z" fill="#33234a" opacity=".85"/>
                    <!-- the two trees the string lights hang between -->
                    <g fill="#201631">
                      <rect x="26" y="120" width="9" height="96" rx="3"/>
                      <circle cx="31" cy="98" r="34"/><circle cx="8" cy="118" r="22"/><circle cx="56" cy="116" r="24"/>
                      <circle cx="30" cy="76" r="24"/>
                      <rect x="345" y="120" width="9" height="96" rx="3"/>
                      <circle cx="349" cy="98" r="34"/><circle cx="324" cy="116" r="24"/><circle cx="372" cy="118" r="22"/>
                      <circle cx="350" cy="76" r="24"/>
                    </g>
                    <!-- string lights: three swags tree to tree -->
                    <g fill="none" stroke="rgba(255,220,150,.35)" stroke-width="1.3">
                      <path d="M34 62 Q190 112 346 58"/>
                      <path d="M34 88 Q190 132 346 84"/>
                      <path d="M40 116 Q190 152 340 112"/>
                    </g>
                    <g fill="#ffdf9e">
                      <circle class="bulb" cx="76" cy="76" r="2.3"/>
                      <circle class="bulb" style="animation-delay:-.6s" cx="118" cy="86" r="2.3"/>
                      <circle class="bulb" style="animation-delay:-1.3s" cx="160" cy="92" r="2.3"/>
                      <circle class="bulb" style="animation-delay:-2s" cx="202" cy="92" r="2.3"/>
                      <circle class="bulb" style="animation-delay:-.9s" cx="244" cy="86" r="2.3"/>
                      <circle class="bulb" style="animation-delay:-1.7s" cx="286" cy="75" r="2.3"/>
                      <circle class="bulb" style="animation-delay:-.3s" cx="88" cy="104" r="2.1"/>
                      <circle class="bulb" style="animation-delay:-1.1s" cx="140" cy="114" r="2.1"/>
                      <circle class="bulb" style="animation-delay:-2.4s" cx="192" cy="117" r="2.1"/>
                      <circle class="bulb" style="animation-delay:-.8s" cx="242" cy="112" r="2.1"/>
                      <circle class="bulb" style="animation-delay:-1.9s" cx="292" cy="101" r="2.1"/>
                      <circle class="bulb" style="animation-delay:-1.5s" cx="120" cy="130" r="1.9"/>
                      <circle class="bulb" style="animation-delay:-2.2s" cx="190" cy="138" r="1.9"/>
                      <circle class="bulb" style="animation-delay:-.5s" cx="258" cy="129" r="1.9"/>
                    </g>
                    <!-- grass silhouette along the foot of the backdrop -->
                    <path d="M0 232 L380 232 L380 248 L0 248 Z" fill="#241839"/>
                  </svg>
                </div>
              </div>
            </div>

            <div id="wedGlow"></div>

            <!-- the ceremony: lawn, aisle, chairs, the arch, petals -->
            <div id="wedWrap">
              <div id="lawn"></div>
              <div id="path"></div>
              <div id="chairBox"></div>

              <!-- the arch stands at the far end of the aisle -->
              <div class="archAnchor" style="left:190px; top:118px;">
                <div class="archStand" id="archStand">
                  <svg viewBox="0 0 210 188" aria-hidden="true">
                    <!-- sheer drapes, settled inside the posts -->
                    <path d="M30 40 C55 80 40 130 30 178 C22 120 20 80 24 42 Z" fill="rgba(255,253,247,.50)"/>
                    <path d="M180 40 C155 80 170 130 180 178 C188 120 190 80 186 42 Z" fill="rgba(255,253,247,.50)"/>
                    <path d="M24 42 Q105 92 186 42 Q105 58 24 42 Z" fill="rgba(255,253,247,.45)"/>
                    <!-- greenery the roses climb through -->
                    <g fill="#7f9c6c" opacity=".85">
                      <ellipse cx="40" cy="50" rx="10" ry="6" transform="rotate(-30 40 50)"/>
                      <ellipse cx="70" cy="29" rx="10" ry="6" transform="rotate(-12 70 29)"/>
                      <ellipse cx="105" cy="19" rx="11" ry="6"/>
                      <ellipse cx="140" cy="29" rx="10" ry="6" transform="rotate(12 140 29)"/>
                      <ellipse cx="170" cy="50" rx="10" ry="6" transform="rotate(30 170 50)"/>
                      <ellipse cx="23" cy="140" rx="7" ry="11"/>
                      <ellipse cx="23" cy="104" rx="7" ry="11"/>
                      <ellipse cx="187" cy="140" rx="7" ry="11"/>
                      <ellipse cx="187" cy="104" rx="7" ry="11"/>
                    </g>
                    <!-- posts and the curved top -->
                    <rect x="18" y="38" width="10" height="150" rx="4" fill="#f8f2e2" stroke="#d9c69c" stroke-width="1"/>
                    <rect x="182" y="38" width="10" height="150" rx="4" fill="#f8f2e2" stroke="#d9c69c" stroke-width="1"/>
                    <rect x="15" y="31" width="16" height="8" rx="3" fill="#e6cf9a"/>
                    <rect x="179" y="31" width="16" height="8" rx="3" fill="#e6cf9a"/>
                    <path d="M23 44 Q105 -28 187 44" fill="none" stroke="#f8f2e2" stroke-width="10" stroke-linecap="round"/>
                    <path d="M23 53 Q105 -12 187 53" fill="none" stroke="#efe5cd" stroke-width="5" opacity=".8" stroke-linecap="round"/>
                    <!-- the thread the rings hang from -->
                    <line x1="105" y1="13" x2="105" y2="46" stroke="#c9a24a" stroke-width="1.6"/>
                  </svg>
                  <!-- roses bloom along the arch (JS, one by one) -->
                  <div id="roseBox"></div>
                  <!-- two gold rings at the arch's center -->
                  <div class="rings" id="rings">
                    <svg viewBox="0 0 48 36" aria-hidden="true">
                      <circle cx="19" cy="20" r="11" fill="none" stroke="#d9a83f" stroke-width="3"/>
                      <circle cx="29" cy="20" r="11" fill="none" stroke="#eec25e" stroke-width="3"/>
                      <path d="M12 12 A11 11 0 0 1 20 9.5" fill="none" stroke="#fff3cf" stroke-width="1.6" opacity=".8"/>
                      <path d="M22 12 A11 11 0 0 1 30 9.5" fill="none" stroke="#fff8e2" stroke-width="1.6" opacity=".8"/>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- petals drifting down through the scene -->
              <div class="petal" style="left:150px; top:64px; background:#f7cdd6; --z:150px; --sw:14px; --d:0s;"></div>
              <div class="petal" style="left:196px; top:56px; background:#fdf3e7; --z:165px; --sw:-12px; --d:.8s;"></div>
              <div class="petal" style="left:232px; top:70px; background:#f2b7c4; --z:138px; --sw:10px; --d:1.7s;"></div>
              <div class="petal" style="left:128px; top:84px; background:#fbe9ec; --z:128px; --sw:-15px; --d:2.5s;"></div>
              <div class="petal" style="left:214px; top:88px; background:#f7cdd6; --z:158px; --sw:16px; --d:3.3s;"></div>
              <div class="petal" style="left:168px; top:78px; background:#fdf3e7; --z:144px; --sw:-9px; --d:4.1s;"></div>
              <div class="petal" style="left:248px; top:96px; background:#fbe9ec; --z:120px; --sw:12px; --d:4.9s;"></div>
              <div class="petal" style="left:142px; top:102px; background:#f2b7c4; --z:132px; --sw:-13px; --d:5.6s;"></div>
              <div class="petal" style="left:188px; top:98px; background:#f7cdd6; --z:170px; --sw:9px; --d:6.2s;"></div>
            </div><!-- /wedWrap -->

            <div id="flapShadow"></div>

            <!-- the sealed envelope front: covers everything while closed,
                 slides down-front to lie before the card once open -->
            <div id="envGroup">
              <div class="envFront">
                <div id="coverLine" aria-hidden="true">a promise made of paper.</div>
                <div id="baseWords" aria-hidden="true">
                  <p class="bw-greet">Hey Everyone,<br>love is in the air...</p>
                  <p class="bw-sign">Ava</p>
                </div>
              </div>
              <div class="envFlap">
                <div class="envFlapBack">
                  <svg viewBox="0 0 470 171" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="pfWedFlapBackGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#f7efdb"/><stop offset="1" stop-color="#eee0bd"/>
                      </linearGradient>
                    </defs>
                    <path d="M2 2 L468 2 L235 169 Z" fill="url(#pfWedFlapBackGrad)" stroke="#c9a24a" stroke-width="2.5" stroke-linejoin="round"/>
                    <g fill="#c9a24a">
                      <circle cx="176" cy="38" r="2.2" opacity=".75"/><circle cx="212" cy="28" r="1.7" opacity=".6"/>
                      <circle cx="252" cy="34" r="2" opacity=".7"/><circle cx="288" cy="26" r="1.6" opacity=".55"/>
                      <circle cx="198" cy="56" r="1.5" opacity=".5"/><circle cx="268" cy="54" r="1.5" opacity=".5"/>
                    </g>
                    <path d="M235 96 l2.8 5.6 6.2 .9 -4.5 4.4 1.1 6.1 -5.6 -2.9 -5.6 2.9 1.1 -6.1 -4.5 -4.4 6.2 -.9z" fill="#c9a24a" opacity=".65"/>
                  </svg>
                </div>
                <div class="envFlapFront">
                  <svg viewBox="0 0 470 171" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="pfWedFlapGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#fdfaf1"/><stop offset="1" stop-color="#f1e5c9"/>
                      </linearGradient>
                    </defs>
                    <path d="M2 2 L468 2 L235 169 Z" fill="url(#pfWedFlapGrad)" stroke="#c9a24a" stroke-width="2.5" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="seal">&#9733;</div>
              </div>
            </div><!-- /envGroup -->
          </div><!-- /cardBase -->
        </div>
      </div>
    </div>
    <div id="pill">TAP TO OPEN</div>
  </div>
</div>

<script>
(function(){
  var rise = 0, target = 0, opened = false;
  var world = document.getElementById('world');
  var wedWrap = document.getElementById('wedWrap');
  var wedGlow = document.getElementById('wedGlow');
  var archStand = document.getElementById('archStand');
  var rings = document.getElementById('rings');
  var pill = document.getElementById('pill');

  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function smooth(v){ return v * v * (3 - 2 * v); }

  /* ---------- the chairs ----------
     Two rows of tiny paper chairs flank the aisle, three deep on each
     side, seen from behind. Far rows are smaller and rise first. */
  var CHAIR_SVG = '<svg viewBox="0 0 34 50" aria-hidden="true">'
    + '<rect x="3" y="2" width="28" height="8" rx="3" fill="#fbf7ec" stroke="#d8c69c" stroke-width="1"/>'
    + '<rect x="6" y="15" width="4" height="15" fill="#f3ecd9"/>'
    + '<rect x="15" y="15" width="4" height="15" fill="#f3ecd9"/>'
    + '<rect x="24" y="15" width="4" height="15" fill="#f3ecd9"/>'
    + '<rect x="3" y="11" width="28" height="4" fill="#e8a7b8" opacity=".85"/>'
    + '<rect x="4" y="32" width="26" height="6" rx="2" fill="#efe6cf"/>'
    + '<rect x="5" y="38" width="3.5" height="11" fill="#e7dcc0"/>'
    + '<rect x="25.5" y="38" width="3.5" height="11" fill="#e7dcc0"/>'
    + '</svg>';
  /* x, y on the lawn · base scale · rise window — rows sit far enough
     up the lawn (and stand tall enough) to clear the slid-down envelope
     front's top edge once open */
  var CHAIR_SPOTS = [
    { x:130, y:98,  s:.75, start:.05, end:.30 },
    { x:250, y:98,  s:.75, start:.09, end:.34 },
    { x:114, y:124, s:.88, start:.14, end:.40 },
    { x:266, y:124, s:.88, start:.18, end:.44 },
    { x:98,  y:146, s:1.0, start:.23, end:.50 },
    { x:282, y:146, s:1.0, start:.27, end:.54 }
  ];
  var chairBox = document.getElementById('chairBox');
  var chairs = [];
  CHAIR_SPOTS.forEach(function(spot){
    var c = document.createElement('div');
    c.className = 'chair';
    c.style.left = spot.x + 'px';
    c.style.top = spot.y + 'px';
    var stand = document.createElement('div');
    stand.className = 'chairStand';
    stand.innerHTML = CHAIR_SVG;
    c.appendChild(stand);
    chairBox.appendChild(c);
    chairs.push({ stand:stand, spot:spot });
  });

  /* ---------- the roses ----------
     They climb the arch one by one: up the left post, over the curve,
     down the right post — white and blush alternating. Positions are in
     the arch standee's own 210x188 space, so they ride it as it grows. */
  var ROSE_SPOTS = [
    [23,160], [23,126], [25,92], [50,54], [78,32], [105,24],
    [132,32], [160,54], [185,92], [187,126], [187,160]
  ];
  var roseBox = document.getElementById('roseBox');
  var roses = [];
  ROSE_SPOTS.forEach(function(spot, i){
    var r = document.createElement('div');
    r.className = 'rose ' + (i % 2 ? 'blush' : 'white');
    r.style.left = spot[0] + 'px';
    r.style.top = spot[1] + 'px';
    roseBox.appendChild(r);
    roses.push({ el:r, start:.64 + i * .026 });
  });

  function applyRise(){
    /* the ceremony hides inside the envelope while settled shut: it
       fades in as it rises (the Sea Card's tank trick) */
    wedWrap.style.opacity = Math.min(1, rise / 0.12).toFixed(3);
    wedWrap.style.visibility = rise <= 0.001 ? 'hidden' : 'visible';
    /* chairs pop up row by row */
    for (var i=0;i<chairs.length;i++){
      var c = chairs[i];
      var cp = clamp01((rise - c.spot.start) / (c.spot.end - c.spot.start));
      c.stand.style.transform = 'rotateX(-90deg) scale(' + (cp * c.spot.s).toFixed(3) + ')';
    }
    /* the arch assembles: posts and curve grow up from the lawn */
    var ap = smooth(clamp01((rise - .36) / .34));
    archStand.style.transform = 'rotateX(-90deg) scale(' + ap.toFixed(3) + ')';
    /* roses bloom along the arch one by one */
    for (var k=0;k<roses.length;k++){
      var rp = clamp01((rise - roses[k].start) / .07);
      roses[k].el.style.transform = 'scale(' + rp.toFixed(3) + ')';
    }
    /* the rings appear last, hanging at the arch's center */
    var gp = clamp01((rise - .88) / .12);
    rings.style.opacity = gp.toFixed(3);
    rings.style.transform = 'scale(' + (0.6 + 0.4 * gp).toFixed(3) + ')';
    /* golden light pooled on the lawn as the ceremony rises */
    wedGlow.style.opacity = (rise * 0.38).toFixed(3);
  }

  /* ---------- main loop ---------- */
  var last = performance.now();
  function tick(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    rise += (target - rise) * Math.min(1, dt * 2.6);
    if (Math.abs(target - rise) < 0.0015) rise = target;
    applyRise();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- interaction ----------
     Open:  seal breaks -> flap swings -> envelope slides down-front ->
            card stands -> lawn and chairs rise, the arch assembles,
            roses climb it, rings appear (target set at 850ms).
     Close: the ceremony settles first -> card folds -> envelope
            returns -> flap swings shut -> seal reappears (CSS delays). */
  var choreoTimer = null;
  function toggle(){
    opened = !opened;
    world.classList.toggle('open', opened);
    fit();
    if (choreoTimer){ clearTimeout(choreoTimer); choreoTimer = null; }
    if (opened){
      pill.style.opacity = '0';
      choreoTimer = setTimeout(function(){ target = 1; }, 850);
    } else {
      target = 0;
      choreoTimer = setTimeout(function(){ pill.style.opacity = '1'; }, 1900);
    }
  }
  document.addEventListener('click', toggle);
  document.addEventListener('touchend', function(e){ e.preventDefault(); toggle(); }, { passive:false });

  /* ---------- fit to screen ----------
     Identical to the Sea Card: the open visual span (standing card's top
     to the slid-down base's bottom) is ~510 world units centered ~33
     units above the layout box, so the open fit uses the taller divisor
     and the 33-unit settle; the closed fit is the plain centered one. */
  function fit(){
    var isOpen = world.classList.contains('open');
    var s = Math.min(window.innerWidth / 660, window.innerHeight / (isOpen ? 590 : 530));
    var ty = isOpen ? 33 : 0;
    world.style.transform = 'scale(' + s.toFixed(3) + ') translateY(' + ty + 'px)';
  }
  window.addEventListener('resize', fit);
  fit();
  applyRise();

  /* QA hooks (harmless): #risen = fully open instantly, #mid = half-open */
  if (location.hash === '#risen'){
    opened = true; target = 1; rise = 1;
    world.classList.add('open'); document.body.classList.add('qa');
    pill.style.opacity = '0';
    applyRise(); fit();
  }
  if (location.hash === '#mid'){
    opened = true; target = 0.52; rise = 0.52;
    world.classList.add('open', 'qa-mid'); document.body.classList.add('qa');
    pill.style.opacity = '0'; applyRise(); fit();
  }
})();
</script>
</body>
</html>
