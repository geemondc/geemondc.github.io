<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Birthday Table — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#4a2030; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.6); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#4a2030;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 11s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* sunlight breathing in through the windows */
  #sun { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite alternate;
         background:radial-gradient(55% 70% at 92% 30%, rgba(255,236,180,.34), rgba(255,236,180,.08) 55%, rgba(255,236,180,0) 78%); }
  @keyframes breathe { from { opacity:.55 } to { opacity:1 } }
  /* the balloon bunch sways — a soft sheen riding with it */
  #sheen { position:absolute; left:13%; top:22%; width:24%; aspect-ratio:1.1; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
           background:radial-gradient(closest-side, rgba(255,255,255,.34), rgba(255,255,255,0) 72%);
           animation:sway 6.5s ease-in-out infinite alternate; }
  @keyframes sway { from { transform:translate(-51.5%,-50%) rotate(-1.2deg) } to { transform:translate(-48.5%,-50%) rotate(1.2deg) } }
  /* six candle flames on the cake, each flickering on its own clock */
  .flame { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
           background:radial-gradient(closest-side, rgba(255,220,150,.95), rgba(255,180,90,.30) 55%, rgba(255,180,90,0) 78%);
           animation:flk ease-in-out infinite alternate; }
  @keyframes flk { from { transform:translate(-50%,-50%) scale(.85); filter:brightness(.8) } to { transform:translate(-50%,-50%) scale(1.15); filter:brightness(1.3) } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(74,20,40,.55); color:#ffe3ee; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,227,238,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #sun, #sheen, .flame { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="A birthday table with balloons, bunting, presents and a cake with lit candles">
    </div>
    <div id="sun"></div>
    <div id="sheen"></div>
    <div id="fx"></div>
    <div id="caption">THE BIRTHDAY TABLE</div>
  </div>
</div>
<script>
  // The party room, nobody home yet (Gary's living standard): the painting
  // stays exactly itself; the candles flicker, the balloons sway, and the
  // sunlight breathes. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    var flames = [[50.1,53.5],[51.6,53],[53.1,52.8],[54.4,52.8],[55.9,53],[57.5,53.5]];
    for (var j = 0; j < flames.length; j++){
      html += '<div class="flame" style="left:' + flames[j][0] + '%;top:' + flames[j][1] + '%;width:2.1%;aspect-ratio:1;animation-duration:' + (1.5 + (j % 4) * 0.45).toFixed(2) + 's;animation-delay:-' + (j * 0.4).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
