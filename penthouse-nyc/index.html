<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penthouse NYC — a Living Atmosphere</title>
<meta name="description" content="Penthouse NYC — a quiet room above the city lights, fire burning. A living atmosphere for a room.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#05070D; height:100%; }
  body { overflow:hidden; font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  .stage { position:fixed; inset:0; background:#05070D; }
  .frame { position:absolute; overflow:hidden; background:#05070D; }
  .frame img.base { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  .frame canvas.fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .glint { position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,244,214,.95) 0%, rgba(255,214,140,.35) 42%, rgba(255,214,140,0) 70%);
    mix-blend-mode:screen; opacity:0; }
  .neon { position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,120,220,.5) 0%, rgba(120,180,255,.22) 46%, rgba(255,120,220,0) 72%);
    mix-blend-mode:screen; opacity:0; }
  .fire { position:absolute; pointer-events:none; border-radius:50%;
    background:radial-gradient(ellipse 60% 100% at 50% 78%, rgba(255,236,190,.95) 0%, rgba(255,176,84,.55) 38%, rgba(255,110,40,.18) 62%, rgba(255,110,40,0) 78%);
    mix-blend-mode:screen; transform-origin:50% 82%; opacity:.8; }
  .vig { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 108% 96% at 50% 46%, transparent 66%, rgba(1,3,8,.34) 100%); }
  .top { position:fixed; top:0; left:0; right:0; padding:20px 22px 30px; pointer-events:none;
    background:linear-gradient(rgba(1,3,8,.5), transparent); color:#EAF2FF;
    opacity:1; transition:opacity 1.2s; }
  .top h1 { font-size:26px; font-weight:700; letter-spacing:.4px; }
  .top p { font-size:15.5px; color:#BFD2EE; margin-top:3px; max-width:560px; line-height:1.45; }
  .bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; justify-content:center; align-items:center;
    padding:16px 12px 20px; background:linear-gradient(transparent, rgba(1,3,8,.55));
    opacity:1; transition:opacity 1.2s; }
  .bbtn { font-size:17px; font-weight:700; padding:11px 20px; border-radius:999px; cursor:pointer;
    border:1.5px solid rgba(190,215,255,.55); background:rgba(8,14,28,.55); color:#EAF2FF; font-family:inherit;
    backdrop-filter:blur(4px); }
  .bbtn:hover { background:rgba(18,30,54,.65); }
  body.idle .top, body.idle .bar { opacity:0; }
  .hint { position:fixed; right:16px; bottom:74px; color:#9DB9DE; font-size:13.5px; opacity:.85; pointer-events:none;
    transition:opacity 1.2s; }
  body.idle .hint { opacity:0; }

  body.expanded .top, body.expanded .bar { display:none; }
  body.expanded .frame { left:0 !important; top:0 !important; width:100vw !important; height:100vh !important; }
  body.expanded .frame img.base, body.expanded .frame canvas.pool, body.expanded .frame canvas.fx { object-fit:contain; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame" id="frame">
    <img class="base" src="still1.jpg" alt="Penthouse NYC — a quiet room above the city lights, fire burning">
    <canvas class="fx" id="fx" width="1400" height="743"></canvas>
    <div class="vig"></div>
  </div>
</div>
<div class="bar">
  <button class="bbtn" id="btnPlay" onclick="togglePlay()">⏸</button>
  <button class="bbtn" id="btnMusic" onclick="toggleMusic()">🎵</button>
  <button class="bbtn" onclick="toggleFull()">⛶</button>
</div>
<audio id="scene" src="music1.mp3" loop preload="auto"></audio>
<script>
(function(){
  var stage = document.getElementById('stage'), frame = document.getElementById('frame');
  var IW = 1400, IH = 743;
  function seat(){
    // MAXIMIZE (Gary): the picture fills the screen — cover-fit, whole
    // photo still reachable in the Museum Frame view via the frame chip.
    var w = stage.clientWidth, h = stage.clientHeight, rw, rh;
    if (w / h > IW / IH) { rh = h; rw = h * IW / IH; } else { rw = w; rh = w * IH / IW; }   // FIT WHOLE (Gary): entire painting visible, never cropped
    frame.style.left = ((w - rw) / 2) + 'px'; frame.style.top = ((h - rh) / 2) + 'px';
    frame.style.width = rw + 'px'; frame.style.height = rh + 'px';
  }
  window.addEventListener('resize', seat); seat();
var CITY=[[56.4,45.9],[36.1,37.0],[11.9,55.5],[31.7,40.2],[34.5,50.1],[12.8,54.1],[28.1,26.4],[55.5,44.7],[13.6,48.6],[28.9,25.0],[68.4,40.2],[71.1,55.9],[31.1,39.6],[34.5,50.9],[35.9,45.8],[13.0,48.3],[35.0,47.2],[21.8,53.6],[21.1,53.7],[67.3,38.8],[24.0,43.7],[2.2,46.6],[68.9,41.3],[68.0,33.2],[2.8,25.3],[45.6,47.6],[74.4,56.7],[35.0,50.1],[68.6,41.3],[32.5,43.6],[20.0,41.6],[48.3,55.5],[69.6,56.3],[18.7,38.4],[21.9,57.3],[2.8,45.5],[68.3,37.0],[67.6,40.4],[34.3,49.3],[46.6,44.3],[18.4,41.5],[6.8,59.4],[36.6,34.5],[54.1,47.5],[19.3,47.1],[23.4,50.1],[10.2,59.5],[41.3,38.8],[18.9,41.9],[31.1,46.2],[31.1,40.2],[66.7,48.9],[28.4,40.6],[67.9,54.1],[38.2,53.3],[28.6,26.4],[53.6,51.1],[36.4,44.5],[18.9,47.2],[2.2,49.4],[67.6,53.3],[7.8,57.2],[57.5,46.2],[36.4,39.8],[63.9,50.5],[61.6,54.2],[67.4,48.7],[12.1,52.0],[19.9,39.6],[18.4,46.6],[11.6,58.4],[67.9,36.5],[19.9,38.5],[36.2,45.2],[48.6,49.4],[77.5,48.0],[54.6,52.9],[2.8,31.8],[36.1,37.7],[11.2,52.8],[19.3,49.7],[27.4,54.4],[7.9,48.2],[67.6,41.3],[10.3,57.2],[18.6,43.2],[2.2,53.6],[68.4,38.5],[19.9,42.9],[67.6,38.4],[10.7,54.2],[67.2,41.0],[10.1,53.4],[45.9,48.7],[68.8,55.7],[55.5,47.6],[11.2,53.6],[13.4,48.2],[63.9,46.4],[19.6,41.5],[32.0,41.7],[39.2,40.5],[16.2,47.9],[7.7,55.5],[69.3,46.6],[58.9,47.0],[22.7,50.1],[12.4,51.3],[68.5,53.3],[31.9,40.9],[66.1,45.1],[36.6,41.5],[27.5,40.5],[45.6,44.3],[37.7,51.8],[54.1,52.5],[2.8,53.6],[13.1,57.1],[19.2,44.3],[2.8,55.5],[28.2,56.1],[18.6,40.1],[22.2,59.4],[68.1,35.8],[54.9,54.5],[8.4,48.5],[35.7,44.4],[46.9,44.8],[26.2,54.8],[11.6,53.4],[12.4,55.6],[62.6,52.0],[51.2,51.4],[36.3,42.9],[5.6,48.2],[67.9,35.1],[11.6,59.4],[11.1,51.3],[55.5,45.5],[4.8,34.7],[70.7,44.4],[67.3,40.1],[39.3,41.7],[19.3,45.8],[51.5,51.8],[10.9,57.1],[54.9,55.2],[35.6,42.9],[10.7,52.9],[32.3,42.9],[11.1,55.6],[18.6,52.1],[39.2,43.3],[46.4,49.1],[36.1,34.9],[46.9,48.5],[68.0,34.5],[72.1,48.0],[19.3,46.4],[35.6,33.2],[35.9,41.7],[8.9,58.8],[70.7,45.5],[2.3,36.3],[22.6,51.3],[69.6,57.2],[35.4,45.5],[57.4,47.1],[65.9,45.9],[32.1,55.2],[44.7,46.8],[32.6,46.6],[24.0,44.4],[47.4,46.3],[19.6,40.6],[11.9,51.3],[55.8,47.0],[21.2,52.8],[34.9,41.3],[39.2,44.3],[21.9,52.8],[25.8,46.6],[38.5,42.8],[41.7,39.3],[10.7,52.1],[28.4,45.1],[22.3,53.6],[30.6,48.2],[61.3,54.1],[35.8,37.4],[77.0,48.3],[30.8,55.0],[35.6,47.0],[37.3,47.8],[35.3,44.5],[37.8,49.3],[16.4,46.0],[37.8,59.0],[27.6,43.6],[8.4,56.7],[13.6,59.1],[46.5,46.6],[11.5,54.9],[15.8,54.0],[41.4,39.4],[70.4,56.7],[2.8,26.0],[21.4,57.5],[35.5,41.7],[71.0,43.2],[68.4,39.6],[35.9,40.8],[44.7,46.2],[16.7,47.9],[69.1,56.4],[31.0,42.9],[11.6,56.9],[20.0,40.8],[25.7,50.1],[37.4,58.7]];
  var STARS=[[47.5,1.2],[44.5,1.9],[8.1,1.9],[45.0,4.0],[49.6,4.3],[42.7,4.4],[73.6,1.7],[48.6,5.1],[44.9,10.1],[60.1,10.5],[45.9,8.1],[48.9,3.4],[41.5,10.4],[42.6,7.5],[49.4,5.8],[42.9,9.0],[42.1,9.0],[41.2,5.8]];
  var GLINTS=[[91.6,65.0,6],[98.1,69.6,8],[93.3,69.2,10],[3.9,87.8,6],[96.9,65.3,8],[95.3,63.1,10],[93.9,60.4,6],[95.8,68.9,8]];

  var cv = document.getElementById('fx'), cx = cv.getContext('2d');
  function speckles(t){
    cx.clearRect(0, 0, IW, IH);
    var i, d, x, y, s, a, r, g;
    for (i = 0; i < CITY.length; i++){
      d = CITY[i]; x = d[0]/100*IW; y = d[1]/100*IH;
      s = 0.5 - 0.5*Math.cos(2*Math.PI*t/(0.9+(i*37%13)*0.19) + i*1.93);
      s = s*s*(3-2*s); a = 0.12 + 0.42*s; r = 0.9 + 1.1*s;
      g = cx.createRadialGradient(x,y,0,x,y,r*3);
      g.addColorStop(0,'rgba(255,236,190,'+a.toFixed(3)+')'); g.addColorStop(1,'rgba(255,236,190,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(x,y,r*3,0,Math.PI*2); cx.fill();
    }
    for (i = 0; i < STARS.length; i++){
      d = STARS[i]; x = d[0]/100*IW; y = d[1]/100*IH;
      s = 0.5 - 0.5*Math.cos(2*Math.PI*t/(1.7+(i*41%9)*0.35) + i*2.41);
      s = s*s*(3-2*s); a = 0.05 + 0.4*s;
      cx.fillStyle = 'rgba(235,242,255,'+a.toFixed(3)+')';
      cx.beginPath(); cx.arc(x,y,1.15,0,Math.PI*2); cx.fill();
    }
  }
  var glints = GLINTS.map(function(s, i){
    var d = document.createElement('div'); d.className = 'glint';
    d.style.left = s[0]+'%'; d.style.top = s[1]+'%';
    d.style.width = (s[2]*2.2)+'px'; d.style.height = (s[2]*2.2)+'px';
    d.style.transform = 'translate(-50%,-50%)'; frame.appendChild(d);
    return { el:d, per:2.2+((i*37)%10)*0.47, ph:((i*53)%17)/17*Math.PI*2, amp:.55+((i*29)%10)/22 };
  });
  var tongues = [];
  (function(){
    var box = [0.862, 0.475, 0.122, 0.155];
    for (var i = 0; i < 7; i++){
      var d = document.createElement('div'); d.className = 'fire';
      var fx2 = box[0] + box[2]*(0.06 + 0.88*i/6);
      d.style.left = (fx2*100)+'%'; d.style.top = (box[1]*100)+'%';
      d.style.width = (box[2]*0.34*100)+'%'; d.style.height = (box[3]*100)+'%';
      d.style.transform = 'translate(-50%,0)';
      frame.appendChild(d);
      tongues.push({ el:d, sp:1.1+((i*29)%7)*0.23, ph:i*1.37, base:0.82+((i*13)%5)*0.07 });
    }
  })();
  var t0 = performance.now();
  function tick(now){
    if (window.__frozen) { requestAnimationFrame(tick); return; }
    var t = (now - t0)/1000, i, g, v;
    for (i = 0; i < glints.length; i++){
      g = glints[i];
      v = 0.5 - 0.5*Math.cos(2*Math.PI*t/g.per + g.ph); v = v*v*(3-2*v);
      g.el.style.opacity = (v*g.amp).toFixed(3);
    }
    for (i = 0; i < tongues.length; i++){
      var tg = tongues[i];
      var hgt = tg.base + 0.42*Math.sin(t*tg.sp*2.6 + tg.ph) + 0.2*Math.sin(t*tg.sp*6.1 + tg.ph*2.0);
      var lean = 16*Math.sin(t*tg.sp*1.6 + tg.ph*1.4) + 7*Math.sin(t*tg.sp*4.3 + tg.ph);
      tg.el.style.transform = 'translate(-50%,0) scaleY('+hgt.toFixed(3)+') skewX('+lean.toFixed(2)+'deg)';
      tg.el.style.opacity = (0.66 + 0.3*(0.5+0.5*Math.sin(t*tg.sp*4.1+tg.ph))).toFixed(3);
    }
    speckles(t);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.LP = { state: function(){ return { city: CITY.length, stars: STARS.length, glints: glints.length, tongues: tongues.length }; } };

  var audio = document.getElementById('scene');
  var btnM = document.getElementById('btnMusic');
  window.togglePlay = function(){
    window.__frozen = !window.__frozen;
    document.getElementById('btnPlay').textContent = window.__frozen ? '▶' : '⏸';
  };
  window.toggleMusic = function(){
    if (audio.paused) { audio.play(); btnM.textContent = '🔇'; }
    else { audio.pause(); btnM.textContent = '🎵'; }
  };
  var expanded = false;
  window.toggleFull = function(){
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function(){ expandFallback(); });
    } else { expandFallback(); }
  };
  function expandFallback(){
    expanded = !expanded;
    document.body.classList.toggle('expanded', expanded);
    seat();
  }
  var idleTimer = null;
  function wake(){
    document.body.classList.remove('idle');
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 5000);
  }
  ['mousemove','touchstart','keydown','click'].forEach(function(ev){ window.addEventListener(ev, wake, {passive:true}); });
  wake();
})();
</script>
</body>
</html>
