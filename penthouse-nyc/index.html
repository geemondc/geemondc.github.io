    for (i = 0; i < halos.length; i++){
      var hh = halos[i];
      var hv = 0.5 - 0.5*Math.cos(2*Math.PI*t/hh.per + hh.ph); hv = hv*hv*(3-2*hv);
      hh.el.style.opacity = (hv*0.85).toFixed(3);
    }
    for (i = 0; i < tongues.length; i++){
      var tg = tongues[i];
      var hgt = tg.base + 0.42*Math.sin(t*tg.sp*2.6 + tg.ph) + 0.2*Math.sin(t*tg.sp*6.1 + tg.ph*2.0);
      var lean = 16*Math.sin(t*tg.sp*1.6 + tg.ph*1.4) + 7*Math.sin(t*tg.sp*4.3 + tg.ph);
      tg.el.style.animationDuration = (0.85 + tg.sp*0.55).toFixed(2)+'s';
      tg.el.style.animationDelay = (-tg.ph).toFixed(2)+'s';
      tg.el.style.opacity = (0.7 + 0.26*Math.sin(t*tg.sp*3.4 + tg.ph*1.7)).toFixed(3);
    }
    var _ph = phaseAt(t); applyPh(_ph[0], _ph[1], _ph[2]);
    var litF = Math.max(0, Math.min(1, (_ph[2] + _ph[1] - 0.18) / 0.6)) * (1 - Math.max(0, (_ph[0] - 0.92) / 0.08));
    for (i = 0; i < flames.length; i++){
      var fl = flames[i];
      if (!window.__candleVis) { fl.el.style.opacity = '0'; continue; }
      var fh = fl.base + 0.34*Math.sin(t*fl.sp*3.1 + fl.ph) + 0.16*Math.sin(t*fl.sp*7.3 + fl.ph*2.3);
      var flean = 11*Math.sin(t*fl.sp*1.9 + fl.ph*1.6) + 5*Math.sin(t*fl.sp*5.1 + fl.ph);
      fl.el.style.animationDuration = (0.9 + fl.sp*0.5).toFixed(2)+'s';
      fl.el.style.animationDelay = (-fl.ph).toFixed(2)+'s';
      fl.el.style.opacity = (litF * (0.66 + 0.3*Math.sin(t*fl.sp*4.2 + fl.ph*1.8))).toFixed(3);
    }
    speckles(t);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.LP = { state: function(){ return { city: CITY.length, stars: STARS.length, glints: glints.length, tongues: tongues.length, flames: flames.length, cycle: PH_CYCLE }; }, phase: window.__LPphase };

  var audio = document.getElementById('scene');
  var btnM = document.getElementById('btnMusic');
  window.togglePlay = function(){
    window.__frozen = !window.__frozen;
    document.getElementById('btnPlay').textContent = window.__frozen ? '▶' : '⏸';
  };
  window.toggleMusic = function(){
    if (audio.paused) { audio.play(); btnM.textContent = '🔇'; }
    else { audio.pause(); btnM.textContent = '🎵'; }
  };
  var expanded = false;
  window.toggleFull = function(){
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function(){ expandFallback(); });
    } else { expandFallback(); }
  };
  function expandFallback(){
    expanded = !expanded;
    document.body.classList.toggle('expanded', expanded);
    seat();
  }
  var idleTimer = null;
  function wake(){
    document.body.classList.remove('idle');
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 5000);
  }
  ['mousemove','touchstart','keydown','click'].forEach(function(ev){ window.addEventListener(ev, wake, {passive:true}); });
  wake();
})();
</script>
