<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Pop-Up Tree — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#062417; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('plate-empty.webp') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#062417;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  /* PASS 5: the perspective now lives on #drift (the stage's parent), so
     the STAGE ITSELF is projected in true 3D — passes 2-4 set perspective
     on #popup, which flattened the stage's own tilt into an orthographic
     squash and collapsed all the depth the pieces had. */
  #drift { position:absolute; inset:0; perspective:1100px; }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; opacity:0; }
  /* THE POP-UP (Nov 23; PASS 3 doctrine: THE STACK IS THE CARD — no
     crossfade to still.jpg, the held state is the risen paper stack.
     PASS 5 — THE GEOMETRY PASS (Gary's verdicts: pass 3 "not great but a
     little better", pass 4's full diorama "Little improving. Need more
     pop up effect for final"): piece count was never the bottleneck —
     VIEWPOINT was. The stage sat nearly flat-on (residual tilt 6deg,
     rendered without perspective), pieces landed on their footprints at
     near-painting scales, the camera never moved. Now:
     - #popup IS THE PAGE: a cream card-stock sheet overscanned past the
       frame (inset -10% -6%), tilted a held rotateX(23deg) in true
       perspective for the card's whole life — the open-book angle.
     - #stage is the painting area centred on the page (the cream margin
       around it is the book frame); plate + pieces inside keep their
       painting coordinates.
     - preserve-3d runs drift -> popup -> stage, and the layers are
       separated in Z by depth (skyline 5px ... snowdrift 55px), landing
       at harder graduated scales (1.0 back -> 1.22 front) with a slight
       lift off their footprints, so pieces stand perpendicular to the
       PAGE and project toward the viewer.
     - A slow one-way camera push-in (stage scale x1.10 over ~7s,
       ease-out, timer-landed, never loops) makes the Z-separated layers
       parallax as it settles.
     - Each piece lands with a small decaying paper wobble, and its
       cast shadow stretches long while it rises, shortening as it
       stands. Every landing is ALSO written by a plain setTimeout as an
       inline !important style (the tapfix3 discipline). */
  #popup { position:absolute; inset:-10% -6%; pointer-events:none; transform-origin:50% 50%;
           transform-style:preserve-3d; will-change:transform;
           transform:rotateX(23deg) translateY(1.5%) scale(1.03);
           background:linear-gradient(165deg, #f7eed6 0%, #f1e4c3 55%, #ead9b0 100%); }
  #stage { position:absolute; left:5.357%; top:8.333%; width:89.286%; height:83.333%; transform-style:preserve-3d; }
  #plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transform:translateZ(1px); }
  .pulayer { position:absolute; will-change:transform,opacity; opacity:0; }
  .pulayer img { width:100%; height:100%; display:block; }
  #puTree { left:30%; top:5%; width:45%; height:62%; transform-origin:50% 100%; transform:translateZ(29px) rotateX(72deg); }
  #puFg { left:0; top:38%; width:100%; height:62%; transform-origin:50% 100%; transform:translateZ(43px) rotateX(66deg); }
  #puStar { left:44.5%; top:0; width:11%; height:9.5%; transform-origin:50% 100%; transform:translateZ(29px) rotateX(84deg); }
  .pucast { position:absolute; will-change:transform,opacity; opacity:0; pointer-events:none; }
  .pucast img { width:100%; height:100%; display:block; filter:brightness(0) blur(5px); }
  #puTreeCast { left:30%; top:5%; width:45%; height:62%; transform-origin:50% 100%; transform:translateZ(27px) rotateX(72deg); }
  #puFgCast { left:0; top:38%; width:100%; height:62%; transform-origin:50% 100%; transform:translateZ(41px) rotateX(66deg); }
  #puStarCast { left:44.5%; top:0; width:11%; height:9.5%; transform-origin:50% 100%; transform:translateZ(27px) rotateX(84deg); }
  .pushadow { position:absolute; border-radius:50%; pointer-events:none; opacity:0; transform:translateZ(3px);
              background:radial-gradient(closest-side, rgba(2,10,6,.55), rgba(2,10,6,0) 72%); }
  #shTree { left:31%; top:58.5%; width:42%; height:9%; }
  #shFg { left:6%; top:93%; width:88%; height:7%; }
  /* PASS 4 PIECES (Nov 23 — Gary: "more stuff needs to pop up not just the
     friends"): skyline strip, church, left + right shop rows, the two
     lampposts, tree / friends, a snowdrift lip in front, and the star.
     Boxes are the pieces' cut boxes in the 1600x900 painting. PASS 5 adds
     each piece's folded base transform with its Z depth (see script). */
  #puSky { left:0; top:4%; width:100%; height:34.9%; transform-origin:50% 100%; transform:translateZ(5px) rotateX(72deg); }
  #puChurch { left:61.6%; top:0.9%; width:18.4%; height:53%; transform-origin:50% 100%; transform:translateZ(15px) rotateX(72deg); }
  #puShopsL { left:0; top:17.8%; width:21.9%; height:50.6%; transform-origin:50% 100%; transform:translateZ(15px) rotateX(72deg); }
  #puShopsR { left:77.5%; top:10.6%; width:22.5%; height:57.8%; transform-origin:50% 100%; transform:translateZ(15px) rotateX(72deg); }
  #puLampL { left:0; top:4%; width:6.75%; height:67.7%; transform-origin:50% 100%; transform:translateZ(21px) rotateX(72deg); }
  #puLampR { left:92.25%; top:19.6%; width:7.75%; height:58.8%; transform-origin:50% 100%; transform:translateZ(21px) rotateX(72deg); }
  #puDrift { left:0; top:79.4%; width:100%; height:20.6%; transform-origin:50% 100%; transform:translateZ(55px) rotateX(72deg); }
  #puSkyCast { left:0; top:4%; width:100%; height:34.9%; transform-origin:50% 100%; transform:translateZ(3px) rotateX(72deg); }
  #puChurchCast { left:61.6%; top:0.9%; width:18.4%; height:53%; transform-origin:50% 100%; transform:translateZ(13px) rotateX(72deg); }
  #puShopsLCast { left:0; top:17.8%; width:21.9%; height:50.6%; transform-origin:50% 100%; transform:translateZ(13px) rotateX(72deg); }
  #puShopsRCast { left:77.5%; top:10.6%; width:22.5%; height:57.8%; transform-origin:50% 100%; transform:translateZ(13px) rotateX(72deg); }
  #puLampLCast { left:0; top:4%; width:6.75%; height:67.7%; transform-origin:50% 100%; transform:translateZ(19px) rotateX(72deg); }
  #puLampRCast { left:92.25%; top:19.6%; width:7.75%; height:58.8%; transform-origin:50% 100%; transform:translateZ(19px) rotateX(72deg); }
  #puDriftCast { left:0; top:79.4%; width:100%; height:20.6%; transform-origin:50% 100%; transform:translateZ(53px) rotateX(72deg); }
  #shSky { left:3%; top:37.5%; width:94%; height:5%; }
  #shChurch { left:62%; top:51.5%; width:18%; height:5%; }
  #shShopsL { left:1.5%; top:65.5%; width:19%; height:5.5%; }
  #shShopsR { left:79%; top:65.5%; width:20%; height:5.5%; }
  #shLampL { left:0.8%; top:69.5%; width:5.5%; height:3.5%; }
  #shLampR { left:93%; top:76.5%; width:6%; height:3.5%; }
  #shDrift { left:5%; top:96.5%; width:90%; height:3.5%; }
  /* BLOOM TWINS (pass 3): transparent overlays with the tree / star layers'
     exact boxes and transform origins. At bloom time the script lands each
     twin at its layer's landed transform (at a Z just above the friends
     layer, so base-tier bulbs are never swallowed by the friends' heads),
     so bulbs + star glow ride the risen paper geometry. */
  .publm { position:absolute; pointer-events:none; }
  #puBloomTree { left:30%; top:5%; width:45%; height:62%; transform-origin:50% 100%; }
  #puBloomStar { left:44.5%; top:0; width:11%; height:9.5%; transform-origin:50% 100%; }
  .tlb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%); opacity:0;
        animation:twk ease-in-out infinite alternate, tlBloomIn 1.1s ease forwards; }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.55); filter:brightness(.65) } to { transform:translate(-50%,-50%) scale(1.5); filter:brightness(1.4) } }
  @keyframes tlBloomIn { from { opacity:0 } to { opacity:1 } }
  #starGlow { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%); opacity:0;
        background:radial-gradient(closest-side, rgba(255,230,150,.95), rgba(255,196,80,.4) 55%, rgba(255,180,80,0) 78%);
        animation:tlStarBloom 4.6s ease forwards, tlStarPulse 3.4s ease-in-out 4.6s infinite alternate; }
  @keyframes tlStarBloom { 0% { opacity:0; transform:translate(-50%,-50%) scale(.55) } 78% { opacity:0; transform:translate(-50%,-50%) scale(.55) } 90% { opacity:1; transform:translate(-50%,-50%) scale(1.28) } 100% { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } }
  @keyframes tlStarPulse { from { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } to { opacity:1; transform:translate(-50%,-50%) scale(1.24) } }
  #snow { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .flake { position:absolute; top:-4%; border-radius:50%; pointer-events:none;
           background:radial-gradient(closest-side, rgba(255,255,255,.98), rgba(235,245,255,.55) 60%, rgba(235,245,255,0) 80%);
           animation:tlFall linear infinite; will-change:transform; }
  @keyframes tlFall { 0% { transform:translate(0,-4vh); opacity:0 } 6% { opacity:1 } 50% { transform:translate(1.2vw,52vh) } 94% { opacity:1 } 100% { transform:translate(-0.8vw,106vh); opacity:0 } }
  /* BLOOM GUARANTEE (Nov 22 tapfix3, inherited): a bulb's lit state is NOT
     left to its CSS animation. Per-tier JS timers in the script below set
     each bulb's inline opacity with !important at the moment its bloom-in
     animation lands, the star likewise, so the full lit tree arrives by ~5s
     even if every animation timeline in this iframe is frozen or never
     painted. The animations remain as the build effect in healthy browsers;
     the timers are the guarantee. */
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(6,42,22,.58); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; }
  body.wall #caption { display:none; }
  /* PASS 5 book frame: a soft inner shadow over the page edges so the
     construction reads as a paper page mounted in a card. */
  #frame::after { content:''; position:absolute; inset:0; z-index:6; pointer-events:none;
                  box-shadow:inset 0 0 34px rgba(24,14,2,.34), inset 0 0 7px rgba(24,14,2,.22); }
  @media (prefers-reduced-motion: reduce) { #snow { display:none; } .tlb, #starGlow { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends in a snowy village square at blue dusk, cocoa mugs in hand, gathered before a giant Christmas tree hung with ornaments and topped with a gold star — the moment just before the lights come on; lampposts glowing at both sides, the church steeple behind, snow falling">
      <div id="popup">
       <div id="stage">
        <img id="plate" src="plate-empty.webp" alt="">
        <div class="pushadow" id="shSky"></div>
        <div class="pucast" id="puSkyCast"><img src="layer-skyline.webp" alt=""></div>
        <div class="pulayer" id="puSky"><img src="layer-skyline.webp" alt=""></div>
        <div class="pushadow" id="shChurch"></div>
        <div class="pucast" id="puChurchCast"><img src="layer-church.webp" alt=""></div>
        <div class="pulayer" id="puChurch"><img src="layer-church.webp" alt=""></div>
        <div class="pushadow" id="shShopsL"></div>
        <div class="pucast" id="puShopsLCast"><img src="layer-shopsl.webp" alt=""></div>
        <div class="pulayer" id="puShopsL"><img src="layer-shopsl.webp" alt=""></div>
        <div class="pushadow" id="shShopsR"></div>
        <div class="pucast" id="puShopsRCast"><img src="layer-shopsr.webp" alt=""></div>
        <div class="pulayer" id="puShopsR"><img src="layer-shopsr.webp" alt=""></div>
        <div class="pushadow" id="shLampL"></div>
        <div class="pucast" id="puLampLCast"><img src="layer-lampl.webp" alt=""></div>
        <div class="pulayer" id="puLampL"><img src="layer-lampl.webp" alt=""></div>
        <div class="pushadow" id="shLampR"></div>
        <div class="pucast" id="puLampRCast"><img src="layer-lampr.webp" alt=""></div>
        <div class="pulayer" id="puLampR"><img src="layer-lampr.webp" alt=""></div>
        <div class="pushadow" id="shTree"></div>
        <div class="pucast" id="puTreeCast"><img src="layer-tree.webp" alt=""></div>
        <div class="pulayer" id="puTree"><img src="layer-tree.webp" alt=""></div>
        <div class="pushadow" id="shFg"></div>
        <div class="pucast" id="puFgCast"><img src="layer-fg.webp" alt=""></div>
        <div class="pulayer" id="puFg"><img src="layer-fg.webp" alt=""></div>
        <div class="pushadow" id="shDrift"></div>
        <div class="pucast" id="puDriftCast"><img src="layer-drift.webp" alt=""></div>
        <div class="pulayer" id="puDrift"><img src="layer-drift.webp" alt=""></div>
        <div class="pucast" id="puStarCast"><img src="layer-star.webp" alt=""></div>
        <div class="pulayer" id="puStar"><img src="layer-star.webp" alt=""></div>
        <div class="publm" id="puBloomTree"></div>
        <div class="publm" id="puBloomStar"></div>
       </div>
      </div>
    </div>
    <div id="fx"></div>
    <div id="snow"></div>
    <div id="caption">THE POP-UP TREE</div>
  </div>
</div>
<script>
  // The Pop-Up Tree (Nov 23; pass 3 same day; FULL DIORAMA pass 4; GEOMETRY
  // pass 5): the Tree Lighting painting, presented as a pop-up book. Over
  // an EMPTY BACKDROP the painting RISES in layers — skyline, church, shop
  // rows, lampposts, tree, friends, snowdrift, and the star pops in last.
  // PASS 3 DOCTRINE: the risen stack IS the card — no crossfade to the
  // flat painting, no photo treatments; the tap (the parent's tap rig
  // posts 'lc-bloom') lights the PAPER tree: bulbs ride a twin overlay
  // carrying the tree layer's own landed transform, the star glow a twin
  // carrying the star's. PASS 5 GEOMETRY: the cream page (#popup) is
  // overscanned past the frame and held at a true-perspective
  // rotateX(23deg) open-book angle for the card's whole life; the layers
  // sit in ONE preserve-3d space at Z depths by distance (skyline 5px,
  // church/shops 15, lampposts 21, tree 29, friends 43, snowdrift 55 —
  // the brief's 0/10/16/24/38/50 ladder lifted +5 so nothing renders
  // behind the page's own cream plane), land at graduated scales
  // (1.0 -> 1.22) with a slight lift off their footprints, wobble once
  // like card stock as they land, and throw long cast shadows while
  // rising. A one-way camera push-in (stage scale x1.10 over ~7s,
  // ease-out, timer-landed, never loops) parallaxes the layers as it
  // settles. In #wall the caption hides. Bloom machinery below is the
  // treelighting scene's, unchanged: tiers land bottom-first by
  // animation, guaranteed by plain timers writing inline opacity
  // !important.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var embedded = document.body.classList.contains('wall');
    var bloomHtml = '', starHtml = '';
    var palette = ['255,209,102', '255,89,100', '126,217,87', '255,243,196', '255,166,66'];
    /* PASS 3: the bulbs are NOT positioned in frame coordinates any more.
       They live in #puBloomTree, a twin of the tree layer (box left 30%,
       top 5%, width 45%, height 62% of the painting) that lands with the
       tree layer's own transform — so each bulb's position is converted
       from frame % into tree-box % here: left (x-30)/45, top (y-5)/62,
       width size/45 (width % resolves against the box width, top %
       against its height; aspect-ratio keeps the bulb round at the same
       pixel size). */
    function light(x, y, ci, size, dur, phase, bloom){
      var c = palette[ci % palette.length];
      var lx = ((x - 30) / 45 * 100).toFixed(2), ly = ((y - 5) / 62 * 100).toFixed(2), lw = (size / 45 * 100).toFixed(2);
      return '<div class="tlb" style="left:' + lx + '%;top:' + ly + '%;width:' + lw + '%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(' + c + ',.98), rgba(' + c + ',.34) 55%, rgba(' + c + ',0) 78%);animation-duration:' + dur + 's,1.1s;animation-delay:-' + phase + 's,' + bloom + 's"></div>';
    }
    // tree lights — tiers over the tree, in FRAME coordinates (apex x~50%, widening to x 33-66% at the base, y 3-62%), converted by light(); bloom delay rises tier by tier, bottom first, spiraling up
    var tiers = [
      { d: 0.30, pts: [[36,59],[43,60],[50,59],[57,60],[64,59]] },
      { d: 0.90, pts: [[37,51],[44,52],[51,51],[58,52],[63,51]] },
      { d: 1.50, pts: [[39,43],[46,44],[53,43],[60,44]] },
      { d: 2.10, pts: [[41,35],[48,36],[55,35],[61,36]] },
      { d: 2.70, pts: [[43,27],[50,28],[57,27]] },
      { d: 3.30, pts: [[45,19],[52,20],[56,19]] },
      { d: 3.80, pts: [[47,11],[53,12]] }
    ];
    var n = 0, tierInfo = [];
    for (var t = 0; t < tiers.length; t++){
      for (var i = 0; i < tiers[t].pts.length; i++){
        var p = tiers[t].pts[i];
        bloomHtml += light(p[0], p[1], n, (0.8 + (n % 3) * 0.22).toFixed(2), (1.5 + (n % 5) * 0.35).toFixed(2), (n * 0.37).toFixed(2), (tiers[t].d + i * 0.06).toFixed(2));
        n++;
      }
      /* when this tier's last bulb's bloom-in lands: tier delay + last step + 1.1s */
      tierInfo.push({ count: tiers[t].pts.length, at: tiers[t].d + (tiers[t].pts.length - 1) * 0.06 + 1.1 });
    }
    // the star's glow — blooms in last, then breathes. PASS 3: it lives in
    // #puBloomStar, the star layer's twin (box left 44.5%, top 0, width
    // 11%, height 9.5%); the star art sits at ~(49%, 44%) inside its cut
    // (alpha bbox 21-152 x 0-74 of 176x85), and width 45% of the twin's
    // width ≈ the old 5%-of-frame glow diameter.
    starHtml = '<div id="starGlow" style="left:49%;top:44%;width:45%;aspect-ratio:1"></div>';

    /* ================= THE POP-UP RISE (pass 5 geometry) =================
       The folded state lives under the same held 23deg page tilt (the
       tilt is #popup's CSS base transform). goRise() starts the one-way
       CAMERA PUSH-IN (stage scale 1.03 -> 1.133, i.e. x1.10, over 7s
       ease-out, timer-landed at 7050ms — it settles and stops dead) and
       springs TEN pieces upright back-to-front — skyline .1s, church +
       shops .4s, lampposts .7s, tree 1.0s, friends 1.5s, snowdrift 1.9s,
       star 2.2s/.75s with a big overshoot bounce and a shadow pulse as
       it locks. Each piece lands at its Z depth with its graduated
       scale and lift, wobbles once (+2.5 -> -1.5 -> +0.6 -> 0 over
       .9s), and its cast-shadow twin stretches LONG across the page
       while it rises (offset -7%,11% and +7px of extra blur) and
       shortens to the held shadow as it stands. PASS 3 DOCTRINE HOLDS:
       that is where the motion stops — the tilt, the Z separation and
       the scales hold for the card's whole life, 'lc-risen' is posted,
       and the bloom later lights the stack in place. There is no
       crossfade and #popup is never hidden. Every landing is ALSO
       written by a plain timer as an inline !important style (the
       tapfix3 discipline): if every WAAPI timeline in this iframe
       froze, the timers alone still stand the scene up at its
       separated pose, settle the stage at the pushed-in scale, and
       post the ack. 'lc-dark' folds everything flat again for a
       replay. */
    var popup = document.getElementById('popup');
    var stillImg = document.getElementById('still'), plateImg = document.getElementById('plate');
    var puTree = document.getElementById('puTree'), puFg = document.getElementById('puFg'), puStar = document.getElementById('puStar');
    var puTreeCast = document.getElementById('puTreeCast'), puFgCast = document.getElementById('puFgCast'), puStarCast = document.getElementById('puStarCast');
    var shTree = document.getElementById('shTree'), shFg = document.getElementById('shFg');
    /* PASS 4 pieces */
    var puSky = document.getElementById('puSky'), puChurch = document.getElementById('puChurch'),
        puShopsL = document.getElementById('puShopsL'), puShopsR = document.getElementById('puShopsR'),
        puLampL = document.getElementById('puLampL'), puLampR = document.getElementById('puLampR'),
        puDrift = document.getElementById('puDrift');
    var puSkyCast = document.getElementById('puSkyCast'), puChurchCast = document.getElementById('puChurchCast'),
        puShopsLCast = document.getElementById('puShopsLCast'), puShopsRCast = document.getElementById('puShopsRCast'),
        puLampLCast = document.getElementById('puLampLCast'), puLampRCast = document.getElementById('puLampRCast'),
        puDriftCast = document.getElementById('puDriftCast');
    var shSky = document.getElementById('shSky'), shChurch = document.getElementById('shChurch'),
        shShopsL = document.getElementById('shShopsL'), shShopsR = document.getElementById('shShopsR'),
        shLampL = document.getElementById('shLampL'), shLampR = document.getElementById('shLampR'),
        shDrift = document.getElementById('shDrift');
    /* If the empty backdrop ever fails to load, fall back to pass-1
       behaviour: the original painting itself is the backdrop. */
    if (plateImg){
      plateImg.addEventListener('error', function(){
        plateImg.style.display = 'none';
        stillImg.style.setProperty('opacity', '1', 'important');
      });
    }
    var puAnims = [], puTimers = [], risen = false, rising = false;
    function puLater(fn, ms){ puTimers.push(setTimeout(fn, ms)); }
    function puClear(){
      for (var i = 0; i < puTimers.length; i++) clearTimeout(puTimers[i]);
      puTimers = [];
      for (var j = 0; j < puAnims.length; j++){ try { puAnims[j].cancel(); } catch(e){} }
      puAnims = [];
    }
    function land(el, transform, opacity){
      el.style.setProperty('transform', transform, 'important');
      el.style.setProperty('opacity', opacity, 'important');
    }
    /* PASS 5 transform builder: T(z, rx, s, ty) — a piece at Z depth z,
       folded/standing at rotateX rx, scaled s, lifted ty (or none). The
       cast-shadow twin rides 2px behind its piece (CT) with its own
       down-left translate. STAGE strings must match #popup's CSS base. */
    function T(z, rx, s, ty){
      return 'translateZ(' + z + 'px) rotateX(' + rx + 'deg) scale(' + s + ')' + (ty ? ' translateY(' + ty + ')' : '');
    }
    function CT(z, rx, s, tx, ty){
      return 'translateZ(' + z + 'px) rotateX(' + rx + 'deg) scale(' + s + ') translate(' + tx + ', ' + ty + ')';
    }
    var STAGE_BASE = 'rotateX(23deg) translateY(1.5%) scale(1.03)';
    var STAGE_IN   = 'rotateX(23deg) translateY(1.5%) scale(1.133)';
    var STAR_END = T(29, 0, 1.18, null), STAR_CAST_END = CT(27, 0, 1.18, '-5%', '7%');
    /* Bloom twins land at the tree's / star's landed scale+lift, at a Z
       just above the friends layer (45/46px) so the lights paint over
       the friends' heads exactly as the flat DOM order did in pass 3. */
    var BLOOM_TREE_END = T(45, 0, 1.08, '-2%');
    var BLOOM_STAR_END = T(46, 0, 1.18, null);
    function resetPopup(){
      puClear();
      var els = [puTree, puFg, puStar, puTreeCast, puFgCast, puStarCast, shTree, shFg, popup, bloomTree, bloomStar,
                 puSky, puChurch, puShopsL, puShopsR, puLampL, puLampR, puDrift,
                 puSkyCast, puChurchCast, puShopsLCast, puShopsRCast, puLampLCast, puLampRCast, puDriftCast,
                 shSky, shChurch, shShopsL, shShopsR, shLampL, shLampR, shDrift];
      for (var i = 0; i < els.length; i++){
        els[i].style.removeProperty('transform');
        els[i].style.removeProperty('opacity');
        els[i].style.removeProperty('display');
        els[i].style.removeProperty('filter');
      }
      stillImg.style.removeProperty('opacity');
      risen = false; rising = false;
    }
    function postRisen(){
      if (window.parent !== window){ try { window.parent.postMessage('lc-risen', '*'); } catch(e){} }
    }
    function goRise(autoBloom){
      if (risen){ postRisen(); return; }
      if (rising) return;
      resetPopup();
      rising = true;
      function anim(el, frames, opts){
        if (!el.animate) return;
        var a = el.animate(frames, opts); puAnims.push(a);
      }
      /* CAMERA PUSH-IN (pass 5): the whole stage eases scale 1.03 ->
         1.133 (x1.10) over ~7s while the pieces rise and into the first
         seconds of the hold, so the Z-separated layers parallax against
         each other — then it STOPS. Timer-landed at 7050ms with
         !important; no loop, no drift after it settles (the pass-3
         drift stays dead — this is a one-way settle). */
      anim(popup, [
        { transform:STAGE_BASE },
        { transform:STAGE_IN }
      ], { duration:7000, easing:'cubic-bezier(.25,.6,.3,1)', fill:'forwards' });
      puLater(function(){
        popup.style.setProperty('transform', STAGE_IN, 'important');
      }, 7050);
      /* THE DIORAMA WAVE at true depth. risePiece() runs the V-fold
         spring (WAAPI), the PAPER WOBBLE as the piece lands, the
         LONG-SHADOW cast twin, and the ground contact shadow — and
         registers the TIMER-GUARANTEED landings (tapfix3 discipline):
         cast + shadow at delay+dur+150, the piece itself at
         delay+dur+1000, after its wobble completes. */
      function risePiece(o){
        var end = T(o.z, 0, o.s, o.ty), castEnd = CT(o.cz, 0, o.s, o.ctx, o.cty);
        var ease = o.ease || 'cubic-bezier(.22,1.28,.36,1)';
        anim(o.el, [
          { transform:T(o.z, o.fold, 1, null), opacity:0 },
          { transform:end, opacity:1, offset:1 }
        ], { duration:o.dur, delay:o.delay, easing:ease, fill:'forwards' });
        anim(o.el, [
          { opacity:0 }, { opacity:1, offset:.3 }, { opacity:1 }
        ], { duration:o.dur, delay:o.delay, easing:'ease-out', fill:'forwards' });
        /* PAPER WOBBLE — card stock finding its rest: rotateX
           0 -> +2.5 -> -1.5 -> +0.6 -> 0 over .9s from the landing. */
        anim(o.el, [
          { transform:end },
          { transform:T(o.z, 2.5, o.s, o.ty), offset:.25 },
          { transform:T(o.z, -1.5, o.s, o.ty), offset:.55 },
          { transform:T(o.z, 0.6, o.s, o.ty), offset:.8 },
          { transform:end }
        ], { duration:900, delay:o.delay + o.dur, easing:'ease-out', fill:'forwards' });
        /* LONG SHADOW — while the piece is folded / mid-rise its cast
           silhouette is thrown long across the page (offset -7%, 11%)
           and extra-soft (+7px blur on the twin); it shortens to the
           held shadow as the piece stands. */
        anim(o.cast, [
          { transform:CT(o.cz, o.fold, o.s, '-7%', '11%'), opacity:0 },
          { transform:CT(o.cz, 38, o.s, '-4.5%', '6.5%'), opacity:o.cop, offset:.55 },
          { transform:castEnd, opacity:o.cop }
        ], { duration:o.dur, delay:o.delay, easing:ease, fill:'forwards' });
        anim(o.cast, [
          { filter:'blur(7px)' }, { filter:'blur(0px)' }
        ], { duration:o.dur, delay:o.delay, easing:'ease-out', fill:'forwards' });
        anim(o.sh, [
          { opacity:0, transform:'translateZ(3px) scale(.65)' }, { opacity:o.sop, transform:'translateZ(3px) scale(1)' }
        ], { duration:o.dur, delay:o.delay, easing:'ease-out', fill:'forwards' });
        puLater(function(){
          land(o.cast, castEnd, String(o.cop));
          o.cast.style.setProperty('filter', 'none', 'important');
          o.sh.style.setProperty('opacity', String(o.sop), 'important');
        }, o.delay + o.dur + 150);
        puLater(function(){ land(o.el, end, '1'); }, o.delay + o.dur + 1000);
      }
      risePiece({ el:puSky, cast:puSkyCast, sh:shSky, z:5, cz:3, s:1.0, ty:null, ctx:'-1.2%', cty:'2.2%', cop:.35, sop:.3, delay:100, dur:900, fold:72 });
      risePiece({ el:puChurch, cast:puChurchCast, sh:shChurch, z:15, cz:13, s:1.0, ty:'-1%', ctx:'-1.8%', cty:'2.8%', cop:.45, sop:.4, delay:400, dur:900, fold:72 });
      risePiece({ el:puShopsL, cast:puShopsLCast, sh:shShopsL, z:15, cz:13, s:1.0, ty:'-1%', ctx:'-1.8%', cty:'2.8%', cop:.45, sop:.4, delay:400, dur:900, fold:72 });
      risePiece({ el:puShopsR, cast:puShopsRCast, sh:shShopsR, z:15, cz:13, s:1.0, ty:'-1%', ctx:'-1.8%', cty:'2.8%', cop:.45, sop:.4, delay:450, dur:900, fold:72 });
      risePiece({ el:puLampL, cast:puLampLCast, sh:shLampL, z:21, cz:19, s:1.05, ty:'-1.5%', ctx:'-3%', cty:'4.5%', cop:.5, sop:.45, delay:700, dur:900, fold:72 });
      risePiece({ el:puLampR, cast:puLampRCast, sh:shLampR, z:21, cz:19, s:1.05, ty:'-1.5%', ctx:'-3%', cty:'4.5%', cop:.5, sop:.45, delay:750, dur:900, fold:72 });
      risePiece({ el:puTree, cast:puTreeCast, sh:shTree, z:29, cz:27, s:1.08, ty:'-2%', ctx:'-2.2%', cty:'3.2%', cop:.5, sop:.55, delay:1000, dur:1000, fold:72, ease:'cubic-bezier(.22,1.32,.36,1)' });
      risePiece({ el:puFg, cast:puFgCast, sh:shFg, z:43, cz:41, s:1.16, ty:'-2.5%', ctx:'-1.6%', cty:'3.9%', cop:.5, sop:.4, delay:1500, dur:1000, fold:66, ease:'cubic-bezier(.22,1.25,.36,1)' });
      risePiece({ el:puDrift, cast:puDriftCast, sh:shDrift, z:55, cz:53, s:1.22, ty:'-1%', ctx:'-1.3%', cty:'2.8%', cop:.4, sop:.35, delay:1900, dur:900, fold:72 });
      /* the star pops in last — its 3-keyframe bounce (-16deg -> +6deg
         -> settle) IS its paper settle, at scale 1.18 on the tree's Z,
         and its shadow pulses once as it locks (~3.0s) */
      anim(puStar, [
        { transform:T(29, 84, .65, null), opacity:0 },
        { transform:T(29, -16, 1.28, null), opacity:1, offset:.55 },
        { transform:T(29, 6, 1.13, null), opacity:1, offset:.78 },
        { transform:STAR_END, opacity:1 }
      ], { duration:750, delay:2200, easing:'ease-out', fill:'forwards' });
      anim(puStarCast, [
        { transform:CT(27, 84, .65, '-9%', '13%'), opacity:0 },
        { transform:STAR_CAST_END, opacity:.45, offset:1 }
      ], { duration:750, delay:2200, easing:'ease-out', fill:'forwards' });
      anim(puStarCast, [
        { filter:'blur(7px)' }, { filter:'blur(0px)' }
      ], { duration:750, delay:2200, easing:'ease-out', fill:'forwards' });
      anim(puStarCast, [
        { transform:STAR_CAST_END, opacity:.45 },
        { transform:CT(27, 0, 1.26, '-5%', '7%'), opacity:.7, offset:.4 },
        { transform:STAR_CAST_END, opacity:.45 }
      ], { duration:380, delay:2970, easing:'ease-out', fill:'forwards' });
      puLater(function(){ land(puStar, STAR_END, '1'); land(puStarCast, STAR_CAST_END, '.45'); puStarCast.style.setProperty('filter', 'none', 'important'); }, 3100);
      /* THE HOLD (pass 3): no crossfade, nothing fades, #popup is never
         hidden. This timer marks the rise complete and posts the ack
         (the push-in keeps easing into the hold and lands itself at
         7050ms); standalone embeds start the bloom here. */
      puLater(function(){
        rising = false; risen = true;
        postRisen();
        if (autoBloom) goBloom();
      }, 3900);
    }

    /* ================= THE BLOOM GATE (from treelighting) =================
       Inside the card engine this page loads behind the sealed envelope, so
       the bulbs + star are held back until the parent posts 'lc-bloom'; the
       parent arms the gate with 'lc-arm' once it hears 'lc-scene-ready'.
       Fallbacks: an unarmed embed rises (and blooms) at 7s; an armed embed
       at 120s at the latest — and a late 'lc-bloom' restarts the bloom in
       any case. 'lc-dark' (parent reseal) clears the bulbs AND folds the
       pop-up flat, so a replayed opening rises and lights all over again. */
    /* PASS 3/5: the bloom lives in the two paper twins declared in the
       HTML. At bloom time each twin is landed at its layer's landed
       transform (land() writes inline !important), so the bulbs ride the
       risen tree and the glow rides the risen star — in place, on the
       paper, at the pass-5 geometry. */
    var bloomTree = document.getElementById('puBloomTree');
    var bloomStar = document.getElementById('puBloomStar');
    var bloomed = false, armed = false, bloomTimers = [], tierDone = [], starDone = false, rescueTimer = null;
    function clearBloomTimers(){
      for (var i = 0; i < bloomTimers.length; i++) clearTimeout(bloomTimers[i]);
      bloomTimers = []; clearTimeout(rescueTimer); rescueTimer = null;
    }
    function setLit(el, val){ if (el) el.style.setProperty('opacity', val, 'important'); }
    function goBloom(){
      clearBloomTimers();
      land(bloomTree, BLOOM_TREE_END, '1');
      land(bloomStar, BLOOM_STAR_END, '1');
      bloomTree.innerHTML = bloomHtml;
      bloomStar.innerHTML = starHtml;
      bloomed = true;
      tierDone = []; starDone = false;
      if (window.parent !== window){ try { window.parent.postMessage('lc-bloomed', '*'); } catch(e){} }
      /* TIMER-GUARANTEED LIT STATE (tapfix3): plain setTimeout timers set
         each tier's bulbs' inline opacity with !important at the moment that
         tier's bloom-in lands; the star gets the same at 4.6s. A 5.6s sweep,
         keyed on JS flags rather than computed style, completes any tier
         whose timer was lost. */
      var idx = 0;
      for (var t = 0; t < tierInfo.length; t++){
        (function(t, start){
          bloomTimers.push(setTimeout(function(){
            var all = bloomTree.querySelectorAll('.tlb');
            for (var k = 0; k < tierInfo[t].count; k++) setLit(all[start + k], '1');
            tierDone[t] = true;
          }, Math.round(tierInfo[t].at * 1000)));
        })(t, idx);
        idx += tierInfo[t].count;
      }
      bloomTimers.push(setTimeout(function(){
        setLit(bloomStar.querySelector('#starGlow'), '.92'); starDone = true;
      }, 4600));
      rescueTimer = setTimeout(function(){
        var all = bloomTree.querySelectorAll('.tlb');
        var start = 0;
        for (var t = 0; t < tierInfo.length; t++){
          if (!tierDone[t]){ for (var k = 0; k < tierInfo[t].count; k++) setLit(all[start + k], '1'); tierDone[t] = true; }
          start += tierInfo[t].count;
        }
        if (!starDone){ setLit(bloomStar.querySelector('#starGlow'), '.92'); starDone = true; }
      }, 5600);
    }
    if (!embedded){ goRise(true); }
    else {
      window.addEventListener('message', function(e){
        if (e.data === 'lc-arm') armed = true;
        else if (e.data === 'lc-rise') goRise(false);
        else if (e.data === 'lc-bloom') goBloom();
        else if (e.data === 'lc-dark'){ clearBloomTimers(); bloomTree.innerHTML = ''; bloomStar.innerHTML = ''; bloomed = false; tierDone = []; starDone = false; resetPopup(); }
      });
      setTimeout(function(){ if (!risen && !rising && !armed) goRise(true); }, 7000);
      setTimeout(function(){ if (!risen && !rising) goRise(true); }, 120000);
      if (window.parent !== window){
        try { window.parent.postMessage('lc-scene-ready', '*'); } catch(e){}
        var readyN = 0;
        var readyTimer = setInterval(function(){
          if (armed || risen || ++readyN > 6){ clearInterval(readyTimer); return; }
          try { window.parent.postMessage('lc-scene-ready', '*'); } catch(e){}
        }, 800);
      }
    }
    // snow falling across the whole square — real travel, top to bottom
    var snow = document.getElementById('snow'), shtml = '';
    for (var f = 0; f < 34; f++){
      var lx = (1 + (f * 29) % 97), sz = (2.2 + (f % 4) * 1.1).toFixed(1), dur = (7 + (f % 6) * 1.1).toFixed(1), del = (f * 0.83).toFixed(2);
      shtml += '<div class="flake" style="left:' + lx + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
    }
    snow.innerHTML = shtml;
  })();
</script>
</body>
</html>
