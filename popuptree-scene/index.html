<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Pop-Up Tree — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#062417; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('plate-empty.webp') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#062417;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; opacity:0; }
  /* THE POP-UP (Nov 23; PASS 3 same day — Gary's verdict on pass 2: "it
     folds out but it does other things after that makes it look not real":
     pass 2 crossfaded the risen stack into the flat photograph and switched
     the photo's living treatments on, and the paper illusion died. PASS 3
     DOCTRINE: THE STACK IS THE CARD. There is NO crossfade to still.jpg —
     the held state is the risen paper stack itself: plate-empty backdrop +
     tree layer + foreground layer + star, cast shadows ON, layer scales
     held at their landed values (1.05 / 1.10 / 1.15), and the stage tilt
     easing only to a slight residual rotateX(6deg) so the depth persists
     while the card sits there. The bloom lights the PAPER tree: the bulbs
     live in a twin overlay (#puBloomTree) that carries the tree layer's own
     box and landed transform, the star glow in a twin (#puBloomStar) with
     the star's — so the lights ride the paper geometry exactly. All photo
     treatments are gone from this scene: no camera drift, no warm-glow
     breathing, no lamp pulses, no cocoa steam. What moves in the held
     state: the snowfall, and (after lighting) the bulbs' own gentle glow
     breathing. The rise is WAAPI for smoothness, but per the tapfix3
     lesson every landing is ALSO set by a plain setTimeout writing inline
     styles with !important, so no browser's animation clock can leave a
     layer folded or the stage over-tilted. */
  #popup { position:absolute; inset:0; pointer-events:none; perspective:1050px; transform-origin:50% 88%; will-change:transform,opacity; }
  #plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .pulayer { position:absolute; will-change:transform,opacity; transform:rotateX(72deg); opacity:0; }
  .pulayer img { width:100%; height:100%; display:block; }
  #puTree { left:30%; top:5%; width:45%; height:62%; transform-origin:50% 100%; }
  #puFg { left:0; top:38%; width:100%; height:62%; transform-origin:50% 100%; }
  #puStar { left:44.5%; top:0; width:11%; height:9.5%; transform-origin:50% 100%; transform:rotateX(84deg); }
  .pucast { position:absolute; will-change:transform,opacity; transform:rotateX(72deg); opacity:0; pointer-events:none; }
  .pucast img { width:100%; height:100%; display:block; filter:brightness(0) blur(5px); }
  #puTreeCast { left:30%; top:5%; width:45%; height:62%; transform-origin:50% 100%; }
  #puFgCast { left:0; top:38%; width:100%; height:62%; transform-origin:50% 100%; }
  #puStarCast { left:44.5%; top:0; width:11%; height:9.5%; transform-origin:50% 100%; transform:rotateX(84deg); }
  .pushadow { position:absolute; border-radius:50%; pointer-events:none; opacity:0;
              background:radial-gradient(closest-side, rgba(2,10,6,.55), rgba(2,10,6,0) 72%); }
  #shTree { left:31%; top:58.5%; width:42%; height:9%; }
  #shFg { left:6%; top:93%; width:88%; height:7%; }
  /* BLOOM TWINS (pass 3): transparent overlays with the tree / star layers'
     exact boxes and transform origins. At bloom time the script lands each
     twin at its layer's landed transform, so bulbs + star glow ride the
     risen paper geometry — and paint above the foreground layer. */
  .publm { position:absolute; pointer-events:none; }
  #puBloomTree { left:30%; top:5%; width:45%; height:62%; transform-origin:50% 100%; }
  #puBloomStar { left:44.5%; top:0; width:11%; height:9.5%; transform-origin:50% 100%; }
  .tlb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%); opacity:0;
        animation:twk ease-in-out infinite alternate, tlBloomIn 1.1s ease forwards; }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.55); filter:brightness(.65) } to { transform:translate(-50%,-50%) scale(1.5); filter:brightness(1.4) } }
  @keyframes tlBloomIn { from { opacity:0 } to { opacity:1 } }
  #starGlow { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%); opacity:0;
        background:radial-gradient(closest-side, rgba(255,230,150,.95), rgba(255,196,80,.4) 55%, rgba(255,180,80,0) 78%);
        animation:tlStarBloom 4.6s ease forwards, tlStarPulse 3.4s ease-in-out 4.6s infinite alternate; }
  @keyframes tlStarBloom { 0% { opacity:0; transform:translate(-50%,-50%) scale(.55) } 78% { opacity:0; transform:translate(-50%,-50%) scale(.55) } 90% { opacity:1; transform:translate(-50%,-50%) scale(1.28) } 100% { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } }
  @keyframes tlStarPulse { from { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } to { opacity:1; transform:translate(-50%,-50%) scale(1.24) } }
  #snow { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .flake { position:absolute; top:-4%; border-radius:50%; pointer-events:none;
           background:radial-gradient(closest-side, rgba(255,255,255,.98), rgba(235,245,255,.55) 60%, rgba(235,245,255,0) 80%);
           animation:tlFall linear infinite; will-change:transform; }
  @keyframes tlFall { 0% { transform:translate(0,-4vh); opacity:0 } 6% { opacity:1 } 50% { transform:translate(1.2vw,52vh) } 94% { opacity:1 } 100% { transform:translate(-0.8vw,106vh); opacity:0 } }
  /* BLOOM GUARANTEE (Nov 22 tapfix3, inherited): a bulb's lit state is NOT
     left to its CSS animation. Per-tier JS timers in the script below set
     each bulb's inline opacity with !important at the moment its bloom-in
     animation lands, the star likewise, so the full lit tree arrives by ~5s
     even if every animation timeline in this iframe is frozen or never
     painted. The animations remain as the build effect in healthy browsers;
     the timers are the guarantee. */
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(6,42,22,.58); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #snow { display:none; } .tlb, #starGlow { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends in a snowy village square at blue dusk, cocoa mugs in hand, gathered before a giant Christmas tree hung with ornaments and topped with a gold star — the moment just before the lights come on; lampposts glowing at both sides, the church steeple behind, snow falling">
      <div id="popup">
        <img id="plate" src="plate-empty.webp" alt="">
        <div class="pushadow" id="shTree"></div>
        <div class="pucast" id="puTreeCast"><img src="layer-tree.webp" alt=""></div>
        <div class="pulayer" id="puTree"><img src="layer-tree.webp" alt=""></div>
        <div class="pushadow" id="shFg"></div>
        <div class="pucast" id="puFgCast"><img src="layer-fg.webp" alt=""></div>
        <div class="pulayer" id="puFg"><img src="layer-fg.webp" alt=""></div>
        <div class="pucast" id="puStarCast"><img src="layer-star.webp" alt=""></div>
        <div class="pulayer" id="puStar"><img src="layer-star.webp" alt=""></div>
        <div class="publm" id="puBloomTree"></div>
        <div class="publm" id="puBloomStar"></div>
      </div>
    </div>
    <div id="fx"></div>
    <div id="snow"></div>
    <div id="caption">THE POP-UP TREE</div>
  </div>
</div>
<script>
  // The Pop-Up Tree (Nov 23; pass 3 same day): the Tree Lighting painting,
  // presented as a pop-up book. Over an EMPTY BACKDROP the painting RISES
  // in layers — tree, then the friends in front, then the star pops in
  // last — the stage tilted like an open book, each piece landing proud of
  // the layer behind with its own cast shadow. PASS 3: the risen stack IS
  // the card — no crossfade to the flat painting, no photo treatments; the
  // tilt eases only to a residual 6deg, the scales hold, and the tap (the
  // parent's tap rig posts 'lc-bloom') lights the PAPER tree: bulbs ride a
  // twin overlay carrying the tree layer's own landed transform, the star
  // glow a twin carrying the star's. In #wall the caption hides. Bloom
  // machinery below is the treelighting scene's, unchanged: tiers land
  // bottom-first by animation, guaranteed by plain timers writing inline
  // opacity !important.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var embedded = document.body.classList.contains('wall');
    var bloomHtml = '', starHtml = '';
    var palette = ['255,209,102', '255,89,100', '126,217,87', '255,243,196', '255,166,66'];
    /* PASS 3: the bulbs are NOT positioned in frame coordinates any more.
       They live in #puBloomTree, a twin of the tree layer (box left 30%,
       top 5%, width 45%, height 62% of the frame) that lands with the tree
       layer's own transform — so each bulb's position is converted from
       frame % into tree-box % here: left (x-30)/45, top (y-5)/62, width
       size/45 (width % resolves against the box width, top % against its
       height; aspect-ratio keeps the bulb round at the same pixel size). */
    function light(x, y, ci, size, dur, phase, bloom){
      var c = palette[ci % palette.length];
      var lx = ((x - 30) / 45 * 100).toFixed(2), ly = ((y - 5) / 62 * 100).toFixed(2), lw = (size / 45 * 100).toFixed(2);
      return '<div class="tlb" style="left:' + lx + '%;top:' + ly + '%;width:' + lw + '%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(' + c + ',.98), rgba(' + c + ',.34) 55%, rgba(' + c + ',0) 78%);animation-duration:' + dur + 's,1.1s;animation-delay:-' + phase + 's,' + bloom + 's"></div>';
    }
    // tree lights — tiers over the tree, in FRAME coordinates (apex x~50%, widening to x 33-66% at the base, y 3-62%), converted by light(); bloom delay rises tier by tier, bottom first, spiraling up
    var tiers = [
      { d: 0.30, pts: [[36,59],[43,60],[50,59],[57,60],[64,59]] },
      { d: 0.90, pts: [[37,51],[44,52],[51,51],[58,52],[63,51]] },
      { d: 1.50, pts: [[39,43],[46,44],[53,43],[60,44]] },
      { d: 2.10, pts: [[41,35],[48,36],[55,35],[61,36]] },
      { d: 2.70, pts: [[43,27],[50,28],[57,27]] },
      { d: 3.30, pts: [[45,19],[52,20],[56,19]] },
      { d: 3.80, pts: [[47,11],[53,12]] }
    ];
    var n = 0, tierInfo = [];
    for (var t = 0; t < tiers.length; t++){
      for (var i = 0; i < tiers[t].pts.length; i++){
        var p = tiers[t].pts[i];
        bloomHtml += light(p[0], p[1], n, (0.8 + (n % 3) * 0.22).toFixed(2), (1.5 + (n % 5) * 0.35).toFixed(2), (n * 0.37).toFixed(2), (tiers[t].d + i * 0.06).toFixed(2));
        n++;
      }
      /* when this tier's last bulb's bloom-in lands: tier delay + last step + 1.1s */
      tierInfo.push({ count: tiers[t].pts.length, at: tiers[t].d + (tiers[t].pts.length - 1) * 0.06 + 1.1 });
    }
    // the star's glow — blooms in last, then breathes. PASS 3: it lives in
    // #puBloomStar, the star layer's twin (box left 44.5%, top 0, width 11%,
    // height 9.5%); the star art sits at ~(49%, 44%) inside its cut
    // (alpha bbox 21-152 x 0-74 of 176x85), and width 45% of the twin's
    // width ≈ the old 5%-of-frame glow diameter.
    starHtml = '<div id="starGlow" style="left:49%;top:44%;width:45%;aspect-ratio:1"></div>';

    /* ================= THE POP-UP RISE (pass 3) =================
       Layers start folded (CSS: rotateX 72-84deg, opacity 0) over the
       EMPTY BACKDROP (#plate). goRise() tilts the whole stage back like
       an open book (rotateX 14deg, scaled a touch to hold framing) and
       springs the pieces upright in sequence — tree at .15s/1.0s,
       foreground at .85s/1.0s, star at 1.55s/.75s with a big overshoot
       bounce and a shadow pulse as it locks. Each piece lands at a REAL
       SEPARATION (tree scale 1.05, foreground 1.10 + nudged down, star
       1.15) with its cast-shadow twin (a brightness(0) blurred silhouette,
       offset down-left) thrown onto the layer behind. PASS 3: that is
       where the motion STOPS. The tilt eases only to a residual
       rotateX(6deg) scale(1.03), the scales hold, the shadows stay on,
       and 'lc-risen' is posted — the held card is the paper stack, and
       the bloom later lights it in place. There is no crossfade and
       #popup is never hidden. Every landing is ALSO written by a plain
       timer as an inline !important style (the tapfix3 discipline): if
       every WAAPI timeline in this iframe froze, the timers alone still
       stand the scene up at its separated pose, settle the stage at the
       residual tilt, and post the ack. 'lc-dark' folds everything flat
       again for a replay. */
    var popup = document.getElementById('popup');
    var stillImg = document.getElementById('still'), plateImg = document.getElementById('plate');
    var puTree = document.getElementById('puTree'), puFg = document.getElementById('puFg'), puStar = document.getElementById('puStar');
    var puTreeCast = document.getElementById('puTreeCast'), puFgCast = document.getElementById('puFgCast'), puStarCast = document.getElementById('puStarCast');
    var shTree = document.getElementById('shTree'), shFg = document.getElementById('shFg');
    /* If the empty backdrop ever fails to load, fall back to pass-1
       behaviour: the original painting itself is the backdrop. */
    if (plateImg){
      plateImg.addEventListener('error', function(){
        plateImg.style.display = 'none';
        stillImg.style.setProperty('opacity', '1', 'important');
      });
    }
    var puAnims = [], puTimers = [], risen = false, rising = false;
    function puLater(fn, ms){ puTimers.push(setTimeout(fn, ms)); }
    function puClear(){
      for (var i = 0; i < puTimers.length; i++) clearTimeout(puTimers[i]);
      puTimers = [];
      for (var j = 0; j < puAnims.length; j++){ try { puAnims[j].cancel(); } catch(e){} }
      puAnims = [];
    }
    function land(el, transform, opacity){
      el.style.setProperty('transform', transform, 'important');
      el.style.setProperty('opacity', opacity, 'important');
    }
    var TREE_END = 'rotateX(0deg) scale(1.05)', TREE_CAST_END = 'rotateX(0deg) scale(1.05) translate(-2.2%, 3.2%)';
    var FG_END = 'rotateX(0deg) scale(1.10) translateY(1.5%)', FG_CAST_END = 'rotateX(0deg) scale(1.10) translate(-1.6%, 3.9%)';
    var STAR_END = 'rotateX(0deg) scale(1.15)', STAR_CAST_END = 'rotateX(0deg) scale(1.15) translate(-5%, 7%)';
    function resetPopup(){
      puClear();
      var els = [puTree, puFg, puStar, puTreeCast, puFgCast, puStarCast, shTree, shFg, popup, bloomTree, bloomStar];
      for (var i = 0; i < els.length; i++){
        els[i].style.removeProperty('transform');
        els[i].style.removeProperty('opacity');
        els[i].style.removeProperty('display');
      }
      stillImg.style.removeProperty('opacity');
      risen = false; rising = false;
    }
    function postRisen(){
      if (window.parent !== window){ try { window.parent.postMessage('lc-risen', '*'); } catch(e){} }
    }
    function goRise(autoBloom){
      if (risen){ postRisen(); return; }
      if (rising) return;
      resetPopup();
      rising = true;
      function anim(el, frames, opts){
        if (!el.animate) return;
        var a = el.animate(frames, opts); puAnims.push(a);
      }
      /* CAMERA TILT — the stage tips back like an open book while the
         pieces rise (rotateX 14deg), then eases to a RESIDUAL
         rotateX(6deg) scale(1.03) and STAYS there (pass 3): the depth
         persists for the whole life of the card, nothing flattens. */
      anim(popup, [
        { transform:'rotateX(14deg) scale(1.07)', offset:0 },
        { transform:'rotateX(14deg) scale(1.07)', offset:.79 },
        { transform:'rotateX(6deg) scale(1.03)', offset:1, easing:'ease-in-out' }
      ], { duration:3300, easing:'linear', fill:'forwards' });
      /* tree first — a V-fold springing up from its base line, landing
         proud of the backdrop at scale 1.05, its shadow thrown down-left */
      anim(puTree, [
        { transform:'rotateX(72deg)', opacity:0 },
        { transform:TREE_END, opacity:1, offset:1 }
      ], { duration:1000, delay:150, easing:'cubic-bezier(.22,1.32,.36,1)', fill:'forwards' });
      anim(puTree, [
        { opacity:0 }, { opacity:1, offset:.3 }, { opacity:1 }
      ], { duration:1000, delay:150, easing:'ease-out', fill:'forwards' });
      anim(puTreeCast, [
        { transform:'rotateX(72deg)', opacity:0 },
        { transform:TREE_CAST_END, opacity:.5, offset:1 }
      ], { duration:1000, delay:150, easing:'cubic-bezier(.22,1.32,.36,1)', fill:'forwards' });
      anim(shTree, [
        { opacity:0, transform:'scale(.65)' }, { opacity:.55, transform:'scale(1)' }
      ], { duration:1000, delay:150, easing:'ease-out', fill:'forwards' });
      /* foreground — the friends stand up in front of the tree, closer
         to the viewer (scale 1.10, nudged down), shadowing the tree */
      anim(puFg, [
        { transform:'rotateX(66deg)' }, { transform:FG_END }
      ], { duration:1000, delay:850, easing:'cubic-bezier(.22,1.25,.36,1)', fill:'forwards' });
      anim(puFg, [
        { opacity:0 }, { opacity:1, offset:.3 }, { opacity:1 }
      ], { duration:1000, delay:850, easing:'ease-out', fill:'forwards' });
      anim(puFgCast, [
        { transform:'rotateX(66deg)', opacity:0 },
        { transform:FG_CAST_END, opacity:.5, offset:1 }
      ], { duration:1000, delay:850, easing:'cubic-bezier(.22,1.25,.36,1)', fill:'forwards' });
      anim(shFg, [
        { opacity:0, transform:'scale(.7)' }, { opacity:.4, transform:'scale(1)' }
      ], { duration:1000, delay:850, easing:'ease-out', fill:'forwards' });
      /* the star pops in last — bigger overshoot bounce at scale 1.15,
         and its shadow pulses once as it locks (~2.3s) */
      anim(puStar, [
        { transform:'rotateX(84deg) scale(.65)', opacity:0 },
        { transform:'rotateX(-16deg) scale(1.24)', opacity:1, offset:.55 },
        { transform:'rotateX(6deg) scale(1.10)', opacity:1, offset:.78 },
        { transform:STAR_END, opacity:1 }
      ], { duration:750, delay:1550, easing:'ease-out', fill:'forwards' });
      anim(puStarCast, [
        { transform:'rotateX(84deg) scale(.65)', opacity:0 },
        { transform:STAR_CAST_END, opacity:.45, offset:1 }
      ], { duration:750, delay:1550, easing:'ease-out', fill:'forwards' });
      anim(puStarCast, [
        { transform:STAR_CAST_END, opacity:.45 },
        { transform:'rotateX(0deg) scale(1.23) translate(-5%, 7%)', opacity:.7, offset:.4 },
        { transform:STAR_CAST_END, opacity:.45 }
      ], { duration:380, delay:2320, easing:'ease-out', fill:'forwards' });
      /* TIMER-GUARANTEED LANDINGS — the same end states, written plainly. */
      puLater(function(){ land(puTree, TREE_END, '1'); land(puTreeCast, TREE_CAST_END, '.5'); shTree.style.setProperty('opacity', '.55', 'important'); }, 1300);
      puLater(function(){ land(puFg, FG_END, '1'); land(puFgCast, FG_CAST_END, '.5'); shFg.style.setProperty('opacity', '.4', 'important'); }, 2000);
      puLater(function(){ land(puStar, STAR_END, '1'); land(puStarCast, STAR_CAST_END, '.45'); }, 2450);
      /* THE HOLD (pass 3): no crossfade, nothing fades, #popup is never
         hidden. The plain timer lands the stage at the residual tilt with
         !important (overriding the WAAPI fill), marks the rise complete,
         posts the ack, and starts the bloom for standalone embeds. */
      puLater(function(){
        popup.style.setProperty('transform', 'rotateX(6deg) scale(1.03)', 'important');
        rising = false; risen = true;
        postRisen();
        if (autoBloom) goBloom();
      }, 3400);
    }

    /* ================= THE BLOOM GATE (from treelighting) =================
       Inside the card engine this page loads behind the sealed envelope, so
       the bulbs + star are held back until the parent posts 'lc-bloom'; the
       parent arms the gate with 'lc-arm' once it hears 'lc-scene-ready'.
       Fallbacks: an unarmed embed rises (and blooms) at 7s; an armed embed
       at 120s at the latest — and a late 'lc-bloom' restarts the bloom in
       any case. 'lc-dark' (parent reseal) clears the bulbs AND folds the
       pop-up flat, so a replayed opening rises and lights all over again. */
    /* PASS 3: the bloom lives in the two paper twins declared in the HTML.
       At bloom time each twin is landed at its layer's landed transform
       (land() writes inline !important), so the bulbs ride the risen tree
       and the glow rides the risen star — in place, on the paper. */
    var bloomTree = document.getElementById('puBloomTree');
    var bloomStar = document.getElementById('puBloomStar');
    var bloomed = false, armed = false, bloomTimers = [], tierDone = [], starDone = false, rescueTimer = null;
    function clearBloomTimers(){
      for (var i = 0; i < bloomTimers.length; i++) clearTimeout(bloomTimers[i]);
      bloomTimers = []; clearTimeout(rescueTimer); rescueTimer = null;
    }
    function setLit(el, val){ if (el) el.style.setProperty('opacity', val, 'important'); }
    function goBloom(){
      clearBloomTimers();
      land(bloomTree, TREE_END, '1');
      land(bloomStar, STAR_END, '1');
      bloomTree.innerHTML = bloomHtml;
      bloomStar.innerHTML = starHtml;
      bloomed = true;
      tierDone = []; starDone = false;
      if (window.parent !== window){ try { window.parent.postMessage('lc-bloomed', '*'); } catch(e){} }
      /* TIMER-GUARANTEED LIT STATE (tapfix3): plain setTimeout timers set
         each tier's bulbs' inline opacity with !important at the moment that
         tier's bloom-in lands; the star gets the same at 4.6s. A 5.6s sweep,
         keyed on JS flags rather than computed style, completes any tier
         whose timer was lost. */
      var idx = 0;
      for (var t = 0; t < tierInfo.length; t++){
        (function(t, start){
          bloomTimers.push(setTimeout(function(){
            var all = bloomTree.querySelectorAll('.tlb');
            for (var k = 0; k < tierInfo[t].count; k++) setLit(all[start + k], '1');
            tierDone[t] = true;
          }, Math.round(tierInfo[t].at * 1000)));
        })(t, idx);
        idx += tierInfo[t].count;
      }
      bloomTimers.push(setTimeout(function(){
        setLit(bloomStar.querySelector('#starGlow'), '.92'); starDone = true;
      }, 4600));
      rescueTimer = setTimeout(function(){
        var all = bloomTree.querySelectorAll('.tlb');
        var start = 0;
        for (var t = 0; t < tierInfo.length; t++){
          if (!tierDone[t]){ for (var k = 0; k < tierInfo[t].count; k++) setLit(all[start + k], '1'); tierDone[t] = true; }
          start += tierInfo[t].count;
        }
        if (!starDone){ setLit(bloomStar.querySelector('#starGlow'), '.92'); starDone = true; }
      }, 5600);
    }
    if (!embedded){ goRise(true); }
    else {
      window.addEventListener('message', function(e){
        if (e.data === 'lc-arm') armed = true;
        else if (e.data === 'lc-rise') goRise(false);
        else if (e.data === 'lc-bloom') goBloom();
        else if (e.data === 'lc-dark'){ clearBloomTimers(); bloomTree.innerHTML = ''; bloomStar.innerHTML = ''; bloomed = false; tierDone = []; starDone = false; resetPopup(); }
      });
      setTimeout(function(){ if (!risen && !rising && !armed) goRise(true); }, 7000);
      setTimeout(function(){ if (!risen && !rising) goRise(true); }, 120000);
      if (window.parent !== window){
        try { window.parent.postMessage('lc-scene-ready', '*'); } catch(e){}
        var readyN = 0;
        var readyTimer = setInterval(function(){
          if (armed || risen || ++readyN > 6){ clearInterval(readyTimer); return; }
          try { window.parent.postMessage('lc-scene-ready', '*'); } catch(e){}
        }, 800);
      }
    }
    // snow falling across the whole square — real travel, top to bottom
    var snow = document.getElementById('snow'), shtml = '';
    for (var f = 0; f < 34; f++){
      var lx = (1 + (f * 29) % 97), sz = (2.2 + (f % 4) * 1.1).toFixed(1), dur = (7 + (f % 6) * 1.1).toFixed(1), del = (f * 0.83).toFixed(2);
      shtml += '<div class="flake" style="left:' + lx + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
    }
    snow.innerHTML = shtml;
  })();
</script>
</body>
</html>
