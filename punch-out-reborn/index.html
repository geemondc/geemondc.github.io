<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <title>Punch-Out Reborn</title>
    <style>
      :root{
        --ink:#f5efe4; --gold:#ffc832; --red:#e83a30; --teal:#19c2a6;
        --panel:#17130f; --btn:rgba(16,14,12,.72); --btnline:rgba(255,200,50,.55);
      }
      * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0; background:#0b0908; color:var(--ink);
        font-family:ui-rounded,"Trebuchet MS","Segoe UI",system-ui,sans-serif;
        overflow:hidden; touch-action:none; overscroll-behavior:none;
        -webkit-user-select:none; user-select:none;
      }
      #app{ height:100dvh; display:flex; flex-direction:column; }
      #topbar{
        display:flex; align-items:center; justify-content:space-between;
        padding:6px 10px; gap:6px; flex:0 0 auto; flex-wrap:wrap;
      }
      #topbar .brand{
        font-family:Impact,"Arial Black",sans-serif; letter-spacing:.06em;
        font-size:15px; color:var(--gold); text-shadow:0 2px 0 #7a2c00;
      }
      .tbtn{
        background:var(--btn); color:var(--ink); border:1.5px solid var(--btnline);
        border-radius:10px; padding:6px 12px; font-weight:800; font-size:13px;
        letter-spacing:.04em; cursor:pointer; font-family:inherit;
      }
      .tbtn:active{ transform:scale(.95); }
      #stage{ position:relative; flex:1 1 auto; min-height:0; }
      canvas#game{ position:absolute; inset:0; width:100%; height:100%; display:block; }
      /* ---- touch controls ---- */
      #controls{
        position:absolute; left:0; right:0; bottom:0; z-index:5;
        display:flex; justify-content:space-between; align-items:flex-end;
        padding:0 10px calc(8px + env(safe-area-inset-bottom)); pointer-events:none;
      }
      .cluster{ display:flex; gap:8px; align-items:flex-end; pointer-events:none; }
      .cluster.col{ flex-direction:column; align-items:center; gap:8px; }
      .cbtn{
        pointer-events:auto; border:2px solid rgba(255,255,255,.35);
        background:rgba(12,10,9,.66); color:#fff; border-radius:50%;
        width:60px; height:60px; font-size:22px; font-weight:900;
        display:flex; align-items:center; justify-content:center; flex-direction:column;
        font-family:inherit; cursor:pointer; line-height:1; backdrop-filter: blur(2px);
      }
      .cbtn small{ font-size:9px; letter-spacing:.08em; margin-top:2px; font-weight:800; }
      .cbtn:active,.cbtn.held{ background:rgba(255,200,50,.85); color:#201405; transform:scale(.93); }
      .cbtn.wide{ width:72px; height:72px; }
      #btnStar{ border-color:var(--gold); color:#ffe9a8; }
      #btnStar.lit{ background:var(--gold); color:#241500; box-shadow:0 0 22px 4px rgba(255,200,50,.75); animation:pulse .5s infinite alternate; }
      @keyframes pulse{ from{ transform:scale(1);} to{ transform:scale(1.07);} }
      /* ---- bottom-left QR + bottom-right link ---- */
      #qrBtn{
        position:absolute; left:10px; bottom:calc(96px + env(safe-area-inset-bottom)); z-index:6;
        width:46px; height:46px; padding:3px; background:#fff; border-radius:8px;
        border:2px solid rgba(0,0,0,.4); cursor:pointer;
      }
      #qrBtn img{ width:100%; height:100%; display:block; }
      #frLink{
        color:rgba(245,239,228,.55); font-size:11px; letter-spacing:.22em; font-weight:700;
        text-decoration:none; margin-right:10px; white-space:nowrap;
      }
      #frLink:hover{ color:var(--gold); }
      /* ---- QR overlay ---- */
      #qrModal{
        position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
        background:rgba(5,4,3,.88); flex-direction:column; gap:14px; padding:20px; text-align:center;
      }
      #qrModal.open{ display:flex; }
      #qrModal .card{ background:#fff; padding:14px; border-radius:14px; }
      #qrModal img{ width:min(72vw,340px); height:auto; display:block; }
      #qrModal p{ margin:0; font-weight:700; }
      #qrModal .url{ color:var(--gold); font-size:14px; word-break:break-all; }
      @media (max-width:620px){
        #topbar{ padding:5px 7px; gap:4px; }
        #topbar .brand{ font-size:12px; }
        #frLink{ font-size:10px; letter-spacing:.06em; margin-right:6px; }
        #fpsTag{ font-size:10px; margin-right:6px !important; }
        .tbtn{ padding:5px 7px; font-size:11.5px; }
      }
      @media (max-height:520px){
        .cbtn{ width:50px; height:50px; font-size:19px; }
        .cbtn.wide{ width:60px; height:60px; }
        #qrBtn{ bottom:calc(80px + env(safe-area-inset-bottom)); }
      }
    </style>

<script>
"use strict";
/* ============================================================
   PUNCH-OUT REBORN — faithful Punch-Out!! mechanics, original cast.
   Canvas cartoon boxing. WebAudio SFX only. No music.
   ============================================================ */
const W = 720, H = 900;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let DPR = 1, SCALE = 1, OX = 0, OY = 0;
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width * DPR));
  cv.height = Math.max(1, Math.round(r.height * DPR));
  SCALE = Math.min(cv.width / W, cv.height / H);
  OX = (cv.width - W * SCALE) / 2;
  OY = (cv.height - H * SCALE) / 2;
}
window.addEventListener('resize', resize);

/* ---------------- utils ---------------- */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp = (a,b,t)=> a+(b-a)*t;
const rnd = (a,b)=> a + Math.random()*(b-a);
const TAU = Math.PI*2;
function rr(x,y,w,h,r){ // rounded rect path
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function ellipse(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,TAU); }

/* ---------------- audio (WebAudio SFX only, NO music) ---------------- */
let AC = null, MUTED = false, noiseBuf = null;
function audio(){
  if(!AC){
    try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; }
    if(AC){
      noiseBuf = AC.createBuffer(1, AC.sampleRate*0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
  }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay){
  if(MUTED || !audio()) return;
  const t0 = AC.currentTime + (delay||0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
  g.gain.setValueAtTime(vol||0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur, vol, fFrom, fTo, type, delay){
  if(MUTED || !audio()) return;
  const t0 = AC.currentTime + (delay||0);
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = type||'bandpass';
  f.frequency.setValueAtTime(fFrom, t0);
  if(fTo) f.frequency.exponentialRampToValueAtTime(Math.max(30,fTo), t0+dur);
  f.Q.value = 1.1;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol||0.25, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(t0); src.stop(t0+dur+0.02);
}

  for(let i=0;i<n;i++){

    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,t:0,life:(life||0.5)*(0.6+Math.random()*0.7),

  return {

    state:'enter', t:0, x:0, lean:0, wob:Math.random()*10,

function startCareer(){
  G.fighterIdx = 0; G.score = 0; G.careerDowns = 0;
  showTale();
}
function showTale(){
  G.screen = 'tale'; G.timeRun = false; G.countSeq = null;
  opp = makeOpp(G.fighterIdx);
}
function startFight(){
  const def = FIGHTERS[G.fighterIdx];
  player.hp = PMAXHP; player.hearts = PMAXHEARTS; player.stars = 0; player.downs = 0;
  player.state = 'idle'; player.t = 0; player.tired = false; player.mash = 0; player.x = 0;
  opp = makeOpp(G.fighterIdx);
  opp.state = 'idle'; opp.idleT = 1.6;
  G.boutScore = 0; G.timeLeft = 180; G.timeRun = false; G.intro = 2.2; G.countSeq = null;
  G.screen = 'fight';
  splash(def.circuit, def.name + "  " + def.sub, 1.6, "#fff");
  coachSay("Coach: " + def.tips[0], 4.2);
}
function awardScore(n){ G.boutScore += n; G.score += n; if(G.score > G.top) G.top = G.score; }

function oppFacePos(){ const d = opp.def; return { x: W/2 + opp.x, y: 795 - 336*d.size + Math.sin(opp.wob)*4 }; }
function oppBodyPos(){ const d = opp.def; return { x: W/2 + opp.x, y: 795 - 205*d.size }; }

function playerCanAct(){
  return G.screen==='fight' && !G.countSeq && G.intro<=0 &&
    player.state!=='down' && player.state!=='getup' && player.state!=='win' && player.state!=='ko';
}
function doDodge(dir){
  if(!playerCanAct()) return;
  if(player.state==='punch' && player.punchT<0.1) return;
  player.state='dodge'; player.dodgeT=0.34; player.dodgeDir=dir; player.t=0;
  SFX.dodge();
  checkTiredDodge();
}
function doDuck(){
  if(!playerCanAct()) return;
  if(player.state==='dodge') return;
  player.duckT = Math.max(player.duckT, 0.30);
  SFX.dodge();
}
function doBlock(){
  if(!playerCanAct()) return;
  player.blockT = Math.max(player.blockT, 0.30);
}
function checkTiredDodge(){
  // evaluated again when the opponent's attack actually whiffs (see oppStrike)
}
function loseHearts(n){
  player.hearts = Math.max(0, player.hearts - n);
  if(player.hearts<=0 && !player.tired){
    player.tired = true;
    coachSay("Coach: You're out of hearts, kid! DODGE his punches to get them back!", 3.6);
    floatText(W/2, 640, "TIRED!", "#ff9db0", 30);
  }
}
function gainHearts(n){
  player.hearts = Math.min(PMAXHEARTS, player.hearts + n);
  if(player.tired && player.hearts>=6){
    player.tired = false;
    coachSay("Coach: There you go — back in the fight!", 2.2);
  }
}
function earnStar(fromTaunt){
  if(player.stars >= 3){ floatText(W/2, 480, "MAX STARS!", "#ffd94d", 24); return; }
  player.stars++;
  SFX.star();
  const f = oppFacePos();
  burst(f.x, f.y-40, 12, ["#ffd94d","#fff6c9","#ffc832"], 240, 0.6, 6);
  floatText(f.x, f.y-90, "STAR!", "#ffd94d", 34);
  awardScore(100);
  if(fromTaunt) coachSay("Coach: Caught him bragging! That's a STAR, kid!", 2.6);
}

/* ---- player punches ---- */
function doPunch(kind){ // kind: 'jab' | 'body' | 'upper'
  if(!playerCanAct()) return;
  if(player.tired){
    if(kind!=='upper'){ floatText(W/2, 660, "TOO TIRED — DODGE!", "#ff9db0", 22); tone(180,0.1,'square',0.1,120); }
    return;
  }
  if(player.state==='punch' && player.punchT>0.03) return;
  if(player.state==='dodge' && player.dodgeT>0.12) return;
  if(kind==='upper'){
    if(player.stars<=0){ floatText(W/2, 660, "NO STARS!", "#ffd94d", 22); tone(180,0.1,'square',0.1,120); return; }
    player.stars--;
    player.state='punch'; player.punchKind='upper'; player.punchT=0.34; player.punchSide=1; player.t=0;
    resolveUpper();
    return;
  }
  player.state='punch'; player.punchKind=kind; player.punchT=0.17; player.t=0;
  player.punchSide = player.comboAlt; player.comboAlt = -player.comboAlt;
  resolveJab(kind);
}
function blockText(tx, ty){
  const lines = opp.def.blockLines;
  if(lines && lines.length){
    opp.blockIdx = ((opp.blockIdx||0) + 1);
    floatText(tx, ty-30, lines[(opp.blockIdx-1) % lines.length], "#ffe9a8", 23);
  } else {
    floatText(tx, ty-30, "BLOCKED!", "#cfe3ff", 22);
  }
}
function resolveJab(kind){
  const d = opp.def, face = oppFacePos(), body = oppBodyPos();
  const tx = kind==='jab' ? face.x + player.punchSide*14 : body.x;
  const ty = kind==='jab' ? face.y + 16 : body.y;
  // --- stunned: free combo ---
  if(opp.state==='stunned'){
    if(opp.comboLanded >= d.comboMax){ // he recovers mid-swing: your punch gets stuffed
      SFX.block(); loseHearts(1); floatText(tx, ty-30, "BLOCKED!", "#cfe3ff", 22);
      oppRecover(true);
      return;
    }
    opp.comboLanded++;
    const dmg = kind==='jab' ? DMG.jab : DMG.body;
    oppHurt(dmg, kind, tx, ty);
    if(kind==='body' && opp.hp>0){
      // "BODY BLOW! BODY BLOW!" — the arcade chant energy
      if(opp.comboLanded % 2 === 0) floatText(tx, ty-46, "BODY BLOW!", "#ffd94d", 25);
      if(opp.comboLanded % 3 === 0){ SFX.cheer(false); burst(tx, ty, 10, ["#ffffff","#ffe9a8"], 240, 0.4, 6); }
    }
    if(opp.state==='stunned') opp.stunLeft = Math.max(opp.stunLeft, 0.55); // keep him wobbling while you work
    return;
  }
  // --- taunt: pop him for a star ---
  if(opp.state==='taunt' && kind==='jab'){
    earnStar(true);
    oppHurt(1, kind, tx, ty);
    if(opp.hp>0){ opp.state='idle'; opp.idleT = Math.max(0.5, d.tempo*0.5); }
    return;
  }
  // --- during tell: star window on flagged attacks ---
  if(opp.state==='tell' && opp.atk){
    if(opp.atk.star && kind==='jab' && !opp.feintUsed){
      earnStar(false);
      coachSay("Coach: THAT'S the moment! Now dodge what's coming!", 2.4);
      oppHurt(DMG.counter, kind, tx, ty);
      if(opp.hp>0){ opp.state='idle'; opp.idleT = Math.max(0.45, d.tempo*0.45); opp.atk=null; }
      return;
    }
    // punching into a non-star tell (or a feint): stuffed
    SFX.block(); loseHearts(1); floatText(tx, ty-30, "BLOCKED!", "#cfe3ff", 22);
    return;
  }
  // --- guard / idle ---
  if(opp.state==='idle' || opp.state==='recover'){
    if(d.blocksFace && kind==='jab' && !opp.guardBroken){
      SFX.block(); loseHearts(1);
      blockText(tx, ty);
      if(!opp.blockedHintShown){ opp.blockedHintShown = true; coachSay("Coach: His face is a vault — BODY blows, kid, body blows!", 3.2); }
      return;
    }
    if(d.blocksFace && kind==='body' && !opp.guardBroken){
      opp.guard--;
      SFX.bodyThud(); burst(tx, ty, 6, ["#ffffff","#9fb4c7"], 140, 0.35, 4);
      oppHurt(DMG.chipGuard, 'body', tx, ty);
      floatText(tx, ty-34, "GUARD " + Math.max(0,opp.guard), "#9fb4c7", 22);
      if(opp.guard<=0 && opp.hp>0){
        opp.guardBroken = true; opp.state='stunned'; opp.stunLeft = 2.4; opp.comboLanded = 0;
        SFX.crash(); splash("GUARD BROKEN!", "Unload on him!", 1.1, "#9fe8ff");
        coachSay("Coach: The wall is CRACKED! Everything you got!", 2.6);
      }
      return;
    }
    // anyone else's guard eats it
    SFX.block(); loseHearts(1);
    blockText(tx, ty);
    if(!opp.blockedHintShown){ opp.blockedHintShown = true; coachSay("Coach: Don't punch his guard — dodge his move first, THEN counter!", 3.4); }
    return;
  }
  // punching while he strikes/rushes: too late, resolved by his strike
}
function resolveUpper(){
  const face = oppFacePos();
  if(opp.state==='stunned' || opp.state==='taunt' || (opp.state==='tell' && opp.atk)){
    SFX.upper();
    G.shake = Math.max(G.shake, 12); G.hitstop = Math.max(G.hitstop, 0.09);
    burst(face.x, face.y+10, 22, ["#ffd94d","#ffffff","#ff9d3c"], 380, 0.7, 7);
    floatText(face.x, face.y-80, "STAR UPPERCUT!", "#ffd94d", 32);
    awardScore(300);
    opp.comboLanded = 0;
    oppHurt(DMG.upper, 'upper', face.x, face.y);
    if(opp.hp>0 && opp.state==='stunned'){ opp.state='idle'; opp.idleT = opp.def.tempo*0.7; }
  } else {
    // he slips it — star wasted
    SFX.whoosh();
    floatText(W/2 + opp.x, 500, "HE SLIPPED IT!", "#ff9db0", 24);
    coachSay("Coach: Save the uppercut for when he's STUNNED, kid!", 2.8);
    if(opp.state==='idle') opp.idleT = Math.min(opp.idleT, 0.4);
  }
}
function oppHurt(dmg, kind, tx, ty){
  opp.hp -= dmg; opp.dmgDealt += dmg; opp.hurtT = 0.22;
  if(kind==='body') SFX.bodyThud(); else if(kind!=='upper') SFX.thunk(false);
  burst(tx, ty, kind==='upper'?16:8, ["#ffffff","#ffd94d","#ffb3a0"], kind==='upper'?320:200, 0.4, 5);
  awardScore(kind==='upper' ? 0 : 30);
  if(opp.hp<=0){ opp.hp = 0; oppKnockdown(); }
}
function oppRecover(angry){
  if(opp.state==='down' || opp.state==='ko') return;
  opp.state='idle'; opp.comboLanded=0;
  opp.idleT = opp.def.tempo * (angry? 0.35 : rnd(0.6,1.0)) / (1 + opp.downs*0.15 + opp.phase*0.2);
}

/* ---- opponent knockdown / count ---- */
function oppKnockdown(){
  opp.downs++; G.shake = 14; SFX.crash(); SFX.gasp();
  opp.state='down'; opp.downT = 0; opp.atk = null;
  awardScore(500);
  splash("DOWN HE GOES!", "", 1.2, "#fff");
  const riseFrac = opp.def.riseFrac[opp.downs-1];
  opp.riseAt = opp.downs>=3 ? 99 : (opp.downs===1 ? 5 : 6);
  G.countSeq = { who:'opp', n:0, t:0.6, riseAt:opp.riseAt, riseHp: riseFrac ? Math.ceil(opp.maxhp*riseFrac) : 0, done:false };
  G.timeRun = false;
  const tip = opp.def.tips[Math.min(opp.downs, opp.def.tips.length-1)];
  coachSay("Coach: " + tip, 3.6);
}
function playerKnockdown(){
  player.downs++; G.careerDowns++;
  player.hp = 0; player.state='down'; player.downT = 0; player.mash = 0;
  G.shake = 14; SFX.crash(); SFX.gasp();
  splash("YOU'RE DOWN!", player.downs>=3 ? "" : "Tap like crazy to get up!", 1.2, "#ff9db0");
  if(player.downs>=3){
    G.countSeq = { who:'player', n:0, t:0.6, tko:true, done:false };
  } else {
    G.countSeq = { who:'player', n:0, t:0.6, done:false };
  }
  G.timeRun = false;
}
// multi-hit attacks keep coming if the first swing connected or was blocked
function oppFollowUp(){
  if(opp.hitsLeft>1 && player.state!=='down'){
    opp.hitsLeft--;
    opp.atk = Object.assign({}, opp.atk, { star:false });
    opp.state='tell'; opp.atkT = 0.32;
    return true;
  }
  return false;
}
function oppStrike(){
  // the attack lands NOW: judge the player's evasion
  const atk = opp.atk; if(!atk) return;
  const dodging = player.state==='dodge' && player.dodgeT>0.03;
  const ducking = player.duckT>0;
  const blocking = player.blockT>0;
  let evaded = false;
  if(dodging) evaded = true;
  else if(ducking && atk.kind==='high') evaded = true;
  if(evaded){
    SFX.whoosh();
    floatText(W/2, 560, "WHIFF!", "#9fe8ff", 26);
    if(player.tired){ gainHearts(4); floatText(W/2, 610, "+4 HEARTS", "#ff9db0", 20); }
    opp.state='stunned'; opp.stunLeft = opp.def.stunTime; opp.comboLanded = 0; opp.atk=null;
    coachSay("Coach: He's STUNNED! Unload — jab, jab, body!", 1.8);
    return;
  }
  if(blocking){
    const chip = Math.max(1, Math.round(atk.dmg*0.25));
    player.hp -= chip; loseHearts(1);
    SFX.block(); G.shake = Math.max(G.shake, 5);
    floatText(W/2, 600, "BLOCKED · -" + chip, "#cfe3ff", 22);
    if(player.hp<=0){ playerKnockdown(); return; }
    if(oppFollowUp()) return;
    opp.atk = null; opp.state='recover'; opp.idleT = opp.def.tempo*0.5;
    return;
  }
  // clean hit on the player
  player.hp -= atk.dmg;
  SFX.hurt(); G.shake = Math.max(G.shake, 9); G.flashRed = 0.35;
  player.hurtT = 0.45; player.state='hurt'; player.t=0;
  if(player.stars>0){
    player.stars--;
    floatText(W/2, 540, "STAR LOST!", "#ffd94d", 26);
    if(opp.def.starThief && player.stars>0){ player.stars--; floatText(W/2, 585, "SHAY STOLE ANOTHER!", "#ff8ad4", 20); }
  }
  loseHearts(2);
  floatText(W/2, 620, "-" + atk.dmg, "#ff9db0", 28);
  if(player.hp<=0){ playerKnockdown(); return; }
  if(oppFollowUp()) return;
  opp.atk = null; opp.state='recover'; opp.idleT = opp.def.tempo*rnd(0.55,0.85);
}
function updateCount(dt){
  const cs = G.countSeq; if(!cs) return;
  cs.t -= dt;
  if(cs.t>0) return;
  cs.n++;
  if(cs.who==='opp' && cs.n>=cs.riseAt && cs.riseAt<90){
    // he rises
    G.countSeq = null;
    opp.hp = cs.riseHp; opp.state='getup'; opp.downT = 0; opp.phase = opp.downs;
    opp.guard = opp.def.guardHp||0; opp.guardBroken = false;
    SFX.cheer(false); splash("HE'S UP!", "Angrier. Faster. Careful, kid!", 1.1, "#fff");
    G.timeRun = true;
    return;
  }
  if(cs.n>=10){
    cs.done = true; G.countSeq = null;
    if(cs.who==='opp'){ endBout(true, 'KO'); }
    else { endBout(false, cs.tko ? 'TKO' : 'KO'); }
    return;
  }
  SFX.beep(cs.n);
  cs.t = 0.85;
  // player rising check
  if(cs.who==='player' && !cs.tko && player.mash>=100){
    G.countSeq = null;
    player.hp = 34; player.hearts = Math.max(player.hearts, 10); player.tired = false;
    player.state='getup'; player.downT = 0;
    opp.state='idle'; opp.idleT = 1.2;
    SFX.cheer(true); splash("YOU'RE UP!", "Heart of a champion!", 1.2, "#9fe8ff");
    G.timeRun = true;
    return;
  }
  if(cs.who==='player' && cs.tko && cs.n>=3){
    G.countSeq = null; endBout(false, 'TKO');
  }
}
function mashInput(){
  if(G.countSeq && G.countSeq.who==='player' && player.state==='down'){
    player.mash = Math.min(100, player.mash + 9);
    tone(300 + player.mash*4, 0.05, 'square', 0.07);
  }
}
function endBout(won, how){
  G.timeRun = false; G.screen='over';
  let bonus = 0;
  if(won && (how==='KO' || how==='TKO')){ bonus = Math.round(G.timeLeft)*10; awardScore(bonus); }
  G.endInfo = { won, how, bonus, def: opp.def, score: G.boutScore + bonus, downs: opp.downs, pdowns: player.downs, champ: !!opp.def.champion && won };
  if(won){ SFX.bell(3); SFX.cheer(true); player.state='win'; }
  else { SFX.bell(2); }
  if(won) coachSay("Coach: " + opp.def.loseQuote, 5);
}

/* ============================================================
   OPPONENT AI + FIGHT UPDATE
   ============================================================ */
function currentAttacks(){
  const d = opp.def;
  if(d.champion && d.phaseAttacks && d.phaseAttacks[opp.phase]) return d.phaseAttacks[opp.phase];
  return d.attacks;
}
function startTaunt(dur){
  opp.state = 'taunt'; opp.atk = null; opp.atkT = dur; opp.tauntDur = dur;
  const lines = opp.def.tauntLines;
  if(lines && lines.length){
    const line = lines[(Math.random()*lines.length)|0];
    const f = oppFacePos();
    floatText(f.x, f.y - 96, line, '#ffffff', line.length > 42 ? 16.5 : 19);
  }
}
function oppChoose(){
  const d = opp.def;
  // taunt sometimes (star thief taunts a lot)
  if(Math.random() < (d.starThief ? 0.34 : 0.14)){
    startTaunt(rnd(0.9, 1.3));
    return;
  }
  const list = currentAttacks();
  let atk = list[(Math.random()*list.length)|0];
  // feint: Lou & champion phase 2+ sometimes fake the tell
  opp.feintUsed = false;
  opp.atk = atk; opp.hitsLeft = atk.hits||1;
  opp.state='tell'; opp.atkT = atk.tell / (1 + opp.downs*0.08 + opp.phase*0.1);
  if(atk.callout) floatText(W/2 + opp.x, oppFacePos().y - 104, atk.callout, '#ffd94d', 23);
  if(d.feints || (d.champion && opp.phase>=2)){
    if(Math.random()<0.4){ opp.feintUsed = true; opp.atkT = atk.tell*0.55; }
  }
}
function updateOpp(dt){
  const d = opp.def;
  opp.wob += dt*3.2;
  opp.hurtT = Math.max(0, opp.hurtT - dt);
  opp.flashT = Math.max(0, opp.flashT - dt);
  // drift toward/away subtly
  opp.x = lerp(opp.x, Math.sin(G.t*0.6)*10, dt*2);
  switch(opp.state){
    case 'idle': {
      opp.idleT -= dt;
      opp.tauntT -= dt;
      if(opp.tauntT<=0){ opp.tauntT = d.tauntEvery*rnd(0.85,1.25); startTaunt(rnd(1.0,1.4)); break; }
      if(opp.idleT<=0) oppChoose();
      break;
    }
    case 'taunt': {
      opp.atkT -= dt;
      if(opp.atkT<=0){
        if(d.tagTeam){
          // he tags back IN — straight into his flying rush!
          const rush = d.attacks[0];
          opp.atk = rush; opp.hitsLeft = rush.hits||1; opp.feintUsed = false;
          opp.state = 'tell'; opp.atkT = 0.38;
          floatText(W/2, 520, "¡TAG! — HE'S BACK IN!", "#ffd94d", 24);
        } else { opp.state='idle'; opp.idleT = d.tempo*rnd(0.4,0.7); }
      }
      break;
    }
    case 'tell': {
      opp.atkT -= dt;
      if(opp.atkT<=0){
        if(opp.feintUsed){
          // the fake ends: real tell begins
          opp.feintUsed = false;
          opp.atkT = opp.atk.tell*0.6;
          coachSay("Coach: That was the FAKE — here it comes!", 1.6);
        } else {
          opp.state='strike'; opp.atkT = 0.14; opp.atkHitDone = false;
          if(opp.atk.name==='spin' || opp.atk.name==='spinback') opp.spinT = 0.3;
          SFX.whoosh();
        }
      }
      break;
    }
    case 'strike': {
      opp.atkT -= dt;
      if(!opp.atkHitDone && opp.atkT<=0.05){
        opp.atkHitDone = true;
        oppStrike();
        if(opp.state==='strike'){ // strike consumed without ending (multi-hit continues)
          opp.hitsLeft--;
          if(opp.hitsLeft>0 && player.state!=='down'){
            opp.state='tell'; opp.atkT = 0.34; // follow-up swing's shorter tell
            opp.atk = Object.assign({}, opp.atk, { star:false });
          }
        }
      }
      if(opp.atkT<=0 && opp.state==='strike'){ opp.state='recover'; opp.idleT = d.tempo*0.45; }
      break;
    }
    case 'recover': {
      opp.idleT -= dt;
      if(opp.idleT<=0){ opp.state='idle'; opp.idleT = d.tempo*rnd(0.55,1.0)/(1+opp.downs*0.12+opp.phase*0.15); }
      break;
    }
    case 'stunned': {
      opp.stunLeft -= dt;
      if(opp.stunLeft<=0){ oppRecover(false); coachSay("Coach: He's back — hands up, kid!", 1.6); }
      break;
    }
    case 'down': { opp.downT += dt; break; }
    case 'getup': {
      opp.downT += dt;
      if(opp.downT>0.7){ opp.state='idle'; opp.idleT = d.tempo*0.8; }
      break;
    }
  }
}
function updatePlayer(dt){
  player.t += dt;
  player.hurtT = Math.max(0, player.hurtT-dt);
  player.duckT = Math.max(0, player.duckT-dt);
  player.blockT = Math.max(0, player.blockT-dt);
  if(player.state==='dodge'){
    player.dodgeT -= dt;
    if(player.dodgeT<=0) player.state='idle';
  } else if(player.state==='punch'){
    player.punchT -= dt;
    if(player.punchT<=0) player.state='idle';
  } else if(player.state==='hurt'){
    if(player.t>0.45) player.state='idle';
  } else if(player.state==='getup'){
    player.downT += dt;
    if(player.downT>0.6){ player.state='idle'; }
  } else if(player.state==='down'){
    player.downT += dt;
    player.mash = Math.max(0, player.mash - dt*6); // slow decay — keep tapping!
  }
  // lateral position easing
  let tx = 0;
  if(player.state==='dodge') tx = player.dodgeDir * -105 * Math.sin(Math.PI * (1 - Math.max(0,player.dodgeT)/0.34));
  player.x = lerp(player.x, tx, dt*22);
}
function updateFight(dt){
  if(G.hitstop>0){ G.hitstop -= dt; return; }
  if(G.intro>0){
    G.intro -= dt;
    if(G.intro<=0.9 && G.intro+dt>0.9){ splash("FIGHT!", "", 0.7, "#ffc832"); SFX.bell(1); }
    if(G.intro<=0){ G.timeRun = true; }
    updatePlayer(dt);
    return;
  }
  if(G.timeRun){
    G.timeLeft -= dt;
    if(G.timeLeft<=0){
      G.timeLeft = 0;
      // decision: win only if you're clearly ahead — a knockdown scored, or you out-damaged him badly
      const dealtFrac = opp.dmgDealt / opp.maxhp;
      const won = opp.downs>0 || dealtFrac>=0.75;
      endBout(won, 'DECISION');
      return;
    }
  }
  if(G.countSeq){ updateCount(dt); if(player.state==='down') updatePlayer(dt); return; }
  updatePlayer(dt);
  if(player.state!=='down' && player.state!=='ko') updateOpp(dt);
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.t += dt;
    if(p.t>=p.life){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.grav||0)*dt;
  }
}
function update(dt){
  G.t += dt;
  if(G.msg){ G.msg.t += dt; if(G.msg.t>=G.msg.dur) G.msg = null; }
  if(G.coach){ G.coach.t += dt; if(G.coach.t>=G.coach.dur) G.coach = null; }
  G.shake = Math.max(0, G.shake - dt*30);
  G.flashRed = Math.max(0, G.flashRed - dt);
  if(G.screen==='fight') updateFight(dt);
  else {
    for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.t+=dt; if(p.t>=p.life) particles.splice(i,1); else { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.grav||0)*dt; } }
  }
  // star button glow
  document.getElementById('btnStar').classList.toggle('lit', player.stars>0 && G.screen==='fight');
}

/* ============================================================
   INPUT
   ============================================================ */
function pressAction(a){
  audio();
  if(G.screen==='title'){ startCareer(); return; }
  if(G.screen==='tale'){ startFight(); return; }
  if(G.screen==='over'){ advanceAfterBout(); return; }
  // fight screen
  mashInput();
  switch(a){
    case 'dl': doDodge(-1); break;
    case 'dr': doDodge(1); break;
    case 'duck': doDuck(); break;
    case 'block': doBlock(); break;
    case 'jab': doPunch('jab'); break;
    case 'body': doPunch('body'); break;
    case 'star': doPunch('upper'); break;
  }
}
function advanceAfterBout(){
  if(!G.endInfo) return;
  if(G.endInfo.won){
    if(G.endInfo.champ){ G.screen='title'; G.endInfo=null; return; }
    G.fighterIdx++;
    showTale();
  } else {
    showTale(); // rematch the same fighter
  }
  G.endInfo = null;
}
const KEYMAP = {
  ArrowLeft:'dl', ArrowRight:'dr', ArrowDown:'duck',
  KeyZ:'jab', KeyX:'jab', KeyS:'body', KeyA:'star', ShiftLeft:'star', ShiftRight:'star', ArrowUp:'star',
  Space:'jab', Enter:'confirm'
};
const heldKeys = {};
window.addEventListener('keydown', e=>{
  if(e.repeat){ if(G.screen==='fight') mashInput(); return; }
  audio();
  if(G.screen==='fight'){ mashInput(); }
  let a = KEYMAP[e.code];
  if((e.code==='KeyZ'||e.code==='KeyX') && heldKeys['ArrowDown']) a = 'body'; // ↓+punch = body blow
  if(a==='confirm'){ pressAction('confirm'); e.preventDefault(); return; }
  if(a){ pressAction(a); e.preventDefault(); }
  else if(G.screen!=='fight' && (e.code==='Space'||e.code==='Enter')) pressAction('confirm');
});
window.addEventListener('keyup', e=>{ delete heldKeys[e.code]; });
// touch buttons
function bindBtn(id, action){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); el.classList.add('held'); pressAction(action); };
  const off = e=>{ el.classList.remove('held'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('contextmenu', e=> e.preventDefault());
}

const bgCanvas = document.createElement('canvas');
bgCanvas.width = W; bgCanvas.height = H;
(function paintBG(){
  const b = bgCanvas.getContext('2d');
  b.fillStyle = '#050508'; b.fillRect(0,0,W,H);
  /* ---- ring view region (below the top panel + status strip) ---- */
  const RT = 372; // ring top
  const g = b.createLinearGradient(0,RT,0,H);
  g.addColorStop(0,'#1b1430'); g.addColorStop(0.25,'#2c2144'); g.addColorStop(1,'#191008');
  b.fillStyle = g; b.fillRect(0,RT,W,H-RT);
  // crowd: dense rows of heads in the ring band
  const cols = ['#c96f4a','#7a9fc9','#c9b458','#8a5fb0','#58a05c','#c95a7a','#d9d3c3','#5a7a8c'];
  for(let row=0; row<4; row++){
    const y = RT + 22 + row*24, n = 27;
    for(let i=0;i<n;i++){
      const x = 13 + i*26.5 + ((row%2)*13);
      b.fillStyle = cols[(Math.random()*cols.length)|0];
      b.beginPath(); b.arc(x + (Math.random()*4-2), y + (Math.random()*3), 8, 0, TAU); b.fill();
      b.fillStyle = 'rgba(0,0,0,0.20)';
      b.beginPath(); b.arc(x, y+8, 8.5, 0.15*Math.PI, 0.85*Math.PI); b.fill();
    }
  }
  // spotlight cone
  const sg = b.createRadialGradient(W/2,RT+180,60, W/2,RT+180,430);
  sg.addColorStop(0,'rgba(255,240,200,0.20)'); sg.addColorStop(1,'rgba(255,240,200,0)');
  b.fillStyle = sg; b.fillRect(0,RT,W,H-RT);
  // ring floor (perspective)
  b.fillStyle = '#2e6da8';
  b.beginPath(); b.moveTo(28,RT+168); b.lineTo(W-28,RT+168); b.lineTo(W+60,H); b.lineTo(-60,H); b.closePath(); b.fill();
  b.fillStyle = '#3579ba';
  b.beginPath(); b.moveTo(28,RT+168); b.lineTo(W-28,RT+168); b.lineTo(W-40,RT+248); b.lineTo(40,RT+248); b.closePath(); b.fill();
  b.strokeStyle = 'rgba(255,255,255,0.10)'; b.lineWidth = 3;
  b.beginPath(); b.moveTo(70,RT+300); b.lineTo(W-70,RT+300); b.stroke();
  b.beginPath(); b.moveTo(100,RT+400); b.lineTo(W-100,RT+400); b.stroke();
  b.fillStyle = 'rgba(255,255,255,0.16)'; b.font = '900 40px Impact, "Arial Black", sans-serif'; b.textAlign='center';
  b.fillText('REBORN', W/2, RT+330);
  // ropes + posts
  const post = x=>{ b.fillStyle='#c22f24'; b.fillRect(x-9,RT+96,18,150); b.fillStyle='#8c1f18'; b.fillRect(x-9,RT+96,6,150); };
  post(36); post(W-36);
  const ropeCols = ['#e83a30','#f5efe4','#2e6da8'];
  for(let i=0;i<3;i++){
    b.strokeStyle = ropeCols[i]; b.lineWidth = 7;
    b.beginPath(); b.moveTo(36, RT+112+i*42); b.quadraticCurveTo(W/2, RT+126+i*42, W-36, RT+112+i*42); b.stroke();
  }
  // vignette
  const vg = b.createRadialGradient(W/2,H*0.68,H*0.3, W/2,H*0.68,H*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.40)');
  b.fillStyle = vg; b.fillRect(0,RT,W,H-RT);
})();

function drawGlove(x, y, r, col, cuff){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = cuff||'#f5efe4'; rr(-r*0.62, r*0.42, r*1.24, r*0.5, r*0.2); ctx.fill();
  const g = ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.2, 0,0,r*1.15);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.25,col); g.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle = col; circle(0,0,r); ctx.fill();
  ctx.fillStyle = g; circle(0,0,r); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; circle(0,0,r); ctx.stroke();
  ctx.restore();
}
function drawSparkle(x,y,r,col){
  ctx.save(); ctx.translate(x,y); ctx.fillStyle = col||'#fff6c9';
  ctx.beginPath();
  ctx.moveTo(0,-r); ctx.quadraticCurveTo(r*0.18,-r*0.18, r,0); ctx.quadraticCurveTo(r*0.18,r*0.18, 0,r);
  ctx.quadraticCurveTo(-r*0.18,r*0.18, -r,0); ctx.quadraticCurveTo(-r*0.18,-r*0.18, 0,-r);
  ctx.fill(); ctx.restore();
}

/* ---- opponent ---- */
function drawOpponent(){
  if(!opp || G.screen==='title') { if(opp) {} else return; }
  const d = opp.def, s = d.size;
  const cx = W/2 + opp.x, feet = 795;
  const bob = (opp.state==='idle'||opp.state==='tell'||opp.state==='taunt') ? Math.sin(opp.wob)*5*(d.floatAmp||1) : 0;
  let fall = 0, fallRot = 0;
  if(opp.state==='down'){ fall = Math.min(1, opp.downT/0.45); }
  if(opp.state==='getup'){ fall = 1 - Math.min(1, opp.downT/0.7); }
  if(opp.state==='ko'){ fall = 1; }
  ctx.save();
  ctx.translate(cx, feet);
  if(d.tagTeam && opp.state==='taunt'){
    // tagged OUT: he slides down and out of frame, then tags back in
    const prog = 1 - Math.max(0, opp.atkT) / Math.max(0.01, opp.tauntDur || 1.2);
    const slide = Math.sin(Math.PI * clamp(prog, 0, 1));
    ctx.translate(slide * 150, slide * 60);
    if(slide > 0.5){ // his "partner" (also him) waves from the apron
      ctx.fillStyle = d.skin; circle(-slide*150 - 120, -120, 17); ctx.fill();
      ctx.fillStyle = d.trunk; ctx.beginPath(); ctx.arc(-slide*150 - 120, -124, 17.5, Math.PI*0.95, Math.PI*2.05); ctx.quadraticCurveTo(-slide*150 - 120, -104, -slide*150 - 137, -120); ctx.fill();
    }
  }
  if(fall>0){ ctx.translate(0, fall*6); ctx.rotate(fallRot = fall*0.0); }
  ctx.scale(s, s);
  ctx.translate(0, fall * 120);
  ctx.rotate(fall * 1.35 * (opp.downs%2? 1 : -1) * 0.9);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(0, 6, 130, 16); ctx.fill();
  const hipY = -96 + bob*0.4, shoY = -262 + bob, headY = -336 + bob;
  const huge = d.body==='huge', belly = d.body==='belly', leanB = d.body==='lean';
  const torsoW = huge? 118 : belly? 104 : leanB? 78 : 92;
  // legs + trunks
  ctx.fillStyle = d.skin;
  rr(-torsoW*0.62, hipY+18, 34, 78, 10); ctx.fill();
  rr(torsoW*0.62-34, hipY+18, 34, 78, 10); ctx.fill();
  ctx.fillStyle = d.trunk; rr(-torsoW*0.72, hipY-16, torsoW*1.44, 52, 12); ctx.fill();
  ctx.fillStyle = d.accent; ctx.fillRect(-torsoW*0.72, hipY-16, torsoW*1.44, 9);
  // boots
  ctx.fillStyle = '#1c1c22'; rr(-torsoW*0.62-4, hipY+88, 42, 16, 6); ctx.fill(); rr(torsoW*0.62-38, hipY+88, 42, 16, 6); ctx.fill();
  // cape (Punchula / Main Event) flows behind the torso
  if(d.outfit==='cape'){
    ctx.fillStyle = '#4a121c';
    ctx.beginPath();
    ctx.moveTo(-torsoW*0.9, shoY+4); ctx.quadraticCurveTo(-torsoW-38, hipY-40, -torsoW-16, hipY+26);
    ctx.lineTo(torsoW+16, hipY+26); ctx.quadraticCurveTo(torsoW+38, hipY-40, torsoW*0.9, shoY+4);
    ctx.quadraticCurveTo(0, shoY-22, -torsoW*0.9, shoY+4); ctx.fill();
    ctx.fillStyle = '#2a0d12'; rr(-torsoW*0.5, shoY-16, torsoW, 22, 8); ctx.fill(); // high collar base
  }
  // torso
  const tg = ctx.createLinearGradient(0, shoY, 0, hipY);
  tg.addColorStop(0, d.skin); tg.addColorStop(1, d.skin);
  ctx.fillStyle = d.outfit==='hoodie' ? '#8f979e' : d.outfit==='sailor' ? '#274b6e' : d.outfit==='gi' ? '#f0ede6' : d.outfit==='suit' ? '#23272e' : d.skin;
  ctx.beginPath();
  ctx.moveTo(-torsoW, shoY+16);
  ctx.quadraticCurveTo(-torsoW-8, hipY-30, -torsoW*0.7, hipY-8);
  ctx.lineTo(torsoW*0.7, hipY-8);
  ctx.quadraticCurveTo(torsoW+8, hipY-30, torsoW, shoY+16);
  ctx.quadraticCurveTo(0, shoY-16, -torsoW, shoY+16);
  ctx.fill();
  if(belly){ ctx.fillStyle = 'rgba(255,255,255,0.13)'; ellipse(0, hipY-52, torsoW*0.52, 40); ctx.fill(); }
  if(huge){ ctx.fillStyle = 'rgba(0,0,0,0.10)'; ellipse(-torsoW*0.4, shoY+52, 26, 16); ctx.fill(); ellipse(torsoW*0.4, shoY+52, 26, 16); ctx.fill(); }
  // chest shading
  ctx.fillStyle = 'rgba(0,0,0,0.08)'; ellipse(0, shoY+66, torsoW*0.55, 12); ctx.fill();
  // outfit details
  if(d.outfit==='hoodie'){ // gray sweats: hood bump + pocket
    ctx.fillStyle = '#7d838a'; ellipse(0, shoY-6, torsoW*0.5, 16); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; rr(-torsoW*0.4, hipY-58, torsoW*0.8, 34, 8); ctx.fill();
  }
  if(d.outfit==='sailor'){ // collar flap + neckerchief
    ctx.fillStyle = '#f5efe4'; ctx.beginPath(); ctx.moveTo(-torsoW*0.52, shoY+12); ctx.lineTo(0, shoY+52); ctx.lineTo(torsoW*0.52, shoY+12); ctx.lineTo(torsoW*0.3, shoY+2); ctx.lineTo(-torsoW*0.3, shoY+2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c22f24'; ctx.beginPath(); ctx.moveTo(-13, shoY+34); ctx.lineTo(13, shoY+34); ctx.lineTo(0, shoY+66); ctx.closePath(); ctx.fill();
  }
  if(d.outfit==='gi'){ // gi V + black belt
    ctx.strokeStyle = '#d8d4c8'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-torsoW*0.34, shoY+14); ctx.lineTo(0, shoY+78); ctx.lineTo(torsoW*0.34, shoY+14); ctx.stroke();
    ctx.fillStyle = '#1c1c22'; ctx.fillRect(-torsoW*0.72, hipY-34, torsoW*1.44, 13);
  }
  if(d.outfit==='suit'){ // shirt V + bowtie
    ctx.fillStyle = '#f0ede6'; ctx.beginPath(); ctx.moveTo(-torsoW*0.3, shoY+12); ctx.lineTo(0, shoY+74); ctx.lineTo(torsoW*0.3, shoY+12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c22f24'; ellipse(-13, shoY+26, 11, 7); ctx.fill(); ellipse(13, shoY+26, 11, 7); ctx.fill(); circle(0, shoY+26, 5); ctx.fill();
  }

  // ---- arms / gloves by state ----
  const st = opp.state;
  let lg = {x:-torsoW-16, y:shoY+64}, rg = {x:torsoW+16, y:shoY+64}, lr = 30, rgr = 30;
  let lunge = 0;
  if(st==='idle'){ lg.y += Math.sin(opp.wob)*4; rg.y -= Math.sin(opp.wob)*4; }
  if(st==='taunt'){ lg = {x:-torsoW-26, y:shoY-6}; rg = {x:torsoW+26, y:shoY-40 + Math.sin(G.t*10)*10}; }
  if(st==='stunned'){ lg = {x:-torsoW-30, y:shoY+120}; rg = {x:torsoW+30, y:shoY+126}; }
  if(st==='down'||st==='ko'){ lg = {x:-torsoW-44, y:hipY+30}; rg = {x:torsoW+44, y:hipY+24}; }
  if(st==='tell' && opp.atk){
    const wind = opp.atk.wind||1;
    const atkSide = (opp.atk.name.charCodeAt(0)%2===0) ? 1 : -1;
    const back = {x: atkSide*(torsoW+34), y: shoY-6};
    const guard = {x: -atkSide*(torsoW+6), y: shoY+72};
    if(atkSide>0){ rg = back; lg = guard; } else { lg = back; rg = guard; }
    if(opp.atk.name==='spin'||opp.atk.name==='spinback'){ lg = {x:-torsoW-40, y:shoY+30}; rg = {x:torsoW+40, y:shoY+30}; }
    if(opp.atk.kind==='low'){ if(atkSide>0) rg = {x:torsoW+20, y:hipY-30}; else lg = {x:-torsoW-20, y:hipY-30}; }
    var tellSide = atkSide, tellWind = wind;
  }
  if(st==='strike' && opp.atk){
    lunge = 1;
    const atkSide = (opp.atk.name.charCodeAt(0)%2===0) ? 1 : -1;
    const fist = {x: atkSide*26, y: hipY+108};
    if(atkSide>0){ rg = fist; rgr = 64; lg = {x:-torsoW-8, y:shoY+52}; }
    else { lg = fist; lr = 64; rg = {x:torsoW+8, y:shoY+52}; }
    if(opp.atk.kind==='rush'){ rg = {x:30,y:hipY+118}; lg = {x:-30,y:hipY+118}; rgr = 58; lr = 58; }
  }
  // arms (thick lines shoulder->glove)
  ctx.strokeStyle = d.skin; ctx.lineCap = 'round';
  ctx.lineWidth = 27; ctx.beginPath(); ctx.moveTo(-torsoW*0.82, shoY+22); ctx.lineTo(lg.x, lg.y); ctx.stroke();
  ctx.lineWidth = 27; ctx.beginPath(); ctx.moveTo(torsoW*0.82, shoY+22); ctx.lineTo(rg.x, rg.y); ctx.stroke();
  // spin blur
  if((st==='strike' && opp.spinT>0) || (st==='tell' && opp.atk && opp.atk.name==='spin')){
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(0, shoY+40, torsoW+52, G.t*22, G.t*22+4.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, shoY+40, torsoW+52, G.t*22+Math.PI, G.t*22+Math.PI+4.2); ctx.stroke();
  }
  // tell flash: the star glove strobes
  let flashCol = null;
  if(st==='tell' && opp.atk && opp.atk.star && !opp.feintUsed){
    flashCol = (Math.sin(G.t*26)>0) ? '#ffffff' : '#ffd94d';
  }
  const drawG = (p, r, side)=>{
    let col = d.glove;
    if(flashCol && ((side>0) === ((opp.atk.name.charCodeAt(0)%2===0)))) col = flashCol;
    drawGlove(p.x, p.y, r, col, d.accent);
    if(flashCol && col===flashCol) drawSparkle(p.x + side*r, p.y - r, 20, '#fff6c9');
  };
  drawG(lg, lr, -1); drawG(rg, rgr, 1);
  if(lunge) { /* fist drawn bigger already */ }

  // signature props
  if(d.turtle){ // the Kid's pet turtle rides his shoulder, believing in him
    ctx.fillStyle = '#58a05c'; ellipse(-torsoW-2, shoY+16, 15, 9.5); ctx.fill();
    ctx.fillStyle = '#7ab86f'; circle(-torsoW-17, shoY+11, 6); ctx.fill();
    ctx.fillStyle = '#3d7a42'; ellipse(-torsoW-2, shoY+13, 9.5, 6); ctx.fill();
  }
  if(d.prop==='egg' && st==='tell' && opp.atk && opp.atk.star){
    // the raw-egg shake, mid-gulp — punch it for a star!
    ctx.save(); ctx.translate(torsoW+56, shoY+44 + Math.sin(G.t*7)*3); ctx.rotate(0.5);
    ctx.fillStyle = 'rgba(220,240,255,0.5)'; rr(-11,-20,22,40,4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; rr(-11,-20,22,40,4); ctx.stroke();
    ctx.fillStyle = '#ffb03a'; circle(0, 6, 8.5); ctx.fill();
    ctx.fillStyle = '#fff3b0'; circle(-3, -6, 5); ctx.fill();
    ctx.restore();
    drawSparkle(torsoW+56, shoY+8, 15, '#fff6c9');
  }
  if(d.prop==='spinach' && (st==='taunt' || (st==='tell' && opp.atk && opp.atk.star))){
    // the spinach can — mid-gulp during taunts, flashing before the surge
    const lift = st==='taunt' ? Math.sin(Math.min(1,(opp.tauntDur-opp.atkT)/Math.max(0.01,opp.tauntDur)) * Math.PI) * -34 : 0;
    ctx.save(); ctx.translate(torsoW+52, shoY+96 + lift); ctx.rotate(-0.15);
    ctx.fillStyle = '#2e7d32'; rr(-13,-19,26,38,4); ctx.fill();
    ctx.fillStyle = '#f5efe4'; rr(-13,-7,26,13,2); ctx.fill();
    ctx.fillStyle = '#2e7d32'; ctx.font = '900 10px "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('SPINACH', 0, 3.5);
    ctx.fillStyle = '#58a05c'; ellipse(0, -24, 10, 6); ctx.fill();
    ctx.restore();
    if(st==='tell') drawSparkle(torsoW+52, shoY+62, 15, '#c9ffd9');
  }

  // ---- head ----
  let hx = 0, hy = headY;
  let hTilt = 0;
  if(st==='stunned'){ hTilt = Math.sin(G.t*9)*0.16; hx = Math.sin(G.t*9)*7; }
  if(opp.hurtT>0){ hy -= 12; hTilt = -0.12; }
  if(st==='taunt'){ hTilt = Math.sin(G.t*6)*0.06; }
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(hTilt);
  const hr = 54;
  ctx.fillStyle = d.skin; circle(0,0,hr); ctx.fill();
  ctx.fillStyle = d.skin; circle(-hr-3, 4, 10); ctx.fill(); circle(hr+3, 4, 10); ctx.fill(); // ears
  if(d.earring){ ctx.fillStyle = '#ffd94d'; circle(hr+4, 16, 4.5); ctx.fill(); }
  // luchador mask covers the head (drawn before face features)
  if(d.hat==='mask' || d.outfit==='mask'){
    ctx.fillStyle = d.trunk; ctx.beginPath(); ctx.arc(0,-4,hr+1.5,Math.PI*0.92,Math.PI*2.08); ctx.quadraticCurveTo(hr*0.9,hr*0.5, 0,hr*0.52); ctx.quadraticCurveTo(-hr*0.9,hr*0.5, -hr,-4); ctx.fill();
    ctx.fillStyle = d.accent; ctx.beginPath(); ctx.arc(0,-hr*0.4,hr*0.52,Math.PI,TAU); ctx.quadraticCurveTo(0,-hr*0.66,-hr*0.52,-hr*0.4); ctx.fill();
    ctx.fillStyle = '#fff'; ellipse(-21,-4,11,9); ctx.fill(); ellipse(21,-4,11,9); ctx.fill();
  }
  // hair
  ctx.fillStyle = d.hair;
  if(d.hairStyle==='swoop'){ ctx.beginPath(); ctx.arc(0,-8,hr,Math.PI*1.02,Math.PI*1.98); ctx.quadraticCurveTo(hr*0.9,-hr*1.25, 0,-hr*0.72); ctx.quadraticCurveTo(-hr*0.9,-hr*1.15, -hr,-8); ctx.fill(); }
  else if(d.hairStyle==='mohawk'){ rr(-9,-hr-16,18,44,8); ctx.fill(); }
  else if(d.hairStyle==='flat'){ ctx.beginPath(); ctx.arc(0,-4,hr,Math.PI,TAU); ctx.lineTo(-hr,-4); ctx.fill(); rr(-hr,-hr-2,hr*2,14,6); ctx.fill(); }
  else if(d.hairStyle==='fade'){ ctx.beginPath(); ctx.arc(0,-6,hr,Math.PI*1.05,Math.PI*1.95); ctx.quadraticCurveTo(0,-hr*0.55, -hr*Math.cos(0.05),-6); ctx.fill(); }
  else if(d.hairStyle==='peak'){ ctx.beginPath(); ctx.arc(0,-3,hr,Math.PI*1.03,Math.PI*1.97); ctx.lineTo(0,-16); ctx.closePath(); ctx.fill(); }
  else if(d.hairStyle==='bald'){ ctx.fillStyle='rgba(255,255,255,0.35)'; ellipse(-14,-hr*0.5,13,7); ctx.fill(); }
  if(d.hat==='sailor'){ ctx.fillStyle = '#f5efe4'; ctx.beginPath(); ctx.arc(0,-hr*0.8,hr*0.6,Math.PI,TAU); ctx.quadraticCurveTo(0,-hr*1.02,-hr*0.6,-hr*0.8); ctx.fill(); rr(-hr*0.64,-hr*0.88,hr*1.28,hr*0.15,hr*0.06); ctx.fill(); }
  if(d.hat==='headband'){ ctx.fillStyle = '#c22f24'; rr(-hr-2,-hr*0.68,hr*2+4,hr*0.28,hr*0.09); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hr*0.9,-hr*0.55); ctx.quadraticCurveTo(hr*1.3,-hr*0.25, hr*1.1,hr*0.28); ctx.lineTo(hr*0.8,-hr*0.18); ctx.closePath(); ctx.fill(); }
  // face by state
  const eyeY = -6, eyeDX = 21;
  ctx.lineWidth = 4; ctx.strokeStyle = '#201812'; ctx.lineCap='round';
  if(st==='down'||st==='ko'||opp.state==='down'){
    // X eyes
    for(const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(sx*eyeDX-8, eyeY-8); ctx.lineTo(sx*eyeDX+8, eyeY+8); ctx.moveTo(sx*eyeDX+8, eyeY-8); ctx.lineTo(sx*eyeDX-8, eyeY+8); ctx.stroke(); }
  } else if(st==='stunned'){
    for(const sx of [-1,1]){ // spirals
      ctx.beginPath();
      for(let a=0;a<Math.PI*5;a+=0.4){ const r2 = a*1.5, px = sx*eyeDX + Math.cos(a+G.t*6)*r2, py = eyeY + Math.sin(a+G.t*6)*r2; if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
      ctx.stroke();
    }
    // orbiting stars
    for(let i=0;i<3;i++){ const a = G.t*4 + i*TAU/3; drawSparkle(Math.cos(a)*hr*1.05, -hr*0.85 + Math.sin(a)*9, 11, '#ffd94d'); }
  } else if(st==='tell' && opp.atk && opp.atk.star && d.prop==='stare'){
    // HYPNOTIC STARE — swirling eyes (punch him out of it for a star!)
    ctx.strokeStyle = '#a01824';
    for(const sx of [-1,1]){
      ctx.beginPath();
      for(let a=0;a<Math.PI*5;a+=0.4){ const r2 = a*1.6, px = sx*eyeDX + Math.cos(a+G.t*9)*r2, py = eyeY + Math.sin(a+G.t*9)*r2; if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
      ctx.stroke();
    }
    drawSparkle(-eyeDX-10, eyeY-14, 13, '#ff8a7a'); drawSparkle(eyeDX+10, eyeY-14, 13, '#ff8a7a');
  } else if(st==='taunt'){
    for(const sx of [-1,1]){ ctx.beginPath(); ctx.arc(sx*eyeDX, eyeY+2, 8, Math.PI*1.1, Math.PI*1.9); ctx.stroke(); } // happy closed
  } else {
    // eyes
    for(const sx of [-1,1]){
      ctx.fillStyle = '#fff'; ellipse(sx*eyeDX, eyeY, 10, 11); ctx.fill();
      ctx.fillStyle = '#201812'; circle(sx*eyeDX + (st==='tell'? sx*1 : opp.x*0.03), eyeY+2, 4.6); ctx.fill();
    }
    // brows
    ctx.lineWidth = 6;
    for(const sx of [-1,1]){
      ctx.beginPath();
      if(st==='tell'||st==='strike'){ ctx.moveTo(sx*eyeDX-11, eyeY-19); ctx.lineTo(sx*eyeDX+9, eyeY-12); }
      else { ctx.moveTo(sx*eyeDX-10, eyeY-17); ctx.lineTo(sx*eyeDX+10, eyeY-17); }
      ctx.stroke();
    }
    if(st==='tell' && opp.atk && opp.atk.star && !opp.feintUsed && Math.sin(G.t*26)>0.4){
      drawSparkle(eyeDX+8, eyeY-10, 15, '#fff6c9'); // the glint
    }
  }
  if(d.glasses && st!=='down' && st!=='ko'){
    ctx.strokeStyle = '#2b2b33'; ctx.lineWidth = 3;
    circle(-eyeDX, eyeY, 15); ctx.stroke(); circle(eyeDX, eyeY, 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-eyeDX+15, eyeY); ctx.lineTo(eyeDX-15, eyeY); ctx.stroke();
  }
  // nose
  ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(2, 2); ctx.quadraticCurveTo(8, 12, 1, 16); ctx.stroke();
  // mouth
  ctx.strokeStyle = '#5a2418'; ctx.lineWidth = 4.5;
  if(st==='stunned'){ ctx.fillStyle='#7a2c1e'; ellipse(6, 32, 8, 12); ctx.fill(); } // tongue-ish open
  else if(st==='taunt'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0, 20, 17, 0.15*Math.PI, 0.85*Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if(st==='tell'||st==='strike'){ ctx.fillStyle='#571f14'; ellipse(0, 26, 11, 8); ctx.fill(); } // shout
  else if(opp.hurtT>0){ ctx.beginPath(); ctx.arc(0, 30, 9, Math.PI*1.15, Math.PI*1.85); ctx.stroke(); } // grimace frown
  else { ctx.beginPath(); ctx.moveTo(-11, 27); ctx.lineTo(11, 27); ctx.stroke(); }
  if(d.fangs && (st==='tell'||st==='strike'||st==='taunt'||st==='stunned')){
    ctx.fillStyle = '#fff';
    for(const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(sx*10-4, 20); ctx.lineTo(sx*10+5, 20); ctx.lineTo(sx*10, 33); ctx.closePath(); ctx.fill(); }
  }
  // mustache / beard
  if(d.mustache){ ctx.fillStyle = d.hair; ellipse(0, 19, 20, 6.5); ctx.fill(); }
  if(d.beard){ ctx.fillStyle = d.hair; ctx.beginPath(); ctx.arc(0, 12, hr*0.92, 0.25*Math.PI, 0.75*Math.PI); ctx.quadraticCurveTo(0, hr*1.02, -hr*0.65, 12); ctx.fill(); }
  // monocle
  if(d.monocle){
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3; circle(eyeDX, eyeY, 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(eyeDX+10, eyeY+12); ctx.quadraticCurveTo(eyeDX+18, 34, eyeDX+6, 52); ctx.stroke();
  }
  // champion crown glint
  if(d.hat==='crown' || d.champion){
    ctx.fillStyle = '#ffc832';
    ctx.beginPath(); ctx.moveTo(-30,-hr-2); ctx.lineTo(-30,-hr-20); ctx.lineTo(-15,-hr-8); ctx.lineTo(0,-hr-24); ctx.lineTo(15,-hr-8); ctx.lineTo(30,-hr-20); ctx.lineTo(30,-hr-2); ctx.closePath(); ctx.fill();
  }
  // hurt flash
  if(opp.hurtT>0){ ctx.fillStyle = 'rgba(255,255,255,'+(opp.hurtT*1.4)+')'; circle(0,0,hr); ctx.fill(); }
  ctx.restore(); // head
  if(d.prop==='butterfly'){
    // a literal butterfly floats with him
    const bx = Math.cos(G.t*2.2)*96, by = headY - 96 + Math.sin(G.t*3.3)*15, flap = Math.abs(Math.sin(G.t*16))*0.9 + 0.15;
    ctx.save(); ctx.translate(bx, by);
    ctx.fillStyle = '#ffd94d';
    ctx.save(); ctx.rotate(-0.5*flap - 0.2); ellipse(-7, 0, 9, 5.5); ctx.fill(); ctx.restore();
    ctx.save(); ctx.rotate(0.5*flap + 0.2); ellipse(7, 0, 9, 5.5); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#2b2b33'; ellipse(0, 0, 2.4, 5.5); ctx.fill();
    ctx.restore();
  }
  ctx.restore(); // body
}

/* ---- the challenger (you), seen from behind ---- */
function drawPlayer(){
  if(player.state==='ko') return;
  const tiredPal = player.tired;
  // arcade wireframe: bright green mesh; tired = pink, hurt = red flash
  const line = player.hurtT>0 ? '#ff5f6e' : tiredPal ? '#ff9db0' : '#2eff8f';
  const fill = player.hurtT>0 ? 'rgba(255,60,80,0.13)' : tiredPal ? 'rgba(255,120,150,0.10)' : 'rgba(30,255,140,0.10)';
  let cx = W/2 + player.x;
  let baseY = 902;
  let duckDip = player.duckT>0 ? 46 : 0;
  let slump = player.tired ? 10 : 0;
  let downSlide = 0;
  if(player.state==='down') downSlide = Math.min(1, player.downT/0.5) * 150;
  if(player.state==='getup') downSlide = (1 - Math.min(1, player.downT/0.6)) * 150;
  const bob = (player.state==='idle') ? Math.sin(G.t*4.4)*3 : 0;
  const y = baseY + duckDip + slump + downSlide + bob;
  ctx.save(); ctx.translate(cx, y);
  if(player.state==='dodge') ctx.rotate(player.dodgeDir * -0.08);
  if(player.hurtT>0) ctx.translate(rnd(-4,4), rnd(-2,2));
  ctx.strokeStyle = line; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  // shoulders / back: outline + mesh
  const torsoPath = ()=>{
    ctx.beginPath();
    ctx.moveTo(-128, 6); ctx.quadraticCurveTo(-132, -86, -62, -102);
    ctx.quadraticCurveTo(0, -116, 62, -102); ctx.quadraticCurveTo(132, -86, 128, 6);
    ctx.closePath();
  };
  torsoPath(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
  // mesh lines
  ctx.save(); torsoPath(); ctx.clip();
  ctx.globalAlpha = 0.55; ctx.lineWidth = 1.3;
  for(let i=1;i<=4;i++){ const yy = -96 + i*22; ctx.beginPath(); ctx.moveTo(-132, yy); ctx.quadraticCurveTo(0, yy+12, 132, yy); ctx.stroke(); }
  for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*44, -114); ctx.quadraticCurveTo(i*50, -55, i*46, 8); ctx.stroke(); }
  ctx.restore();
  // gloves positions (same choreography as before)
  let lg = {x:-112, y:-128}, rg = {x:112, y:-128}, lr = 34, rgr = 34;
  if(player.state==='win'){ lg = {x:-96, y:-218}; rg = {x:96, y:-218}; }
  else if(player.blockT>0){ lg = {x:-30, y:-150}; rg = {x:30, y:-150}; }
  else if(player.hurtT>0){ lg = {x:-120, y:-84}; rg = {x:120, y:-84}; }
  else if(player.tired){ lg = {x:-116, y:-96}; rg = {x:116, y:-96}; }
  let punchGlove = null;
  if(player.state==='punch' && opp){
    const total = player.punchKind==='upper' ? 0.34 : 0.17;
    const half = total*0.45;
    const tt = total - player.punchT;
    const ext = tt<half ? (tt/half) : 1 - (tt-half)/(total-half);
    const ex = ext*ext*(3-2*ext);
    let target;
    if(player.punchKind==='jab'){ const f = oppFacePos(); target = {x: f.x - cx + player.punchSide*14, y: f.y + 16 - y, r: 40}; }
    else if(player.punchKind==='body'){ const bp = oppBodyPos(); target = {x: bp.x - cx, y: bp.y - y, r: 42}; }
    else { const f = oppFacePos(); target = {x: f.x - cx, y: f.y + 26 - y, r: 56}; }
    const side = player.punchKind==='body' ? player.punchSide : (player.punchKind==='upper' ? 1 : player.punchSide);
    const from = side<0 ? lg : rg;
    punchGlove = { side, x: lerp(from.x, target.x, ex), y: lerp(from.y, target.y, ex), r: lerp(34, target.r, ex) };
    if(player.punchKind==='upper' && ex>0.6) drawSparkle(punchGlove.x, punchGlove.y-20, 22, '#ffd94d');
  }
  // wireframe arms: double lines
  ctx.lineWidth = 2.2;
  for(const sgn of [-1,1]){
    const gp = sgn<0 ? lg : rg;
    ctx.beginPath(); ctx.moveTo(sgn*100, -80); ctx.lineTo(gp.x - 6, gp.y + 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sgn*108, -66); ctx.lineTo(gp.x + 6, gp.y + 12); ctx.stroke();
  }
  // head (back view): outline + hair arcs + ears
  circle(-40, -128, 9); ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
  circle(40, -128, 9); ctx.fill(); ctx.stroke();
  circle(0, -124, 41); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -130, 41, Math.PI*0.95, Math.PI*2.05); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -134, 33, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -136, 24, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
  // wireframe glove renderer
  const wfGlove = (gx, gy, r)=>{
    ctx.save(); ctx.translate(gx, gy);
    ctx.fillStyle = fill; circle(0,0,r); ctx.fill(); ctx.lineWidth = 2.4; ctx.stroke();
    ctx.lineWidth = 1.3; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
    circle(0,0,r*0.55); ctx.stroke();
    ctx.globalAlpha = 1;
    rr(-r*0.62, r*0.42, r*1.24, r*0.5, r*0.2); ctx.stroke();
    ctx.restore();
  };
  if(!punchGlove || punchGlove.side>0) wfGlove(lg.x, lg.y, lr);
  if(!punchGlove || punchGlove.side<0) wfGlove(rg.x, rg.y, rgr);
  if(punchGlove) wfGlove(punchGlove.x, punchGlove.y, punchGlove.r);
  ctx.restore();
  if(G.flashRed>0){ ctx.fillStyle = 'rgba(232,58,48,'+(G.flashRed*0.55)+')'; ctx.fillRect(0,372,W,H-372); }
}

/* ---- referee (counts only) ---- */
function drawRef(side){
  const x = side<0 ? 84 : W-84, y = 712;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(0, 4, 40, 8); ctx.fill();
  ctx.fillStyle = '#2b2b33'; rr(-16, -34, 13, 36, 5); ctx.fill(); rr(4, -34, 13, 36, 5); ctx.fill(); // legs
  ctx.fillStyle = '#f0ede6'; rr(-22, -86, 44, 56, 8); ctx.fill(); // shirt
  ctx.fillStyle = '#2b2b33'; for(let i=0;i<3;i++) ctx.fillRect(-22, -80+i*18, 44, 6); // stripes
  ctx.fillStyle = '#e8a06a'; circle(0, -102, 15); ctx.fill(); // head
  ctx.fillStyle = '#2b2b33'; ctx.beginPath(); ctx.arc(0,-106,15,Math.PI,TAU); ctx.fill();
  ctx.strokeStyle = '#e8a06a'; ctx.lineWidth = 8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-20,-76); ctx.lineTo(-34,-52); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,-76); ctx.lineTo(32,-58); ctx.stroke();
  // counting arm pumps
  if(G.countSeq){ ctx.beginPath(); ctx.moveTo(20,-76); ctx.lineTo(38,-92 - Math.sin(G.t*7)*6); ctx.stroke(); }
  ctx.restore();
}

/* ---- HUD ---- */
function bar(x,y,w,h,frac,col,bg){
  ctx.fillStyle = bg||'rgba(0,0,0,0.55)'; rr(x-3,y-3,w+6,h+6,8); ctx.fill();
  ctx.fillStyle = '#3a3f45'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w*clamp(frac,0,1), h);
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x, y, w*clamp(frac,0,1), h*0.4);
}
/* ---- portrait cards (arcade top panel) ---- */
function drawPortraitFace(d, cx, cy, hr){
  // big expressive front-facing bust portrait of fighter d, head center (cx,cy), head radius hr
  ctx.save(); ctx.translate(cx, cy);
  // shoulders / outfit hint
  ctx.fillStyle = d.outfit==='gi' ? '#f0ede6' : d.outfit==='suit' ? '#23272e' : d.outfit==='hoodie' ? '#8f979e' : d.outfit==='cape' ? '#2a0d12' : d.skin;
  ctx.beginPath(); ctx.moveTo(-hr*1.25, hr*2.05); ctx.quadraticCurveTo(-hr*1.2, hr*0.95, -hr*0.55, hr*0.86);
  ctx.quadraticCurveTo(0, hr*0.72, hr*0.55, hr*0.86); ctx.quadraticCurveTo(hr*1.2, hr*0.95, hr*1.25, hr*2.05); ctx.closePath(); ctx.fill();
  if(d.outfit==='suit'){ ctx.fillStyle = '#f0ede6'; ctx.beginPath(); ctx.moveTo(-hr*0.3, hr*0.8); ctx.lineTo(0, hr*1.3); ctx.lineTo(hr*0.3, hr*0.8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c22f24'; circle(-hr*0.12, hr*0.92, hr*0.09); ctx.fill(); circle(hr*0.12, hr*0.92, hr*0.09); ctx.fill(); }
  if(d.outfit==='gi'){ ctx.strokeStyle = '#2b2b33'; ctx.lineWidth = hr*0.07; ctx.beginPath(); ctx.moveTo(-hr*0.34, hr*0.82); ctx.lineTo(0, hr*1.25); ctx.lineTo(hr*0.34, hr*0.82); ctx.stroke(); }
  if(d.outfit==='cape'){ ctx.fillStyle = '#5c1a24'; ctx.beginPath(); ctx.moveTo(-hr*0.62, hr*0.4); ctx.lineTo(-hr*0.95, hr*1.4); ctx.lineTo(-hr*0.3, hr*1.0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hr*0.62, hr*0.4); ctx.lineTo(hr*0.95, hr*1.4); ctx.lineTo(hr*0.3, hr*1.0); ctx.closePath(); ctx.fill(); }
  // gloves up at the corners
  drawGlove(-hr*1.02, hr*1.35, hr*0.42, d.glove, d.accent);
  drawGlove(hr*1.02, hr*1.35, hr*0.42, d.glove, d.accent);
  // head
  ctx.fillStyle = d.skin; circle(0,0,hr); ctx.fill();
  ctx.fillStyle = d.skin; circle(-hr-3, hr*0.08, hr*0.19); ctx.fill(); circle(hr+3, hr*0.08, hr*0.19); ctx.fill();
  if(d.earring){ ctx.fillStyle = '#ffd94d'; circle(hr+4, hr*0.3, hr*0.08); ctx.fill(); }
  // hair / hats / mask
  ctx.fillStyle = d.hair;
  if(d.hat==='mask' || d.outfit==='mask'){
    ctx.fillStyle = d.trunk; ctx.beginPath(); ctx.arc(0,-hr*0.08,hr*1.01,Math.PI*0.95,Math.PI*2.05); ctx.quadraticCurveTo(0,hr*0.42,-hr*0.98,-hr*0.08); ctx.closePath(); ctx.fill();
    ctx.fillStyle = d.accent; ctx.beginPath(); ctx.arc(0,-hr*0.34,hr*0.5,Math.PI,TAU); ctx.quadraticCurveTo(0,-hr*0.62,-hr*0.5,-hr*0.34); ctx.fill();
    ctx.fillStyle = '#fff'; ellipse(-hr*0.39, -hr*0.1, hr*0.2, hr*0.16); ctx.fill(); ellipse(hr*0.39, -hr*0.1, hr*0.2, hr*0.16); ctx.fill();
  } else if(d.hairStyle==='swoop'){ ctx.beginPath(); ctx.arc(0,-hr*0.14,hr,Math.PI*1.02,Math.PI*1.98); ctx.quadraticCurveTo(hr*0.9,-hr*1.3, 0,-hr*0.75); ctx.quadraticCurveTo(-hr*0.9,-hr*1.2, -hr,-hr*0.14); ctx.fill(); }
  else if(d.hairStyle==='mohawk'){ rr(-hr*0.16,-hr*1.3,hr*0.32,hr*0.75,hr*0.14); ctx.fill(); }
  else if(d.hairStyle==='flat'){ ctx.beginPath(); ctx.arc(0,-hr*0.07,hr,Math.PI,TAU); ctx.lineTo(-hr,-hr*0.07); ctx.fill(); }
  else if(d.hairStyle==='fade'){ ctx.beginPath(); ctx.arc(0,-hr*0.1,hr,Math.PI*1.05,Math.PI*1.95); ctx.quadraticCurveTo(0,-hr*0.58, -hr*0.99,-hr*0.1); ctx.fill(); }
  else if(d.hairStyle==='peak'){ ctx.beginPath(); ctx.arc(0,-hr*0.05,hr,Math.PI*1.03,Math.PI*1.97); ctx.lineTo(0,-hr*0.28); ctx.closePath(); ctx.fill(); }
  else if(d.hairStyle==='bald'){ ctx.fillStyle='rgba(255,255,255,0.35)'; ellipse(-hr*0.26,-hr*0.52,hr*0.24,hr*0.13); ctx.fill(); }
  if(d.hat==='sailor'){ ctx.fillStyle = '#f5efe4'; ctx.beginPath(); ctx.arc(0,-hr*0.78,hr*0.62,Math.PI,TAU); ctx.quadraticCurveTo(0,-hr*1.05,-hr*0.62,-hr*0.78); ctx.fill(); rr(-hr*0.66,-hr*0.86,hr*1.32,hr*0.16,hr*0.07); ctx.fill(); }
  if(d.hat==='headband'){ ctx.fillStyle = '#c22f24'; rr(-hr*1.0,-hr*0.72,hr*2.0,hr*0.3,hr*0.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hr*0.9,-hr*0.6); ctx.quadraticCurveTo(hr*1.35,-hr*0.3, hr*1.15,hr*0.25); ctx.lineTo(hr*0.82,-hr*0.2); ctx.closePath(); ctx.fill(); }
  if(d.hat==='crown'){ ctx.fillStyle = '#ffc832'; ctx.beginPath(); ctx.moveTo(-hr*0.55,-hr*0.9); ctx.lineTo(-hr*0.55,-hr*1.3); ctx.lineTo(-hr*0.27,-hr*1.02); ctx.lineTo(0,-hr*1.4); ctx.lineTo(hr*0.27,-hr*1.02); ctx.lineTo(hr*0.55,-hr*1.3); ctx.lineTo(hr*0.55,-hr*0.9); ctx.closePath(); ctx.fill(); }
  // face: game-face — angled brows, grin or snarl
  const eyeY = -hr*0.08, eyeDX = hr*0.39;
  for(const sx of [-1,1]){
    ctx.fillStyle = '#fff'; ellipse(sx*eyeDX, eyeY, hr*0.19, hr*0.21); ctx.fill();
    ctx.fillStyle = '#201812'; circle(sx*eyeDX, eyeY+hr*0.03, hr*0.09); ctx.fill();
    ctx.strokeStyle = '#201812'; ctx.lineWidth = hr*0.09; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx*eyeDX-hr*0.2, eyeY-hr*0.36); ctx.lineTo(sx*eyeDX+hr*0.17, eyeY-hr*0.22); ctx.stroke();
  }
  if(d.glasses){ ctx.strokeStyle = '#2b2b33'; ctx.lineWidth = hr*0.06; circle(-eyeDX, eyeY, hr*0.3); ctx.stroke(); circle(eyeDX, eyeY, hr*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-eyeDX+hr*0.3, eyeY); ctx.lineTo(eyeDX-hr*0.3, eyeY); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = hr*0.06;
  ctx.beginPath(); ctx.moveTo(hr*0.04, hr*0.04); ctx.quadraticCurveTo(hr*0.15, hr*0.22, hr*0.02, hr*0.3); ctx.stroke();
  // mouth: cocky grin (champ: snarl)
  if(d.champion){
    ctx.fillStyle = '#fff'; rr(-hr*0.34, hr*0.42, hr*0.68, hr*0.24, hr*0.05); ctx.fill();
    ctx.strokeStyle = '#5a2418'; ctx.lineWidth = hr*0.06; rr(-hr*0.34, hr*0.42, hr*0.68, hr*0.24, hr*0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, hr*0.42); ctx.lineTo(0, hr*0.66); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, hr*0.3, hr*0.34, 0.12*Math.PI, 0.88*Math.PI); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5a2418'; ctx.lineWidth = hr*0.06; ctx.beginPath(); ctx.arc(0, hr*0.3, hr*0.34, 0.12*Math.PI, 0.88*Math.PI); ctx.stroke();
  }
  if(d.fangs){ ctx.fillStyle = '#fff'; for(const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(sx*hr*0.2, hr*0.52); ctx.lineTo(sx*hr*0.3, hr*0.52); ctx.lineTo(sx*hr*0.25, hr*0.72); ctx.closePath(); ctx.fill(); } }
  if(d.mustache){ ctx.fillStyle = d.hair; ellipse(0, hr*0.36, hr*0.37, hr*0.12); ctx.fill(); }
  if(d.beard){ ctx.fillStyle = d.hair; ctx.beginPath(); ctx.arc(0, hr*0.22, hr*0.92, 0.3*Math.PI, 0.7*Math.PI); ctx.quadraticCurveTo(0, hr*1.05, -hr*0.6, hr*0.22); ctx.fill();
    ctx.fillStyle = d.skin; ellipse(0, hr*0.42, hr*0.3, hr*0.16); ctx.fill(); }
  // signature props
  if(d.turtle){ // tiny turtle riding the shoulder
    ctx.fillStyle = '#58a05c'; ellipse(-hr*1.06, hr*0.78, hr*0.2, hr*0.13); ctx.fill();
    ctx.fillStyle = '#7ab86f'; circle(-hr*1.28, hr*0.72, hr*0.08); ctx.fill();
    ctx.fillStyle = '#3d7a42'; ellipse(-hr*1.06, hr*0.74, hr*0.13, hr*0.08); ctx.fill();
  }

    ctx.fillRect(bx, y, sw-2, 13);
  }
}
function wrapTextCenter(text, x, y, maxW){
  if(ctx.measureText(text).width <= maxW){ ctx.fillText(text, x, y); return; }
  const words = text.split(' '); let line = '', ly = y - 10;
  for(const w of words){
    const t = line ? line + ' ' + w : w;
    if(ctx.measureText(t).width > maxW && line){ ctx.fillText(line, x, ly); ly += 19; line = w; }
    else line = t;
  }
  if(line) ctx.fillText(line, x, ly);
}

}

function render(){

  ctx.drawImage(bgCanvas, 0, 0);
  if(G.screen==='title'){ drawTitle(); }
  else if(G.screen==='tale'){ drawTale(); }
  else if(G.screen==='fight'){
    drawTopPanel(); drawOpponent(); drawPlayer(); drawHUD(); drawCount(); drawSplash(); drawCoach(); drawParticles();
  }
  else if(G.screen==='over'){ drawOver(); drawParticles(); }
}

/* ---- main loop ---- */
let lastTs = 0, fpsEMA = 60, fpsTagT = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs)/1000; lastTs = ts;
  if(dt>0.05) dt = 0.05;
  if(dt>0) fpsEMA = fpsEMA*0.95 + (1/Math.max(dt,0.0001))*0.05;
  G.fps = fpsEMA;
  fpsTagT += dt;
  if(fpsTagT>0.5){ fpsTagT = 0; const el = document.getElementById('fpsTag'); if(el) el.textContent = Math.round(fpsEMA) + ' FPS'; }
  update(dt);
  render();
}
resize();
requestAnimationFrame(frame);
setTimeout(resize, 60);

/* ---- debug / verification hooks (used by the builder's play-test) ---- */
window.PO = {
  G, player, FIGHTERS, DMG,
  get opp(){ return opp; },
  fps(){ return Math.round(G.fps); },
  start: startCareer,
  fight: startFight,
  press: pressAction,
  giveStar(){ player.stars = Math.min(3, player.stars+1); },
  hurtPlayer(n){ player.hp -= n; if(player.hp<=0) playerKnockdown(); },
  downPlayer(){ playerKnockdown(); },
  setHearts(n){ player.hearts = n; if(n<=0){ player.tired = true; } },
  stunOpp(){ if(opp){ opp.state='stunned'; opp.stunLeft = 3; opp.comboLanded = 0; } },
  tellOpp(){ if(opp){ oppChoose(); } }
};
</script>
