<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Qix</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #000;
        color: #d9f6ff;
        font-family: "Courier New", ui-monospace, Menlo, monospace;
        overflow: hidden;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #app {
        display: flex; flex-direction: column;
        height: 100dvh; max-width: 720px; margin: 0 auto;
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      /* ---------- HUD ---------- */
      #hud {
        display: flex; align-items: center; gap: 10px;
        padding: 4px 2px 6px;
      }
      .hud-block { display: flex; flex-direction: column; line-height: 1.05; }
      .hud-label { font-size: 10px; letter-spacing: 2px; color: #5fd4ff; }
      .hud-value { font-size: 20px; font-weight: bold; color: #fff; text-shadow: 0 0 8px #29c8ff; }
      #pctWrap { flex: 1; min-width: 90px; }
      #pctBarOuter {
        position: relative; height: 12px; margin-top: 4px;
        border: 1px solid #1d7fa8; background: #02141f;
        box-shadow: 0 0 6px rgba(41,200,255,.35) inset;
      }
      #pctBarFill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #0e63d8, #29c8ff);
        box-shadow: 0 0 10px #29c8ff;
        transition: width .25s ease;
      }
      #pctGoal {
        position: absolute; top: -3px; bottom: -3px; left: 75%; width: 2px;
        background: #ffd23c; box-shadow: 0 0 6px #ffd23c;
      }
      #pctText { font-size: 15px; font-weight: bold; color: #bdf0ff; }
      #livesBox { display: flex; gap: 4px; align-items: center; min-height: 14px; }
      .life-diamond {
        width: 11px; height: 11px; background: #fff;
        transform: rotate(45deg);
        box-shadow: 0 0 7px #7ee6ff;
      }
      .hud-btn {
        background: #02141f; color: #7ee6ff; border: 1px solid #1d7fa8;
        font-family: inherit; font-size: 15px; line-height: 1;
        width: 36px; height: 36px; cursor: pointer; border-radius: 4px;
        display: flex; align-items: center; justify-content: center;
      }
      .hud-btn:active { background: #0a3550; }
      /* ---------- Stage ---------- */
      #stage {
        flex: 1; display: flex; align-items: center; justify-content: center;
        position: relative; min-height: 0;
      }
      #cv {
        display: block; background: #000;
        border: 2px solid #29c8ff;
        box-shadow: 0 0 18px rgba(41,200,255,.55), 0 0 4px rgba(41,200,255,.8) inset;
        border-radius: 2px;
      }
      #overlay {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; pointer-events: none; padding: 12px;
      }
      #ovTitle {
        font-size: clamp(26px, 7vw, 44px); font-weight: bold; letter-spacing: 6px;
        color: #fff; text-shadow: 0 0 14px #29c8ff, 0 0 34px #29c8ff;
      }
      #ovSub {
        margin-top: 10px; font-size: clamp(13px, 3.4vw, 17px); letter-spacing: 1px;
        color: #bdf0ff; text-shadow: 0 0 8px rgba(41,200,255,.8); white-space: pre-line;
      }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
      /* ---------- Touch draw buttons ---------- */
      #touchbar {
        display: none; gap: 12px; padding-top: 8px;
      }
      #touchbar.show { display: flex; }
      .draw-btn {
        flex: 1; height: 60px; border-radius: 8px; cursor: pointer;
        font-family: inherit; font-size: 19px; font-weight: bold; letter-spacing: 3px;
        background: #02141f;
      }
      #btnSlow { color: #6fc2ff; border: 2px solid #2b7fff; box-shadow: 0 0 10px rgba(43,127,255,.35); }
      #btnFast { color: #ffb27a; border: 2px solid #ff7a26; box-shadow: 0 0 10px rgba(255,122,38,.35); }
      #btnSlow.armed { background: #0d3f9e; color: #fff; box-shadow: 0 0 18px rgba(43,127,255,.85); }
      #btnFast.armed { background: #9e3c0d; color: #fff; box-shadow: 0 0 18px rgba(255,122,38,.85); }
      /* ---------- QR + Future Ready ---------- */
      #qrBtn {
        position: absolute; left: 10px; bottom: 10px;
        width: 48px; height: 48px; padding: 3px; z-index: 20;
        background: #fff; border: 2px solid #29c8ff; border-radius: 6px; cursor: pointer;
        box-shadow: 0 0 10px rgba(41,200,255,.5);
      }
      #qrBtn.big { width: 216px; height: 216px; padding: 8px; }
      #qrBtn canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
      #frLink {
        position: absolute; right: 12px; bottom: 14px;
        z-index: 20; color: rgba(126,230,255,.55); text-decoration: none;
        font-size: 11px; letter-spacing: 3px; font-family: inherit;
      }
      #frLink:hover { color: #7ee6ff; }
      #keysHint {
        text-align: center; font-size: 11px; color: rgba(126,230,255,.5);
        letter-spacing: 1px; padding-top: 6px;
      }
    </style>

    <script>

      // ---------- player movement ----------

      // ---------- claim (flood fill: the side without the Qix is claimed) ----------

      // ---------- Sparx ----------

      // ---------- collisions ----------

        }
        if (!P.drawing || !P.stix) return;
        var segs = [];
        for (i = 0; i < P.stix.length - 1; i++) segs.push([P.stix[i][0] * CELL, P.stix[i][1] * CELL, P.stix[i + 1][0] * CELL, P.stix[i + 1][1] * CELL]);
        segs.push([P.stix[P.stix.length - 1][0] * CELL, P.stix[P.stix.length - 1][1] * CELL, ppx, ppy]);
        for (i = 0; i < QIXES.length; i++) {
          var q = QIXES[i];
          var pts = [{ x: q.x, y: q.y }];
          if (q.A && q.B) {
            pts.push(q.A, q.B);
            for (j = 1; j < 4; j++) pts.push({ x: q.A.x + (q.B.x - q.A.x) * j / 4, y: q.A.y + (q.B.y - q.A.y) * j / 4 });
          }
          for (j = 0; j < pts.length; j++) {
            var pt = pts[j];
            var ddx = pt.x - ppx, ddy = pt.y - ppy;
            if (ddx * ddx + ddy * ddy < 121) { die("qix-player"); return; }
            for (var k = 0; k < segs.length; k++) {
              if (distPtSeg(pt.x, pt.y, segs[k][0], segs[k][1], segs[k][2], segs[k][3]) < 7.5) { die("qix-stix"); return; }
            }
          }
        }
      }

      // ---------- update ----------
      function update(dt) {
        S.time += dt;
        if (claimFlash > 0) claimFlash = Math.max(0, claimFlash - dt * 2.4);
        var i;
        if (S.state === "banner") {
          S.stateT += dt;
          for (i = 0; i < QIXES.length; i++) updateQix(QIXES[i], dt);
          if (S.stateT > 1.25) { S.state = "playing"; hideOverlay(); }
          return;
        }
        if (S.state === "ready" || S.state === "gameover") {
          for (i = 0; i < QIXES.length; i++) updateQix(QIXES[i], dt);
          return;
        }
        if (S.state === "dying") {
          S.stateT += dt;
          for (i = 0; i < parts.length; i++) {
            var p = parts[i];
            p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.life -= dt;
          }
          if (S.stateT > 0.95) afterDeath();
          return;
        }
        if (S.state === "clear") {
          S.stateT += dt;
          var ci = S.clearInfo;
          if (ci && ci.counted < ci.bonus) {
            var step = Math.min(ci.bonus - ci.counted, ci.bonus * dt / 1.15 + 1);
            ci.counted += step; S.score += step;
            updateHUD();
          }
          if (ci) {
            ovSub.textContent = "% CLAIMED " + ci.pct.toFixed(1) + "%\nBONUS +" + Math.floor(ci.counted) + (ci.counted < ci.bonus ? "" : " / " + ci.bonus);
          }
          if (S.stateT > 1.9) { S.clearInfo = null; nextLevel(); }
          return;
        }
        if (S.state !== "playing") return;
        updatePlayer(dt);
        if (S.state !== "playing") return; // died or cleared mid-update
        for (i = 0; i < QIXES.length; i++) updateQix(QIXES[i], dt);
        for (i = 0; i < SPARX.length; i++) updateSparx(SPARX[i], dt);
        sparxSpawnT += dt;
        if (sparxSpawnT > 15 && SPARX.length < maxSparx) {
          sparxSpawnT = 0;
          SPARX.push(makeSparx(SPARX.length % 2));
          tone(1200, 0.06, "square", 0.06, 1800);
        }
        warbleT -= dt;
        if (warbleT <= 0) { warbleT = 0.5; var q0 = QIXES[0]; if (q0) tone(150 + (Math.abs(q0.x + q0.y) % 90), 0.09, "sine", 0.018, 80); }
        checkCollisions();
      }

      // ---------- render ----------
      function mix(c1, c2, f) {
        return "rgb(" + Math.round(c1[0] + (c2[0] - c1[0]) * f) + "," + Math.round(c1[1] + (c2[1] - c1[1]) * f) + "," + Math.round(c1[2] + (c2[2] - c1[2]) * f) + ")";
      }
      function render() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        // claimed cells, run-length merged per row
        var slowCol = mix([23, 58, 168], [210, 235, 255], claimFlash * 0.45);
        var fastCol = mix([178, 62, 12], [255, 226, 190], claimFlash * 0.45);
        var y, x, runVal, runStart;
        for (y = 0; y < ROWS; y++) {
          runVal = 0; runStart = 0;
          for (x = 0; x <= COLS; x++) {
            var v = x < COLS ? S.claimed[y][x] : 0;
            if (v !== runVal) {
              if (runVal) {
                ctx.fillStyle = runVal === 1 ? slowCol : fastCol;
                ctx.fillRect(runStart * CELL, y * CELL, (x - runStart) * CELL, CELL);
              }
              runVal = v; runStart = x;
            }
          }
        }
        // in-progress Stix
        if (P.drawing && P.stix && P.stix.length) {
          ctx.save();
          ctx.strokeStyle = P.drawFast ? "#ff9440" : "#4dc3ff";
          ctx.lineWidth = 3;
          ctx.shadowColor = P.drawFast ? "#ff7a26" : "#29c8ff";
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(P.stix[0][0] * CELL, P.stix[0][1] * CELL);
          for (var i = 1; i < P.stix.length; i++) ctx.lineTo(P.stix[i][0] * CELL, P.stix[i][1] * CELL);
          ctx.lineTo(P.px * CELL, P.py * CELL);
          ctx.stroke();
          ctx.restore();
          // fuse spark
          if (fuse.active) {
            var fp = fusePoint(fuse.dist);
            if (fp) {
              ctx.save();
              ctx.strokeStyle = "#ffd23c"; ctx.fillStyle = "#ff7a26";
              ctx.lineWidth = 2; ctx.shadowColor = "#ff7a26"; ctx.shadowBlur = 12;
              ctx.beginPath();
              for (var a = 0; a < 6; a++) {
                var ang = a * Math.PI / 3 + S.time * 9;
                ctx.moveTo(fp.x - Math.cos(ang) * 3, fp.y - Math.sin(ang) * 3);
                ctx.lineTo(fp.x + Math.cos(ang) * 8, fp.y + Math.sin(ang) * 8);
              }
              ctx.stroke();
              ctx.beginPath(); ctx.arc(fp.x, fp.y, 3, 0, 6.29); ctx.fill();
              ctx.restore();
            }
          }
        }
        // Qix helixes
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (var qi = 0; qi < QIXES.length; qi++) {
          var q = QIXES[qi], n = q.trailA.length;
          ctx.lineWidth = 2.2;
          for (var ti = 0; ti < n; ti++) {
            var hue = (ti * 22 + S.time * 150 + qi * 140) % 360;
            ctx.strokeStyle = "hsla(" + hue + ",100%,62%," + (1 - ti / (n + 2)) + ")";
            ctx.shadowColor = "hsl(" + hue + ",100%,60%)";
            ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.moveTo(q.trailA[ti].x, q.trailA[ti].y);
            ctx.lineTo(q.trailB[ti].x, q.trailB[ti].y);
            ctx.stroke();
          }
        }
        ctx.restore();
        // Sparx
        ctx.save();
        ctx.strokeStyle = "#ff3540"; ctx.fillStyle = "#ff6a5e";
        ctx.lineWidth = 2; ctx.shadowColor = "#ff2020"; ctx.shadowBlur = 9;
        for (var si = 0; si < SPARX.length; si++) {
          var sx = SPARX[si].px * CELL, sy = SPARX[si].py * CELL;
          ctx.beginPath();
          ctx.moveTo(sx - 7, sy); ctx.lineTo(sx + 7, sy);
          ctx.moveTo(sx, sy - 7); ctx.lineTo(sx, sy + 7);
          ctx.moveTo(sx - 5, sy - 5); ctx.lineTo(sx + 5, sy + 5);
          ctx.moveTo(sx + 5, sy - 5); ctx.lineTo(sx - 5, sy + 5);
          ctx.stroke();
          ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, 6.29); ctx.fill();
        }
        ctx.restore();
        // player diamond / death particles
        if (S.state === "dying") {
          ctx.save();
          ctx.fillStyle = "#bdf0ff";
          for (var pi = 0; pi < parts.length; pi++) {
            if (parts[pi].life > 0) ctx.fillRect(parts[pi].x - 2, parts[pi].y - 2, 4, 4);
          }
          ctx.restore();
        } else if (S.state !== "gameover" && S.state !== "clear") {
          var px = P.px * CELL, py = P.py * CELL, r = 7;
          ctx.save();
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "#7ee6ff"; ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
      function fusePoint(dist) {
        if (!P.stix || P.stix.length < 2) return null;
        var st = P.stix, d = dist;
        for (var i = 0; i < st.length - 1; i++) {
          if (d <= 1) {
            return { x: (st[i][0] + (st[i + 1][0] - st[i][0]) * d) * CELL, y: (st[i][1] + (st[i + 1][1] - st[i][1]) * d) * CELL };
          }
          d -= 1;
        }
        var last = st[st.length - 1];
        return { x: (last[0] + (P.px - last[0]) * Math.min(1, d)) * CELL, y: (last[1] + (P.py - last[1]) * Math.min(1, d)) * CELL };
      }

      // ---------- main loop ----------
      var lastT = 0;
      function frame(ts) {
        requestAnimationFrame(frame);
        var dt = Math.min(0.033, lastT ? (ts - lastT) / 1000 : 0.016);
        lastT = ts;
        if (!S.paused) update(dt);
        render();
      }

      // ---------- fit ----------
      function fit() {
        var stage = document.getElementById("stage");
        var r = stage.getBoundingClientRect();
        var aw = r.width - 2, ah = r.height - 2;
        var w = aw, h = w * H / W;
        if (h > ah) { h = ah; w = h * W / H; }
        canvas.style.width = Math.max(120, w) + "px";
        canvas.style.height = Math.max(150, h) + "px";
      }
      window.addEventListener("resize", fit);

      // ---------- init ----------
      var isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
      if (isTouch) {
        document.getElementById("touchbar").classList.add("show");
        document.getElementById("keysHint").style.display = "none";
      }
      S.claimed = newGrid();
      setupLevel();
      S.state = "ready";
      showOverlay("QIX", "TAP TO START", true);
      fit();
      setTimeout(fit, 60);
      requestAnimationFrame(frame);

      // ---------- test hooks (used by the build self-audit) ----------
      window.QIX = {
        state: function () {
          return { state: S.state, score: S.score, pct: S.pct, lives: S.lives, level: S.level,
                   claimed: S.claimedCount, drawing: P.drawing, drawFast: P.drawFast,
                   px: P.px, py: P.py, lastDeath: S.lastDeath, fuseActive: fuse.active,
                   qixCount: QIXES.length, sparxCount: SPARX.length, paused: S.paused,
                   bonus: S.clearInfo ? S.clearInfo.bonus : null, hi: S.hi };
        },
        start: function () { audioInit(); startTap(); },
        want: function (d) { touchWant = d; refreshWant(); },
        clearWant: function () { touchWant = null; keyStack = []; refreshWant(); },
        setMode: function (m) { touchMode = m; modeKey = null; refreshModeButtons(); },
        debug: {
          setQix: function (i, x, y, vx, vy) { var q = QIXES[i || 0]; if (q) { q.x = x; q.y = y; if (vx !== undefined) { q.vx = vx; q.vy = vy; } q.trailA = []; q.trailB = []; } },
          qixPos: function (i) { var q = QIXES[i || 0]; return q ? { x: q.x, y: q.y } : null; },
          claimRect: function (x0, y0, x1, y1, val) {
            for (var yy = y0; yy <= y1; yy++) for (var xx = x0; xx <= x1; xx++) {
              if (S.claimed[yy][xx] === 0) { S.claimed[yy][xx] = val || 1; S.claimedCount++; }
            }
            S.pct = S.claimedCount / TOTAL * 100; updateHUD();
          },
          checkClear: function () { if (S.pct >= 75 && S.state === "playing") startClear(); },
          setPlayer: function (gx, gy) { P.px = P.tx = P.ox = gx; P.py = P.ty = P.oy = gy; P.dir = null; },
          sparxPos: function () { return SPARX.map(function (s) { return { x: s.px, y: s.py }; }); }
        }
      };
    })();
    </script>
