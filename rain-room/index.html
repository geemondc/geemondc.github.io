<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Rain Room — Future Ready Living Photos</title>
<style>
  :root{
    --led:#ff2a1a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#000;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia,'Times New Roman',serif;
    -webkit-user-select:none;
    user-select:none;
  }

  /* Blurred, darkened backdrop of the same painting */
  #backdrop{
    position:fixed;
    inset:0;
    background-image:url('rain-room.jpg');
    background-size:cover;
    background-position:center;
    filter:blur(40px) brightness(0.45);
    transform:scale(1.15);
    z-index:0;
  }

  /* Center stage — exactly the painting's box */
  #stage{
    position:relative;
    width:min(100vw, 177.78vh);
    aspect-ratio:16/9;
    height:auto;
    z-index:1;
    cursor:pointer;
    overflow:hidden;
    background:#000;
  }
  #stage img.painting{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    display:block;
  }

  .layer{
    position:absolute;
    pointer-events:none;
  }
  body.still .layer{display:none !important;}

  /* 1 — LED cove glow */
  #ledGlow{
    inset:0;
    background:
      radial-gradient(120% 55% at 50% 0%, var(--led), transparent 70%),
      linear-gradient(to bottom, var(--led) 0%, transparent 34%);
    mix-blend-mode:screen;
    opacity:0.5;
    animation:ledBreathe 7s ease-in-out infinite alternate;
    z-index:4;
  }
  @keyframes ledBreathe{
    from{opacity:0.5;}
    to{opacity:0.78;}
  }
  /* LED floor spill */
  #ledSpill{
    inset:0;
    background:radial-gradient(60% 22% at 50% 102%, var(--led), transparent 70%);
    mix-blend-mode:screen;
    opacity:0.16;
    z-index:5;
  }

  /* 4 — water shimmer band */
  #shimmer{
    left:0;
    top:50%;
    width:100%;
    height:19%;
    background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.55) 0px, rgba(255,255,255,0) 2px,
      rgba(255,255,255,0) 7px, rgba(255,255,255,0.35) 9px,
      rgba(255,255,255,0) 13px);
    background-size:100% 26px;
    mix-blend-mode:overlay;
    opacity:0.05;
    animation:shimmerSlide 20s linear infinite;
    z-index:1;
  }
  @keyframes shimmerSlide{
    from{background-position:0 0;}
    to{background-position:0 260px;}
  }

  /* 5 — lightning bloom */
  #lightning{
    inset:0;
    background:radial-gradient(45% 30% at 71% 21%, rgba(200,215,255,0.9), transparent 70%);
    mix-blend-mode:screen;
    opacity:0;
    z-index:6;
  }

  /* 3 — candle glows */
  .candle{
    width:3.2%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,94,0.95) 0%, rgba(255,150,50,0.45) 38%, transparent 70%);
    mix-blend-mode:screen;
    transform:translate(-50%,-50%);
    z-index:7;
  }
  #candle1{left:44.5%; top:79.5%; animation:flickA 1.1s ease-in-out infinite;}
  #candle2{left:46.3%; top:81%;   animation:flickB 1.6s ease-in-out infinite;}
  #candle3{left:48%;   top:79.8%; animation:flickC 0.9s ease-in-out infinite;}
  @keyframes flickA{
    0%,100%{opacity:0.75; transform:translate(-50%,-50%) scale(1);}
    30%{opacity:1; transform:translate(-50%,-52%) scale(1.12);}
    55%{opacity:0.6; transform:translate(-51%,-50%) scale(0.92);}
    80%{opacity:0.9; transform:translate(-49%,-51%) scale(1.05);}
  }
  @keyframes flickB{
    0%,100%{opacity:0.85; transform:translate(-50%,-50%) scale(1.02);}
    25%{opacity:0.55; transform:translate(-50%,-49%) scale(0.9);}
    50%{opacity:1; transform:translate(-49%,-52%) scale(1.15);}
    75%{opacity:0.7; transform:translate(-51%,-50%) scale(0.96);}
  }
  @keyframes flickC{
    0%,100%{opacity:0.65; transform:translate(-50%,-51%) scale(0.95);}
    35%{opacity:1; transform:translate(-50%,-50%) scale(1.14);}
    65%{opacity:0.8; transform:translate(-52%,-50%) scale(1);}
  }

  /* twinkle layer — the city's own lights, flickering like the candles */
  #twinkles{
    inset:0;
    z-index:2;
  }
  .twinkle{
    position:absolute;
    border-radius:50%;
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
    animation:twinkleFlick ease-in-out infinite;
  }
  @keyframes twinkleFlick{
    0%,100%{opacity:0.25;}
    28%{opacity:1;}
    52%{opacity:0.4;}
    74%{opacity:0.85;}
  }

  /* fog canvas — Sky Drifter-style cloud puffs rolling over the glass,
     city lights ghosting through the banks */
  #fog{
    inset:0;
    width:100%;
    height:100%;
    z-index:3;
  }

  /* weather canvas — rain streaks or snowflakes, by mode */
  #rain{
    inset:0;
    width:100%;
    height:100%;
    z-index:8;
  }

  /* Controls */
  #controls{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 18px;
    background:rgba(8,8,12,0.62);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:999px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:opacity 0.8s ease;
    flex-wrap:wrap;
    justify-content:center;
    max-width:96vw;
  }
  #controls.faded{opacity:0; pointer-events:none;}
  #controls .caption{
    color:rgba(255,255,255,0.75);
    font-size:11px;
    letter-spacing:0.32em;
    padding-left:0.32em;
  }
  #controls button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.85);
  }
  #modeBtn,#soundBtn,#fsBtn{
    font-size:11px;
    letter-spacing:0.14em;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18) !important;
  }
  #modeBtn:hover,#soundBtn:hover,#fsBtn:hover{background:rgba(255,255,255,0.10);}
  #fsBtn{font-size:14px; padding:4px 10px;}
  .chips{display:flex; align-items:center; gap:8px;}
  .chip{
    width:22px;
    height:22px;
    border-radius:50%;
    padding:0;
    border:1px solid rgba(255,255,255,0.25) !important;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .chip:hover{transform:scale(1.15);}
  .chip.active{
    box-shadow:0 0 0 2px rgba(0,0,0,0.7), 0 0 0 4px rgba(255,255,255,0.9);
  }
  .weather{display:flex; align-items:center; gap:6px;}
  .wbtn{
    font-size:10px;
    letter-spacing:0.14em;
    padding:6px 9px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18) !important;
  }
  .wbtn:hover{background:rgba(255,255,255,0.10);}
  .wbtn.active{
    box-shadow:0 0 0 2px rgba(0,0,0,0.7), 0 0 0 4px rgba(255,255,255,0.9);
  }
</style>
</head>
<body>

<div id="backdrop"></div>

<div id="stage" title="Tap for full screen">
  <img class="painting" src="rain-room.jpg" alt="The Rain Room">
  <div class="layer" id="shimmer"></div>
  <div class="layer" id="twinkles"></div>
  <canvas class="layer" id="fog"></canvas>
  <div class="layer" id="ledGlow"></div>
  <div class="layer" id="ledSpill"></div>
  <div class="layer" id="lightning"></div>
  <div class="layer candle" id="candle1"></div>
  <div class="layer candle" id="candle2"></div>
  <div class="layer candle" id="candle3"></div>
  <canvas class="layer" id="rain"></canvas>
</div>

<div id="controls">
  <span class="caption">THE RAIN ROOM</span>
  <button id="modeBtn">STILL</button>
  <div class="weather">
    <button class="wbtn active" data-weather="RAIN">RAIN</button>
    <button class="wbtn" data-weather="SNOW">SNOW</button>
    <button class="wbtn" data-weather="FOG">FOG</button>
  </div>
  <div class="chips">
    <button class="chip active" data-color="#ff2a1a" style="background:#ff2a1a" aria-label="Red"></button>
    <button class="chip" data-color="#ffb340" style="background:#ffb340" aria-label="Gold"></button>
    <button class="chip" data-color="#2eff7a" style="background:#2eff7a" aria-label="Green"></button>
    <button class="chip" data-color="#22d3ee" style="background:#22d3ee" aria-label="Cyan"></button>
    <button class="chip" data-color="#3b82f6" style="background:#3b82f6" aria-label="Blue"></button>
    <button class="chip" data-color="#a855f7" style="background:#a855f7" aria-label="Violet"></button>
    <button class="chip" data-color="#ffd9a0" style="background:#ffd9a0" aria-label="Warm White"></button>
  </div>
  <button id="soundBtn">Sound: Off</button>
  <button id="fsBtn" aria-label="Full screen">⛶</button>
</div>

<script>
(function(){
  'use strict';
  var body = document.body;
  var stage = document.getElementById('stage');
  var living = true;
  var weather = 'RAIN';   /* RAIN | SNOW | FOG */

  /* ---------- Rain canvas ---------- */
  var canvas = document.getElementById('rain');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, rafId = null;
  var SLANT = Math.tan(1.5 * Math.PI / 180); /* ~0.0262 */

  function sizeCanvas(){
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a, b){ return a + Math.random() * (b - a); }

  /* ---------- The window glass — measured from rain-room.jpg ----------
     We sit IN the room, so weather may only ever appear ON the glass,
     never falling through the room. The glass wall runs in perspective,
     so the glass is a polygon (fractions of the painting), not a rect:
       left jamb x = 0.085 · top edge (0.085, 0.096) rising to y = 0 at
       x = 0.73, then along the top to the right edge · bottom edge
       (0.085, 0.662) sloping down to (1, 0.735).
     Both canvases are sized to the stage (= the painting's box), so
     these image fractions are canvas fractions at any aspect. */
  var GLASS = [[0.085, 0.096], [0.73, 0], [1, 0], [1, 0.735], [0.085, 0.662]];
  function clipToGlass(c){
    c.beginPath();
    for (var i = 0; i < GLASS.length; i++){
      var px = GLASS[i][0] * W, py = GLASS[i][1] * H;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
    c.clip();
  }
  function glassTop(xf){          /* glass top edge (y fraction) at x fraction xf */
    if (xf >= 0.73) return 0;
    return 0.096 * (1 - (xf - 0.085) / (0.73 - 0.085));
  }
  function glassBottom(xf){       /* glass bottom edge (y fraction) at x fraction xf */
    return 0.662 + (0.735 - 0.662) * (xf - 0.085) / (1 - 0.085);
  }

  var streaks = [], racers = [], beads = [], flakes = [];

  function newStreak(anywhere){
    return {
      x: rand(0, W),
      y: anywhere ? rand(H * 0.03, H * 0.72) : rand(H * 0.03, H * 0.10),
      len: rand(20, 70),
      speed: rand(260, 640),
      w: rand(1, 2),
      a: rand(0.08, 0.30)
    };
  }
  function newRacer(){
    return {
      x: rand(0, W),
      y: rand(H * 0.03, H * 0.30),
      len: rand(10, 22),
      speed: rand(90, 170),
      w: rand(2.6, 3.6),
      a: rand(0.22, 0.4)
    };
  }
  function newBead(){
    return {
      x: rand(0, W),
      y: rand(H * 0.03, H * 0.72),
      r: rand(0.8, 2.1),
      life: 0,
      max: rand(900, 2600)
    };
  }
  function newFlake(anywhere){
    var xf = rand(0.085, 1);           /* born over the glass, never over the room */
    var top = glassTop(xf), bot = glassBottom(xf);
    return {
      x: xf * W,
      y: anywhere ? rand(top, bot) * H : top * H - rand(0, H * 0.03),
      r: rand(1.5, 4),
      speed: rand(11, 38),             /* slow fall — nothing like rain */
      phase: rand(0, Math.PI * 2),
      swayAmp: rand(8, 26),
      swayFreq: rand(0.4, 1.1),
      a: rand(0.35, 0.8),
      bottom: bot * H                  /* this flake's own sill line */
    };
  }
  function seed(){
    streaks = []; racers = []; beads = []; flakes = [];
    for (var i = 0; i < 80; i++) streaks.push(newStreak(true));
    for (var j = 0; j < 5; j++) racers.push(newRacer());
    for (var k = 0; k < 26; k++){ var b = newBead(); b.life = rand(0, b.max); beads.push(b); }
    for (var m = 0; m < 110; m++) flakes.push(newFlake(true));
  }

  function drawSnow(t, dt){
    for (var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      f.y += f.speed * dt;
      if (f.y - f.r > f.bottom){ flakes[i] = newFlake(false); continue; }
      var x = f.x + Math.sin(t / 1000 * f.swayFreq + f.phase) * f.swayAmp;
      /* soft halo, then the flake itself */
      ctx.fillStyle = 'rgba(255,255,255,' + (f.a * 0.30) + ')';
      ctx.beginPath();
      ctx.arc(x, f.y, f.r * 1.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')';
      ctx.beginPath();
      ctx.arc(x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var lastT = 0;
  function drawWeather(t){
    if (!living || weather === 'FOG') { rafId = null; return; }
    rafId = requestAnimationFrame(drawWeather);
    var dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    if (weather === 'SNOW'){
      ctx.save();
      clipToGlass(ctx);              /* snow lives on the glass only */
      drawSnow(t, dt);
      ctx.restore();
      return;
    }

    var i, d;
    /* streaks */
    for (i = 0; i < streaks.length; i++){
      d = streaks[i];
      d.y += d.speed * dt;
      d.x += d.speed * SLANT * dt;
      if (d.y - d.len > H * 0.74 || d.x > W + 10){
        streaks[i] = newStreak(false);
        continue;
      }
      ctx.strokeStyle = 'rgba(190,215,255,' + d.a + ')';
      ctx.lineWidth = d.w;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.len * SLANT, d.y - d.len);
      ctx.stroke();
    }
    /* fat slow racers */
    for (i = 0; i < racers.length; i++){
      d = racers[i];
      d.y += d.speed * dt;
      d.x += d.speed * SLANT * dt * 0.4;
      if (d.y > H * 0.74){
        racers[i] = newRacer();
        continue;
      }
      var g = ctx.createLinearGradient(d.x, d.y - d.len, d.x, d.y);
      g.addColorStop(0, 'rgba(200,225,255,0)');
      g.addColorStop(1, 'rgba(210,230,255,' + d.a + ')');
      ctx.strokeStyle = g;
      ctx.lineWidth = d.w;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y - d.len);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(215,235,255,' + Math.min(d.a + 0.15, 0.6) + ')';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.w * 0.62, 0, Math.PI * 2);
      ctx.fill();
    }
    /* static beads that twinkle out */
    for (i = 0; i < beads.length; i++){
      var b = beads[i];
      b.life += dt * 1000;
      if (b.life >= b.max){ beads[i] = newBead(); continue; }
      var p = b.life / b.max;
      var tw = Math.sin(p * Math.PI);          /* fade in, twinkle out */
      var a2 = 0.38 * tw * (0.6 + 0.4 * Math.sin(t / 130 + b.x));
      ctx.fillStyle = 'rgba(205,228,255,' + Math.max(a2, 0) + ')';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  function startWeather(){
    if (rafId === null && living && weather !== 'FOG'){
      lastT = performance.now();
      rafId = requestAnimationFrame(drawWeather);
    }
  }
  function stopWeather(){
    if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    ctx.clearRect(0, 0, W, H);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ stopWeather(); stopFog(); }
    else if (living){ startWeather(); startFog(); }
  });

  /* ---------- Lightning ---------- */
  var bolt = document.getElementById('lightning');
  var boltTimer = null, boltSteps = [];
  function clearBoltSteps(){
    for (var i = 0; i < boltSteps.length; i++) clearTimeout(boltSteps[i]);
    boltSteps = [];
  }
  function setBolt(op, ms){
    bolt.style.transition = 'opacity ' + ms + 'ms ease-out';
    bolt.style.opacity = op;
  }
  function flash(){
    if (!living) return;
    setBolt(0.5, 90);                                        /* rise */
    boltSteps.push(setTimeout(function(){ setBolt(0.12, 80); }, 110));
    boltSteps.push(setTimeout(function(){ setBolt(0.35, 70); }, 210));
    boltSteps.push(setTimeout(function(){ setBolt(0, 700); }, 300));
    scheduleBolt();
  }
  function scheduleBolt(){
    clearTimeout(boltTimer);
    boltTimer = setTimeout(flash, rand(13000, 30000));
  }
  function stopBolt(){
    clearTimeout(boltTimer);
    clearBoltSteps();
    bolt.style.opacity = 0;
  }

  /* ---------- Mode toggle ---------- */
  var modeBtn = document.getElementById('modeBtn');
  modeBtn.addEventListener('click', function(){
    living = !living;
    body.classList.toggle('still', !living);
    modeBtn.textContent = living ? 'STILL' : 'LIVING';
    if (living){ startWeather(); startFog(); scheduleBolt(); updateHorn(); }
    else { stopWeather(); stopFog(); stopBolt(); stopHorn(); }
  });

  /* ---------- LED chips ---------- */
  var chips = document.querySelectorAll('.chip');
  for (var c = 0; c < chips.length; c++){
    chips[c].addEventListener('click', function(){
      document.documentElement.style.setProperty('--led', this.getAttribute('data-color'));
      for (var j = 0; j < chips.length; j++) chips[j].classList.remove('active');
      this.classList.add('active');
    });
  }

  /* ---------- Weather selector ---------- */
  var wbtns = document.querySelectorAll('.wbtn');
  function setWeather(w){
    weather = w;
    for (var i = 0; i < wbtns.length; i++)
      wbtns[i].classList.toggle('active', wbtns[i].getAttribute('data-weather') === w);
    if (w === 'FOG'){
      stopWeather();                    /* weather canvas off — fog puffs take over */
    } else {
      startWeather();                   /* canvas draws rain or snow */
    }
    startFog();                         /* fog loop fades itself in or out */
    if (audioCtx) applyWeatherSound();  /* sound follows the weather */
    updateHorn();
  }
  for (var wi = 0; wi < wbtns.length; wi++){
    wbtns[wi].addEventListener('click', function(){
      setWeather(this.getAttribute('data-weather'));
    });
  }

  /* ---------- Fog — Sky Drifter cloud puffs rolling over the glass ----------
     The Drifter recipe, adapted to fixed night colors: puffs are pre-rendered
     once (shaded belly pass, lit-top pass, a whisper of city warmth underneath,
     then a radial feather so no sprite edge can ever show), and the fog loop
     drifts whole banks of them across the glass. Banks with gaps — the fog
     sits IN FRONT of the city, never smeared over it. */
  var fogCanvas = document.getElementById('fog');
  var fctx = fogCanvas.getContext('2d');
  var fogSprites = [], fogBanks = [], fogFade = 0, fogRaf = null, lastFogT = 0;

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function buildFogSprites(){
    fogSprites = [];
    for (var v = 0; v < 4; v++){
      var r = mulberry32(700 + v * 131);
      var cw = 640, ch = 320, c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      var g = c.getContext('2d');
      var blobs = [], n = 9 + Math.floor(r() * 6);            /* 9–14 blobs */
      for (var i = 0; i < n; i++)
        blobs.push([cw * (0.15 + r() * 0.70), ch * (0.36 + r() * 0.28), (0.13 + r() * 0.17) * cw]);
      var b, bx, by, br, gr;
      /* shaded under-body, dropped a third of a radius like the Drifter's */
      for (i = 0; i < blobs.length; i++){ b = blobs[i]; bx = b[0]; by = b[1] + b[2] * 0.30; br = b[2];
        gr = g.createRadialGradient(bx, by, br * 0.08, bx, by, br);
        gr.addColorStop(0, 'rgba(105,120,145,0.50)');
        gr.addColorStop(1, 'rgba(105,120,145,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fill(); }
      /* lit tops */
      for (i = 0; i < blobs.length; i++){ b = blobs[i]; bx = b[0]; by = b[1]; br = b[2];
        gr = g.createRadialGradient(bx, by - br * 0.26, br * 0.08, bx, by, br);
        gr.addColorStop(0, 'rgba(196,208,226,0.55)');
        gr.addColorStop(0.65, 'rgba(158,175,199,0.28)');
        gr.addColorStop(1, 'rgba(158,175,199,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fill(); }
      /* city glow kissing the underside — kept to a whisper */
      g.globalCompositeOperation = 'source-atop';
      var warm = g.createLinearGradient(0, ch * 0.55, 0, ch);
      warm.addColorStop(0, 'rgba(255,176,102,0)');
      warm.addColorStop(1, 'rgba(255,176,102,0.10)');
      g.fillStyle = warm; g.fillRect(0, 0, cw, ch);
      /* feather the whole puff: its canvas edges can never show as a rectangle */
      g.globalCompositeOperation = 'destination-in';
      g.save(); g.translate(cw / 2, ch / 2); g.scale(1, ch / cw);
      var mg = g.createRadialGradient(0, 0, cw * 0.16, 0, 0, cw * 0.52);
      mg.addColorStop(0, 'rgba(0,0,0,1)'); mg.addColorStop(0.72, 'rgba(0,0,0,1)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = mg; g.beginPath(); g.arc(0, 0, cw * 0.52, 0, Math.PI * 2); g.fill(); g.restore();
      g.globalCompositeOperation = 'source-over';
      fogSprites.push(c);
    }
  }

  function sizeFog(){
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    fogCanvas.width = Math.round(W * dpr);
    fogCanvas.height = Math.round(H * dpr);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function newBank(low){
    var wf = low ? rand(0.60, 0.95) : rand(0.35, 0.85);   /* fraction of stage width */
    return {
      img: Math.floor(rand(0, fogSprites.length)),
      w: wf * W,
      x: rand(0, W),
      y: low ? rand(0.52, 0.66) : rand(0.15, 0.55),       /* stage-height fraction */
      dir: Math.random() < 0.5 ? -1 : 1,
      cross: rand(70, 150),                               /* seconds to cross stage + own width */
      peak: low ? rand(0.50, 0.80) : rand(0.60, 0.95),
      cycle: rand(24, 50),                                /* alpha swell period, seconds */
      phase: rand(0, Math.PI * 2)
    };
  }
  function seedFog(){
    fogBanks = [];
    for (var i = 0; i < 6; i++) fogBanks.push(newBank(false));  /* mid-distance */
    for (var j = 0; j < 2; j++) fogBanks.push(newBank(true));   /* low, on the water line */
  }

  function drawFog(t){
    if (!living){ fogRaf = null; return; }
    var target = (weather === 'FOG') ? 1 : 0;
    var dt = Math.min((t - lastFogT) / 1000, 0.05);
    lastFogT = t;
    if (target > fogFade) fogFade = Math.min(target, fogFade + dt / 1.2);   /* ~1.2s crossfade */
    else if (target < fogFade) fogFade = Math.max(target, fogFade - dt / 1.2);
    if (fogFade <= 0){
      fctx.clearRect(0, 0, W, H);
      fogRaf = null;
      return;
    }
    fogRaf = requestAnimationFrame(drawFog);
    fctx.clearRect(0, 0, W, H);
    fctx.save();
    clipToGlass(fctx);                                      /* mist on the glass only */
    for (var i = 0; i < fogBanks.length; i++){
      var bk = fogBanks[i];
      bk.x += bk.dir * (W + bk.w) / bk.cross * dt;
      if (bk.dir > 0 && bk.x - bk.w / 2 > W + 40){ bk.x = -bk.w / 2 - 40; bk.phase = rand(0, Math.PI * 2); }
      if (bk.dir < 0 && bk.x + bk.w / 2 < -40){ bk.x = W + bk.w / 2 + 40; bk.phase = rand(0, Math.PI * 2); }
      /* breathe: swell toward ghosting the skyline, then thin and let it back */
      var swell = 0.30 + 0.70 * (0.5 + 0.5 * Math.sin(t / 1000 * Math.PI * 2 / bk.cycle + bk.phase));
      fctx.globalAlpha = fogFade * bk.peak * swell;
      var h = bk.w * 0.5;                                   /* sprites are 640×320 */
      fctx.drawImage(fogSprites[bk.img], bk.x - bk.w / 2, bk.y * H - h / 2, bk.w, h);
    }
    fctx.restore();
    fctx.globalAlpha = 1;
  }
  function startFog(){
    if (fogRaf === null){
      lastFogT = performance.now();
      fogRaf = requestAnimationFrame(drawFog);
    }
  }
  function stopFog(){
    if (fogRaf !== null){ cancelAnimationFrame(fogRaf); fogRaf = null; }
    fogFade = 0;
    fctx.clearRect(0, 0, W, H);
  }

  /* ---------- Twinkle layer — city lights flickering like the candles ---------- */
  (function buildTwinkles(){
    var box = document.getElementById('twinkles');
    function addDot(x, y){
      var d = document.createElement('div');
      d.className = 'twinkle';
      var s = rand(2, 4).toFixed(1);
      var warm = Math.random() < 0.75;
      d.style.width = s + 'px';
      d.style.height = s + 'px';
      d.style.left = x.toFixed(1) + '%';
      d.style.top = y.toFixed(1) + '%';
      d.style.background = warm
        ? 'radial-gradient(circle, rgba(255,217,160,0.95) 0%, rgba(255,190,110,0.40) 45%, transparent 72%)'
        : 'radial-gradient(circle, rgba(225,238,255,0.95) 0%, rgba(190,215,255,0.40) 45%, transparent 72%)';
      d.style.animationDuration = rand(1.4, 3.8).toFixed(2) + 's';
      d.style.animationDelay = (-rand(0, 4)).toFixed(2) + 's';
      box.appendChild(d);
    }
    var i;
    for (i = 0; i < 30; i++){            /* skyline band, denser to the right */
      var x = Math.random() < 0.62 ? rand(55, 95) : rand(4, 97);
      addDot(x, rand(33, 50));
    }
    for (i = 0; i < 18; i++) addDot(rand(45, 98), rand(40, 45));  /* bridge line */
    for (i = 0; i < 16; i++) addDot(rand(4, 97),  rand(48, 52));  /* streets / waterfront */
  })();

  /* ---------- Weather sound (Web Audio, procedural) ---------- */
  var audioCtx = null, masterGain = null, soundOn = false;
  var bodyFilter = null, bodyGainNode = null, patterGainNode = null;
  var gustLfo = null, gustLfoGain = null, hornFilter = null;
  var soundBtn = document.getElementById('soundBtn');
  function buildAudio(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    /* foghorn path — distant, muffled, fed into the same master */
    hornFilter = audioCtx.createBiquadFilter();
    hornFilter.type = 'lowpass'; hornFilter.frequency.value = 300;
    hornFilter.connect(masterGain);

    var len = 2 * audioCtx.sampleRate;
    var buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    function noiseSource(){
      var src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      return src;
    }
    /* low body of the weather — rain body, snow hush, or fog near-silence */
    bodyFilter = audioCtx.createBiquadFilter();
    bodyFilter.type = 'lowpass'; bodyFilter.frequency.value = 480;
    bodyGainNode = audioCtx.createGain(); bodyGainNode.gain.value = 0.35;
    var s1 = noiseSource();
    s1.connect(bodyFilter); bodyFilter.connect(bodyGainNode); bodyGainNode.connect(masterGain);
    s1.start();

    /* bright patter (rain only — snow and fog mute this chain) */
    var band = audioCtx.createBiquadFilter();
    band.type = 'bandpass'; band.frequency.value = 1600; band.Q.value = 0.6;
    patterGainNode = audioCtx.createGain(); patterGainNode.gain.value = 0.10;
    var s2 = noiseSource();
    s2.connect(band); band.connect(patterGainNode); patterGainNode.connect(masterGain);
    s2.start(0.37);

    /* slow gusts: LFO breathing on the master gain */
    var base = 0.85;
    masterGain.gain.value = 0;
    gustLfo = audioCtx.createOscillator();
    gustLfo.frequency.value = 0.07;
    gustLfoGain = audioCtx.createGain();
    gustLfoGain.gain.value = base * 0.2;
    gustLfo.connect(gustLfoGain); gustLfoGain.connect(masterGain.gain);
    gustLfo.start();
    masterGain._base = base;
  }

  /* Sound character per weather — switching crossfades the whole engine */
  var WEATHER_SOUND = {
    RAIN: { bodyFreq: 480, bodyGain: 0.35, patter: 0.10, lfoFreq: 0.07, lfoDepth: 0.17  },
    SNOW: { bodyFreq: 320, bodyGain: 0.12, patter: 0.0,  lfoFreq: 0.05, lfoDepth: 0.255 },
    FOG:  { bodyFreq: 200, bodyGain: 0.05, patter: 0.0,  lfoFreq: 0.04, lfoDepth: 0.12  }
  };
  function applyWeatherSound(){
    if (!audioCtx) return;
    var p = WEATHER_SOUND[weather], t = audioCtx.currentTime;
    function ramp(param, v){
      param.cancelScheduledValues(t);
      param.setValueAtTime(param.value, t);
      param.linearRampToValueAtTime(v, t + 1.4);
    }
    ramp(bodyFilter.frequency, p.bodyFreq);
    ramp(bodyGainNode.gain, p.bodyGain);
    ramp(patterGainNode.gain, p.patter);
    ramp(gustLfo.frequency, p.lfoFreq);
    ramp(gustLfoGain.gain, p.lfoDepth);
  }

  /* The foghorn — a distant two-tone blast over the bay, FOG weather only */
  var hornTimer = null;
  function foghorn(){
    if (!audioCtx || !soundOn || weather !== 'FOG' || !living) return;
    var t0 = audioCtx.currentTime;
    var env = audioCtx.createGain();
    env.gain.setValueAtTime(0, t0);
    env.gain.linearRampToValueAtTime(0.08, t0 + 0.5);   /* attack */
    env.gain.setValueAtTime(0.08, t0 + 1.6);            /* sustain ~1.1s */
    env.gain.linearRampToValueAtTime(0, t0 + 2.5);      /* release 0.9s */
    env.connect(hornFilter);
    var o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 98;
    var o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 196;
    var g2 = audioCtx.createGain(); g2.gain.value = 0.35;
    o1.connect(env);
    o2.connect(g2); g2.connect(env);
    o1.start(t0); o2.start(t0);
    o1.stop(t0 + 2.6); o2.stop(t0 + 2.6);
    scheduleFoghorn();
  }
  function scheduleFoghorn(){
    clearTimeout(hornTimer);
    hornTimer = setTimeout(foghorn, rand(18000, 28000));
  }
  function updateHorn(){
    clearTimeout(hornTimer);
    if (audioCtx && soundOn && weather === 'FOG' && living)
      hornTimer = setTimeout(foghorn, rand(2500, 6000));  /* first blast comes sooner */
  }
  function stopHorn(){ clearTimeout(hornTimer); }
  soundBtn.addEventListener('click', function(){
    if (!audioCtx) buildAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundOn = !soundOn;
    var t = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(t);
    masterGain.gain.setValueAtTime(masterGain.gain.value, t);
    masterGain.gain.linearRampToValueAtTime(soundOn ? masterGain._base : 0, t + 1.2);
    soundBtn.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
    if (soundOn) applyWeatherSound();
    updateHorn();
  });

  /* ---------- Fullscreen on stage tap ---------- */
  function toggleFS(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  stage.addEventListener('click', toggleFS);
  document.getElementById('fsBtn').addEventListener('click', toggleFS);

  /* ---------- Controls auto-fade ---------- */
  var controls = document.getElementById('controls');
  var idleTimer = null;
  function wake(){
    controls.classList.remove('faded');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ controls.classList.add('faded'); }, 3500);
  }
  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake, {passive:true});
  wake();

  /* ---------- Init ---------- */
  function init(){
    sizeCanvas();
    sizeFog();
    buildFogSprites();
    seed();
    seedFog();
    startWeather();
    scheduleBolt();
  }
  window.addEventListener('resize', function(){ sizeCanvas(); sizeFog(); seed(); seedFog(); });
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<script>
/* Wall mode: embedded in the Living Photos wall via #wall, this page's own title/controls stay hidden — the scene and its interactions stay live. */
if (location.hash === '#wall') {
  var lpWallStyle = document.createElement('style');
  lpWallStyle.textContent = '#controls{display:none !important}';
  document.head.appendChild(lpWallStyle);
}
</script>
</body>
