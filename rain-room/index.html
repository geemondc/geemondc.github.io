<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Rain Room — Future Ready Living Photos</title>
<style>
  :root{
    --led:#ff2a1a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#000;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia,'Times New Roman',serif;
    -webkit-user-select:none;
    user-select:none;
  }

  /* Blurred, darkened backdrop of the same painting */
  #backdrop{
    position:fixed;
    inset:0;
    background-image:url('rain-room.jpg');
    background-size:cover;
    background-position:center;
    filter:blur(40px) brightness(0.45);
    transform:scale(1.15);
    z-index:0;
  }

  /* Center stage — exactly the painting's box */
  #stage{
    position:relative;
    width:min(100vw, 177.78vh);
    aspect-ratio:16/9;
    height:auto;
    z-index:1;
    cursor:pointer;
    overflow:hidden;
    background:#000;
  }
  #stage img.painting{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    display:block;
  }

  .layer{
    position:absolute;
    pointer-events:none;
  }
  body.still .layer{display:none !important;}

  /* 1 — LED cove glow */
  #ledGlow{
    inset:0;
    background:
      radial-gradient(120% 55% at 50% 0%, var(--led), transparent 70%),
      linear-gradient(to bottom, var(--led) 0%, transparent 34%);
    mix-blend-mode:screen;
    opacity:0.5;
    animation:ledBreathe 7s ease-in-out infinite alternate;
    z-index:4;
  }
  @keyframes ledBreathe{
    from{opacity:0.5;}
    to{opacity:0.78;}
  }
  /* LED floor spill */
  #ledSpill{
    inset:0;
    background:radial-gradient(60% 22% at 50% 102%, var(--led), transparent 70%);
    mix-blend-mode:screen;
    opacity:0.16;
    z-index:5;
  }

  /* 4 — water shimmer band */
  #shimmer{
    left:0;
    top:50%;
    width:100%;
    height:19%;
    background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.55) 0px, rgba(255,255,255,0) 2px,
      rgba(255,255,255,0) 7px, rgba(255,255,255,0.35) 9px,
      rgba(255,255,255,0) 13px);
    background-size:100% 26px;
    mix-blend-mode:overlay;
    opacity:0.05;
    animation:shimmerSlide 20s linear infinite;
    z-index:1;
  }
  @keyframes shimmerSlide{
    from{background-position:0 0;}
    to{background-position:0 260px;}
  }

  /* 5 — lightning bloom */
  #lightning{
    inset:0;
    background:radial-gradient(45% 30% at 71% 21%, rgba(200,215,255,0.9), transparent 70%);
    mix-blend-mode:screen;
    opacity:0;
    z-index:6;
  }

  /* 3 — candle glows */
  .candle{
    width:3.2%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,94,0.95) 0%, rgba(255,150,50,0.45) 38%, transparent 70%);
    mix-blend-mode:screen;
    transform:translate(-50%,-50%);
    z-index:7;
  }
  #candle1{left:44.5%; top:79.5%; animation:flickA 1.1s ease-in-out infinite;}
  #candle2{left:46.3%; top:81%;   animation:flickB 1.6s ease-in-out infinite;}
  #candle3{left:48%;   top:79.8%; animation:flickC 0.9s ease-in-out infinite;}
  @keyframes flickA{
    0%,100%{opacity:0.75; transform:translate(-50%,-50%) scale(1);}
    30%{opacity:1; transform:translate(-50%,-52%) scale(1.12);}
    55%{opacity:0.6; transform:translate(-51%,-50%) scale(0.92);}
    80%{opacity:0.9; transform:translate(-49%,-51%) scale(1.05);}
  }
  @keyframes flickB{
    0%,100%{opacity:0.85; transform:translate(-50%,-50%) scale(1.02);}
    25%{opacity:0.55; transform:translate(-50%,-49%) scale(0.9);}
    50%{opacity:1; transform:translate(-49%,-52%) scale(1.15);}
    75%{opacity:0.7; transform:translate(-51%,-50%) scale(0.96);}
  }
  @keyframes flickC{
    0%,100%{opacity:0.65; transform:translate(-50%,-51%) scale(0.95);}
    35%{opacity:1; transform:translate(-50%,-50%) scale(1.14);}
    65%{opacity:0.8; transform:translate(-52%,-50%) scale(1);}
  }

  /* twinkle layer — the city's own lights, flickering like the candles */
  #twinkles{
    inset:0;
    z-index:2;
  }
  .twinkle{
    position:absolute;
    border-radius:50%;
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
    animation:twinkleFlick ease-in-out infinite;
  }
  @keyframes twinkleFlick{
    0%,100%{opacity:0.25;}
    28%{opacity:1;}
    52%{opacity:0.4;}
    74%{opacity:0.85;}
  }

  /* fog layer — soft drifting banks over the glass, lights ghosting through */
  #fog{
    left:0;
    top:6%;
    width:100%;
    height:66%;
    overflow:hidden;
    z-index:3;
    display:none;
  }
  #fog.on{display:block;}
  .fogbank{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }
  #fogbank1{left:-20%; top:2%;  width:85%;  height:58%; background:radial-gradient(closest-side, rgba(190,200,215,0.16), rgba(190,200,215,0) 72%); animation:fogDriftA 68s ease-in-out infinite alternate;}
  #fogbank2{left:30%;  top:20%; width:95%;  height:68%; background:radial-gradient(closest-side, rgba(190,200,215,0.12), rgba(190,200,215,0) 72%); animation:fogDriftB 90s ease-in-out infinite alternate;}
  #fogbank3{left:-12%; top:38%; width:75%;  height:54%; background:radial-gradient(closest-side, rgba(190,200,215,0.14), rgba(190,200,215,0) 72%); animation:fogDriftC 54s ease-in-out infinite alternate;}
  #fogbank4{left:45%;  top:-4%; width:72%;  height:50%; background:radial-gradient(closest-side, rgba(190,200,215,0.10), rgba(190,200,215,0) 72%); animation:fogDriftB 76s ease-in-out infinite alternate-reverse;}
  #fogbank5{left:-15%; top:78%; width:125%; height:36%; background:radial-gradient(closest-side, rgba(190,200,215,0.13), rgba(190,200,215,0) 72%); animation:fogDriftA 46s ease-in-out infinite alternate;}
  @keyframes fogDriftA{from{transform:translateX(-6%);} to{transform:translateX(7%);}}
  @keyframes fogDriftB{from{transform:translateX(5%);}  to{transform:translateX(-6%);}}
  @keyframes fogDriftC{from{transform:translateX(-4%);} to{transform:translateX(5%);}}

  /* weather canvas — rain streaks or snowflakes, by mode */
  #rain{
    inset:0;
    width:100%;
    height:100%;
    z-index:8;
  }

  /* Controls */
  #controls{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 18px;
    background:rgba(8,8,12,0.62);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:999px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:opacity 0.8s ease;
    flex-wrap:wrap;
    justify-content:center;
    max-width:96vw;
  }
  #controls.faded{opacity:0; pointer-events:none;}
  #controls .caption{
    color:rgba(255,255,255,0.75);
    font-size:11px;
    letter-spacing:0.32em;
    padding-left:0.32em;
  }
  #controls button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.85);
  }
  #modeBtn,#soundBtn,#fsBtn{
    font-size:11px;
    letter-spacing:0.14em;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18) !important;
  }
  #modeBtn:hover,#soundBtn:hover,#fsBtn:hover{background:rgba(255,255,255,0.10);}
  #fsBtn{font-size:14px; padding:4px 10px;}
  .chips{display:flex; align-items:center; gap:8px;}
  .chip{
    width:22px;
    height:22px;
    border-radius:50%;
    padding:0;
    border:1px solid rgba(255,255,255,0.25) !important;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .chip:hover{transform:scale(1.15);}
  .chip.active{
    box-shadow:0 0 0 2px rgba(0,0,0,0.7), 0 0 0 4px rgba(255,255,255,0.9);
  }
  .weather{display:flex; align-items:center; gap:6px;}
  .wbtn{
    font-size:10px;
    letter-spacing:0.14em;
    padding:6px 9px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18) !important;
  }
  .wbtn:hover{background:rgba(255,255,255,0.10);}
  .wbtn.active{
    box-shadow:0 0 0 2px rgba(0,0,0,0.7), 0 0 0 4px rgba(255,255,255,0.9);
  }
</style>
</head>
<body>

<div id="backdrop"></div>

<div id="stage" title="Tap for full screen">
  <img class="painting" src="rain-room.jpg" alt="The Rain Room">
  <div class="layer" id="shimmer"></div>
  <div class="layer" id="twinkles"></div>
  <div class="layer" id="fog">
    <div class="fogbank" id="fogbank1"></div>
    <div class="fogbank" id="fogbank2"></div>
    <div class="fogbank" id="fogbank3"></div>
    <div class="fogbank" id="fogbank4"></div>
    <div class="fogbank" id="fogbank5"></div>
  </div>
  <div class="layer" id="ledGlow"></div>
  <div class="layer" id="ledSpill"></div>
  <div class="layer" id="lightning"></div>
  <div class="layer candle" id="candle1"></div>
  <div class="layer candle" id="candle2"></div>
  <div class="layer candle" id="candle3"></div>
  <canvas class="layer" id="rain"></canvas>
</div>

<div id="controls">
  <span class="caption">THE RAIN ROOM</span>
  <button id="modeBtn">STILL</button>
  <div class="weather">
    <button class="wbtn active" data-weather="RAIN">RAIN</button>
    <button class="wbtn" data-weather="SNOW">SNOW</button>
    <button class="wbtn" data-weather="FOG">FOG</button>
  </div>
  <div class="chips">
    <button class="chip active" data-color="#ff2a1a" style="background:#ff2a1a" aria-label="Red"></button>
    <button class="chip" data-color="#ffb340" style="background:#ffb340" aria-label="Gold"></button>
    <button class="chip" data-color="#2eff7a" style="background:#2eff7a" aria-label="Green"></button>
    <button class="chip" data-color="#22d3ee" style="background:#22d3ee" aria-label="Cyan"></button>
    <button class="chip" data-color="#3b82f6" style="background:#3b82f6" aria-label="Blue"></button>
    <button class="chip" data-color="#a855f7" style="background:#a855f7" aria-label="Violet"></button>
    <button class="chip" data-color="#ffd9a0" style="background:#ffd9a0" aria-label="Warm White"></button>
  </div>
  <button id="soundBtn">Sound: Off</button>
  <button id="fsBtn" aria-label="Full screen">⛶</button>
</div>

<script>
(function(){
  'use strict';
  var body = document.body;
  var stage = document.getElementById('stage');
  var living = true;
  var weather = 'RAIN';   /* RAIN | SNOW | FOG */

  /* ---------- Rain canvas ---------- */
  var canvas = document.getElementById('rain');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, rafId = null;
  var SLANT = Math.tan(1.5 * Math.PI / 180); /* ~0.0262 */

  function sizeCanvas(){
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a, b){ return a + Math.random() * (b - a); }

  var streaks = [], racers = [], beads = [], flakes = [];

  function newStreak(anywhere){
    return {
      x: rand(0, W),
      y: anywhere ? rand(H * 0.03, H * 0.72) : rand(H * 0.03, H * 0.10),
      len: rand(20, 70),
      speed: rand(260, 640),
      w: rand(1, 2),
      a: rand(0.08, 0.30)
    };
  }
  function newRacer(){
    return {
      x: rand(0, W),
      y: rand(H * 0.03, H * 0.30),
      len: rand(10, 22),
      speed: rand(90, 170),
      w: rand(2.6, 3.6),
      a: rand(0.22, 0.4)
    };
  }
  function newBead(){
    return {
      x: rand(0, W),
      y: rand(H * 0.03, H * 0.72),
      r: rand(0.8, 2.1),
      life: 0,
      max: rand(900, 2600)
    };
  }
  function newFlake(anywhere){
    var full = Math.random() < 0.14;   /* a few drift across the whole stage */
    return {
      x: rand(0, W),
      y: anywhere ? rand(H * 0.03, full ? H * 0.97 : H * 0.72) : H * 0.03,
      r: rand(1.5, 4),
      speed: rand(11, 38),             /* slow fall — nothing like rain */
      phase: rand(0, Math.PI * 2),
      swayAmp: rand(8, 26),
      swayFreq: rand(0.4, 1.1),
      a: rand(0.35, 0.8),
      full: full
    };
  }
  function seed(){
    streaks = []; racers = []; beads = []; flakes = [];
    for (var i = 0; i < 80; i++) streaks.push(newStreak(true));
    for (var j = 0; j < 5; j++) racers.push(newRacer());
    for (var k = 0; k < 26; k++){ var b = newBead(); b.life = rand(0, b.max); beads.push(b); }
    for (var m = 0; m < 110; m++) flakes.push(newFlake(true));
  }

  function drawSnow(t, dt){
    for (var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      f.y += f.speed * dt;
      var limit = f.full ? H * 1.02 : H * 0.74;
      if (f.y - f.r > limit){ flakes[i] = newFlake(false); continue; }
      var x = f.x + Math.sin(t / 1000 * f.swayFreq + f.phase) * f.swayAmp;
      /* soft halo, then the flake itself */
      ctx.fillStyle = 'rgba(255,255,255,' + (f.a * 0.30) + ')';
      ctx.beginPath();
      ctx.arc(x, f.y, f.r * 1.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')';
      ctx.beginPath();
      ctx.arc(x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var lastT = 0;
  function drawWeather(t){
    if (!living || weather === 'FOG') { rafId = null; return; }
    rafId = requestAnimationFrame(drawWeather);
    var dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    if (weather === 'SNOW'){ drawSnow(t, dt); return; }

    var i, d;
    /* streaks */
    for (i = 0; i < streaks.length; i++){
      d = streaks[i];
      d.y += d.speed * dt;
      d.x += d.speed * SLANT * dt;
      if (d.y - d.len > H * 0.74 || d.x > W + 10){
        streaks[i] = newStreak(false);
        continue;
      }
      ctx.strokeStyle = 'rgba(190,215,255,' + d.a + ')';
      ctx.lineWidth = d.w;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.len * SLANT, d.y - d.len);
      ctx.stroke();
    }
    /* fat slow racers */
    for (i = 0; i < racers.length; i++){
      d = racers[i];
      d.y += d.speed * dt;
      d.x += d.speed * SLANT * dt * 0.4;
      if (d.y > H * 0.74){
        racers[i] = newRacer();
        continue;
      }
      var g = ctx.createLinearGradient(d.x, d.y - d.len, d.x, d.y);
      g.addColorStop(0, 'rgba(200,225,255,0)');
      g.addColorStop(1, 'rgba(210,230,255,' + d.a + ')');
      ctx.strokeStyle = g;
      ctx.lineWidth = d.w;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y - d.len);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(215,235,255,' + Math.min(d.a + 0.15, 0.6) + ')';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.w * 0.62, 0, Math.PI * 2);
      ctx.fill();
    }
    /* static beads that twinkle out */
    for (i = 0; i < beads.length; i++){
      var b = beads[i];
      b.life += dt * 1000;
      if (b.life >= b.max){ beads[i] = newBead(); continue; }
      var p = b.life / b.max;
      var tw = Math.sin(p * Math.PI);          /* fade in, twinkle out */
      var a2 = 0.38 * tw * (0.6 + 0.4 * Math.sin(t / 130 + b.x));
      ctx.fillStyle = 'rgba(205,228,255,' + Math.max(a2, 0) + ')';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  function startWeather(){
    if (rafId === null && living && weather !== 'FOG'){
      lastT = performance.now();
      rafId = requestAnimationFrame(drawWeather);
    }
  }
  function stopWeather(){
    if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    ctx.clearRect(0, 0, W, H);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stopWeather();
    else if (living) startWeather();
  });

  /* ---------- Lightning ---------- */
  var bolt = document.getElementById('lightning');
  var boltTimer = null, boltSteps = [];
  function clearBoltSteps(){
    for (var i = 0; i < boltSteps.length; i++) clearTimeout(boltSteps[i]);
    boltSteps = [];
  }
  function setBolt(op, ms){
    bolt.style.transition = 'opacity ' + ms + 'ms ease-out';
    bolt.style.opacity = op;
  }
  function flash(){
    if (!living) return;
    setBolt(0.5, 90);                                        /* rise */
    boltSteps.push(setTimeout(function(){ setBolt(0.12, 80); }, 110));
    boltSteps.push(setTimeout(function(){ setBolt(0.35, 70); }, 210));
    boltSteps.push(setTimeout(function(){ setBolt(0, 700); }, 300));
    scheduleBolt();
  }
  function scheduleBolt(){
    clearTimeout(boltTimer);
    boltTimer = setTimeout(flash, rand(13000, 30000));
  }
  function stopBolt(){
    clearTimeout(boltTimer);
    clearBoltSteps();
    bolt.style.opacity = 0;
  }

  /* ---------- Mode toggle ---------- */
  var modeBtn = document.getElementById('modeBtn');
  modeBtn.addEventListener('click', function(){
    living = !living;
    body.classList.toggle('still', !living);
    modeBtn.textContent = living ? 'STILL' : 'LIVING';
    if (living){ startWeather(); scheduleBolt(); updateHorn(); }
    else { stopWeather(); stopBolt(); stopHorn(); }
  });

  /* ---------- LED chips ---------- */
  var chips = document.querySelectorAll('.chip');
  for (var c = 0; c < chips.length; c++){
    chips[c].addEventListener('click', function(){
      document.documentElement.style.setProperty('--led', this.getAttribute('data-color'));
      for (var j = 0; j < chips.length; j++) chips[j].classList.remove('active');
      this.classList.add('active');
    });
  }

  /* ---------- Weather selector ---------- */
  var fogLayer = document.getElementById('fog');
  var wbtns = document.querySelectorAll('.wbtn');
  function setWeather(w){
    weather = w;
    for (var i = 0; i < wbtns.length; i++)
      wbtns[i].classList.toggle('active', wbtns[i].getAttribute('data-weather') === w);
    if (w === 'FOG'){
      stopWeather();                    /* canvas off — fog banks take over */
      fogLayer.classList.add('on');
    } else {
      fogLayer.classList.remove('on');
      startWeather();                   /* canvas draws rain or snow */
    }
    if (audioCtx) applyWeatherSound();  /* sound follows the weather */
    updateHorn();
  }
  for (var wi = 0; wi < wbtns.length; wi++){
    wbtns[wi].addEventListener('click', function(){
      setWeather(this.getAttribute('data-weather'));
    });
  }

  /* ---------- Twinkle layer — city lights flickering like the candles ---------- */
  (function buildTwinkles(){
    var box = document.getElementById('twinkles');
    function addDot(x, y){
      var d = document.createElement('div');
      d.className = 'twinkle';
      var s = rand(2, 4).toFixed(1);
      var warm = Math.random() < 0.75;
      d.style.width = s + 'px';
      d.style.height = s + 'px';
      d.style.left = x.toFixed(1) + '%';
      d.style.top = y.toFixed(1) + '%';
      d.style.background = warm
        ? 'radial-gradient(circle, rgba(255,217,160,0.95) 0%, rgba(255,190,110,0.40) 45%, transparent 72%)'
        : 'radial-gradient(circle, rgba(225,238,255,0.95) 0%, rgba(190,215,255,0.40) 45%, transparent 72%)';
      d.style.animationDuration = rand(1.4, 3.8).toFixed(2) + 's';
      d.style.animationDelay = (-rand(0, 4)).toFixed(2) + 's';
      box.appendChild(d);
    }
    var i;
    for (i = 0; i < 30; i++){            /* skyline band, denser to the right */
      var x = Math.random() < 0.62 ? rand(55, 95) : rand(4, 97);
      addDot(x, rand(33, 50));
    }
    for (i = 0; i < 18; i++) addDot(rand(45, 98), rand(40, 45));  /* bridge line */
    for (i = 0; i < 16; i++) addDot(rand(4, 97),  rand(48, 52));  /* streets / waterfront */
  })();

  /* ---------- Weather sound (Web Audio, procedural) ---------- */
  var audioCtx = null, masterGain = null, soundOn = false;
  var bodyFilter = null, bodyGainNode = null, patterGainNode = null;
  var gustLfo = null, gustLfoGain = null, hornFilter = null;
  var soundBtn = document.getElementById('soundBtn');
  function buildAudio(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    /* foghorn path — distant, muffled, fed into the same master */
    hornFilter = audioCtx.createBiquadFilter();
    hornFilter.type = 'lowpass'; hornFilter.frequency.value = 300;
    hornFilter.connect(masterGain);

    var len = 2 * audioCtx.sampleRate;
    var buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    function noiseSource(){
      var src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      return src;
    }
    /* low body of the weather — rain body, snow hush, or fog near-silence */
    bodyFilter = audioCtx.createBiquadFilter();
    bodyFilter.type = 'lowpass'; bodyFilter.frequency.value = 480;
    bodyGainNode = audioCtx.createGain(); bodyGainNode.gain.value = 0.35;
    var s1 = noiseSource();
    s1.connect(bodyFilter); bodyFilter.connect(bodyGainNode); bodyGainNode.connect(masterGain);
    s1.start();

    /* bright patter (rain only — snow and fog mute this chain) */
    var band = audioCtx.createBiquadFilter();
    band.type = 'bandpass'; band.frequency.value = 1600; band.Q.value = 0.6;
    patterGainNode = audioCtx.createGain(); patterGainNode.gain.value = 0.10;
    var s2 = noiseSource();
    s2.connect(band); band.connect(patterGainNode); patterGainNode.connect(masterGain);
    s2.start(0.37);

    /* slow gusts: LFO breathing on the master gain */
    var base = 0.85;
    masterGain.gain.value = 0;
    gustLfo = audioCtx.createOscillator();
    gustLfo.frequency.value = 0.07;
    gustLfoGain = audioCtx.createGain();
    gustLfoGain.gain.value = base * 0.2;
    gustLfo.connect(gustLfoGain); gustLfoGain.connect(masterGain.gain);
    gustLfo.start();
    masterGain._base = base;
  }

  /* Sound character per weather — switching crossfades the whole engine */
  var WEATHER_SOUND = {
    RAIN: { bodyFreq: 480, bodyGain: 0.35, patter: 0.10, lfoFreq: 0.07, lfoDepth: 0.17  },
    SNOW: { bodyFreq: 320, bodyGain: 0.12, patter: 0.0,  lfoFreq: 0.05, lfoDepth: 0.255 },
    FOG:  { bodyFreq: 200, bodyGain: 0.05, patter: 0.0,  lfoFreq: 0.04, lfoDepth: 0.12  }
  };
  function applyWeatherSound(){
    if (!audioCtx) return;
    var p = WEATHER_SOUND[weather], t = audioCtx.currentTime;
    function ramp(param, v){
      param.cancelScheduledValues(t);
      param.setValueAtTime(param.value, t);
      param.linearRampToValueAtTime(v, t + 1.4);
    }
    ramp(bodyFilter.frequency, p.bodyFreq);
    ramp(bodyGainNode.gain, p.bodyGain);
    ramp(patterGainNode.gain, p.patter);
    ramp(gustLfo.frequency, p.lfoFreq);
    ramp(gustLfoGain.gain, p.lfoDepth);
  }

  /* The foghorn — a distant two-tone blast over the bay, FOG weather only */
  var hornTimer = null;
  function foghorn(){
    if (!audioCtx || !soundOn || weather !== 'FOG' || !living) return;
    var t0 = audioCtx.currentTime;
    var env = audioCtx.createGain();
    env.gain.setValueAtTime(0, t0);
    env.gain.linearRampToValueAtTime(0.08, t0 + 0.5);   /* attack */
    env.gain.setValueAtTime(0.08, t0 + 1.6);            /* sustain ~1.1s */
    env.gain.linearRampToValueAtTime(0, t0 + 2.5);      /* release 0.9s */
    env.connect(hornFilter);
    var o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 98;
    var o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 196;
    var g2 = audioCtx.createGain(); g2.gain.value = 0.35;
    o1.connect(env);
    o2.connect(g2); g2.connect(env);
    o1.start(t0); o2.start(t0);
    o1.stop(t0 + 2.6); o2.stop(t0 + 2.6);
    scheduleFoghorn();
  }
  function scheduleFoghorn(){
    clearTimeout(hornTimer);
    hornTimer = setTimeout(foghorn, rand(18000, 28000));
  }
  function updateHorn(){
    clearTimeout(hornTimer);
    if (audioCtx && soundOn && weather === 'FOG' && living)
      hornTimer = setTimeout(foghorn, rand(2500, 6000));  /* first blast comes sooner */
  }
  function stopHorn(){ clearTimeout(hornTimer); }
  soundBtn.addEventListener('click', function(){
    if (!audioCtx) buildAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundOn = !soundOn;
    var t = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(t);
    masterGain.gain.setValueAtTime(masterGain.gain.value, t);
    masterGain.gain.linearRampToValueAtTime(soundOn ? masterGain._base : 0, t + 1.2);
    soundBtn.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
    if (soundOn) applyWeatherSound();
    updateHorn();
  });

  /* ---------- Fullscreen on stage tap ---------- */
  function toggleFS(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  stage.addEventListener('click', toggleFS);
  document.getElementById('fsBtn').addEventListener('click', toggleFS);

  /* ---------- Controls auto-fade ---------- */
  var controls = document.getElementById('controls');
  var idleTimer = null;
  function wake(){
    controls.classList.remove('faded');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ controls.classList.add('faded'); }, 3500);
  }
  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake, {passive:true});
  wake();

  /* ---------- Init ---------- */
  function init(){
    sizeCanvas();
    seed();
    startWeather();
    scheduleBolt();
  }
  window.addEventListener('resize', function(){ sizeCanvas(); seed(); });
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
