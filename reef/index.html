<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Reef — A Living Photo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#07090c; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:34px 18px 30px; }
  h1 { font-size:clamp(28px, 4.5vw, 44px); font-weight:normal; letter-spacing:.14em;
       text-transform:uppercase; color:#f2ead6; text-align:center; }
  .statement { margin-top:8px; font-style:italic; font-size:clamp(14px, 2vw, 18px);
               color:#b9b09a; text-align:center; }
  .stage { position:relative; width:min(1280px, 100%); margin-top:26px;
           aspect-ratio: 2688 / 1152; cursor:pointer; background:#000;
           box-shadow: 0 18px 60px rgba(0,0,0,.65); }
  .stage img { position:absolute; inset:0; width:100%; height:100%;
               object-fit:contain; display:block; }
  .deep { position:absolute; inset:0; pointer-events:none; opacity:0;
          mix-blend-mode:multiply;
          background:linear-gradient(180deg, #8aa2b5 0%, #55748f 38%, #2a4a73 68%, #122e57 100%); }
  .stage canvas, #fs canvas { position:absolute; inset:0; width:100%; height:100%;
          display:block; pointer-events:none; }
  .controls { margin-top:22px; display:flex; justify-content:center; }
  button { font-family:inherit; cursor:pointer; background:transparent;
           color:#e8e2d4; border:1px solid #8a7f63; letter-spacing:.12em; }
  #ignite { font-size:17px; padding:13px 34px; border-radius:999px;
            text-transform:uppercase; }
  #ignite:hover { background:#10161c; }
  .toggle { display:none; border:1px solid #8a7f63; border-radius:999px; overflow:hidden; }
  .toggle button { border:none; font-size:15px; padding:11px 30px;
                   text-transform:uppercase; background:transparent; }
  .toggle button.on { background:#e8e2d4; color:#141310; }
  footer { padding:26px 18px 40px; text-align:center; font-size:14px; color:#8f887a; }
  footer a { color:#b9b09a; }
  #fs { position:fixed; inset:0; background:#000; display:none; z-index:50; cursor:pointer; }
  #fs img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
</style>
</head>
<body>
<main>
  <h1>The Reef</h1>
  <div class="statement">A reef that turns neon at night</div>

  <div class="stage" id="stage" title="Tap for full screen">
    <img id="lyrDay"       src="still.jpg" alt="The original painting, untouched">
    <img id="lyrGolden"    src="golden.jpg" alt="" style="opacity:0">
    <img id="lyrNight"     src="night.jpg" alt="" style="opacity:0">
    <div class="deep" id="lyrDeep"></div>
    <img id="lyrAccClown"   src="acc-clown.png" alt="" style="opacity:0">
    <img id="lyrAccAnemone" src="acc-anemone.png" alt="" style="opacity:0">
    <img id="lyrAccTang"    src="acc-tang.png" alt="" style="opacity:0">
    <img id="lyrAccSchool"  src="acc-school.png" alt="" style="opacity:0">
    <img id="lyrAccJelly"   src="acc-jelly.png" alt="" style="opacity:0">
    <img id="lyrAccStar"    src="acc-star.png" alt="" style="opacity:0">
    <img id="lyrAccCoral"   src="acc-coral.png" alt="" style="opacity:0">
    <canvas id="lyrBubbles"></canvas>
  </div>

  <div class="controls">
    <button id="ignite">&#10022; Bring it to life</button>
    <div class="toggle" id="toggle">
      <button id="btnStill">Still</button><button id="btnLiving" class="on">Living</button>
    </div>
  </div>
</main>

<footer>
  A <a href="https://thelivingphotos.com" target="_blank" rel="noopener">Living Photo</a>
  — thelivingphotos.com
</footer>

<div id="fs">
  <img id="fsDay"       src="still.jpg" alt="">
  <img id="fsGolden"    src="golden.jpg" alt="" style="opacity:0">
  <img id="fsNight"     src="night.jpg" alt="" style="opacity:0">
  <div class="deep" id="fsDeep"></div>
  <img id="fsAccClown"   src="acc-clown.png" alt="" style="opacity:0">
  <img id="fsAccAnemone" src="acc-anemone.png" alt="" style="opacity:0">
  <img id="fsAccTang"    src="acc-tang.png" alt="" style="opacity:0">
  <img id="fsAccSchool"  src="acc-school.png" alt="" style="opacity:0">
  <img id="fsAccJelly"   src="acc-jelly.png" alt="" style="opacity:0">
  <img id="fsAccStar"    src="acc-star.png" alt="" style="opacity:0">
  <img id="fsAccCoral"   src="acc-coral.png" alt="" style="opacity:0">
  <canvas id="fsBubbles"></canvas>
</div>

<script>
(function(){
  "use strict";
  var T = 60;                 // scene loop, seconds
  var state = 'still';        // 'still' | 'living'
  var ignited = false;
  var frozen = null;          // QA: freeze the clock at this many seconds
  var forcedAcc = null;       // QA: force all accents to this opacity factor
  var anchor = 0;             // scene seconds at anchorNow (phase anchor)
  var anchorNow = 0;          // performance.now() at the anchor
  var rate = 1;               // scene seconds per wall second (7 during the ignition sweep)
  var SWEEP_END = 26.25;      // scene time where the sweep hands over
  var clock = 0;              // current scene clock, seconds (QA state)
  var lastAcc = {};           // last computed accent opacities (QA state)

  function stack(p){
    return { day: document.getElementById(p+'Day'),
             golden: document.getElementById(p+'Golden'),
             night: document.getElementById(p+'Night'),
             deep: document.getElementById(p+'Deep'),
             clown: document.getElementById(p+'AccClown'),
             anemone: document.getElementById(p+'AccAnemone'),
             tang: document.getElementById(p+'AccTang'),
             school: document.getElementById(p+'AccSchool'),
             jelly: document.getElementById(p+'AccJelly'),
             star: document.getElementById(p+'AccStar'),
             coral: document.getElementById(p+'AccCoral'),
             bubbles: document.getElementById(p+'Bubbles') };
  }
  var page = stack('lyr'), fs = stack('fs');
  var fsEl = document.getElementById('fs');
  var fsOpen = false, priorState = 'still';

  // Reef journey (60s): bright day hold -> golden water -> the night reef ->
  // back through golden -> day. t=60 wraps exactly to t=0: seamless.
  function opacities(t){
    t = ((t % T) + T) % T;
    if (t < 6)  return { day:1, golden:0, night:0 };
    if (t < 16) return { day:1, golden:(t-6)/10, night:0 };
    if (t < 24) return { day:1, golden:1, night:0 };
    if (t < 34) return { day:1, golden:1, night:(t-24)/10 };
    if (t < 44) return { day:1, golden:1, night:1 };
    if (t < 52) return { day:1, golden:1, night:1-(t-44)/8 };
    return { day:1, golden:1-(t-52)/8, night:0 };
  }
  // Accents, each glowing in its own colour on its own slow rhythm: the
  // jellyfish bells slowest, then the anemone tips, the corals, the
  // starfish, the clownfish, the school, the tang - offset like real
  // lights, never in unison. Their strength rides a scene envelope: a
  // gentle shimmer by day (0.25), fully ON at the night reef (1.0) -
  // the fluorescent life turns on as the water goes navy.
  var ACC = [ ['clown', 11, 0.0, 1.0], ['anemone', 15, 5.2, 0.95],
              ['tang', 9, 2.3, 1.0], ['school', 10, 7.1, 1.0],
              ['jelly', 17, 3.6, 0.9], ['star', 12, 8.4, 1.0],
              ['coral', 13, 1.1, 1.0] ];
  function accOpacities(t, nightAmt){
    var env = 0.25 + 0.75 * nightAmt;
    var o = {};
    for (var i = 0; i < ACC.length; i++){
      var a = ACC[i];
      var p = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + a[2]) / a[1]);
      p = p * p * (3 - 2 * p);                    // smoothstep ease
      o[a[0]] = a[3] * p * env;
    }
    if (forcedAcc !== null){ for (var k in o) o[k] = forcedAcc; }
    return o;
  }
  // Bubbles: the reef's own living accent - every world gets its own
  // twinkle, and underwater the twinkle is bubbles. A sparse handful of
  // small bubbles rising slowly on their own wall clock, wobbling
  // gently: seasoning, never a storm. They ride a canvas above the
  // plates and the glow accents; in the still state they fade away
  // entirely, and the still photo stays pixel-for-pixel itself.
  function makeBubbles(canvas, fitPhoto){
    var ctx = canvas.getContext('2d');
    var alpha = 0, parts = [], N = 15, lastMs = 0;
    function rect(){
      var r = canvas.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) return null;
      if (!fitPhoto) return { x:0, y:0, w:r.width, h:r.height, cw:r.width, ch:r.height };
      var ar = 2688 / 1152, w = r.width, h = w / ar;   // the photo's own box (object-fit: contain)
      if (h > r.height){ h = r.height; w = h * ar; }
      return { x:(r.width - w) / 2, y:(r.height - h) / 2, w:w, h:h, cw:r.width, ch:r.height };
    }
    function spawn(R, anywhere){
      return { x: R.x + Math.random() * R.w,
               y: anywhere ? R.y + Math.random() * R.h : R.y + R.h + 6,
               r: 1.3 + Math.random() * 3.2,
               v: 10 + Math.random() * 14,
               ph: Math.random() * Math.PI * 2,
               sw: 2 + Math.random() * 4 };
    }
    function step(now, target){
      var R = rect();
      if (!R){ alpha = 0; parts = []; lastMs = 0; return; }
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var pw = Math.round(R.cw * dpr), ph = Math.round(R.ch * dpr);
      if (canvas.width !== pw || canvas.height !== ph){ canvas.width = pw; canvas.height = ph; }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, R.cw, R.ch);
      var dt = lastMs ? Math.min(0.05, (now - lastMs) / 1000) : 0.016;
      lastMs = now;
      alpha += (target - alpha) * Math.min(1, dt * 1.6);
      if (alpha < 0.02){ parts = []; return; }
      while (parts.length < N) parts.push(spawn(R, true));
      var t = now / 1000;
      ctx.save();
      ctx.beginPath(); ctx.rect(R.x, R.y, R.w, R.h); ctx.clip();
      for (var i = 0; i < parts.length; i++){
        var b = parts[i];
        b.y -= b.v * dt;
        if (b.y < R.y - 8){ parts[i] = b = spawn(R, false); }
        var x = b.x + Math.sin(t * 0.6 + b.ph) * b.sw;
        ctx.beginPath();
        ctx.arc(x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(190,225,255,' + (0.10 * alpha) + ')';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(215,240,255,' + (0.55 * alpha) + ')';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x - b.r * 0.34, b.y - b.r * 0.34, Math.max(0.5, b.r * 0.3), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.6 * alpha) + ')';
        ctx.fill();
      }
      ctx.restore();
    }
    return { step: step,
             info: function(){ return { count: parts.length, alpha: Math.round(alpha * 100) / 100 }; } };
  }
  var pageBub = makeBubbles(page.bubbles, false);
  var fsBub = makeBubbles(fs.bubbles, true);

  function apply(st, so, ao, living){
    st.day.style.opacity = so.day;
    st.golden.style.opacity = so.golden;
    st.night.style.opacity = so.night;
    // Deep-water grade: as the night reef arrives, the water itself
    // goes genuinely deep - a multiplying blue depth that deepens
    // toward the bottom of the frame. It sits UNDER the glow accents,
    // so everything already lit keeps glowing in its own colour; it
    // never touches the still or the day.
    st.deep.style.opacity = so.night * 0.88;
    st.clown.style.opacity = living ? ao.clown : 0;
    st.anemone.style.opacity = living ? ao.anemone : 0;
    st.tang.style.opacity = living ? ao.tang : 0;
    st.school.style.opacity = living ? ao.school : 0;
    st.jelly.style.opacity = living ? ao.jelly : 0;
    st.star.style.opacity = living ? ao.star : 0;
    st.coral.style.opacity = living ? ao.coral : 0;
  }
  function frame(now){
    // Scene time is a pure function of wall time (performance.now): the phase
    // is anchor + rate * elapsed, re-anchored only at ignite/freeze boundaries,
    // so frame rate can never stretch the 60s cycle.
    if (ignited && frozen === null){
      var tNow = anchor + rate * (now - anchorNow) / 1000;
      if (rate === 7 && tNow >= SWEEP_END){ anchor = tNow; anchorNow = now; rate = 1; }
      clock = tNow;
    }
    var t = frozen !== null ? frozen : clock;
    var so = opacities(t);
    var ao = accOpacities(t, so.night);
    lastAcc = ao;
    var living = state === 'living';
    if (!living) so = { day:1, golden:0, night:0 };
    apply(page, so, ao, living);
    if (fsOpen) apply(fs, so, ao, true);
    pageBub.step(now, living ? 1 : 0);
    fsBub.step(now, fsOpen ? 1 : 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ignite(){
    if (!ignited){ ignited = true; anchor = 0; anchorNow = performance.now(); rate = 7; clock = 0; }
    state = 'living';
    document.getElementById('ignite').style.display = 'none';
    document.getElementById('toggle').style.display = 'flex';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  function setStill(){
    state = 'still';
    document.getElementById('btnStill').classList.add('on');
    document.getElementById('btnLiving').classList.remove('on');
  }
  function setLiving(){
    state = 'living';
    document.getElementById('btnStill').classList.remove('on');
    document.getElementById('btnLiving').classList.add('on');
  }
  document.getElementById('ignite').addEventListener('click', ignite);
  document.getElementById('btnStill').addEventListener('click', setStill);
  document.getElementById('btnLiving').addEventListener('click', setLiving);

  function openFs(){
    priorState = state;
    if (!ignited) ignite();           // full screen is the living state
    fsOpen = true; fsEl.style.display = 'block';
  }
  function closeFs(){
    fsOpen = false; fsEl.style.display = 'none';
    if (priorState === 'still') setStill(); else setLiving();  // exactly the prior state
  }
  document.getElementById('stage').addEventListener('click', openFs);
  fsEl.addEventListener('click', closeFs);
  document.addEventListener('keydown', function(e){
    if (fsOpen && (e.key === 'Escape' || e.key)) closeFs();
  });

  // QA hooks (invisible in normal use).
  window.LP = {
    ignite: ignite, setStill: setStill, setLiving: setLiving,
    openFs: openFs, closeFs: closeFs,
    setPhase: function(sec){ frozen = sec; },
    unfreeze: function(){ if (frozen !== null){ frozen = null; anchor = clock; anchorNow = performance.now(); } },
    forceAccents: function(v){ forcedAcc = v; },
    accOpacities: function(){ return lastAcc; },
    bubbles: function(){ return { page: pageBub.info(), fs: fsBub.info() }; },
    state: function(){ return { state: state, fsOpen: fsOpen, clock: clock }; },
    opacities: opacities
  };
})();
</script>
<style>
  /* Wall mode fit (added for the Living Photos wall): whole photo, with
     the photo's own blurred plates filling any surround. */
  #fs .lp-wallbg { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #fs .lp-wallbg img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; filter:blur(26px) brightness(.7) saturate(1.06);
    transform:scale(1.14); display:block; }
  #fs.lp-wallfit img:not(.acc):not(.crop):not(.lp-bgimg) { object-fit:contain !important; }
</style>
<script>
(function(){
  "use strict";
  // Wall mode: embedded in the Living Photos wall (#wall), open directly
  // on the full-screen living view, framed whole — the wall owns taps
  // and keys, so the usual tap/key exits are disarmed in this mode only.
  if (!/(^|[#&])wall([&#]|$)/.test(location.hash || '')) return;
  var fsEl = document.getElementById('fs');
  if (!fsEl || !window.LP) return;
  // Blurred-extension surround: blurred copies of this piece's own
  // photographic plates (the .jpg layers), crossfaded in step with them.
  var plates = [];
  fsEl.querySelectorAll('img').forEach(function(im){
    if (/\.jpe?g($|\?)/i.test(im.getAttribute('src') || '')) plates.push(im);
  });
  if (plates.length){
    var bg = document.createElement('div');
    bg.className = 'lp-wallbg';
    var clones = plates.map(function(im){
      var c = document.createElement('img');
      c.src = im.src; c.alt = ''; c.className = 'lp-bgimg';
      c.style.opacity = getComputedStyle(im).opacity;
      bg.appendChild(c);
      return [c, im];
    });
    fsEl.insertBefore(bg, fsEl.firstChild);
    (function mirror(){
      for (var i = 0; i < clones.length; i++){
        var o = clones[i][1].style.opacity;
        if (o !== '') clones[i][0].style.opacity = o;
      }
      requestAnimationFrame(mirror);
    })();
  }
  fsEl.classList.add('lp-wallfit');
  if (LP.ignite){ try { LP.ignite(); } catch(e){} }
  if (LP.openFs){ try { LP.openFs(); } catch(e){} }
  document.addEventListener('keydown', function(e){ e.stopImmediatePropagation(); }, true);
  fsEl.addEventListener('click', function(e){ e.stopImmediatePropagation(); }, true);
})();
</script>
</body>
</html>
