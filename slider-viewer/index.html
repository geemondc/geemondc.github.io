<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0b0b0d; overflow:hidden; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#e8e2d4;
         -webkit-font-smoothing:antialiased; }

  /* The piece's own golden plate, blurred, fills any surround — the same
     treatment the Big View's wall fit uses (whole photo, blurred extension). */
  #bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
        filter:blur(26px) brightness(.55) saturate(1.06); transform:scale(1.14);
        display:block; }

  /* The standalone Hour Slider page, clipped and framed so its .stage
     scene exactly fills (or is centered whole in) this viewport. The page
     itself is never modified; this wrapper measures the stage inside it
     (same origin) and maps that rectangle onto the screen — the page's
     title and its own controls are clipped away, never shown. */
  #clip { position:absolute; overflow:hidden; left:0; top:0; width:100%; height:100%;
          pointer-events:none; visibility:hidden; opacity:0;
          transition:opacity .45s ease; background:#000; }
  #clip.on { visibility:visible; opacity:1; }
  #inner { position:absolute; left:0; top:0; border:0; display:block;
           transform-origin:0 0; }

  /* Tap shield over the scene: the wall/store own taps on the photo.
     Only the viewer's own hour bar below is interactive. */
  #shield { position:absolute; display:none; }

  /* The hour bar — the piece's own slider, re-homed under the scene.
     The scene fit always reserves a band at the bottom for it, so the
     bar is present on every screen, landscape included. It drives the
     piece through its own HS hooks: same hour, same light. */
  #bar { position:absolute; left:0; right:0; bottom:0; display:none;
         padding:14px 22px calc(18px + env(safe-area-inset-bottom));
         background:linear-gradient(0deg, rgba(8,6,4,.88), rgba(8,6,4,0)); }
  #bar.on { display:block; }
  .readout { font-size:clamp(19px, 3.2vw, 26px); letter-spacing:.1em; color:#f2ead6;
             text-align:center; }
  .readout .phase { font-style:italic; font-size:.62em; color:#cfc5ab;
                    letter-spacing:.06em; margin-left:.5em; }
  .sliderRow { width:min(680px, 100%); margin:10px auto 0; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%;
                      height:34px; background:transparent; cursor:pointer; display:block; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px;
      background:linear-gradient(90deg,#7d94b8 0%,#c9a86a 55%,#e08a3c 72%,#4a5f9e 84%,#141c3a 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
      width:26px; height:26px; margin-top:-10px; border-radius:50%;
      background:#f2ead6; border:2px solid #8a7f63;
      box-shadow:0 2px 10px rgba(0,0,0,.6); }
  input[type=range]::-moz-range-track { height:6px; border-radius:3px;
      background:linear-gradient(90deg,#7d94b8 0%,#c9a86a 55%,#e08a3c 72%,#4a5f9e 84%,#141c3a 100%); }
  input[type=range]::-moz-range-thumb { width:22px; height:22px; border-radius:50%;
      background:#f2ead6; border:2px solid #8a7f63;
      box-shadow:0 2px 10px rgba(0,0,0,.6); }
  .ticks { display:flex; justify-content:space-between; margin-top:2px;
           font-size:12.5px; letter-spacing:.08em; color:#b6ae9c; }
</style>

<script id="lp-hdr-js">
(function(){
  "use strict";
  
  if (/(^|[#&])(wall|embed)/.test(location.hash || '')) document.documentElement.classList.add('lp-embed');
  var ES = {'ignite':'\u2726 Dale vida','btnStill':'Still','fsStill':'Still','lpStill':'Still','lpFsStill':'Still','btnLiving':'Living','fsLiving':'Living','lpLiving':'Living','lpFsLiving':'Living'};
  var ESVAL = {'Still':'Quieta','Living':'Viva','STILL':'QUIETA','LIVING':'VIVA','\u2726 Bring it to life':'\u2726 Dale vida'};
  var lang = 'en';
  function swap(id, toEs){
    var el = document.getElementById(id); if (!el) return;
    if (el.dataset.lpOrig === undefined) el.dataset.lpOrig = el.textContent;
    var orig = el.dataset.lpOrig;
    el.textContent = toEs ? (ESVAL[orig] || orig) : orig;
  }
  function setLang(l){
    lang = l;
    document.querySelectorAll('[data-lp-en]').forEach(function(el){ el.textContent = (l === 'es') ? el.dataset.lpEs : el.dataset.lpEn; });
    ['ignite','btnStill','btnLiving','fsStill','fsLiving','lpStill','lpLiving','lpFsStill','lpFsLiving'].forEach(function(id){ swap(id, l === 'es'); });
    document.getElementById('lpLang').textContent = (l === 'es') ? 'English' : 'Espa\u00f1ol';
  }
  document.getElementById('lpLang').addEventListener('click', function(){ setLang(lang === 'en' ? 'es' : 'en'); });
  var dk = document.getElementById('lpDark');
  dk.addEventListener('click', function(){
    var light = document.documentElement.classList.toggle('lp-light');
    dk.setAttribute('aria-pressed', light ? 'false' : 'true');
  });
  var qb = document.getElementById('lpQr'), panel = document.getElementById('lpQrPanel');
  qb.addEventListener('click', function(){
    var show = panel.hidden; panel.hidden = !show;
    qb.setAttribute('aria-pressed', show ? 'true' : 'false');
  });
  document.getElementById('lpQrClose').addEventListener('click', function(){ panel.hidden = true; qb.setAttribute('aria-pressed','false'); });
  document.addEventListener('fullscreenchange', function(){
    document.body.classList.toggle('lp-infs', !!document.fullscreenElement);
  });
})();
</script>

<script>
(function(){
  "use strict";
  var clip = document.getElementById('clip'),
      inner = document.getElementById('inner'),
      shield = document.getElementById('shield'),
      bar = document.getElementById('bar'),
      barInput = document.getElementById('hourBar'),
      clockEl = document.getElementById('clock'),
      phaseEl = document.getElementById('phaseName'),
      fitted = false, dragging = false, lastMinute = -1;

  function innerDoc(){ try { return inner.contentWindow && inner.contentWindow.document; } catch(e){ return null; } }
  function innerHS(){ try { return inner.contentWindow && inner.contentWindow.HS; } catch(e){ return null; } }

  /* Map the piece's .stage rectangle onto this viewport, whole and
     centered; the clip box is exactly that rectangle, so nothing else
     of the page (title, statement, its own controls) can ever show. */
  function fit(){
    var d = innerDoc(); if (!d) return false;
    var stage = d.querySelector('.stage'); if (!stage) return false;
    var vw = document.documentElement.clientWidth,
        vh = document.documentElement.clientHeight;
    var LW = Math.max(320, vw);
    inner.style.width = LW + 'px';
    inner.style.height = '1100px';
    var r = stage.getBoundingClientRect();
    if (!r.width) return false;
    /* Reserve a bottom band for the hour bar — the slider IS the piece,
       so the scene never gets the full height (fix, Nov 6, 2026: on a
       landscape monitor the old fit left ~0px under the scene and the
       bar's own room-test hid it forever — photo arrived with no slider). */
    var BAR_BAND = Math.min(190, Math.max(130, vh * 0.22));
    var availH = Math.max(200, vh - BAR_BAND);
    var s = Math.min(vw / r.width, availH / r.height);
    var sceneW = r.width * s, sceneH = r.height * s;
    var sceneX = (vw - sceneW) / 2, sceneY = Math.max(0, (availH - sceneH) / 2);
    clip.style.left = sceneX + 'px';
    clip.style.top = sceneY + 'px';
    clip.style.width = sceneW + 'px';
    clip.style.height = sceneH + 'px';
    inner.style.transform = 'translate(' + (-r.left * s) + 'px,' + (-r.top * s) + 'px) scale(' + s + ')';
    /* Shield exactly over the scene. */
    shield.style.display = 'block';
    shield.style.left = sceneX + 'px';
    shield.style.top = sceneY + 'px';
    shield.style.width = sceneW + 'px';
    shield.style.height = sceneH + 'px';
    /* The fit above now guarantees the band, so the bar always shows. */
    bar.classList.add('on');
    if (!fitted){ fitted = true; clip.classList.add('on'); }
    return true;
  }

  function mirrorReadout(){
    var d = innerDoc(); if (!d) return;
    var c = d.getElementById('clock'), ph = d.getElementById('phaseName');
    if (c) clockEl.textContent = c.textContent;
    if (ph) phaseEl.textContent = ph.textContent;
  }

  function syncFromPiece(){
    var hs = innerHS(); if (!hs || !hs.state) return;
    var st; try { st = hs.state(); } catch(e){ return; }
    if (typeof st.minutes === 'number' && st.minutes !== lastMinute){
      lastMinute = st.minutes;
      if (!dragging) barInput.value = st.minutes;
      mirrorReadout();
    }
  }

  barInput.addEventListener('input', function(){
    var hs = innerHS(); if (!hs || !hs.setHour) return;
    var v = parseInt(barInput.value, 10);
    try { hs.setHour(v); } catch(e){}
    lastMinute = v;
    mirrorReadout();
  });
  barInput.addEventListener('pointerdown', function(){ dragging = true; });
  window.addEventListener('pointerup', function(){ dragging = false; });

  inner.addEventListener('load', function(){
    var tries = 0;
    (function attempt(){
      if (fit() || ++tries > 40) return;
      setTimeout(attempt, 150);
    })();
    /* Layout settles as the piece's plates arrive; refit a few times. */
    [400, 1200, 2500, 4500].forEach(function(ms){ setTimeout(fit, ms); });
  });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 250); });
  setInterval(function(){ syncFromPiece(); }, 400);
})();
</script>
<div id="lpFsBar"><button id="lpFsStill" type="button">Still</button><button id="lpFsLiving" type="button" class="on">Living</button><button id="lpFsClose" type="button" class="x" aria-label="Close">&times;</button></div>
<script id="lp-sv-js">
(function(){
  "use strict";
  var img = document.getElementById('lpStillImg'), s = document.getElementById('lpStill'),
      l = document.getElementById('lpLiving'), f = document.getElementById('lpSvFs');
  function setStill(){ img.style.display = 'block'; s.classList.add('on'); l.classList.remove('on'); }
  function setLiving(){ img.style.display = 'none'; l.classList.add('on'); s.classList.remove('on'); }
  s.addEventListener('click', setStill);
  l.addEventListener('click', setLiving);
  f.addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  window.__lpSV = { setStill: setStill, setLiving: setLiving,
    isStill: function(){ return img.style.display === 'block'; } };
})();
</script>

<script id="lp-nativefs-js">
(function(){
  "use strict";

  function isLiving(){ return !(window.__lpSV && window.__lpSV.isStill()); }
  function setStill(){ if (window.__lpSV) window.__lpSV.setStill(); sync(); }
  function setLiving(){ if (window.__lpSV) window.__lpSV.setLiving(); sync(); }
  var b = document.getElementById('lpFsStill'), c = document.getElementById('lpFsLiving'), x = document.getElementById('lpFsClose');
  function sync(){ if (b && c){ var lv = isLiving(); b.classList.toggle('on', !lv); c.classList.toggle('on', lv); } }
  if (b) b.addEventListener('click', function(e){ e.stopPropagation(); setStill(); });
  if (c) c.addEventListener('click', function(e){ e.stopPropagation(); setLiving(); });
  if (x) x.addEventListener('click', function(e){ e.stopPropagation(); if (document.fullscreenElement) document.exitFullscreen(); });
  document.addEventListener('fullscreenchange', function(){ setTimeout(sync, 30); });
  sync();
})();
</script>
