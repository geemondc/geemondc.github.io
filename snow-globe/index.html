<title>The Snow Globe — Future Ready Living Photos</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#000;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia,'Times New Roman',serif;
    -webkit-user-select:none;
    user-select:none;
  }

  /* Blurred, darkened backdrop of the same photo */
  #backdrop{
    position:fixed;
    inset:0;
    background-image:url('globe.jpg');
    background-size:cover;
    background-position:center;
    filter:blur(40px) brightness(0.45);
    transform:scale(1.15);
    z-index:0;
  }

  /* Center stage — exactly the photo's box */
  #stage{
    position:relative;
    width:min(100vw, 177.78vh);
    aspect-ratio:16/9;
    height:auto;
    z-index:1;
    cursor:pointer;
    overflow:hidden;
    background:#000;
  }
  #stage img.painting{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    display:block;
  }

  .layer{
    position:absolute;
    pointer-events:none;
  }
  body.still .layer{display:none !important;}

  /* Title — quiet, small caps, fades with the controls */
  #titlebar{
    position:fixed;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    text-align:center;
    pointer-events:none;
    transition:opacity 0.8s ease;
    text-shadow:0 1px 10px rgba(0,0,0,0.85), 0 0 26px rgba(0,0,0,0.6);
  }
  #titlebar.faded{opacity:0;}
  #titlebar h1{
    font-size:15px;
    font-weight:normal;
    letter-spacing:0.42em;
    padding-left:0.42em;
    color:rgba(255,240,214,0.88);
  }
  #titlebar p{
    margin-top:5px;
    font-size:12px;
    font-style:italic;
    letter-spacing:0.18em;
    padding-left:0.18em;
    color:rgba(255,240,214,0.55);
  }

  /* The fireplace — an irregular flame flicker over the hearth zone,
     centered on the firebox flames measured in the pixels (~4%, 46%),
     plus a smaller, hotter core that dances faster (Gary, Nov 4:
     the room lights flicker too — salt, not sauce; calibration raised
     the same day: the flicker must READ across the room on a phone,
     beating the Lovable benchmark — wide, honest opacity swings over
     a strong gradient, not a dim shimmer). */
  #hearth{
    left:-7.5%;
    top:25%;
    width:27%;
    height:42%;
    mix-blend-mode:screen;
    background:radial-gradient(50% 50% at 50% 50%,
      rgba(255,150,56,0.78) 0%, rgba(255,110,40,0.34) 48%, transparent 72%);
    animation:hearthFlick 2.6s linear infinite;
    z-index:2;
  }
  @keyframes hearthFlick{
    0%{opacity:0.55;} 11%{opacity:0.90;} 19%{opacity:0.60;} 30%{opacity:1;}
    41%{opacity:0.66;} 52%{opacity:0.94;} 63%{opacity:0.52;} 74%{opacity:0.97;}
    85%{opacity:0.70;} 100%{opacity:0.58;}
  }
  #fireCore{
    left:3.5%;
    top:46%;
    width:13%;
    height:24%;
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
    background:radial-gradient(50% 50% at 50% 50%,
      rgba(255,190,92,0.85) 0%, rgba(255,134,48,0.40) 50%, transparent 74%);
    animation:fireCoreFlick 1.35s linear infinite;
    z-index:2;
  }
  @keyframes fireCoreFlick{
    0%{opacity:0.52;} 8%{opacity:0.95;} 16%{opacity:0.60;} 25%{opacity:1;}
    33%{opacity:0.68;} 44%{opacity:0.93;} 52%{opacity:0.55;} 61%{opacity:0.88;}
    70%{opacity:0.64;} 79%{opacity:0.97;} 88%{opacity:0.70;} 100%{opacity:0.56;}
  }

  /* Room dots — the mantel candles breathing above the fireplace, the
     snowflake candle holder glowing bottom-left, the lantern on the
     side table. Positions read off the photo; each on its own clock. */
  #roomDots{inset:0; z-index:3;}
  .roomDot{
    position:absolute;
    border-radius:50%;
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
    background:radial-gradient(circle, rgba(255,222,150,0.96) 0%, rgba(255,176,90,0.44) 48%, transparent 72%);
  }
  @keyframes candleBreathe{
    0%{opacity:0.30;}
    38%{opacity:0.92;}
    57%{opacity:0.55;}
    79%{opacity:1;}
    100%{opacity:0.36;}
  }
  @keyframes dotFlick{
    0%{opacity:0.28;} 12%{opacity:0.95;} 25%{opacity:0.42;} 42%{opacity:1;}
    58%{opacity:0.50;} 76%{opacity:0.92;} 100%{opacity:0.33;}
  }

  /* Christmas-tree bulbs — slow twinkles on the tree's brightest bulb
     spots, detected from the pixels; each bulb on its own clock */
  #bokeh{inset:0; z-index:3;}
  .bokehDot{
    position:absolute;
    border-radius:50%;
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
    animation:bokehPulse ease-in-out infinite;
  }
  @keyframes bokehPulse{
    0%,100%{opacity:0.08;}
    28%{opacity:1;}
    50%{opacity:0.32;}
    74%{opacity:0.88;}
  }

  /* Village twinkles — warm candle-rhythm dots on the lit windows */
  #twinkles{inset:0; z-index:4;}
  .twinkle{
    position:absolute;
    border-radius:50%;
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
    animation:twinkleFlick ease-in-out infinite;
  }
  @keyframes twinkleFlick{
    0%,100%{opacity:0.10;}
    28%{opacity:1;}
    52%{opacity:0.32;}
    74%{opacity:0.90;}
  }

  /* The snow — a canvas that only ever draws inside the glass */
  #snow{
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
  }

  /* Controls */
  #controls{
    position:fixed;
    pointer-events:auto;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 18px;
    background:rgba(8,8,12,0.62);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:999px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:opacity 0.8s ease;
    flex-wrap:wrap;
    justify-content:center;
    max-width:96vw;
  }
  #controls.faded{opacity:0; pointer-events:none;}
  #controls button{
    font-family:inherit;
    cursor:pointer;
    background:transparent;
    color:rgba(255,255,255,0.85);
  }
  #modeBtn,#fsBtn{
    font-size:11px;
    letter-spacing:0.14em;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18);
  }
  #modeBtn:hover,#fsBtn:hover{background:rgba(255,255,255,0.10);}
  #fsBtn{font-size:14px; padding:4px 10px;}
</style>

<script id="lp-hdr-js">
(function(){
  "use strict";
  document.body.classList.add('lp-bpad');
  if (/(^|[#&])(wall|embed)/.test(location.hash || '')) document.documentElement.classList.add('lp-embed');
  var ES = {'ignite':'\u2726 Dale vida','btnStill':'Still','fsStill':'Still','lpStill':'Still','lpFsStill':'Still','btnLiving':'Living','fsLiving':'Living','lpLiving':'Living','lpFsLiving':'Living'};
  var ESVAL = {'Still':'Quieta','Living':'Viva','STILL':'QUIETA','LIVING':'VIVA','\u2726 Bring it to life':'\u2726 Dale vida'};
  var lang = 'en';
  function swap(id, toEs){
    var el = document.getElementById(id); if (!el) return;
    if (el.dataset.lpOrig === undefined) el.dataset.lpOrig = el.textContent;
    var orig = el.dataset.lpOrig;
    el.textContent = toEs ? (ESVAL[orig] || orig) : orig;
  }
  function setLang(l){
    lang = l;
    document.querySelectorAll('[data-lp-en]').forEach(function(el){ el.textContent = (l === 'es') ? el.dataset.lpEs : el.dataset.lpEn; });
    ['ignite','btnStill','btnLiving','fsStill','fsLiving','lpStill','lpLiving','lpFsStill','lpFsLiving'].forEach(function(id){ swap(id, l === 'es'); });
    document.getElementById('lpLang').textContent = (l === 'es') ? 'English' : 'Espa\u00f1ol';
  }
  document.getElementById('lpLang').addEventListener('click', function(){ setLang(lang === 'en' ? 'es' : 'en'); });
  var dk = document.getElementById('lpDark');
  dk.addEventListener('click', function(){
    var light = document.documentElement.classList.toggle('lp-light');
    dk.setAttribute('aria-pressed', light ? 'false' : 'true');
  });
  var qb = document.getElementById('lpQr'), panel = document.getElementById('lpQrPanel');
  qb.addEventListener('click', function(){
    var show = panel.hidden; panel.hidden = !show;
    qb.setAttribute('aria-pressed', show ? 'true' : 'false');
  });
  document.getElementById('lpQrClose').addEventListener('click', function(){ panel.hidden = true; qb.setAttribute('aria-pressed','false'); });
  document.addEventListener('fullscreenchange', function(){
    document.body.classList.toggle('lp-infs', !!document.fullscreenElement);
  });
})();
</script>

<script>
(function(){
  'use strict';
  var body = document.body;
  var stage = document.getElementById('stage');
  var living = true;

  function rand(a, b){ return a + Math.random() * (b - a); }

  /* ---------- The globe's real geography, measured off the photo ----------
     Glass circle fitted from the actual pixels of globe.jpg (2560×1440):
     an edge-contrast grid search over the rim arc plus a least-squares
     (Kåsa) fit on radial gradient peaks — center (1503px, 592px), radius
     579px, RMS residual 4.4px. The sphere's bottom dips behind the wooden
     base, so the fit uses the top and side arcs only.
     The snow mask rides safely inside the rim: 0.94 × R. */
  var GX = 0.5871, GY = 0.4112, GR = 0.2261;   /* fractions of stage W / H / W */
  var MASK = 0.94;

  /* Village twinkles — [x%, y%] on the lit windows and the lamppost,
     read off the photo window by window. */
  var WINDOWS = [
    [65.5, 28.5],   /* steeple window */
    [65.5, 39.0],   /* church tall window */
    [65.3, 43.5],   /* church door light */
    [57.5, 46.5],   /* left cottage — dormer */
    [56.3, 52.5],   /* left cottage — ground left */
    [59.3, 52.8],   /* left cottage — ground right / door */
    [70.5, 46.3],   /* middle cottage — upper */
    [69.8, 50.0],   /* middle cottage — left */
    [74.2, 50.0],   /* middle cottage — right one */
    [76.8, 50.0],   /* middle cottage — right two */
    [82.3, 51.0],   /* right cottage — dormer */
    [80.8, 55.8],   /* right cottage — ground left */
    [83.8, 56.3],   /* right cottage — ground middle */
    [86.8, 56.0]    /* right cottage — ground right */
  ];
  var LAMPPOST = [65.3, 48.8];
  (function buildTwinkles(){
    var box = document.getElementById('twinkles');
    function addDot(x, y, s){
      var d = document.createElement('div');
      d.className = 'twinkle';
      d.style.width = s + 'px';
      d.style.height = s + 'px';
      d.style.left = x + '%';
      d.style.top = y + '%';
      d.style.background = 'radial-gradient(circle, rgba(255,226,158,0.97) 0%, rgba(255,182,96,0.46) 45%, transparent 72%)';
      d.style.animationDuration = rand(1.3, 3.1).toFixed(2) + 's';
      d.style.animationDelay = (-rand(0, 4)).toFixed(2) + 's';
      box.appendChild(d);
    }
    for (var i = 0; i < WINDOWS.length; i++)
      addDot(WINDOWS[i][0], WINDOWS[i][1], rand(9, 13).toFixed(1));
    addDot(LAMPPOST[0], LAMPPOST[1], 15);   /* the lantern burns a touch bigger */
  })();

  /* Tree bulbs — [x%, y%, size px, warm gold or red]: the tree's
     brightest bulb spots, found by scanning globe.jpg for local
     luminance peaks in the tree zone (x 81.5–100%); a dozen-plus,
     each twinkling on its own slow clock. */
  var BOKEH = [
    [93.2,  2.4, 20, 'gold'], [86.3, 30.6, 20, 'gold'], [81.6, 18.8, 19, 'gold'],
    [87.6, 11.6, 19, 'gold'], [96.7, 18.7, 19, 'gold'], [86.0, 22.0, 18, 'gold'],
    [92.6,  9.0, 18, 'gold'], [98.9, 27.9, 19, 'gold'], [99.5,  2.4, 18, 'gold'],
    [86.8, 36.2, 18, 'gold'], [91.2, 29.9, 17, 'gold'],
    [83.2, 24.9, 18, 'red' ], [91.2, 14.9, 17, 'red' ]
  ];
  (function buildBokeh(){
    var box = document.getElementById('bokeh');
    for (var i = 0; i < BOKEH.length; i++){
      var b = BOKEH[i], d = document.createElement('div');
      d.className = 'bokehDot';
      d.style.width = b[2] + 'px';
      d.style.height = b[2] + 'px';
      d.style.left = b[0] + '%';
      d.style.top = b[1] + '%';
      d.style.background = b[3] === 'red'
        ? 'radial-gradient(circle, rgba(255,132,96,0.92) 0%, rgba(235,78,56,0.42) 50%, transparent 72%)'
        : 'radial-gradient(circle, rgba(255,222,150,0.92) 0%, rgba(255,180,95,0.42) 50%, transparent 72%)';
      d.style.animationDuration = rand(2.4, 4.8).toFixed(2) + 's';
      d.style.animationDelay = (-rand(0, 7)).toFixed(2) + 's';
      box.appendChild(d);
    }
  })();

  /* Room dots — [x%, y%, size px, rhythm]: the lights OUTSIDE the glass.
     'candle' = the mantel flames above the fireplace (peak-scanned at
     (17.5%, 1.1%) and (22.8%, 4.2%)) and the garland orbs beside them —
     a slow warm breathing. 'flick' = the snowflake candle holder
     bottom-left (2.4%, 66.5%) and the side-table lantern (26.8%, 57%) —
     a gentle irregular flame flicker. */
  var ROOMDOTS = [
    [17.2,  1.6, 20, 'candle'],   /* mantel candle — left flame */
    [22.8,  4.2, 18, 'candle'],   /* mantel candle — right flame */
    [13.6, 10.8, 16, 'candle'],   /* garland orb above the mantel */
    [31.4, 17.4, 16, 'candle'],   /* garland orb by the stocking */
    [ 2.4, 66.5, 26, 'flick' ],   /* snowflake candle holder, bottom-left */
    [26.8, 57.0, 24, 'flick' ]    /* lantern on the side table */
  ];
  (function buildRoomDots(){
    var box = document.getElementById('roomDots');
    for (var i = 0; i < ROOMDOTS.length; i++){
      var b = ROOMDOTS[i], d = document.createElement('div');
      d.className = 'roomDot';
      d.style.width = b[2] + 'px';
      d.style.height = b[2] + 'px';
      d.style.left = b[0] + '%';
      d.style.top = b[1] + '%';
      if (b[3] === 'candle'){
        d.style.animation = 'candleBreathe ' + rand(3.4, 5.6).toFixed(2) + 's ease-in-out ' + (-rand(0, 6)).toFixed(2) + 's infinite alternate';
      } else {
        d.style.animation = 'dotFlick ' + rand(1.7, 2.9).toFixed(2) + 's linear ' + (-rand(0, 3)).toFixed(2) + 's infinite';
      }
      box.appendChild(d);
    }
  })();

  /* ---------- The snow — a storm sealed inside the glass ----------
     Flakes live in a pseudo-depth field: z 0 (far) to 1 (near) sets size,
     brightness and fall speed. IDLE keeps ~70 flakes in a lazy drift
     forever. A shake pours energy into the system (E = 1): the pool
     surges to ~460, every flake gets an upward + outward kick and the
     vortex takes hold; drag and a decaying swirl bleed the energy off
     with a ~9.5s time constant, so the storm eases back to idle over
     roughly 25–30 seconds. Flakes that reach their own settle line in
     the village's snow ground fade out and respawn at the top. */
  var canvas = document.getElementById('snow');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, rafId = null, lastT = 0;
  var IDLE = 70, MAXP = 460;
  var flakes = [], energy = 0, SWIRL = 1;   /* vortex direction */

  var cx = 0, cy = 0, R = 0, RM = 0, sizeK = 1;
  function sizeCanvas(){
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = GX * W; cy = GY * H; R = GR * W; RM = R * MASK;
    sizeK = Math.min(1.75, Math.max(0.75, W / 1500));
  }

  function newFlake(){
    return {
      x: 0, y: 0, z: Math.random(),
      vx: 0, vy: 0,
      phase: rand(0, Math.PI * 2),
      swayF: rand(0.4, 1.1), swayA: rand(1.5, 4),
      settleV: rand(0.42, 0.60),   /* personal ground line, in (y-cy)/R */
      active: false
    };
  }
  function spawnInDisc(f){
    var a = rand(0, Math.PI * 2), rr = RM * Math.sqrt(Math.random()) * 0.98;
    f.x = cx + Math.cos(a) * rr;
    f.y = cy + Math.sin(a) * rr;
    f.vx = 0; f.vy = 0;
  }
  function spawnAtTop(f){
    /* re-enter through the upper dome of the sphere */
    var a = rand(Math.PI * 1.12, Math.PI * 1.88), rr = RM * Math.sqrt(Math.random()) * 0.94;
    f.x = cx + Math.cos(a) * rr;
    f.y = cy + Math.sin(a) * rr;
    f.vx = 0; f.vy = rand(0, 4);
  }
  function seedFlakes(){
    flakes = [];
    for (var i = 0; i < MAXP; i++){
      var f = newFlake();
      if (i < IDLE){
        f.active = true;
        spawnInDisc(f);
        if ((f.y - cy) / R > f.settleV) f.y = cy - rand(0, RM * 0.6);
      }
      flakes.push(f);
    }
  }
  function activeCount(){
    var n = 0;
    for (var i = 0; i < flakes.length; i++) if (flakes[i].active) n++;
    return n;
  }

  function shake(){
    if (!living) return;
    energy = 1;
    for (var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      if (!f.active){ f.active = true; spawnInDisc(f); }
      var dx = f.x - cx, dy = f.y - cy;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var ux = dx / d, uy = dy / d;
      var near = 0.6 + 0.4 * f.z;
      f.vy -= rand(90, 300) * near;                    /* the eruption lifts */
      f.vx += ux * rand(30, 150);                      /* and bursts outward */
      f.vy += uy * rand(30, 150);
      f.vx += -uy * rand(60, 190) * SWIRL;             /* and the vortex grabs */
      f.vy += ux * rand(60, 190) * SWIRL;
    }
  }

  function drawSnow(t){
    if (!living){ rafId = null; return; }
    rafId = requestAnimationFrame(drawSnow);
    var dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    var ts = t / 1000;

    energy *= Math.exp(-dt / 9.5);                     /* the long settle */
    var target = Math.round(IDLE + (MAXP - IDLE) * energy);
    var n = activeCount();
    if (n < target){
      for (var i = 0, need = target - n; i < flakes.length && need > 0; i++)
        if (!flakes[i].active){ flakes[i].active = true; spawnAtTop(flakes[i]); need--; }
    }

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, RM, 0, Math.PI * 2);
    ctx.clip();

    var dragK = Math.exp(-dt * 0.8);
    for (var j = 0; j < flakes.length; j++){
      var f = flakes[j];
      if (!f.active) continue;

      var dx = f.x - cx, dy = f.y - cy;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;

      /* the vortex — tangential, fed by the storm's energy */
      if (energy > 0.01){
        var aT = energy * 150 * (0.5 + 0.5 * f.z);
        f.vx += (-dy / d) * aT * SWIRL * dt;
        f.vy += ( dx / d) * aT * SWIRL * dt;
      }
      /* gravity, gentle; drag bleeds every velocity toward the drift */
      f.vy += 20 * (0.35 + 0.65 * f.z) * dt;
      f.vx *= dragK; f.vy *= dragK;
      f.x += f.vx * dt;
      f.y += f.vy * dt;

      /* stay inside the glass */
      var ndx = f.x - cx, ndy = f.y - cy;
      var nd = Math.sqrt(ndx * ndx + ndy * ndy);
      if (nd > RM){
        f.x = cx + ndx / nd * RM;
        f.y = cy + ndy / nd * RM;
        var vr = (f.vx * ndx + f.vy * ndy) / nd;
        if (vr > 0){ f.vx -= vr * ndx / nd; f.vy -= vr * ndy / nd; }
      }

      /* settled into the village snow — recycle, or rest if the storm has passed */
      if ((f.y - cy) / R > f.settleV){
        if (activeCount() > target){ f.active = false; continue; }
        spawnAtTop(f);
      }

      /* fade softly toward the glass — fully transparent by 0.98 × RM,
         so no flake can ever visually touch the rim */
      var edge = 1 - Math.min(1, Math.max(0, (nd / RM - 0.80) / 0.18));
      if (edge <= 0) continue;
      var a = (0.35 + 0.60 * f.z) * edge;
      var r = (1 + 2.5 * f.z) * sizeK;
      var sx = f.x + Math.sin(ts * f.swayF + f.phase) * f.swayA * (0.4 + 0.6 * (1 - energy));

      ctx.fillStyle = 'rgba(255,248,238,' + (a * 0.25).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(sx, f.y, r * 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,251,244,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(sx, f.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  function startSnow(){
    if (rafId === null && living){
      lastT = performance.now();
      rafId = requestAnimationFrame(drawSnow);
    }
  }
  function stopSnow(){
    if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    ctx.clearRect(0, 0, W, H);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stopSnow();
    else if (living) startSnow();
  });

  /* ---------- Tap law ----------
     On the globe: SHAKE, and only shake. Anywhere else on the stage:
     fullscreen. True in fullscreen too. In STILL the globe is inert. */
  function toggleFS(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  stage.addEventListener('click', function(e){
    var cr = document.getElementById('controls').getBoundingClientRect();
    if (e.clientX >= cr.left && e.clientX <= cr.right && e.clientY >= cr.top && e.clientY <= cr.bottom) return; /* tap aimed at the pills (even faded ones): wake only — never fullscreen */
    var r = stage.getBoundingClientRect();
    var px = e.clientX - r.left, py = e.clientY - r.top;
    var ddx = px - GX * r.width, ddy = py - GY * r.height;
    if (Math.sqrt(ddx * ddx + ddy * ddy) <= GR * r.width){
      shake();              /* no-ops in STILL — the globe does nothing */
    } else {
      toggleFS();
    }
  });
  document.getElementById('fsBtn').addEventListener('click', toggleFS);

  /* ---------- Mode toggle ---------- */
  var modeBtn = document.getElementById('modeBtn');
  modeBtn.addEventListener('click', function(){
    living = !living;
    body.classList.toggle('still', !living);
    modeBtn.textContent = living ? 'STILL' : 'LIVING';
    if (living) startSnow();
    else stopSnow();
  });

  /* ---------- Controls + title auto-fade ---------- */
  var controls = document.getElementById('controls');
  var titlebar = document.getElementById('titlebar');
  var idleTimer = null;
  function wake(){
    controls.classList.remove('faded');
    titlebar.classList.remove('faded');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      controls.classList.add('faded');
      titlebar.classList.add('faded');
    }, 3500);
  }
  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake, {passive:true});
  wake();

  /* ---------- Init ---------- */
  function init(){
    sizeCanvas();
    seedFlakes();
    startSnow();
  }
  window.addEventListener('resize', function(){ sizeCanvas(); seedFlakes(); });
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<script>
/* Wall mode: embedded in the Living Photos wall via #wall, this page's own title/controls stay hidden — the scene and its interactions stay live. */
if (location.hash === '#wall') {
  var lpWallStyle = document.createElement('style');
  lpWallStyle.textContent = '#controls,#titlebar{display:none !important}';
  document.head.appendChild(lpWallStyle);
}
</script>
<div id="lpFsBar"><button id="lpFsStill" type="button">Still</button><button id="lpFsLiving" type="button" class="on">Living</button><button id="lpFsClose" type="button" class="x" aria-label="Close">&times;</button></div>
<script id="lp-nativefs-js">
(function(){
  "use strict";

  var mb = document.getElementById('modeBtn');
  function isLiving(){ return mb && mb.textContent.trim() === 'STILL'; }
  function setStill(){ if (isLiving()) mb.click(); sync(); }
  function setLiving(){ if (!isLiving()) mb.click(); sync(); }
  var b = document.getElementById('lpFsStill'), c = document.getElementById('lpFsLiving'), x = document.getElementById('lpFsClose');
  function sync(){ if (b && c){ var lv = isLiving(); b.classList.toggle('on', !lv); c.classList.toggle('on', lv); } }
  if (b) b.addEventListener('click', function(e){ e.stopPropagation(); setStill(); });
  if (c) c.addEventListener('click', function(e){ e.stopPropagation(); setLiving(); });
  if (x) x.addEventListener('click', function(e){ e.stopPropagation(); if (document.fullscreenElement) document.exitFullscreen(); });
  document.addEventListener('fullscreenchange', function(){ setTimeout(sync, 30); });
  sync();
})();
</script>

<script id="lp-pair-js">
(function(){
  "use strict";
  var s = document.getElementById('lpStill'), l = document.getElementById('lpLiving');
  var fs = document.getElementById('lpFsStill'), fl = document.getElementById('lpFsLiving');
  if (s && fs) s.addEventListener('click', function(){ fs.click(); s.classList.add('on'); l.classList.remove('on'); });
  if (l && fl) l.addEventListener('click', function(){ fl.click(); l.classList.add('on'); s.classList.remove('on'); });
})();
</script>
