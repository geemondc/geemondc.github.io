<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Café — a Living Atmosphere</title>
<meta name="description" content="Space Café — a quiet café in the blue dark above the Earth. A living atmosphere for a room.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#060B18; height:100%; }
  body { overflow:hidden; font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  .stage { position:fixed; inset:0; background:#060B18; }
  .frame { position:absolute; overflow:hidden; background:#060B18; }
  .frame img.base { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .frame canvas.fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .glint { position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,244,214,.95) 0%, rgba(255,214,140,.35) 42%, rgba(255,214,140,0) 70%);
    mix-blend-mode:screen; opacity:0; }
  .vig { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 108% 96% at 50% 46%, transparent 66%, rgba(2,6,16,.32) 100%); }
  .top { position:fixed; top:0; left:0; right:0; padding:20px 22px 30px; pointer-events:none;
    background:linear-gradient(rgba(2,6,16,.5), transparent); color:#EAF2FF;
    opacity:1; transition:opacity 1.2s; }
  .top h1 { font-size:26px; font-weight:700; letter-spacing:.4px; }
  .top p { font-size:15.5px; color:#BFD2EE; margin-top:3px; max-width:560px; line-height:1.45; }
  .bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; justify-content:center; align-items:center;
    padding:16px 12px 20px; background:linear-gradient(transparent, rgba(2,6,16,.55));
    opacity:1; transition:opacity 1.2s; }
  .bbtn { font-size:17px; font-weight:700; padding:11px 20px; border-radius:999px; cursor:pointer;
    border:1.5px solid rgba(190,215,255,.55); background:rgba(8,16,34,.55); color:#EAF2FF; font-family:inherit;
    backdrop-filter:blur(4px); }
  .bbtn:hover { background:rgba(20,36,66,.65); }
  body.idle .top, body.idle .bar { opacity:0; }
  .hint { position:fixed; right:16px; bottom:74px; color:#9DB9DE; font-size:13.5px; opacity:.85; pointer-events:none;
    transition:opacity 1.2s; }
  body.idle .hint { opacity:0; }

  body.expanded .top, body.expanded .bar { display:none; }
  body.expanded .frame { left:0 !important; top:0 !important; width:100vw !important; height:100vh !important; }
  body.expanded .frame img.base, body.expanded .frame canvas.pool, body.expanded .frame canvas.fx { object-fit:cover; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame" id="frame">
    <img class="base" src="still2.jpg" alt="Space Café — a quiet lounge in the blue dark above the Earth">
    <canvas class="fx" id="fx" width="1432" height="747"></canvas>
    <div class="vig"></div>
  </div>
</div>
<div class="top"><h1>Space Café</h1><p>a quiet café in the blue dark above the Earth</p></div>
<div class="bar">
  <button class="bbtn" id="btnMusic" onclick="toggleMusic()">🎵 Play the music</button>
  <button class="bbtn" onclick="toggleFull()">⛶ Full screen</button>
</div>
<audio id="cafe" src="music1.mp3" loop preload="auto"></audio>
<script>
(function(){
  var stage = document.getElementById('stage'), frame = document.getElementById('frame');
  var IW = 1432, IH = 747;
  function seat(){
    // MAXIMIZE (Gary): the picture fills the screen — cover-fit, whole
    // photo still reachable in the Museum Frame view via the frame chip.
    var w = stage.clientWidth, h = stage.clientHeight, rw, rh;
    if (w / h > IW / IH) { rw = w; rh = w * IH / IW; } else { rh = h; rw = h * IW / IH; }
    frame.style.left = ((w - rw) / 2) + 'px'; frame.style.top = ((h - rh) / 2) + 'px';
    frame.style.width = rw + 'px'; frame.style.height = rh + 'px';
  }
  window.addEventListener('resize', seat); seat();

var CITY=[[60.5,60.9],[59.7,47.3],[76.7,48.3],[70.8,69.9],[62.9,49.5],[70.6,64.0],[85.3,49.3],[90.3,61.2],[74.7,63.6],[97.0,50.7],[84.4,63.2],[70.4,62.5],[87.1,45.1],[74.9,68.8],[92.4,62.9],[90.5,62.7],[69.2,62.8],[60.7,59.3],[82.5,57.0],[68.2,62.0],[63.3,47.8],[59.5,61.2],[68.0,48.7],[96.2,52.1],[91.5,54.2],[91.1,49.5],[93.6,38.4],[84.0,51.1],[65.9,51.7],[61.7,45.8],[76.6,58.4],[72.1,48.7],[60.8,47.8],[73.2,64.3],[52.5,55.7],[85.3,59.4],[83.3,57.0],[61.5,58.0],[56.3,53.3],[60.5,45.6],[61.2,46.6],[82.9,53.7],[75.5,62.0],[90.0,64.3],[79.4,39.4],[72.6,62.9],[78.6,62.7],[62.4,47.5],[62.8,63.6],[97.4,49.3],[86.1,59.8],[46.6,53.7],[77.4,57.7],[59.8,59.4],[77.4,53.7],[83.9,38.8],[87.6,43.2],[41.1,57.8],[64.7,57.8],[63.5,45.4],[81.6,43.1],[60.9,56.6],[64.2,46.2],[52.3,53.3],[96.2,31.5],[69.2,48.5],[75.9,63.7],[91.8,62.1],[64.1,49.9],[64.1,47.7],[55.7,61.3],[80.6,59.7],[40.1,58.5],[90.2,57.8],[87.8,51.1],[80.9,48.6],[87.7,36.5],[78.0,48.1],[85.5,37.9],[82.4,52.6],[95.8,36.3],[44.3,56.1],[48.8,71.8],[84.4,59.6],[88.8,62.1],[84.4,49.0],[91.1,60.9],[73.0,49.4],[66.8,60.5],[86.0,49.5],[64.2,44.8],[75.1,47.0],[83.2,64.4],[67.7,54.6],[76.0,66.1],[81.4,63.5],[94.9,36.1],[45.5,70.3],[69.9,63.9],[54.2,66.8],[58.9,52.1],[64.8,51.1],[92.7,64.5],[62.7,44.8],[56.5,65.3],[82.9,58.4],[63.3,42.6],[92.0,64.3],[84.6,38.3],[71.1,63.1],[39.4,53.0],[67.6,62.7],[53.8,54.6],[71.6,47.3],[58.7,55.0],[83.9,62.4],[96.2,38.7],[70.0,60.1],[52.1,47.7],[78.5,58.2],[76.7,49.9],[62.3,57.4],[86.9,43.2],[95.2,50.7],[49.0,56.8],[94.2,65.1],[50.6,51.3],[94.1,43.6],[67.7,52.5],[67.3,48.7],[39.9,60.2],[76.5,65.1],[61.5,47.8],[56.8,52.3],[98.3,41.5],[85.1,54.4],[38.7,56.2],[51.5,64.4],[51.2,69.5],[89.6,62.7],[48.4,59.4],[76.2,62.4],[53.7,51.7],[87.8,62.4],[56.2,63.5],[61.2,60.4],[41.3,55.4],[43.9,50.9],[74.4,64.8],[69.8,62.0],[68.0,46.1],[66.2,47.7],[76.0,51.3],[57.2,71.6]];
var GLINTS=[[29.7,68.5,5],[47.9,80.7,7],[96.3,79.5,9],[94.6,76.6,5],[51.7,80.7,7],[8.2,48.7,9],[71.1,70.4,5],[3.9,82.2,7],[5.2,88.0,9],[70.6,63.9,5],[2.0,69.1,7],[9.1,71.5,9],[51.9,86.5,5],[92.5,77.5,7]];
  // ---- The planet below: city lights ride a slow drift and flicker --------
  // The still's own warm city dots, enhanced — each breathes on its own
  // clock; the whole field slides very slowly sideways (the turn), wrapping.
  var cv = document.getElementById('fx'), cx = cv.getContext('2d');
  var GLOBE = { cx: 0.688, cy: 0.695, r: 0.335 };   // globe circle in the glass, image fractions
  var gc = document.createElement('canvas'); gc.width = 2048; gc.height = 1024;
  var gx = gc.getContext('2d');
  var ready = false;
  (function buildGlobe(){
    var im = new Image();
    im.onload = function(){
      var W2 = 2048, H2 = 1024, sx = 1432, sy = 747;
      var cxI = GLOBE.cx * sx, cyI = GLOBE.cy * sy, rI = GLOBE.r * sy;
      gx.drawImage(im, 0, 0);
      // Night side = Gary's own lit continent, pre-rotated so the face
      // the café sees carries its cities; terminator glow at the seam.
      var tmp = document.createElement('canvas'); tmp.width = 2048; tmp.height = 1024;
      var tx = tmp.getContext('2d');
      tx.drawImage(gc, 0, 0);
      gx.clearRect(0, 0, 2048, 1024);
      gx.drawImage(tmp, 1024, 0, 1024, 1024, 0, 0, 1024, 1024);
      gx.drawImage(tmp, 0, 0, 1024, 1024, 1024, 0, 1024, 1024);
      ready = true;
    };
    im.src = 'still2.jpg';
  })();
  function drawFx(t){
    cx.clearRect(0, 0, IW, IH);
    if (!ready) return;
    var cxp = GLOBE.cx * IW, cyp = GLOBE.cy * IH, rp = GLOBE.r * IH;
    cx.save();
    cx.beginPath(); cx.arc(cxp, cyp, rp * 1.35, 0, Math.PI * 2); cx.clip();
    // draw the turning sphere: sample the wrap texture through a
    // spherical projection — the disc region of the glass only
    var steps = 46, lon0 = (t * 2.2) % 360;   // ~2.2 deg/s: the turn you can SEE
    var img = gx.canvas;
    for (var i2 = 0; i2 < steps; i2++){
      var th0 = -Math.PI / 2 + (i2 / steps) * Math.PI;
      var th1 = -Math.PI / 2 + ((i2 + 1) / steps) * Math.PI;
      var xA = cxp + Math.sin(th0) * rp * 1.35, xB = cxp + Math.sin(th1) * rp * 1.35;
      var u = ((lon0 + (th0 + Math.PI / 2) * 180 / Math.PI * 0.5) % 360) / 360;
      var sw = 2048 / 360 * ((th1 - th0) * 180 / Math.PI * 0.5);
      var shade = 0.35 + 0.65 * Math.pow(Math.cos(th0), 1.4);   // night falls to the left limb
      cx.globalAlpha = 1;
      cx.drawImage(img, u * 2048, 0, Math.max(1, sw), 1024, xA, cyp - rp * 1.35, Math.max(1, xB - xA + 1), rp * 2.7);
      if (shade < 0.999){ cx.fillStyle = 'rgba(2,6,20,' + (1 - shade).toFixed(3) + ')'; cx.fillRect(xA, cyp - rp * 1.35, xB - xA + 1, rp * 2.7); }
    }
    // terminator glow + the flickering cities ride the turning face
    for (var i = 0; i < CITY.length; i++){
      var d = CITY[i];
      var fx3 = d[0] / 100, fy3 = d[1] / 100;
      var dx = (fx3 - GLOBE.cx) * IW, dy = (fy3 - GLOBE.cy) * IH;
      if (dx * dx + dy * dy > rp * rp * 1.82) continue;    // outside the globe: skip
      var shim = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / (1.6 + (i * 37 % 13) * 0.31) + i * 1.93);
      shim = shim * shim * (3 - 2 * shim);
      var a = 0.2 + 0.6 * shim;
      var g2 = cx.createRadialGradient(d[0] / 100 * IW, d[1] / 100 * IH, 0, d[0] / 100 * IW, d[1] / 100 * IH, 4.6);
      g2.addColorStop(0, 'rgba(255,220,160,' + a.toFixed(3) + ')');
      g2.addColorStop(1, 'rgba(255,220,160,0)');
      cx.fillStyle = g2;
      cx.beginPath(); cx.arc(d[0] / 100 * IW, d[1] / 100 * IH, 4.6, 0, Math.PI * 2); cx.fill();
    }
    cx.restore();
  }
  // ---- Candles & lanterns inside: each flickering on its own clock -------
  var glints = GLINTS.map(function(s, i){
    var d = document.createElement('div');
    d.className = 'glint';
    d.style.left = s[0] + '%'; d.style.top = s[1] + '%';
    d.style.width = (s[2] * 2.2) + 'px'; d.style.height = (s[2] * 2.2) + 'px';
    d.style.transform = 'translate(-50%,-50%)';
    frame.appendChild(d);
    return { el: d, per: 2.2 + ((i * 37) % 10) * 0.47, ph: ((i * 53) % 17) / 17 * Math.PI * 2, amp: .55 + ((i * 29) % 10) / 22 };
  });
  var t0 = performance.now();
  function tick(now){
    var t = (now - t0) / 1000;
    for (var i = 0; i < glints.length; i++){
      var g = glints[i];
      var v = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / g.per + g.ph);
      v = v * v * (3 - 2 * v);
      g.el.style.opacity = (v * g.amp).toFixed(3);
    }
    drawFx(t);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var audio = document.getElementById('cafe');
  var btnM = document.getElementById('btnMusic');
  window.toggleMusic = function(){
    if (audio.paused) { audio.play(); btnM.textContent = '🔇 Quiet'; }
    else { audio.pause(); btnM.textContent = '🎵 Play the music'; }
  };
  var expanded = false;
  window.toggleFull = function(){
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function(){ expandFallback(); });
    } else { expandFallback(); }
  };
  function expandFallback(){
    expanded = !expanded;
    document.body.classList.toggle('expanded', expanded);
    seat();
  }
  var idleTimer = null;
  function wake(){
    document.body.classList.remove('idle');
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 5000);
  }
  ['mousemove','touchstart','keydown','click'].forEach(function(ev){ window.addEventListener(ev, wake, {passive:true}); });
  wake();
  window.LP = { state: function(){ return { city: CITY.length, glints: glints.length, musicPaused: audio.paused }; } };
})();
</script>
</body>
</html>
