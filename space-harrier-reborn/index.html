<script>
'use strict';
/* ============================================================
   SPACE HARRIER REBORN — a Super Scaler tribute.
   Pseudo-3D sprite scaling on a 2D canvas: pre-rendered sprite
   variants at discrete sizes (capped), painted far-to-near.
   ============================================================ */

// ---------- tiny utils ----------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function irand(a, b) { return Math.floor(rand(a, b + 1)); }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(n) { var s = String(Math.floor(n)); while (s.length < 6) s = '0' + s; return s; }

// ---------- canvas ----------
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1, horizonY = 0, CX = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizonY = Math.round(H * 0.375);
  CX = W / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 60); });
resize();

// ---------- projection (Super Scaler style) ----------
// z = distance ahead in world units. Player plane sits at PZ.
var PZ = 12, ZB = 9;
function groundY(z) { return horizonY + (H * 10.9) / (z + ZB); }        // screen y of the ground at distance z
function pxU(z) { return (H * 3.36) / (z + ZB); }                        // pixels per world unit at distance z
var LAT = 1.15;                                                          // lateral stretch
function camX() { return player.x * 0.5; }                               // world drifts opposite the hero
function scrX(x, z) { return CX + (x - camX()) * pxU(z) * LAT; }
function scrY(y, z) { return groundY(z) - y * pxU(z); }                  // screen y of a point y units above ground

// ---------- audio (WebAudio SFX only — no music track) ----------
var AC = null, muted = false, noiseBuf = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    var len = AC.sampleRate * 0.5, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = buf;

window.addEventListener('keydown', function (e) {

});

}

  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawTitle() {
  ctx.fillStyle = 'rgba(4,6,24,0.62)'; ctx.fillRect(0, 0, W, H);
  var t1 = clamp(W * 0.075, 30, 64);
  text('SPACE HARRIER', CX, H * 0.13, t1, '#ffd94d', 'center');
  text('REBORN', CX, H * 0.13 + t1 + 10, t1 * 0.62, '#52c8ff', 'center');
  text('WELCOME TO THE FANTASY ZONE!', CX, H * 0.35, clamp(W * 0.02, 12, 19), '#ffffff', 'center');
  if (Math.floor(timeSec * 1.6) % 2 === 0) text('— CLICK, TAP OR PRESS ANY KEY TO START —', CX, H * 0.415, clamp(W * 0.017, 10, 15), '#52ff7a', 'center');
  // ---- HOW TO PLAY + CONTROLS panel ----
  var rows = [
    { t: 'HOW TO PLAY', col: '#ffd94d', head: true },
    { t: 'BLAST EVERYTHING IN YOUR PATH', col: '#ffffff' },
    { t: 'DODGE TREES & STATUES — SMALL ROCKS ONLY TRIP YOU', col: '#ffffff' },
    { t: 'SLAY THE BOSS TO CLEAR THE STAGE', col: '#ffffff' },
    { t: 'EVERY 3RD STAGE: RIDE THE DRAGON — SMASH FOR BONUS!', col: '#ffffff' },
    { t: 'CONTROLS', col: '#52c8ff', head: true },
    { t: 'KEYBOARD   ARROWS / WASD — MOVE · SPACE — FIRE', col: '#cfe8ff' },
    { t: 'MOUSE      MOVE TO STEER · HOLD CLICK — FIRE', col: '#cfe8ff' },
    { t: 'TOUCH      DRAG TO MOVE · CANNON FIRES AS YOU DRAG', col: '#cfe8ff' }
  ];
  var pw = Math.min(W * 0.94, 620);
  var fs = clamp(Math.round(pw * 0.021), 9, 13);
  var lh = fs + 9;
  var ph = rows.length * lh + 22;
  var py = H * 0.50;
  if (py + ph > H - 10) py = Math.max(10, H - 10 - ph);
  ctx.fillStyle = 'rgba(3,5,20,0.74)';
  roundRectPath(CX - pw / 2, py, pw, ph, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(140,220,255,0.45)'; ctx.lineWidth = 1.5;
  roundRectPath(CX - pw / 2, py, pw, ph, 10); ctx.stroke();
  var y = py + 12;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].head && i > 0) y += 7;
    text(rows[i].t, CX, y, rows[i].head ? fs + 2 : fs, rows[i].col, 'center');
    y += lh;
  }
  if (hiScore > 0 && py + ph + 26 < H) text('HI-SCORE  ' + fmt(hiScore), CX, py + ph + 10, fs, '#aef4ff', 'center');
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(4,2,10,0.55)'; ctx.fillRect(0, 0, W, H);
  var t1 = clamp(W * 0.055, 26, 48);
  text('GAME OVER', CX, H * 0.28, t1, '#ff5252', 'center');
  text('SCORE  ' + fmt(score), CX, H * 0.44, clamp(W * 0.022, 13, 20), '#ffd94d', 'center');
  text('YOU REACHED STAGE ' + stage + ' — ' + world().name, CX, H * 0.44 + 34, clamp(W * 0.017, 11, 16), '#fff', 'center');
  if (continueT > 0) {
    text('CONTINUE?  ' + Math.ceil(continueT), CX, H * 0.60, clamp(W * 0.024, 14, 22), '#52ff7a', 'center');
    if (Math.floor(timeSec * 1.6) % 2 === 0) text('TAP / PRESS ANY KEY', CX, H * 0.60 + 34, clamp(W * 0.016, 10, 14), '#fff', 'center');
  }
}
function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  var tilt = clamp((player.tx - player.x) * -0.006, -0.028, 0.028);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.7, rand(-shake, shake) * 0.7);
  ctx.translate(CX, H * 0.55); ctx.rotate(tilt); ctx.translate(-CX, -H * 0.55);
  drawGround();
  drawEntityList();
  ctx.restore();
  drawPlayer();
  drawHUD();
  drawBanner();
  if (flashRed > 0) { ctx.fillStyle = 'rgba(255,30,30,' + (flashRed * 0.30) + ')'; ctx.fillRect(0, 0, W, H); }
  if (mode === MODE.TITLE) drawTitle();
  if (mode === MODE.GAMEOVER) drawGameOver();
}

// ---------- main loop ----------
var lastT = performance.now(), fpsCount = 0, fpsTime = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (dt > 0) { fpsEMA = lerp(fpsEMA, 1 / dt, 0.05); }
  fpsCount++; fpsTime += dt;
  if (fpsTime > 2) { lowFx = fpsEMA < 46; fpsCount = 0; fpsTime = 0; }
  if (mode === MODE.TITLE) { /* attract mode: world scrolls, hero cruises low behind the panel */ player.tx = Math.sin(timeSec * 0.4) * 3; player.ty = 0.55 + Math.sin(timeSec * 0.7) * 0.4; player.x = lerp(player.x, player.tx, 0.04); player.y = lerp(player.y, player.ty, 0.04); }
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- DOM wiring ----------
var qrBtn = document.getElementById('qrBtn');
var qrOverlay = document.getElementById('qrOverlay');
qrBtn.addEventListener('click', function () { qrOverlay.classList.add('open'); });
qrOverlay.addEventListener('click', function () { qrOverlay.classList.remove('open'); });
var sndBtn = document.getElementById('sndBtn');
sndBtn.addEventListener('click', function () {
  muted = !muted;
  sndBtn.textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
  if (!muted) audioInit();
});

// ---------- test/debug handle (used by QA to play the game headlessly) ----------
window.__SH = {
  state: function () {
    return { mode: mode, stage: stage, world: world().name, score: score, lives: lives, fps: Math.round(fpsEMA),
      enemies: enemies.length, obstacles: obstacles.length, shots: shots.length, eshots: eshots.length,
      boss: boss ? { kind: boss.kind, hp: boss.hp, maxHp: boss.maxHp, z: Math.round(boss.z), dead: boss.dead } : null,
      player: { x: +player.x.toFixed(2), y: +player.y.toFixed(2), tx: +player.tx.toFixed(2), ty: +player.ty.toFixed(2), state: player.state },
      mouse: { seen: mousePos.seen, x: Math.round(mousePos.x), y: Math.round(mousePos.y) },
      bonusTime: Math.round(bonusTime), banner: banner.text };
  },
  start: function () { startGame(); },
  press: function () { anyPress = true; },
  fire: function (on) { firing = !!on; },
  move: function (x, y) { player.tx = clamp(x, -8.6, 8.6); player.ty = clamp(y, 0, 5.4); },
  warpBoss: function () { if (mode === MODE.PLAY) { stageTime = stageLen; } },
  warpBonus: function () { startBonus(); },
  hurtBoss: function (n) { damageBoss(n || 9999); },
  hurtPlayer: function () { player.invuln = 0; playerDie(); },
  tripPlayer: function () { player.invuln = 0; playerTrip(); },
  god: function (on) { player.invuln = on ? 99999 : 0; }
};
</script>
</body>
