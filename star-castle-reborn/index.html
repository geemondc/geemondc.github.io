<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Star Castle Reborn</title>
<meta name="description" content="Star Castle Reborn is a free remake of the 1980 vector arcade game — blast through the rings and kill the cannon, right in your browser." />
<meta property="og:title" content="Star Castle Reborn" />
<meta property="og:description" content="Star Castle Reborn is a free remake of the 1980 vector arcade game — blast through the rings and kill the cannon, right in your browser." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://geemondc.github.io/star-castle-reborn/" />
<meta name="twitter:card" content="summary" />
<link rel="canonical" href="https://geemondc.github.io/star-castle-reborn/" />
<style>
  :root{
    --ink:#cfe8ff; --ink-dim:#7fa8c9;
    --yel:#ffd94d; --org:#ff9a2e; --red:#ff4030;
    --panel:#0a0f1e; --panel-line:#2b4a6b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:#000; color:var(--ink);
    font-family:ui-monospace,'Courier New',Courier,monospace;
    overflow:hidden; overscroll-behavior:none;
    touch-action:none; user-select:none; -webkit-user-select:none;
    position:fixed; inset:0;
  }
  #app{ display:flex; flex-direction:column; height:100%; min-height:0; }

  /* ---------- HUD ---------- */
  #hud{
    flex:0 0 auto;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:6px 14px 3px; min-height:44px; background:#000; z-index:3;
  }
  .hud-cell{ width:33.33%; }
  .hud-left{ text-align:left; }
  .hud-right{ text-align:right; }
  .hud-center{ text-align:center; }
  .hud-label{ font-size:10px; letter-spacing:3px; color:var(--ink-dim); }
  .hud-score{ font-size:22px; letter-spacing:2px; color:var(--ink);
    text-shadow:0 0 8px rgba(140,200,255,.8); line-height:1.1; }
  .hud-score.active{ color:#fff; text-shadow:0 0 10px rgba(180,225,255,1),0 0 22px rgba(90,160,255,.6); }
  #hiScore{ font-size:13px; letter-spacing:2px; color:var(--ink-dim); }
  #shipIcons{ margin-top:3px; min-height:14px; }
  #shipIcons svg{ margin:0 2px; filter:drop-shadow(0 0 3px rgba(140,200,255,.9)); }

  /* ---------- Stage ---------- */
  #stageWrap{ position:relative; flex:1 1 auto; display:flex; align-items:center; justify-content:center; background:#000; min-height:0; overflow:hidden; }
  canvas#game{ display:block; background:#000; }
  #banner{
    position:absolute; left:0; right:0; top:38%; text-align:center;
    font-size:clamp(20px,6vw,34px); letter-spacing:6px; color:#fff;
    text-shadow:0 0 12px rgba(160,210,255,1),0 0 34px rgba(80,140,255,.7);
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #gameover{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background:rgba(0,0,10,.72); text-align:center; padding:20px; z-index:4;
  }
  #gameover.show{ display:flex; }
  #gameover h2{ margin:0; font-size:clamp(26px,8vw,44px); letter-spacing:8px; color:var(--red);
    text-shadow:0 0 14px rgba(255,64,48,.8); font-weight:700; }
  #gameover .go-score{ font-size:clamp(17px,5vw,24px); letter-spacing:3px; color:var(--ink); }
  #gameover .go-hi{ font-size:14px; letter-spacing:3px; color:var(--ink-dim); }
  #gameover .go-tap{ margin-top:14px; font-size:13px; letter-spacing:3px; color:var(--yel);
    text-shadow:0 0 8px rgba(255,217,77,.7); animation:blink 1.2s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }

  /* ---------- Touch deck ---------- */
  #deck{
    flex:0 0 auto;
    display:none; justify-content:space-between; align-items:stretch;
    gap:10px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:#000; z-index:3;
  }
  body.playing #deck{ display:flex; }
  @media (pointer:fine) and (min-width:760px){ body.playing #deck{ display:none; } }
  .deck-group{ display:flex; gap:10px; }
  .dbtn{
    font-family:inherit; color:var(--ink); background:#0a1224;
    border:2px solid var(--panel-line); border-radius:12px;
    min-width:74px; min-height:64px; padding:8px 10px;
    font-size:15px; letter-spacing:1px; cursor:pointer; touch-action:none;
    text-shadow:0 0 6px rgba(140,200,255,.7);
  }
  .dbtn .arr{ font-size:26px; line-height:1; display:block; }
  .dbtn.on{ background:#1b3a5f; border-color:#6fb7ff; color:#fff; }
  .dbtn.fire{ border-color:#6b3a2b; color:#ffb59d; }
  .dbtn.fire.on{ background:#5f241b; border-color:#ff8a5f; }

  /* ---------- Intro ---------- */
  #intro{
    position:fixed; inset:0; z-index:10; background:#02040c;
    display:flex; flex-direction:column; overflow-y:auto; overscroll-behavior:contain;
    touch-action:pan-y;
  }
  #intro.gone{ display:none; }
  #heroWrap{ position:relative; flex:0 0 auto; height:52dvh; min-height:300px; overflow:hidden; }
  #heroWrap img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; display:block; }
  #heroWrap::after{ content:""; position:absolute; inset:auto 0 0 0; height:90px;
    background:linear-gradient(to bottom, rgba(2,4,12,0), #02040c); }
  #introBody{ flex:1 0 auto; display:flex; flex-direction:column; align-items:center;
    padding:6px 18px calc(14px + env(safe-area-inset-bottom)); text-align:center; }
  #introBody h1{
    margin:2px 0 0; font-size:clamp(30px,9vw,52px); letter-spacing:5px; font-weight:700;
    color:#fff; text-shadow:0 0 10px rgba(160,210,255,.9),0 0 30px rgba(255,154,46,.55),0 0 60px rgba(255,64,48,.4);
  }
  #introBody h1 .sc-y{ color:var(--yel); } #introBody h1 .sc-r{ color:var(--red); }
  #tagline{ margin:8px 0 0; font-size:clamp(14px,4.2vw,18px); letter-spacing:2px; color:var(--ink); }
  #modeRow{ display:flex; gap:10px; margin-top:18px; }
  .mode-btn{
    font-family:inherit; font-size:15px; letter-spacing:2px; cursor:pointer;
    padding:11px 18px; border-radius:10px; color:var(--ink-dim);
    background:#0a1224; border:2px solid var(--panel-line);
  }
  .mode-btn.sel{ color:#fff; border-color:#6fb7ff; background:#14304f;
    box-shadow:0 0 14px rgba(90,160,255,.45); }
  #startBtn{
    margin-top:14px; font-family:inherit; cursor:pointer;
    font-size:clamp(20px,6vw,26px); letter-spacing:6px; font-weight:700;
    color:#08130a; background:var(--yel); border:none; border-radius:12px;
    padding:15px 54px; box-shadow:0 0 22px rgba(255,217,77,.55), inset 0 -3px 0 rgba(0,0,0,.25);
  }
  #startBtn:active{ transform:translateY(2px); }
  #toggleRow{ display:flex; gap:8px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
  .tgl{
    font-family:inherit; font-size:12.5px; letter-spacing:2px; cursor:pointer;
    padding:9px 13px; border-radius:999px; color:var(--ink);
    background:transparent; border:1.5px solid var(--panel-line);
  }
  .tgl:active{ background:#14304f; }
  #frLink{ margin-top:auto; padding-top:18px; }
  #frLink a{ color:var(--ink-dim); font-size:11px; letter-spacing:4px; text-decoration:none; opacity:.75; }
  #frLink a:active{ color:#fff; }

  /* ---------- Overlay windows ---------- */
  #overlay{
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; background:rgba(0,0,8,.78); padding:18px;
  }
  #overlay.show{ display:flex; }
  #ovCard{
    width:min(430px,94vw); max-height:86dvh; overflow-y:auto; touch-action:pan-y;
    background:var(--panel); border:2px solid var(--panel-line); border-radius:14px;
    padding:20px 20px 16px; box-shadow:0 0 34px rgba(60,130,255,.35);
  }
  #ovTitle{ margin:0 0 10px; font-size:17px; letter-spacing:4px; color:#fff; text-align:center; }
  #ovBody{ font-size:14.5px; line-height:1.55; letter-spacing:.4px; color:var(--ink); }
  #ovBody p{ margin:0 0 9px; }
  #ovBody .pts-y{ color:var(--yel); } #ovBody .pts-o{ color:var(--org); } #ovBody .pts-r{ color:var(--red); }
  #ovBody kbd{ background:#16283f; border:1px solid var(--panel-line); border-radius:4px; padding:0 5px; font-family:inherit; }
  #ovClose{
    display:block; margin:14px auto 2px; font-family:inherit; cursor:pointer;
    font-size:14px; letter-spacing:3px; padding:10px 30px; border-radius:9px;
    color:#fff; background:#14304f; border:2px solid #6fb7ff;
  }
  #qrBox{ text-align:center; }
  #qrBox img{ width:180px; height:180px; image-rendering:pixelated; border-radius:6px; cursor:pointer; background:#fff; }
  #qrBox.big img{ width:min(78vw,340px); height:auto; }
  #qrBox .qr-url{ margin-top:10px; font-size:11.5px; letter-spacing:1px; color:var(--ink-dim); word-break:break-all; }
  #qrBox .qr-hint{ margin-top:4px; font-size:11px; letter-spacing:2px; color:var(--ink-dim); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-cell hud-left">
      <div class="hud-label" id="lblL">HIGH SCORE</div>
      <div class="hud-score" id="scoreL">0</div>
    </div>
    <div class="hud-cell hud-center">
      <div class="hud-label">SHIPS</div>
      <div id="shipIcons"></div>
      <div id="hiScore"></div>
    </div>
    <div class="hud-cell hud-right">
      <div class="hud-label" id="lblR">PLAYER 1</div>
      <div class="hud-score" id="scoreR">0</div>
    </div>
  </div>

  <div id="stageWrap">
    <canvas id="game" width="600" height="600"></canvas>
    <div id="banner"></div>
    <div id="gameover">
      <h2>GAME OVER</h2>
      <div class="go-score" id="goP1"></div>
      <div class="go-score" id="goP2"></div>
      <div class="go-hi" id="goHi"></div>
      <div class="go-tap">TAP OR PRESS ENTER</div>
    </div>
  </div>

  <div id="deck">
    <div class="deck-group">
      <button class="dbtn" id="btnL" aria-label="Rotate left"><span class="arr">◀</span>LEFT</button>
      <button class="dbtn" id="btnR" aria-label="Rotate right"><span class="arr">▶</span>RIGHT</button>
    </div>
    <div class="deck-group">
      <button class="dbtn" id="btnT" aria-label="Thrust"><span class="arr">▲</span>THRUST</button>
      <button class="dbtn fire" id="btnF" aria-label="Fire"><span class="arr">✸</span>FIRE</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   STAR CASTLE REBORN — faithful to the 1980 Cinematronics game
   Vector line art only. Documented mechanics:
   - 3 rings x 12 segments, 2 hits each, 10/20/30 pts
   - 2 smart sparks (Gary's ruling, Oct 25), ~10 s hunt; torpedo through a full gap
   - outer-ring wipe shifts the rings outward
   - cannon kill = extra ship + faster new castle
   ============================================================ */

/* ---------------- Sound (synthesized one-shots, no music) ---------------- */
var Snd = {
  ctx:null, master:null, noiseBuf:null, enabled:true, humNodes:null, hissNodes:null,
  init:function(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.enabled ? 1 : 0;
    this.master.connect(this.ctx.destination);
    var len = this.ctx.sampleRate;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = this.noiseBuf.getChannelData(0);
    for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
  },
  setEnabled:function(on){
    this.enabled = on;
    if(this.master) this.master.gain.value = on ? 1 : 0;
    if(!on){ this.stopHum(); this.stopHiss(); }
  },
  tone:function(f0,f1,dur,type,vol,delay){
    if(!this.ctx || !this.enabled) return;
    var t = this.ctx.currentTime + (delay||0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise:function(dur,freq,vol,q,delay){
    if(!this.ctx || !this.enabled) return;
    var t = this.ctx.currentTime + (delay||0);
    var src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    var f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; f.Q.value=q||0.7;
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+dur+0.02);
  },
  shot:function(){ this.tone(920,240,0.09,'square',0.045); },
  boing:function(strength){
    // trampoline spring: a pitch-bending blip, deeper with a harder hit
    var s=Math.max(0, Math.min(1, strength||0.5));
    this.tone(150+190*s, 55, 0.20+0.08*s, 'sine', 0.10+0.07*s);
    this.tone(300+380*s, 110, 0.13, 'triangle', 0.045+0.03*s);
  },
  hitTick:function(){ this.noise(0.04,4000,0.10,1); this.tone(1500,1250,0.03,'square',0.03); },
  segDestroy:function(){ this.noise(0.16,1100,0.13); this.tone(320,55,0.18,'sawtooth',0.05); },
  mineBoom:function(){ this.noise(0.28,520,0.15); this.tone(200,40,0.25,'triangle',0.08); },
  shipBoom:function(){ this.noise(0.7,320,0.20); this.tone(130,28,0.6,'sine',0.17); },
  implode:function(){ this.tone(70,880,0.42,'sine',0.10); this.noise(0.4,2400,0.05); },
  castleBoom:function(){ this.noise(1.0,240,0.24); this.tone(160,24,0.9,'sine',0.20); this.noise(0.5,900,0.10,0.7,0.08); },
  extraShip:function(){ var n=[660,830,990,1320], s=this; n.forEach(function(f,i){ s.tone(f,f,0.11,'square',0.05,i*0.09); }); },
  startHum:function(){
    if(!this.ctx || !this.enabled || this.humNodes) return;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=47;
    f.type='lowpass'; f.frequency.value=130;
    g.gain.value=0.014;
    var lfo=this.ctx.createOscillator(), lg=this.ctx.createGain();
    lfo.frequency.value=0.8; lg.gain.value=0.007;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(); lfo.start();
    this.humNodes={o:o,lfo:lfo,g:g};
  },
  stopHum:function(){ if(this.humNodes){ try{this.humNodes.o.stop(); this.humNodes.lfo.stop();}catch(e){} this.humNodes=null; } },
  startHiss:function(){
    if(!this.ctx || !this.enabled || this.hissNodes) return;
    var src=this.ctx.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true;
    var f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=3400; f.Q.value=0.6;
    var g=this.ctx.createGain(); g.gain.value=0.0;
    g.gain.linearRampToValueAtTime(0.055, this.ctx.currentTime+0.08);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
    this.hissNodes={src:src,g:g};
  },
  stopHiss:function(){ if(this.hissNodes){ var h=this.hissNodes; try{ h.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime+0.06); h.src.stop(this.ctx.currentTime+0.1);}catch(e){} this.hissNodes=null; } }
};
</script>
<script>
'use strict';
/* ---------------- Field & constants ---------------- */
var FW=1000, FH=1000, CX=500, CY=500;
var RING_R=[150,113,76], RING_PTS=[10,20,30];
var RING_COL=['#ff4030','#ff9a2e','#ffd94d'];
var RING_CORE=['#ff4030','#ff9a2e','#ffd94d'];
var SEG_N=12, SEG_STEP=Math.PI*2/SEG_N, SEG_GAP=0.045;
var INK='#cfe8ff', INK_BRIGHT='#e3f2ff';

var cv=document.getElementById('game'), ctx=cv.getContext('2d');
var stageWrap=document.getElementById('stageWrap');
function fitCanvas(){
  var r=stageWrap.getBoundingClientRect();
  var s=Math.max(120, Math.floor(Math.min(r.width, r.height)));
  var dpr=Math.min(window.devicePixelRatio||1, 2);
  cv.style.width=s+'px'; cv.style.height=s+'px';
  cv.width=Math.round(s*dpr); cv.height=Math.round(s*dpr);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', function(){ requestAnimationFrame(fitCanvas); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
if('ResizeObserver' in window) new ResizeObserver(fitCanvas).observe(stageWrap);

var stars=[];
for(var si=0; si<48; si++) stars.push({x:Math.random()*FW, y:Math.random()*FH, r:Math.random()*1.6+0.5, p:Math.random()*6.28});

/* ---------------- State ---------------- */
var phase='attract';           // attract | play | seq | over
var numPlayers=1, cur=0;
var players=[{score:0,lives:3},{score:0,lives:3}];
var hiScore=0;
var castleLevel=1, castleTime=0;
var rings=[], cannon={a:Math.PI};
var ship={x:935,y:500,a:Math.PI,vx:0,vy:0,alive:false,invuln:0,thrusting:false};
var bullets=[], mines=[], torpedo=null, torpCd=0, particles=[], pulses=[];
var fireCd=0, deadT=0, mineTimer=1.5;
var seq={stage:'',t:0};
var keys={left:false,right:false,thrust:false,fire:false};
var elapsed=0;

function freshSegs(){ var a=[]; for(var i=0;i<SEG_N;i++) a.push(2); return a; }
function newCastle(level){
  castleLevel=level; castleTime=0;
  rings=[
    {segs:freshSegs(), flash:new Array(SEG_N).fill(0), flex:new Array(SEG_N).fill(0), flexV:new Array(SEG_N).fill(0), rot:Math.random()*6.28, dir: 1, spd:0.130},
    {segs:freshSegs(), flash:new Array(SEG_N).fill(0), flex:new Array(SEG_N).fill(0), flexV:new Array(SEG_N).fill(0), rot:Math.random()*6.28, dir:-1, spd:0.180},
    {segs:freshSegs(), flash:new Array(SEG_N).fill(0), flex:new Array(SEG_N).fill(0), flexV:new Array(SEG_N).fill(0), rot:Math.random()*6.28, dir: 1, spd:0.235}
  ];
  mines=[]; torpedo=null; torpCd=0.6; bullets=[];
  Snd.stopHiss();
  for(var i=0;i<2;i++) spawnMine(i*6);
  mineTimer=2.2;
}
function castleBase(){ return 1 + 0.22*(castleLevel-1); }
function diffMult(){ return castleBase() * (1 + Math.min(0.9, castleTime/75)); }

function segIndex(r, ang){
  var rel=(ang - rings[r].rot) % (Math.PI*2);
  if(rel<0) rel+=Math.PI*2;
  return Math.floor(rel/SEG_STEP)%SEG_N;
}
function segCenter(r, idx){ return rings[r].rot + (idx+0.5)*SEG_STEP; }

function spawnMine(seg){
  mines.push({mode:'ride', ring:2, seg:seg, off:0, migrateT:2.6+Math.random()*2.2,
              x:CX, y:CY, a:0, vx:0, vy:0, life:0, spin:Math.random()*6.28});
}
function minePos(m){
  if(m.mode==='ride'){
    var ang=segCenter(m.ring, m.seg);
    m.x=CX+Math.cos(ang)*RING_R[m.ring];
    m.y=CY+Math.sin(ang)*RING_R[m.ring];
  }
}
function launchMine(m){
  if(m.mode!=='ride') return;
  minePos(m);
  m.mode='chase'; m.life=10;
  m.a=Math.atan2(ship.y-m.y, ship.x-m.x);
  var sp=120; m.vx=Math.cos(m.a)*sp; m.vy=Math.sin(m.a)*sp;
}
function burst(x,y,color,n,spd,len){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283, s=spd*(0.3+Math.random()*0.9);
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5+Math.random()*0.6,t:0,color:color,len:len||10});
  }
}
function addScore(n){
  players[cur].score+=n;
  if(players[cur].score>hiScore) hiScore=players[cur].score;
  updateHUD();
}

/* ---------------- HUD / banner ---------------- */
var elScoreL=document.getElementById('scoreL'), elScoreR=document.getElementById('scoreR'),
    elLblL=document.getElementById('lblL'), elHi=document.getElementById('hiScore'),
    elIcons=document.getElementById('shipIcons'), elBanner=document.getElementById('banner');
var ICON='<svg width="16" height="12" viewBox="0 0 16 12"><path d="M15 6 L9 4 L8 1 L6 4 L1 3 L3 6 L1 9 L6 8 L8 11 L9 8 Z" fill="none" stroke="#cfe8ff" stroke-width="1.3"/></svg>';
function updateHUD(){
  if(numPlayers===2){ elLblL.textContent='PLAYER 2'; elScoreL.textContent=players[1].score; }
  else { elLblL.textContent='HIGH SCORE'; elScoreL.textContent=hiScore; }
  elScoreR.textContent=players[0].score;
  elScoreL.classList.toggle('active', numPlayers===2 && cur===1 && phase!=='over');
  elScoreR.classList.toggle('active', cur===0 && phase!=='over');
  elHi.textContent = numPlayers===2 ? ('HI '+hiScore) : '';
  var n=Math.max(0, Math.min(9, players[cur].lives-1)), s='';
  for(var i=0;i<n;i++) s+=ICON;
  elIcons.innerHTML=s;
}
var bannerTO=null;
function showBanner(txt, ms){
  elBanner.textContent=txt;
  elBanner.style.opacity = txt ? '1':'0';
  if(bannerTO) clearTimeout(bannerTO);
  if(txt) bannerTO=setTimeout(function(){ elBanner.style.opacity='0'; }, ms||1300);
}

/* ---------------- Game flow ---------------- */
var introEl=document.getElementById('intro'), goEl=document.getElementById('gameover');
function spawnShip(){
  ship.x=935; ship.y=500; ship.a=Math.PI; ship.vx=0; ship.vy=0;
  ship.alive=true; ship.invuln=1.2; fireCd=0;
  if(numPlayers===2) showBanner('PLAYER '+(cur+1), 1200);
  updateHUD();
}
function startGame(n){
  numPlayers=n; cur=0;
  players=[{score:0,lives:3},{score:0,lives:3}];
  phase='play';
  newCastle(1);
  introEl.classList.add('gone');
  goEl.classList.remove('show');
  document.body.classList.add('playing');
  requestAnimationFrame(fitCanvas);
  Snd.init(); Snd.startHum();
  spawnShip();
  if(n===1) showBanner('GOOD LUCK', 900);
  updateHUD();
}
function onShipDeath(){
  players[cur].lives--;
  ship.alive=false; deadT=1.6;
  burst(ship.x, ship.y, '#3366ff', 22, 260, 14);
  burst(ship.x, ship.y, '#ffffff', 10, 170, 10);
  Snd.shipBoom();
  if(torpedo){ torpedo=null; Snd.stopHiss(); }
  mines=mines.filter(function(m){ return m.mode==='ride'; });
  updateHUD();
}
function nextPlayerOrEnd(){
  if(numPlayers===2){
    var other=1-cur;
    if(players[other].lives>0){ cur=other; spawnShip(); return; }
    if(players[cur].lives>0){ spawnShip(); return; }
    gameOver(); return;
  }
  if(players[0].lives>0) spawnShip(); else gameOver();
}
function gameOver(){
  phase='over';
  Snd.stopHum(); Snd.stopHiss();
  document.getElementById('goP1').textContent='PLAYER 1 — '+players[0].score;
  var p2=document.getElementById('goP2');
  p2.textContent = numPlayers===2 ? ('PLAYER 2 — '+players[1].score) : '';
  p2.style.display = numPlayers===2 ? 'block':'none';
  document.getElementById('goHi').textContent='HIGH SCORE — '+hiScore;
  goEl.classList.add('show');
  document.body.classList.remove('playing');
  requestAnimationFrame(fitCanvas);
  updateHUD();
}
function backToIntro(){
  goEl.classList.remove('show');
  phase='attract';
  newCastle(1);
  introEl.classList.remove('gone');
}
goEl.addEventListener('click', backToIntro);

/* ---------------- Combat ---------------- */
function channelClear(){
  if(!ship.alive) return false;
  var base=Math.atan2(ship.y-CY, ship.x-CX);
  // the torpedo is a fat projectile: a channel counts if it fits near the bearing
  var offs=[0, 0.10, -0.10, 0.20, -0.20];
  for(var k=0;k<offs.length;k++){
    var ang=base+offs[k], ok=true;
    for(var r=0;r<3;r++) if(rings[r].segs[segIndex(r,ang)]>0){ ok=false; break; }
    if(ok) return true;
  }
  // once the inner ring is breached anywhere, the cannon fires through the breach
  for(var i=0;i<SEG_N;i++) if(rings[2].segs[i]<=0) return true;
  return false;
}
/* Ship vs shield rings — THE TRAMPOLINE (Gary's spec, Oct 25).
   The rings are a rubber band, not a wall: contact with an intact segment
   NEVER damages the ship or the segment — the bed flexes, snaps back, and
   throws the ship out FASTER than it came in. The faster you hit, the
   faster you leave; hold thrust into the hit and the press goes deeper —
   a launch that can throw you clear across the board (wrap takes you out
   the other side). Collision is SWEPT: the ring circle crossed between the
   previous and current position is tested against the segment intact at
   the crossing angle, so no speed can tunnel through. Only shots break
   segments. */
var shieldHitCd=0;
var SHIP_CLEAR=16;   /* ship centre stand-off from a ring line at contact */
var MAX_SPD=680;     /* sane ceiling so a launch stays controllable */
var lastBounce=null; /* test hook: {ring, seg, vin, vout, thrust, t} */
function ringBounce(r, ux, uy, side){
  // ux,uy: unit radial at the contact point. side: +1 ship came from outside
  // the ring, -1 from inside. Reflect the radial velocity component with
  // restitution > 1 (the band gives energy back), keep the tangential part,
  // then guarantee the ship leaves faster than it arrived.
  var ring=rings[r];
  var idx=segIndex(r, Math.atan2(uy,ux));
  var vr=ship.vx*ux + ship.vy*uy;
  var tx=ship.vx - vr*ux, ty=ship.vy - vr*uy;
  var sIn=Math.hypot(ship.vx, ship.vy);
  var rest = keys.thrust ? 1.55 : 1.25;   /* accelerate in = deeper press = bigger launch */
  ship.vx = tx - vr*rest*ux;
  ship.vy = ty - vr*rest*uy;
  var sOut=Math.hypot(ship.vx, ship.vy);
  var want=Math.min(MAX_SPD, sIn*1.08);
  if(sOut<want && sOut>1){ ship.vx*=want/sOut; ship.vy*=want/sOut; sOut=want; }
  else if(sOut>MAX_SPD){ ship.vx*=MAX_SPD/sOut; ship.vy*=MAX_SPD/sOut; sOut=MAX_SPD; }
  // flex the trampoline bed: the struck segment bows away from the ship,
  // its neighbours bow at a fraction; the spring in update() snaps it back
  var amp=Math.max(0.25, Math.min(1, Math.abs(vr)/470));
  var imp=(130 + 190*amp) * (side>0 ? -1 : 1);
  ring.flexV[idx]+=imp;
  ring.flexV[(idx+1)%SEG_N]+=imp*0.45;
  ring.flexV[(idx+SEG_N-1)%SEG_N]+=imp*0.45;
  if(shieldHitCd<=0){ Snd.boing(amp); shieldHitCd=0.10; }
  burst(ship.x, ship.y, RING_CORE[r], 2, 90, 6);
  lastBounce={ring:r, seg:idx, vin:sIn, vout:Math.hypot(ship.vx, ship.vy), thrust:!!keys.thrust, t:elapsed};
}
function collideShipWithRings(px, py){
  var pdx=px-CX, pdy=py-CY;
  var dPrev=Math.hypot(pdx, pdy);
  var dx=ship.x-CX, dy=ship.y-CY;
  var dc=Math.hypot(dx, dy);
  if(dPrev<4 && dc<4) return;
  // swept test: did the ship's centre cross a ring circle this step?
  for(var r=0;r<3;r++){
    var rad=RING_R[r];
    var sPrev=dPrev-rad, sCur=dc-rad;
    if((sPrev>0)===(sCur>0)) continue;
    var span=Math.abs(sPrev)+Math.abs(sCur);
    if(span<0.001) continue;
    var f=Math.abs(sPrev)/span;
    var cxp=px+(ship.x-px)*f, cyp=py+(ship.y-py)*f;
    var ca=Math.atan2(cyp-CY, cxp-CX);
    if(rings[r].segs[segIndex(r, ca)]<=0) continue; /* a real gap: fly through */
    var ux=Math.cos(ca), uy=Math.sin(ca);
    var side = sPrev>0 ? 1 : -1;
    ship.x=CX+ux*(rad + side*SHIP_CLEAR);
    ship.y=CY+uy*(rad + side*SHIP_CLEAR);
    ringBounce(r, ux, uy, side);
    return;
  }
  // no crossing: proximity resolve for a ship resting/spawned inside the
  // stand-off zone — slide it to the near face, bounce only if approaching
  if(dc>=4){
    var ux2=dx/dc, uy2=dy/dc;
    for(var r2=0;r2<3;r2++){
      var rad2=RING_R[r2];
      if(Math.abs(dc-rad2)>=SHIP_CLEAR) continue;
      if(rings[r2].segs[segIndex(r2, Math.atan2(dy,dx))]<=0) continue;
      var side2 = dc>rad2 ? 1 : -1;
      var vr2=ship.vx*ux2 + ship.vy*uy2;
      ship.x=CX+ux2*(rad2 + side2*SHIP_CLEAR);
      ship.y=CY+uy2*(rad2 + side2*SHIP_CLEAR);
      if(side2>0 ? vr2<0 : vr2>0) ringBounce(r2, ux2, uy2, side2);
      return;
    }
  }
}
function hitSegment(r, idx){
  var ring=rings[r];
  ring.segs[idx]--;
  if(ring.segs[idx]===1){
    ring.flash[idx]=0.18;
    Snd.hitTick();
    burst(bulletHitX, bulletHitY, RING_CORE[r], 3, 120, 7);
  } else if(ring.segs[idx]===0){
    addScore(RING_PTS[r]);
    Snd.segDestroy();
    var ang=segCenter(r,idx);
    burst(CX+Math.cos(ang)*RING_R[r], CY+Math.sin(ang)*RING_R[r], RING_COL[r], 9, 190, 11);
    // a mine riding this segment is released at once
    mines.forEach(function(m){ if(m.mode==='ride' && m.ring===r && m.seg===idx) launchMine(m); });
    if(r===0){
      var all=true;
      for(var i=0;i<SEG_N;i++) if(ring.segs[i]>0){ all=false; break; }
      if(all) shiftRings();
    }
  }
}
var bulletHitX=0, bulletHitY=0;
function shiftRings(){
  rings[0].segs=rings[1].segs; rings[0].flash=new Array(SEG_N).fill(0);
  rings[0].flex=rings[1].flex; rings[0].flexV=rings[1].flexV;
  rings[1].segs=rings[2].segs; rings[1].flash=new Array(SEG_N).fill(0);
  rings[1].flex=rings[2].flex; rings[1].flexV=rings[2].flexV;
  rings[2].segs=freshSegs();   rings[2].flash=new Array(SEG_N).fill(0);
  rings[2].flex=new Array(SEG_N).fill(0); rings[2].flexV=new Array(SEG_N).fill(0);
  mines.forEach(function(m){
    if(m.mode==='ride'){ if(m.ring===0) launchMine(m); else m.ring--; }
  });
  pulses.push({r:RING_R[2], t:0, color:RING_COL[2]});
  Snd.tone(180,640,0.3,'sine',0.06);
}
function hitCannon(){
  if(phase!=='play') return;
  phase='seq'; seq={stage:'implode', t:0.45};
  bullets=[]; mines=[]; torpedo=null; Snd.stopHiss();
  Snd.implode();
}
function finishCastleKill(){
  var gained=0;
  for(var r=0;r<3;r++) for(var i=0;i<SEG_N;i++)
    if(rings[r].segs[i]>0){ gained+=RING_PTS[r]; burst(CX+Math.cos(segCenter(r,i))*RING_R[r], CY+Math.sin(segCenter(r,i))*RING_R[r], RING_COL[r], 5, 240, 12); }
  if(gained>0) addScore(gained);
  // castle kill: one large multi-color starburst — yellow / orange / red / blue
  burst(CX, CY, '#ffffff', 26, 330, 15);
  burst(CX, CY, '#ffd94d', 16, 240, 12);
  burst(CX, CY, '#ff9a2e', 14, 285, 13);
  burst(CX, CY, '#ff4030', 14, 305, 13);
  burst(CX, CY, '#3366ff', 12, 260, 12);
  players[cur].lives++;
  Snd.castleBoom();
  Snd.extraShip();
  showBanner('CASTLE DOWN — EXTRA SHIP', 1500);
  if(ship.alive){ var a=Math.atan2(ship.y-CY, ship.x-CX); ship.vx+=Math.cos(a)*230; ship.vy+=Math.sin(a)*230; }
  updateHUD();
}

/* ---------------- Update ---------------- */
function turnToward(a, target, maxStep){
  var d=(target-a)%(Math.PI*2);
  if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2;
  if(Math.abs(d)<=maxStep) return target;
  return a + Math.sign(d)*maxStep;
}
function update(dt){
  elapsed+=dt;
  var dm = (phase==='play'||phase==='seq') ? diffMult() : 0.55;
  if(phase==='play') castleTime+=dt;
  for(var r=0;r<3;r++){
    rings[r].rot += rings[r].dir * rings[r].spd * dm * dt;
    for(var fi=0;fi<SEG_N;fi++){
      if(rings[r].flash[fi]>0) rings[r].flash[fi]-=dt;
      // trampoline spring: flex velocity pulls the bowed segment back
      // through rest with a wobble, settling in ~250 ms
      if(rings[r].flexV[fi]!==0 || rings[r].flex[fi]!==0){
        rings[r].flexV[fi] += (-300*rings[r].flex[fi] - 16*rings[r].flexV[fi])*dt;
        rings[r].flex[fi] += rings[r].flexV[fi]*dt;
        if(rings[r].flex[fi]>16) rings[r].flex[fi]=16;
        if(rings[r].flex[fi]<-16) rings[r].flex[fi]=-16;
        if(Math.abs(rings[r].flex[fi])<0.02 && Math.abs(rings[r].flexV[fi])<1){ rings[r].flex[fi]=0; rings[r].flexV[fi]=0; }
      }
    }
  }
  // cannon tracks the ship at all times
  if(ship.alive && phase!=='attract'){
    var want=Math.atan2(ship.y-CY, ship.x-CX);
    cannon.a=turnToward(cannon.a, want, 0.85*Math.pow(dm,0.7)*dt);
  } else if(phase==='attract'){
    cannon.a += 0.25*dt;
  }

  if(phase==='seq'){
    seq.t-=dt;
    if(seq.stage==='implode' && seq.t<=0){ finishCastleKill(); seq={stage:'explode', t:1.0}; }
    else if(seq.stage==='explode' && seq.t<=0){
      var lv=castleLevel+1;
      newCastle(lv);
      phase='play';
      // a ship caught inside the rebuilt inner ring respawns at the right edge
      if(ship.alive && Math.hypot(ship.x-CX, ship.y-CY)<RING_R[2]){
        ship.x=935; ship.y=500; ship.vx=0; ship.vy=0;
      }
      if(ship.alive) ship.invuln=Math.max(ship.invuln, 1.2);
    }
  }

  if(phase==='play' || phase==='seq'){
    /* --- ship --- */
    if(ship.alive){
      if(keys.left)  ship.a -= 3.7*dt;
      if(keys.right) ship.a += 3.7*dt;
      ship.thrusting = !!keys.thrust;
      if(keys.thrust){
        ship.vx += Math.cos(ship.a)*640*dt;
        ship.vy += Math.sin(ship.a)*640*dt;
      }
      var damp=Math.exp(-0.22*dt);
      ship.vx*=damp; ship.vy*=damp;
      var sp=Math.hypot(ship.vx, ship.vy);
      if(sp>MAX_SPD){ ship.vx*=MAX_SPD/sp; ship.vy*=MAX_SPD/sp; }
      if(shieldHitCd>0) shieldHitCd-=dt;
      // sub-step the move (<=6 units a step); the swept ring test uses the
      // pre-step position, so a bounce mid-frame is still exact
      var steps=Math.max(1, Math.ceil(sp*dt/6)), sdt=dt/steps;
      for(var stp=0; stp<steps; stp++){
        var pvx=ship.x, pvy=ship.y;
        ship.x+=ship.vx*sdt; ship.y+=ship.vy*sdt;
        if(ship.x<0) ship.x+=FW; if(ship.x>=FW) ship.x-=FW;
        if(ship.y<0) ship.y+=FH; if(ship.y>=FH) ship.y-=FH;
        // a screen wrap is a teleport, not a sweep: test proximity only
        if(Math.abs(ship.x-pvx)>FW/2 || Math.abs(ship.y-pvy)>FH/2){ pvx=ship.x; pvy=ship.y; }
        if(phase==='play') collideShipWithRings(pvx, pvy);
      }
      if(ship.invuln>0) ship.invuln-=dt;
      fireCd-=dt;
      if(keys.fire && fireCd<=0 && bullets.length<4 && phase==='play'){
        bullets.push({x:ship.x+Math.cos(ship.a)*17, y:ship.y+Math.sin(ship.a)*17,
                      vx:Math.cos(ship.a)*800+ship.vx*0.35, vy:Math.sin(ship.a)*800+ship.vy*0.35, life:1.15});
        fireCd=0.17;
        Snd.shot();
      }
    } else if(phase==='play'){
      deadT-=dt;
      if(deadT<=0) nextPlayerOrEnd();
    }

    /* --- bullets --- */
    for(var bi=bullets.length-1; bi>=0; bi--){
      var b=bullets[bi];
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      if(b.x<0) b.x+=FW; if(b.x>=FW) b.x-=FW;
      if(b.y<0) b.y+=FH; if(b.y>=FH) b.y-=FH;
      var dead = b.life<=0;
      if(!dead && phase==='play'){
        var dc=Math.hypot(b.x-CX, b.y-CY);
        if(dc<30){ bullets.splice(bi,1); hitCannon(); continue; }
        for(var rr=0; rr<3 && !dead; rr++){
          if(Math.abs(dc-RING_R[rr])<=15){
            var idx=segIndex(rr, Math.atan2(b.y-CY, b.x-CX));
            if(rings[rr].segs[idx]>0){
              bulletHitX=b.x; bulletHitY=b.y;
              hitSegment(rr, idx);
              dead=true;
            }
          }
        }
        if(!dead){
          for(var mi=0; mi<mines.length; mi++){
            var mn=mines[mi];
            if(mn.mode==='chase' && Math.hypot(b.x-mn.x, b.y-mn.y)<16){
              burst(mn.x, mn.y, '#ffffff', 10, 200, 10);
              Snd.mineBoom();
              mines.splice(mi,1);
              dead=true; break;
            }
          }
        }
      }
      if(dead) bullets.splice(bi,1);
    }

    /* --- mines --- */
    mineTimer-=dt;
    if(mines.length<2 && mineTimer<=0 && phase==='play'){ spawnMine(Math.floor(Math.random()*SEG_N)); mineTimer=2.2; }
    for(var mj=mines.length-1; mj>=0; mj--){
      var m=mines[mj];
      m.spin+=dt*4;
      if(m.mode==='ride'){
        minePos(m);
        if(ship.alive && ship.invuln<=0 && phase==='play' && Math.hypot(m.x-ship.x, m.y-ship.y)<26){
          mines.splice(mj,1);
          onShipDeath();
          break; /* onShipDeath replaced the mines array — stop this pass */
        }
        m.migrateT-=dt;
        if(m.migrateT<=0){
          if(m.ring>0){ m.ring--; m.migrateT=2.6+Math.random()*2.2; }
          else launchMine(m);
        }
      } else {
        m.life-=dt;
        var spd=Math.min(335, 155*(1+0.4*(dm-1)));
        if(ship.alive){
          var des=Math.atan2(ship.y-m.y, ship.x-m.x);
          m.a=turnToward(m.a, des, (2.3+0.45*(dm-1))*dt);
        }
        m.vx+= (Math.cos(m.a)*spd - m.vx)*Math.min(1, 3.2*dt);
        m.vy+= (Math.sin(m.a)*spd - m.vy)*Math.min(1, 3.2*dt);
        m.x+=m.vx*dt; m.y+=m.vy*dt;
        var out = m.x<-24||m.x>FW+24||m.y<-24||m.y>FH+24;
        if(m.life<=0 || out){
          burst(m.x, m.y, '#ffffff', 4, 80, 7);
          mines.splice(mj,1); continue;
        }
        if(ship.alive && ship.invuln<=0 && Math.hypot(m.x-ship.x, m.y-ship.y)<26 && phase==='play'){
          mines.splice(mj,1);
          onShipDeath();
          break; /* onShipDeath replaced the mines array — stop this pass */
        }
      }
    }

    /* --- torpedo --- */
    if(phase==='play'){
      torpCd-=dt;
      if(!torpedo && torpCd<=0 && ship.alive && channelClear()){
        var ta=Math.atan2(ship.y-CY, ship.x-CX);
        torpedo={x:CX+Math.cos(ta)*42, y:CY+Math.sin(ta)*42, a:ta};
        torpCd=2.3+Math.random()*1.5; /* next shot ~2.3–3.8 s later — every once in a while */
        Snd.startHiss();
      }
    }
    if(torpedo){
      // the original torpedo tracks the ship with a limited turn rate
      if(ship.alive){
        var wantT=Math.atan2(ship.y-torpedo.y, ship.x-torpedo.x);
        torpedo.a=turnToward(torpedo.a, wantT, 1.05*dt);
      }
      var tsp=430+Math.min(120, (castleLevel-1)*14);
      torpedo.x+=Math.cos(torpedo.a)*tsp*dt;
      torpedo.y+=Math.sin(torpedo.a)*tsp*dt;
      if(Math.random()<0.55) particles.push({x:torpedo.x,y:torpedo.y,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,life:0.3,t:0,color:'#ffffff',len:5});
      if(torpedo.x<-16||torpedo.x>FW+16||torpedo.y<-16||torpedo.y>FH+16){
        torpedo=null; Snd.stopHiss();
      } else if(ship.alive && ship.invuln<=0 && phase==='play' && Math.hypot(torpedo.x-ship.x, torpedo.y-ship.y)<23){
        torpedo=null; Snd.stopHiss();
        onShipDeath();
      }
    }
  }

  /* --- particles & pulses --- */
  for(var pi=particles.length-1; pi>=0; pi--){
    var p=particles[pi]; p.t+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.t>=p.life) particles.splice(pi,1);
  }
  for(var ui=pulses.length-1; ui>=0; ui--){
    pulses[ui].t+=dt; pulses[ui].r+=260*dt;
    if(pulses[ui].t>0.7) pulses.splice(ui,1);
  }
}

/* ---------------- Draw ---------------- */
function stroke2(color, lw){
  ctx.strokeStyle=color; ctx.globalAlpha=0.22; ctx.lineWidth=lw*3.1; ctx.stroke();
  ctx.globalAlpha=1; ctx.lineWidth=lw; ctx.stroke();
}
function drawRings(sc){
  for(var r=0;r<3;r++){
    var ring=rings[r], rad=RING_R[r]*sc, col=RING_COL[r];
    for(var i=0;i<SEG_N;i++){
      var hp=ring.segs[i]; if(hp<=0) continue;
      var a0=ring.rot + i*SEG_STEP + SEG_GAP, a1=ring.rot + (i+1)*SEG_STEP - SEG_GAP;
      // ONE thin straight-chord line per segment, as on the original vector
      // display — the color bleeds outside the line like a kid coloring
      // outside the lines: two wide faint aura passes under a bright core.
      // A segment the ship just bounced off bows through its midpoint —
      // the trampoline flex (ring.flex), drawn on every pass.
      var x0=CX+Math.cos(a0)*rad, y0=CY+Math.sin(a0)*rad;
      var x1=CX+Math.cos(a1)*rad, y1=CY+Math.sin(a1)*rad;
      var fx=ring.flex ? ring.flex[i] : 0;
      var am=ring.rot + (i+0.5)*SEG_STEP, frad=rad + fx*sc;
      var xm=CX+Math.cos(am)*frad, ym=CY+Math.sin(am)*frad;
      ctx.strokeStyle=col; ctx.lineCap='round';
      ctx.globalAlpha=0.07; ctx.lineWidth=13*sc;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(xm,ym); ctx.lineTo(x1,y1); ctx.stroke();
      ctx.globalAlpha=0.13; ctx.lineWidth=6.5*sc;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(xm,ym); ctx.lineTo(x1,y1); ctx.stroke();
      var fl = (hp===1) ? (ring.flash[i]>0 ? 1 : 0.72+0.28*Math.sin(elapsed*22+i)) : 1;
      ctx.globalAlpha=fl; ctx.lineWidth=3.1*sc;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(xm,ym); ctx.lineTo(x1,y1); ctx.stroke();
      ctx.globalAlpha=fl*0.5; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.2*sc;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(xm,ym); ctx.lineTo(x1,y1); ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
}
function drawCannon(sc){
  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(sc, sc);
  ctx.rotate(cannon.a);
  ctx.scale(1.38, 1.38);
  // the villain: a pale yellow spaceship in 4 outline parts — a middle
  // diamond, two rhombus wings sweeping back, and a weird 6-sided rear.
  // Nose toward +X; the outlines overlap, as on the original display.
  var VIL='#f5ffa8';
  // back end: the weird 6-sided figure
  ctx.beginPath();
  ctx.moveTo(-12,-9); ctx.lineTo(-24,-9); ctx.lineTo(-30,0);
  ctx.lineTo(-24,9); ctx.lineTo(-12,9); ctx.lineTo(-7,0);
  ctx.closePath(); stroke2(VIL, 2.2);
  // upper wing: a rhombus sweeping back
  ctx.beginPath();
  ctx.moveTo(8,-3); ctx.lineTo(-10,-24); ctx.lineTo(-26,-17); ctx.lineTo(-8,4);
  ctx.closePath(); stroke2(VIL, 2.2);
  // lower wing: the matching rhombus
  ctx.beginPath();
  ctx.moveTo(8,3); ctx.lineTo(-10,24); ctx.lineTo(-26,17); ctx.lineTo(-8,-4);
  ctx.closePath(); stroke2(VIL, 2.2);
  // middle section: a slim diamond running to the nose
  ctx.beginPath();
  ctx.moveTo(30,0); ctx.lineTo(8,6); ctx.lineTo(-8,0); ctx.lineTo(8,-6);
  ctx.closePath(); stroke2(VIL, 2.4);
  ctx.restore();
}
function drawShip(){
  if(!ship.alive) return;
  if(ship.invuln>0 && Math.floor(elapsed*14)%2===0 && phase==='play') return;
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.a);
  ctx.beginPath();
  // Galaga-style starfighter (Gary, Oct 25): WIDE wingspan, broad body,
  // short nose — not the slim Asteroids dart. Twin wings sweep out to the
  // sides from a chunky centre fuselage; blue vector outline.
  ctx.moveTo(15,0);        // short nose
  ctx.lineTo(6,3.5);       // fuselage, right
  ctx.lineTo(3,6);         // wing root, front
  ctx.lineTo(-3,17);       // right wing, leading tip
  ctx.lineTo(-11,17);      // right wing, trailing tip
  ctx.lineTo(-8,7);        // wing inner, back
  ctx.lineTo(-13,4.5);     // tail fin, right
  ctx.lineTo(-9.5,0);      // tail notch
  ctx.lineTo(-13,-4.5);    // tail fin, left
  ctx.lineTo(-8,-7);
  ctx.lineTo(-11,-17);
  ctx.lineTo(-3,-17);
  ctx.lineTo(3,-6);
  ctx.lineTo(6,-3.5);
  ctx.closePath();
  stroke2('#3366ff', 2.2);
  // cockpit diamond on the fuselage
  ctx.beginPath();
  ctx.moveTo(10.5,0); ctx.lineTo(5,2.4); ctx.lineTo(0.5,0); ctx.lineTo(5,-2.4);
  ctx.closePath();
  stroke2('#3366ff', 1.6);
  if(ship.thrusting){
    var f=8+Math.random()*7;
    ctx.beginPath();
    ctx.moveTo(-12,3); ctx.lineTo(-12-f,0); ctx.lineTo(-12,-3);
    stroke2(Math.random()<0.5?'#ffffff':'#3366ff', 2);
  }
  ctx.restore();
}
function drawMine(m){
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.spin);
  // small star/X mark, in the color of the ring it rides (white once chasing)
  var col = m.mode==='ride' ? RING_COL[m.ring] : '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-7,-7); ctx.lineTo(7,7);
  ctx.moveTo(7,-7);  ctx.lineTo(-7,7);
  ctx.moveTo(0,-9.5); ctx.lineTo(0,9.5);
  ctx.moveTo(-9.5,0); ctx.lineTo(9.5,0);
  stroke2(col, 1.8);
  ctx.restore();
}
var fieldGrad=null;
function draw(){
  ctx.setTransform(cv.width/FW, 0, 0, cv.width/FW, 0, 0);
  // deep blue outer space — a blue wash, brightest at the center
  if(!fieldGrad){
    fieldGrad=ctx.createRadialGradient(CX,CY,60, CX,CY,720);
    fieldGrad.addColorStop(0,'#0a1f42');
    fieldGrad.addColorStop(0.5,'#051230');
    fieldGrad.addColorStop(1,'#01020a');
  }
  ctx.fillStyle=fieldGrad;
  ctx.fillRect(0,0,FW,FH);
  // stars: bright electric blue points with a soft halo, gentle twinkle
  for(var sti=0; sti<stars.length; sti++){
    var st=stars[sti];
    ctx.globalAlpha=0.16; ctx.fillStyle='#2e7bff';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r*4, 0, 6.283); ctx.fill();
    ctx.globalAlpha=0.75+0.25*Math.sin(elapsed*2+st.p); ctx.fillStyle='#a8d4ff';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r*1.6, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  // pulses
  for(var u=0;u<pulses.length;u++){
    var pu=pulses[u];
    ctx.globalAlpha=Math.max(0, 0.6*(1-pu.t/0.7));
    ctx.beginPath(); ctx.arc(CX,CY,pu.r,0,6.283);
    ctx.strokeStyle=pu.color; ctx.lineWidth=3; ctx.stroke();
  }
  ctx.globalAlpha=1;
  var sc=1;
  if(phase==='seq' && seq.stage==='implode') sc=Math.max(0.06, seq.t/0.45);
  if(!(phase==='seq' && seq.stage==='explode')){ drawRings(sc); drawCannon(sc); }
  mines.forEach(drawMine);
  if(torpedo){
    // sparking plasma ball: small outline core with radiating spark spokes
    ctx.save();
    ctx.translate(torpedo.x, torpedo.y);
    ctx.rotate(elapsed*9);
    ctx.beginPath();
    for(var tk=0;tk<8;tk++){
      var ta2=tk*Math.PI/4;
      ctx.moveTo(Math.cos(ta2)*5.5, Math.sin(ta2)*5.5);
      ctx.lineTo(Math.cos(ta2)*13, Math.sin(ta2)*13);
    }
    stroke2('#ffffff', 2);
    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 6.283);
    stroke2('#ffffff', 2.2);
    ctx.restore();
  }
  for(var b=0;b<bullets.length;b++){
    var bl=bullets[b], ba=Math.atan2(bl.vy, bl.vx);
    ctx.beginPath();
    ctx.moveTo(bl.x-Math.cos(ba)*6, bl.y-Math.sin(ba)*6);
    ctx.lineTo(bl.x+Math.cos(ba)*6, bl.y+Math.sin(ba)*6);
    stroke2('#dff2ff', 2.8);
  }
  drawShip();
  for(var q=0;q<particles.length;q++){
    var p=particles[q], al=1-p.t/p.life;
    ctx.globalAlpha=al;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx*0.045*(p.len/10), p.y - p.vy*0.045*(p.len/10));
    ctx.strokeStyle=p.color; ctx.lineWidth=2.2; ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ---------------- Loop ---------------- */
var lastT=performance.now();
function loop(now){
  var dt=Math.min(0.05, (now-lastT)/1000);
  lastT=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ---------------- Input: keyboard ---------------- */
function setKey(code, down){
  switch(code){
    case 'ArrowLeft': case 'KeyA': keys.left=down; return true;
    case 'ArrowRight': case 'KeyD': keys.right=down; return true;
    case 'ArrowUp': case 'KeyW': keys.thrust=down; return true;
    case 'Space': keys.fire=down; return true;
  }
  return false;
}
window.addEventListener('keydown', function(e){
  if(setKey(e.code, true)) e.preventDefault();
  if(e.code==='Enter'){
    if(!introEl.classList.contains('gone')) document.getElementById('startBtn').click();
    else if(phase==='over') backToIntro();
  }
});
window.addEventListener('keyup', function(e){ if(setKey(e.code, false)) e.preventDefault(); });

/* ---------------- Input: touch deck ---------------- */
function bindHold(id, prop){
  var el=document.getElementById(id);
  function on(e){ e.preventDefault(); keys[prop]=true; el.classList.add('on'); Snd.init(); }
  function off(e){ if(e) e.preventDefault(); keys[prop]=false; el.classList.remove('on'); }
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
bindHold('btnL','left'); bindHold('btnR','right');
bindHold('btnT','thrust'); bindHold('btnF','fire');
