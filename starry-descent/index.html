<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Starry Descent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #04060f;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    height: 100dvh;
    font-family: Georgia, 'Times New Roman', serif;
    color: #fdf6e3;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }

  /* ---------- scenes ---------- */
  .scene {
    position: fixed;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2.5s ease;
    transform: scale(1.035);
    will-change: opacity, transform;
  }
  .scene.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
    transition: opacity 2.5s ease, transform 2.5s ease;
  }
  .scene .backdrop {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(42px) brightness(0.5) saturate(1.1);
    transform: scale(1.15);
  }
  .scene .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scene .painting {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  /* breathing drift — applied to a wrapper holding backdrop + stage so they stay together */
  .drift { position: absolute; inset: 0; will-change: transform; }
  .drift-a { animation: driftA 22s ease-in-out infinite alternate; }
  .drift-b { animation: driftB 22s ease-in-out infinite alternate; }
  @keyframes driftA {
    from { transform: scale(1.00) translate(0, 0); }
    to   { transform: scale(1.05) translate(-0.6%, -0.4%); }
  }
  @keyframes driftB {
    from { transform: scale(1.05) translate(0.5%, 0.3%); }
    to   { transform: scale(1.00) translate(0, 0); }
  }

  /* ---------- twinkle / shooting-star canvas ---------- */
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* ---------- caption ---------- */
  #caption {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
    text-align: center;
    font-size: clamp(19px, 2.6vw, 27px);
    font-style: italic;
    letter-spacing: 0.04em;
    color: #fdf6e3;
    text-shadow: 0 1px 14px rgba(0,0,0,0.85), 0 0 3px rgba(0,0,0,0.9);
    opacity: 1;
    transition: opacity 1.1s ease;
    pointer-events: none;
    z-index: 10;
    padding: 0 20px;
  }
  #caption.fading { opacity: 0; }

  /* ---------- final button ---------- */
  #flightBtn {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    z-index: 11;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(15px, 2vw, 18px);
    letter-spacing: 0.05em;
    color: #fdf6e3;
    text-decoration: none;
    background: rgba(10, 14, 34, 0.45);
    border: 1px solid rgba(253, 246, 227, 0.45);
    border-radius: 999px;
    padding: 10px 22px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.4s ease 0.9s, visibility 0s linear 2.3s;
    cursor: pointer;
  }
  #flightBtn.show {
    opacity: 1;
    visibility: visible;
    transition: opacity 1.4s ease 0.9s, visibility 0s;
  }
  #flightBtn:hover, #flightBtn:focus-visible {
    background: rgba(30, 38, 76, 0.6);
    outline: none;
  }

  /* ---------- progress dots ---------- */
  #dots {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex;
    justify-content: center;
    gap: 9px;
    z-index: 10;
    pointer-events: none;
    opacity: 0.4;
  }
  #dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(253, 246, 227, 0.45);
    transition: background 1s ease, transform 1s ease;
  }
  #dots span.on {
    background: #fdf6e3;
    transform: scale(1.25);
  }

  @media (prefers-reduced-motion: reduce) {
    .drift-a, .drift-b { animation: none; }
    .scene, .scene.active { transition-duration: 0.6s; }
  }
</style>
</head>
<body>

  <!-- scene layers are built by the script -->

  <canvas id="sky" aria-hidden="true"></canvas>

  <p id="caption">Up among the stars.</p>

  <a id="flightBtn" href="https://geemondc.github.io/movement-is-medicine/">Take the long flight</a>

  <div id="dots" aria-hidden="true">
    <span class="on"></span><span></span><span></span><span></span><span></span>
  </div>

<script>
(function () {
  'use strict';

  var SCENES = [
    { src: 'sky.webp',         caption: 'Up among the stars.' },
    { src: 'countryside.webp', caption: 'Over the wheatfields.' },
    { src: 'river.webp',       caption: 'Down the river.' },
    { src: 'village.webp',     caption: 'Almost home.' },
    { src: 'rooftops.webp',    caption: 'Home.' }
  ];

  var body = document.body;
  var captionEl = document.getElementById('caption');
  var flightBtn = document.getElementById('flightBtn');
  var dotEls = document.querySelectorAll('#dots span');

  /* ----- build scene layers ----- */
  var layers = SCENES.map(function (scene, i) {
    var layer = document.createElement('div');
    layer.className = 'scene';

    var drift = document.createElement('div');
    drift.className = 'drift ' + (i % 2 === 0 ? 'drift-a' : 'drift-b');

    var backdrop = document.createElement('img');
    backdrop.className = 'backdrop';
    backdrop.src = scene.src;
    backdrop.alt = '';
    backdrop.setAttribute('aria-hidden', 'true');
    backdrop.draggable = false;

    var stage = document.createElement('div');
    stage.className = 'stage';

    var painting = document.createElement('img');
    painting.className = 'painting';
    painting.src = scene.src;
    painting.alt = scene.caption;
    painting.draggable = false;
    if (i > 0) painting.loading = 'lazy';

    stage.appendChild(painting);
    drift.appendChild(backdrop);
    drift.appendChild(stage);
    layer.appendChild(drift);
    body.insertBefore(layer, body.firstChild);
    return layer;
  });
  // insertBefore reversed the stacking; re-append in order so later scenes sit on top
  layers.forEach(function (layer) { body.insertBefore(layer, document.getElementById('sky')); });

  var current = 0;
  layers[0].classList.add('active');

  function preload(i) {
    var next = (i + 1) % SCENES.length;
    var img = new Image();
    img.src = SCENES[next].src;
  }
  preload(0);

  /* ----- twinkles + shooting stars (one canvas) ----- */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var twinkles = [];
  for (var t = 0; t < 42; t++) {
    twinkles.push({
      x: Math.random(),
      y: Math.random() * 0.55,
      r: 0.7 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.9
    });
  }

  var shooters = [];
  function fireShootingStar() {
    var fromLeft = Math.random() < 0.5;
    var sx = fromLeft ? W * (0.08 + Math.random() * 0.35) : W * (0.55 + Math.random() * 0.35);
    var sy = H * (0.05 + Math.random() * 0.25);
    var dir = fromLeft ? 1 : -1;
    var speed = 520 + Math.random() * 260;
    shooters.push({
      x: sx, y: sy,
      vx: dir * speed,
      vy: speed * 0.38,
      life: 0,
      ttl: 0.85 + Math.random() * 0.3
    });
  }

  var lastTs = 0;
  function frame(ts) {
    var now = ts / 1000;
    var dt = Math.min(now - (lastTs || now), 0.05);
    lastTs = now;
    ctx.clearRect(0, 0, W, H);

    // twinkles
    for (var i = 0; i < twinkles.length; i++) {
      var s = twinkles[i];
      var a = 0.5 + 0.5 * Math.sin(now * s.speed * 2 + s.phase);
      var alpha = 0.12 + a * 0.5;
      var x = s.x * W, y = s.y * H;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fffbe8';
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
      // tiny cross sparkle on the brighter stars
      if (s.r > 1.7) {
        ctx.globalAlpha = alpha * 0.6;
        ctx.fillRect(x - s.r * 3, y - 0.5, s.r * 6, 1);
        ctx.fillRect(x - 0.5, y - s.r * 3, 1, s.r * 6);
      }
    }

    // shooting stars
    for (var j = shooters.length - 1; j >= 0; j--) {
      var sh = shooters[j];
      sh.life += dt;
      if (sh.life >= sh.ttl) { shooters.splice(j, 1); continue; }
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      var fade = 1 - sh.life / sh.ttl;
      var tail = 0.16; // trail length in seconds of travel
      var tx = sh.x - sh.vx * tail;
      var ty = sh.y - sh.vy * tail;
      var grad = ctx.createLinearGradient(tx, ty, sh.x, sh.y);
      grad.addColorStop(0, 'rgba(255,251,232,0)');
      grad.addColorStop(1, 'rgba(255,251,232,' + (0.9 * fade).toFixed(3) + ')');
      ctx.globalAlpha = 1;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(sh.x, sh.y);
      ctx.stroke();
      ctx.globalAlpha = 0.95 * fade;
      ctx.fillStyle = '#fffbe8';
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ----- journey ----- */
  var lockUntil = 0;
  function advance() {
    var nowMs = performance.now();
    if (nowMs < lockUntil) return;
    lockUntil = nowMs + 500;

    fireShootingStar();

    var prev = current;
    current = (current + 1) % SCENES.length;

    captionEl.classList.add('fading');
    setTimeout(function () {
      captionEl.textContent = SCENES[current].caption;
      captionEl.classList.remove('fading');
    }, 1100);

    layers[prev].classList.remove('active');
    layers[current].classList.add('active');

    for (var d = 0; d < dotEls.length; d++) {
      dotEls[d].classList.toggle('on', d === current);
    }

    flightBtn.classList.toggle('show', current === SCENES.length - 1);
    preload(current);
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('a, button')) return;
    advance();
  });

  flightBtn.addEventListener('click', function (e) {
    e.stopPropagation();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      advance();
    }
  });
})();
</script>
</body>
</html>
