<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Starry Night Line — a Living Ride</title>
<meta name="description" content="Ride the night rails under a turning sky. The original Starry Night Train, living — it never ends.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#060a1e; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#fdf3d8;
         -webkit-user-select:none; user-select:none; touch-action:none; }

  /* The world: two stacked copies of the ONE painting, flying down its
     own track corridor — each grows exponentially around the rails'
     vanishing point, the senior layer melts out over the junior as its
     cycle ends, then restarts behind. The ride never ends. */
  .layer { position:absolute; overflow:hidden; will-change:transform,opacity;
           transform-origin:53.5% 47.2%; }
  .layer img.world { position:absolute; inset:0; width:100%; height:100%; }
  /* The sky's own life: discs cut from the painting's swirls, sitting
     exactly over their painted originals inside each world layer,
     swaying a few degrees, very slow — the swirls turn a little. */
  .disc { position:absolute; will-change:transform; pointer-events:none; aspect-ratio:1; }
  .disc img { width:100%; height:100%; display:block; }
  @keyframes nxSway1 { from { transform:rotate(-7deg); } to { transform:rotate(7deg); } }
  @keyframes nxSway2 { from { transform:rotate(6deg); }  to { transform:rotate(-6deg); } }
  .disc.d1 { animation:nxSway1 46s ease-in-out infinite alternate; }
  .disc.d2 { animation:nxSway2 58s ease-in-out infinite alternate; }
  .disc.d3 { animation:nxSway1 39s ease-in-out infinite alternate; }
  .disc.d4 { animation:nxSway2 51s ease-in-out infinite alternate; }
  .disc.d5 { animation:nxSway1 33s ease-in-out infinite alternate; }

  /* Street lamps rushing past at the edges of the track */
  .lamp { position:absolute; will-change:transform,opacity; pointer-events:none; }
  .lamp img { width:100%; height:100%; display:block; }

  /* Stars twinkling in the turning sky */
  .star { position:absolute; border-radius:50%; pointer-events:none;
          background:radial-gradient(circle, #fffbe8 0%, #ffe9a8 38%, rgba(255,233,168,0) 72%);
          animation:nxTwinkle 3.4s ease-in-out infinite; }
  @keyframes nxTwinkle { 0%,100% { opacity:.12; transform:scale(.72); } 50% { opacity:.95; transform:scale(1.12); } }

  /* The train itself: the painting's own roof and headlight, a slim
     steady band at the bottom. It never moves — the world does. */
  #band { position:absolute; left:0; right:0; bottom:0; z-index:6; pointer-events:none; }
  #band img { width:100%; height:auto; display:block; }
  @media (max-aspect-ratio: 1/1) {
    #band img { width:158%; margin-left:-29%; }
  }

  .shade { position:absolute; inset:0; z-index:5; pointer-events:none;
           background:linear-gradient(180deg, rgba(4,6,20,.30), rgba(4,6,20,0) 18%, rgba(4,6,20,0) 82%, rgba(4,6,20,.24)); }

  /* Furniture */
  #title { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:10;
           font-size:13px; letter-spacing:.34em; text-transform:uppercase; white-space:nowrap;
           color:#fdf3d8; background:rgba(8,10,28,.55); border:1px solid rgba(253,211,106,.45);
           padding:9px 18px 9px 22px; border-radius:999px; backdrop-filter:blur(3px); }
  #cap { position:absolute; top:58px; left:50%; transform:translateX(-50%); z-index:10;
         font-size:14.5px; font-style:italic; letter-spacing:.04em; white-space:nowrap;
         color:#fdf3d8; text-shadow:0 1px 10px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.9); }
  #mode { position:absolute; right:16px; top:50%; transform:translateY(-50%); z-index:10;
          display:flex; flex-direction:column; gap:8px; }
  #mode button { font-family:inherit; font-size:12.5px; letter-spacing:.18em; text-transform:uppercase;
                 padding:9px 15px; border-radius:999px; cursor:pointer;
                 color:#fdf3d8; background:rgba(8,10,28,.55); border:1px solid rgba(253,211,106,.45);
                 backdrop-filter:blur(3px); }
  #mode button.on { background:#f5b942; color:#23130a; border-color:#f5b942; font-weight:bold; }
  @media (max-width:640px) {
    #title { font-size:10.5px; letter-spacing:.26em; padding:8px 13px 8px 16px; }
    #cap { font-size:12.5px; top:52px; }
    #mode { right:10px; }
    #mode button { font-size:11px; padding:8px 11px; }
  }
  body.still .disc, body.still .star { animation-play-state:paused; }
</style>
</head>
<body>
  <div class="layer" id="layerA"></div>
  <div class="layer" id="layerB"></div>
  <div id="streamers"></div>
  <div id="stars"></div>
  <div class="shade"></div>
  <div id="band"><img src="band.webp" alt=""></div>

  <div id="title">The Starry Night Line</div>
  <div id="cap">Riding the night rails — it never ends</div>
  <div id="mode">
    <button id="btnLiving" class="on">Living</button>
    <button id="btnStill">Still</button>
  </div>

<script>
(function(){
  var VPX = 0.535, VPY = 0.472;              // where the rails converge
  var P = 16;                                 // seconds per approach
  var FW = 0.35 * P; if (FW < 2) FW = 2;      // senior melt window
  var S = 2.2;                                // growth per approach
  var params = new URLSearchParams(location.search);
  var zoomQ = parseFloat(params.get('zoom'));
  if (zoomQ >= 4 && zoomQ <= 1200) { P = zoomQ; FW = 0.35 * P; if (FW < 2) FW = 2; }
  var pace = parseFloat(params.get('pace')); if (!(pace > 0)) pace = 1;

  var DISCS = [  // cx, cy, diameter (fractions of the painting), sway class
    { src:'disc1.webp', cx:0.255, cy:0.125, d:0.175, cls:'d1' },
    { src:'disc2.webp', cx:0.625, cy:0.185, d:0.195, cls:'d2' },
    { src:'disc3.webp', cx:0.790, cy:0.335, d:0.130, cls:'d3' },
    { src:'disc4.webp', cx:0.875, cy:0.145, d:0.120, cls:'d4' },
    { src:'disc5.webp', cx:0.335, cy:0.175, d:0.095, cls:'d5' }
  ];
  function buildLayer(el){
    var img = document.createElement('img');
    img.className = 'world'; img.src = 'world.jpg'; img.alt = '';
    el.appendChild(img);
    DISCS.forEach(function(dc){
      var wrap = document.createElement('div');
      wrap.className = 'disc ' + dc.cls;
      // the painting is 16:9; layer-space % of height = d * (16/9)
      wrap.style.width = (dc.d * 100) + '%';
      wrap.style.left = ((dc.cx - dc.d/2) * 100) + '%';
      wrap.style.top = ((dc.cy - dc.d * 0.8889) * 100) + '%';
      var di = document.createElement('img'); di.src = dc.src; di.alt = '';
      wrap.appendChild(di);
      el.appendChild(wrap);
    });
  }
  // The layer is always the painting's own 16:9, oversized to cover the
  // screen, pinned so the rails' vanishing point sits at the screen's
  // vanishing point at any aspect — painting coordinates stay true.
  function fit(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var lw = Math.max(vw, vh * 16 / 9), lh = lw * 9 / 16;
    [layerA, layerB].forEach(function(el){
      el.style.width = lw + 'px'; el.style.height = lh + 'px';
      el.style.left = (VPX * vw - VPX * lw) + 'px';
      el.style.top = (VPY * vh - VPY * lh) + 'px';
    });
  }
  var layerA = document.getElementById('layerA');
  var layerB = document.getElementById('layerB');
  buildLayer(layerA); buildLayer(layerB);
  fit();
  window.addEventListener('resize', fit);
  var layers = [
    { el: layerA, off: 0 },
    { el: layerB, off: P / 2 }
  ];

  // Street lamps on approach paths at the edges of the track
  var LAMPS = [];
  var streamBox = document.getElementById('streamers');
  [ {sx:0.452, ex:-0.07}, {sx:0.452, ex:-0.07}, {sx:0.452, ex:-0.07},
    {sx:0.618, ex: 1.07}, {sx:0.618, ex: 1.07}, {sx:0.618, ex: 1.07} ].forEach(function(cfg, i){
    var el = document.createElement('div');
    el.className = 'lamp';
    var im = document.createElement('img'); im.src = 'lamp.webp'; im.alt = '';
    el.appendChild(im); streamBox.appendChild(el);
    LAMPS.push({ el: el, sx: cfg.sx, ex: cfg.ex, T: 8, off: i * 1.37, w0: 0.012, w1: 0.34 });
  });

  // Twinkling stars across the sky
  var starBox = document.getElementById('stars');
  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 16; i++){
    var st = document.createElement('div');
    st.className = 'star';
    var sz = 3 + rnd() * 5;
    st.style.width = sz + 'px'; st.style.height = sz + 'px';
    st.style.left = (4 + rnd() * 92) + '%';
    st.style.top = (3 + rnd() * 34) + '%';
    st.style.animationDuration = (2.4 + rnd() * 2.8) + 's';
    st.style.animationDelay = (-rnd() * 4) + 's';
    starBox.appendChild(st);
  }

  var living = true, simT = 0, last = null;
  function setLayer(L, t){
    var p = ((t + L.off) % P) / P;
    var k = Math.pow(S, p);
    L.el.style.transform = 'scale(' + k + ')';
    var op = 1;
    if (p > 1 - FW / P) op = 1 - (p - (1 - FW / P)) / (FW / P);
    L.el.style.opacity = op;
    L.el.style.zIndex = (p > 0.5) ? 2 : 1;
    return p;
  }
  function setLamp(m, t){
    var p = ((t + m.off) % m.T) / m.T;
    var e = Math.pow(p, 2.1);
    var x = m.sx + (m.ex - m.sx) * e;
    var y = 0.502 + (1.03 - 0.502) * e;
    var w = m.w0 + (m.w1 - m.w0) * e;
    var op = p < 0.1 ? p / 0.1 : (p > 0.86 ? (1 - p) / 0.14 : 1);
    m.el.style.width = (w * 100) + 'vw';
    m.el.style.height = (w * 100) + 'vw';
    m.el.style.transform = 'translate(' + (x * 100) + 'vw,' + (y * 100) + 'vh) translate(-50%,-50%)';
    m.el.style.opacity = op * 0.9;
  }
  function frame(t){
    layers.forEach(function(L){ setLayer(L, t); });
    LAMPS.forEach(function(m){ setLamp(m, t); });
  }
  function tick(ts){
    if (last === null) last = ts;
    var dt = (ts - last) / 1000; last = ts;
    if (dt > 0.25) dt = 0.25;
    if (living) { simT += dt * pace; frame(simT); }
    requestAnimationFrame(tick);
  }
  frame(0);
  requestAnimationFrame(tick);

  var btnL = document.getElementById('btnLiving');
  var btnS = document.getElementById('btnStill');
  function setMode(live){
    living = live;
    document.body.classList.toggle('still', !live);
    btnL.classList.toggle('on', live);
    btnS.classList.toggle('on', !live);
  }
  btnL.addEventListener('click', function(){ setMode(true); });
  btnS.addEventListener('click', function(){ setMode(false); });

  window.__ride = { t: function(){ return simT; }, living: function(){ return living; } };
})();
</script>
</body>
</html>
