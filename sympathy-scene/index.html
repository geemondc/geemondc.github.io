<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Quiet Garden — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#2c2a20; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.58); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#2c2a20;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 13s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.012) translate(0.25%,0.1%); } to { transform:scale(1.045) translate(-0.6%,-0.4%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* the evening light breathes, very slow */
  #sun { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 11s ease-in-out infinite alternate;
         background:radial-gradient(55% 60% at 88% 22%, rgba(255,205,140,.32), rgba(255,205,140,.08) 55%, rgba(255,205,140,0) 78%); }
  @keyframes breathe { from { opacity:.5 } to { opacity:1 } }
  /* the flowers on the bench hold a soft glow */
  #vase { position:absolute; left:50.7%; top:76%; width:15%; aspect-ratio:1; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,240,210,.40), rgba(255,240,210,0) 72%);
          animation:breathe 8s ease-in-out infinite alternate; }
  /* petals drift down, slowly, the way the painting already shows them */
  .petal { position:absolute; pointer-events:none; opacity:0;
           background:radial-gradient(closest-side, rgba(255,252,246,.9), rgba(255,252,246,0) 75%);
           border-radius:60% 40% 60% 40%; animation:fall linear infinite; }
  @keyframes fall { 0% { transform:translate(0,-4vh) rotate(0deg); opacity:0 } 12% { opacity:.55 } 88% { opacity:.5 } 100% { transform:translate(-2.5vw,104vh) rotate(260deg); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(35,35,25,.55); color:#f2ecd8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(242,236,216,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #sun, #vase, .petal { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="The eight friends standing quietly together in a garden at golden hour">
    </div>
    <div id="sun"></div>
    <div id="vase"></div>
    <div id="fx"></div>
    <div id="caption">THE QUIET GARDEN</div>
  </div>
</div>
<script>
  // The quiet garden (Gary's living standard): the painting stays exactly
  // itself; the evening light breathes slowly and petals drift down.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    for (var k = 0; k < 6; k++){
      var px = 10 + k * 15, sz = (0.85 + (k % 3) * 0.3).toFixed(2);
      html += '<div class="petal" style="left:' + px + '%;top:-4%;width:' + sz + '%;aspect-ratio:1.4;animation-duration:' + (17 + (k % 4) * 3).toFixed(1) + 's;animation-delay:-' + (k * 3.7).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
