<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thanksgiving Table — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#2a1508; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#2a1508;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.09) translate(1.4%,0.8%); } to { transform:scale(1.13) translate(-1.8%,-1.0%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #glow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 7s ease-in-out infinite alternate;
         background:radial-gradient(52% 62% at 50% 46%, rgba(255,196,105,.42), rgba(255,160,70,.12) 55%, rgba(255,150,60,0) 78%); }
  @keyframes breathe { from { opacity:.1 } to { opacity:1 } }
  #winglow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 8.5s ease-in-out infinite alternate-reverse;
         background:radial-gradient(38% 52% at 15% 16%, rgba(255,186,92,.4), rgba(255,160,70,.1) 55%, rgba(255,150,60,0) 78%); }
  .fl { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,216,140,.92), rgba(255,166,64,.34) 55%, rgba(255,140,40,0) 78%);
        animation:flick ease-in-out infinite; }
  .flh { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,190,100,.34), rgba(255,155,60,.1) 55%, rgba(255,140,40,0) 78%);
        animation:flick ease-in-out infinite; }
  .flcore { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,246,205,.95), rgba(255,196,96,.42) 55%, rgba(255,170,70,0) 78%);
        animation:flick ease-in-out infinite reverse; }
  @keyframes flick { 0% { opacity:.36 } 22% { opacity:.96 } 41% { opacity:.52 } 63% { opacity:1 } 82% { opacity:.6 } 100% { opacity:.36 } }
  .wisp { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,0);
          background:radial-gradient(closest-side, rgba(255,251,242,.62), rgba(255,251,242,.22) 55%, rgba(255,251,242,0) 75%);
          filter:blur(2px); animation:rise ease-in infinite; will-change:transform,opacity; }
  @keyframes rise { 0% { transform:translate(-50%,8%) scale(.65); opacity:0 } 22% { opacity:.92 } 55% { transform:translate(-36%,-58%) scale(1.05); opacity:.62 } 100% { transform:translate(-60%,-118%) scale(1.35); opacity:0 } }
  #sheen { position:absolute; left:50%; top:47%; width:27%; aspect-ratio:1.55; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen;
           background:radial-gradient(closest-side, rgba(255,205,120,.5), rgba(255,170,80,.16) 55%, rgba(255,160,70,0) 78%);
           animation:sheenbreathe 5.3s ease-in-out infinite alternate; }
  @keyframes sheenbreathe { from { opacity:.25 } to { opacity:.95 } }
  #leaves { position:absolute; left:1%; top:0; width:26%; height:30%; overflow:hidden; pointer-events:none; }
  .leaf { position:absolute; top:-6%; border-radius:70% 0 70% 0; pointer-events:none; opacity:0;
          animation:leaffall linear infinite; will-change:transform; }
  @keyframes leaffall { 0% { transform:translate(0,-2vh) rotate(0deg); opacity:0 } 10% { opacity:.9 } 50% { transform:translate(1.2vw,15vh) rotate(190deg) } 92% { opacity:.8 } 100% { transform:translate(-0.5vw,31vh) rotate(355deg); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(74,36,16,.58); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #glow, #winglow, .fl, .flh, .flcore, .wisp, .leaf, #sheen { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends around the Thanksgiving table, heads bowed for one quiet second of thanks — the golden turkey steaming at the center, Goggles pouring the gravy, Braids passing the basket of rolls, Phones with his headphones around his neck, Puff and Cap with hands folded, Teal serving the mashed potatoes, Pink lifting a glass of cider, Beanie holding a candle, candles flickering all along the table">
    </div>
    <div id="glow"></div>
    <div id="winglow"></div>
    <div id="fx"></div>
    <div id="leaves"></div>
    <div id="caption">THANKSGIVING TABLE</div>
  </div>
</div>
<script>
  // Thanksgiving Table (Gary's living standard): the painting stays exactly itself; the late-afternoon gold breathes over the table, every candle flame flickers in its own warm glow, steam rises off the turkey and the hot dishes, and a few autumn leaves drift past the windows on the left. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    function flame(x, y, size, dur, delay){
      return '<div class="fl" style="left:' + x + '%;top:' + y + '%;width:' + size + '%;aspect-ratio:0.8;animation-duration:' + dur + 's;animation-delay:-' + delay + 's"></div>';
    }
    function core(x, y, size, dur, delay){
      return '<div class="flcore" style="left:' + x + '%;top:' + y + '%;width:' + size + '%;aspect-ratio:0.85;animation-duration:' + dur + 's;animation-delay:-' + delay + 's"></div>';
    }
    // candle flames — every candle in the painting gets its own flicker (x%, y% of frame)
    var candles = [
      [34.5, 49.0, 3.1],   // glass candle left of the turkey
      [43.5, 44.5, 2.2],   // small votive by the gravy boat
      [65.0, 50.5, 3.4],   // tall pillar right of the turkey
      [34.0, 70.0, 4.0],   // foreground pillar, left
      [34.0, 89.0, 4.4],   // foreground candle in glass, bottom left
      [63.5, 66.0, 2.6],   // votive right of the cornucopia
      [65.0, 82.5, 4.2],   // foreground pillar, bottom center-right
      [90.5, 75.5, 2.8],   // the candle Beanie holds
      [96.5, 10.5, 1.7],   // sideboard pillar, top right
      [94.0, 14.5, 1.5],   // sideboard candle
      [91.0,  3.5, 1.2]    // candelabra flame, top right
    ];
    for (var i = 0; i < candles.length; i++){
      var c = candles[i];
      var dur = (0.85 + (i % 4) * 0.22).toFixed(2), del = (i * 0.31).toFixed(2);
      if (c[2] >= 2.6) html += '<div class="flh" style="left:' + c[0] + '%;top:' + c[1] + '%;width:' + (c[2] * 2.4).toFixed(1) + '%;aspect-ratio:0.9;animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
      html += flame(c[0], c[1], c[2], dur, del);
    }
    // warm sheen breathing over the turkey's golden skin
    html += '<div id="sheen"></div>';
    // hotter cores on the three big foreground flames
    html += core(34.0, 70.0, 1.7, 0.7, 0.2);
    html += core(65.0, 82.5, 1.8, 0.8, 0.5);
    html += core(65.0, 50.5, 1.5, 0.65, 0.9);
    // steam — soft wisps rising off the hot dishes, the traveling element
    function wisp(x, y, w, dur, delay){
      return '<div class="wisp" style="left:' + x + '%;top:' + y + '%;width:' + w + '%;aspect-ratio:0.68;animation-duration:' + dur + 's;animation-delay:-' + delay + 's"></div>';
    }
    var wi = 0;
    function steam(cx, baseY, w, n, spread){
      for (var k = 0; k < n; k++){
        var x = cx + ((k % 3) - 1) * spread + (k % 2) * 1.2;
        html += wisp(x.toFixed(1), baseY, w, (4.6 + (wi % 4) * 0.8).toFixed(1), (wi * 1.13).toFixed(2));
        wi++;
      }
    }
    steam(49.5, 41.0, 13.0, 9, 2.6);  // the turkey, center stage
    steam(23.5, 49.0, 9.0, 5, 1.8);   // mashed potatoes
    steam(69.0, 57.0, 7.0, 4, 1.6);   // the stuffing dish
    steam(28.0, 58.0, 6.0, 3, 1.4);   // green beans
    steam(71.5, 64.0, 6.5, 3, 1.5);   // the cornbread
    host.innerHTML = html;
    // autumn leaves drifting past the windows on the left
    var leaves = document.getElementById('leaves'), lhtml = '';
    var lcols = ['#e07b2a', '#c94f1e', '#e8a33d', '#a83c14', '#d4691f'];
    for (var f = 0; f < 12; f++){
      var lx = (4 + (f * 29) % 88), sz = (4.6 + (f % 3) * 1.5).toFixed(1), dur = (6.5 + (f % 5) * 1.1).toFixed(1), del = (f * 1.37).toFixed(2);
      lhtml += '<div class="leaf" style="left:' + lx + '%;width:' + sz + '%;aspect-ratio:1;background:' + lcols[f % lcols.length] + ';animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
    }
    leaves.innerHTML = lhtml;
  })();
</script>
</body>
</html>
