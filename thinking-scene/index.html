<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Golden Garden — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#33270f; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.6); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#33270f;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 11s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* golden-hour light breathing over the garden */
  #sun { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite alternate;
         background:radial-gradient(55% 60% at 90% 20%, rgba(255,214,150,.36), rgba(255,214,150,.09) 55%, rgba(255,214,150,0) 78%); }
  @keyframes breathe { from { opacity:.55 } to { opacity:1 } }
  /* petals drift through the warm light */
  .petal { position:absolute; pointer-events:none; opacity:0;
           background:radial-gradient(closest-side, rgba(255,250,238,.92), rgba(255,250,238,0) 75%);
           border-radius:60% 40% 60% 40%; animation:fall linear infinite; }
  @keyframes fall { 0% { transform:translate(0,-4vh) rotate(0deg); opacity:0 } 12% { opacity:.6 } 88% { opacity:.55 } 100% { transform:translate(-2.5vw,104vh) rotate(280deg); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(51,36,12,.55); color:#ffedb5; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,237,181,.35); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #sun, .petal { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="The eight friends leaning in together, smiling, in a golden garden">
    </div>
    <div id="sun"></div>
    <div id="fx"></div>
    <div id="caption">THE GOLDEN GARDEN</div>
  </div>
</div>
<script>
  // The golden garden (Gary's living standard): the painting stays exactly
  // itself; the golden light breathes and petals drift through it.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    for (var k = 0; k < 6; k++){
      var px = 8 + k * 16, sz = (0.85 + (k % 3) * 0.3).toFixed(2);
      html += '<div class="petal" style="left:' + px + '%;top:-4%;width:' + sz + '%;aspect-ratio:1.4;animation-duration:' + (14 + (k % 4) * 3).toFixed(1) + 's;animation-delay:-' + (k * 3.1).toFixed(1) + 's"></div>';
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
