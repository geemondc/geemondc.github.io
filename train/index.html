(function(){
  "use strict";
  
  if (/(^|[#&])(wall|embed)/.test(location.hash || '')) document.documentElement.classList.add('lp-embed');
  var ES = {'ignite':'\u2726 Dale vida','btnStill':'Still','fsStill':'Still','lpStill':'Still','lpFsStill':'Still','btnLiving':'Living','fsLiving':'Living','lpLiving':'Living','lpFsLiving':'Living'};

  var lang = 'en';
  function swap(id, toEs){
    var el = document.getElementById(id); if (!el) return;
    if (el.dataset.lpOrig === undefined) el.dataset.lpOrig = el.textContent;
    var orig = el.dataset.lpOrig;
    el.textContent = toEs ? (ESVAL[orig] || orig) : orig;
  }
  function setLang(l){
    lang = l;
    document.querySelectorAll('[data-lp-en]').forEach(function(el){ el.textContent = (l === 'es') ? el.dataset.lpEs : el.dataset.lpEn; });
    ['ignite','btnStill','btnLiving','fsStill','fsLiving','lpStill','lpLiving','lpFsStill','lpFsLiving'].forEach(function(id){ swap(id, l === 'es'); });
    document.getElementById('lpLang').textContent = (l === 'es') ? 'English' : 'Espa\u00f1ol';
  }
  document.getElementById('lpLang').addEventListener('click', function(){ setLang(lang === 'en' ? 'es' : 'en'); });
  var dk = document.getElementById('lpDark');

    var light = document.documentElement.classList.toggle('lp-light');
    dk.setAttribute('aria-pressed', light ? 'false' : 'true');

})();

<script>
(function () {
  "use strict";

  // Window glass rectangle in the seat painting (fractions of 1536x1024)
  var WIN = { x: 403 / 1536, y: 64 / 1024, w: 881 / 1536, h: 475 / 1024 };
  var CUP = { x: 806 / 1536, y: 622 / 1024 };
  var STRIP_W = 6000;
  var STRIP_H = 600;
  var SEG_W = 1200;
  var NSEG = 5;
  var sx = function (seg, ox) { return seg * 1200 - 300 + (ox * 1500) / 1920; };
  var syy = function (oy) { return (oy * 600) / 768; };
  // Glowing lights painted into the strip (strip coords), they flicker as they pass
  var LIGHTS = [
    [sx(1, 560), syy(535), 10], [sx(1, 900), syy(540), 10], [sx(1, 1080), syy(560), 12], [sx(1, 1150), syy(545), 9], [sx(1, 1380), syy(600), 9],
    [sx(3, 1255), syy(465), 10], [sx(3, 1530), syy(455), 9], [sx(3, 1690), syy(445), 11], [sx(3, 830), syy(462), 8],
    [sx(4, 85), syy(215), 30], [sx(4, 388), syy(350), 20], [sx(4, 474), syy(355), 18], [sx(4, 785), syy(420), 12], [sx(4, 1770), syy(270), 28], [sx(4, 1300), syy(440), 14]
  ];
  var STATION_START = 4600, STATION_END = 5750;

  // Painted-tone fallback per segment (top / horizon / ground, sampled from the strip):
  // an unloaded region is never blank — it shows the segment's own sky-to-ground tones.
  var FALLBACK = [
    ["#c7ccca", "#b0aaa1", "#626731"],
    ["#b1a694", "#c48b4b", "#54411c"],
    ["#bd9b76", "#a36e39", "#9f5f17"],
    ["#6a4a6b", "#693d2b", "#78443d"],
    ["#1f2f52", "#3f5069", "#2a2621"]
  ];

  var frame = document.getElementById("frame");
  var world = document.getElementById("world");
  var steam = document.getElementById("steam");
  var wc = world.getContext("2d");
  var sc = steam.getContext("2d");

  var living = true;
  var speed = 1;        // speedRef in the source
  var curSpeed = 1;     // shared with the audio engine, as in the source

  // ---- journey segments: seg0 first, the rest stream in order ----
  var segs = [];
  for (var i = 0; i < NSEG; i++) segs.push({ img: null, loaded: false });
  function loadSeg(i) {
    if (i >= NSEG) return;
    var img = new Image();
    img.onload = function () {
      segs[i].img = img; segs[i].loaded = true;
      loadSeg(i + 1);
    };
    img.onerror = function () { loadSeg(i + 1); };
    img.src = "seg" + i + ".jpg";
  }
  loadSeg(0);

  function paintFallback(segI, dx, dw, H) {
    var stops = FALLBACK[segI];
    if (!stops) return;
    var g = wc.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, stops[0]);
    g.addColorStop(0.55, stops[1]);
    g.addColorStop(1, stops[2]);
    wc.fillStyle = g;
    wc.fillRect(dx, 0, dw + 1, H);
  }

  function drawSpan(sx0, sw, dx, k, H) {
    var cur = sx0, rem = sw, dcur = dx;
    while (rem > 0) {
      var segi = Math.floor(cur / SEG_W);
      if (segi >= NSEG) segi = NSEG - 1;
      if (segi < 0) segi = 0;
      var segEnd = (segi + 1) * SEG_W;
      var take = Math.min(rem, segEnd - cur);
      var inSeg = cur - segi * SEG_W;
      var dwTake = take * k;
      var s = segs[segi];
      if (s && s.loaded) {
        wc.drawImage(s.img, inSeg, 0, take, STRIP_H, dcur, 0, dwTake, H);
      } else {
        paintFallback(segi, dcur, dwTake, H);
      }
      cur += take; rem -= take; dcur += dwTake;
    }
  }

  // ---- sizing (DPR capped at 2, as the source) ----
  function resize() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    [world, steam].forEach(function (c) {
      var r = c.getBoundingClientRect();
      c.width = Math.max(1, Math.round(r.width * d));
      c.height = Math.max(1, Math.round(r.height * d));
    });
  }
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(frame);
  window.addEventListener("resize", resize);

  var wisps = [];
  var raf = 0, last = performance.now(), far = 0, t = 0;

  function loop(now) {
    var dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now; t += dt;
    var target = living ? 1 : 0;
    speed += (target - speed) * Math.min(1, dt * 0.6);
    var v = speed;
    curSpeed = v;
    far = (far + 22 * v * dt) % STRIP_W; // strip px / sec (far country)

    // ---- world ----
    var W = world.width, H = world.height;
    var k = H / STRIP_H;
    var vw = W / k;
    var x = far, dx = 0;
    while (dx < W) {
      var sw = Math.min(STRIP_W - x, vw - dx / k);
      if (sw <= 0) break;
      drawSpan(x, sw, dx, k, H);
      dx += sw * k; x = 0;
    }
    // flickering lights
    wc.globalCompositeOperation = "lighter";
    for (var li = 0; li < LIGHTS.length; li++) {
      var lx = LIGHTS[li][0], ly = LIGHTS[li][1], r = LIGHTS[li][2];
      for (var oi = 0; oi < 2; oi++) {
        var off = oi * STRIP_W;
        var px = (lx + off - far) * k;
        if (px < -60 || px > W + 60) continue;
        var f = 0.55 + 0.25 * Math.sin(t * 3.1 + lx) + 0.15 * Math.sin(t * 7.3 + ly * 2);
        var g = wc.createRadialGradient(px, ly * k, 0, px, ly * k, r * k * 2.2);
        g.addColorStop(0, "rgba(255,200,120," + (0.45 * f) + ")");
        g.addColorStop(1, "rgba(255,170,80,0)");
        wc.fillStyle = g;
        wc.fillRect(px - r * k * 2.2, ly * k - r * k * 2.2, r * k * 4.4, r * k * 4.4);
      }
    }
    wc.globalCompositeOperation = "source-over";

    // ---- near layer: faster parallax ----
    var nearOff = far * 4.2 * k; // screen px
    var centerStrip = (far + W / k / 2) % STRIP_W;
    var night = centerStrip > 4300 || centerStrip < 150;
    var dusk = centerStrip > 3300 && !night;
    var ink = night ? "rgba(10,12,25,0.92)" : dusk ? "rgba(35,20,30,0.85)" : "rgba(45,35,25,0.8)";
    // station platform edge
    function stIn(xx) {
      var s = (far + xx / k) % STRIP_W;
      return s > STATION_START && s < STATION_END;
    }
    // fence posts & poles
    var postGap = 70 * k * 1.6, poleGap = 520 * k;
    var poleTop = H * 0.08, wireY = H * 0.12;
    wc.strokeStyle = ink;
    for (var fx = -(nearOff % postGap); fx < W + postGap; fx += postGap) {
      if (stIn(fx)) continue;
      wc.fillStyle = ink;
      wc.fillRect(fx, H * 0.86, 7 * k, H * 0.14);
    }
    if (!stIn(W / 2)) {
      wc.lineWidth = 3 * k; wc.beginPath();
      wc.moveTo(0, H * 0.89); wc.lineTo(W, H * 0.89);
      wc.moveTo(0, H * 0.94); wc.lineTo(W, H * 0.94); wc.stroke();
    }
    var pOff = nearOff * 1.15;
    var poles = [];
    for (var pxx = -(pOff % poleGap); pxx < W + poleGap; pxx += poleGap) poles.push(pxx);
    wc.lineWidth = 1.5 * k;
    for (var pi = 0; pi < poles.length - 1; pi++) {
      var yyList = [wireY, wireY + 14 * k];
      for (var yi = 0; yi < yyList.length; yi++) {
        var yy = yyList[yi];
        wc.beginPath(); wc.moveTo(poles[pi], yy);
        wc.quadraticCurveTo((poles[pi] + poles[pi + 1]) / 2, yy + 26 * k, poles[pi + 1], yy); wc.stroke();
      }
    }
    wc.fillStyle = ink;
    for (var pj = 0; pj < poles.length; pj++) {
      var x2 = poles[pj];
      wc.fillRect(x2 - 5 * k, poleTop, 10 * k, H);
      wc.fillRect(x2 - 28 * k, wireY - 4 * k, 56 * k, 6 * k);
    }
    // platform
    for (var plx = 0; plx < W; plx += 4) {
      if (!stIn(plx)) continue;
      wc.fillStyle = "rgba(230,215,170,0.85)";
      wc.fillRect(plx, H * 0.84, 4, 5 * k);
    }
    // window glass sheen & vignette
    var gl = wc.createLinearGradient(0, 0, W, H);
    gl.addColorStop(0, "rgba(255,240,210,0.08)"); gl.addColorStop(0.5, "rgba(255,255,255,0)"); gl.addColorStop(1, "rgba(40,20,10,0.18)");
    wc.fillStyle = gl; wc.fillRect(0, 0, W, H);

    // ---- steam (runs regardless of living state, as in the source) ----
    var SW = steam.width, SH = steam.height;
    sc.clearRect(0, 0, SW, SH);
    if (Math.random() < dt * 9) wisps.push({ x: 0, y: 0, age: 0, seed: Math.random() * 100 });
    var unit = SW / 1536;
    var cx = CUP.x * SW, cy = CUP.y * SH;
    for (var wi = wisps.length - 1; wi >= 0; wi--) {
      var w = wisps[wi];
      w.age += dt;
      if (w.age > 4.5) { wisps.splice(wi, 1); continue; }
      var rise = w.age * 22 * unit;
      var wpx = cx + Math.sin(w.age * 1.6 + w.seed) * (6 + w.age * 6) * unit - w.age * 3 * unit * v;
      var wpy = cy - rise;
      var a = Math.sin((w.age / 4.5) * Math.PI) * 0.16;
      var wr = (6 + w.age * 7) * unit;
      var wg = sc.createRadialGradient(wpx, wpy, 0, wpx, wpy, wr);
      wg.addColorStop(0, "rgba(255,245,230," + a + ")"); wg.addColorStop(1, "rgba(255,245,230,0)");
      sc.fillStyle = wg; sc.fillRect(wpx - wr, wpy - wr, wr * 2, wr * 2);
    }
    // lamp breathing glow
    var lg = sc.createRadialGradient(235 * unit, 120 * unit, 0, 235 * unit, 120 * unit, 260 * unit);
    lg.addColorStop(0, "rgba(255,200,120," + (0.1 + 0.03 * Math.sin(t * 2.3)) + ")"); lg.addColorStop(1, "rgba(255,200,120,0)");
    sc.fillStyle = lg; sc.fillRect(0, 0, 600 * unit, 500 * unit);

    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  // pause work while the tab is hidden
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      cancelAnimationFrame(raf); raf = 0;
    } else if (!raf) {
      last = performance.now();
      raf = requestAnimationFrame(loop);
    }
  });

  // ---- procedural sound (off by default) ----
  var audio = null;
  function startAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC();
    var master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 2);
    var noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    var b = 0; for (var i = 0; i < d.length; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; }
    var hum = ctx.createBufferSource(); hum.buffer = noiseBuf; hum.loop = true;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 180;
    var hg = ctx.createGain(); hg.gain.value = 0.35;
    hum.connect(lp); lp.connect(hg); hg.connect(master); hum.start();
    var osc = ctx.createOscillator(); osc.frequency.value = 55;
    var og = ctx.createGain(); og.gain.value = 0.03;
    osc.connect(og); og.connect(master); osc.start();
    function clack(time, vol) {
      var s = ctx.createBufferSource(); s.buffer = noiseBuf;
      var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 2;
      var g = ctx.createGain(); g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(vol, time + 0.005); g.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
      s.connect(bp); bp.connect(g); g.connect(master); s.start(time, Math.random()); s.stop(time + 0.15);
    }
    var next = ctx.currentTime + 0.5;
    var iv = setInterval(function () {
      var v = curSpeed;
      hg.gain.value = 0.1 + 0.3 * v;
      while (next < ctx.currentTime + 0.3) {
        if (v > 0.05) {
          var vol = 0.25 * v;
          clack(next, vol); clack(next + 0.13 / Math.pow(v, 0.5), vol * 0.8);
          clack(next + 0.62 / Math.pow(v, 0.5), vol * 0.9); clack(next + 0.75 / Math.pow(v, 0.5), vol * 0.7);
        }
        next += 1.6 / Math.max(0.35, v);
      }
    }, 100);
    return { ctx: ctx, iv: iv };
  }
  function stopAudio() {
    if (!audio) return;
    clearInterval(audio.iv);
    audio.ctx.close();
    audio = null;
  }

  // ---- controls ----
  var btnStill = document.getElementById("btnStill");
  var btnLiving = document.getElementById("btnLiving");
  var btnSound = document.getElementById("btnSound");
  function setLiving(val) {
    living = val;
    btnStill.classList.toggle("active", !val);
    btnLiving.classList.toggle("active", val);
  }
  btnStill.addEventListener("click", function () { setLiving(false); });
  btnLiving.addEventListener("click", function () { setLiving(true); });
  btnSound.addEventListener("click", function () {
    if (audio) { stopAudio(); btnSound.textContent = "SOUND OFF"; }
    else { audio = startAudio(); btnSound.textContent = "SOUND ON"; }
  });
  document.getElementById("controls").addEventListener("click", function (e) { e.stopPropagation(); });
  document.getElementById("stage").addEventListener("click", function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  });
})();
</script>

<script>
/* Wall mode: embedded in the Living Photos wall via #wall, this page's own title/controls stay hidden — the scene and its interactions stay live. */
if (location.hash === '#wall') {
  var lpWallStyle = document.createElement('style');
  lpWallStyle.textContent = '#controls{display:none !important}';
  document.head.appendChild(lpWallStyle);
}
</script>
<div id="lpFsBar"><button id="lpFsStill" type="button">Still</button><button id="lpFsLiving" type="button" class="on">Living</button><button id="lpFsClose" type="button" class="x" aria-label="Close">&times;</button></div>
<script id="lp-nativefs-js">
(function(){
  "use strict";

  var bs = document.getElementById('btnStill'), bl = document.getElementById('btnLiving');
  function isLiving(){ return bl && (bl.classList.contains('on') || bl.classList.contains('active')); }
  function setStill(){ if (bs) bs.click(); sync(); }
  function setLiving(){ if (bl) bl.click(); sync(); }
  var b = document.getElementById('lpFsStill'), c = document.getElementById('lpFsLiving'), x = document.getElementById('lpFsClose');
  function sync(){ if (b && c){ var lv = isLiving(); b.classList.toggle('on', !lv); c.classList.toggle('on', lv); } }
  if (b) b.addEventListener('click', function(e){ e.stopPropagation(); setStill(); });
  if (c) c.addEventListener('click', function(e){ e.stopPropagation(); setLiving(); });
  if (x) x.addEventListener('click', function(e){ e.stopPropagation(); if (document.fullscreenElement) document.exitFullscreen(); });
  document.addEventListener('fullscreenchange', function(){ setTimeout(sync, 30); });
  sync();
})();
</script>
