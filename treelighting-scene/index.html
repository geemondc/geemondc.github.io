<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Tree Lighting — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#062417; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.55); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#062417;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.02) translate(0.4%,0.2%); } to { transform:scale(1.10) translate(-1.1%,-0.6%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #glow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:breathe 7s ease-in-out infinite alternate;
         background:radial-gradient(46% 60% at 50% 30%, rgba(255,214,130,.42), rgba(255,180,90,.12) 55%, rgba(255,170,80,0) 78%); }
  @keyframes breathe { from { opacity:.32 } to { opacity:1 } }
  .tlb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%); opacity:0;
        animation:twk ease-in-out infinite alternate, tlBloomIn 1.1s ease forwards; }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.55); filter:brightness(.65) } to { transform:translate(-50%,-50%) scale(1.5); filter:brightness(1.4) } }
  @keyframes tlBloomIn { from { opacity:0 } to { opacity:1 } }
  #starGlow { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%); opacity:0;
        background:radial-gradient(closest-side, rgba(255,230,150,.95), rgba(255,196,80,.4) 55%, rgba(255,180,80,0) 78%);
        animation:tlStarBloom 4.6s ease forwards, tlStarPulse 3.4s ease-in-out 4.6s infinite alternate; }
  @keyframes tlStarBloom { 0% { opacity:0; transform:translate(-50%,-50%) scale(.55) } 78% { opacity:0; transform:translate(-50%,-50%) scale(.55) } 90% { opacity:1; transform:translate(-50%,-50%) scale(1.28) } 100% { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } }
  @keyframes tlStarPulse { from { opacity:.85; transform:translate(-50%,-50%) scale(1.02) } to { opacity:1; transform:translate(-50%,-50%) scale(1.24) } }
  .lamp { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,196,96,.75), rgba(255,160,60,.28) 55%, rgba(255,150,50,0) 78%);
        animation:tlLampPulse 4.2s ease-in-out infinite alternate; }
  @keyframes tlLampPulse { from { opacity:.5; transform:translate(-50%,-50%) scale(.94) } to { opacity:.85; transform:translate(-50%,-50%) scale(1.06) } }
  .steam { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
        background:radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
        animation:steamUp 3.6s ease-in-out infinite; }
  @keyframes steamUp { 0% { transform:translate(-50%,0) scale(.5); opacity:0 } 30% { opacity:.55 } 100% { transform:translate(-38%,-46px) scale(1.5); opacity:0 } }
  #snow { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .flake { position:absolute; top:-4%; border-radius:50%; pointer-events:none;
           background:radial-gradient(closest-side, rgba(255,255,255,.98), rgba(235,245,255,.55) 60%, rgba(235,245,255,0) 80%);
           animation:tlFall linear infinite; will-change:transform; }
  @keyframes tlFall { 0% { transform:translate(0,-4vh); opacity:0 } 6% { opacity:1 } 50% { transform:translate(1.2vw,52vh) } 94% { opacity:1 } 100% { transform:translate(-0.8vw,106vh); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(6,42,22,.58); color:#ffe9a8; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,215,130,.45); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #glow, .tlb, #starGlow, .lamp, .steam, .flake { animation:none; } .tlb, #starGlow { opacity:1; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends in a snowy village square at blue dusk, cocoa mugs in hand, gathered before a giant Christmas tree hung with ornaments and topped with a gold star — the moment just before the lights come on; lampposts glowing at both sides, the church steeple behind, snow falling">
    </div>
    <div id="glow"></div>
    <div id="fx"></div>
    <div id="snow"></div>
    <div id="caption">THE TREE LIGHTING</div>
  </div>
</div>
<script>
  // The Tree Lighting (Gary's living standard): the painting stays exactly itself; the tree arrives UNLIT, then its lights bloom in over the first few seconds — bottom tier first, spiraling up tier by tier — the star glow crowns it last and then breathes; the lampposts glow warm at both sides, steam rises off the cocoa mugs, and snow falls across the whole square. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var embedded = document.body.classList.contains('wall');
    var host = document.getElementById('fx'), html = '', bloomHtml = '';
    var palette = ['255,209,102', '255,89,100', '126,217,87', '255,243,196', '255,166,66'];
    function light(x, y, ci, size, dur, phase, bloom){
      var c = palette[ci % palette.length];
      return '<div class="tlb" style="left:' + x + '%;top:' + y + '%;width:' + size + '%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(' + c + ',.98), rgba(' + c + ',.34) 55%, rgba(' + c + ',0) 78%);animation-duration:' + dur + 's,1.1s;animation-delay:-' + phase + 's,' + bloom + 's"></div>';
    }
    // tree lights — tiers over the tree (apex x~50%, widening to x 33-66% at the base, y 3-62%); bloom delay rises tier by tier, bottom first, spiraling up
    var tiers = [
      { d: 0.30, pts: [[36,59],[43,60],[50,59],[57,60],[64,59]] },
      { d: 0.90, pts: [[37,51],[44,52],[51,51],[58,52],[63,51]] },
      { d: 1.50, pts: [[39,43],[46,44],[53,43],[60,44]] },
      { d: 2.10, pts: [[41,35],[48,36],[55,35],[61,36]] },
      { d: 2.70, pts: [[43,27],[50,28],[57,27]] },
      { d: 3.30, pts: [[45,19],[52,20],[56,19]] },
      { d: 3.80, pts: [[47,11],[53,12]] }
    ];
    var n = 0;
    for (var t = 0; t < tiers.length; t++){
      for (var i = 0; i < tiers[t].pts.length; i++){
        var p = tiers[t].pts[i];
        bloomHtml += light(p[0], p[1], n, (0.55 + (n % 3) * 0.18).toFixed(2), (1.5 + (n % 5) * 0.35).toFixed(2), (n * 0.37).toFixed(2), (tiers[t].d + i * 0.06).toFixed(2));
        n++;
      }
    }
    // the star on top of the tree — blooms in last, then breathes
    bloomHtml += '<div id="starGlow" style="left:50%;top:3%;width:5%;aspect-ratio:1"></div>';
    // lamppost glows, warm at both sides of the square
    html += '<div class="lamp" style="left:3%;top:30%;width:7%;aspect-ratio:1"></div>';
    html += '<div class="lamp" style="left:96%;top:35%;width:7%;aspect-ratio:1;animation-delay:-2.1s"></div>';
    // steam rising off the cocoa mugs along the friends' row
    var mugs = [[19,67],[27.5,67],[36,67],[45,67],[58,67],[66,67],[75,67],[85,67]];
    for (var m = 0; m < mugs.length; m++){
      html += '<div class="steam" style="left:' + mugs[m][0] + '%;top:' + mugs[m][1] + '%;width:1.6%;aspect-ratio:1.6;animation-delay:-' + (m * 0.45).toFixed(2) + 's"></div>';
    }
    host.innerHTML = html;
    /* BLOOM GATE (Nov 22 fix): inside the card engine this page is loaded with
       the sealed envelope, so a bloom clock started at load ran out before the
       card was ever revealed. In an embed (#wall) the bulbs + star are held
       back until the parent says the card has landed ('lc-bloom'); the parent
       arms the gate with 'lc-arm' once it hears our 'lc-scene-ready'. A
       standalone visit blooms at once, exactly as before. Fallbacks: an
       unarmed embed blooms at 7s (theater-style embeds with no parent hook);
       an armed embed blooms at 120s at the latest — and a late 'lc-bloom'
       restarts the bloom visibly in any case. All bloom timings are the
       original ones; only the start signal changed. */
    var bloomBox = document.createElement('div');
    host.appendChild(bloomBox);
    var bloomed = false, armed = false;
    function goBloom(){ bloomBox.innerHTML = bloomHtml; bloomed = true; }
    if (!embedded){ goBloom(); }
    else {
      window.addEventListener('message', function(e){
        if (e.data === 'lc-arm') armed = true;
        else if (e.data === 'lc-bloom') goBloom();
      });
      setTimeout(function(){ if (!bloomed && !armed) goBloom(); }, 7000);
      setTimeout(function(){ if (!bloomed) goBloom(); }, 120000);
      if (window.parent !== window){
        try { window.parent.postMessage('lc-scene-ready', '*'); } catch(e){}
        var readyN = 0;
        var readyTimer = setInterval(function(){
          if (armed || bloomed || ++readyN > 6){ clearInterval(readyTimer); return; }
          try { window.parent.postMessage('lc-scene-ready', '*'); } catch(e){}
        }, 800);
      }
    }
    // snow falling across the whole square — real travel, top to bottom
    var snow = document.getElementById('snow'), shtml = '';
    for (var f = 0; f < 34; f++){
      var lx = (1 + (f * 29) % 97), sz = (2.2 + (f % 4) * 1.1).toFixed(1), dur = (7 + (f % 6) * 1.1).toFixed(1), del = (f * 0.83).toFixed(2);
      shtml += '<div class="flake" style="left:' + lx + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
    }
    snow.innerHTML = shtml;
  })();
</script>
</body>
</html>
