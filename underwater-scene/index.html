<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Underwater — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#04263d; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.5); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#04263d;
           box-shadow:0 18px 60px rgba(0,0,0,.5); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:drift 13s ease-in-out infinite alternate; will-change:transform; }
  @keyframes drift { from { transform:scale(1.015) translate(0.3%,0.15%); } to { transform:scale(1.055) translate(-0.8%,-0.5%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .glow { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity:.45 } to { opacity:1 } }
  .twk { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(200,220,255,.30) 55%, rgba(200,220,255,0) 78%);
          animation:twk ease-in-out infinite alternate; }
  @keyframes twk { from { transform:translate(-50%,-50%) scale(.8); filter:brightness(.75) } to { transform:translate(-50%,-50%) scale(1.2); filter:brightness(1.35) } }
  .pulse { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; animation:pl 2.6s ease-in-out infinite; }
  @keyframes pl { 0%,100% { opacity:.25; transform:translate(-50%,-50%) scale(.85) } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.15) } }
  .bubble { position:absolute; border-radius:50%; pointer-events:none; opacity:0;
          background:radial-gradient(closest-side, rgba(255,255,255,.75), rgba(180,230,255,.18) 60%, rgba(180,230,255,0) 80%);
          animation:rise linear infinite; }
  @keyframes rise { 0% { transform:translateY(0); opacity:0 } 12% { opacity:.55 } 88% { opacity:.4 } 100% { transform:translateY(-34vh); opacity:0 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(6,10,24,.55); color:#eaf2ff; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(77,227,255,.4); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, .glow, .twk, .pulse, .bubble { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="Sun rays falling through blue water over a reef, with dolphins and a shark">
    </div>
    <div id="fx"></div>
    <div id="caption">UNDERWATER</div>
  </div>
</div>
<script>
  // Under the surface: the sun columns breathe slow and bubbles rise through the blue. The painting stays exactly itself. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    html += '<div class="glow" style="left:38%;top:4%;width:30%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(255,240,200,0.2), rgba(255,240,200,0) 72%);animation-duration:10s"></div>';
    html += '<div class="glow" style="left:63%;top:8%;width:20%;aspect-ratio:1;background:radial-gradient(closest-side, rgba(200,240,255,0.14), rgba(200,240,255,0) 72%);animation-duration:12s"></div>';
    for (var b = 0; b < 14; b++){
      var bx = 12 + (b * 6.1) % 76, bs = (0.5 + (b % 3) * 0.3).toFixed(2), by = 62 + (b % 4) * 9;
      html += '<div class="bubble" style="left:' + bx.toFixed(1) + '%;top:' + by + '%;width:' + bs + '%;aspect-ratio:1;animation-duration:' + (9 + (b % 5) * 2.4).toFixed(1) + 's;animation-delay:-' + (b * 1.7).toFixed(1) + 's"></div>';
    }

    host.innerHTML = html;
  })();
</script>
</body>
</html>
