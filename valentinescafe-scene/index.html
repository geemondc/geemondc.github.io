<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Valentine's Café — a living card scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#2a0817; }
  body { font-family: Georgia, 'Times New Roman', serif; }
  #fill { position:fixed; inset:0; background:url('still.jpg') center/cover no-repeat; filter:blur(26px) brightness(.5); transform:scale(1.18); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; aspect-ratio:16/9; width:100%; max-height:100%; overflow:hidden; background:#2a0817;
           box-shadow:0 18px 60px rgba(0,0,0,.55); }
  @media (min-aspect-ratio: 16/9) { #frame { width:auto; height:100%; } }
  #drift { position:absolute; inset:0; animation:vxDrift 9s ease-in-out infinite alternate; will-change:transform; }
  @keyframes vxDrift { from { transform:scale(1.06) translate(1.0%,0.6%); } to { transform:scale(1.10) translate(-1.4%,-0.8%); } }
  #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* the dusk outside the windows slowly deepening, plum toward deep blue */
  #dusk { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; animation:vxDusk 18s ease-in-out infinite alternate;
        background:radial-gradient(95% 58% at 82% 6%, rgba(38,22,92,.62), rgba(34,20,80,.22) 55%, rgba(34,20,80,0) 78%); }
  @keyframes vxDusk { from { opacity:.18 } to { opacity:.85 } }
  /* the warm candlelight breathing over the table */
  #tableglow { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; animation:vxBreathe 6s ease-in-out infinite alternate;
        background:radial-gradient(52% 40% at 50% 92%, rgba(255,170,90,.20), rgba(255,140,70,.06) 55%, rgba(255,140,70,0) 78%); }
  @keyframes vxBreathe { from { opacity:.3 } to { opacity:1 } }
  /* string-light bulbs — warm dots pulsing along the strings */
  .bulb { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,232,170,.95), rgba(255,190,90,.32) 55%, rgba(255,180,80,0) 78%);
        animation:vxBulb ease-in-out infinite alternate; }
  @keyframes vxBulb { from { opacity:.45; transform:translate(-50%,-50%) scale(.85) } to { opacity:1; transform:translate(-50%,-50%) scale(1.12) } }
  /* candle flames — the thanksgiving pattern, warm gold */
  .fl { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,216,140,.92), rgba(255,166,64,.34) 55%, rgba(255,140,40,0) 78%);
        animation:vxFlick ease-in-out infinite; }
  .flh { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,190,100,.34), rgba(255,155,60,.1) 55%, rgba(255,140,40,0) 78%);
        animation:vxFlick ease-in-out infinite; }
  .flcore { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; transform:translate(-50%,-50%);
        background:radial-gradient(closest-side, rgba(255,246,205,.95), rgba(255,196,96,.42) 55%, rgba(255,170,70,0) 78%);
        animation:vxFlick ease-in-out infinite reverse; }
  @keyframes vxFlick { 0% { opacity:.36 } 22% { opacity:.96 } 41% { opacity:.52 } 63% { opacity:1 } 82% { opacity:.6 } 100% { opacity:.36 } }
  /* steam curling up off the cocoa — the traveling element */
  .steam { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; opacity:0; transform:translate(-50%,0);
        background:radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,.12) 55%, rgba(255,255,255,0) 78%);
        animation:vxSteam ease-in-out infinite; will-change:transform,opacity; }
  @keyframes vxSteam { 0% { transform:translate(-50%,0) scale(.55); opacity:0 } 30% { opacity:.5 } 100% { transform:translate(-38%,-7.5vh) scale(1.3); opacity:0 } }
  /* the heart balloon's sheen, swaying a breath to each side */
  #sheen { position:absolute; left:72%; top:9%; width:15%; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen;
        background:radial-gradient(closest-side, rgba(255,210,220,.5), rgba(255,160,180,.12) 55%, rgba(255,160,180,0) 78%);
        animation:vxSway 5s ease-in-out infinite alternate; }
  @keyframes vxSway { from { transform:translate(-53%,-50%); opacity:.3 } to { transform:translate(-47%,-50%); opacity:.55 } }
  #caption { position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%); white-space:nowrap; z-index:5;
             background:rgba(60,8,24,.55); color:#ffd9e6; font-size:clamp(11px, 2.9vw, 15px); letter-spacing:2.5px;
             padding:7px 16px; border-radius:999px; border:1px solid rgba(255,150,180,.5); pointer-events:none; }
  body.wall #caption { display:none; }
  @media (prefers-reduced-motion: reduce) { #drift, #dusk, #tableglow, .bulb, .fl, .flh, .flcore, .steam, #sheen { animation:none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="wrap">
  <div id="frame">
    <div id="drift">
      <img id="still" src="still.jpg" alt="All eight friends around a café table on Valentine's evening, raising heart mugs of cocoa in a toast to the viewer — red roses and heart-shaped cookies on the table, two candles glowing in glass holders, a big red heart balloon overhead, string lights and paper hearts above, the city at dusk through the tall windows and a cat asleep on the windowsill">
    </div>
    <div id="dusk"></div>
    <div id="tableglow"></div>
    <div id="sheen"></div>
    <div id="fx"></div>
    <div id="caption">VALENTINE'S CAFÉ</div>
  </div>
</div>
<script>
  // Valentine's Café (Gary's living standard): the painting stays exactly itself; the candles flicker on the table, the string lights twinkle, steam curls up off every cocoa, the heart balloon's sheen sways, and the dusk outside the windows deepens plum toward blue. Card pace: faster than the photo. In #wall the caption hides.
  (function(){
    if (/(^|[#&])wall(?:nb)?([&#]|$)/.test(location.hash || '')) document.body.classList.add('wall');
    var host = document.getElementById('fx'), html = '';
    // string lights — along the top strings, down the left lamps, and the window lights at right
    var bulbs = [[4,4.5,1.1],[11,3,1.0],[37,3.5,1.1],[50,2.5,1.0],[56,8.5,0.9],[61,3,1.0],
                 [1.6,32,1.2],[2.2,44.5,1.1],
                 [86,26,0.7],[90,24,0.7],[94,22,0.7],[97.5,20,0.7],[83,29,0.6],[92,27,0.6]];
    for (var bu = 0; bu < bulbs.length; bu++) {
      html += '<div class="bulb" style="left:' + bulbs[bu][0] + '%;top:' + bulbs[bu][1] + '%;width:' + bulbs[bu][2] + '%;aspect-ratio:1;animation-duration:' + (1.15 + (bu % 4) * 0.3).toFixed(2) + 's;animation-delay:-' + (bu * 0.21).toFixed(2) + 's"></div>';
    }
    // candles — the two votives on the table, then the little ones on the far table at right
    function flame(x, y, size, dur, delay){
      return '<div class="fl" style="left:' + x + '%;top:' + y + '%;width:' + size + '%;aspect-ratio:0.8;animation-duration:' + dur + 's;animation-delay:-' + delay + 's"></div>';
    }
    function core(x, y, size, dur, delay){
      return '<div class="flcore" style="left:' + x + '%;top:' + y + '%;width:' + size + '%;aspect-ratio:0.85;animation-duration:' + dur + 's;animation-delay:-' + delay + 's"></div>';
    }
    var candles = [
      [44.5, 89.5, 2.6],  // left votive on the table
      [63.5, 87.5, 2.4],  // right votive on the table
      [97.2, 47.5, 1.2],  // far table, right edge
      [96.8, 35.0, 1.0]   // far table, higher
    ];
    for (var ci = 0; ci < candles.length; ci++) {
      var c = candles[ci];
      var dur = (0.85 + (ci % 4) * 0.22).toFixed(2), del = (ci * 0.31).toFixed(2);
      if (c[2] >= 2.4) html += '<div class="flh" style="left:' + c[0] + '%;top:' + c[1] + '%;width:' + (c[2] * 2.4).toFixed(1) + '%;aspect-ratio:0.9;animation-duration:' + dur + 's;animation-delay:-' + del + 's"></div>';
      html += flame(c[0], c[1], c[2], dur, del);
    }
    html += core(44.5, 89.5, 1.2, 0.7, 0.2);
    html += core(63.5, 87.5, 1.1, 0.8, 0.5);
    // steam — two wisps off each cocoa mug, staggered
    var mugs = [[11.5,16.5],[39.5,31],[52,53],[68,55],[83,64],[19,71]];
    for (var m = 0; m < mugs.length; m++) {
      for (var w = 0; w < 2; w++) {
        var sx = mugs[m][0] + (w ? 1.2 : -0.8), sy = mugs[m][1];
        var sdur = (3.2 + ((m + w) % 3) * 0.5).toFixed(1), sdel = (m * 0.9 + w * 1.7).toFixed(1);
        html += '<div class="steam" style="left:' + sx + '%;top:' + sy + '%;width:' + (3.4 + (m % 3) * 0.5).toFixed(1) + '%;aspect-ratio:1;animation-duration:' + sdur + 's;animation-delay:-' + sdel + 's"></div>';
      }
    }
    host.innerHTML = html;
  })();
</script>
</body>
</html>
