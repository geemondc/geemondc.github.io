<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Vector Circuit</title>
    <style>
      :root {
        --vec: #ffe93b;
        --vec-dim: rgba(255, 233, 59, 0.55);
        --vec-faint: rgba(255, 233, 59, 0.28);
        --ink: #000;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #000;
        color: var(--vec);
        font-family: ui-monospace, "Courier New", Courier, monospace;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        width: 100%;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        background: #000;
        overflow: hidden;
      }
      canvas#game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      /* ---------- in-game chrome ---------- */
      #backBtn {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        z-index: 5;
        display: none;
        background: rgba(0,0,0,0.65);
        color: var(--vec);
        border: 1.5px solid var(--vec-dim);
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        letter-spacing: 0.14em;
        padding: 7px 12px;
        cursor: pointer;
      }
      body.playing #backBtn { display: block; }
      #banner {
        position: absolute;
        left: 0; right: 0;
        top: 34%;
        z-index: 4;
        text-align: center;
        pointer-events: none;
        font-weight: 700;
        letter-spacing: 0.22em;
        font-size: clamp(22px, 6vw, 44px);
        color: var(--vec);
        text-shadow: 0 0 6px var(--vec), 0 0 22px var(--vec-dim), 0 0 46px var(--vec-faint);
        opacity: 0;
        transition: opacity 0.18s ease;
        padding: 0 12px;
      }
      #banner.show { opacity: 1; }
      #banner small {
        display: block;
        margin-top: 10px;
        font-size: clamp(12px, 2.6vw, 17px);
        letter-spacing: 0.3em;
        font-weight: 400;
      }

      /* ---------- touch deck ---------- */
      #deck {
        display: none;
        flex: 0 0 auto;
        height: calc(148px + env(safe-area-inset-bottom));
        padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
        background: #050505;
        border-top: 1px solid #1c1a08;
        align-items: center;
        justify-content: space-between;
        touch-action: none;
      }
      body.touch.playing #deck { display: flex; }
      #stick {
        position: relative;
        width: 112px;
        height: 112px;
        border: 2px solid var(--vec-dim);
        border-radius: 50%;
        flex: 0 0 auto;
        touch-action: none;
      }
      #stick::before, #stick::after {
        content: "";
        position: absolute;
        background: var(--vec-faint);
      }
      #stick::before { left: 50%; top: 8px; bottom: 8px; width: 1px; }
      #stick::after { top: 50%; left: 8px; right: 8px; height: 1px; }
      #knob {
        position: absolute;
        left: 50%; top: 50%;
        width: 50px; height: 50px;
        margin: -25px 0 0 -25px;
        border: 2px solid var(--vec);
        border-radius: 50%;
        background: rgba(255, 233, 59, 0.12);
        box-shadow: 0 0 14px var(--vec-faint);
      }
      #fireBtn {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        border: 2.5px solid var(--vec);
        background: rgba(255, 233, 59, 0.08);
        color: var(--vec);
        font: inherit;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.18em;
        box-shadow: 0 0 18px var(--vec-faint), inset 0 0 18px rgba(255,233,59,0.10);
        touch-action: none;
        flex: 0 0 auto;
        cursor: pointer;
      }
      #fireBtn.on { background: rgba(255, 233, 59, 0.32); }

      /* ---------- intro ---------- */
      #intro {
        position: absolute;
        inset: 0;
        z-index: 6;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 14px 26px;
      }
      body.playing #intro { display: none; }
      .intro-inner {
        width: 100%;
        max-width: 620px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: auto 0;
      }
      #hero {
        width: 100%;
        max-height: 44dvh;
        object-fit: cover;
        object-position: center 30%;
        border: 2px solid var(--vec-dim);
        border-radius: 10px;
        box-shadow: 0 0 24px rgba(255, 233, 59, 0.22), 0 0 70px rgba(255, 233, 59, 0.10);
        display: block;
      }
      h1.title {
        margin: 16px 0 0;
        font-size: clamp(34px, 9vw, 62px);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-align: center;
        line-height: 1.05;
        color: var(--vec);
        text-shadow: 0 0 8px var(--vec), 0 0 30px var(--vec-dim), 0 0 64px var(--vec-faint);
      }
      .tribute {
        margin-top: 8px;
        font-size: clamp(10px, 2.6vw, 13px);
        letter-spacing: 0.34em;
        text-align: center;
        color: var(--vec-dim);
        text-transform: uppercase;
      }
      .tagline {
        margin-top: 12px;
        font-size: clamp(14px, 3.6vw, 18px);
        letter-spacing: 0.06em;
        text-align: center;
        color: #fff3a0;
      }
      #startBtn {
        margin-top: 20px;
        background: rgba(255, 233, 59, 0.10);
        color: var(--vec);
        border: 2.5px solid var(--vec);
        border-radius: 8px;
        font: inherit;
        font-weight: 700;
        font-size: clamp(20px, 5vw, 26px);
        letter-spacing: 0.3em;
        padding: 15px 52px 15px calc(52px + 0.3em);
        cursor: pointer;
        box-shadow: 0 0 20px var(--vec-faint), inset 0 0 16px rgba(255,233,59,0.10);
      }
      #startBtn:active { background: rgba(255, 233, 59, 0.30); }
      .toggles {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        justify-content: center;
      }
      .tgl {
        background: transparent;
        color: var(--vec);
        border: 1.5px solid var(--vec-dim);
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        letter-spacing: 0.16em;
        padding: 9px 14px;
        cursor: pointer;
      }
      .tgl:active { background: rgba(255,233,59,0.18); }
      .hub {
        margin-top: 20px;
        font-size: 11px;
        letter-spacing: 0.3em;
        color: rgba(255, 233, 59, 0.4);
        text-decoration: none;
      }

      /* ---------- modal overlays ---------- */
      .modal {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.92);
        padding: 16px;
      }
      .modal.open { display: flex; }
      .card {
        width: 100%;
        max-width: 540px;
        max-height: 88dvh;
        overflow-y: auto;
        border: 2px solid var(--vec-dim);
        border-radius: 10px;
        background: #030300;
        box-shadow: 0 0 30px rgba(255, 233, 59, 0.15);
        padding: 22px 22px 18px;
        text-align: center;
      }
      .card h2 {
        margin: 0 0 14px;
        font-size: 19px;
        letter-spacing: 0.26em;
        font-weight: 700;
      }
      .card p {
        margin: 0 0 12px;
        font-size: 14.5px;
        line-height: 1.55;
        letter-spacing: 0.03em;
        color: #fdf6c8;
        text-align: left;
      }
      .card p b { color: var(--vec); }
      .card .closeBtn {
        margin-top: 8px;
        background: transparent;
        color: var(--vec);
        border: 1.5px solid var(--vec);
        border-radius: 6px;
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.22em;
        padding: 10px 30px;
        cursor: pointer;
      }
      #qrImg {
        width: 208px;
        height: 208px;
        background: #fff;
        padding: 10px;
        border-radius: 8px;
        cursor: zoom-in;
      }
      #qrImg.big { width: min(76vw, 330px); height: min(76vw, 330px); cursor: zoom-out; }
      .qr-url {
        margin-top: 12px;
        font-size: 12.5px;
        letter-spacing: 0.08em;
        color: var(--vec-dim);
        word-break: break-all;
      }
      @media (prefers-reduced-motion: reduce) {
        #banner { transition: none; }
      }
    </style>
  </head>

    var lang = "en";

    /* ============================== AUDIO ============================== */
    var actx = null, soundOn = true, lastTickAt = 0;
    function ac() {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) actx = new AC();
      }
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function tone(freqA, freqB, dur, type, vol, delay) {
      if (!soundOn) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (delay || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freqA, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, freqB), t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function noise(dur, vol, freqA, freqB, delay) {
      if (!soundOn) return;
      var c = ac(); if (!c) return;
      var t0 = c.currentTime + (delay || 0);
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource(); src.buffer = buf;
      var f = c.createBiquadFilter(); f.type = "lowpass";
      f.frequency.setValueAtTime(freqA, t0);
      f.frequency.exponentialRampToValueAtTime(Math.max(40, freqB), t0 + dur);
      var g = c.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start(t0);
    }
    function sfx(name) {
      if (!soundOn) return;
      if (name === "zap") tone(920, 240, 0.09, "square", 0.10);
      else if (name === "tick") {
        var now = performance.now();
        if (now - lastTickAt < 45) return;
        lastTickAt = now;
        tone(210, 150, 0.035, "triangle", 0.07);
      } else if (name === "boom") { noise(0.55, 0.30, 2600, 90); tone(150, 40, 0.5, "sine", 0.22); }
      else if (name === "mine") { noise(0.4, 0.26, 1800, 70); tone(110, 34, 0.42, "sine", 0.26); }

    }

    /* ============================== DOM ============================== */
    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");
    var stage = document.getElementById("stage");
    var bannerEl = document.getElementById("banner");
    var knob = document.getElementById("knob");
    var stickEl = document.getElementById("stick");
    var fireBtn = document.getElementById("fireBtn");

    /* ============================== WORLD ============================== */
    var W = 1000, H = 750;
    var WALL = 24;                                  // outer wall inset
    var BOX = { x: 300, y: 268, w: 400, h: 214 };    // solid center box
    var SHIP_R = 11, DROID_R = 13, MINE_R = 6;
    var TURN = 5.4;          // rad/s \u2014 the dial feel: eager pivot
    var THRUST = 640;        // units/s^2
    var DRAG = 0.32;         // 1/s exponential drag \u2014 a whisper
    var REST = 0.92;         // bounce restitution \u2014 slight energy loss
    var MAXV = 720;
    var BOLT_V = 800, MAX_BOLTS = 4, FIRE_CD = 0.15;
    var MAX_MINES = 14;

    var view = { s: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
    function resize() {
      var r = stage.getBoundingClientRect();
      view.dpr = Math.min(2, window.devicePixelRatio || 1);
      view.w = Math.max(50, r.width); view.h = Math.max(50, r.height);
      canvas.width = Math.round(view.w * view.dpr);
      canvas.height = Math.round(view.h * view.dpr);
      view.s = Math.min(view.w / W, view.h / H);
      view.ox = (view.w - W * view.s) / 2;
      view.oy = (view.h - H * view.s) / 2;
    }
    window.addEventListener("resize", resize);

    function toWorld(cx, cy) {
      var r = canvas.getBoundingClientRect();
      return { x: (cx - r.left - view.ox) / view.s, y: (cy - r.top - view.oy) / view.s };
    }

    /* ============================== INPUT ============================== */
    var keys = {};
    var mouse = { x: 0, y: 0, inside: false, seen: false, fire: false, thrust: false };
    var stick = { active: false, id: null, dx: 0, dy: 0, mag: 0, ang: 0 };
    var touchFire = false;

    window.addEventListener("keydown", function (e) {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].indexOf(e.code) >= 0) e.preventDefault();
      keys[e.code] = true;
    });
    window.addEventListener("keyup", function (e) { keys[e.code] = false; });
    window.addEventListener("blur", function () { keys = {}; mouse.fire = false; mouse.thrust = false; touchFire = false; });

    canvas.addEventListener("pointermove", function (e) {
      var p = toWorld(e.clientX, e.clientY);
      mouse.x = p.x; mouse.y = p.y; mouse.inside = true; mouse.seen = true;
    });
    canvas.addEventListener("pointerdown", function (e) {
      ac();
      if (e.pointerType === "touch") { document.body.classList.add("touch"); return; }
      var p = toWorld(e.clientX, e.clientY);
      mouse.x = p.x; mouse.y = p.y; mouse.inside = true; mouse.seen = true;
      if (e.button === 0) mouse.fire = true;
      if (e.button === 2) mouse.thrust = true;
    });
    window.addEventListener("pointerup", function (e) {
      if (e.button === 0) mouse.fire = false;
      if (e.button === 2) mouse.thrust = false;
    });
    canvas.addEventListener("pointerleave", function () { mouse.inside = false; });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    function stickPos(e) {
      var r = stickEl.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = e.clientX - cx, dy = e.clientY - cy;
      var max = r.width / 2 - 6;
      var d = Math.hypot(dx, dy);
      if (d > max) { dx = dx / d * max; dy = dy / d * max; d = max; }
      return { dx: dx, dy: dy, mag: Math.min(1, d / max) };
    }
    stickEl.addEventListener("pointerdown", function (e) {
      ac(); document.body.classList.add("touch");
      stick.active = true; stick.id = e.pointerId;
      stickEl.setPointerCapture(e.pointerId);
      var p = stickPos(e); stick.dx = p.dx; stick.dy = p.dy; stick.mag = p.mag;
      e.preventDefault();
    });
    stickEl.addEventListener("pointermove", function (e) {
      if (!stick.active || e.pointerId !== stick.id) return;
      var p = stickPos(e); stick.dx = p.dx; stick.dy = p.dy; stick.mag = p.mag;
    });
    function stickEnd(e) {
      if (e.pointerId !== stick.id) return;
      stick.active = false; stick.mag = 0; stick.dx = 0; stick.dy = 0;
      knob.style.transform = "translate(0px,0px)";
    }
    stickEl.addEventListener("pointerup", stickEnd);
    stickEl.addEventListener("pointercancel", stickEnd);

    fireBtn.addEventListener("pointerdown", function (e) {
      ac(); document.body.classList.add("touch");
      touchFire = true; fireBtn.classList.add("on"); e.preventDefault();
    });
    function fireEnd() { touchFire = false; fireBtn.classList.remove("on"); }
    fireBtn.addEventListener("pointerup", fireEnd);
    fireBtn.addEventListener("pointercancel", fireEnd);
    fireBtn.addEventListener("pointerleave", fireEnd);
    window.addEventListener("touchstart", function () { document.body.classList.add("touch"); }, { passive: true });
    if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) document.body.classList.add("touch");

    /* ============================== GAME STATE ============================== */
    var mode = "attract"; // attract | playing | dying | clear | over
    var score = 0, lastScore = 0, credit = 1, sector = 1, spares = 0, chain = 0;
    var ship = null, droids = [], mines = [], bolts = [], parts = [], flashes = [];
    var fireCd = 0, stateT = 0, shieldT = 0, attractT = 0, elapsed = 0;
    var bannerTimer = null;

    function showBanner(main, sub, holdMs) {
      bannerEl.innerHTML = "";
      bannerEl.appendChild(document.createTextNode(main));
      if (sub) {
        var s = document.createElement("small");
        s.textContent = sub;
        bannerEl.appendChild(s);
      }
      bannerEl.classList.add("show");
      if (bannerTimer) clearTimeout(bannerTimer);
      if (holdMs) bannerTimer = setTimeout(function () { bannerEl.classList.remove("show"); }, holdMs);
    }
    function hideBanner() { bannerEl.classList.remove("show"); if (bannerTimer) clearTimeout(bannerTimer); }

    function inBox(x, y, pad) {
      return x > BOX.x - pad && x < BOX.x + BOX.w + pad && y > BOX.y - pad && y < BOX.y + BOX.h + pad;
    }
    function corridorSpot(minPlayerDist) {
      for (var tries = 0; tries < 40; tries++) {
        var x = WALL + 40 + Math.random() * (W - 2 * WALL - 80);
        var y = WALL + 40 + Math.random() * (H - 2 * WALL - 80);
        if (inBox(x, y, 46)) continue;
        if (ship && Math.hypot(x - ship.x, y - ship.y) < minPlayerDist) continue;
        return { x: x, y: y };
      }
      return { x: W / 2, y: WALL + 70 };
    }

    function newShip() {
      return { x: W / 2, y: H - WALL - 92, vx: -150, vy: 0, a: Math.PI };
    }
    function spawnDroids(n, speedBase) {
      droids = [];
      for (var i = 0; i < n; i++) {
        var p = corridorSpot(230);
        var a = Math.random() * Math.PI * 2;
        var sp = speedBase * (0.8 + Math.random() * 0.45);
        droids.push({
          x: p.x, y: p.y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          rot: Math.random() * Math.PI * 2,
          wander: 1 + Math.random() * 2,
          mineT: 1.6 + Math.random() * 3.4
        });
      }
    }
    function startSector() {
      mines = []; bolts = []; chain = 0;
      var count = Math.min(3 + (sector - 1), 8);
      var speed = Math.min(95 + (sector - 1) * 16, 235);
      spawnDroids(count, speed);
    }
    function startGame() {
      ac();
      score = 0; sector = 1; spares = 3; chain = 0;
      ship = newShip();
      shieldT = 1.6;
      fireCd = 0;
      startSector();
      mode = "playing";
      document.body.classList.add("playing");
      showBanner(T("sectorN") + sector, T("ready"), 1300);
    }
    function toIntro() {
      mode = "attract";
      document.body.classList.remove("playing");
      hideBanner();
      ship = newShip();
      spawnDroids(4, 105);
      mines = []; bolts = [];
      attractT = 0;
    }
    function explode(x, y, big) {
      var n = big ? 22 : 14;
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2;
        var sp = 60 + Math.random() * 260;
        parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.5, t: 0, len: 5 + Math.random() * 9, a: a });
      }
    }
    function die() {
      explode(ship.x, ship.y, true);
      sfx("boom");
      mode = "dying"; stateT = 0;
    }
    function respawn() {
      if (spares > 0) {
        spares--;
        ship = newShip();
        shieldT = 2.2;
        // corridor briefly clears around the respawn point
        mines = mines.filter(function (m) { return Math.hypot(m.x - ship.x, m.y - ship.y) > 175; });
        droids = droids.filter(function (d) { return Math.hypot(d.x - ship.x, d.y - ship.y) > 190; });
        if (!droids.length) { mode = "clear"; stateT = 0; sfx("chime"); return; }
        mode = "playing";
        showBanner(T("sectorN") + sector, "", 800);
      } else {
        lastScore = score;
        mode = "over"; stateT = 0;
        showBanner(T("over"), T("score") + " " + score, 2600);
      }
    }

    /* ============================== PHYSICS ============================== */
    // Elastic bounce vs outer wall + center box. Walls never kill.
    function bounce(e, r, isPlayer) {
      // outer walls
      if (e.x - r < WALL) {
        e.x = WALL + r;
        if (e.vx < 0) { e.vx = -e.vx * REST; if (isPlayer) { flashAt("oL", e.x, e.y); sfx("tick"); } }
      } else if (e.x + r > W - WALL) {
        e.x = W - WALL - r;
        if (e.vx > 0) { e.vx = -e.vx * REST; if (isPlayer) { flashAt("oR", e.x, e.y); sfx("tick"); } }
      }
      if (e.y - r < WALL) {
        e.y = WALL + r;
        if (e.vy < 0) { e.vy = -e.vy * REST; if (isPlayer) { flashAt("oT", e.x, e.y); sfx("tick"); } }
      } else if (e.y + r > H - WALL) {
        e.y = H - WALL - r;
        if (e.vy > 0) { e.vy = -e.vy * REST; if (isPlayer) { flashAt("oB", e.x, e.y); sfx("tick"); } }
      }
      // center box: resolve along the axis of least penetration
      if (inBox(e.x, e.y, r)) {
        var penL = e.x - (BOX.x - r), penR = (BOX.x + BOX.w + r) - e.x;
        var penT = e.y - (BOX.y - r), penB = (BOX.y + BOX.h + r) - e.y;
        var m = Math.min(penL, penR, penT, penB);
        if (m === penL) { e.x = BOX.x - r; if (e.vx > 0) { e.vx = -e.vx * REST; if (isPlayer) { flashAt("bL", e.x, e.y); sfx("tick"); } } }
        else if (m === penR) { e.x = BOX.x + BOX.w + r; if (e.vx < 0) { e.vx = -e.vx * REST; if (isPlayer) { flashAt("bR", e.x, e.y); sfx("tick"); } } }
        else if (m === penT) { e.y = BOX.y - r; if (e.vy > 0) { e.vy = -e.vy * REST; if (isPlayer) { flashAt("bT", e.x, e.y); sfx("tick"); } } }
        else { e.y = BOX.y + BOX.h + r; if (e.vy < 0) { e.vy = -e.vy * REST; if (isPlayer) { flashAt("bB", e.x, e.y); sfx("tick"); } } }
      }
    }
    function flashAt(side, x, y) { flashes.push({ side: side, x: x, y: y, t: 0 }); }

    function fireBolt() {
      if (bolts.length >= MAX_BOLTS) return;   // the 4-shot cap holds, always
      bolts.push({
        x: ship.x + Math.cos(ship.a) * (SHIP_R + 4),
        y: ship.y + Math.sin(ship.a) * (SHIP_R + 4),
        vx: Math.cos(ship.a) * BOLT_V + ship.vx * 0.35,
        vy: Math.sin(ship.a) * BOLT_V + ship.vy * 0.35
      });
      sfx("zap");
    }

    /* ============================== UPDATE ============================== */
    var wp = [{ x: 150, y: 130 }, { x: 850, y: 130 }, { x: 850, y: 620 }, { x: 150, y: 620 }];
    var wpIdx = 0;
    function autopilot(dt) {
      var t = wp[wpIdx];
      if (Math.hypot(t.x - ship.x, t.y - ship.y) < 70) wpIdx = (wpIdx + 1) % wp.length;
      var want = Math.atan2(t.y - ship.y, t.x - ship.x);
      turnToward(want, dt);
      if (Math.abs(angDiff(want, ship.a)) < 0.55) {
        ship.vx += Math.cos(ship.a) * THRUST * 0.8 * dt;
        ship.vy += Math.sin(ship.a) * THRUST * 0.8 * dt;
      }
      if (fireCd <= 0) {
        for (var i = 0; i < droids.length; i++) {
          var d = droids[i];
          var da = Math.atan2(d.y - ship.y, d.x - ship.x);
          if (Math.hypot(d.x - ship.x, d.y - ship.y) < 300 && Math.abs(angDiff(da, ship.a)) < 0.22) {
            fireBolt(); fireCd = FIRE_CD + 0.1; break;
          }
        }
      }
    }
    function angDiff(a, b) {
      var d = a - b;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    }
    function turnToward(want, dt) {
      var d = angDiff(want, ship.a);
      var step = TURN * dt;
      if (Math.abs(d) <= step) ship.a = want; else ship.a += Math.sign(d) * step;
    }

    function update(dt) {
      elapsed += dt;
      fireCd -= dt;
      if (shieldT > 0) shieldT -= dt;
      var i, j;

      /* --- player control --- */
      if (mode === "playing" || mode === "attract") {
        if (mode === "attract") { autopilot(dt); attractT += dt; }
        else {
          var turnIn = 0;
          if (keys["KeyA"] || keys["ArrowLeft"]) turnIn -= 1;
          if (keys["KeyD"] || keys["ArrowRight"]) turnIn += 1;
          var thrustAmt = 0;
          if (turnIn !== 0) ship.a += turnIn * TURN * dt;
          else if (stick.active && stick.mag > 0.16) turnToward(Math.atan2(stick.dy, stick.dx), dt);
          else if (mouse.seen && mouse.inside && mode === "playing") turnToward(Math.atan2(mouse.y - ship.y, mouse.x - ship.x), dt);
          if (keys["ArrowUp"] || keys["KeyW"]) thrustAmt = 1;
          if (mouse.thrust) thrustAmt = 1;
          if (stick.active) thrustAmt = Math.max(thrustAmt, Math.max(0, stick.mag - 0.16) / 0.84);
          if (thrustAmt > 0) {
            ship.vx += Math.cos(ship.a) * THRUST * thrustAmt * dt;
            ship.vy += Math.sin(ship.a) * THRUST * thrustAmt * dt;
          }
          var wantFire = keys["Space"] || mouse.fire || touchFire;
          if (wantFire && fireCd <= 0 && bolts.length < MAX_BOLTS) { fireBolt(); fireCd = FIRE_CD; }
        }
        // drag + clamp + integrate + bounce
        var dragF = Math.exp(-DRAG * dt);
        ship.vx *= dragF; ship.vy *= dragF;
        var sp = Math.hypot(ship.vx, ship.vy);
        if (sp > MAXV) { ship.vx = ship.vx / sp * MAXV; ship.vy = ship.vy / sp * MAXV; }
        ship.x += ship.vx * dt; ship.y += ship.vy * dt;
        bounce(ship, SHIP_R, true);
      }

      /* --- droids --- */
      for (i = 0; i < droids.length; i++) {
        var d = droids[i];
        d.rot += dt * 0.9;
        d.wander -= dt;
        if (d.wander <= 0) {
          d.wander = 1.2 + Math.random() * 2.2;
          var ca = Math.atan2(d.vy, d.vx) + (Math.random() - 0.5) * 0.9;
          var cs = Math.hypot(d.vx, d.vy);
          d.vx = Math.cos(ca) * cs; d.vy = Math.sin(ca) * cs;
        }
        d.x += d.vx * dt; d.y += d.vy * dt;
        bounce(d, DROID_R, false);
        if (mode === "playing") {
          d.mineT -= dt;
          if (d.mineT <= 0) {
            d.mineT = 2.4 + Math.random() * 3.2;
            if (mines.length < MAX_MINES && !inBox(d.x, d.y, 10)) mines.push({ x: d.x, y: d.y, arm: 0.45, ph: Math.random() * 6 });
          }
        }
      }
      for (i = 0; i < mines.length; i++) if (mines[i].arm > 0) mines[i].arm -= dt;

      /* --- bolts --- */
      for (i = bolts.length - 1; i >= 0; i--) {
        var b = bolts[i];
        b.x += b.vx * dt; b.y += b.vy * dt;
        var dead = false;
        if (b.x < WALL || b.x > W - WALL || b.y < WALL || b.y > H - WALL || inBox(b.x, b.y, 0)) dead = true;
        if (!dead && mode !== "attract") {
          for (j = 0; j < droids.length; j++) {
            if (Math.hypot(b.x - droids[j].x, b.y - droids[j].y) < DROID_R + 4) {
              explode(droids[j].x, droids[j].y, false);
              sfx("boom");
              droids.splice(j, 1);
              if (mode === "playing") { chain++; score += 50 * chain; }
              dead = true; break;
            }
          }
        }
        if (!dead && mode === "playing") {
          for (j = 0; j < mines.length; j++) {
            if (Math.hypot(b.x - mines[j].x, b.y - mines[j].y) < MINE_R + 5) {
              explode(mines[j].x, mines[j].y, false);
              sfx("mine");
              mines.splice(j, 1);
              score += 25;
              dead = true; break;
            }
          }
        }
        if (dead) bolts.splice(i, 1);
      }

      /* --- player contact --- */
      if (mode === "playing" && shieldT <= 0) {
        var hit = false;
        for (i = 0; i < droids.length; i++) {
          if (Math.hypot(ship.x - droids[i].x, ship.y - droids[i].y) < SHIP_R + DROID_R - 2) { hit = true; break; }
        }
        if (!hit) {
          for (i = 0; i < mines.length; i++) {
            if (mines[i].arm <= 0 && Math.hypot(ship.x - mines[i].x, ship.y - mines[i].y) < SHIP_R + MINE_R + 1) {
              explode(mines[i].x, mines[i].y, false); sfx("mine");
              mines.splice(i, 1); hit = true; break;
            }
          }
        }
        if (hit) die();
      }

      /* --- sector clear --- */
      if (mode === "playing" && droids.length === 0) {
        mode = "clear"; stateT = 0; sfx("chime");
        showBanner(T("clear"), "", 1500);
      }

      /* --- state timers --- */
      if (mode === "dying") { stateT += dt; if (stateT > 1.15) respawn(); }
      else if (mode === "clear") {
        stateT += dt;
        if (stateT > 1.6) { sector++; startSector(); mode = "playing"; showBanner(T("sectorN") + sector, "", 1100); }
      } else if (mode === "over") { stateT += dt; if (stateT > 2.8) toIntro(); }

      /* --- particles & flashes --- */
      for (i = parts.length - 1; i >= 0; i--) {
        var p = parts[i]; p.t += dt;
        if (p.t >= p.life) { parts.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
      }
      for (i = flashes.length - 1; i >= 0; i--) { flashes[i].t += dt; if (flashes[i].t > 0.2) flashes.splice(i, 1); }
      if (stick.active) knob.style.transform = "translate(" + stick.dx + "px," + stick.dy + "px)";
    }

    /* ============================== RENDER ============================== */
    var VEC = "#ffe93b", VEC_HI = "#fffbd1";
    function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
    function poly(pts, close) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      if (close) ctx.closePath();
      ctx.stroke();
    }
    function shipPath(x, y, a, s) {
      var c = Math.cos(a), sn = Math.sin(a);
      function P(px, py) { return [x + (px * c - py * sn) * s, y + (px * sn + py * c) * s]; }
      poly([P(15, 0), P(-11, 10), P(-6, 0), P(-11, -10)], true);
      poly([P(4, 0), P(-6, 0)], false);
    }
    function vtext(str, x, y, size, align, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha == null ? 1 : alpha;
      ctx.font = "700 " + size + "px 'Courier New', monospace";
      ctx.textAlign = align || "left";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = VEC;
      ctx.shadowColor = VEC; ctx.shadowBlur = 7;
      ctx.strokeText(str, x, y);
      ctx.restore();
    }
    function drawBoxHUD() {
      // spare ships shelved along the box inside-left edge
      for (var i = 0; i < spares; i++) {
        shipPath(BOX.x + 30, BOX.y + 42 + i * 46, -Math.PI / 2, 0.85);
      }
      var tx = BOX.x + 66;
      vtext(T("score"), tx, BOX.y + 34, 17, "left", 0.75);
      vtext(T("sector") + " " + sector, BOX.x + BOX.w - 16, BOX.y + 34, 17, "right", 0.75);
      vtext(String(score), tx, BOX.y + 74, 37, "left");
      vtext(T("last"), tx, BOX.y + 122, 17, "left", 0.75);
      vtext(String(lastScore), tx, BOX.y + 148, 24, "left");
      vtext(T("credit") + "  " + credit, tx, BOX.y + 188, 18, "left", 0.9);
    }
    function drawFlashes() {
      for (var i = 0; i < flashes.length; i++) {
        var f = flashes[i], a = 1 - f.t / 0.2, L = 46;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.strokeStyle = VEC_HI; ctx.lineWidth = 4; ctx.shadowColor = VEC; ctx.shadowBlur = 20;
        if (f.side === "oL") line(WALL, f.y - L, WALL, f.y + L);
        else if (f.side === "oR") line(W - WALL, f.y - L, W - WALL, f.y + L);
        else if (f.side === "oT") line(f.x - L, WALL, f.x + L, WALL);
        else if (f.side === "oB") line(f.x - L, H - WALL, f.x + L, H - WALL);
        else if (f.side === "bL") line(BOX.x, f.y - L, BOX.x, f.y + L);
        else if (f.side === "bR") line(BOX.x + BOX.w, f.y - L, BOX.x + BOX.w, f.y + L);
        else if (f.side === "bT") line(f.x - L, BOX.y, f.x + L, BOX.y);
        else if (f.side === "bB") line(f.x - L, BOX.y + BOX.h, f.x + L, BOX.y + BOX.h);
        ctx.restore();
      }
    }
    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(view.s * view.dpr, 0, 0, view.s * view.dpr, view.ox * view.dpr, view.oy * view.dpr);
      ctx.strokeStyle = VEC;
      ctx.fillStyle = VEC;
      ctx.lineWidth = 2;
      ctx.lineJoin = "round";
      ctx.shadowColor = VEC;
      ctx.shadowBlur = 9;

      // arena: outer wall + solid center box
      ctx.strokeRect(WALL, WALL, W - 2 * WALL, H - 2 * WALL);
      ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);
      drawFlashes();
      ctx.shadowBlur = 9;
      if (mode !== "attract") drawBoxHUD();

      // mines
      var i, j;
      for (i = 0; i < mines.length; i++) {
        var m = mines[i];
        var pulse = m.arm > 0 ? 0.35 : 0.75 + 0.25 * Math.sin(elapsed * 5 + m.ph);
        ctx.save(); ctx.globalAlpha = pulse;
        ctx.beginPath(); ctx.arc(m.x, m.y, MINE_R, 0, Math.PI * 2); ctx.stroke();
        for (j = 0; j < 4; j++) {
          var sa = j * Math.PI / 2 + Math.PI / 4;
          line(m.x + Math.cos(sa) * (MINE_R + 1), m.y + Math.sin(sa) * (MINE_R + 1),
               m.x + Math.cos(sa) * (MINE_R + 5), m.y + Math.sin(sa) * (MINE_R + 5));
        }
        ctx.fillRect(m.x - 1, m.y - 1, 2, 2);
        ctx.restore();
      }
      // droids: hexagonal wireframe
      for (i = 0; i < droids.length; i++) {
        var d = droids[i], pts = [], pts2 = [];
        for (j = 0; j < 6; j++) {
          var ha = d.rot + j * Math.PI / 3;
          pts.push([d.x + Math.cos(ha) * DROID_R, d.y + Math.sin(ha) * DROID_R]);
          var hb = -d.rot * 1.4 + j * Math.PI / 3;
          pts2.push([d.x + Math.cos(hb) * DROID_R * 0.5, d.y + Math.sin(hb) * DROID_R * 0.5]);
        }
        poly(pts, true); poly(pts2, true);
      }
      // bolts
      ctx.save();
      ctx.strokeStyle = VEC_HI; ctx.lineWidth = 2.6; ctx.shadowBlur = 12;
      for (i = 0; i < bolts.length; i++) {
        var b = bolts[i], bl = 9, bv = Math.hypot(b.vx, b.vy) || 1;
        line(b.x - b.vx / bv * bl, b.y - b.vy / bv * bl, b.x, b.y);
      }
      ctx.restore();
      // particles
      ctx.save();
      for (i = 0; i < parts.length; i++) {
        var p = parts[i];
        ctx.globalAlpha = 1 - p.t / p.life;
        line(p.x, p.y, p.x - Math.cos(p.a) * p.len, p.y - Math.sin(p.a) * p.len);
      }
      ctx.restore();
      // player ship
      if (ship && mode !== "dying" && mode !== "over") {
        var blink = shieldT > 0 && Math.floor(elapsed * 9) % 2 === 0;
        if (!blink) shipPath(ship.x, ship.y, ship.a, 1);
        if (shieldT > 0) {
          ctx.save(); ctx.globalAlpha = 0.4;
          ctx.beginPath(); ctx.arc(ship.x, ship.y, SHIP_R + 9, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }
        // thrust flame
        var thrusting = (mode === "playing" && (keys["ArrowUp"] || keys["KeyW"] || mouse.thrust || (stick.active && stick.mag > 0.2))) || mode === "attract";
        if (thrusting && Math.hypot(ship.vx, ship.vy) > 30) {
          var bx = ship.x - Math.cos(ship.a) * (SHIP_R + 2), by = ship.y - Math.sin(ship.a) * (SHIP_R + 2);
          var fl = 7 + Math.random() * 6;
          line(bx, by, bx - Math.cos(ship.a) * fl, by - Math.sin(ship.a) * fl);
        }
      }
      // attract invitation (original words, in the spirit of the 1981 cabinet)
      if (mode === "attract") {
        var lines = T("attract");
        var idx = Math.floor(attractT / 3.6) % lines.length;
        var fade = 0.55 + 0.45 * Math.sin(elapsed * 2.2);
        vtext(lines[idx], W / 2, WALL + 62, 25, "center", 0.35 + 0.5 * fade);
      }
      ctx.shadowBlur = 0;
    }

    /* ============================== UI WIRING ============================== */
    function applyLang() {
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var k = el.getAttribute("data-i18n");
        if (I18N[lang][k]) el.textContent = I18N[lang][k];
      });
      document.getElementById("langBtn").textContent = lang === "en" ? "ESPA\u00D1OL" : "ENGLISH";
      document.getElementById("soundState").textContent = soundOn ? "ON" : "OFF";
      fireBtn.textContent = T("fire");
      var hb = document.getElementById("howBody");
      hb.innerHTML = "";
      T("how").forEach(function (html) {
        var p = document.createElement("p");
        p.innerHTML = html;
        hb.appendChild(p);
      });
      document.documentElement.lang = lang;
    }
    document.getElementById("startBtn").addEventListener("click", function () { startGame(); });
    document.getElementById("backBtn").addEventListener("click", function () {
      if (mode === "playing" || mode === "dying" || mode === "clear") lastScore = score;
      toIntro();
    });
    document.getElementById("langBtn").addEventListener("click", function () {
      lang = lang === "en" ? "es" : "en";
      applyLang();
    });
    document.getElementById("soundBtn").addEventListener("click", function () {
      soundOn = !soundOn;
      document.getElementById("soundState").textContent = soundOn ? "ON" : "OFF";
      if (soundOn) sfx("chime");
    });
    document.getElementById("qrBtn").addEventListener("click", function () {
      document.getElementById("qrModal").classList.add("open");
    });
    document.getElementById("howBtn").addEventListener("click", function () {
      document.getElementById("howModal").classList.add("open");
    });
    document.querySelectorAll("[data-close]").forEach(function (btn) {
      btn.addEventListener("click", function () { btn.closest(".modal").classList.remove("open"); });
    });
    document.querySelectorAll(".modal").forEach(function (m) {
      m.addEventListener("click", function (e) { if (e.target === m) m.classList.remove("open"); });
    });
    var qrImg = document.getElementById("qrImg");
    qrImg.addEventListener("click", function () { qrImg.classList.toggle("big"); });
    window.addEventListener("pointerdown", function () { ac(); }, { passive: true });

    /* ============================== BOOT + LOOP ============================== */
    resize();
    applyLang();
    toIntro();
    var lastTs = 0;
    function frame(ts) {
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.033, (ts - lastTs) / 1000);
      lastTs = ts;
      if (dt > 0) { update(dt); render(); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    </script>
  </body>
</html>
