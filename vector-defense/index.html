<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Vector Rescue &amp; Defend</title>
<style>
  :root{
    --ink:#eaffea; --dim:#9fd8a8; --acc:#b6ff5e; --warn:#ffd76a; --bad:#ff6a5e;
    --panel:rgba(4,18,8,.88); --line:#3f7d4a; --btn:#0d2b16; --neon:#3dff6e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:#000; color:var(--ink);
    font-family:"Courier New", ui-monospace, Menlo, monospace;
    overflow:hidden; overscroll-behavior:none;
  }
  button{ font-family:inherit; cursor:pointer; }
  /* ---------- stage / canvas ---------- */
  #stageWrap{ position:fixed; inset:0; z-index:0; background:#000; }
  #cv{ display:block; width:100%; height:100%; touch-action:none; }
  /* ---------- in-play HUD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5; display:none;
    padding:8px 52px 0 12px; pointer-events:none;
    justify-content:space-between; align-items:flex-start; gap:8px;
    font-weight:bold; letter-spacing:.08em;
  }
  body.playing #hud{ display:flex; }
  .hudBox{ min-width:86px; }
  .hudBox.c{ text-align:center; } .hudBox.r{ text-align:right; }
  .hudLab{ font-size:9px; letter-spacing:.26em; color:var(--dim); }
  .hudVal{ font-size:clamp(19px,4.6vw,27px); color:var(--neon); text-shadow:0 0 10px rgba(61,255,110,.85),0 0 30px rgba(61,255,110,.4); line-height:1.05; }
  .hudVal.wave{ color:#dffcff; text-shadow:0 0 10px rgba(159,233,255,.85),0 0 30px rgba(159,233,255,.35); }
  #pauseBtn{
    position:fixed; top:10px; right:10px; z-index:6; display:none;
    background:var(--btn); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; width:44px; height:38px; font-size:14px; font-weight:bold;
  }
  body.playing #pauseBtn{ display:block; }
  /* ---------- super zapper button ---------- */
  #zapBtn{
    /* Gary, Oct 24: the GEE-BOMB lives just below the central gun — bottom
       center, under the cannon — not parked in the corner. (Phone hides this
       pill entirely; the top strip's compact button serves there.) */
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom)); z-index:6; display:none;
    align-items:center; justify-content:center; gap:6px;
    min-width:158px; height:62px; padding:0 18px; border-radius:32px;
    background:radial-gradient(circle at 50% 36%, #431806, #1c0d04);
    border:2px solid var(--warn); color:#fff; font-size:19px; font-weight:bold; letter-spacing:.07em; line-height:1;
    box-shadow:0 0 22px rgba(255,215,106,.5), inset 0 0 14px rgba(255,150,40,.35);
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  body.playing #zapBtn{ display:flex; }
  #zapBtn:active{ transform:translateX(-50%) scale(.94); }
  #zapCnt{ font-size:19px; font-weight:bold; color:var(--warn); text-shadow:0 0 8px rgba(255,215,106,.8); }
  #zapBtn.empty{ opacity:.42; filter:grayscale(.85); box-shadow:none; }
  #zapBtn.denied{ animation:zapShake .3s; }
  @keyframes zapShake{ 0%,100%{ transform:translateX(-50%); } 25%{ transform:translateX(calc(-50% - 5px)); } 75%{ transform:translateX(calc(-50% + 5px)); } }
  /* ---------- phone control strip + compact G-BOMB dock ----------
     On narrow screens every touch on the field fires the cannon, so the
     phone gets a slim fixed strip across the top that the game treats as
     dead space: menu / reset / pause / mute / G-BOMB live there, the
     canvas starts BELOW it, and the bottom pill + floating pause retire. */
  #ctrlStrip{
    position:fixed; top:0; left:0; right:0; z-index:8; display:none;
    height:calc(46px + env(safe-area-inset-top, 0px));
    padding:env(safe-area-inset-top, 0px) 8px 0;
    align-items:center; gap:8px;
    background:rgba(2,10,4,.94); border-bottom:1px solid var(--line);
  }
  .stripBtn{
    flex:0 0 auto; width:40px; height:36px; border-radius:8px;
    background:var(--btn); border:1px solid var(--line); color:var(--ink);
    font-size:17px; line-height:1; display:flex; align-items:center; justify-content:center;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
  }
  .stripBtn:active{ transform:scale(.94); }
  #zapBtnMini{
    position:relative; margin-left:auto; flex:0 0 auto;
    align-items:center; justify-content:center; display:flex;
    width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle at 50% 36%, #431806, #1c0d04);
    border:2px solid var(--warn); color:#fff; font-size:20px; line-height:1;
    box-shadow:0 0 16px rgba(255,215,106,.5), inset 0 0 10px rgba(255,150,40,.35);
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  #zapBtnMini:active{ transform:scale(.94); }
  #zapCntMini{
    position:absolute; bottom:-4px; right:-4px;
    background:#1c0d04; border:1px solid var(--warn); border-radius:9px;
    color:var(--warn); font-size:11px; font-weight:bold; line-height:1.25; padding:0 5px;
    text-shadow:0 0 6px rgba(255,215,106,.8);
  }
  #zapBtnMini.empty{ opacity:.42; filter:grayscale(.85); box-shadow:none; }
  #zapBtnMini.denied{ animation:zapShake .3s; }
  @media (max-width:600px){
    #stageWrap{ top:calc(46px + env(safe-area-inset-top, 0px)); }
    #hud{ top:calc(46px + env(safe-area-inset-top, 0px)); padding:6px 12px 0 12px; }
    .hudBox{ min-width:0; }
    .hudLab{ letter-spacing:.14em; }
    body.playing #ctrlStrip{ display:flex; }
    body.playing #zapBtn{ display:none; }
    body.playing #pauseBtn{ display:none; }
    /* the pause sheet starts BELOW the strip: the strip is dead-space
       controls and must stay tappable while paused, or its own pause
       toggle could never un-pause (the overlay is z-30, the strip z-8) */
    #pauseOverlay{ top:calc(46px + env(safe-area-inset-top, 0px)); }
  }
  /* ---------- intro ---------- */
  #intro{
    position:fixed; inset:0; z-index:10; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.78) 55%, rgba(0,0,0,.94));
    display:flex; flex-direction:column; align-items:center; padding:14px 14px 30px;
  }
  #heroCv{
    width:min(880px,100%); aspect-ratio:3/2; display:block;
    border:1px solid var(--line); border-radius:10px; background:#000;
    box-shadow:0 0 34px rgba(61,255,110,.28), inset 0 0 0 1px rgba(0,0,0,.4);
  }
  h1.title{
    margin:14px 0 2px; font-size:clamp(34px,8.6vw,68px); line-height:1; text-align:center;
    letter-spacing:.12em; font-weight:bold; color:var(--ink);
    text-shadow:0 0 10px rgba(160,255,180,.9),0 0 34px rgba(61,255,110,.55),0 0 70px rgba(61,255,110,.3);
  }
  #tagline{ margin:8px 0 0; font-size:clamp(14px,3.4vw,19px); letter-spacing:.08em; color:var(--acc); text-align:center; text-shadow:0 0 10px rgba(182,255,94,.6); }
  #hiRow{ display:flex; gap:14px; margin:16px 0 4px; flex-wrap:wrap; justify-content:center; }
  .hiBox{
    border:1px solid var(--line); background:var(--panel); border-radius:8px;
    padding:8px 18px; text-align:center; min-width:170px;
  }
  .hiBox .lab{ font-size:10px; letter-spacing:.24em; color:var(--dim); }
  .hiBox .num{ font-size:26px; font-weight:bold; text-shadow:0 0 10px rgba(61,255,110,.8); }
  #startBtn{
    margin:16px 0 4px; background:#1d5c2a; color:#fff; border:2px solid var(--acc);
    border-radius:10px; padding:16px 58px; font-size:clamp(24px,6vw,32px); font-weight:bold;
    letter-spacing:.22em; text-shadow:0 0 12px rgba(255,255,255,.7);
    box-shadow:0 0 26px rgba(61,255,110,.45);
  }
  #startBtn:active{ transform:scale(.97); }
  #togRow{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:16px; max-width:880px; }
  .tog{
    background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px; font-size:13px; font-weight:bold; letter-spacing:.1em; min-height:44px;
  }
  .tog:active{ transform:scale(.96); }
  #futureReady{ margin-top:20px; font-size:10px; letter-spacing:.34em; color:#5d8f6a; text-decoration:none; }
  /* short desktop windows: shrink the hero so START + the whole toggle row fit without scrolling */
  @media (max-height:940px) and (min-width:601px){
    #heroCv{ width:min(640px,100%); }
    h1.title{ margin-top:10px; }
    #hiRow{ margin-top:10px; }
    #startBtn{ margin-top:10px; }
    #togRow{ margin-top:10px; }
    #futureReady{ margin-top:12px; }
  }
  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.78); padding:16px;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--panel); border:1px solid var(--acc); border-radius:12px;
    max-width:620px; width:100%; max-height:88vh; overflow-y:auto; padding:20px 22px;
    box-shadow:0 0 30px rgba(61,255,110,.25);
  }
  .sheet h2{ margin:0 0 12px; letter-spacing:.2em; font-size:20px; text-align:center; }
  .sheet p, .sheet li{ font-size:14.5px; line-height:1.55; letter-spacing:.02em; }
  .sheet ul{ margin:8px 0; padding-left:20px; }
  .sheet .k{ color:var(--acc); font-weight:bold; }
  .closeBtn, .bigBtn{
    display:block; margin:16px auto 2px; background:#17451f; color:#fff; border:1px solid var(--acc);
    border-radius:8px; padding:12px 30px; font-size:16px; font-weight:bold; letter-spacing:.14em; min-height:48px;
  }
  #qrImg{ display:block; margin:6px auto; width:min(240px,62vw); image-rendering:pixelated; border-radius:6px; background:#fff; padding:6px; }
  #qrOverlay.big #qrImg{ width:min(78vmin,420px); }
  #qrUrl{ text-align:center; font-size:12px; color:var(--dim); word-break:break-all; }
  .statRow{ display:flex; justify-content:space-between; font-size:16px; padding:5px 2px; border-bottom:1px dashed #2c5a36; }
</style>
</head>
<body>
<div id="stageWrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="hudBox"><div class="hudLab" data-i18n="score">SCORE</div><div class="hudVal" id="hudScore">0</div></div>
  <div class="hudBox c"><div class="hudLab" data-i18n="wave">WAVE</div><div class="hudVal wave" id="hudWave">1</div></div>
  <div class="hudBox c"><div class="hudLab" data-i18n="zapLab">ZAPS</div><div class="hudVal" id="hudZaps">💥×3</div></div>
  <div class="hudBox r"><div class="hudLab" data-i18n="best">BEST</div><div class="hudVal" id="hudBest">0</div></div>
</div>
<div id="ctrlStrip">
  <button class="stripBtn" id="stripHome" aria-label="Main menu">🏠</button>
  <button class="stripBtn" id="stripReset" aria-label="Restart run">🔁</button>
  <button class="stripBtn" id="stripPause" aria-label="Pause">❚❚</button>
  <button class="stripBtn" id="stripSound" aria-label="Sound on/off">🔊</button>
  <button id="zapBtnMini" aria-label="Gee-Bomb">💥<span id="zapCntMini">×3</span></button>
</div>
<button id="pauseBtn" aria-label="Pause">| |</button>
<button id="zapBtn" aria-label="Gee-Bomb">💥 GEE-BOMB <span id="zapCnt">×3</span></button>


<section id="intro">
  <canvas id="heroCv" width="880" height="587"></canvas>
  <h1 class="title">VECTOR RESCUE &amp; DEFEND</h1>

  <div id="hiRow">

  </div>
  <button id="startBtn" data-i18n="start">START</button>
  <div id="togRow">

    <button class="tog" id="togSound">SOUND: ON</button>
    <button class="tog" id="togControls" data-i18n="controls">CONTROLS</button>
    <button class="tog" id="togHelp" data-i18n="howto">HOW TO PLAY</button>

</section>

  </div>
</div>

    <button class="bigBtn" id="restartBtn" data-i18n="again">RESTART</button>
    <button class="bigBtn" id="quitBtn" data-i18n="quit">QUIT TO TITLE</button>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="sheet" style="text-align:center">
    <h2 data-i18n="gameover">DEFENSE OVER</h2>

    <div class="statRow"><span data-i18n="wave">WAVE</span><b id="ovWave">1</b></div>
    <div class="statRow"><span data-i18n="best">BEST</span><b id="ovBest">0</b></div>

    <button class="bigBtn" id="againBtn" data-i18n="again">RESTART</button>
    <button class="bigBtn" id="titleBtn" data-i18n="quit">QUIT TO TITLE</button>
  </div>
</div>

function drawSmoke(c, sm){
  /* layered soft puffs: swells fast, hangs near-opaque, thins as it fades */
  var fadeIn = Math.min(1, sm.age / 0.25), fadeOut = Math.min(1, (sm.life - sm.age) / 0.9);
  var al = 0.97 * Math.min(fadeIn, fadeOut);
  if(al <= 0) return;
  var R = sm.r * (0.55 + 0.45 * Math.min(1, sm.age / 0.35));
  var puffs = [[0, 0, 0.95], [0.55, 0.12, 0.7], [-0.55, 0.1, 0.72], [0.28, -0.3, 0.62], [-0.3, -0.28, 0.6], [0.05, 0.34, 0.66], [-0.12, 0.05, 0.8], [0, -0.48, 0.6], [0.02, 0.52, 0.62], [0.42, 0.42, 0.55], [-0.42, 0.4, 0.55]];
  for(var i = 0; i < puffs.length; i++){
    var pf = puffs[i];
    var px = sm.x + pf[0] * R + Math.sin(sm.seed + i * 1.7) * R * 0.05, py = sm.y + pf[1] * R, pr = R * pf[2];
    var gr = c.createRadialGradient(px, py, pr * 0.1, px, py, pr);
    gr.addColorStop(0, "rgba(174,184,174," + (al * 0.95).toFixed(3) + ")");
    gr.addColorStop(0.7, "rgba(152,162,152," + (al * 0.72).toFixed(3) + ")");
    gr.addColorStop(1, "rgba(142,152,142,0)");
    c.fillStyle = gr;
    c.beginPath(); c.arc(px, py, pr, 0, Math.PI * 2); c.fill();
  }
}

function drawPerson(c, x, gy, member, sc, waving, t){
  /* little PEOPLE, not stick figures: chibi-proportioned characters with
     skin, hair, faces and colored clothes — a family you want to save.
     Dad broad + deeper skin, Mom lighter with long hair and a dress,
     Boy and Girl at ~60% height in blue and pink. */
  var adult = (member === "mom" || member === "dad");
  var Hh = (adult ? 31 : 19) * sc;                       /* total figure height */
  var headR = Hh * 0.17;
  var headCY = gy - Hh + headR;
  var neckY = headCY + headR * 0.78;
  var hipY = gy - Hh * 0.40;
  var skin = member === "dad" ? "#8a5a33" : member === "mom" ? "#f2c184" : member === "boy" ? "#c68850" : "#f6cf9f";
  var hair = member === "dad" ? "#22150c" : member === "mom" ? "#4a2c14" : member === "boy" ? "#2a1808" : "#6b3d1c";
  var cloth = member === "dad" ? "#35c26e" : member === "mom" ? "#c678f0" : member === "boy" ? "#3a86ff" : "#ff6fa5";
  var legC = member === "dad" ? "#2c3e63" : member === "boy" ? "#274b9f" : skin;
  var torsoW = Hh * (member === "dad" ? 0.21 : 0.165);
  var stride = waving ? Math.sin(t * 9) * Hh * 0.10 : Hh * 0.05;
  c.lineCap = "round";
  /* long hair behind the body (mom + girl) */
  if(member === "mom" || member === "girl"){
    c.fillStyle = hair;
    c.beginPath();
    c.ellipse(x, headCY + headR * 1.0, headR * 1.16, headR * (member === "mom" ? 2.05 : 1.55), 0, 0, Math.PI * 2);
    c.fill();
  }
  /* legs */
  c.strokeStyle = legC; c.lineWidth = Math.max(1.6, Hh * 0.11);
  c.beginPath(); c.moveTo(x - torsoW * 0.4, hipY); c.lineTo(x - torsoW * 0.5 - stride * 0.5, gy); c.stroke();
  c.beginPath(); c.moveTo(x + torsoW * 0.4, hipY); c.lineTo(x + torsoW * 0.5 + stride * 0.5, gy); c.stroke();
  /* torso, or a dress for mom + girl */
  c.fillStyle = cloth;
  c.beginPath();
  if(member === "mom" || member === "girl"){
    c.moveTo(x - torsoW * 0.8, neckY);
    c.lineTo(x + torsoW * 0.8, neckY);
    c.lineTo(x + torsoW * 1.3, hipY + Hh * 0.06);
    c.lineTo(x - torsoW * 1.3, hipY + Hh * 0.06);
    c.closePath();
  } else {
    c.rect(x - torsoW, neckY, torsoW * 2, hipY - neckY + Hh * 0.04);
  }
  c.fill();
  /* arms — one waves while running / parachuting */
  c.strokeStyle = cloth; c.lineWidth = Math.max(1.6, Hh * 0.10);
  var armY = neckY + (hipY - neckY) * 0.18;
  c.beginPath(); c.moveTo(x - torsoW * 0.7, armY); c.lineTo(x - torsoW * 1.55, armY + Hh * 0.16); c.stroke();
  if(waving){
    var wa = Math.sin(t * 7) * 0.45;
    c.beginPath(); c.moveTo(x + torsoW * 0.7, armY);
    c.lineTo(x + torsoW * 0.7 + Math.cos(-0.85 + wa) * Hh * 0.26, armY + Math.sin(-0.85 + wa) * Hh * 0.26); c.stroke();
  } else {
    c.beginPath(); c.moveTo(x + torsoW * 0.7, armY); c.lineTo(x + torsoW * 1.55, armY + Hh * 0.16); c.stroke();
  }
  /* head + face */
  c.fillStyle = skin;
  c.beginPath(); c.arc(x, headCY, headR, 0, Math.PI * 2); c.fill();
  c.fillStyle = hair;
  c.beginPath(); c.arc(x, headCY - headR * 0.14, headR * 1.02, Math.PI * 1.03, Math.PI * 1.97); c.fill();
  if(member === "dad"){   /* flat-top crop */
    c.fillRect(x - headR * 0.92, headCY - headR * 1.04, headR * 1.84, headR * 0.32);
  }
  if(member === "girl"){   /* side ponytail + pink bow */
    c.beginPath(); c.arc(x + headR * 1.02, headCY + headR * 0.3, headR * 0.48, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#ff6fa5";
    c.beginPath(); c.arc(x + headR * 0.9, headCY - headR * 0.78, headR * 0.3, 0, Math.PI * 2); c.fill();
  }
  c.fillStyle = "#1d1410";
  c.beginPath(); c.arc(x - headR * 0.36, headCY + headR * 0.06, Math.max(0.7, headR * 0.11), 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x + headR * 0.36, headCY + headR * 0.06, Math.max(0.7, headR * 0.11), 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#1d1410"; c.lineWidth = Math.max(0.8, headR * 0.09);
  c.beginPath(); c.arc(x, headCY + headR * 0.26, headR * 0.42, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
  if(member !== "dad"){
    c.fillStyle = "rgba(255,120,140,0.55)";
    c.beginPath(); c.arc(x - headR * 0.64, headCY + headR * 0.34, headR * 0.16, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(x + headR * 0.64, headCY + headR * 0.34, headR * 0.16, 0, Math.PI * 2); c.fill();
  }
}

/* ============================== GAME STATE ==============================
   Mechanics ported from Boardwalk Defense into vector form:
   fire() -> shot travels -> makeBoom() grow/hold/shrink sphere that
   chain-destroys; spawnBomb() aimed by pickTarget(); MIRV splitters;
   startWave() escalation; checkAwards() smart bomb every 10,000,
   bonus base every 25,000. Super Zapper on SPACE / the 💥 button:
   wipes every hostile on screen for full points. Fire is buffered
   (0.22s cap) and hold-to-fire. Roster grows a type per wave:
   saucer/dart, then Joker, Twin, Phantom, Carrier.
   The BIRDS became the aliens: pelicans -> saucers cruising with a sine
   bob, dropping on a timer; diving gulls -> darts that stoop low and
   release point-blank, then pull out. */
var state = "title";   // title | playing | paused | over
var G = null;
var aim = { x: 0, y: 0 };
var keys = {};

function basesAlive(){ return G ? G.bases.filter(function(b){ return b.alive; }).length : 0; }

function newGame(){
  G = {
    score: 0, wave: 0, mult: 1, zaps: 3, nextZapAt: 10000, nextBaseAt: 25000,
    buf: null, dropLog: [], shotLog: [],
    zapSeq: null, zapSeqId: 0, bolts: [], rain: [],
    capsules: [], capLadder: 1, capSaved: {}, capSetPaid: false, capLeft: 0, capTimer: 0, capOrder: 0,
    bonus: false, showdown: false, variant: -1, diveSpdMul: 1, quota0: 0, warnT: 0, capSpawned: 0,
    smokes: [],
    bases: BASE_FR.map(function(fr){ return { fr: fr, alive: true }; }),
    cannon: { alive: true, cool: 0, rebuildT: 0 },
    shots: [], booms: [], bombs: [], aliens: [], pops: [], parts: [],
    shipsLeft: 0, spawnTimer: 0, spawnGap: 1, bombSpeed: 110, mirv: 0,
    speedScale: 1, dropScale: 1, diveP: 0.3,
    shake: 0, flash: 0, zapFlash: 0, time: 0, phase: "combat", clearTimer: 0, overTimer: 0, bannerT: 0
  };
  aim.x = W / 2; aim.y = H * 0.35;
  startWave();
  syncHud();
}

/* DIVER EVENT variants (every 10th wave): shared showdown pressure,
   escalating twists — gap multiplier/floor, dive probability, dive-speed
   multiplier, dart cruise-speed multiplier. Cycled II, III… from wave 40. */
var DIVER_VARIANTS = [
  { gapMul: 0.50, gapFloor: 0.28, diveP: 0.95, diveSpd: 1.15, dartSpd: 1.15 },  /* DIVER SHOWDOWN */
  { gapMul: 0.42, gapFloor: 0.24, diveP: 0.97, diveSpd: 1.30, dartSpd: 1.30 },  /* RED STORM */
  { gapMul: 0.38, gapFloor: 0.22, diveP: 1.00, diveSpd: 1.45, dartSpd: 1.40 }   /* KAMIKAZE RAIN */
];

function startWave(){
  G.wave++;
  G.mult = Math.min(1 + Math.floor((G.wave - 1) / 2), 6);
  G.shots.length = 0; G.bombs.length = 0; G.aliens.length = 0; G.booms.length = 0;
  /* Gary's staircase law: EVERY wave steps up a little — gap tightens,
     speeds rise, dive pressure rises, quota grows. Monotonic, no
     plateaus: where the #132 curves flattened (quota 26, gap 0.55,
     diveP 0.6, dropScale 0.5), a slower tail keeps them creeping. */
  var wv = G.wave;
  G.shipsLeft = wv <= 11 ? 6 + (wv - 1) * 2 : 26 + (wv - 11);
  G.spawnGap = 2.0 - wv * 0.11;
  if(G.spawnGap < 0.55) G.spawnGap = Math.max(0.36, 0.55 - (wv - 13) * 0.02);
  G.spawnTimer = 0.9;
  G.bombSpeed = (88 + wv * 12) * V;
  G.mirv = wv >= 4 ? Math.min(0.08 + (wv - 3) * 0.045, 0.38) : 0;
  G.speedScale = 1 + (wv - 1) * 0.05;
  G.dropScale = 1.15 - wv * 0.06;
  if(G.dropScale < 0.5) G.dropScale = Math.max(0.36, 0.5 - (wv - 11) * 0.015);
  G.diveP = Math.min(0.18 + wv * 0.035, 0.6);
  if(wv > 12) G.diveP = Math.min(0.6 + (wv - 12) * 0.01, 0.75);
  G.phase = "combat";
  G.bannerT = 1.8;
  G.capLadder = 1;
  G.capSaved = {};
  G.capSetPaid = false;
  /* every 10th wave is a DIVER EVENT; the other 5s stay family floods.
     Event tuning stacks ON TOP of that wave's escalated base. */
  G.showdown = (G.wave % 10 === 0);
  G.variant = G.showdown ? ((G.wave / 10 - 1) % 3) : -1;
  G.bonus = (G.wave % 5 === 0) && !G.showdown;
  G.diveSpdMul = 1;
  G.warnT = 0;
  if(G.bonus){
    G.spawnGap = Math.max(G.spawnGap * 0.5, 0.28);
    G.bombSpeed *= 1.25;
    G.diveP = Math.min(0.85, G.diveP * 1.6 + 0.1);
    G.spawnTimer = 2.3;   /* the warning buys a breath — then the storm */
    G.warnT = 2.6;
    SFX.klaxon();
  }
  if(G.showdown){
    var dv = DIVER_VARIANTS[G.variant];
    G.shipsLeft = G.shipsLeft * 2;                 /* a much larger quota… */
    G.spawnGap = Math.max(G.spawnGap * dv.gapMul, dv.gapFloor);
    G.diveP = dv.diveP;                            /* …overwhelmingly divers (pickKind)… */
    G.diveSpdMul = dv.diveSpd;                     /* …diving faster and faster */
    G.spawnTimer = 2.3;
    G.warnT = 2.6;
    SFX.klaxon();
  }
  G.quota0 = G.shipsLeft;
  G.capLeft = G.bonus ? 30 : (G.wave >= 2 ? 2 + Math.floor(Math.random() * 3) : 0);
  G.capTimer = G.bonus ? 2.4 : 2.5 + Math.random() * 2.5;
  SFX.waveStart();
  syncHud();
}

function syncHud(){
  $("hudScore").textContent = G ? G.score : 0;
  $("hudWave").textContent = G ? Math.max(1, G.wave) : 1;
  $("hudBest").textContent = best;
  var z = G ? G.zaps : 3;
  $("hudZaps").textContent = "💥×" + z;
  $("zapCnt").textContent = "×" + z;
  $("zapBtn").classList.toggle("empty", z <= 0);
  $("zapCntMini").textContent = "×" + z;
  $("zapBtnMini").classList.toggle("empty", z <= 0);
}

/* named waves: 12-name ladder, then the names cycle with a roman tier */
function roman(n){
  var tab = [[10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]], s = "";
  for(var i = 0; i < tab.length; i++){ while(n >= tab[i][0]){ s += tab[i][1]; n -= tab[i][0]; } }
  return s;
}
function waveName(n){
  if(n % 10 === 0) return showdownTheme(n).name;   /* diver events own their title */
  if(n % 5 === 0) return bonusTheme(n).name;   /* bonus waves carry their theme as the title */
  var names = STR[lang].waveNames || STR.en.waveNames;
  var idx = (n - 1) % 12, tier = Math.floor((n - 1) / 12);
  return names[idx] + (tier > 0 ? " " + roman(tier + 1) : "");
}
/* bonus themes: four rotating parties, one per bonus wave, tiered II, III… */
function bonusTheme(n){
  var themes = STR[lang].bonusThemes || STR.en.bonusThemes;
  var k = Math.ceil(n / 5);
  var th = themes[(k - 1) % 4], tier = Math.floor((k - 1) / 4);
  return { name: th[0] + (tier > 0 ? " " + roman(tier + 1) : ""), sub: th[1] };
}
/* diver events: three rotating crazes (SHOWDOWN / RED STORM / KAMIKAZE
   RAIN), tiered II, III… as the cycle repeats from wave 40 */
function showdownTheme(n){
  var bases = STR[lang].diverBases || STR.en.diverBases;
  var subs = STR[lang].diverSubs || STR.en.diverSubs;
  var k = Math.max(1, Math.round(n / 10));
  var idx = (k - 1) % 3, tier = Math.floor((k - 1) / 3);
  return { name: bases[idx] + (tier > 0 ? " " + roman(tier + 1) : "") + "!", sub: subs[idx] };
}

/* award economy — checked the moment points land:
   every 10,000 -> +1 smart bomb (cap 5, threshold advances regardless);
   every 25,000 -> rebuild one lost base. */
var ZAP_MAX = 5;
function checkAwards(){
  if(!G) return;
  while(G.score >= G.nextZapAt){
    G.nextZapAt += 10000;
    if(G.zaps < ZAP_MAX){
      G.zaps++;
      G.pops.push({ x: W / 2, y: H * 0.34, txt: T("zapAward"), age: 0, big: true });
      SFX.charge();
    }
  }
  while(G.score >= G.nextBaseAt){
    G.nextBaseAt += 25000;
    for(var i = 0; i < G.bases.length; i++){
      if(!G.bases[i].alive){
        G.bases[i].alive = true;
        G.pops.push({ x: G.bases[i].fr * W, y: groundY - 58 * S, txt: T("rebuilt"), age: 0, big: true });
        burst(G.bases[i].fr * W, groundY - 14 * S, "#3dff6e", 10);
        SFX.construct();
        break;
      }
    }
  }
  syncHud();
}

function zapDenied(){
  /* shake whichever G-BOMB button is on screen (pill on desktop, dock on phone) */
  [$("zapBtn"), $("zapBtnMini")].forEach(function(b){
    b.classList.remove("denied");
    void b.offsetWidth;
    b.classList.add("denied");
  });
}

/* G-BOMB — a ~0.9s event, not an instant wipe: a flash pulse, then a
   shockwave ring sweeps out from the cannon (Tempest warp feel) and
   hostiles die in rapid sequence, nearest first, as the ring reaches
   them — lightning bolt, burst, score popup each. A splash of Matrix
   rain runs behind it. A faded Phantom is not really there: the ring
   passes through it and it survives. Empty sky: no spend. */
function zap(){
  if(state !== "playing" || !G || G.phase !== "combat") return;
  if(G.zapSeq) return;
  if(G.zaps <= 0){ G.shake = Math.max(G.shake, 3); zapDenied(); SFX.deny(); return; }
  var mx = CANNON_FR * W, my = groundY - 9 * S, far = 0, any = false, i, a;
  for(i = 0; i < G.bombs.length; i++){
    any = true;
    far = Math.max(far, Math.hypot(G.bombs[i].x - mx, G.bombs[i].y - my));
  }
  for(i = 0; i < G.aliens.length; i++){
    a = G.aliens[i];
    if(a.kind === "phantom" && !a.solid) continue;
    any = true;
    far = Math.max(far, Math.hypot(a.x - mx, a.y - my));
  }
  if(!any) return;
  G.zaps--;
  G.buf = null;
  var diag = Math.hypot(Math.max(mx, W - mx), my);
  G.zapSeq = { t: 0, dur: 0.9, r: 0, id: ++G.zapSeqId, rainAcc: 0,
               speed: Math.max(far / 0.5, diag / 0.75, 700) };
  G.zapFlash = 1;
  G.shake = Math.max(G.shake, 4);
  SFX.zap();
  syncHud();
}
function boltTo(x, y){
  if(!G) return;
  var mx = CANNON_FR * W, my = groundY - 9 * S;
  var dx = x - mx, dy = y - my, len = Math.hypot(dx, dy) || 1, px = -dy / len, py = dx / len;
  var pts = [], seg = 5;
  for(var i = 0; i <= seg; i++){
    var f = i / seg;
    var off = (i === 0 || i === seg) ? 0 : (Math.random() - 0.5) * len * 0.14;
    pts.push([mx + dx * f + px * off, my + dy * f + py * off]);
  }
  G.bolts.push({ pts: pts, age: 0 });
  if(G.bolts.length > 42) G.bolts.splice(0, G.bolts.length - 42);
}
function zapSeqStep(dt){
  var zs = G.zapSeq;
  if(!zs) return;
  zs.t += dt;
  zs.r = zs.speed * zs.t;
  var mx = CANNON_FR * W, my = groundY - 9 * S, j, bm, al;
  for(j = G.bombs.length - 1; j >= 0; j--){
    bm = G.bombs[j];
    if(Math.hypot(bm.x - mx, bm.y - my) <= zs.r + 6){
      G.bombs.splice(j, 1);
      boltTo(bm.x, bm.y);
      burst(bm.x, bm.y, "#ff8fb5", 6);
      addScore(25, bm.x, bm.y, Math.round(25 * Math.max(0, 1 - bm.y / groundY)), true);
      SFX.bombKill(Math.round(25 * Math.max(0, 1 - bm.y / groundY)));
    }
  }
  for(j = G.aliens.length - 1; j >= 0; j--){
    al = G.aliens[j];
    if(Math.hypot(al.x - mx, al.y - my) <= zs.r + al.r){
      if(al.kind === "phantom" && !al.solid){ al.zapExempt = zs.id; continue; }
      if(al.zapExempt === zs.id) continue;
      G.aliens.splice(j, 1);
      boltTo(al.x, al.y);
      burst(al.x, al.y, alienColor(al.kind), 10);
      addScore(alienValue(al.kind), al.x, al.y, 0, true);
      SFX.alien(al.kind);
    }
  }
  /* Matrix touch: brief cascading green streak rain while it runs */
  zs.rainAcc += dt * 120;
  while(zs.rainAcc >= 1){
    zs.rainAcc -= 1;
    if(G.rain.length < 110) G.rain.push({ x: Math.random() * W, y: -30, vy: (300 + Math.random() * 340) * V,
                                          len: (14 + Math.random() * 30) * S, age: 0, life: 1.1 });
  }
  if(zs.t >= zs.dur) G.zapSeq = null;
}
function addScore(base, x, y, heightBonus, zapHalf){
  var pts = (base + (heightBonus || 0)) * G.mult;
  /* Gary's rebalance (Oct 24, from his own playtest — his final call was a
     third, not a half): GEE-BOMB kills pay ONE THIRD — the bomb is a
     lifesaver, not a jackpot. Smart bomb timing was refunding itself
     through the 10k/25k award ladders; at a third, the cannon has to earn
     the run. */
  if(zapHalf) pts = Math.round(pts / 3);
  G.score += pts;
  if(x !== undefined) G.pops.push({ x: x, y: y, txt: "+" + pts, age: 0, big: false });
  checkAwards();
  syncHud();
}
function burst(x, y, color, n){
  if(G.parts.length > 480) return;   /* hard ceiling: particle floods are pure canvas cost */
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2, sp = (40 + Math.random() * 130) * S;
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30 * S,
                   age: 0, life: 0.45 + Math.random() * 0.4, color: color,
                   len: (4 + Math.random() * 7) * S, rot: a, vr: (Math.random() - 0.5) * 9 });
  }
}

/* ---------------- FAMILY CAPSULES — save the people (wave 2+) ----------------
   Friendly gold pods drift down with a family member inside, cycling
   MOM -> DAD -> BOY -> GIRL. A boom POPS one open (never harms it): the
   person parachutes down and the save pays on landing — a per-wave
   ladder 1000/2000/3000/4000/5000, all four in one wave = +2500.
   A capsule that hits the ground unopened cracks: MISSED!, the person
   runs off waving, and the ladder resets on the spot. Save points are
   FLAT (no wave multiplier) but flow through the award thresholds.
   Capsules are not hostiles: the G-BOMB ignores them, they never count
   toward wave-clear, and they are NOT cleared at wave end — one still
   falling finishes its fall across the break (a pop during the break
   still counts to the old wave's ladder); ladder + saved set reset in
   startWave(). */
var MEMBERS = ["mom", "dad", "boy", "girl"];
function awardFlat(pts, x, y, txt){
  G.score += pts;
  if(txt) G.pops.push({ x: x, y: y, txt: txt, age: 0, big: true });
  checkAwards();
  syncHud();
}
function spawnCapsule(){
  var member = MEMBERS[G.capOrder % 4];
  G.capOrder++;
  G.capSpawned++;
  G.capsules.push({ member: member, x: W * (0.12 + Math.random() * 0.76), y: -34 * S,
    vy: G.bombSpeed * 0.4 * (0.9 + Math.random() * 0.2), age: 0, swayPh: Math.random() * 6.28,
    state: "fall", t: 0, dirRun: 1, savedFlag: false });
  SFX.capBeacon();
}
function popCapsule(cp){
  cp.state = "chute";
  cp.vy = Math.max(46 * V, (groundY - 13 * S - cp.y) / 2);   /* ~2s drift down, feet land on the ground line */
  burst(cp.x, cp.y, "#ffd76a", 10);
  burst(cp.x, cp.y, "#9be9ff", 6);
  SFX.capPop();
}
function registerSave(cp){
  /* bonus waves: the ladder CYCLES 1000→…→5000→1000…; normal waves cap at 5000 as before */
  var n = G.bonus ? ((G.capLadder - 1) % 5) + 1 : Math.min(G.capLadder, 5), pts = n * 1000;
  G.capLadder++;
  G.capSaved[cp.member] = true;
  var key = "save" + cp.member.charAt(0).toUpperCase() + cp.member.slice(1);
  awardFlat(pts, cp.x, groundY - 64 * S, T(key) + " +" + pts);
  SFX.rescue(n);
  burst(cp.x, groundY - 16 * S, "#ffd76a", 12);
  if(G.capSaved.mom && G.capSaved.dad && G.capSaved.boy && G.capSaved.girl && !G.capSetPaid){
    G.capSetPaid = true;
    awardFlat(2500, W / 2, H * 0.3, T("familySaved"));
    SFX.fanfare();
    if(G.bonus){ G.capSaved = {}; G.capSetPaid = false; }   /* in the flood, the next set can pay again */
  }
}
function updateCapsules(dt){
  for(var i = G.capsules.length - 1; i >= 0; i--){
    var cp = G.capsules[i];
    cp.age += dt;
    if(cp.state === "fall"){
      cp.y += cp.vy * dt;
      cp.x += Math.sin(cp.age * 1.6 + cp.swayPh) * 20 * S * dt;
      if(cp.y >= groundY - 22 * S){
        cp.state = "run"; cp.t = 0; cp.savedFlag = false;
        cp.dirRun = cp.x < W / 2 ? -1 : 1;
        cp.y = groundY - 9 * S;
        G.capLadder = 1;   /* the chain breaks the moment one is missed */
        G.pops.push({ x: cp.x, y: groundY - 60 * S, txt: T("missedCap"), age: 0, big: true });
        burst(cp.x, groundY - 10 * S, "#ffd76a", 8);
        SFX.missed();
      }
    } else if(cp.state === "chute"){
      cp.y += cp.vy * dt;
      cp.x += Math.sin(cp.age * 1.2 + cp.swayPh) * 12 * S * dt;
      if(cp.y >= groundY - 13 * S){
        cp.y = groundY - 13 * S;
        registerSave(cp);
        cp.state = "run"; cp.t = 0; cp.savedFlag = true;
        cp.dirRun = cp.x < W / 2 ? -1 : 1;
      }
    } else {   /* run: saved or escaped — waving all the way off-screen */
      cp.t += dt;
      cp.x += cp.dirRun * 95 * V * dt;
      if(cp.x < -34 || cp.x > W + 34) G.capsules.splice(i, 1);
    }
  }
}

/* ---------------- Firing (Boardwalk fire/makeBoom) ---------------- */
function fire(tx, ty){
  if(state !== "playing" || !G || G.phase === "over") return;
  if(G.zapSeq) return;   /* firing is locked while the G-BOMB sequence runs */
  if(!G.cannon.alive || G.cannon.cool > 0) return;
  ty = Math.max(6, Math.min(ty, groundY - 12 * S));
  tx = Math.max(4, Math.min(tx, W - 4));
  var mx = CANNON_FR * W, my = groundY - 9 * S;
  var d = Math.hypot(tx - mx, ty - my);
  G.cannon.cool = 0.22;
  G.shots.push({ sx: mx, sy: my, x: mx, y: my, tx: tx, ty: ty, t: 0, dur: Math.max(0.1, d / (1300 * V)) });
  G.shotLog.push(G.time);
  if(G.shotLog.length > 400) G.shotLog.splice(0, G.shotLog.length - 400);   /* debug log: never grow unbounded */
  SFX.fire();
}
/* buffered fire: a press that lands during cooldown is never dropped —
   ONE shot queues (latest press wins) and leaves the instant the
   cooldown expires. Sustained pressing = continuous max-rate fire. */
function requestFire(tx, ty){
  if(state !== "playing" || !G || G.phase === "over") return;
  if(G.zapSeq) return;
  if(!G.cannon.alive) return;
  if(G.cannon.cool <= 0) fire(tx, ty);
  else G.buf = { x: tx, y: ty };
}
function makeBoom(x, y, r, chain, fromShot){
  /* at cap, expire the oldest boom in place instead of splicing index 0:
     a splice would shift indices under the backwards booms update loop */
  if(G.booms.length > 18){ var ob = G.booms[0]; ob.age = ob.grow + ob.hold + ob.shrink + 1; }
  G.booms.push({ x: x, y: y, r: 0, maxR: r, age: 0, grow: 0.26, hold: 0.3, shrink: 0.48, chain: !!chain, shot: !!fromShot, kills: 0 });
}
function boomR(){ return Math.max(34, Math.min(62, W * 0.055)) * 1.25; }

/* ---------------- Spawning (Boardwalk pickTarget/spawnBomb) ---------------- */
function pickTargetFr(){
  var pool = [];
  G.bases.forEach(function(b){ if(b.alive) pool.push(b.fr); });
  if(G.cannon.alive) pool.push(CANNON_FR);
  if(!pool.length) pool = [0.2 + Math.random() * 0.6];
  return pool[Math.floor(Math.random() * pool.length)];
}
function spawnBomb(sx, sy, kind, forcedFr, src){
  var tfr = (forcedFr !== undefined) ? forcedFr : pickTargetFr();
  var tx = tfr * W + (Math.random() * 18 - 9) * S, ty = groundY;
  var dx = tx - sx, dy = ty - sy, len = Math.hypot(dx, dy) || 1;
  var sp = G.bombSpeed * (0.85 + Math.random() * 0.35);
  G.bombs.push({ x: sx, y: sy, vx: dx / len * sp, vy: dy / len * sp, kind: kind || "pod",
                 split: kind === "mother", splitAt: 0.32 + Math.random() * 0.28,
                 trail: [], wob: Math.random() * 6.28 });
  if(src && G.dropLog){ G.dropLog.push({ t: Math.round(G.time * 1000), src: src }); if(G.dropLog.length > 400) G.dropLog.splice(0, G.dropLog.length - 400); }
  if(src) SFX.drop(src);   /* alien plasma warning blip (alien drops only) */
}
/* ---------------- the roster: one new type per wave ---------------- */
function alienValue(kind){
  return kind === "dart" ? 150 : kind === "joker" ? 200 : kind === "twin" ? 250 :
         (kind === "phantom" || kind === "carrier" || kind === "alien") ? 300 : 100;
}
function alienColor(kind){
  return kind === "dart" ? "#ff9f43" : kind === "joker" ? "#a6ff00" : kind === "phantom" ? "#c9fbff" :
         kind === "carrier" ? "#ffb84d" : kind === "alien" ? "#64ff9e" : "#ff5ee1";
}
function carrierAlive(){ return G.aliens.some(function(a){ return a.kind === "carrier"; }); }
function pickKind(){
  var w = G.wave;
  /* diver events: the red darts are the whole show (~85%), the rest of
     the roster only guests — never dominant, the Alien included */
  if(G.showdown && Math.random() < 0.85) return "dart";
  if(w >= 6 && Math.random() < 0.10 && !carrierAlive()) return "carrier";
  var r = Math.random(), acc = 0;
  if(w >= 3){ acc += 0.20; if(r < acc) return "joker"; }
  if(w >= 4){ acc += 0.18; if(r < acc) return "twin"; }
  if(w >= 5){ acc += 0.15; if(r < acc) return "phantom"; }
  if(w >= 3){ acc += Math.min(0.05 + (w - 3) * 0.008, 0.12); if(r < acc) return "alien"; }
  return Math.random() < Math.min(0.3 + w * 0.02, 0.55) ? "dart" : "saucer";
}
function makeAlien(kind, dir){
  var y = H * (0.09 + Math.random() * 0.26), raw, r, wobA = (8 + Math.random() * 15) * S;
  if(kind === "dart"){ raw = 118 + Math.random() * 46; r = 13 * S; }
  else if(kind === "joker"){ raw = 74 + Math.random() * 36; r = 17 * S; wobA = (22 + Math.random() * 10) * S; }
  else if(kind === "twin"){ raw = 52 + Math.random() * 26; r = 24 * S; wobA = 4 * S; }
  else if(kind === "phantom"){ raw = 58 + Math.random() * 30; r = 17 * S; }
  else if(kind === "carrier"){ raw = 26 + Math.random() * 10; r = 34 * S; y = H * (0.05 + Math.random() * 0.06); wobA = 3 * S; }
  else if(kind === "alien"){ raw = 62 + Math.random() * 26; r = 16 * S; wobA = (10 + Math.random() * 8) * S; }
  else { kind = "saucer"; raw = 58 + Math.random() * 36; r = 17 * S; }
  var spd = raw * V * G.speedScale;
  if(kind === "dart" && G.showdown) spd *= DIVER_VARIANTS[G.variant].dartSpd;   /* diver events breed faster darts */
  return {
    kind: kind, dir: dir, x: 0, y: y, baseY: y,
    vx: dir * spd, vy: 0, spd: spd, age: 0, wobPh: Math.random() * 6.28,
    wobF: 1.6 + Math.random() * 1.6, wobA: wobA,
    dropT: 0.9 + Math.random() * 1.5, mode: "cruise", dived: false,
    diveX: W * (0.15 + Math.random() * 0.7), tfr: 0.5, tx: 0, ty: 0, bank: 0,
    r: r, solid: true, blinkOff: Math.random() * 2, launchT: 2 + Math.random() * 2,
    fakeT: 2 + Math.random() * 3, fakePh: 0, laughs: 0,
    smokeT: 5 + Math.random() * 3, wanderT: 1 + Math.random() * 1.5
  };
}
/* KAMIKAZE RAIN: darts commit almost the moment they're on screen —
   their dive trigger sits just inside the entry edge, not mid-field */
function tuneDive(a){
  if(G.showdown && G.variant === 2 && a.kind === "dart"){
    var f = 0.04 + Math.random() * 0.15;
    a.diveX = a.dir > 0 ? W * f : W * (1 - f);
  }
}
function spawnAlien(forceKind){
  var a = makeAlien(forceKind || pickKind(), Math.random() < 0.5 ? 1 : -1);
  a.x = a.dir > 0 ? -(a.r + 20 * S) : W + a.r + 20 * S;
  tuneDive(a);
  G.aliens.push(a);
  return a;
}
function spawnAlienAt(kind, x, y, dir){
  var a = makeAlien(kind, dir);
  a.x = x; a.y = y; a.baseY = y;
  tuneDive(a);
  G.aliens.push(a);
  return a;
}
function steerAlien(a, tx, ty, dt, turnRate){
  var cur = Math.atan2(a.vy, a.vx), des = Math.atan2(ty - a.y, tx - a.x);
  var diff = des - cur;
  while(diff > Math.PI) diff -= Math.PI * 2;
  while(diff < -Math.PI) diff += Math.PI * 2;
  var maxTurn = turnRate * dt;
  var na = cur + Math.max(-maxTurn, Math.min(maxTurn, diff));
  a.vx = Math.cos(na) * a.spd; a.vy = Math.sin(na) * a.spd;
}

/* ---------------- Update ---------------- */
function update(dt){
  if(!G) return;
  G.time += dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt * 26);
  if(G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.2);
  if(G.zapFlash > 0) G.zapFlash = Math.max(0, G.zapFlash - dt * 2.4);
  if(G.bannerT > 0) G.bannerT -= dt;
  if(G.warnT > 0) G.warnT -= dt;
  /* 👽 smoke clouds: drift a little, thin out, gone at exactly ~3s.
     Pure blind spot — nothing under them pauses or changes. */
  for(var si = G.smokes.length - 1; si >= 0; si--){
    var sm = G.smokes[si];
    sm.age += dt; sm.x += sm.vx * dt; sm.y -= 3 * S * dt;
    if(sm.age >= sm.life) G.smokes.splice(si, 1);
  }
  /* sustained caps: popups + particles are per-frame canvas cost — bound them */
  if(G.pops.length > 24) G.pops.splice(0, G.pops.length - 24);
  if(G.parts.length > 420) G.parts.splice(0, G.parts.length - 420);
  if(G.cannon.cool > 0) G.cannon.cool -= dt;
  var i, j;

  /* keyboard crosshair */
  var kSpd = 460 * dt;
  if(keys.ArrowLeft) aim.x -= kSpd; if(keys.ArrowRight) aim.x += kSpd;
  if(keys.ArrowUp) aim.y -= kSpd; if(keys.ArrowDown) aim.y += kSpd;
  aim.x = Math.max(4, Math.min(W - 4, aim.x)); aim.y = Math.max(4, Math.min(groundY - 6, aim.y));
  /* the buffered shot leaves the instant the cooldown expires */
  if(G.buf && !G.zapSeq && G.cannon.alive && G.cannon.cool <= 0){
    var bf = G.buf; G.buf = null;
    if(state === "playing" && G.phase !== "over") fire(bf.x, bf.y);
  }
  /* hold-to-fire: continuous max-rate fire toward the held point */
  if(ptrHeld && state === "playing") requestFire(aim.x, aim.y);

  /* G-BOMB sequence: the shockwave ring sweeps outward from the cannon */
  zapSeqStep(dt);

  if(G.phase === "combat"){
    /* alien spawner */
    if(G.shipsLeft > 0){
      G.spawnTimer -= dt;
      if(G.spawnTimer <= 0){ spawnAlien(); G.shipsLeft--; G.spawnTimer = G.spawnGap * (0.65 + Math.random() * 0.7); }
    }
    /* family capsules (wave 2+): 2-4 friendly pods a wave; a bonus wave rains ~30 */
    if(G.wave >= 2 && G.capLeft > 0){
      G.capTimer -= dt;
      if(G.capTimer <= 0){ spawnCapsule(); G.capLeft--; G.capTimer = G.bonus ? 1.1 : 3.5 + Math.random() * 3; }
    }
    /* wave clear? (Boardwalk) */
    if(G.shipsLeft <= 0 && G.aliens.length === 0 && G.bombs.length === 0 && G.shots.length === 0){
      var bonus = basesAlive() * 100 + (G.cannon.alive ? 50 : 0);
      G.score += bonus;
      G.pops.push({ x: W / 2, y: H * 0.36, txt: T("waveBonus") + " +" + bonus, age: 0, big: true });
      checkAwards(); syncHud();
      SFX.waveClear();
      G.phase = "clear"; G.clearTimer = 2.2;
    }
  }
  else if(G.phase === "clear"){
    G.clearTimer -= dt;
    if(G.clearTimer <= 0) startWave();
  }
  else if(G.phase === "over"){
    G.overTimer -= dt;
    if(G.overTimer <= 0) showGameOver();
  }

  /* cannon rebuild — only while a base stands (Boardwalk checkRebuild idea) */
  if(!G.cannon.alive && G.phase !== "over"){
    if(basesAlive() > 0){
      G.cannon.rebuildT -= dt;
      if(G.cannon.rebuildT <= 0){
        G.cannon.alive = true;
        G.pops.push({ x: CANNON_FR * W, y: groundY - 52 * S, txt: T("cannonBack"), age: 0, big: true });
        burst(CANNON_FR * W, groundY - 10 * S, "#9be9ff", 10);
        SFX.powerUp();
      }
    }
  }

  /* aliens — the birds' flight, ported */
  for(i = G.aliens.length - 1; i >= 0; i--){
    var a = G.aliens[i];
    a.age += dt;
    if(a.kind === "phantom"){ var ph = (a.age + a.blinkOff) % 2; a.solid = ph < 1.15; }
    if(a.mode === "cruise"){
      var prevY = a.y;
      a.x += a.vx * dt;
      if(a.kind === "alien"){
        /* 👽 the Alien wanders: re-picks a heading every second or two,
           flips direction, drifts between sky bands, bounces off the
           field edges instead of leaving. His only weapon is smoke. */
        a.wanderT -= dt;
        if(a.wanderT <= 0){
          a.wanderT = 1 + Math.random() * 1.6;
          /* outer bands always turn him back toward the field — he
             roams the whole sky but never wanders off and despawns */
          if(a.x < W * 0.28) a.dir = 1;
          else if(a.x > W * 0.72) a.dir = -1;
          else if(Math.random() < 0.45) a.dir = -a.dir;
          a.vx = a.dir * a.spd * (0.55 + Math.random() * 0.6);
          a.baseY = H * (0.08 + Math.random() * 0.3);
        }
        a.y += ((a.baseY + Math.sin(a.age * a.wobF + a.wobPh) * a.wobA) - a.y) * Math.min(1, dt * 2.2);
        if(a.x > 0 && a.x < 34 * S && a.vx < 0){ a.dir = 1; a.vx = Math.abs(a.vx); }
        if(a.x < W && a.x > W - 34 * S && a.vx > 0){ a.dir = -1; a.vx = -Math.abs(a.vx); }
        if(G.phase === "combat"){
          a.smokeT -= dt;
          if(a.smokeT <= 0){
            a.smokeT = 6 + Math.random() * 2;   /* next pop in ~6–8s, spent either way */
            if(G.smokes.length < 2) G.smokes.push({ x: a.x, y: a.y + 10 * S, r: 84 * S, age: 0, life: 3, vx: (Math.random() * 16 - 8) * S, seed: Math.random() * 10 });
          }
        }
      }
      else if(a.kind === "joker"){
        /* erratic zigzag cruise; now and then it fakes a dive — tips down, pulls back up, drops nothing */
        var zz = (a.age * 1.5 + a.wobPh) % 2, tri = zz < 1 ? zz : 2 - zz, fo = 0;
        if(a.fakePh > 0){ a.fakePh -= dt; fo = Math.sin(Math.PI * Math.max(0, 1 - a.fakePh / 1.5)) * 85 * S; }
        else { a.fakeT -= dt; if(a.fakeT <= 0){ a.fakePh = 1.5; a.fakeT = 2.5 + Math.random() * 3.5; if(a.x > 0 && a.x < W) SFX.taunt(); } }
        a.y = a.baseY + (tri * 2 - 1) * a.wobA + fo;
      } else {
        a.y = a.baseY + Math.sin(a.age * a.wobF + a.wobPh) * a.wobA;
      }
      var vyI = dt > 0 ? (a.y - prevY) / dt : 0;
      var bTgt = Math.max(-0.3, Math.min(0.3, vyI * 0.0016)) * (a.dir > 0 ? 1 : -1) * (a.kind === "dart" ? 0.4 : 1);
      a.bank += (bTgt - a.bank) * Math.min(1, dt * 8);
      /* the Carrier launches darts instead of dropping bombs */
      if(a.kind === "carrier" && G.phase === "combat"){
        a.launchT -= dt;
        if(a.launchT <= 0){
          a.launchT = 4;
          var nd = 0;
          G.aliens.forEach(function(o){ if(o.kind === "dart") nd++; });
          if(nd < 4) spawnAlienAt("dart", a.x, a.y + 26 * S, a.dir);
        }
      }
      /* drop on a timer while over the field (pelican behavior) —
         the Carrier launches instead, and the Alien NEVER drops bombs */
      if(G.phase === "combat" && a.kind !== "carrier" && a.kind !== "alien" && a.solid !== false && a.x > 26 && a.x < W - 26){
        a.dropT -= dt;
        if(a.dropT <= 0){
          if(a.kind === "twin"){
            spawnBomb(a.x - 14 * S, a.y + 9 * S, Math.random() < G.mirv ? "mother" : "pod", undefined, a.kind);
            spawnBomb(a.x + 14 * S, a.y + 9 * S, Math.random() < G.mirv ? "mother" : "pod", undefined, a.kind);
          } else {
            spawnBomb(a.x, a.y + 9 * S, Math.random() < G.mirv ? "mother" : "pod", undefined, a.kind);
            if(a.kind === "joker"){ a.laughs++; SFX.laugh(); }
          }
          a.dropT = (1.05 + Math.random() * 1.3) * G.dropScale;
        }
      }
      /* peel off into a stoop (diving-gull behavior) — saucers and darts only */
      if(!a.dived && G.phase === "combat" && (a.kind === "saucer" || a.kind === "dart") &&
         ((a.dir > 0 && a.x > a.diveX) || (a.dir < 0 && a.x < a.diveX))){
        a.dived = true;
        if(Math.random() < G.diveP * (a.kind === "dart" ? 1.5 : 0.8)){
          a.mode = "dive";
          a.tfr = pickTargetFr();
          a.tx = a.tfr * W; a.ty = groundY - 150 * S;
          a.vy = a.spd * 0.25;
        }
      }
      if(a.x < -60 * S || a.x > W + 60 * S) G.aliens.splice(i, 1);
    }
    else if(a.mode === "dive"){
      a.spd = Math.min(a.spd + 240 * V * dt, (a.kind === "dart" ? 300 : 230) * V * G.speedScale * (a.kind === "dart" ? G.diveSpdMul : 1));
      steerAlien(a, a.tx, a.ty, dt, 2.4);
      a.x += a.vx * dt; a.y += a.vy * dt;
      a.bank = Math.max(-0.5, Math.min(0.5, a.bank + ((a.vx > 0 ? 0.35 : -0.35) - a.bank) * Math.min(1, dt * 5)));
      /* point-blank release, then pull out */
      if(a.y >= groundY - 165 * S || Math.hypot(a.tx - a.x, a.ty - a.y) < 34 * S){
        if(G.phase === "combat") spawnBomb(a.x, a.y + 6 * S, "pod", a.tfr, a.kind);
        a.mode = "leave";
        a.tx = a.x + a.dir * W * 0.45; a.ty = -70;
        a.spd = Math.max(a.spd, 170 * V);
      }
      if(a.y >= groundY - 4){ /* stooped too far — crashes on the ground */
        hitGround({ x: a.x, y: groundY, kind: "pod" });
        burst(a.x, groundY - 8 * S, alienColor(a.kind), 10);
        G.aliens.splice(i, 1);
      }
    }
    else { /* leave */
      steerAlien(a, a.tx, a.ty, dt, 1.9);
      a.x += a.vx * dt; a.y += a.vy * dt;
      if(a.x < -70 * S || a.x > W + 70 * S || a.y < -80) G.aliens.splice(i, 1);
    }
  }

  /* shots (Boardwalk) */
  for(i = G.shots.length - 1; i >= 0; i--){
    var s = G.shots[i];
    s.t += dt / s.dur;
    if(s.t >= 1){ makeBoom(s.tx, s.ty, boomR(), false, true); SFX.boom(false); G.shots.splice(i, 1); }
    else { s.x = s.sx + (s.tx - s.sx) * s.t; s.y = s.sy + (s.ty - s.sy) * s.t; }
  }

  /* explosions — kills chain (Boardwalk) */
  for(i = G.booms.length - 1; i >= 0; i--){
    var b = G.booms[i];
    b.age += dt;
    var total = b.grow + b.hold + b.shrink;
    if(b.age < b.grow) b.r = b.maxR * (b.age / b.grow);
    else if(b.age < b.grow + b.hold) b.r = b.maxR;
    else if(b.age < total) b.r = b.maxR * (1 - (b.age - b.grow - b.hold) / b.shrink);
    else { G.booms.splice(i, 1); continue; }
    if(b.r < 4) continue;
    /* bombs caught inside */
    for(j = G.bombs.length - 1; j >= 0; j--){
      var bm = G.bombs[j], dx = bm.x - b.x, dy = bm.y - b.y;
      if(dx * dx + dy * dy < (b.r + 6) * (b.r + 6)){
        G.bombs.splice(j, 1);
        b.kills++;
        var hb = Math.round(25 * Math.max(0, 1 - bm.y / groundY));   /* height bonus */
        addScore(25, bm.x, bm.y, hb);
        makeBoom(bm.x, bm.y, boomR() * 0.78, true);
        burst(bm.x, bm.y, "#ff8fb5", 5);
        SFX.bombKill(hb);
      }
    }
    /* aliens caught inside — a faded Phantom is not really there */
    for(j = G.aliens.length - 1; j >= 0; j--){
      var al = G.aliens[j], ax = al.x - b.x, ay = al.y - b.y, rr = b.r + al.r;
      if(ax * ax + ay * ay < rr * rr && !(al.kind === "phantom" && !al.solid)){
        G.aliens.splice(j, 1);
        b.kills++;
        addScore(alienValue(al.kind), al.x, al.y, 0);
        makeBoom(al.x, al.y, boomR() * 0.78, true);
        burst(al.x, al.y, alienColor(al.kind), 9);
        SFX.alien(al.kind);
      }
    }
    /* family capsules caught inside — a boom pops them open, never harms */
    for(j = G.capsules.length - 1; j >= 0; j--){
      var cp2 = G.capsules[j];
      if(cp2.state !== "fall") continue;
      var cx2 = cp2.x - b.x, cy2 = cp2.y - b.y, cr2 = b.r + 21 * S;
      if(cx2 * cx2 + cy2 * cy2 < cr2 * cr2) popCapsule(cp2);
    }
  }

  /* bombs */
  for(i = G.bombs.length - 1; i >= 0; i--){
    var m = G.bombs[i];
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.trail.push({ x: m.x, y: m.y });
    if(m.trail.length > 14) m.trail.shift();
    /* MIRV split (Boardwalk) */
    if(m.split && m.y > H * m.splitAt){
      m.split = false;
      var kids = (G.wave >= 7 && Math.random() < 0.3) ? 3 : 2;
      for(var k = 0; k < kids; k++){
        var cfr = pickTargetFr();
        var ctx2 = cfr * W + (Math.random() * 18 - 9) * S, cty = groundY;
        var ddx = ctx2 - m.x, ddy = cty - m.y, ln = Math.hypot(ddx, ddy) || 1;
        var sp2 = Math.hypot(m.vx, m.vy);
        G.bombs.push({ x: m.x, y: m.y, vx: ddx / ln * sp2, vy: ddy / ln * sp2, kind: "shard",
                       split: false, splitAt: 1, trail: [], wob: Math.random() * 6.28 });
      }
      burst(m.x, m.y, "#ff3131", 4);
      SFX.split();
      G.bombs.splice(i, 1);
      continue;
    }
    if(m.y >= groundY - 2){
      hitGround(m);
      G.bombs.splice(i, 1);
    }
  }

  /* family capsules drift, pop, land, run */
  updateCapsules(dt);

  /* G-BOMB lightning bolts + matrix rain */
  for(i = G.bolts.length - 1; i >= 0; i--){
    G.bolts[i].age += dt;
    if(G.bolts[i].age > 0.18) G.bolts.splice(i, 1);
  }
  for(i = G.rain.length - 1; i >= 0; i--){
    var rn = G.rain[i];
    rn.age += dt; rn.y += rn.vy * dt;
    if(rn.age > rn.life || rn.y - rn.len > H) G.rain.splice(i, 1);
  }

  /* particles + popups */
  for(i = G.parts.length - 1; i >= 0; i--){
    var p = G.parts[i];
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * S * dt; p.rot += p.vr * dt;
    if(p.age > p.life) G.parts.splice(i, 1);
  }
  for(i = G.pops.length - 1; i >= 0; i--){
    var pp = G.pops[i];
    pp.age += dt; pp.y -= 24 * S * dt;
    if(pp.age > 1.1) G.pops.splice(i, 1);
  }
}

function hitGround(m){
  makeBoom(m.x, groundY - 4 * S, boomR() * 0.82, false);
  SFX.boom(true);
  G.shake = 6; G.flash = 0.3;
  burst(m.x, groundY - 6 * S, "#ffd76a", 10);
  var bw = baseW();
  for(var i = 0; i < G.bases.length; i++){
    var bs = G.bases[i];
    if(bs.alive && Math.abs(m.x - bs.fr * W) < bw * 0.62){
      bs.alive = false;
      burst(m.x, groundY - 14 * S, "#3dff6e", 16);
      G.pops.push({ x: bs.fr * W, y: groundY - 62 * S, txt: T("baseDown"), age: 0, big: true });
      SFX.baseLost();
    }
  }
  if(G.cannon.alive && Math.abs(m.x - CANNON_FR * W) < 25 * S){
    G.cannon.alive = false;
    G.cannon.rebuildT = 3;
    burst(m.x, groundY - 12 * S, "#9be9ff", 14);
    G.pops.push({ x: CANNON_FR * W, y: groundY - 62 * S, txt: T("cannonDown"), age: 0, big: true });
    SFX.cannonDown();
  }
  if(basesAlive() === 0 && G.phase === "combat"){
    G.phase = "over"; G.overTimer = 1.4;
    if(G.score > best){ best = G.score; store("vectorDefenseBest", String(best)); }
    SFX.over();
    syncHud();
  }
}
function showGameOver(){
  G.phase = "shown";
  state = "over";
  $("ovScore").textContent = G.score;
  $("ovWave").textContent = G.wave;
  $("ovBest").textContent = best;
  $("ovNew").style.display = (G.score >= best && G.score > 0) ? "block" : "none";
  $("hiBest").textContent = best;
  document.body.classList.remove("playing");
  $("overOverlay").classList.add("open");
}

/* ============================== RENDER ============================== */
function render(){
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  var tNow = G ? G.time : performance.now() / 1000;
  /* stars */
  for(var i = 0; i < stars.length; i++){
    var st = stars[i];
    var tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(tNow * 1.7 + st.p));
    ctx.fillStyle = "rgba(255,255,255," + (0.7 * tw).toFixed(3) + ")";
    ctx.fillRect(st.x * W, st.y * (groundY || H), st.s, st.s);
  }
  ctx.save();
  if(G && G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);

  /* planet surface */
  glow(ctx, "#3dff6e", 2, function(){
    ctx.beginPath();
    for(var i2 = 0; i2 < surfPts.length; i2++){
      var px = surfPts[i2].fx * W, py = groundY + surfPts[i2].dy;
      if(i2 === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  });
  ctx.strokeStyle = "rgba(61,255,110,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, groundY + groundH * 0.55); ctx.lineTo(W, groundY + groundH * 0.5); ctx.stroke();

  /* G-BOMB matrix rain (background layer, only while the sequence runs its course) */
  if(G) G.rain.forEach(function(rn){
    var ra = Math.max(0, 1 - rn.age / rn.life) * 0.5;
    if(ra <= 0) return;
    ctx.strokeStyle = "rgba(61,255,110," + ra.toFixed(3) + ")"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(rn.x, rn.y); ctx.lineTo(rn.x, rn.y + rn.len); ctx.stroke();
    ctx.fillStyle = "rgba(190,255,205," + Math.min(1, ra * 1.5).toFixed(3) + ")";
    ctx.fillRect(rn.x - 1, rn.y + rn.len - 3, 2, 3);
  });

  /* bases + cannon */
  var bw = baseW();
  var baseList = G ? G.bases : BASE_FR.map(function(fr){ return { fr: fr, alive: true }; });
  baseList.forEach(function(b){ drawBaseShape(ctx, b.fr * W, groundY, bw, b.alive); });
  var aimAng = Math.atan2(aim.y - (groundY - 9 * S), aim.x - CANNON_FR * W);
  aimAng = Math.max(-Math.PI + 0.12, Math.min(-0.12, aimAng));
  drawCannonShape(ctx, CANNON_FR * W, groundY, S, aimAng, G ? G.cannon.alive : true, tNow);

  if(G){
    /* bomb trails + warheads */
    G.bombs.forEach(function(m){
      ctx.strokeStyle = m.kind === "mother" ? "rgba(255,49,49,0.75)" : "rgba(255,94,225,0.5)";
      ctx.lineWidth = 1.6; ctx.setLineDash([2, 6]);
      ctx.beginPath();
      for(var j = 0; j < m.trail.length; j++){ var tp = m.trail[j]; if(j === 0) ctx.moveTo(tp.x, tp.y); else ctx.lineTo(tp.x, tp.y); }
      ctx.stroke(); ctx.setLineDash([]);
      var wr = m.kind === "mother" ? 4.6 : (m.kind === "shard" ? 3 : 3.8);
      glow(ctx, "#ff3131", 1.6, function(){ ctx.beginPath(); ctx.arc(m.x, m.y, wr * S, 0, Math.PI * 2); ctx.stroke(); });
      ctx.fillStyle = "#ffd7f4";
      ctx.beginPath(); ctx.arc(m.x, m.y, 1.4 * S, 0, Math.PI * 2); ctx.fill();
    });
    /* aliens */
    G.aliens.forEach(function(a){
      if(a.kind === "dart"){
        var ang = a.mode === "cruise" ? Math.atan2(Math.cos(a.age * a.wobF + a.wobPh) * a.wobA * a.wobF, a.vx) : Math.atan2(a.vy, a.vx);
        drawDart(ctx, a.x, a.y, S, ang);
      }
      else if(a.kind === "joker") drawJoker(ctx, a.x, a.y, S, a.bank, G.time + a.wobPh);
      else if(a.kind === "twin") drawTwin(ctx, a.x, a.y, S, a.bank, G.time + a.wobPh);
      else if(a.kind === "phantom") drawPhantom(ctx, a.x, a.y, S, a.bank, G.time + a.wobPh, a.solid);
      else if(a.kind === "carrier") drawCarrier(ctx, a.x, a.y, S, G.time + a.wobPh);
      else if(a.kind === "alien") drawAlien(ctx, a.x, a.y, S, a.bank, G.time + a.wobPh);
      else drawSaucer(ctx, a.x, a.y, S, a.bank, G.time + a.wobPh);
    });
    /* family capsules */
    G.capsules.forEach(function(cp){ drawCapsule(ctx, cp, tNow); });
    /* 👽 smoke: ABOVE hostiles + capsules (a true blind spot), BELOW
       shots, booms and popups — the player keeps their feedback */
    G.smokes.forEach(function(sm){ drawSmoke(ctx, sm); });
    /* shots + target rings (Boardwalk) */
    G.shots.forEach(function(s){
      glow(ctx, "#9be9ff", 2, function(){ path(ctx, [[s.sx, s.sy], [s.x, s.y]]); });
      ctx.fillStyle = "#dffcff";
      ctx.beginPath(); ctx.arc(s.x, s.y, 3 * S, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(223,252,255,0.7)"; ctx.lineWidth = 1.3;
      var rr = 7 * S;
      ctx.beginPath(); ctx.arc(s.tx, s.ty, rr * 0.55, 0, Math.PI * 2); ctx.stroke();
      path(ctx, [[s.tx - rr, s.ty], [s.tx - rr * 0.35, s.ty], [s.tx + rr * 0.35, s.ty], [s.tx + rr, s.ty],
                 [s.tx, s.ty - rr], [s.tx, s.ty - rr * 0.35], [s.tx, s.ty + rr * 0.35], [s.tx, s.ty + rr]]);
    });
    /* explosion spheres */
    G.booms.forEach(function(b){ drawBoomSphere(ctx, b.x, b.y, b.r, b.age); });
    /* G-BOMB shockwave: two layered rings sweeping out from the cannon */
    if(G.zapSeq){
      var zmx = CANNON_FR * W, zmy = groundY - 9 * S;
      glow(ctx, "#b6ff5e", 3, function(){ ctx.beginPath(); ctx.arc(zmx, zmy, Math.max(1, G.zapSeq.r), 0, Math.PI * 2); ctx.stroke(); });
      glow(ctx, "#dffcff", 1.6, function(){ ctx.beginPath(); ctx.arc(zmx, zmy, Math.max(1, G.zapSeq.r * 0.84), 0, Math.PI * 2); ctx.stroke(); });
    }
    /* G-BOMB lightning */
    G.bolts.forEach(function(bt){
      glow(ctx, "#dffcff", 2, function(){ path(ctx, bt.pts); });
    });
    /* particles */
    G.parts.forEach(function(p){
      ctx.strokeStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - p.age / p.life); ctx.lineWidth = 1.8;
      path(ctx, [[p.x, p.y], [p.x + Math.cos(p.rot) * p.len, p.y + Math.sin(p.rot) * p.len]]);
      ctx.globalAlpha = 1;
    });
    /* score popups */
    G.pops.forEach(function(pp){
      ctx.globalAlpha = Math.max(0, 1 - pp.age / 1.1);
      ctx.fillStyle = pp.big ? "#ffd76a" : "#eaffea";
      ctx.font = "bold " + (pp.big ? 19 : 14) + "px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText(pp.txt, pp.x, pp.y);
      ctx.globalAlpha = 1;
    });
    /* bonus-wave warning: flashing klaxon banner, theme + subtitle, before the storm */
    if(G.warnT > 0 && G.phase === "combat"){
      var bt2 = G.showdown ? showdownTheme(G.wave) : bonusTheme(G.wave);
      var fl = 0.55 + 0.45 * Math.sin(G.time * 14);
      ctx.globalAlpha = Math.min(1, G.warnT / 0.4);
      ctx.textAlign = "center";
      var wf1 = Math.round(Math.max(30, W * 0.06));
      ctx.font = "bold " + wf1 + "px 'Courier New', monospace";
      ctx.fillStyle = "rgba(255,84,60," + fl.toFixed(2) + ")";
      ctx.shadowColor = "rgba(255,84,60,0.85)"; ctx.shadowBlur = 24;
      ctx.fillText(T("warn"), W / 2, H * 0.28);
      var wf2 = Math.round(Math.max(24, W * 0.048));
      ctx.font = "bold " + wf2 + "px 'Courier New', monospace";
      while(ctx.measureText(bt2.name).width > W * 0.94 && wf2 > 14){
        wf2 -= 2;
        ctx.font = "bold " + wf2 + "px 'Courier New', monospace";
      }
      ctx.fillStyle = "#ffd76a";
      ctx.shadowColor = "rgba(255,215,106,0.85)";
      ctx.fillText(bt2.name, W / 2, H * 0.28 + wf1 * 1.2);
      var wf3 = Math.round(Math.max(14, W * 0.021));
      ctx.font = "bold " + wf3 + "px 'Courier New', monospace";
      ctx.fillStyle = "#dffcff";
      ctx.shadowColor = "rgba(159,233,255,0.7)"; ctx.shadowBlur = 12;
      ctx.fillText(bt2.sub, W / 2, H * 0.28 + wf1 * 1.2 + wf2 * 1.3);
      ctx.fillStyle = "#b6ff5e";
      ctx.fillText(T(G.showdown ? "showdownTag" : "bonusTag"), W / 2, H * 0.28 + wf1 * 1.2 + wf2 * 1.3 + wf3 * 1.6);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    /* wave banner */
    if(G.bannerT > 0 && G.warnT <= 0 && G.phase === "combat"){
      ctx.globalAlpha = Math.min(1, G.bannerT / 0.6);
      ctx.fillStyle = "#dffcff";
      var wlabel = T("waveN") + " " + G.wave + " — " + waveName(G.wave);
      var wfs = Math.round(Math.max(26, W * 0.055));
      ctx.font = "bold " + wfs + "px 'Courier New', monospace";
      while(ctx.measureText(wlabel).width > W * 0.94 && wfs > 14){
        wfs -= 2;
        ctx.font = "bold " + wfs + "px 'Courier New', monospace";
      }
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(159,233,255,0.8)"; ctx.shadowBlur = 22;
      ctx.fillText(wlabel, W / 2, H * 0.4);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    if(G.flash > 0){
      ctx.fillStyle = "rgba(255,60,60," + (G.flash * 0.35).toFixed(3) + ")";
      ctx.fillRect(-10, -10, W + 20, H + 20);
    }
    if(G.zapFlash > 0){
      ctx.fillStyle = "rgba(215,246,255," + (G.zapFlash * 0.55).toFixed(3) + ")";
      ctx.fillRect(-10, -10, W + 20, H + 20);
    }
  }
  ctx.restore();

  /* crosshair */
  if(state === "playing" && G && G.cannon.alive){
    var cr = 10 * S;
    glow(ctx, "#dffcff", 1.8, function(){
      ctx.beginPath(); ctx.arc(aim.x, aim.y, cr * 0.62, 0, Math.PI * 2); ctx.stroke();
      path(ctx, [[aim.x - cr, aim.y], [aim.x - cr * 0.35, aim.y], [aim.x + cr * 0.35, aim.y], [aim.x + cr, aim.y],
                 [aim.x, aim.y - cr], [aim.x, aim.y - cr * 0.35], [aim.x, aim.y + cr * 0.35], [aim.x, aim.y + cr]]);
    });
  }
}

/* ============================== LOOP / RESIZE ============================== */
var lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt = Math.min(0.033, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  if(state !== "paused"){ if(state === "playing" || state === "over") update(dt); render(); }
}
function resize(){
  var wrap = $("stageWrap"), cw = wrap.clientWidth, ch = wrap.clientHeight;
  var oldW = W, oldH = H;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  W = cw; H = ch;
  S = Math.max(0.62, Math.min(1.25, Math.min(W, H) / 700));
  V = Math.max(0.72, Math.min(1.3, H / 800));
  groundH = Math.max(44, Math.min(74, H * 0.075));
  groundY = H - groundH;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(G && oldW && oldH && (oldW !== W || oldH !== H)){
    var rx = W / oldW, ry = H / oldH;
    function sc(o){ o.x *= rx; o.y *= ry; if(o.tx !== undefined && o.sx === undefined){ o.tx *= rx; o.ty *= ry; } if(o.sx !== undefined){ o.sx *= rx; o.sy *= ry; o.tx *= rx; o.ty *= ry; } }
    G.aliens.forEach(function(a){ sc(a); a.baseY *= ry; a.diveX *= rx; });
    G.bombs.forEach(sc); G.shots.forEach(sc); G.booms.forEach(sc);
    G.parts.forEach(sc); G.pops.forEach(sc);
  }
  if(!aim.x){ aim.x = W / 2; aim.y = H * 0.35; }
}
window.addEventListener("resize", resize);

/* ============================== FLOW ============================== */
function closeAll(){
  document.querySelectorAll(".overlay").forEach(function(o){ o.classList.remove("open"); o.classList.remove("big"); });
}
function startGame(){
  audio();
  SFX.click();
  closeAll();
  $("intro").style.display = "none";
  document.body.classList.add("playing");
  newGame();
  state = "playing";
}
function quitToTitle(){
  state = "title";
  G = null;
  closeAll();
  document.body.classList.remove("playing");
  $("intro").style.display = "flex";
  $("hiBest").textContent = best;
}
function pauseGame(){
  if(state !== "playing") return;
  state = "paused";
  $("pauseOverlay").classList.add("open");
}
function resumeGame(){
  if(state !== "paused") return;
  state = "playing";
  $("pauseOverlay").classList.remove("open");
}

/* ============================== INPUT ============================== */
var dragInfo = null;
var ptrHeld = false;
function ptrPos(e){
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener("pointermove", function(e){
  var p = ptrPos(e);
  aim.x = p.x; aim.y = p.y;
  if(dragInfo) dragInfo.moved = Math.max(dragInfo.moved, Math.hypot(p.x - dragInfo.x, p.y - dragInfo.y));
});
cv.addEventListener("pointerdown", function(e){
  if(state !== "playing") return;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  var p = ptrPos(e);
  aim.x = p.x; aim.y = p.y;
  dragInfo = { x: p.x, y: p.y, moved: 0 };
  ptrHeld = true;   /* hold-to-fire takes it from here; a tap still fires instantly */
  audio();
  requestFire(p.x, p.y);
});
cv.addEventListener("pointerup", function(e){
  ptrHeld = false;
  if(state !== "playing"){ dragInfo = null; return; }
  var p = ptrPos(e);
  aim.x = p.x; aim.y = p.y;
  dragInfo = null;
});
cv.addEventListener("pointercancel", function(){ ptrHeld = false; dragInfo = null; });
window.addEventListener("blur", function(){ ptrHeld = false; });
window.addEventListener("keydown", function(e){
  if(e.key.indexOf("Arrow") === 0){ keys[e.key] = true; if(state === "playing") e.preventDefault(); }
  else if(e.key === " "){ keys[" "] = true; if(state === "playing"){ e.preventDefault(); if(!e.repeat) zap(); } }
  else if(e.key === "p" || e.key === "P" || e.key === "Escape"){
    if(state === "playing") pauseGame(); else if(state === "paused") resumeGame();
  }
  else if(e.key === "Enter"){
    if(state === "title") startGame();
    else if(state === "over"){ closeAll(); startGame(); }
    else if(state === "playing") requestFire(aim.x, aim.y);
  }
});
window.addEventListener("keyup", function(e){
  if(e.key.indexOf("Arrow") === 0) keys[e.key] = false;
  else if(e.key === " ") keys[" "] = false;
});

/* ============================== UI WIRING ============================== */
document.querySelectorAll("[data-close]").forEach(function(b){
  b.addEventListener("click", function(){ b.closest(".overlay").classList.remove("open"); });
});
$("togQR").addEventListener("click", function(){ $("qrOverlay").classList.add("open"); });
$("qrImg").addEventListener("click", function(){ $("qrOverlay").classList.toggle("big"); });
$("togLang").addEventListener("click", function(){ lang = lang === "en" ? "es" : "en"; store("vdf_lang", lang); applyLang(); });
$("togSound").addEventListener("click", function(){ soundOn = !soundOn; store("vdf_sound", soundOn ? "on" : "off"); applyLang(); if(soundOn){ audio(); beep(880, 0.08, "square", 0.09); } });
$("togHelp").addEventListener("click", function(){ $("helpOverlay").classList.add("open"); });
$("togControls").addEventListener("click", function(){ $("controlsOverlay").classList.add("open"); });
$("startBtn").addEventListener("click", function(){ startGame(); });
$("againBtn").addEventListener("click", function(){ closeAll(); startGame(); });
$("restartBtn").addEventListener("click", function(){ closeAll(); startGame(); });
$("titleBtn").addEventListener("click", function(){ quitToTitle(); });
$("resumeBtn").addEventListener("click", function(){ resumeGame(); });
$("quitBtn").addEventListener("click", function(){ quitToTitle(); });
$("pauseBtn").addEventListener("click", function(){ if(state === "playing") pauseGame(); });
$("zapBtn").addEventListener("pointerdown", function(e){
  e.preventDefault();
  e.stopPropagation();
  audio();
  zap();
});
$("zapBtn").addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); });
$("zapBtnMini").addEventListener("pointerdown", function(e){
  e.preventDefault();
  e.stopPropagation();
  audio();
  zap();
});
$("zapBtnMini").addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); });
/* phone control strip — deliberate actions in dead space above the field.
   Same targets as the pause overlay / intro controls, one shared state. */
$("stripHome").addEventListener("click", function(){ quitToTitle(); });
$("stripReset").addEventListener("click", function(){ closeAll(); startGame(); });
$("stripPause").addEventListener("click", function(){
  if(state === "playing") pauseGame();
  else if(state === "paused") resumeGame();
});
$("stripSound").addEventListener("click", function(){
  soundOn = !soundOn;
  store("vdf_sound", soundOn ? "on" : "off");
  applyLang();
  if(soundOn){ audio(); beep(880, 0.08, "square", 0.09); }
});

/* debug handle for headless verification */
window.VDEF = {
  state: function(){ return state; },
  phase: function(){ return G ? G.phase : null; },
  score: function(){ return G ? G.score : 0; },
  wave: function(){ return G ? G.wave : 0; },
  aliens: function(){ return G ? G.aliens.length : 0; },
  bombs: function(){ return G ? G.bombs.length : 0; },
  booms: function(){ return G ? G.booms.length : 0; },
  shots: function(){ return G ? G.shots.length : 0; },
  bases: function(){ return G ? basesAlive() : 0; },
  cannon: function(){ return G ? G.cannon.alive : null; },
  best: function(){ return best; },
  start: function(){ startGame(); },
  fire: function(x, y){ aim.x = x; aim.y = y; fire(x, y); },
  alienPos: function(){ return G && G.aliens.length ? { x: Math.round(G.aliens[0].x), y: Math.round(G.aliens[0].y), mode: G.aliens[0].mode, kind: G.aliens[0].kind } : null; },
  killBase: function(i){ if(G && G.bases[i]) hitGround({ x: G.bases[i].fr * W, y: groundY, kind: "pod" }); },
  killCannon: function(){ if(G) hitGround({ x: CANNON_FR * W, y: groundY, kind: "pod" }); },
  setScore: function(n){ if(G){ G.score = n; syncHud(); } },
  spawnAlienNow: function(){ if(G) spawnAlien(); },
  clearField: function(){ if(G){ G.aliens.length = 0; G.bombs.length = 0; G.shipsLeft = 0; } },
  zaps: function(){ return G ? G.zaps : 0; },
  setZaps: function(n){ if(G){ G.zaps = n; syncHud(); } },
  zap: function(){ zap(); },
  zapActive: function(){ return G ? !!G.zapSeq : false; },
  ringR: function(){ return G && G.zapSeq ? Math.round(G.zapSeq.r) : 0; },
  boomR: function(){ return boomR(); },
  cool: function(){ return G ? G.cannon.cool : 0; },
  shotTimes: function(){ return G ? G.shotLog.slice() : []; },
  bufPending: function(){ return G ? !!G.buf : false; },
  waveName: function(n){ return waveName(n); },
  setWave: function(n){ if(G){ G.wave = Math.max(0, n - 1); startWave(); } },
  spawnType: function(name){ if(G) spawnAlien(name); return G ? G.aliens.length : 0; },
  setShipsLeft: function(n){ if(G) G.shipsLeft = n; },
  setSpawnTimer: function(n){ if(G) G.spawnTimer = n; },
  spawnCapsule: function(){ if(G) spawnCapsule(); },
  capsules: function(){ return G ? G.capsules.length : 0; },
  bonus: function(){ return G ? !!G.bonus : false; },
  showdown: function(){ return G ? !!G.showdown : false; },
  showdownTheme: function(n){ return showdownTheme(n); },
  waveParams: function(){ return G ? { wave: G.wave, quota: G.quota0, shipsLeft: G.shipsLeft, gap: +G.spawnGap.toFixed(3), bombSpeed: Math.round(G.bombSpeed), diveP: +G.diveP.toFixed(3), dropScale: +G.dropScale.toFixed(3), speedScale: +G.speedScale.toFixed(3), bonus: !!G.bonus, showdown: !!G.showdown, variant: G.variant, diveSpdMul: G.diveSpdMul, capLeft: G.capLeft } : null; },
  smokes: function(){ return G ? G.smokes.length : 0; },
  smokeInfo: function(){ var sm2 = G && G.smokes[0]; return sm2 ? { age: +sm2.age.toFixed(2), life: sm2.life, r: Math.round(sm2.r), x: Math.round(sm2.x), y: Math.round(sm2.y) } : null; },
  pokeSmoke: function(){ if(!G) return false; for(var i = 0; i < G.aliens.length; i++){ if(G.aliens[i].kind === "alien"){ G.aliens[i].smokeT = 0.05; return true; } } return false; },
  capLeft: function(){ return G ? G.capLeft : 0; },
  capSpawned: function(){ return G ? G.capSpawned : 0; },
  warnT: function(){ return G ? G.warnT : 0; },
  bonusTheme: function(n){ return bonusTheme(n); },
  capsuleInfo: function(){ var cp = G && G.capsules[0]; return cp ? { member: cp.member, state: cp.state, x: Math.round(cp.x), y: Math.round(cp.y) } : null; },
  capsuleAt: function(idx){ var cp = G && G.capsules[idx || 0]; return cp ? { member: cp.member, state: cp.state, x: Math.round(cp.x), y: Math.round(cp.y) } : null; },
  capsuleGround: function(){ if(!G) return; for(var i = 0; i < G.capsules.length; i++){ if(G.capsules[i].state === "fall"){ G.capsules[i].y = groundY - 42 * S; return; } } },
  ladder: function(){ return G ? G.capLadder : 0; },
  savedSet: function(){ return G ? Object.keys(G.capSaved) : []; },
  sfx: function(){ return Object.assign({}, SFXCOUNT); },
  sfxNodes: function(){ return SFXNODES; },
  setSound: function(on){ soundOn = !!on; },
  soundState: function(){ return { on: soundOn, ac: AC ? AC.state : "none" }; },
  spawnBombNow: function(x, y){ if(G) spawnBomb(x === undefined ? W * 0.3 : x, y === undefined ? 120 : y, "pod"); },
  boomAt: function(x, y){ if(G) makeBoom(x, y, boomR(), false, false); },
  bombInfo: function(){ return G && G.bombs.length ? { x: Math.round(G.bombs[0].x), y: Math.round(G.bombs[0].y), kind: G.bombs[0].kind } : null; },
  bombNear: function(x, y, r){ if(!G) return null; for(var i = 0; i < G.bombs.length; i++){ var bm = G.bombs[i]; if(Math.hypot(bm.x - x, bm.y - y) < r) return { x: Math.round(bm.x), y: Math.round(bm.y), kind: bm.kind }; } return null; },
  alienKinds: function(){ return G ? G.aliens.map(function(a){ return a.kind; }) : []; },
  alienInfoKind: function(kind){
    if(!G) return null;
    var a = null;
    G.aliens.forEach(function(o){ if(o.kind === kind && !a) a = o; });
    return a ? { kind: a.kind, mode: a.mode, solid: a.solid, laughs: a.laughs, x: Math.round(a.x), y: Math.round(a.y) } : null;
  },
  pops: function(){ return G ? G.pops.map(function(p){ return p.txt; }) : []; },
  drops: function(){ return G ? G.dropLog.length : 0; },
  dropLog: function(){ return G ? G.dropLog.slice() : []; },
  reviveBases: function(){ if(G) G.bases.forEach(function(b){ b.alive = true; }); },
  env: function(){ return { W: W, H: H, groundY: Math.round(groundY), mult: G ? G.mult : 1, wave: G ? G.wave : 0 }; }
};

seedSurface();
seedStars();
drawHero();
applyLang();
resize();
requestAnimationFrame(resize);
requestAnimationFrame(frame);
</script>
