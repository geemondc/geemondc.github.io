<html lang="en">

<style>
  :root{
    --ink:#eaffea; --dim:#9fd8a8; --acc:#b6ff5e; --warn:#ffd76a; --bad:#ff6a5e;
    --panel:rgba(4,18,8,.88); --line:#3f7d4a; --btn:#0d2b16; --neon:#3dff6e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:#000; color:var(--ink);
    font-family:"Courier New", ui-monospace, Menlo, monospace;
    overflow:hidden; overscroll-behavior:none;
  }
  button{ font-family:inherit; cursor:pointer; }
  /* ---------- stage / canvas ---------- */
  #stageWrap{ position:fixed; inset:0; z-index:0; background:#000; }
  #cv{ display:block; width:100%; height:100%; touch-action:none; }
  /* ---------- in-play HUD ---------- */
  .hud{ position:fixed; z-index:5; display:none; pointer-events:none; font-weight:bold; }
  body.playing .hud{ display:block; }
  #hudTime{
    top:4px; left:0; right:0; text-align:center;
    font-size:clamp(40px,9vw,60px); letter-spacing:.05em; color:#fff;
    text-shadow:0 0 14px rgba(61,255,110,.95),0 0 44px rgba(61,255,110,.5);
  }
  #hudTime.low{ color:#ff6a5e; text-shadow:0 0 14px rgba(255,80,60,.95),0 0 44px rgba(255,80,60,.5); }
  #hudScore{ top:10px; left:12px; font-size:clamp(13px,3.4vw,17px); color:var(--acc); text-shadow:0 0 8px rgba(182,255,94,.7); letter-spacing:.08em; }
  #hudLvl{ top:10px; right:64px; font-size:clamp(13px,3.4vw,17px); color:var(--dim); letter-spacing:.14em; text-align:right; }
  #hudSpd{ bottom:10px; left:12px; font-size:clamp(12px,3.2vw,16px); color:#9be9ff; text-shadow:0 0 8px rgba(103,232,255,.6); letter-spacing:.08em; }
  #hudProgWrap{ top:74px; left:50%; transform:translateX(-50%); width:min(300px,52vw); height:5px; background:rgba(61,255,110,.14); border-radius:3px; overflow:hidden; }
  #hudProg{ height:100%; width:0%; background:var(--neon); box-shadow:0 0 8px rgba(61,255,110,.8); }
  #pauseBtn{
    position:fixed; top:10px; right:10px; z-index:6; display:none;
    background:var(--btn); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; width:44px; height:38px; font-size:14px; font-weight:bold;
  }
  body.playing #pauseBtn{ display:block; }
  .pedal{
    position:fixed; bottom:16px; z-index:6; display:none; width:92px; height:92px; border-radius:50%;
    font-family:var(--font); font-weight:bold; font-size:16px; letter-spacing:.06em;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #gasBtn{ right:16px; border:2px solid var(--neon); background:rgba(3,26,10,.72); color:var(--acc); }
  #brkBtn{ left:16px; border:2px solid #ff8a5e; background:rgba(30,10,3,.72); color:#ffb59e; }
  body.playing.touchUI .pedal{ display:block; }
  .pedal:active{ filter:brightness(1.7); }
  /* ---------- intro ---------- */
  #intro{
    position:fixed; inset:0; z-index:10; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:rgba(0,2,1,.93);
    display:flex; flex-direction:column; align-items:center; padding:14px 14px 30px;
  }
  #heroCv{
    width:min(880px,100%); aspect-ratio:3/2; display:block;
    border:1px solid var(--line); border-radius:10px; background:#000;
    box-shadow:0 0 34px rgba(61,255,110,.28), inset 0 0 0 1px rgba(0,0,0,.4);
  }
  h1.title{
    margin:14px 0 2px; font-size:clamp(34px,8.6vw,68px); line-height:1; text-align:center;
    letter-spacing:.12em; font-weight:bold; color:var(--ink);
    text-shadow:0 0 10px rgba(160,255,180,.9),0 0 34px rgba(61,255,110,.55),0 0 70px rgba(61,255,110,.3);
  }
  #tagline{ margin:8px 0 0; font-size:clamp(14px,3.4vw,19px); letter-spacing:.08em; color:var(--acc); text-align:center; text-shadow:0 0 10px rgba(182,255,94,.6); }
  #hiRow{ display:flex; gap:14px; margin:16px 0 4px; flex-wrap:wrap; justify-content:center; }
  .hiBox{
    border:1px solid var(--line); background:var(--panel); border-radius:8px;
    padding:8px 18px; text-align:center; min-width:150px;
  }
  .hiBox .lab{ font-size:10px; letter-spacing:.24em; color:var(--dim); }
  .hiBox .num{ font-size:26px; font-weight:bold; text-shadow:0 0 10px rgba(61,255,110,.8); }
  #startBtn{
    margin:16px 0 4px; background:#1d5c2a; color:#fff; border:2px solid var(--acc);
    border-radius:10px; padding:16px 58px; font-size:clamp(24px,6vw,32px); font-weight:bold;
    letter-spacing:.22em; text-shadow:0 0 12px rgba(255,255,255,.7);
    box-shadow:0 0 26px rgba(61,255,110,.45);
  }
  #startBtn:active{ transform:scale(.97); }
  #togRow{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:16px; max-width:880px; }
  .tog{
    background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px; font-size:13px; font-weight:bold; letter-spacing:.1em; min-height:44px;
  }
  .tog:active{ transform:scale(.96); }
  #futureReady{ margin-top:20px; font-size:10px; letter-spacing:.34em; color:#5d8f6a; text-decoration:none; }
  @media (max-height:940px) and (min-width:601px){
    #heroCv{ width:min(640px,100%); }
    h1.title{ margin-top:10px; }
    #hiRow{ margin-top:10px; }
    #startBtn{ margin-top:10px; }
    #togRow{ margin-top:10px; }
    #futureReady{ margin-top:12px; }
  }
  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.78); padding:16px;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--panel); border:1px solid var(--acc); border-radius:12px;
    max-width:620px; width:100%; max-height:88vh; overflow-y:auto; padding:20px 22px;
    box-shadow:0 0 30px rgba(61,255,110,.25);
  }
  .sheet h2{ margin:0 0 12px; letter-spacing:.2em; font-size:20px; text-align:center; }
  .sheet p, .sheet li{ font-size:14.5px; line-height:1.55; letter-spacing:.02em; }
  .sheet ul{ margin:8px 0; padding-left:20px; }
  .sheet .k{ color:var(--acc); font-weight:bold; }
  .closeBtn, .bigBtn{
    display:block; margin:16px auto 2px; background:#17451f; color:#fff; border:1px solid var(--acc);
    border-radius:8px; padding:12px 30px; font-size:16px; font-weight:bold; letter-spacing:.14em; min-height:48px;
  }
  #qrImg{ display:block; margin:6px auto; width:min(240px,62vw); image-rendering:pixelated; border-radius:6px; background:#fff; padding:6px; }
  #qrOverlay.big #qrImg{ width:min(78vmin,420px); }
  #qrUrl{ text-align:center; font-size:12px; color:var(--dim); word-break:break-all; }
  .statRow{ display:flex; justify-content:space-between; font-size:16px; padding:5px 2px; border-bottom:1px dashed #2c5a36; }
</style>
</head>

</div>

<script>
"use strict";
/* ============================== I18N ============================== */
var STR = {
en:{ tagline:"The hill pushes. Steer the momentum.", bestScoreLab:"BEST SCORE", bestLevelLab:"BEST LEVEL", start:"START", howto:"HOW TO PLAY",
  controls:"CONTROLS", close:"CLOSE", paused:"PAUSED", resume:"RESUME", quit:"QUIT TO TITLE",
  gameover:"TIME UP", win:"YOU WIN!", scoreLab:"SCORE", levelLab:"LEVEL", best:"BEST", again:"PLAY AGAIN", newBest:"NEW BEST!",
  soundOn:"SOUND: ON", soundOff:"SOUND: OFF", levelWord:"LEVEL", finalLevel:"FINAL LEVEL",
  hGoal:"Goal is to finish and stay on the track — and try not to go too fast. Thirty puzzle descents stand between you and the bottom of the mountain. Each one ends at a blue GOAL pad. Beat the clock, bank the time, climb the ladder.",
  hPush:"THE PUSH: the marble is heavy and the hill does the driving. Slopes shove you downhill, speed builds, and momentum carries you over rises — arrive at a crest too slow and you stall and roll back. Steering is a shove, not a steering wheel: persuade the marble, plan ahead.",
  hClock:"THE CLOCK: you start with 99 seconds. Checkpoints hand back +3. Every fall, squash, swallow or dissolve costs −3 and a trip back to the last checkpoint. Finish a level and the leftover seconds turn into bonus points (×100) AND ride into the next level's clock.",
  hFall:"THE EDGE: slide off the ribbon, miss a bridge or drop through a hole and you fall. Watch for glowing CUSHIONS at the foot of drops and launches — land on one for a soft catch; miss it and the hard bounce can throw you off your line.",
  hCush:"THE COURSE: troughs cradle you, stairs bump you down step by step, funnels pipe you to shortcuts, hammers pound in rhythm, and some bridges slide or shake. Read the puzzle, pick your line.",
  hBad:"THE LOCALS: a slinky MUNCHER hops toward you and swallows marbles whole. The black BOWLING BALL just wants to shove you off the edge. The SLIME oozes together into a clump that reaches for you. None of them are friendly.",
  hGoalTxt:"THE GOAL: a bright blue pad. The last stretch often throws you straight onto it at full speed — cross it and it erupts in rainbow for 5 seconds while your time bonus tallies.",
  hKeysLab:"KEYBOARD + MOUSE", hKeys:"Move the MOUSE to steer — the pointer's position against the marble shoves it sideways. Hold LEFT MOUSE BUTTON to ACCELERATE: power up a climb or crest a wave. SPACE is the BRAKE. Arrow keys / A,D steer too. There is NO speed limit — only the physics. Red rails on the edges will hold you... until you arrive way too fast and hop them. P or ESC pauses.",
  hTouchLab:"TOUCH", hTouch:"Drag to steer, hold to accelerate — the hill does the rest. Drag left or right of the marble to shove it that way. Hold the GAS button to accelerate, hold BRAKE to slow down — or touch a SECOND FINGER anywhere to brake. The red rails hold you on turns, until you come in way too fast.", gasLab:"GAS", brkLab:"BRAKE" },
es:{ tagline:"La cuesta empuja. Dirige el impulso.", bestScoreLab:"MEJOR PUNTAJE", bestLevelLab:"MEJOR NIVEL", start:"INICIAR", howto:"CÓMO JUGAR",
  controls:"CONTROLES", close:"CERRAR", paused:"PAUSA", resume:"SEGUIR", quit:"VOLVER AL TÍTULO",
  gameover:"¡SE ACABÓ EL TIEMPO!", win:"¡GANASTE!", scoreLab:"PUNTOS", levelLab:"NIVEL", best:"RÉCORD", again:"JUGAR OTRA VEZ", newBest:"¡NUEVO RÉCORD!",
  soundOn:"SONIDO: SÍ", soundOff:"SONIDO: NO", levelWord:"NIVEL", finalLevel:"NIVEL FINAL",
  hGoal:"La meta es terminar y mantenerte en la pista — y trata de no ir demasiado rápido. Treinta bajadas rompecabezas te separan de la base de la montaña. Cada una termina en una plataforma azul de META. Vence al reloj, guarda el tiempo y sube la escalera.",
  hPush:"EL EMPUJE: la canica pesa y la cuesta hace el trabajo. Las pendientes te empujan, la velocidad crece y el impulso te lleva sobre las subidas — si llegas lento a una cresta, te detienes y ruedas hacia atrás. Dirigir es empujar, no girar un volante: convence a la canica y planea con tiempo.",
  hClock:"EL RELOJ: empiezas con 99 segundos. Los puntos de control devuelven +3. Cada caída, aplastada, tragada o disolución cuesta −3 y un viaje al último punto de control. Al terminar un nivel, los segundos sobrantes se vuelven puntos de bono (×100) Y pasan al reloj del siguiente nivel.",
  hFall:"EL BORDE: si te sales de la cinta, fallas un puente o caes por un hueco, te desplomas. Busca los COJINES brillantes al pie de las caídas y los lanzamientos — aterriza en uno para un agarre suave; si fallas, el rebote duro puede sacarte de tu línea.",
  hCush:"EL RECORRIDO: los canales te acunan, las escaleras te bajan golpe a golpe, los embudos te llevan por atajos, los martillos golpean en ritmo, y algunos puentes se deslizan o tiemblan. Lee el rompecabezas y elige tu línea.",
  hBad:"LOS VECINOS: un TRAGÓN de resorte salta hacia ti y se traga las canicas enteras. La BOLA NEGRA solo quiere empujarte fuera del borde. El MOCO se junta en una masa que estira sus brazos hacia ti. Ninguno es amable.",
  hGoalTxt:"LA META: una plataforma azul brillante. El último tramo suele lanzarte directo a ella a toda velocidad — crúzala y estalla en arcoíris por 5 segundos mientras se suma tu bono de tiempo.",
  hKeysLab:"TECLADO + RATÓN", hKeys:"Mueve el RATÓN para dirigir — su posición contra la canica la empuja de lado. Mantén el BOTÓN IZQUIERDO para ACELERAR: sube una cuesta o pasa una ola. ESPACIO es el FRENO. Las flechas / A,D también dirigen. NO hay límite de velocidad — solo la física. Las barandas rojas te sostienen... hasta que llegas demasiado rápido y las saltas. P o ESC pausa.",
  hTouchLab:"TÁCTIL", hTouch:"Arrastra para dirigir, mantén para acelerar — la cuesta hace el resto. Arrastra a la izquierda o derecha de la canica para empujarla. Mantén GAS para acelerar, mantén FRENO para frenar — o toca con un SEGUNDO DEDO en cualquier parte para frenar. Las barandas rojas te sostienen en las curvas, hasta que llegas demasiado rápido.", gasLab:"GAS", brkLab:"FRENO" }
};
var lang = "en", soundOn = true;
function T(k){ return STR[lang][k] || STR.en[k] || k; }
function $(id){ return document.getElementById(id); }
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = T(el.getAttribute("data-i18n")); });
  $("togLang").textContent = (lang === "en") ? "ESPAÑOL" : "ENGLISH";
  $("togSound").textContent = soundOn ? T("soundOn") : T("soundOff");
  $("gasBtn").textContent = T("gasLab"); $("brkBtn").textContent = T("brkLab");
  $("hiScore").textContent = bestScore;
  $("hiLvl").textContent = bestLevel > 0 ? bestLevel : "—";
  if(typeof updateHud === "function") updateHud();
}

/* ============================== STORAGE ============================== */
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
var bestScore = parseInt(store("vd2_bestScore") || "0", 10) || 0;
var bestLevel = parseInt(store("vd2_bestLevel") || "0", 10) || 0;
lang = store("vd_lang") || "en";
soundOn = store("vd_sound") !== "off";

/* ============================== AUDIO ============================== */
var AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === "suspended") AC.resume(); return AC; }
function beep(freq, dur, type, vol, slideTo, delay){
  if(!soundOn) return; var ac = audio(); if(!ac) return;
  var t = ac.currentTime + (delay || 0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, freq, delay){
  if(!soundOn) return; var ac = audio(); if(!ac) return;
  var t = ac.currentTime + (delay || 0);
  var n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for(var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = ac.createBufferSource(); src.buffer = buf;
  var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 900;
  var g = ac.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
}
/* rolling rumble: looped noise, gain + filter track marble speed */
var rollNode = null;
function rollSet(speedRatio, grounded){
  if(!soundOn){ if(rollNode) rollNode.g.gain.value = 0; return; }
  var ac = audio(); if(!ac) return;
  if(!rollNode){
    var len = ac.sampleRate * 1.2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    var f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 160; f.Q.value = 0.7;

  }
  var seg2 = LV.seg[segIdxAt(ball.z)];
  /* --- rails: low lips that hold you — unless you arrive airborne or way too hot --- */
  if(ball.grounded && seg2.rail){
    var cx2 = cxAt(ball.z), hw2 = halfWAt(ball.z, seg2);
    var u2 = (ball.x - cx2) / hw2, lim = 1 - BALL_R / hw2;

      } else {

  /* --- checkpoints --- */

}

/* ============================== ENTITY UPDATES ============================== */
var HAM_T = 1.7;
function hammerHead01(seg, t){
  var p = ((t / HAM_T) + seg.hammer.phase) % 1;
  if(p < 0.5) return 1;
  if(p < 0.58) { var q = (p - 0.5) / 0.08; return 1 - q * q; }
  if(p < 0.8) return 0;
  var q2 = (p - 0.8) / 0.2; return q2 * q2;
}
function updateEnts(h){
  ents.forEach(function(e){
    if(e.type === "muncher") updateMuncher(e, h);
    else if(e.type === "bowler") updateBowler(e, h);
    else if(e.type === "slime") updateSlime(e, h);
  });
  // hammers
  if(ball.grounded && ghostT <= 0){
    var seg = LV.seg[segIdxAt(ball.z)];
    if(seg.hammer && hammerHead01(seg, tNow) < 0.25){
      var u = (ball.x - cxAt(ball.z)) / halfWAt(ball.z, seg);
      if(Math.abs(u - seg.hammer.u) < 0.30 && state === "play"){
        state = "squash"; stateT = 0; ball.squashY = 0.14;
        SFX.squash(); SFX.clang();
        camShake = 10;

    }
  }
}
function updateMuncher(e, h){
  e.t += h;
  var dz = ball.z - e.z, dx = ball.x - e.x;
  var dist = Math.hypot(dz, dx);
  if(state === "play" && dist < 2900 && Math.abs(dz) < 2900) villainIntro("muncher");
  if(e.mode === "idle"){
    e.squash = 0.85 + Math.sin(e.t * 2.2) * 0.08;
    if(state === "play" && dist < 2400){
      e.mode = "crouch"; e.t = 0;
    }
  } else if(e.mode === "crouch"){
    e.squash = 0.55;
    if(e.t > 0.22){
      e.mode = "hop"; e.t = 0;
      var dd = Math.max(60, dist);
      var hopLen = Math.min(880, dd * 0.8);
      e.hopDZ = (dz / dd) * hopLen; e.hopDX = (dx / dd) * hopLen;
      e.fromZ = e.z; e.fromX = e.x; e.mouth = 0;
    }
  } else if(e.mode === "hop"){
    var k = e.t / 0.46;
    if(k >= 1){
      e.z = e.fromZ + e.hopDZ; e.x = e.fromX + e.hopDX; e.air = 0; e.mode = "land"; e.t = 0;
      // did it land on the marble?
      if(state === "play" && ghostT <= 0 && Math.hypot(ball.z - e.z, ball.x - e.x) < BALL_R + 150 && ball.grounded){
        state = "eaten"; stateT = 0; eatData = { e:e };
        e.mouth = 1;
        SFX.gulp();
        return;
      }
    } else {
      e.z = e.fromZ + e.hopDZ * k; e.x = e.fromX + e.hopDX * k;
      e.air = Math.sin(k * Math.PI) * 340;
      e.squash = 1 + Math.sin(k * Math.PI) * 0.45;
      e.mouth = (state === "play" && dist < 500) ? 0.8 : 0.25;
    }
  } else if(e.mode === "land"){
    e.squash = 0.5 + Math.min(0.5, e.t * 2.4);
    e.mouth = Math.max(0, e.mouth - h * 3);
    if(e.t > 0.3){ e.mode = (state === "play" && dist < 2400) ? "crouch" : "idle"; e.t = 0; }
  }
  e.y = yAt(e.z);
  // keep the muncher on its platform: don't hop beyond ±2600 of home
  if(Math.abs(e.z - e.homeZ) > 2600){ e.z = e.homeZ + Math.sign(e.z - e.homeZ) * 2600; }
}
function updateBowler(e, h){
  var dz = ball.z - e.z, dx = ball.x - e.x;
  var dist = Math.hypot(dz, dx);
  if(state === "play" && dist < 2900) villainIntro("bowler");
  var active = state === "play" && ball.z > e.z0 - 400 && ball.z < e.z1 + 400;
  var az = 0, ax = 0;
  if(active && dist > 10){ az = (dz / dist) * 1500; ax = (dx / dist) * 1500; }
  else { // drift home
    var hz = e.homeZ - e.z; if(Math.abs(hz) > 40) az = Math.sign(hz) * 500;
  }
  var fl = floorAt(e.z, e.x);
  if(fl){
    var s = slopeAt(e.z);
    az += -G_SLOPE * s / (1 + 0.3 * Math.abs(s)) * 0.9;
    e.y = fl.y;
  }
  e.vz += az * h; e.vx += ax * h;
  e.vz -= e.vz * Math.min(1, 0.5 * h); e.vx -= e.vx * Math.min(1, 0.5 * h);
  var nz = e.z + e.vz * h, nx = e.x + e.vx * h;
  if(nz < e.z0 || nz > e.z1 || !floorAt(nz, nx)){ e.vz = -e.vz * 0.6; nz = e.z; }
  if(!floorAt(e.z, nx)){ e.vx = -e.vx * 0.6; nx = e.x; }
  e.z = nz; e.x = nx;
  e.roll += e.vz * h * 0.02;
  // the shove
  e.cool -= h;
  if(state === "play" && ghostT <= 0 && e.cool <= 0 && ball.grounded){
    var cdz = ball.z - e.z, cdx = ball.x - e.x, cd = Math.hypot(cdz, cdx);
    if(cd < BALL_R * 2 * 0.92 && cd > 1){
      var nz2 = cdz / cd, nx2 = cdx / cd;

      var imp = Math.max(500, -rel * 1.4 + 420);
      ball.vz += nz2 * imp; ball.vx += nx2 * imp;
      e.vz -= nz2 * imp * 0.4; e.vx -= nx2 * imp * 0.4;
      e.cool = 0.45;
      SFX.clack(); camShake = Math.max(camShake, 6);

    }
  }
}
function updateSlime(e, h){
  var nearest = 1e9;
  e.puds.forEach(function(p){ nearest = Math.min(nearest, Math.hypot(ball.z - p.z, ball.x - p.x)); });

  // ooze: drift toward centroid + wobble; merge on contact
  var cz = 0, cxm = 0;
  e.puds.forEach(function(p){ cz += p.z; cxm += p.x; });
  cz /= e.puds.length; cxm /= e.puds.length;
  e.puds.forEach(function(p){
    p.z += (cz - p.z) * 0.24 * h + Math.sin(tNow * 0.7 + p.ph) * 26 * h;
    p.x += (cxm - p.x) * 0.24 * h + Math.cos(tNow * 0.6 + p.ph) * 26 * h;
  });
  for(var i = e.puds.length - 1; i >= 0; i--) for(var j = i - 1; j >= 0; j--){
    var a = e.puds[i], b = e.puds[j];
    if(Math.hypot(a.z - b.z, a.x - b.x) < (a.r + b.r) * 0.75){
      b.r = Math.sqrt(a.r * a.r + b.r * b.r);
      b.z = (a.z * a.r + b.z * b.r) / (a.r + b.r); b.x = (a.x * a.r + b.x * b.r) / (a.r + b.r);

    }
  }

  var big = e.puds[0]; e.puds.forEach(function(p){ if(p.r > big.r) big = p; });
  e.armCd -= h;
  if(e.arm){
    var A = e.arm; A.t += h;
    var grow = 0.55, hold = 0.45, shrink = 0.4;
    if(A.t < grow) A.k = A.t / grow;
    else if(A.t < grow + hold) A.k = 1;
    else if(A.t < grow + hold + shrink) A.k = 1 - (A.t - grow - hold) / shrink;
    else { e.arm = null; e.armCd = 1.1; }
    if(e.arm && state === "play" && ghostT <= 0){
      // arm capsule test
      var ex = big.x + Math.cos(A.ang) * 0, ez2 = big.z + Math.sin(A.ang) * 0; // base at blob centre (z,x plane: ang measured atan2(dx,dz))
      var tipZ = big.z + Math.sin(A.ang) * A.len * A.k, tipX = big.x + Math.cos(A.ang) * A.len * A.k;
      var d = distToSeg(ball.z, ball.x, big.z, big.x, tipZ, tipX);
      if(d < 95 + BALL_R * 0.55){ dissolveBall(); return; }
    }
  } else if(state === "play" && big.r > 230 && e.armCd <= 0){
    var dz = ball.z - big.z, dx = ball.x - big.x, dd = Math.hypot(dz, dx);
    if(dd < big.r + 780){
      e.arm = { ang: Math.atan2(dz, dx), len: Math.min(660, dd), t:0, k:0 };
    }
  }
  // body contact dissolves
  if(state === "play" && ghostT <= 0){
    for(var q = 0; q < e.puds.length; q++){
      var p2 = e.puds[q];
      if(Math.hypot(ball.z - p2.z, ball.x - p2.x) < p2.r + BALL_R * 0.5 && ball.grounded){ dissolveBall(); return; }
    }
  }
}
function distToSeg(px, pz, ax, az, bx, bz){
  var dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
  var t = L2 ? ((px - ax) * dx + (pz - az) * dz) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), pz - (az + dz * t));
}
function dissolveBall(){
  if(state !== "play") return;
  state = "dissolved"; stateT = 0;
  SFX.dissolve();
  burst(ball.x, ball.y + 60, ball.z, "#3dff6e", 16, 420);
}

/* ============================== INPUT ============================== */
var keys = {};
var mouse = { x:0, seen:false, down:false };
var touchDrag = { active:false, id:null, x:0 };
var gasTouch = false, brkTouch = false, secondFinger = false, secondFingerId = null;
var qaInput = null;
var ballSX = 0, ballSY = 0, ballSR = 20;
window.addEventListener("keydown", function(e){
  var k = e.key;
  if(k === "ArrowLeft" || k === "ArrowRight" || k === " "){ e.preventDefault(); }
  keys[k.length === 1 ? k.toLowerCase() : k] = true;
  if(k === " ") keys[" "] = true;
  if(state === "playing" || state === "play"){ if(k === "p" || k === "P" || k === "Escape"){ pauseGame(); } return; }
  if(state === "card" || state === "ready"){ stateT = Math.max(stateT, 0.65); return; }
  if(state === "over" && (k === "Enter" || k === " ")){ startGame(); return; }
  if(state === "title" && k === "Enter"){ audio(); startGame(); return; }
});
window.addEventListener("keyup", function(e){ keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; if(e.key === " ") keys[" "] = false; });
function steerFromKeys(){
  var l = keys["ArrowLeft"] || keys["a"], r = keys["ArrowRight"] || keys["d"];
  return (r ? 1 : 0) - (l ? 1 : 0);
}
window.addEventListener("mousemove", function(e){ mouse.x = e.clientX; mouse.seen = true; });
window.addEventListener("mouseup", function(){ mouse.down = false; });
cv.addEventListener("pointerdown", function(e){

  if(touchDrag.active){ secondFinger = true; secondFingerId = e.pointerId; }
  else { touchDrag.active = true; touchDrag.id = e.pointerId; touchDrag.x = e.clientX; }

});
cv.addEventListener("pointermove", function(e){
  if(e.pointerType === "mouse"){ mouse.x = e.clientX; mouse.seen = true; return; }
  if(touchDrag.active && e.pointerId === touchDrag.id) touchDrag.x = e.clientX;

function pointerEnd(e){
  if(e.pointerType === "mouse"){ mouse.down = false; return; }

function bindHold(id, set){

function computeInput(){
  if(qaInput){ input.steer = qaInput.steer || 0; input.accel = !!qaInput.accel; input.brake = !!qaInput.brake; return; }

function pauseGame(){

/* ============================== MAIN UPDATE ============================== */
var physAcc = 0;
function tickClock(dt){
  clock -= dt;
  if(clock <= 0){ clock = 0; updateHud(); gameOver(false); return true; }
  return false;
}
function update(dt){
  stateT += dt;
  if(state === "card"){ if(stateT > 2.4){ state = "ready"; stateT = 0; } return; }
  if(state === "ready"){ if(stateT > 0.9){ state = "play"; stateT = 0; SFX.go(); } return; }
  if(state === "finish"){
    ball.vz *= Math.max(0, 1 - 1.9 * dt);
    ball.z += ball.vz * dt;
    var fl = floorAt(ball.z, ball.x);
    if(fl) ball.y = fl.y;
    if(stateT >= 5){
      if(levelIdx >= LEVELS.length - 1){ gameOver(true); }
      else { var left = finData.leftover; loadLevel(levelIdx + 1, left); }
    }
    return;
  }
  if(state === "pipe"){
    if(tickClock(dt)) return;
    pipeData.t += dt;
    if(pipeData.t < 0.55){
      var k = pipeData.t / 0.55;
      ball.z += (pipeData.fz - ball.z) * Math.min(1, dt * 7);
      ball.x += (pipeData.fx - ball.x) * Math.min(1, dt * 7);
      ball.y -= dt * 130;
    } else if(pipeData.t >= 1.15){
      var ez2 = LV.meta.exitStart * SEG + 80;
      ball.z = ez2; ball.x = cxAt(ez2); ball.y = yAt(ez2);
      ball.vz = Math.max(950, ball.vz * 0.65); ball.vx = 0; ball.vy = 0; ball.grounded = true;
      state = "play"; stateT = 0;
      burst(ball.x, ball.y + 60, ball.z, "#29e6ff", 12, 500);
    }
    return;
  }
  if(state === "lift"){
    if(tickClock(dt)) return;
    liftData.t += dt;
    var lk = Math.min(1, liftData.t / 1.7), le = lk * lk * (3 - 2 * lk);
    ball.y = liftData.fromY + (liftData.toY - liftData.fromY) * le;
    ball.z = liftData.fromZ + (liftData.toZ - liftData.fromZ) * le;
    ball.x = cxAt(ball.z);
    if(lk >= 1){ ball.vz = 360; ball.vy = 0; ball.grounded = true; state = "play"; stateT = 0; }
    return;
  }
  if(state === "fall" || state === "eaten" || state === "dissolved" || state === "squash"){
    if(tickClock(dt)) return;
    if(state === "fall"){
      ball.vy -= G_VERT * dt; ball.y += ball.vy * dt;
      ball.z += ball.vz * dt; ball.vz *= Math.max(0, 1 - 0.4 * dt);
      if(stateT > 0.85) penalizeAndRespawn();
    } else if(state === "eaten"){ if(stateT > 0.95) penalizeAndRespawn(); }
    else if(state === "dissolved"){ if(stateT > 0.8) penalizeAndRespawn(); }
    else if(state === "squash"){ if(stateT > 0.7) penalizeAndRespawn(); }
    return;
  }
  if(state !== "play") return;
  if(tickClock(dt)) return;
  computeInput();
  ghostT = Math.max(0, ghostT - dt);
  ball.squashY += (1 - ball.squashY) * Math.min(1, dt * 7);
  physAcc += dt;
  var h = 1 / 240, guard = 0;
  while(physAcc >= h && guard < 40){
    physStep(h); physAcc -= h; guard++;
    if(state !== "play"){ physAcc = 0; break; }
  }
  updateEnts(dt);
  // popups + particles
  for(var i = popups.length - 1; i >= 0; i--){ popups[i].t += dt; if(popups[i].t > popups[i].life) popups.splice(i, 1); }
  for(var j = parts.length - 1; j >= 0; j--){ var p = parts[j]; p.t += dt; p.vy -= 1800 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; if(p.t > p.life) parts.splice(j, 1); }
  rollSet(Math.min(1.35, Math.abs(ball.vz) / 3000), ball.grounded);
  updateHud();
}
function updateHud(){
  if(!ball) return;
  var t = Math.max(0, Math.ceil(clock));
  $("hudTime").textContent = t;
  $("hudTime").className = "hud" + (t < 15 ? " low" : "");
  $("hudScore").textContent = score;
  $("hudLvl").textContent = T("levelWord") + " " + (levelIdx + 1);
  $("hudSpd").textContent = Math.round(Math.abs(ball.vz) / 20) + " m/s";
  $("hudProg").style.width = Math.min(100, ball.z / LV.totalLen * 100) + "%";
}

/* ============================== RENDER ============================== */
function project(wx, wy, wz, out){
  var rz = wz - camZ; if(rz < 8) rz = 8;

  ctx.shadowBlur = 18;
  ctx.fillText("GOAL", 0, 35);
  ctx.restore();
}
function drawEntities(){
  var list = ents.slice().sort(function(a, b){ return b.z - a.z; });
  list.forEach(function(e){
    if(e.z < camZ - 200 || e.z > camZ + DRAW_SEGS * SEG + 400) return;
    if(e.type === "muncher") drawMuncher(e);
    else if(e.type === "bowler") drawBowler(e);
    else if(e.type === "slime") drawSlime(e);
  });
}
function floorShadow(x, y, z, r){
  var fl = floorAt(z, x);
  if(!fl || y - fl.y > 1600) return;
  var sp = P(x, fl.y + 8, z);
  var alpha = Math.max(0, 0.42 - (y - fl.y) * 0.00022);
  ctx.fillStyle = "rgba(0,0,0," + alpha.toFixed(3) + ")";
  ctx.beginPath(); ctx.ellipse(sp.x, sp.y, Math.max(2, sp.s * r * (W / 2)), Math.max(1, sp.s * r * (W / 2) * 0.3), 0, 0, Math.PI * 2); ctx.fill();
}
function drawMuncher(e){
  var topY = e.y + (e.air || 0);
  floorShadow(e.x, e.y, e.z, 210);
  var bp = P(e.x, topY, e.z);
  var s = bp.s * (W / 2);
  var R = Math.max(3, s * 150);
  var rings = 7, stretch = e.squash || 1;
  var totalH = R * 1.5 * stretch;
  ctx.lineWidth = Math.max(1.3, R * 0.13);
  for(var k = rings - 1; k >= 0; k--){
    var f = k / (rings - 1);
    var ry = bp.y - totalH * f * 0.82;
    var rr = R * (1 - f * 0.22) * (k >= rings - 2 ? 1 + (e.mouth || 0) * 0.55 : 1);
    ctx.strokeStyle = k >= rings - 2 && e.mouth > 0.3 ? "#b6ff5e" : "#3dff6e";
    ctx.globalAlpha = 0.28; ctx.lineWidth = Math.max(2, R * 0.3);
    ctx.beginPath(); ctx.ellipse(bp.x, ry, rr, rr * 0.34, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = Math.max(1.2, R * 0.1);
    ctx.beginPath(); ctx.ellipse(bp.x, ry, rr, rr * 0.34, 0, 0, Math.PI * 2); ctx.stroke();
    if(k === rings - 1 && e.mouth > 0.15){
      ctx.fillStyle = "rgba(2,20,6,0.9)";
      ctx.beginPath(); ctx.ellipse(bp.x, ry, rr * 0.82, rr * 0.26, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}
function drawBowler(e){
  floorShadow(e.x, e.y, e.z, 150);
  var bp = P(e.x, e.y, e.z);
  drawSphereAt(bp.x, bp.y - Math.max(2, bp.s * BALL_R * (W / 2)), Math.max(2, bp.s * BALL_R * (W / 2)), e.roll, 0, 1, true);
}
function drawSlime(e){
  e.puds.forEach(function(p){
    var fl = floorAt(p.z, p.x);
    var y = fl ? fl.y : yAt(p.z);
    var bp = P(p.x, y, p.z), s = bp.s * (W / 2);
    ctx.fillStyle = "rgba(24,160,64,0.85)";
    for(var k = 0; k < 4; k++){
      var ox = Math.sin(p.ph + k * 2.1) * p.r * 0.4, oz = Math.cos(p.ph + k * 1.7) * p.r * 0.4;
      var cp = P(p.x + ox, y, p.z + oz);
      ctx.beginPath(); ctx.ellipse(cp.x, cp.y, Math.max(1.5, s * p.r * (0.55 + (k % 3) * 0.16)), Math.max(1, s * p.r * 0.2), 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "rgba(190,255,205,0.5)";
    var hp2 = P(p.x - p.r * 0.3, y + p.r * 0.35, p.z);
    ctx.beginPath(); ctx.ellipse(hp2.x, hp2.y, Math.max(1, s * p.r * 0.2), Math.max(0.6, s * p.r * 0.07), 0, 0, Math.PI * 2); ctx.fill();
  });
  if(e.arm){
    var big = e.puds[0]; e.puds.forEach(function(p){ if(p.r > big.r) big = p; });
    var fl2 = floorAt(big.z, big.x), by = fl2 ? fl2.y : yAt(big.z);
    var tipZ = big.z + Math.sin(e.arm.ang) * e.arm.len * e.arm.k, tipX = big.x + Math.cos(e.arm.ang) * e.arm.len * e.arm.k;
    var steps = 7;
    for(var q = 0; q <= steps; q++){
      var f = q / steps, az2 = big.z + (tipZ - big.z) * f, ax2 = big.x + (tipX - big.x) * f;
      var ap = P(ax2, by + 30 * Math.sin(f * Math.PI), az2), as2 = ap.s * (W / 2);
      var ar = (1 - f * 0.55) * big.r * 0.5;
      ctx.fillStyle = "rgba(24,180,70,0.9)";
      ctx.beginPath(); ctx.ellipse(ap.x, ap.y, Math.max(1.2, as2 * ar), Math.max(0.8, as2 * ar * 0.4), 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}
function drawBall(){
  if(state === "pipe" && pipeData && pipeData.t >= 0.55) return; // inside the pipe
  if(state === "eaten" && stateT > 0.55) return; // swallowed
  var drawX = ball.x, drawZ = ball.z, drawY = ball.y;
  var shrink = 1;
  if(state === "eaten" && eatData){ drawX = eatData.e.x; drawZ = eatData.e.z; drawY = eatData.e.y + 190; shrink = Math.max(0.1, 1 - stateT / 0.55); }
  if(state === "dissolved") shrink = Math.max(0.08, 1 - stateT / 0.8);
  floorShadow(drawX, drawY, drawZ, BALL_R);
  var bp = P(drawX, drawY, drawZ);
  var r = Math.max(1.6, bp.s * BALL_R * (W / 2)) * shrink;
  ballSX = bp.x; ballSY = bp.y - r; ballSR = r;
  if(ghostT > 0 && state === "play") ctx.globalAlpha = 0.45 + 0.3 * Math.sin(tNow * 26);
  var spinA = ball.z * 0.004 + ball.x * 0.001, rollA = ball.z * 0.01;
  drawSphereAt(bp.x, bp.y - r, r, rollA, spinA, ball.squashY, false);
  ctx.globalAlpha = 1;
  if(state === "pipe" && pipeData && pipeData.t < 0.55){
    // spiral swirl around the ring mouth
    ctx.strokeStyle = "rgba(61,255,110,0.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bp.x, bp.y - r, r * (1.4 - pipeData.t), tNow * 9, tNow * 9 + 4.4); ctx.stroke();
  }
}
function drawPopups(){
  ctx.textAlign = "center";
  popups.forEach(function(p){
    var a = Math.max(0, 1 - p.t / p.life);
    if(p.screen){
      ctx.font = "bold " + (p.big ? 34 : 22) + "px 'Courier New',monospace";
      ctx.fillStyle = p.color; ctx.globalAlpha = a;
      ctx.shadowColor = p.color; ctx.shadowBlur = 12;
      ctx.fillText(p.txt, W / 2, H * 0.3 - p.t * 26);
      ctx.shadowBlur = 0;
    } else {
      var wp = P(p.x || cxAt(p.z), yAt(p.z) + 560 + p.t * 130, p.z);
      ctx.font = "bold " + Math.max(10, (p.big ? 30 : 19) * wp.s * 3.4) + "px 'Courier New',monospace";
      ctx.fillStyle = p.color; ctx.globalAlpha = a;
      ctx.shadowColor = p.color; ctx.shadowBlur = 10;
      ctx.fillText(p.txt, wp.x, wp.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  });
  ctx.textAlign = "left";
  parts.forEach(function(p){
    var wp = P(p.x, p.y, p.z);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    var sz = Math.max(1, wp.s * p.sz * (W / 2) * 0.4);
    ctx.fillRect(wp.x, wp.y, sz, sz);
  });
  ctx.globalAlpha = 1;
}
function drawCard(){
  ctx.fillStyle = "rgba(0,4,2,0.55)"; ctx.fillRect(0, 0, W, H);
  var nm = LV.name;
  ctx.textAlign = "center";
  ctx.fillStyle = "#9fd8a8"; ctx.font = "bold " + Math.round(W * 0.045) + "px 'Courier New',monospace";
  ctx.fillText(T("levelWord") + " " + (levelIdx + 1), W / 2, H * 0.3);
  ctx.fillStyle = "#b6ff5e"; ctx.shadowColor = "#3dff6e"; ctx.shadowBlur = 22;
  var cardName = lang === "es" ? nm.es : nm.en;
  var nfs = Math.min(W * 0.085, 54);
  ctx.font = "bold " + Math.round(nfs) + "px 'Courier New',monospace";
  var nw = ctx.measureText(cardName).width;
  if(nw > W * 0.92){ nfs = nfs * (W * 0.92) / nw; ctx.font = "bold " + Math.round(nfs) + "px 'Courier New',monospace"; }
  ctx.fillText(cardName, W / 2, H * 0.42);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#eaffea"; ctx.font = Math.round(W * 0.042) + "px 'Courier New',monospace";
  ctx.fillText(lang === "es" ? nm.sub_es : nm.sub_en, W / 2, H * 0.5);
  ctx.textAlign = "left";
}
function drawReady(){
  ctx.textAlign = "center";
  ctx.fillStyle = "#eaffea"; ctx.shadowColor = "#3dff6e"; ctx.shadowBlur = 16;
  ctx.font = "bold " + Math.round(Math.min(W * 0.09, 52)) + "px 'Courier New',monospace";
  ctx.fillText(T("levelWord") + " " + (levelIdx + 1), W / 2, H * 0.34);
  ctx.shadowBlur = 0; ctx.textAlign = "left";
}

/* ============================== LOOP / RESIZE ============================== */
var lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  if(state !== "paused"){
    if(state !== "title" && state !== "over") tNow += dt;
    update(dt);
    // camera follow
    if(ball){
      var tx = cxAt(ball.z) + (ball.x - cxAt(ball.z)) * 0.82;
      camX += (tx - camX) * Math.min(1, dt * 7);
      var ty = ball.y + CAM_H + Math.min(300, Math.abs(ball.vz) * 0.04);
      camY += (ty - camY) * Math.min(1, dt * 4.5);
      if(Math.abs(ball.vz) > 2600) camShake = Math.max(camShake, (Math.abs(ball.vz) - 2600) * 0.0022);
    }
    ctx.save();
    if(camShake > 0.2){ ctx.translate((Math.random() - 0.5) * camShake, (Math.random() - 0.5) * camShake); camShake *= Math.max(0, 1 - dt * 5); }
    render();
    ctx.restore();
  }
}
function resize(){
  var wrap = $("stageWrap"), cw = wrap.clientWidth, ch = wrap.clientHeight;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  W = cw; H = ch; horizonY = Math.round(ch * 0.40);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

/* ============================== UI WIRING ============================== */
function closeAll(){
  document.querySelectorAll(".overlay").forEach(function(o){ o.classList.remove("open"); o.classList.remove("big"); });
}
document.querySelectorAll("[data-close]").forEach(function(b){
  b.addEventListener("click", function(){ b.closest(".overlay").classList.remove("open"); });
});
$("togQR").addEventListener("click", function(){ $("qrOverlay").classList.add("open"); });
$("qrImg").addEventListener("click", function(){ $("qrOverlay").classList.toggle("big"); });
$("togLang").addEventListener("click", function(){ lang = lang === "en" ? "es" : "en"; store("vd_lang", lang); applyLang(); });
$("togSound").addEventListener("click", function(){ soundOn = !soundOn; store("vd_sound", soundOn ? "on" : "off"); applyLang(); if(soundOn){ audio(); beep(880, 0.08, "square", 0.09); } else rollSet(0, false); });
$("togHelp").addEventListener("click", function(){ $("helpOverlay").classList.add("open"); });
$("togControls").addEventListener("click", function(){ $("controlsOverlay").classList.add("open"); });
$("startBtn").addEventListener("click", function(){ audio(); startGame(); });
$("againBtn").addEventListener("click", function(){ startGame(); });
$("titleBtn").addEventListener("click", function(){ quitToTitle(); });
$("resumeBtn").addEventListener("click", function(){ resumeGame(); });
$("quitBtn").addEventListener("click", function(){ quitToTitle(); });
$("pauseBtn").addEventListener("click", function(){ if(state === "play") pauseGame(); });
bindHold("gasBtn", function(v){ gasTouch = v; });
bindHold("brkBtn", function(v){ brkTouch = v; });

/* debug / QA handle */
window.VD = {
  state: function(){ return state; },
  level: function(){ return levelIdx + 1; },
  clock: function(){ return clock; },
  score: function(){ return score; },
  ball: function(){ if(!ball) return null; var seg = LV.seg[segIdxAt(ball.z)]; return { z:ball.z, x:ball.x, y:ball.y, vz:ball.vz, vx:ball.vx, vy:ball.vy, grounded:ball.grounded, u:(ball.x - cxAt(ball.z)) / halfWAt(ball.z, seg), seg:segIdxAt(ball.z), slope:slopeAt(ball.z) }; },
  speed: function(){ return ball ? ball.vz / 20 : 0; },
  start: function(){ startGame(); },
  skipCard: function(){ if(state === "card" || state === "ready"){ state = "play"; stateT = 0; } },
  setLevel: function(n){ score = 0; seenVillain = {}; loadLevel(Math.max(0, Math.min(LEVELS.length - 1, n - 1)), 0); state = "play"; stateT = 0; },
  setBall: function(o){ if(!ball) return; if(o.z !== undefined) ball.z = o.z; if(o.x !== undefined) ball.x = o.x; if(o.y !== undefined) ball.y = o.y; if(o.vz !== undefined) ball.vz = o.vz; if(o.vx !== undefined) ball.vx = o.vx; if(o.vy !== undefined) ball.vy = o.vy; if(o.grounded !== undefined) ball.grounded = o.grounded; },
  setClock: function(s){ clock = s; },
  input: function(o){ qaInput = o; },
  goalZ: function(){ return LV ? LV.goalSeg * SEG : 0; },
  segInfo: function(){ if(!LV || !ball) return null; var s = LV.seg[segIdxAt(ball.z)]; return { rail:!!s.rail, trough:s.trough, bank:s.bank, gap:s.gap, shake:s.shake, goal:!!s.goal, cush:!!s.cush }; },
  ents: function(){ return ents.map(function(e){ return { type:e.type, z:e.z, x:e.x, mode:e.mode, puds:e.puds ? e.puds.length : undefined }; }); },
  finT: function(){ return finData ? finData.t : -1; }
};

drawHero();
applyLang();
resize();
requestAnimationFrame(resize);
requestAnimationFrame(frame);
</script>
