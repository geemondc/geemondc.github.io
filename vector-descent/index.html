<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Vector Descent</title>
<style>
  :root{
    --ink:#eaffea; --dim:#9fd8a8; --acc:#b6ff5e; --warn:#ffd76a; --bad:#ff6a5e;
    --panel:rgba(4,18,8,.88); --line:#3f7d4a; --btn:#0d2b16; --neon:#3dff6e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:#000; color:var(--ink);
    font-family:"Courier New", ui-monospace, Menlo, monospace;
    overflow:hidden; overscroll-behavior:none;
  }
  button{ font-family:inherit; cursor:pointer; }
  /* ---------- stage / canvas ---------- */
  #stageWrap{ position:fixed; inset:0; z-index:0; background:#000; }
  #cv{ display:block; width:100%; height:100%; touch-action:none; }
  /* ---------- in-play distance counter (the only words on the play field) ---------- */
  #dist{
    position:fixed; top:8px; left:0; right:0; z-index:5; display:none;
    text-align:center; pointer-events:none;
    font-size:clamp(36px,8vw,56px); font-weight:bold; letter-spacing:.06em;
    color:var(--neon); text-shadow:0 0 12px rgba(61,255,110,.9),0 0 38px rgba(61,255,110,.45);
  }
  #dist small{ font-size:.42em; letter-spacing:.14em; }
  body.playing #dist{ display:block; }
  #pauseBtn{
    position:fixed; top:10px; right:10px; z-index:6; display:none;
    background:var(--btn); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; width:44px; height:38px; font-size:14px; font-weight:bold;
  }
  body.playing #pauseBtn{ display:block; }
  /* ---------- intro ---------- */
  #intro{
    position:fixed; inset:0; z-index:10; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.78) 55%, rgba(0,0,0,.94));
    display:flex; flex-direction:column; align-items:center; padding:14px 14px 30px;
  }
  #heroCv{
    width:min(880px,100%); aspect-ratio:3/2; display:block;
    border:1px solid var(--line); border-radius:10px; background:#000;
    box-shadow:0 0 34px rgba(61,255,110,.28), inset 0 0 0 1px rgba(0,0,0,.4);
  }
  h1.title{
    margin:14px 0 2px; font-size:clamp(34px,8.6vw,68px); line-height:1; text-align:center;
    letter-spacing:.12em; font-weight:bold; color:var(--ink);
    text-shadow:0 0 10px rgba(160,255,180,.9),0 0 34px rgba(61,255,110,.55),0 0 70px rgba(61,255,110,.3);
  }
  #tagline{ margin:8px 0 0; font-size:clamp(14px,3.4vw,19px); letter-spacing:.08em; color:var(--acc); text-align:center; text-shadow:0 0 10px rgba(182,255,94,.6); }
  #hiRow{ display:flex; gap:14px; margin:16px 0 4px; flex-wrap:wrap; justify-content:center; }
  .hiBox{
    border:1px solid var(--line); background:var(--panel); border-radius:8px;
    padding:8px 18px; text-align:center; min-width:170px;
  }
  .hiBox .lab{ font-size:10px; letter-spacing:.24em; color:var(--dim); }
  .hiBox .num{ font-size:26px; font-weight:bold; text-shadow:0 0 10px rgba(61,255,110,.8); }
  #startBtn{
    margin:16px 0 4px; background:#1d5c2a; color:#fff; border:2px solid var(--acc);
    border-radius:10px; padding:16px 58px; font-size:clamp(24px,6vw,32px); font-weight:bold;
    letter-spacing:.22em; text-shadow:0 0 12px rgba(255,255,255,.7);
    box-shadow:0 0 26px rgba(61,255,110,.45);
  }
  #startBtn:active{ transform:scale(.97); }
  #togRow{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:16px; max-width:880px; }
  .tog{
    background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px; font-size:13px; font-weight:bold; letter-spacing:.1em; min-height:44px;
  }
  .tog:active{ transform:scale(.96); }
  #futureReady{ margin-top:20px; font-size:10px; letter-spacing:.34em; color:#5d8f6a; text-decoration:none; }
  /* short desktop windows: shrink the hero so START + the whole toggle row fit without scrolling */
  @media (max-height:940px) and (min-width:601px){
    #heroCv{ width:min(640px,100%); }
    h1.title{ margin-top:10px; }
    #hiRow{ margin-top:10px; }
    #startBtn{ margin-top:10px; }
    #togRow{ margin-top:10px; }
    #futureReady{ margin-top:12px; }
  }
  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.78); padding:16px;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--panel); border:1px solid var(--acc); border-radius:12px;
    max-width:620px; width:100%; max-height:88vh; overflow-y:auto; padding:20px 22px;
    box-shadow:0 0 30px rgba(61,255,110,.25);
  }
  .sheet h2{ margin:0 0 12px; letter-spacing:.2em; font-size:20px; text-align:center; }
  .sheet p, .sheet li{ font-size:14.5px; line-height:1.55; letter-spacing:.02em; }
  .sheet ul{ margin:8px 0; padding-left:20px; }
  .sheet .k{ color:var(--acc); font-weight:bold; }
  .closeBtn, .bigBtn{
    display:block; margin:16px auto 2px; background:#17451f; color:#fff; border:1px solid var(--acc);
    border-radius:8px; padding:12px 30px; font-size:16px; font-weight:bold; letter-spacing:.14em; min-height:48px;
  }
  #qrImg{ display:block; margin:6px auto; width:min(240px,62vw); image-rendering:pixelated; border-radius:6px; background:#fff; padding:6px; }
  #qrOverlay.big #qrImg{ width:min(78vmin,420px); }
  #qrUrl{ text-align:center; font-size:12px; color:var(--dim); word-break:break-all; }
  .statRow{ display:flex; justify-content:space-between; font-size:16px; padding:5px 2px; border-bottom:1px dashed #2c5a36; }
</style>
</head>

<script>
"use strict";
/* ============================== I18N ============================== */
var STR = {
en:{ tagline:"Ride the neon ribbon. Don't fall off.", bestLab:"BEST DISTANCE", start:"START", howto:"HOW TO PLAY",
  controls:"CONTROLS", close:"CLOSE", paused:"PAUSED", resume:"RESUME", quit:"QUIT TO TITLE",
  gameover:"RUN OVER", distance:"DISTANCE", best:"BEST", again:"RESTART", newBest:"NEW BEST!",
  soundOn:"SOUND: ON", soundOff:"SOUND: OFF",
  hGoal:"You are the glowing sphere on an endless neon ribbon hanging in the void. There is no finish line — only distance. The ribbon keeps getting faster. Survive.",
  hSteer:"STEER: lean left and right to stay on the ribbon and thread the gaps. Curves shove you toward the outside — steer into them.",
  hBlocks:"RED BLOCKS: wireframe cubes parked on the ribbon. One touch ends the run. Slip past one close and you'll hear a blip.",
  hFall:"THE EDGE: slide off either side and you fall into the dark. One mistake ends the run.",
  hBest:"THE CHASE: your best distance is saved. Beat it.",
  hKeysLab:"KEYBOARD", hKeys:"Hold LEFT / RIGHT arrow keys — or A / D — to steer. ENTER or SPACE restarts after a crash. P or ESC pauses.",
  hTouchLab:"TOUCH", hTouch:"Hold the LEFT or RIGHT half of the screen to steer that way. Drag across the middle to swing from side to side. Tap RESTART to run again." },
es:{ tagline:"Rueda la cinta de neón. No te caigas.", bestLab:"MEJOR DISTANCIA", start:"INICIAR", howto:"CÓMO JUGAR",
  controls:"CONTROLES", close:"CERRAR", paused:"PAUSA", resume:"SEGUIR", quit:"VOLVER AL TÍTULO",
  gameover:"FIN DE LA BAJADA", distance:"DISTANCIA", best:"RÉCORD", again:"OTRA VEZ", newBest:"¡NUEVO RÉCORD!",
  soundOn:"SONIDO: SÍ", soundOff:"SONIDO: NO",
  hGoal:"Eres la esfera brillante sobre una cinta de neón sin fin colgada en el vacío. No hay meta — solo distancia. La cinta acelera sin parar. Sobrevive.",
  hSteer:"DIRECCIÓN: inclínate a izquierda y derecha para seguir en la cinta y pasar por los huecos. Las curvas te empujan hacia afuera — gira hacia ellas.",
  hBlocks:"BLOQUES ROJOS: cubos de alambre sobre la cinta. Un solo toque termina la bajada. Si pasas rozando uno, oirás un pitido.",
  hFall:"EL BORDE: si te sales por cualquier lado, caes a la oscuridad. Un error termina la bajada.",
  hBest:"EL RETO: tu mejor distancia queda guardada. Supérala.",
  hKeysLab:"TECLADO", hKeys:"Mantén las flechas IZQUIERDA / DERECHA — o A / D — para girar. ENTER o ESPACIO reinicia tras un choque. P o ESC pausa.",
  hTouchLab:"TÁCTIL", hTouch:"Mantén la mitad IZQUIERDA o DERECHA de la pantalla para girar hacia ese lado. Arrastra cruzando el centro para balancearte de lado a lado. Toca OTRA VEZ para bajar de nuevo." }
};
var lang = "en", soundOn = true;
function T(k){ return STR[lang][k] || STR.en[k] || k; }
function $(id){ return document.getElementById(id); }
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = T(el.getAttribute("data-i18n")); });
  $("togLang").textContent = (lang === "en") ? "ESPAÑOL" : "ENGLISH";
  $("togSound").textContent = soundOn ? T("soundOn") : T("soundOff");
  $("hiBest").textContent = best + " m";
}

/* ============================== STORAGE ============================== */
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
var best = parseInt(store("vectorDescentBest") || "0", 10) || 0;
lang = store("vd_lang") || "en";
soundOn = store("vd_sound") !== "off";

/* ============================== AUDIO ============================== */
var AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === "suspended") AC.resume(); return AC; }
function beep(freq, dur, type, vol, slideTo){
  if(!soundOn) return; var ac = audio(); if(!ac) return;
  var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, freq){
  if(!soundOn) return; var ac = audio(); if(!ac) return;
  var n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for(var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = ac.createBufferSource(); src.buffer = buf;
  var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 900;
  var g = ac.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
}
var SFX = {
  start: function(){ beep(660, 0.09, "square", 0.10); setTimeout(function(){ beep(990, 0.12, "square", 0.10); }, 100); },
  near: function(){ beep(1560, 0.05, "square", 0.07); },
  crash: function(){ noiseBurst(0.55, 0.32, 650); beep(420, 0.55, "sawtooth", 0.15, 46); },
  fall: function(){ beep(700, 0.7, "sawtooth", 0.13, 60); noiseBurst(0.4, 0.15, 500); },
  record: function(){ beep(660, 0.1, "square", 0.1); setTimeout(function(){ beep(880, 0.1, "square", 0.1); }, 110); setTimeout(function(){ beep(1320, 0.16, "square", 0.1); }, 220); }
};

/* ============================== HERO ART (drawn once) ============================== */
function drawHero(){
  var c = $("heroCv"), x = c.getContext("2d"), W = c.width, H = c.height;
  x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
  var i, sx, sy;
  for(i = 0; i < 150; i++){ // stars
    x.fillStyle = "rgba(255,255,255," + (0.25 + Math.random() * 0.7) + ")";
    x.fillRect(Math.random() * W, Math.random() * H * 0.75, Math.random() < 0.12 ? 2.4 : 1.4, 1.4);
  }
  var vx = W * 0.5, vy = H * 0.40; // vanishing point
  function glow(color, wdt, fn){
    x.strokeStyle = color; x.lineCap = "round";
    x.globalAlpha = 0.22; x.lineWidth = wdt * 3.1; fn();
    x.globalAlpha = 1; x.lineWidth = wdt; fn();
  }
  function line(a, b, c2, d){ x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); }
  // fan of longitudinal lines converging to the vanishing point
  var base = [-0.62, -0.40, -0.20, 0, 0.20, 0.40, 0.62];
  for(i = 0; i < base.length; i++){
    (function(fx){
      glow("#3dff6e", 2, function(){ line(vx + fx * W * 0.06, vy, vx + fx * W * 1.9, H + 30); });
    })(base[i]);
  }
  // red rails just outside the outer edges
  glow("#ff3131", 2.4, function(){ line(vx - W * 0.045, vy, vx - W * 1.24, H + 30); });
  glow("#ff3131", 2.4, function(){ line(vx + W * 0.045, vy, vx + W * 1.24, H + 30); });
  // cross ties, exponential spacing toward the horizon
  for(i = 0; i < 15; i++){
    var t = i / 15, yy = vy + Math.pow(t, 2.1) * (H - vy + 20), hw = 4 + Math.pow(t, 2.1) * W * 0.86;
    x.globalAlpha = 0.35 + t * 0.65;
    (function(){ x.strokeStyle = "#3dff6e"; x.lineWidth = 1 + t * 1.6; x.beginPath(); x.moveTo(vx - hw, yy); x.lineTo(vx + hw, yy); x.stroke(); })();
  }
  x.globalAlpha = 1;
  // a red wireframe block on the right lane
  (function(){
    var bx = vx + W * 0.21, by = H * 0.80, s = W * 0.055, d = s * 0.45;
    x.strokeStyle = "#ff3131"; x.lineWidth = 2.4;
    x.shadowColor = "#ff3131"; x.shadowBlur = 12;
    x.strokeRect(bx - s, by - s * 1.7, s * 2, s * 1.7);
    x.beginPath();
    x.moveTo(bx - s, by - s * 1.7); x.lineTo(bx - s + d, by - s * 1.7 - d);
    x.moveTo(bx + s, by - s * 1.7); x.lineTo(bx + s + d, by - s * 1.7 - d);
    x.moveTo(bx + s + d, by - s * 1.7 - d); x.lineTo(bx + s + d, by - d);
    x.moveTo(bx + s, by); x.lineTo(bx + s + d, by - d);
    x.stroke(); x.shadowBlur = 0;
  })();
  // the ball — big wireframe sphere, lower left of center
  (function(){
    var cx = vx - W * 0.13, cy = H * 0.86, r = W * 0.105, k, a, px, py;
    x.lineWidth = 2.6;
    function circle(pts){ x.beginPath(); for(var j = 0; j <= pts.length - 1; j++){ if(j === 0) x.moveTo(pts[j][0], pts[j][1]); else x.lineTo(pts[j][0], pts[j][1]); } x.stroke(); }
    x.strokeStyle = "#67e8ff"; x.globalAlpha = 0.3; x.lineWidth = 7;
    x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke();
    x.globalAlpha = 1; x.lineWidth = 2.6; x.strokeStyle = "#dffcff";
    x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke();
    var pts;
    for(k = 0; k < 3; k++){ // meridians
      var rot = k * Math.PI / 3 + 0.5; pts = [];
      for(a = 0; a <= 26; a++){ var th = a / 26 * Math.PI * 2; px = cx + Math.sin(th) * Math.sin(rot) * r; py = cy + Math.cos(th) * r; pts.push([px, py]); }
      x.strokeStyle = "#9be9ff"; circle(pts);
    }
    pts = []; // equator
    for(a = 0; a <= 30; a++){ var th2 = a / 30 * Math.PI * 2; pts.push([cx + Math.cos(th2) * r, cy + Math.sin(th2) * r * 0.34]); }
    x.strokeStyle = "#9be9ff"; circle(pts);
  })();
}

/* ============================== TRACK ============================== */
var SEG_LEN = 200;              // world units per segment (= 10 m)
var UNITS_PER_M = SEG_LEN / 10; // 20 world units per metre
var TRACK_HALF = 2000;          // world units, centre to edge at width factor 1
var CAM_H = 1050;
var CAM_DEPTH = 0.84;                       // ~100 deg FOV
var PLAYER_Z = Math.round(CAM_H * CAM_DEPTH); // ball sits this far ahead of the camera
var DRAW_SEGS = 120;
var BALL_R = 185;               // ball radius, world units
var segments = [];
var gen = null;
function resetGen(){
  gen = { curve:0, target:0, dx:0, cx:0, section:0, lastBlockI:-99, lastBlockX:0, gateAt: 420 + Math.random() * 260 };
}
function appendSegment(){
  var i = segments.length ? segments[segments.length - 1].i + 1 : 0;
  var z = i * SEG_LEN, distM = z / UNITS_PER_M;
  if(gen.section <= 0){
    gen.section = 26 + Math.floor(Math.random() * 36);
    var maxMag = Math.min(0.55 + distM / 750, 3.1);
    if(distM < 130) maxMag = 0.35; // gentle opening
    gen.target = (Math.random() * 2 - 1) * maxMag;
    if(Math.random() < 0.22) gen.target = 0; // occasional straight breather
  }
  gen.section--;
  var step = gen.target - gen.curve;
  gen.curve += Math.max(-0.045, Math.min(0.045, step));
  gen.dx += gen.curve;
  gen.cx += gen.dx;
  var wf = 1 - 0.26 * Math.min(1, distM / 5200) + Math.sin(i * 0.011) * 0.02;
  var seg = { i:i, z:z, curve:gen.curve, cx:gen.cx, wf:wf, blocks:[] };
  // obstacles
  if(distM > 165){
    var p = Math.min(0.028 + distM / 8500, 0.155);
    var isGate = false;
    if(distM > gen.gateAt){ // two-block gate pattern, gap in the middle or offset
      isGate = true; gen.gateAt = distM + 380 + Math.random() * 320;
      var gx = (Math.random() * 2 - 1) * 0.30;
      seg.blocks.push({ x: gx - 0.62, hw: 0.16 });
      seg.blocks.push({ x: gx + 0.62, hw: 0.16 });
    }
    if(!isGate && Math.random() < p){
      var bx = (Math.random() * 2 - 1) * 0.72;
      var near = (i - gen.lastBlockI) <= 4;
      if(!(near && Math.abs(bx - gen.lastBlockX) > 0.52 && Math.random() < 0.45)){ // keep a runnable line through tight sequences
        seg.blocks.push({ x: bx, hw: 0.17 });
        gen.lastBlockI = i; gen.lastBlockX = bx;
      }
    }
    if(seg.blocks.length){ gen.lastBlockI = i; gen.lastBlockX = seg.blocks[0].x; }
  }
  segments.push(seg);
}
function ensureSegments(){
  var need = Math.floor((position + PLAYER_Z) / SEG_LEN) + DRAW_SEGS + 10;
  while(!segments.length || segments[segments.length - 1].i < need) appendSegment();
  var minI = Math.floor(position / SEG_LEN) - 6;
  while(segments.length && segments[0].i < minI) segments.shift();
}
function segAt(z){
  var idx = Math.floor(z / SEG_LEN) - segments[0].i;
  if(idx < 0) idx = 0; if(idx > segments.length - 1) idx = segments.length - 1;
  return segments[idx];
}
function segAfter(seg){
  var idx = seg.i - segments[0].i + 1;
  return idx < segments.length ? segments[idx] : seg;
}

/* ============================== STATE ============================== */
var cv = $("cv"), ctx = cv.getContext("2d");
var W = 0, H = 0, horizonY = 0;
var state = "title"; // title | playing | crash | over
var position = 0, distance = 0, mps = 0;
var ballX = 0, ballVel = 0, lean = 0, roll = 0, spin = 0;
var steerKey = 0;                 // -1 | 0 | 1 from keyboard
var pointers = {};                // active touch/mouse pointers: id -> side (-1|1)
var elapsed = 0, crashT = 0, crashKind = "", shards = [], ballDrop = 0, lastNear = 0;
var stars = [];
for(var si = 0; si < 150; si++) stars.push({ x: Math.random(), y: Math.random(), s: Math.random() < 0.12 ? 2.2 : 1.3, p: Math.random() * 6.28 });

function resetWorld(attract){
  segments = []; resetGen(); position = 0; distance = 0;
  ballX = 0; ballVel = 0; lean = 0; roll = 0; spin = 0; ballDrop = 0;
  mps = attract ? 10 : 13;
  ensureSegments();
}
function startRun(){
  resetWorld(false);
  state = "playing";
  $("intro").style.display = "none";
  closeAll();
  document.body.classList.add("playing");
  SFX.start();
}
function quitToTitle(){
  resetWorld(true);
  state = "title";
  document.body.classList.remove("playing");
  $("intro").style.display = "flex";
  closeAll();
  $("hiBest").textContent = best + " m";
}
function doCrash(kind){
  if(state !== "playing") return;
  state = "crash"; crashKind = kind; crashT = 0; ballDrop = 0;
  if(kind === "block"){
    SFX.crash();
    shards = [];
    for(var i = 0; i < 16; i++){
      var a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 420;
      shards.push({ x: ballSX, y: ballSY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 160,
        rot: Math.random() * 6.28, vr: (Math.random() * 2 - 1) * 9, len: 8 + Math.random() * (ballSR * 0.8) });
    }
  } else {
    SFX.fall();
  }
}
function endRun(){
  state = "over";
  document.body.classList.remove("playing");
  var d = Math.floor(distance), isNew = false;
  if(d > best){ best = d; store("vectorDescentBest", String(best)); isNew = true; }
  $("ovDist").textContent = d + " m";
  $("ovBest").textContent = best + " m";
  $("ovNew").style.display = isNew ? "block" : "none";
  $("overOverlay").classList.add("open");
  if(isNew) SFX.record();
}

/* ============================== INPUT ============================== */
var keys = {};
window.addEventListener("keydown", function(e){
  var k = e.key;
  if(k === "ArrowLeft" || k === "ArrowRight" || k === " "){ e.preventDefault(); }
  keys[k.length === 1 ? k.toLowerCase() : k] = true;
  if(state === "playing" && (k === "p" || k === "P" || k === "Escape")){ pauseGame(); return; }
  if(state === "over" && (k === "Enter" || k === " ")){ startRun(); return; }
  if(state === "title" && k === "Enter" && $("intro").style.display !== "none"){ startRun(); return; }
});
window.addEventListener("keyup", function(e){ keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
function steerFromKeys(){
  var l = keys["ArrowLeft"] || keys["a"], r = keys["ArrowRight"] || keys["d"];
  return (r ? 1 : 0) - (l ? 1 : 0);
}
function pointerSide(e){ var r = cv.getBoundingClientRect(); return (e.clientX - r.left) < r.width / 2 ? -1 : 1; }
cv.addEventListener("pointerdown", function(e){
  audio();
  if(state !== "playing") return;
  pointers[e.pointerId] = pointerSide(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
});
cv.addEventListener("pointermove", function(e){
  if(pointers[e.pointerId] !== undefined) pointers[e.pointerId] = pointerSide(e);
});
function pointerEnd(e){ delete pointers[e.pointerId]; }
cv.addEventListener("pointerup", pointerEnd);
cv.addEventListener("pointercancel", pointerEnd);
function steerFromPointers(){
  var s = 0, id;
  for(id in pointers) s += pointers[id];
  return Math.max(-1, Math.min(1, s));
}
function pauseGame(){
  if(state !== "playing") return;
  state = "paused";
  $("pauseOverlay").classList.add("open");
}
function resumeGame(){
  if(state !== "paused") return;
  state = "playing";
  $("pauseOverlay").classList.remove("open");
}

/* ============================== UPDATE ============================== */
function update(dt){
  elapsed += dt;
  if(state === "title"){
    position += mps * UNITS_PER_M * dt;
    distance = position / UNITS_PER_M;
    ballX = Math.sin(elapsed * 0.35) * 0.45;
    ballVel = Math.cos(elapsed * 0.35) * 0.35;
    roll += mps * dt * 0.055; spin += dt * 0.7;
    ensureSegments();
    return;
  }
  if(state === "crash"){
    crashT += dt;
    mps = Math.max(0, mps - dt * 30);
    position += mps * UNITS_PER_M * dt;
    if(crashKind === "block"){
      for(var i = 0; i < shards.length; i++){
        var s = shards[i];
        s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 950 * dt; s.rot += s.vr * dt;
      }
      if(crashT > 1.05) endRun();
    } else {
      ballDrop += dt * 1.9;
      spin += dt * 7;
      if(crashT > 0.8) endRun();
    }
    ensureSegments();
    return;
  }
  if(state !== "playing") return;
  // speed ramp: gentle opening, continuous rise, cap grows with distance
  var cap = 30 + Math.min(19, distance / 420);
  if(mps < cap) mps = Math.min(cap, mps + dt * (0.55 + mps * 0.006));
  position += mps * UNITS_PER_M * dt;
  distance = position / UNITS_PER_M;
  var pSeg = segAt(position + PLAYER_Z);
  // steering: responsive but weighty
  var input = steerFromKeys() || steerFromPointers();
  var maxLat = 2.45;
  ballVel += input * 7.2 * dt;
  ballVel -= ballVel * Math.min(1, 3.1 * dt);
  if(ballVel > maxLat) ballVel = maxLat; else if(ballVel < -maxLat) ballVel = -maxLat;
  ballX += ballVel * dt;
  // centrifugal shove on curves
  var speedPct = mps / 49;
  ballX -= 0.62 * pSeg.curve * speedPct * speedPct * dt;
  lean += ((ballVel * 0.38) - lean) * Math.min(1, dt * 9);
  roll += mps * dt * 0.055;
  spin += ballVel * dt * 1.6;
  ensureSegments();
  // collisions
  if(Math.abs(ballX) > 1.04){ doCrash("fall"); return; }
  for(var b = 0; b < pSeg.blocks.length; b++){
    var blk = pSeg.blocks[b];
    if(Math.abs(ballX - blk.x) < blk.hw + 0.13){ doCrash("block"); return; }
    if(Math.abs(ballX - blk.x) < blk.hw + 0.42 && elapsed - lastNear > 0.12){ lastNear = elapsed; SFX.near(); }
  }
}

/* ============================== RENDER ============================== */
var ballSX = 0, ballSY = 0, ballSR = 0;
function project(wx, wy, wz, camX, camZ, out){
  var rz = wz - camZ; if(rz < 8) rz = 8;
  var s = CAM_DEPTH / rz;
  out.x = W / 2 + s * (wx - camX) * (W / 2);
  out.y = horizonY - s * (wy - CAM_H) * (H / 2);
  out.s = s;
  return out;
}
var P1 = { x:0, y:0, s:0 }, P2 = { x:0, y:0, s:0 };
function strokeGlow(color, width, draw){
  ctx.strokeStyle = color; ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.globalAlpha = 0.20; ctx.lineWidth = width * 3.2; draw();
  ctx.globalAlpha = 1; ctx.lineWidth = width; draw();
}
function line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function drawSphere(cx, cy, r, rollA, spinA, leanA){
  if(r < 2) return;
  var k, a, j;
  ctx.lineWidth = Math.max(1.2, r * 0.055);
  ctx.strokeStyle = "rgba(103,232,255,0.28)";
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.05, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "#dffcff";
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  var cosL = Math.cos(leanA), sinL = Math.sin(leanA);
  var cosR = Math.cos(rollA), sinR = Math.sin(rollA);
  function plot(x3, y3, z3){
    var y = y3 * cosR - z3 * sinR, z = y3 * sinR + z3 * cosR;
    var sx = cx + (x3 * cosL - y * sinL) * r, sy = cy + (x3 * sinL + y * cosL) * r;
    return [sx, sy];
  }
  ctx.strokeStyle = "#9be9ff";
  ctx.lineWidth = Math.max(1, r * 0.04);
  for(k = 0; k < 3; k++){
    var beta = spinA + k * Math.PI / 3, sb = Math.sin(beta), cb = Math.cos(beta);
    ctx.beginPath();
    for(j = 0; j <= 26; j++){
      var th = j / 26 * Math.PI * 2;
      var pt = plot(Math.sin(th) * sb, Math.cos(th), Math.sin(th) * cb);
      if(j === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
    }
    ctx.stroke();
  }
  ctx.beginPath(); // equator
  for(j = 0; j <= 30; j++){
    var th2 = j / 30 * Math.PI * 2;
    var pt2 = plot(Math.cos(th2), 0, Math.sin(th2));
    if(j === 0) ctx.moveTo(pt2[0], pt2[1]); else ctx.lineTo(pt2[0], pt2[1]);
  }
  ctx.stroke();
}
function drawBlock(seg, blk, camX, camZ){
  var halfW = TRACK_HALF * seg.wf;
  var cxw = seg.cx + blk.x * halfW;
  var x0 = cxw - blk.hw * halfW, x1 = cxw + blk.hw * halfW;
  var z0 = seg.z, z1 = seg.z + SEG_LEN, BH = 540;
  var c = [
    project(x0, 0, z0, camX, camZ, { x:0, y:0, s:0 }), project(x1, 0, z0, camX, camZ, { x:0, y:0, s:0 }),
    project(x1, 0, z1, camX, camZ, { x:0, y:0, s:0 }), project(x0, 0, z1, camX, camZ, { x:0, y:0, s:0 }),
    project(x0, BH, z0, camX, camZ, { x:0, y:0, s:0 }), project(x1, BH, z0, camX, camZ, { x:0, y:0, s:0 }),
    project(x1, BH, z1, camX, camZ, { x:0, y:0, s:0 }), project(x0, BH, z1, camX, camZ, { x:0, y:0, s:0 })
  ];
  if(c[0].s * (W / 2) < 0.4) return; // too far to matter
  var E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  ctx.fillStyle = "rgba(255,49,49,0.07)";
  ctx.beginPath();
  ctx.moveTo(c[0].x, c[0].y); ctx.lineTo(c[1].x, c[1].y); ctx.lineTo(c[5].x, c[5].y); ctx.lineTo(c[4].x, c[4].y); ctx.closePath(); ctx.fill();
  strokeGlow("#ff3131", Math.max(1.1, c[0].s * W * 0.004), function(){
    for(var i = 0; i < E.length; i++) line(c[E[i][0]].x, c[E[i][0]].y, c[E[i][1]].x, c[E[i][1]].y);
  });
}
function render(){
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  // stars (drift slightly with curve for life)
  var pSegT = segments.length ? segAt(position + PLAYER_Z) : null;
  var drift = pSegT ? pSegT.cx * 0.004 : 0;
  for(var i = 0; i < stars.length; i++){
    var st = stars[i];
    var tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(elapsed * 1.7 + st.p));
    ctx.fillStyle = "rgba(255,255,255," + (0.65 * tw).toFixed(3) + ")";
    var sxp = ((st.x - drift % 1) + 1) % 1 * W;
    ctx.fillRect(sxp, st.y * H, st.s, st.s);
  }
  if(!segments.length) return;
  var bz = position + PLAYER_Z;
  var pSeg = segAt(bz), nSeg = segAfter(pSeg);
  var pct = ((bz % SEG_LEN) + SEG_LEN) % SEG_LEN / SEG_LEN;
  var camCX = pSeg.cx + (nSeg.cx - pSeg.cx) * pct;
  var camWF = pSeg.wf + (nSeg.wf - pSeg.wf) * pct;
  var camX = camCX + ballX * TRACK_HALF * camWF;
  var camZ = position;
  var baseIdx = Math.floor(position / SEG_LEN) - segments[0].i;
  // project segments far -> near
  var n, seg, halfW;
  var leftPts = [], rightPts = [], railLPts = [], railRPts = [], ties = [];
  for(n = DRAW_SEGS - 1; n >= 0; n--){
    seg = segments[Math.min(baseIdx + n, segments.length - 1)];
    halfW = TRACK_HALF * seg.wf;
    var q1 = project(seg.cx - halfW, 0, seg.z, camX, camZ, { x:0, y:0, s:0 });
    var q2 = project(seg.cx + halfW, 0, seg.z, camX, camZ, { x:0, y:0, s:0 });
    var r1 = project(seg.cx - halfW - 170, 0, seg.z, camX, camZ, { x:0, y:0, s:0 });
    var r2 = project(seg.cx + halfW + 170, 0, seg.z, camX, camZ, { x:0, y:0, s:0 });
    leftPts[n] = q1; rightPts[n] = q2; railLPts[n] = r1; railRPts[n] = r2;
    ties[n] = { a: q1, b: q2 };
  }
  function poly(pts){
    ctx.beginPath();
    for(var j = DRAW_SEGS - 1; j >= 0; j--){ if(j === DRAW_SEGS - 1) ctx.moveTo(pts[j].x, pts[j].y); else ctx.lineTo(pts[j].x, pts[j].y); }
    for(var j2 = 0; j2 < DRAW_SEGS; j2++){ /* joins handled by single path */ }
    ctx.stroke();
  }
  // cross ties (alpha fades to the horizon)
  ctx.strokeStyle = "#3dff6e"; ctx.lineWidth = 1.2;
  for(n = DRAW_SEGS - 1; n >= 0; n -= 1){
    ctx.globalAlpha = Math.max(0.05, 1 - n / DRAW_SEGS) * 0.75;
    line(ties[n].a.x, ties[n].a.y, ties[n].b.x, ties[n].b.y);
  }
  ctx.globalAlpha = 1;
  // edges + rails with glow
  strokeGlow("#3dff6e", 2.2, function(){ poly(leftPts); });
  strokeGlow("#3dff6e", 2.2, function(){ poly(rightPts); });
  strokeGlow("#ff3131", 1.8, function(){ poly(railLPts); });
  strokeGlow("#ff3131", 1.8, function(){ poly(railRPts); });
  // blocks far -> near
  for(n = DRAW_SEGS - 1; n >= 0; n--){
    seg = segments[Math.min(baseIdx + n, segments.length - 1)];
    for(var b = 0; b < seg.blocks.length; b++) drawBlock(seg, seg.blocks[b], camX, camZ);
  }
  // the ball
  var bp = project(camCX + ballX * TRACK_HALF * camWF, 0, bz, camX, camZ, { x:0, y:0, s:0 });
  ballSR = bp.s * BALL_R * (W / 2);
  ballSX = bp.x; ballSY = bp.y - ballSR;
  if(state === "crash" && crashKind === "block"){
    ctx.strokeStyle = "#dffcff"; ctx.lineWidth = 2.2;
    for(var si2 = 0; si2 < shards.length; si2++){
      var sh = shards[si2];
      ctx.globalAlpha = Math.max(0, 1 - crashT / 1.05);
      line(sh.x, sh.y, sh.x + Math.cos(sh.rot) * sh.len, sh.y + Math.sin(sh.rot) * sh.len);
    }
    ctx.globalAlpha = 1;
  } else if(state === "crash" && crashKind === "fall"){
    var dropPx = ballDrop * ballDrop * H * 0.55;
    drawSphere(ballSX, ballSY + dropPx, ballSR * Math.max(0.25, 1 - ballDrop * 0.55), roll, spin, lean);
  } else {
    drawSphere(ballSX, ballSY, ballSR, roll, spin, lean * 0.6);
  }
  if(state === "playing") $("dist").innerHTML = Math.floor(distance) + "<small> m</small>";
}

/* ============================== LOOP / RESIZE ============================== */
var lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt = Math.min(0.033, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  if(state !== "paused"){ update(dt); render(); }
}
function resize(){
  var wrap = $("stageWrap"), cw = wrap.clientWidth, ch = wrap.clientHeight;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  W = cw; H = ch; horizonY = Math.round(ch * 0.40);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

/* ============================== UI WIRING ============================== */
function closeAll(){
  document.querySelectorAll(".overlay").forEach(function(o){ o.classList.remove("open"); o.classList.remove("big"); });
}
document.querySelectorAll("[data-close]").forEach(function(b){
  b.addEventListener("click", function(){ b.closest(".overlay").classList.remove("open"); });
});
$("togQR").addEventListener("click", function(){ $("qrOverlay").classList.add("open"); });
$("qrImg").addEventListener("click", function(){ $("qrOverlay").classList.toggle("big"); });
$("togLang").addEventListener("click", function(){ lang = lang === "en" ? "es" : "en"; store("vd_lang", lang); applyLang(); });
$("togSound").addEventListener("click", function(){ soundOn = !soundOn; store("vd_sound", soundOn ? "on" : "off"); applyLang(); if(soundOn){ audio(); beep(880, 0.08, "square", 0.09); } });
$("togHelp").addEventListener("click", function(){ $("helpOverlay").classList.add("open"); });
$("togControls").addEventListener("click", function(){ $("controlsOverlay").classList.add("open"); });
$("startBtn").addEventListener("click", function(){ audio(); startRun(); });
$("againBtn").addEventListener("click", function(){ startRun(); });
$("titleBtn").addEventListener("click", function(){ quitToTitle(); });
$("resumeBtn").addEventListener("click", function(){ resumeGame(); });
$("quitBtn").addEventListener("click", function(){ quitToTitle(); });
$("pauseBtn").addEventListener("click", function(){ if(state === "playing") pauseGame(); });

/* debug handle for headless verification */
window.VD = {
  state: function(){ return state; },
  dist: function(){ return Math.floor(distance); },
  ballX: function(){ return ballX; },
  speed: function(){ return mps; },
  best: function(){ return best; }
};

drawHero();
applyLang();
resetWorld(true);
resize();
requestAnimationFrame(resize);
requestAnimationFrame(frame);
</script>
</body>
